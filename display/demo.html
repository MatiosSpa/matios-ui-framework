<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS Display — Demo</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../base/matios-ui-base.css">
  <link rel="stylesheet" href="../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../themes/matios-ui-mode-high-contrast.css">
  
  <link rel="stylesheet" href="../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../navigation/matios-ui-accordion/matios-ui-accordion.css">

</head>
<body>
  <div class="demo-page demo-page--launcher">
    <div class="demo-header">
      <h1>MTS <span>Display</span></h1>
      <p>Componentes visuales para presentar contenido, métricas, listas, galerías y estados.</p>
    </div>

    <div id="display-launcher" class="demo-launcher"></div>
  </div>

  <script>
    initGroupLauncher('#display-launcher', [
      { id: 'avatar', component: 'avatar', title: 'MTS.Avatar', subtitle: 'Avatar individual, grupo, estado y tamaños', src: 'matios-ui-avatar/demo.html' },
      { id: 'kpicard', component: 'kpicard', title: 'MTS.KPICard', subtitle: 'Tarjetas KPI con métricas, tendencia y sparkline', src: 'matios-ui-kpicard/demo.html' },
      { id: 'emptystate', component: 'emptystate', title: 'MTS.EmptyState', subtitle: 'Estados vacíos con icono, mensaje y acciones', src: 'matios-ui-emptystate/demo.html' },
      { id: 'timeline', component: 'timeline', title: 'MTS.Timeline', subtitle: 'Línea de tiempo vertical y horizontal con eventos', src: 'matios-ui-timeline/demo.html' },
      { id: 'kanban', component: 'kanban', title: 'MTS.Kanban', subtitle: 'Tablero de columnas con tarjetas y contadores', src: 'matios-ui-kanban/demo.html' },
      { id: 'sortablelist', component: 'sortablelist', title: 'MTS.SortableList', subtitle: 'Lista ordenable con arrastre, prioridad y meta', src: 'matios-ui-sortablelist/demo.html' },
      { id: 'countdown', component: 'countdown', title: 'MTS.Countdown', subtitle: 'Cuenta regresiva con variantes de bloques e inline', src: 'matios-ui-countdown/demo.html' },
      { id: 'ratingreview', component: 'ratingreview', title: 'MTS.RatingReview', subtitle: 'Sistema de reseñas con promedio, breakdown y votación interactiva', src: 'matios-ui-ratingreview/demo.html' },
      { id: 'tree', component: 'tree', title: 'MTS.Tree', subtitle: 'Árbol colapsable con selección, checkboxes e íconos', src: 'matios-ui-tree/demo.html' },
      { id: 'imagegallery', component: 'imagegallery', title: 'MTS.ImageGallery', subtitle: 'Grid de imágenes con filtros, selección y lightbox integrado', src: 'matios-ui-imagegallery/demo.html' },
      { id: 'virtuallist', component: 'virtuallist', title: 'MTS.VirtualList', subtitle: 'Lista virtualizada para miles de ítems — rendimiento constante', src: 'matios-ui-virtuallist/demo.html' },
      { id: 'card', component: 'card', title: 'MTS.Card', subtitle: 'Card genérica — header · body · footer · imagen · variantes · hover · clickable', src: 'matios-ui-card/demo.html' }
    ]);
  </script>
