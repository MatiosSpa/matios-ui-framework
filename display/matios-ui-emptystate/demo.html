<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EmptyState — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <div class="demo-section"><div class="demo-section-title">3 — API update()</div><div id="tabs-s3"></div></div>
</div>
<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' + esc(indentHtml(previewHtml)) + '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' + esc(code) + '</pre>';
}


function cb(label) {
  return function() {
    var box = document.getElementById('es-result');
    if (box) box.textContent = 'click → ' + label;
  };
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });
  if (typeof initFn === 'function') initFn();
}
var preview_s1 = "<div class=\"demo-grid\"><div id=\"es-nodata\"></div><div id=\"es-search\"></div><div id=\"es-error\"></div><div id=\"es-perms\"></div></div>";
var js_s1 = "new MTS.EmptyState('#es-nodata', { variant:'no-data', action:'Agregar \u00edtem' });\nnew MTS.EmptyState('#es-search', { variant:'search', title:'Sin resultados para \"dashboard\"', description:'Prueba con otras palabras.', action:'Limpiar b\u00fasqueda' });\nnew MTS.EmptyState('#es-error', { variant:'error', action:'Reintentar' });\nnew MTS.EmptyState('#es-perms', { variant:'permissions', description:'Contacta al administrador.' });";
var preview_s2 = "<div class=\"demo-grid\"><div id=\"es-sm\"></div><div id=\"es-md\"></div><div id=\"es-lg\"></div></div>";
var js_s2 = "['sm','md','lg'].forEach(function(size) { new MTS.EmptyState('#es-' + size, { variant:'no-data', size:size, action:'Add item' }); });";
var preview_s3 = "<div class=\"demo-stack\"><div id=\"es-dynamic\"></div><div class=\"demo-row\"><button class=\"demo-btn-sm\" onclick=\"esDynamic.update({ variant:'search', title:'Sin resultados', description:'Ajusta los filtros', action:'Limpiar' })\">search</button><button class=\"demo-btn-sm\" onclick=\"esDynamic.update({ variant:'error', action:'Reintentar' })\">error</button><button class=\"demo-btn-sm\" onclick=\"esDynamic.update({ variant:'no-data', action:'Agregar' })\">restore</button></div><div class=\"result-box\" id=\"es-result\">\u2014 usa los botones \u2014</div></div>";
var js_s3 = "var esDynamic = new MTS.EmptyState('#es-dynamic', { variant:'no-data', action:'Agregar', onAction:function(){ document.getElementById('es-result').textContent='click \u2192 Agregar'; } });\nesDynamic.update({ variant:'search', title:'Sin resultados', description:'Ajusta los filtros', action:'Limpiar' });";
var esDynamic;
makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.EmptyState('#es-nodata', { variant:'no-data', action:'Agregar ítem', onAction:cb('Agregar ítem') });
  new MTS.EmptyState('#es-search', { variant:'search', title:'Sin resultados para "dashboard"', description:'Prueba con otras palabras.', action:'Limpiar búsqueda', onAction:cb('Limpiar búsqueda') });
  new MTS.EmptyState('#es-error', { variant:'error', action:'Reintentar', onAction:cb('Reintentar') });
  new MTS.EmptyState('#es-perms', { variant:'permissions', description:'Contacta al administrador.' });
}, '360px');
makeSection('tabs-s2', preview_s2, js_s2, function() { ['sm','md','lg'].forEach(function(size) { new MTS.EmptyState('#es-' + size, { variant:'no-data', size:size, action:'Add item' }); }); }, '340px');
makeSection('tabs-s3', preview_s3, js_s3, function() { esDynamic = new MTS.EmptyState('#es-dynamic', { variant:'no-data', action:'Agregar', onAction:function(){ document.getElementById('es-result').textContent='click → Agregar'; } }); }, '340px');

</script>
</body>
</html>
