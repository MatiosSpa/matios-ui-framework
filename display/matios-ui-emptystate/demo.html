<script>
function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.EmptyState'].demo) || {};

var T = {
  subtitle:          D.subtitle          || 'EmptyState demo updated to the Preview | HTML | JavaScript pattern.',
  s1Title:           D.s1Title           || '1 — Variants',
  s2Title:           D.s2Title           || '2 — Sizes',
  s3Title:           D.s3Title           || '3 — update() API',
  actionAddItem:     D.actionAddItem     || 'Add item',
  searchTitle:       D.searchTitle       || 'No results for "dashboard"',
  searchDescription: D.searchDescription || 'Try different keywords.',
  actionClearSearch: D.actionClearSearch || 'Clear search',
  actionRetry:       D.actionRetry       || 'Retry',
  permsDescription:  D.permsDescription  || 'Contact your administrator.',
  actionAddItemEn:   D.actionAddItemEn   || 'Add item',
  dynNoResults:      D.dynNoResults      || 'No results',
  dynAdjustFilters:  D.dynAdjustFilters  || 'Adjust the filters',
  actionClear:       D.actionClear       || 'Clear',
  actionAdd:         D.actionAdd         || 'Add',
  resultPlaceholder: D.resultPlaceholder || '— use the buttons —',
  clickPrefix:       D.clickPrefix       || 'click → '
};

document.getElementById('demo-subtitle').textContent = T.subtitle;
document.getElementById('s1-title').textContent      = T.s1Title;
document.getElementById('s2-title').textContent      = T.s2Title;
document.getElementById('s3-title').textContent      = T.s3Title;

function cb(label) {
  return function() {
    var box = document.getElementById('es-result');
    if (box) box.textContent = T.clickPrefix + label;
  };
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}
var preview_s1 = "<div class=\"demo-grid\"><div id=\"es-nodata\"></div><div id=\"es-search\"></div><div id=\"es-error\"></div><div id=\"es-perms\"></div></div>";
var js_s1 = "new MTS.EmptyState('#es-nodata', { variant:'no-data', action:'Add item' });\nnew MTS.EmptyState('#es-search', { variant:'search', title:'No results for \"dashboard\"', description:'Try different keywords.', action:'Clear search' });\nnew MTS.EmptyState('#es-error', { variant:'error', action:'Retry' });\nnew MTS.EmptyState('#es-perms', { variant:'permissions', description:'Contact your administrator.' });";
var preview_s2 = "<div class=\"demo-grid\"><div id=\"es-sm\"></div><div id=\"es-md\"></div><div id=\"es-lg\"></div></div>";
var js_s2 = "['sm','md','lg'].forEach(function(size) { new MTS.EmptyState('#es-' + size, { variant:'no-data', size:size, action:'Add item' }); });";
var preview_s3 = "<div class=\"demo-stack\"><div id=\"es-dynamic\"></div><div class=\"demo-row\"><button class=\"demo-btn-sm\" onclick=\"esDynamic.update({ variant:'search', title:T.dynNoResults, description:T.dynAdjustFilters, action:T.actionClear })\">search</button><button class=\"demo-btn-sm\" onclick=\"esDynamic.update({ variant:'error', action:T.actionRetry })\">error</button><button class=\"demo-btn-sm\" onclick=\"esDynamic.update({ variant:'no-data', action:T.actionAdd })\">restore</button></div><div class=\"result-box\" id=\"es-result\">" + T.resultPlaceholder + "</div></div>";
var js_s3 = "var esDynamic = new MTS.EmptyState('#es-dynamic', { variant:'no-data', action:'Add', onAction:function(){ document.getElementById('es-result').textContent='click \u2192 Add'; } });\nesDynamic.update({ variant:'search', title:'No results', description:'Adjust the filters', action:'Clear' });";
var esDynamic;
makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.EmptyState('#es-nodata', { variant:'no-data', action:T.actionAddItem, onAction:cb(T.actionAddItem) });
  new MTS.EmptyState('#es-search', { variant:'search', title:T.searchTitle, description:T.searchDescription, action:T.actionClearSearch, onAction:cb(T.actionClearSearch) });
  new MTS.EmptyState('#es-error', { variant:'error', action:T.actionRetry, onAction:cb(T.actionRetry) });
  new MTS.EmptyState('#es-perms', { variant:'permissions', description:T.permsDescription });
}, '360px');
makeSection('tabs-s2', preview_s2, js_s2, function() { ['sm','md','lg'].forEach(function(size) { new MTS.EmptyState('#es-' + size, { variant:'no-data', size:size, action:T.actionAddItemEn }); }); }, '340px');
makeSection('tabs-s3', preview_s3, js_s3, function() { esDynamic = new MTS.EmptyState('#es-dynamic', { variant:'no-data', action:T.actionAdd, onAction:function(){ document.getElementById('es-result').textContent=T.clickPrefix + T.actionAdd; } }); }, '340px');

</script>
