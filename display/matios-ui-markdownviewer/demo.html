  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

<script>

function indentHtml(html) {
  var indent = 0, step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  (html.match(/<[^>]+>|[^<]+/g) || []).forEach(function (tok) {
    var t = tok.trim(); if (!t) return;
    if (/^<\//.test(t)) { indent = Math.max(0, indent - step); result += ' '.repeat(indent) + t + '\n'; }
    else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else { var text = t.replace(/\s+/g, ' '); if (text) result += ' '.repeat(indent) + text + '\n'; }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card', height: height || '420px', lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode,                  language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.MarkdownViewer'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Renders remote .md files using the framework prose style. Fetch + parse + render in one line.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Basic — remote URL';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Runtime URL change';

/* ── 1 — Básico ─────────────────────────────────────────── */

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="s1-mdv" style="padding:16px;border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);background:var(--mts-bg-surface)"></div>' +
  '</div>';

var js_s1 =
  "new MTS.MarkdownViewer('#s1-mdv', {\n" +
  "  url: '../../display/matios-ui-markdownviewer/matios-ui-markdownviewer.md'\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function () {
  new MTS.MarkdownViewer('#s1-mdv', {
    url: '../../display/matios-ui-markdownviewer/matios-ui-markdownviewer.md'
  });
}, '520px');

/* ── 2 — Cambio de URL en runtime ───────────────────────── */

var preview_s2 =
  '<div class="demo-stack">' +
    '<div style="display:flex;gap:8px;margin-bottom:12px">' +
      '<button id="s2-btn-a" class="mts-btn mts-btn--primary mts-btn--sm">' + (D.btnA || 'Component A') + '</button>' +
      '<button id="s2-btn-b" class="mts-btn mts-btn--outline mts-btn--sm">' + (D.btnB || 'Component B') + '</button>' +
    '</div>' +
    '<div id="s2-mdv" style="padding:16px;border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);background:var(--mts-bg-surface)"></div>' +
  '</div>';

var js_s2 =
  "var viewer = new MTS.MarkdownViewer('#s2-mdv', {\n" +
  "  url: '../../navigation/matios-ui-accordion/matios-ui-accordion.md'\n" +
  "});\n\n" +
  "document.getElementById('s2-btn-a').addEventListener('click', function () {\n" +
  "  viewer.load('../../navigation/matios-ui-accordion/matios-ui-accordion.md');\n" +
  "});\n\n" +
  "document.getElementById('s2-btn-b').addEventListener('click', function () {\n" +
  "  viewer.load('../../forms/matios-ui-input/matios-ui-input.md');\n" +
  "});";

makeSection('tabs-s2', preview_s2, js_s2, function () {
  var viewer2 = new MTS.MarkdownViewer('#s2-mdv', {
    url: '../../navigation/matios-ui-accordion/matios-ui-accordion.md'
  });

  document.getElementById('s2-btn-a').addEventListener('click', function () {
    document.getElementById('s2-btn-a').className = 'mts-btn mts-btn--primary mts-btn--sm';
    document.getElementById('s2-btn-b').className = 'mts-btn mts-btn--outline mts-btn--sm';
    viewer2.load('../../navigation/matios-ui-accordion/matios-ui-accordion.md');
  });

  document.getElementById('s2-btn-b').addEventListener('click', function () {
    document.getElementById('s2-btn-a').className = 'mts-btn mts-btn--outline mts-btn--sm';
    document.getElementById('s2-btn-b').className = 'mts-btn mts-btn--primary mts-btn--sm';
    viewer2.load('../../forms/matios-ui-input/matios-ui-input.md');
  });
}, '560px');

</script>
