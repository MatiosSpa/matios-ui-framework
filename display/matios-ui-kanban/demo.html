<script>
function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}
var preview_s1 = "<div class=\"demo-stack\"><div id=\"kanban-board\"></div><div class=\"result-box\" id=\"kanban-result\">\u2014 arrastra una tarjeta o haz click \u2014</div></div>";
var js_s1 = "new MTS.Kanban('#kanban-board', { addCards:true, columns:[{ id:'backlog', title:'Backlog', cards:[{ id:'c1', title:'Set up CI/CD pipeline', priority:'critical', tags:['devops'] },{ id:'c2', title:'Design system tokens', priority:'high', tags:['design'] }] },{ id:'in-progress', title:'In Progress', wip:3, cards:[{ id:'c3', title:'API authentication', priority:'high', tags:['backend'] }] },{ id:'done', title:'Done', color:'#16a34a', cards:[{ id:'c4', title:'Database schema', priority:'low', tags:['backend'] }] }], onMove:function(e){ console.log(e.detail.card.id); }, onCardClick:function(e){ console.log(e.detail.card.title); } });";
var preview_s2 = "<div class=\"demo-stack\"><div id=\"kanban-api\"></div><div class=\"demo-row\"><button class=\"demo-btn-sm\" onclick=\"addToBacklog()\">addCard()</button><button class=\"demo-btn-sm\" onclick=\"kb2.moveCard('api-1','done')\">moveCard()</button><button class=\"demo-btn-sm\" onclick=\"kb2.removeCard('api-1')\">removeCard()</button></div><div class=\"result-box\" id=\"kanban-api-result\">\u2014 usa los botones \u2014</div></div>";
var js_s2 = "var kb2 = new MTS.Kanban('#kanban-api', { columns:[{ id:'backlog', title:'Backlog', cards:[{ id:'api-1', title:'Task from API', priority:'high' }] },{ id:'done', title:'Done', cards:[] }] });\nkb2.addCard('backlog', { id:'new-task', title:'New task', priority:'medium' });\nkb2.moveCard('api-1', 'done');\nkb2.removeCard('api-1');";
var kb2;
function addToBacklog() {
  var id = 'task-' + Math.floor(Math.random() * 1000);
  kb2.addCard('backlog', { id:id, title:'Nueva tarea ' + id, priority:'medium' });
  document.getElementById('kanban-api-result').textContent = 'addCard → ' + id;
}
makeSection('tabs-s1', preview_s1, js_s1, function() { new MTS.Kanban('#kanban-board', { addCards:true, columns:[{ id:'backlog', title:'Backlog', cards:[{ id:'c1', title:'Set up CI/CD pipeline', priority:'critical', tags:['devops'] },{ id:'c2', title:'Design system tokens', priority:'high', tags:['design'] }] },{ id:'in-progress', title:'In Progress', wip:3, cards:[{ id:'c3', title:'API authentication', priority:'high', tags:['backend'] }] },{ id:'done', title:'Done', color:'#16a34a', cards:[{ id:'c4', title:'Database schema', priority:'low', tags:['backend'] }] }], onMove:function(e){ document.getElementById('kanban-result').textContent = 'move → ' + e.detail.card.title + ' → ' + e.detail.toColId; }, onCardClick:function(e){ document.getElementById('kanban-result').textContent = 'click → ' + e.detail.card.title; } }); }, '420px');
makeSection('tabs-s2', preview_s2, js_s2, function() { kb2 = new MTS.Kanban('#kanban-api', { columns:[{ id:'backlog', title:'Backlog', cards:[{ id:'api-1', title:'Task from API', priority:'high' }] },{ id:'done', title:'Done', cards:[] }] }); }, '400px');

</script>
