<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.VirtualList — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    .vl-row {
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px; height: 100%;
      border-bottom: 1px solid var(--mts-border-color);
      font-size: 13px;
    }
    .vl-row:hover { background: var(--mts-surface-2, var(--mts-bg-surface-2)); }
    .vl-idx { width: 48px; font-size: 11px; color: var(--mts-text-muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .vl-name { flex: 1; font-weight: 500; }
    .vl-meta { font-size: 11px; color: var(--mts-text-muted); }
    .vl-badge { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; flex-shrink: 0; }
    .vl-badge--active   { background: rgba(22,163,74,.15);  color: #16a34a; }
    .vl-badge--inactive { background: rgba(107,114,128,.12); color: #6b7280; }

<body>
<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.VirtualList</h1>
    <p>Virtualized list — renders only visible items · 100,000+ rows · infinite scroll via onEndReached.</p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section">
    <div class="demo-section-title">1 — 100.000 ítems virtualizados / 100,000 virtualized items</div>
    <div id="vl1-tabs"></div>
  </div>

  <div class="demo-section">
    <div class="demo-section-title">2 — appendItems() — Infinite scroll simulado / Simulated infinite scroll</div>
    <div id="vl2-tabs"></div>
  </div>
</div>
<script>
function indentHtml(html) {
  var indent = 0;
  var step   = 2;
  var voids  = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function makeItems(count, offset) {
  offset = offset || 0;
  return Array.from({ length: count }, function(_, i) {
    var n = offset + i;
    return { id:n, name:'Usuario #'+(n+1), email:'user'+n+'@empresa.com', active: n % 3 !== 0 };
  });
}

var BIG_ITEMS = makeItems(100000);
var vl1;
var infPage = 1;
var vlInf;
function getPage(p){ return makeItems(20, (p-1)*20); }

var preview_vl1 = '' +
  '<div class="demo-row" style="margin-bottom:8px;flex-wrap:wrap">' +
    '<button class="demo-btn-sm" onclick="vl1.scrollToIndex(0)">scrollToIndex(0)</button>' +
    '<button class="demo-btn-sm" onclick="vl1.scrollToIndex(49999)">scrollToIndex(50000)</button>' +
    '<button class="demo-btn-sm" onclick="vl1.scrollToIndex(99999)">scrollToIndex(100000)</button>' +
  '</div>' +
  '<div id="vl-big"></div>' +
  '<div class="result-box" id="vl-result">— haz scroll en la lista —</div>';

var js_vl1 = `const list = new MTS.VirtualList('#my-list', {
  items: Array.from({ length: 100000 }, (_, i) => ({
    id: i,
    name: \`User #\${i + 1}\`,
    email: \`user\${i}@example.com\`,
    active: i % 3 !== 0,
  })),
  itemHeight: 52,
  height: 400,
  renderItem: (item, index) => {
    const el = document.createElement('div');
    el.className = 'vl-row';
    el.innerHTML = \`
      <span class="vl-idx">#\${index + 1}</span>
      <span class="vl-name">\${item.name}</span>
      <span class="vl-meta">\${item.email}</span>
      <span class="vl-badge \${item.active ? 'vl-badge--active' : 'vl-badge--inactive'}">
        \${item.active ? 'Active' : 'Inactive'}
      </span>\`;
    return el;
  },
  onScroll: (e) => {
    console.log('visible:', e.detail.firstVisible, '-', e.detail.lastVisible);
  },
});

list.scrollToIndex(50000);`;

var preview_vl2 = '' +
  '<div id="vl-infinite"></div>' +
  '<div class="result-box" id="vl-inf-result">— haz scroll hasta el final para cargar más —</div>';

var js_vl2 = `function fetchPage(page) {
  return Array.from({ length: 20 }, (_, i) => ({
    id: page * 20 + i,
    title: \`Post #\${page * 20 + i + 1}\`,
    date: \`Dec \${(i % 28) + 1}, 2024\`,
  }));
}

let page = 1;
const list = new MTS.VirtualList('#my-list', {
  items: fetchPage(page++),
  itemHeight: 56,
  height: 400,
  endThreshold: 150,
  renderItem: (item, index) => {
    const el = document.createElement('div');
    el.className = 'vl-row';
    el.innerHTML = \`
      <span class="vl-idx">#\${index + 1}</span>
      <span class="vl-name">\${item.title}</span>
      <span class="vl-meta">\${item.date}</span>\`;
    return el;
  },
  onEndReached: (e) => {
    console.log('loading page', page, '(', e.detail.total, 'items so far)');
    const more = fetchPage(page++);
    list.appendItems(more);
  },
});`;

makeSection('vl1-tabs', preview_vl1, js_vl1, null, '560px');
makeSection('vl2-tabs', preview_vl2, js_vl2, null, '500px');

vl1 = new MTS.VirtualList('#vl-big', {
  items: BIG_ITEMS,
  itemHeight: 52,
  height: 380,
  renderItem: function(item, idx){
    var el = document.createElement('div');
    el.className = 'vl-row';
    el.innerHTML = '<span class="vl-idx">#'+(idx+1)+'</span><span class="vl-name">'+item.name+'</span><span class="vl-meta">'+item.email+'</span><span class="vl-badge '+(item.active?'vl-badge--active':'vl-badge--inactive')+'">'+(item.active?'Active':'Inactive')+'</span>';
    return el;
  },
  onScroll: function(e){ document.getElementById('vl-result').textContent = 'onScroll → firstVisible:'+e.detail.firstVisible+' lastVisible:'+e.detail.lastVisible; },
});

vlInf = new MTS.VirtualList('#vl-infinite', {
  items: getPage(infPage++),
  itemHeight: 52,
  height: 320,
  endThreshold: 100,
  renderItem: function(item, idx){
    var el = document.createElement('div');
    el.className = 'vl-row';
    el.innerHTML = '<span class="vl-idx">#'+(idx+1)+'</span><span class="vl-name">Post #'+item.id+'</span><span class="vl-meta">'+item.email+'</span>';
    return el;
  },
  onEndReached: function(e){
    var more = getPage(infPage++);
    vlInf.appendItems(more);
    document.getElementById('vl-inf-result').textContent = 'appendItems() → total: '+(e.detail.total + more.length)+' ítems';
  }
});
</script>
</body>
</html>
