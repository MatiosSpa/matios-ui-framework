<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<body>
<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Countdown</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>

  <div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-cd1"></div></div>

  <div class="demo-section"><div class="demo-section-title" id="s3-title"></div><div id="tabs-cd3"></div></div>
</div>
<script>
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var out='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0, indent-step); out += ' '.repeat(indent) + t + '\n'; }
    else if(/^<[^!]/.test(t)){ out += ' '.repeat(indent) + t + '\n'; var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||''; if(!voids.test(tag) && !/\/>$/.test(t)) indent += step; }
    else { var text=t.replace(/\s+/g,' '); if(text) out += ' '.repeat(indent) + text + '\n'; }
  });
  return out.trimEnd();
}
function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Countdown'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Animated countdown timer — blocks, compact, minimal, and imperative API.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Variant: blocks (default)';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Compact and minimal';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — API — pause · resume · setTarget';

makeSection('tabs-cd1',
  '<div id="cd-blocks"></div>',
`new MTS.Countdown('#cd-blocks', {
  target: new Date(Date.now() + 2 * 24 * 60 * 60 * 1000),
  variant: 'blocks',
  onTick: (e) => {
    console.log(e.detail.days, e.detail.hours, e.detail.mins, e.detail.secs);
  },
  onComplete: () => console.log('Done!')
});`);
new MTS.Countdown('#cd-blocks', { target:new Date(Date.now()+2*24*60*60*1000), variant:'blocks' });

makeSection('tabs-cd2',
  '<div><div id="cd-compact"></div><div style="height:16px"></div><div id="cd-minimal"></div></div>',
`new MTS.Countdown('#cd-compact', {
  target: new Date(Date.now() + 3600000),
  variant: 'compact',
  labels: { days:'d', hours:'h', mins:'m', secs:'s' }
});

new MTS.Countdown('#cd-minimal', {
  target: new Date(Date.now() + 3600000),
  variant: 'minimal',
  showDays: false,
  separator: ':'
});`);
new MTS.Countdown('#cd-compact', { target:new Date(Date.now()+2*24*60*60*1000), variant:'compact', labels:{days:'d',hours:'h',mins:'m',secs:'s'} });
new MTS.Countdown('#cd-minimal', { target:new Date(Date.now()+2*24*60*60*1000), variant:'minimal', showDays:false, separator:':' });

makeSection('tabs-cd3',
  '<div><div id="cd-api"></div><div class="demo-row" style="margin-top:12px;flex-wrap:wrap"><button class="demo-btn-sm" onclick="cdApi.pause()">pause()</button><button class="demo-btn-sm" onclick="cdApi.resume()">resume()</button><button class="demo-btn-sm" onclick="cdApi.setTarget(new Date(Date.now()+30000))">setTarget(+30s)</button><button class="demo-btn-sm" onclick="cdApi.setTarget(new Date(Date.now()+3600000))">setTarget(+1h)</button></div><div class="result-box" id="cd-result">' + (D.resultPlaceholder || '— use the buttons —') + '</div></div>',
`const cdApi = new MTS.Countdown('#cd-api', {
  target: new Date(Date.now() + 60000),
  variant: 'blocks',
  onTick: (e) => {
    console.log(e.detail.hours, e.detail.mins, e.detail.secs);
  },
  onComplete: () => console.log('Time is up!')
});

cdApi.pause();
cdApi.resume();
cdApi.setTarget(new Date(Date.now() + 3600000));`);
var cdApi = new MTS.Countdown('#cd-api', {
  target:new Date(Date.now()+60000),
  variant:'blocks',
  onTick:function(e){ document.getElementById('cd-result').textContent=(D.tickPrefix || 'onTick → ')+e.detail.hours+'h '+e.detail.mins+'m '+e.detail.secs+'s'; },
  onComplete:function(){ document.getElementById('cd-result').textContent=(D.completeText || 'onComplete → Time is up!'); }
});
</script>
