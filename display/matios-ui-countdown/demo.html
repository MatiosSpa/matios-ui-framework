<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Countdown — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-countdown.css">
  <script src="../../support/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-countdown.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>
<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Countdown</h1>
    <p>Animated countdown timer — blocks, compact, minimal, and imperative API.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-countdown.md')">Docs</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 — Variant: blocks (default)</div><div id="tabs-cd1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Compact y minimal</div><div id="tabs-cd2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — API — pause · resume · setTarget</div><div id="tabs-cd3"></div></div>
</div>
<script>
function esc(str){return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var out='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0, indent-step); out += ' '.repeat(indent) + t + '\n'; }
    else if(/^<[^!]/.test(t)){ out += ' '.repeat(indent) + t + '\n'; var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||''; if(!voids.test(tag) && !/\/>$/.test(t)) indent += step; }
    else { var text=t.replace(/\s+/g,' '); if(text) out += ' '.repeat(indent) + text + '\n'; }
  });
  return out.trimEnd();
}
function codeBlock(code){return '<pre class="demo-code" style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">'+esc(code)+'</pre>';}
function makeSection(id, previewHtml, jsCode){
  new MTS.Tabs('#'+id, {
    variant:'card',
    height:'350px',
    lazy:false,
    tabs:[
      { id:id+'-preview', label:'Preview', content:previewHtml },
      { id:id+'-html', label:'HTML', content:codeBlock(indentHtml(previewHtml)) },
      { id:id+'-js', label:'JavaScript', content:codeBlock(jsCode) }
    ]
  });
}

makeSection('tabs-cd1',
  '<div id="cd-blocks"></div>',
`new MTS.Countdown('#cd-blocks', {
  target: new Date(Date.now() + 2 * 24 * 60 * 60 * 1000),
  variant: 'blocks',
  onTick: (e) => {
    console.log(e.detail.days, e.detail.hours, e.detail.mins, e.detail.secs);
  },
  onComplete: () => console.log('Done!')
});`);
new MTS.Countdown('#cd-blocks', { target:new Date(Date.now()+2*24*60*60*1000), variant:'blocks' });

makeSection('tabs-cd2',
  '<div><div id="cd-compact"></div><div style="height:16px"></div><div id="cd-minimal"></div></div>',
`new MTS.Countdown('#cd-compact', {
  target: new Date(Date.now() + 3600000),
  variant: 'compact',
  labels: { days:'d', hours:'h', mins:'m', secs:'s' }
});

new MTS.Countdown('#cd-minimal', {
  target: new Date(Date.now() + 3600000),
  variant: 'minimal',
  showDays: false,
  separator: ':'
});`);
new MTS.Countdown('#cd-compact', { target:new Date(Date.now()+2*24*60*60*1000), variant:'compact', labels:{days:'d',hours:'h',mins:'m',secs:'s'} });
new MTS.Countdown('#cd-minimal', { target:new Date(Date.now()+2*24*60*60*1000), variant:'minimal', showDays:false, separator:':' });

makeSection('tabs-cd3',
  '<div><div id="cd-api"></div><div class="demo-row" style="margin-top:12px;flex-wrap:wrap"><button class="demo-btn-sm" onclick="cdApi.pause()">pause()</button><button class="demo-btn-sm" onclick="cdApi.resume()">resume()</button><button class="demo-btn-sm" onclick="cdApi.setTarget(new Date(Date.now()+30000))">setTarget(+30s)</button><button class="demo-btn-sm" onclick="cdApi.setTarget(new Date(Date.now()+3600000))">setTarget(+1h)</button></div><div class="result-box" id="cd-result">— usa los botones —</div></div>',
`const cdApi = new MTS.Countdown('#cd-api', {
  target: new Date(Date.now() + 60000),
  variant: 'blocks',
  onTick: (e) => {
    console.log(e.detail.hours, e.detail.mins, e.detail.secs);
  },
  onComplete: () => console.log('Time is up!')
});

cdApi.pause();
cdApi.resume();
cdApi.setTarget(new Date(Date.now() + 3600000));`);
var cdApi = new MTS.Countdown('#cd-api', {
  target:new Date(Date.now()+60000),
  variant:'blocks',
  onTick:function(e){ document.getElementById('cd-result').textContent='onTick → '+e.detail.hours+'h '+e.detail.mins+'m '+e.detail.secs+'s'; },
  onComplete:function(){ document.getElementById('cd-result').textContent='onComplete → ¡Tiempo agotado!'; }
});
</script>
</body>
</html>
