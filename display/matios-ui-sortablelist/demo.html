<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.SortableList — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="./matios-ui-sortablelist.css">

<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>
<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.SortableList</h1>
    <p>Drag-and-drop sortable list — numbered, move buttons, icons, badges and API controls.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-sortablelist.md')">Docs</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>
  <div class="demo-section"><div class="demo-section-title">1 — Workflow de aprobaciones</div><div id="tabs-sl1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Lista de prioridades — íconos y meta</div><div id="tabs-sl2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — Variantes</div><div id="tabs-sl3"></div></div>
  <div class="demo-section"><div class="demo-section-title">4 — API — addItem · removeItem · lock · unlock</div><div id="tabs-sl4"></div></div>
</div>
<script>
function esc(str){return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var out='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0, indent-step); out += ' '.repeat(indent) + t + '\n'; }
    else if(/^<[^!]/.test(t)){ out += ' '.repeat(indent) + t + '\n'; var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||''; if(!voids.test(tag) && !/\/>$/.test(t)) indent += step; }
    else { var text=t.replace(/\s+/g,' '); if(text) out += ' '.repeat(indent) + text + '\n'; }
  });
  return out.trimEnd();
}
function codeBlock(code){return '<pre class="demo-code" style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">'+esc(code)+'</pre>';}
function makeSection(id, previewHtml, jsCode){
  new MTS.Tabs('#'+id, {
    variant:'card',
    height:'380px',
    lazy:false,
    tabs:[
      { id:id+'-preview', label:'Preview', content:previewHtml },
      { id:id+'-html', label:'HTML', content:codeBlock(indentHtml(previewHtml)) },
      { id:id+'-js', label:'JavaScript', content:codeBlock(jsCode) }
    ]
  });
}

makeSection('tabs-sl1',

`new MTS.SortableList('#sl-workflow', {

  ],

new MTS.SortableList('#sl-workflow', {

makeSection('tabs-sl3',
  '<div><div id="sl-v1"></div><div style="height:12px"></div><div id="sl-v2"></div><div style="height:12px"></div><div id="sl-v3"></div></div>',
`new MTS.SortableList('#sl-v1', { variant: 'default', items: [...] });
new MTS.SortableList('#sl-v2', { variant: 'flush', items: [...] });
new MTS.SortableList('#sl-v3', { variant: 'compact', items: [...] });`);
['default','flush','compact'].forEach(function(variant, index){
  new MTS.SortableList('#sl-v'+(index+1), {
    variant: variant,
    items:[{id:'a',title:'Item Alpha'},{id:'b',title:'Item Beta'},{id:'c',title:'Item Gamma'}]
  });
});

makeSection('tabs-sl4',
  '<div><div id="sl-api"></div><div class="demo-row" style="margin-top:10px;flex-wrap:wrap"><button class="demo-btn-sm" onclick="slApi.addItem({id:\'n\'+Date.now(),title:\'New item #\'+ ++slCount})">addItem()</button><button class="demo-btn-sm" onclick="slApi.removeItem(\'sl-a1\')">removeItem(\'sl-a1\')</button><button class="demo-btn-sm" onclick="slApi.lock()">lock()</button><button class="demo-btn-sm" onclick="slApi.unlock()">unlock()</button></div><div class="result-box" id="sl-api-result">— usa los botones —</div></div>',
`const list = new MTS.SortableList('#sl-api', {
  numbered: true,
  items: [
    { id:'sl-a1', title:'Item Alpha' },
    { id:'sl-a2', title:'Item Beta' },
    { id:'sl-a3', title:'Item Gamma' }
  ]
});

list.addItem({ id:'new-item', title:'New item' });
list.removeItem('sl-a1');
list.lock();
list.unlock();`);
var slCount = 0;
var slApi = new MTS.SortableList('#sl-api', {
  numbered:true,
  items:[{ id:'sl-a1', title:'Item Alpha' },{ id:'sl-a2', title:'Item Beta' },{ id:'sl-a3', title:'Item Gamma' }],
  onReorder:function(e){ document.getElementById('sl-api-result').textContent='reordered → '+e.detail.items.map(function(i){return i.id;}).join(', '); }
});
</script>
