<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<div class="demo-page">

    </div>

  </div>

  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-sl2"></div></div>

<script>
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var out='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0, indent-step); out += ' '.repeat(indent) + t + '\n'; }
    else if(/^<[^!]/.test(t)){ out += ' '.repeat(indent) + t + '\n'; var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||''; if(!voids.test(tag) && !/\/>$/.test(t)) indent += step; }
    else { var text=t.replace(/\s+/g,' '); if(text) out += ' '.repeat(indent) + text + '\n'; }
  });
  return out.trimEnd();
}
function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.SortableList'] && MTS.getLocale()['MTS.SortableList'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Drag-and-drop sortable list — numbered, move buttons, icons, badges and API controls.';
document.getElementById('s1-title').textContent = D.s1Title || '1 — Approval workflow';
document.getElementById('s2-title').textContent = D.s2Title || '2 — Priority list — icons and meta';
document.getElementById('s3-title').textContent = D.s3Title || '3 — Variants';
document.getElementById('s4-title').textContent = D.s4Title || '4 — API — addItem · removeItem · lock · unlock';

makeSection('tabs-sl1',
  '<div><div id="sl-workflow"></div><div class="result-box" id="sl-result">' + (D.resultPlaceholder || '— reorder the list —') + '</div></div>',
`new MTS.SortableList('#sl-workflow', {
  numbered: true,
  moveButtons: true,
  items: [
    { id:'1', title:'Design review', badge:{ label:'Pending', variant:'warning' } },
    { id:'2', title:'Backend API', badge:{ label:'In progress', variant:'primary' } },
    { id:'3', title:'QA testing', disabled: true }
  ],
  onReorder: (e) => console.log(e.detail.items),
  onItemClick: (e) => console.log(e.detail.item.id)
});`);
new MTS.SortableList('#sl-workflow', {
  numbered:true,
  moveButtons:true,
  items:[
    { id:'1', title:(D.wfTitle1 || 'Design review'), description:'Ana García', badge:{ label:(D.badgePending || 'Pending'), variant:'warning' } },
    { id:'2', title:(D.wfTitle2 || 'Backend API'), description:'Pedro López', badge:{ label:(D.badgeInProgress || 'In progress'), variant:'primary' } },
    { id:'3', title:(D.wfTitle3 || 'QA testing'), description:'Laura Sánchez', disabled:true },
    { id:'4', title:(D.wfTitle4 || 'Deploy to production'), description:'Carlos Ruiz', badge:{ label:(D.badgeBlocked || 'Blocked'), variant:'danger' } },
    { id:'5', title:(D.wfTitle5 || 'Document changelog'), description:'María Torres', badge:{ label:(D.badgeTodo || 'Todo'), variant:'default' } }
  ],
  onReorder:function(e){ document.getElementById('sl-result').textContent=(D.echoReorder || 'onReorder → from:')+e.detail.fromIndex+(D.echoReorderTo || ' to:')+e.detail.toIndex; },
  onItemClick:function(e){ document.getElementById('sl-result').textContent=(D.echoItemClick || 'onItemClick → ')+'"'+e.detail.item.title+'"'; }
});

makeSection('tabs-sl2',
  '<div id="sl-priorities"></div>',
`new MTS.SortableList('#sl-priorities', {
  variant: 'compact',
  items: [
    { id:'1', title:'Critical bug', icon: MTS.Icon.get('warning', 16), meta:'P1 · 2h' },
    { id:'2', title:'Feature request', icon: MTS.Icon.get('star', 16), meta:'P2 · 4h' },
    { id:'3', title:'Documentation', icon: MTS.Icon.get('check-circle', 16), meta:'P3 · 1h' }
  ]
});`);
new MTS.SortableList('#sl-priorities', {
  variant:'compact',
  items:[
    { id:'p1', title:'Critical bug', description:'Auth fails', icon:MTS.Icon.get('warning',16), meta:'P1 · 2h' },
    { id:'p2', title:'Feature request', description:'Dark mode', icon:MTS.Icon.get('star',16), meta:'P2 · 4h' },
    { id:'p3', title:'Documentation', description:'Update API docs', icon:MTS.Icon.get('check-circle',16), meta:'P3 · 1h' },
    { id:'p4', title:'Refactor DB', description:'Optimize queries', icon:MTS.Icon.get('flag',16), meta:'P4 · 6h' }
  ]
});

makeSection('tabs-sl3',
  '<div><div id="sl-v1"></div><div style="height:12px"></div><div id="sl-v2"></div><div style="height:12px"></div><div id="sl-v3"></div></div>',
`new MTS.SortableList('#sl-v1', { variant: 'default', items: [...] });
new MTS.SortableList('#sl-v2', { variant: 'flush', items: [...] });
new MTS.SortableList('#sl-v3', { variant: 'compact', items: [...] });`);
['default','flush','compact'].forEach(function(variant, index){
  new MTS.SortableList('#sl-v'+(index+1), {
    variant: variant,
    items:[{id:'a',title:'Item Alpha'},{id:'b',title:'Item Beta'},{id:'c',title:'Item Gamma'}]
  });
});

makeSection('tabs-sl4',
  '<div><div id="sl-api"></div><div class="demo-row" style="margin-top:10px;flex-wrap:wrap"><button class="demo-btn-sm" onclick="slApi.addItem({id:\'n\'+Date.now(),title:slNewItemPrefix + ++slCount})">addItem()</button><button class="demo-btn-sm" onclick="slApi.removeItem(\'sl-a1\')">removeItem(\'sl-a1\')</button><button class="demo-btn-sm" onclick="slApi.lock()">lock()</button><button class="demo-btn-sm" onclick="slApi.unlock()">unlock()</button></div><div class="result-box" id="sl-api-result">' + (D.apiResultPlaceholder || '— use the buttons —') + '</div></div>',
`const list = new MTS.SortableList('#sl-api', {
  numbered: true,
  items: [
    { id:'sl-a1', title:'Item Alpha' },
    { id:'sl-a2', title:'Item Beta' },
    { id:'sl-a3', title:'Item Gamma' }
  ]
});

list.addItem({ id:'new-item', title:'New item' });
list.removeItem('sl-a1');
list.lock();
list.unlock();`);
var slCount = 0;
var slNewItemPrefix = D.newItemPrefix || 'New item #';
var slApi = new MTS.SortableList('#sl-api', {
  numbered:true,
  items:[{ id:'sl-a1', title:'Item Alpha' },{ id:'sl-a2', title:'Item Beta' },{ id:'sl-a3', title:'Item Gamma' }],
  onReorder:function(e){ document.getElementById('sl-api-result').textContent=(D.echoApiReorder || 'reordered → ')+e.detail.items.map(function(i){return i.id;}).join(', '); }
});
</script>
