<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function (tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre class="demo-code" style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre class="demo-code" style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

var js_s2 = "new MTS.Tree('#tree-selectable', {\n  selectable: true,\n  showLines: true,\n  nodes: [\n    { id:'dashboard', label:'Dashboard', selected:true },\n    { id:'analytics', label:'Analytics' },\n    { id:'reports', label:'Reports', children:[\n      { id:'monthly', label:'Monthly report' },\n      { id:'annual', label:'Annual report' },\n    ]},\n    { id:'settings', label:'Settings', children:[\n      { id:'profile', label:'Profile' },\n      { id:'security', label:'Security' },\n      { id:'billing', label:'Billing', disabled:true },\n    ]},\n  ],\n  onSelect: function (e) {\n    document.getElementById('tree-select-result').textContent =\n      'onSelect \u2192 id: \"' + e.detail.node.id + '\" path: ' + JSON.stringify(e.detail.path);\n  },\n});";

var js_s3 = "new MTS.Tree('#tree-checkable', {\n  checkable: true,\n  expandAll: true,\n  showIcons: false,\n  nodes: [\n    { id:'users', label:'Users', children:[\n      { id:'users-read', label:'Read', checked:true },\n      { id:'users-write', label:'Write', checked:true },\n      { id:'users-delete', label:'Delete', disabled:true },\n    ]},\n    { id:'reports', label:'Reports', children:[\n      { id:'reports-view', label:'View' },\n      { id:'reports-export', label:'Export' },\n    ]},\n    { id:'settings', label:'Settings', children:[\n      { id:'settings-read', label:'Read' },\n      { id:'settings-write', label:'Write', checked:true },\n    ]},\n  ],\n  onCheck: function (e) {\n    document.getElementById('tree-check-result').textContent =\n      'onCheck \u2192 checked: ' + e.detail.checked + ' ids: ' + JSON.stringify(e.detail.checkedIds);\n  },\n});";
var preview_s4 = "<div class=\"demo-stack\"><div class=\"result-box\" style=\"max-width:420px;color:inherit;font-family:inherit\"><div id=\"tree-badges\"></div></div><div class=\"demo-row\"><button id=\"tree-btn-expand\"></button><button id=\"tree-btn-collapse\"></button><button id=\"tree-btn-select\"></button></div><div class=\"result-box\" id=\"tree-api-result\">\u2014 usa la API \u2014</div></div>";
var js_s4 = "const treeBadges = new MTS.Tree('#tree-badges', {\n  selectable: true,\n  showLines: true,\n  nodes: [\n    { id:'eng', label:'Engineering', badge:'12', expanded:true, icon:\n      '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2l1.7 4.4 4.7.4-3.6 3 1.1 4.6L12 12.8 8.1 14.4l1.1-4.6-3.6-3 4.7-.4L12 2z\"/></svg>',\n      children:[\n        { id:'frontend', label:'Frontend', badge:'4' },\n        { id:'backend', label:'Backend', badge:'8' },\n      ]\n    },\n    { id:'design', label:'Design', badge:'3', icon:\n      '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><circle cx=\"12\" cy=\"12\" r=\"9\"/></svg>' },\n    { id:'product', label:'Product', badge:'5', icon:\n      '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"5\" y=\"5\" width=\"14\" height=\"14\" rx=\"3\"/></svg>' },\n  ],\n  onSelect: function (e) {\n    document.getElementById('tree-api-result').textContent =\n      'selected \u2192 ' + e.detail.node.id;\n  },\n});\n\nnew MTS.Button('#tree-btn-expand', {\n  label: \"expand('eng')\",\n  variant: 'secondary',\n  onClick: function () {\n    treeBadges.expand('eng');\n    document.getElementById('tree-api-result').textContent = \"API \u2192 expand('eng')\";\n  },\n});\n\nnew MTS.Button('#tree-btn-collapse', {\n  label: \"collapse('eng')\",\n  variant: 'ghost',\n  onClick: function () {\n    treeBadges.collapse('eng');\n    document.getElementById('tree-api-result').textContent = \"API \u2192 collapse('eng')\";\n  },\n});\n\nnew MTS.Button('#tree-btn-select', {\n  label: \"select('frontend')\",\n  variant: 'primary',\n  onClick: function () {\n    treeBadges.select('frontend');\n    document.getElementById('tree-api-result').textContent = \"API \u2192 select('frontend')\";\n  },\n});";

makeSection('tabs-s1', preview_s1, js_s1, function () {
