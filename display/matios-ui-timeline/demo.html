    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function(){
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Timeline'].demo) || {};

var T_subtitle     = D.subtitle     || 'Timeline demo updated to the Preview | HTML | JavaScript pattern.';
var T_s1Title      = D.s1Title      || '1 — Basic';
var T_s2Title      = D.s2Title      || '2 — Alignments';
var T_s3Title      = D.s3Title      || '3 — addEvent() / setEvents()';
var T_initialTitle = D.initialTitle || 'Initial event';
var T_initialDate  = D.initialDate  || 'Start';
var T_randomTitle  = D.randomTitle  || 'Event #';
var T_randomDate   = D.randomDate   || 'Now';
var T_randomDesc   = D.randomDesc   || 'Created dynamically.';

(function(){
  var sub = document.getElementById('demo-subtitle'); if (sub) sub.textContent = T_subtitle;
  var t1 = document.getElementById('s1-title');       if (t1)  t1.textContent  = T_s1Title;
  var t2 = document.getElementById('s2-title');       if (t2)  t2.textContent  = T_s2Title;
  var t3 = document.getElementById('s3-title');       if (t3)  t3.textContent  = T_s3Title;
})();

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}
var preview_s1 = "<div id=\"tl-basic\"></div>";
var js_s1 = "new MTS.Timeline('#tl-basic', { events:[{ title:'Order charged', date:'Today', description:'$248.00 charged.' },{ title:'Order shipped', date:'Yesterday', description:'Tracking #9X4712.' },{ title:'Order placed', date:'3 days ago', description:'3 items.' }] });";
var preview_s2 = "<div class=\"demo-grid\"><div id=\"tl-left\"></div><div id=\"tl-alternate\"></div></div>";
var js_s2 = "new MTS.Timeline('#tl-left', { align:'left', events:[{ title:'Kickoff', date:'Week 1' },{ title:'Build', date:'Week 2' },{ title:'Launch', date:'Week 3' }] });\nnew MTS.Timeline('#tl-alternate', { align:'alternate', events:[{ title:'Kickoff', date:'Week 1' },{ title:'Build', date:'Week 2' },{ title:'Launch', date:'Week 3' }] });";
var preview_s3 = "<div class=\"demo-stack\"><div id=\"tl-api\"></div><div class=\"demo-row\"><button class=\"demo-btn-sm\" onclick=\"addRandom()\">addEvent()</button><button class=\"demo-btn-sm\" onclick=\"tlApi.setEvents([])\">setEvents([])</button></div></div>";
var js_s3 = "var tlApi = new MTS.Timeline('#tl-api', { events:[{ title:'Initial event', date:'Start' }] });\ntlApi.addEvent({ title:'New event', date:'Now' });\ntlApi.setEvents([]);";
var tlApi;
function addRandom() {
  var n = Math.floor(Math.random() * 1000);
  tlApi.addEvent({ title: T_randomTitle + n, date: T_randomDate, description: T_randomDesc });
}
makeSection('tabs-s1', preview_s1, js_s1, function() { new MTS.Timeline('#tl-basic', { events:[{ title:'Order charged', date:'Today', description:'$248.00 charged.' },{ title:'Order shipped', date:'Yesterday', description:'Tracking #9X4712.' },{ title:'Order placed', date:'3 days ago', description:'3 items.' }] }); }, '360px');
makeSection('tabs-s2', preview_s2, js_s2, function() { new MTS.Timeline('#tl-left', { align:'left', events:[{ title:'Kickoff', date:'Week 1' },{ title:'Build', date:'Week 2' },{ title:'Launch', date:'Week 3' }] }); new MTS.Timeline('#tl-alternate', { align:'alternate', events:[{ title:'Kickoff', date:'Week 1' },{ title:'Build', date:'Week 2' },{ title:'Launch', date:'Week 3' }] }); }, '380px');
makeSection('tabs-s3', preview_s3, js_s3, function() { tlApi = new MTS.Timeline('#tl-api', { events:[{ title: T_initialTitle, date: T_initialDate }] }); }, '340px');

</script>
