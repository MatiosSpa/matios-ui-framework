<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Timeline — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../base/matios-ui-base.css">
<link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
<link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
<link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
<link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
<link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
<link rel="stylesheet" href="../../shared/demo-shared.css">
<link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-timeline.css">
<script src="../../shared/demo-shared.js"></script>
<script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-timeline.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>
<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Timeline</h1>
    <p>Timeline demo actualizado al patrón Preview | HTML | JavaScript.</p>
    <div class="demo-header-actions"><button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-timeline.md')">Documentación</button></div>
    <div class="demo-docs-panel" id="docs-panel"></div>

  <div class="demo-section"><div class="demo-section-title">1 — Básica</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Alineaciones</div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — addEvent() / setEvents()</div><div id="tabs-s3"></div></div>
</div>
<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' + esc(indentHtml(previewHtml)) + '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' + esc(code) + '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });
  if (typeof initFn === 'function') initFn();
}
var preview_s1 = "<div id=\"tl-basic\"></div>";
var js_s1 = "new MTS.Timeline('#tl-basic', { events:[{ title:'Order charged', date:'Today', description:'$248.00 charged.' },{ title:'Order shipped', date:'Yesterday', description:'Tracking #9X4712.' },{ title:'Order placed', date:'3 days ago', description:'3 items.' }] });";
var preview_s2 = "<div class=\"demo-grid\"><div id=\"tl-left\"></div><div id=\"tl-alternate\"></div></div>";
var js_s2 = "new MTS.Timeline('#tl-left', { align:'left', events:[{ title:'Kickoff', date:'Week 1' },{ title:'Build', date:'Week 2' },{ title:'Launch', date:'Week 3' }] });\nnew MTS.Timeline('#tl-alternate', { align:'alternate', events:[{ title:'Kickoff', date:'Week 1' },{ title:'Build', date:'Week 2' },{ title:'Launch', date:'Week 3' }] });";
var preview_s3 = "<div class=\"demo-stack\"><div id=\"tl-api\"></div><div class=\"demo-row\"><button class=\"demo-btn-sm\" onclick=\"addRandom()\">addEvent()</button><button class=\"demo-btn-sm\" onclick=\"tlApi.setEvents([])\">setEvents([])</button></div></div>";
var js_s3 = "var tlApi = new MTS.Timeline('#tl-api', { events:[{ title:'Evento inicial', date:'Inicio' }] });\ntlApi.addEvent({ title:'Nuevo evento', date:'Ahora' });\ntlApi.setEvents([]);";
var tlApi;
function addRandom() {
  var n = Math.floor(Math.random() * 1000);
  tlApi.addEvent({ title:'Evento #' + n, date:'Ahora', description:'Creado dinámicamente.' });
}
makeSection('tabs-s1', preview_s1, js_s1, function() { new MTS.Timeline('#tl-basic', { events:[{ title:'Order charged', date:'Today', description:'$248.00 charged.' },{ title:'Order shipped', date:'Yesterday', description:'Tracking #9X4712.' },{ title:'Order placed', date:'3 days ago', description:'3 items.' }] }); }, '360px');
makeSection('tabs-s2', preview_s2, js_s2, function() { new MTS.Timeline('#tl-left', { align:'left', events:[{ title:'Kickoff', date:'Week 1' },{ title:'Build', date:'Week 2' },{ title:'Launch', date:'Week 3' }] }); new MTS.Timeline('#tl-alternate', { align:'alternate', events:[{ title:'Kickoff', date:'Week 1' },{ title:'Build', date:'Week 2' },{ title:'Launch', date:'Week 3' }] }); }, '380px');
makeSection('tabs-s3', preview_s3, js_s3, function() { tlApi = new MTS.Timeline('#tl-api', { events:[{ title:'Evento inicial', date:'Inicio' }] }); }, '340px');

</script>
</body>
</html>
