<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' + esc(indentHtml(previewHtml)) + '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' + esc(code) + '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });
  if (typeof initFn === 'function') initFn();
}
var preview_s1 = "<div class=\"demo-row\">\n  <div id=\"av-img\"></div>\n  <div id=\"av-initials\"></div>\n  <div id=\"av-online\"></div>\n  <div id=\"av-busy\"></div>\n  <div id=\"av-away\"></div>\n  <div id=\"av-square\"></div>\n  <div id=\"av-badge\"></div>\n</div>";
var js_s1 = "new MTS.Avatar('#av-img', { src:'https://i.pravatar.cc/150?img=1', name:'Ana Garc\u00eda' });\nnew MTS.Avatar('#av-initials', { name:'Pedro Mart\u00ednez' });\nnew MTS.Avatar('#av-online', { name:'Laura', status:'online' });\nnew MTS.Avatar('#av-busy', { name:'Carlos', status:'busy' });\nnew MTS.Avatar('#av-away', { name:'Mar\u00eda', status:'away' });\nnew MTS.Avatar('#av-square', { name:'Bot', square:true });\nnew MTS.Avatar('#av-badge', { name:'Ana', badge:3 });";
var preview_s2 = "<div class=\"demo-row\">\n  <div id=\"av-xs\"></div>\n  <div id=\"av-sm\"></div>\n  <div id=\"av-md\"></div>\n  <div id=\"av-lg\"></div>\n  <div id=\"av-xl\"></div>\n</div>";
var js_s2 = "['xs','sm','md','lg','xl'].forEach(function(size) { new MTS.Avatar('#av-' + size, { name:'Ana Garc\u00eda', size:size }); });";
var preview_s3 = "<div class=\"demo-stack\">\n  <div id=\"av-group-1\"></div>\n  <div id=\"av-group-2\"></div>\n</div>";
var js_s3 = "new MTS.AvatarGroup('#av-group-1', { avatars:[{src:'https://i.pravatar.cc/150?img=1',name:'Ana'},{name:'Pedro Mart\u00ednez'},{name:'Laura S\u00e1nchez'},{name:'Carlos Ruiz'},{name:'Mar\u00eda Torres'}], max:3, size:'md' });\nnew MTS.AvatarGroup('#av-group-2', { avatars:[{name:'Ana'},{name:'Pedro'},{name:'Laura'}], size:'lg' });";
var preview_s4 = "<div class=\"demo-stack\">\n  <div id=\"av-api\"></div>\n  <div class=\"demo-row\">\n    <button class=\"demo-btn-sm\" onclick=\"avatarApi.update({ name:'Carla Soto', status:'online', badge:2 })\">update()</button>\n    <button class=\"demo-btn-sm\" onclick=\"avatarApi.update({ src:'https://i.pravatar.cc/150?img=12', name:'Ana Garc\u00eda', status:null, badge:null })\">restore</button>\n  </div>\n</div>";
var js_s4 = "var avatarApi = new MTS.Avatar('#av-api', { src:'https://i.pravatar.cc/150?img=12', name:'Ana Garc\u00eda', size:'lg' });\navatarApi.update({ name:'Carla Soto', status:'online', badge:2 });";
var avatarApi;

}, '320px');
makeSection('tabs-s2', preview_s2, js_s2, function() { ['xs','sm','md','lg','xl'].forEach(function(size) { new MTS.Avatar('#av-' + size, { name:'Ana García', size:size }); }); }, '300px');
makeSection('tabs-s3', preview_s3, js_s3, function() {

  new MTS.AvatarGroup('#av-group-2', { avatars:[{name:'Ana'},{name:'Pedro'},{name:'Laura'}], size:'lg' });
}, '320px');

</script>
