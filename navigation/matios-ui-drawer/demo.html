<script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
function indentHtml(html) {
  var indent = 0, step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) { indent = Math.max(0, indent - step); result += ' '.repeat(indent) + t + '\n'; }
    else if (/^<[^!]/.test(t)) { result += ' '.repeat(indent) + t + '\n'; var tag = (t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||''; if (!voids.test(tag) && !/\/>$/.test(t)) indent += step; }
    else { var text = t.replace(/\s+/g,' '); if (text) result += ' '.repeat(indent) + text + '\n'; }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLanguage === 'function') MTS.setLanguage(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getString && MTS.getString()['MTS.Drawer']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Sliding side panel — left, right, top, bottom · sm/md/lg/full · static mode.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Positions';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Sizes';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Static (does not close with Esc/backdrop) + API';

var CONTENT = function(pos){ return '<div style="padding:20px;font-size:14px;color:var(--mts-text-secondary)"><p>' + (D.contentPosition || 'Drawer position: ') + '<strong>' + pos + '</strong></p><p>' + (D.contentHint || 'Click outside or press Esc to close.') + '</p></div>'; };
var drawers;

var preview_s1 =
  '<div class="demo-row">' +
    '<button class="mts-btn mts-btn--secondary" onclick="drawers.right.show()">Right (default)</button>' +
    '<button class="mts-btn mts-btn--secondary" onclick="drawers.left.show()">Left</button>' +
    '<button class="mts-btn mts-btn--secondary" onclick="drawers.top.show()">Top</button>' +
    '<button class="mts-btn mts-btn--secondary" onclick="drawers.bottom.show()">Bottom</button>' +
  '</div>' +
  '<div class="result-box" id="drawer-result">' + (D.resultPlaceholder || '— open a drawer —') + '</div>';

var js_s1 =
  "// Right (default)\n" +
  "const rightDrawer = new MTS.Drawer({\n" +
  "  title:    'Filters',\n" +
  "  content:  '<p>Filter panel</p>',\n" +
  "  position: 'right',\n" +
  "  size:     'md',\n" +
  "  onOpen:   function(){ console.log('opened'); },\n" +
  "  onClose:  function(){ console.log('closed'); }\n" +
  "});\n\n" +
  "// Left navigation\n" +
  "const leftDrawer = new MTS.Drawer({\n" +
  "  title:    'Navigation',\n" +
  "  content:  '<nav><ul><li>Home</li><li>Products</li></ul></nav>',\n" +
  "  position: 'left',\n" +
  "  size:     'sm'\n" +
  "});\n\n" +
  "// Bottom sheet\n" +
  "const bottomSheet = new MTS.Drawer({\n" +
  "  title:    'Options',\n" +
  "  position: 'bottom',\n" +
  "  size:     'sm',\n" +
  "  content:  '<ul>...</ul>'\n" +
  "});";

var preview_s2 =
  '<div class="demo-row">' +
    '<button class="mts-btn mts-btn--secondary" onclick="drawers.sm.show()">sm</button>' +
    '<button class="mts-btn mts-btn--secondary" onclick="drawers.md.show()">md</button>' +
    '<button class="mts-btn mts-btn--secondary" onclick="drawers.lg.show()">lg</button>' +
    '<button class="mts-btn mts-btn--secondary" onclick="drawers.full.show()">full</button>' +
  '</div>';

var js_s2 =
  "// Size: 'sm' | 'md' | 'lg' | 'full'\n" +
  "new MTS.Drawer({ size: 'sm',   title: 'Small',  content: '...' });\n" +
  "new MTS.Drawer({ size: 'md',   title: 'Medium', content: '...' }); // default\n" +
  "new MTS.Drawer({ size: 'lg',   title: 'Large',  content: '...' });\n" +
  "new MTS.Drawer({ size: 'full', title: 'Full',   content: '...' });";

var preview_s3 =
  '<div class="demo-row">' +
    '<button class="mts-btn mts-btn--secondary" onclick="drawers.static.show()">Open static drawer</button>' +
  '</div>';

var js_s3 =
  "// static: true — user must click a button to close\n" +
  "const drawer = new MTS.Drawer({\n" +
  "  title:   'Confirm action',\n" +
  "  content: '<p>Are you sure you want to proceed?</p>',\n" +
  "  static:  true,\n" +
  "  onClose: function(){ console.log('closed'); }\n" +
  "});\n\n" +
  "// API\n" +
  "drawer.show()\n" +
  "drawer.hide()\n" +
  "drawer.toggle()\n" +
  "drawer.setTitle('Updated title')\n" +
  "drawer.setContent('<p>New content</p>')\n" +
  "drawer.destroy()";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  var onOpenPrefix  = D.onOpenPrefix  || 'onOpen → position: ';
  var onClosePrefix = D.onClosePrefix || 'onClose → ';
  drawers = {
    right:  new MTS.Drawer({ title:(D.titleRight  || 'Right drawer'),  position:'right',  size:'md', content: CONTENT('right'),  onOpen: function(){ document.getElementById('drawer-result').textContent = onOpenPrefix + 'right'; },  onClose: function(){ document.getElementById('drawer-result').textContent = onClosePrefix + 'right'; } }),
    left:   new MTS.Drawer({ title:(D.titleLeft   || 'Left drawer'),   position:'left',   size:'sm', content: CONTENT('left'),   onOpen: function(){ document.getElementById('drawer-result').textContent = onOpenPrefix + 'left'; },   onClose: function(){ document.getElementById('drawer-result').textContent = onClosePrefix + 'left'; } }),
    top:    new MTS.Drawer({ title:(D.titleTop    || 'Top drawer'),    position:'top',    size:'sm', content: CONTENT('top'),    onOpen: function(){ document.getElementById('drawer-result').textContent = onOpenPrefix + 'top'; },    onClose: function(){ document.getElementById('drawer-result').textContent = onClosePrefix + 'top'; } }),
    bottom: new MTS.Drawer({ title:(D.titleBottom || 'Bottom sheet'),  position:'bottom', size:'sm', content: CONTENT('bottom'), onOpen: function(){ document.getElementById('drawer-result').textContent = onOpenPrefix + 'bottom'; }, onClose: function(){ document.getElementById('drawer-result').textContent = onClosePrefix + 'bottom'; } }),
    sm:     new MTS.Drawer({ title:(D.titleSmall  || 'Small (sm)'),    position:'right',  size:'sm', content: CONTENT('sm') }),
    md:     new MTS.Drawer({ title:(D.titleMedium || 'Medium (md)'),   position:'right',  size:'md', content: CONTENT('md') }),
    lg:     new MTS.Drawer({ title:(D.titleLarge  || 'Large (lg)'),    position:'right',  size:'lg', content: CONTENT('lg') }),
    full:   new MTS.Drawer({ title:(D.titleFull   || 'Full width'),    position:'right',  size:'full', content: CONTENT('full') }),
    static: new MTS.Drawer({
      title:  (D.titleStatic || 'Static drawer'),
      static: true,
      content: '<div style="padding:20px;font-size:14px;color:var(--mts-text-secondary)"><p>' + (D.staticLine1 || 'This drawer <strong>does not close</strong> with Esc nor by clicking the backdrop.') + '</p><p>' + (D.staticLine2 || 'It only closes with the × button.') + '</p></div>',
    }),
  };
}, '340px');

makeSection('tabs-s2', preview_s2, js_s2, null, '340px');

makeSection('tabs-s3', preview_s3, js_s3, null, '340px');
</script>
