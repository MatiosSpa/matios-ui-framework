<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

  <meta name="viewport" content="width=device-width,initial-scale=1">

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.StepProgress</h1>
    <p id="demo-subtitle">Compatibility alias. The official component is now MTS.Stepper.</p>

    Use MTS.Stepper for new examples. This demo only confirms compatibility.
  </div>

    <div class="demo-section-title" id="s1-title">1 — Compatibility alias</div>
    <div id="tabs-compat"></div>

</div>

<script>
function indentHtml(html) {
  var indent = 0, step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) { indent = Math.max(0, indent - step); result += ' '.repeat(indent) + t + '\n'; }
    else if (/^<[^!]/.test(t)) { result += ' '.repeat(indent) + t + '\n'; var tag = (t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||''; if (!voids.test(tag) && !/\/>$/.test(t)) indent += step; }
    else { var text = t.replace(/\s+/g,' '); if (text) result += ' '.repeat(indent) + text + '\n'; }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.StepProgress']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Compatibility alias. The official component is now MTS.Stepper.';
document.getElementById('compat-note').textContent   = D.compatNote || 'Use MTS.Stepper for new examples. This demo only confirms compatibility.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Compatibility alias';

var preview = [
'<div class="demo-stack">',
'  <div id="stepprogress-compat"></div>',
'  <div class="result-box" id="stepprogress-result">' + (D.resultPlaceholder || '— alias active —') + '</div>',
'</div>'
].join('\n');

var jsCode = [
"const progress = new MTS.StepProgress('#stepprogress-compat', {",
"  variant: 'default',",
"  active: 1,",
"  steps: [",
"    { id: 'cart', label: 'Cart', description: 'Review products' },",
"    { id: 'ship', label: 'Shipping', description: 'Delivery address' },",
"    { id: 'payment', label: 'Payment', description: 'Payment method' },",
"    { id: 'confirm', label: 'Confirmed' }",
"  ],",
"  onChange: function(e) {",
"    console.log(e.detail.index);",
"  }",
"});"
].join('\n');

makeSection('tabs-compat', preview, jsCode, function() {
  new MTS.StepProgress('#stepprogress-compat', {
    variant: 'default',
    active: 1,
    steps: [
      { id: 'cart', label: 'Cart', description: 'Review products' },
      { id: 'ship', label: 'Shipping', description: 'Delivery address' },
      { id: 'payment', label: 'Payment', description: 'Payment method' },
      { id: 'confirm', label: 'Confirmed' }
    ],
    onChange: function(e) {
      document.getElementById('stepprogress-result').textContent = (D.stepPrefix || 'step → ') + e.detail.step.label;
    }
  });
}, '320px');
</script>
