<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.CommandPalette — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../utilities/matios-ui-codeblock/matios-ui-codeblock.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-commandpalette.css">
  <script src="../../support/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../forms/matios-ui-copybutton/matios-ui-copybutton.js"></script>
  <script src="../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../utilities/matios-ui-sanitize/matios-ui-sanitize.js"></script>
  <script src="../../utilities/matios-ui-codeblock/matios-ui-codeblock.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../../base/matios-ui-i18n.js"></script>
  <script src="./matios-ui-commandpalette-i18n.js"></script>
  <script src="./matios-ui-commandpalette.js"></script>
</head>
<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.CommandPalette</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
</div>

<script>

function indentHtml(html) {
  var indent = 0, step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) { indent = Math.max(0, indent - step); result += ' '.repeat(indent) + t + '\n'; }
    else if (/^<[^!]/.test(t)) { result += ' '.repeat(indent) + t + '\n'; var tag = (t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||''; if (!voids.test(tag) && !/\/>$/.test(t)) indent += step; }
    else { var text = t.replace(/\s+/g,' '); if (text) result += ' '.repeat(indent) + text + '\n'; }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.CommandPalette']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || '⌘K-style command search with grouped commands and actions.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Basic';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Grouped';

var cpBasic, cpGrouped;
var preview_s1 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="cpBasic.open()">' + (D.btnOpenBasic || 'Open palette') + '</button>' +
      '<button class="demo-btn-sm" onclick="cpBasic.close()">' + (D.btnCloseBasic || 'Close') + '</button>' +
    '</div>' +
    '<div class="result-box" id="cp-result-basic">' + (D.resultBasicPlaceholder || '— open the palette to try commands —') + '</div>' +
  '</div>';

var js_s1 =
  "var cpBasic = new MTS.CommandPalette({\n" +
  "  placeholder: 'Search command...',\n" +
  "  commands: [\n" +
  "    { id: 'dashboard', label: 'Go to Dashboard', icon: MTS.Icon.get('grid'), action: function(){ setResult('cp-result-basic', 'action → dashboard'); } },\n" +
  "    { id: 'settings', label: 'Open settings', icon: MTS.Icon.get('cog'), action: function(){ setResult('cp-result-basic', 'action → settings'); } },\n" +
  "    { id: 'new', label: 'Create new', icon: MTS.Icon.get('add-circle'), action: function(){ setResult('cp-result-basic', 'action → new'); } }\n" +
  "  ]\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="cpGrouped.open()">' + (D.btnOpenGrouped || 'Open grouped palette') + '</button>' +
    '</div>' +
    '<div class="result-box" id="cp-result-grouped">' + (D.resultGroupedPlaceholder || '— palette with groups and shortcuts —') + '</div>' +
  '</div>';

var js_s2 =
  "var cpGrouped = new MTS.CommandPalette({\n" +
  "  commands: [\n" +
  "    { id: 'dashboard', label: 'Dashboard', group: 'Navigation', icon: MTS.Icon.get('grid'), shortcut: '⌘D', action: function(){ setResult('cp-result-grouped', 'select → dashboard'); } },\n" +
  "    { id: 'projects', label: 'Projects', group: 'Navigation', icon: MTS.Icon.get('kanban'), shortcut: '⌘P', action: function(){ setResult('cp-result-grouped', 'select → projects'); } },\n" +
  "    { id: 'theme-dark', label: 'Dark mode', group: 'Preferences', icon: MTS.Icon.get('moon'), action: function(){ setMode('dark'); setResult('cp-result-grouped', 'theme → dark'); } },\n" +
  "    { id: 'theme-light', label: 'Light mode', group: 'Preferences', icon: MTS.Icon.get('sun'), action: function(){ setMode('light'); setResult('cp-result-grouped', 'theme → light'); } }\n" +
  "  ]\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  cpBasic = new MTS.CommandPalette({
    placeholder: D.searchPlaceholder || 'Search command...',
    commands: [
      { id: 'dashboard', label: D.cmdDashboard || 'Go to Dashboard', icon: MTS.Icon.get('grid'), action: function(){ setResult('cp-result-basic', 'action → dashboard'); } },
      { id: 'settings', label: D.cmdSettings || 'Open settings', icon: MTS.Icon.get('cog'), action: function(){ setResult('cp-result-basic', 'action → settings'); } },
      { id: 'new', label: D.cmdNew || 'Create new', icon: MTS.Icon.get('add-circle'), action: function(){ setResult('cp-result-basic', 'action → new'); } }
    ]
  });
}, '280px');

makeSection('tabs-s2', preview_s2, js_s2, function() {
  cpGrouped = new MTS.CommandPalette({
    commands: [
      { id: 'dashboard', label: 'Dashboard', group: 'Navigation', icon: MTS.Icon.get('grid'), shortcut: '⌘D', action: function(){ setResult('cp-result-grouped', 'select → dashboard'); } },
      { id: 'projects', label: 'Projects', group: 'Navigation', icon: MTS.Icon.get('kanban'), shortcut: '⌘P', action: function(){ setResult('cp-result-grouped', 'select → projects'); } },
      { id: 'theme-dark', label: D.cmdThemeDark || 'Dark mode', group: 'Preferences', icon: MTS.Icon.get('moon'), action: function(){ setMode('dark'); setResult('cp-result-grouped', 'theme → dark'); } },
      { id: 'theme-light', label: D.cmdThemeLight || 'Light mode', group: 'Preferences', icon: MTS.Icon.get('sun'), action: function(){ setMode('light'); setResult('cp-result-grouped', 'theme → light'); } }
    ]
  });
}, '280px');

</script>
</body>
</html>
