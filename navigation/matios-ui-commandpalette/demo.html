<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.CommandPalette — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../shared/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-commandpalette.css">
  <script src="../../shared/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-commandpalette.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.CommandPalette</h1>
    <p>Buscador de comandos tipo ⌘K con comandos agrupados y acciones.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-commandpalette.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 — Básico</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Agrupado</div><div id="tabs-s2"></div></div>
</div>

<script>

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var cpBasic, cpGrouped;
var preview_s1 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="cpBasic.open()">Abrir palette</button>' +
      '<button class="demo-btn-sm" onclick="cpBasic.close()">Cerrar</button>' +
    '</div>' +
    '<div class="result-box" id="cp-result-basic">— abre la palette para probar comandos —</div>' +
  '</div>';

var js_s1 =
  "var cpBasic = new MTS.CommandPalette({\n" +
  "  placeholder: 'Buscar comando...',\n" +
  "  commands: [\n" +
  "    { id: 'dashboard', label: 'Ir al Dashboard', icon: MTS.Icon.get('grid'), action: function(){ setResult('cp-result-basic', 'action → dashboard'); } },\n" +
  "    { id: 'settings', label: 'Abrir ajustes', icon: MTS.Icon.get('cog'), action: function(){ setResult('cp-result-basic', 'action → settings'); } },\n" +
  "    { id: 'new', label: 'Crear nuevo', icon: MTS.Icon.get('add-circle'), action: function(){ setResult('cp-result-basic', 'action → new'); } }\n" +
  "  ]\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="cpGrouped.open()">Abrir palette agrupada</button>' +
    '</div>' +
    '<div class="result-box" id="cp-result-grouped">— palette con grupos y shortcuts —</div>' +
  '</div>';

var js_s2 =
  "var cpGrouped = new MTS.CommandPalette({\n" +
  "  commands: [\n" +
  "    { id: 'dashboard', label: 'Dashboard', group: 'Navigation', icon: MTS.Icon.get('grid'), shortcut: '⌘D', action: function(){ setResult('cp-result-grouped', 'select → dashboard'); } },\n" +
  "    { id: 'projects', label: 'Projects', group: 'Navigation', icon: MTS.Icon.get('kanban'), shortcut: '⌘P', action: function(){ setResult('cp-result-grouped', 'select → projects'); } },\n" +
  "    { id: 'theme-dark', label: 'Modo oscuro', group: 'Preferences', icon: MTS.Icon.get('moon'), action: function(){ setMode('dark'); setResult('cp-result-grouped', 'theme → dark'); } },\n" +
  "    { id: 'theme-light', label: 'Modo claro', group: 'Preferences', icon: MTS.Icon.get('sun'), action: function(){ setMode('light'); setResult('cp-result-grouped', 'theme → light'); } }\n" +
  "  ]\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  cpBasic = new MTS.CommandPalette({
    placeholder: 'Buscar comando...',
    commands: [
      { id: 'dashboard', label: 'Ir al Dashboard', icon: MTS.Icon.get('grid'), action: function(){ setResult('cp-result-basic', 'action → dashboard'); } },
      { id: 'settings', label: 'Abrir ajustes', icon: MTS.Icon.get('cog'), action: function(){ setResult('cp-result-basic', 'action → settings'); } },
      { id: 'new', label: 'Crear nuevo', icon: MTS.Icon.get('add-circle'), action: function(){ setResult('cp-result-basic', 'action → new'); } }
    ]
  });
}, '280px');

makeSection('tabs-s2', preview_s2, js_s2, function() {
  cpGrouped = new MTS.CommandPalette({
    commands: [
      { id: 'dashboard', label: 'Dashboard', group: 'Navigation', icon: MTS.Icon.get('grid'), shortcut: '⌘D', action: function(){ setResult('cp-result-grouped', 'select → dashboard'); } },
      { id: 'projects', label: 'Projects', group: 'Navigation', icon: MTS.Icon.get('kanban'), shortcut: '⌘P', action: function(){ setResult('cp-result-grouped', 'select → projects'); } },
      { id: 'theme-dark', label: 'Modo oscuro', group: 'Preferences', icon: MTS.Icon.get('moon'), action: function(){ setMode('dark'); setResult('cp-result-grouped', 'theme → dark'); } },
      { id: 'theme-light', label: 'Modo claro', group: 'Preferences', icon: MTS.Icon.get('sun'), action: function(){ setMode('light'); setResult('cp-result-grouped', 'theme → light'); } }
    ]
  });
}, '280px');

</script>
</body>
</html>
