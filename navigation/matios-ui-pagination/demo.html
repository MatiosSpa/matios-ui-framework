  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);

      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');

          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
/* ============================================================
   LOCALE — shows English by default (public-facing); ?lang=es|en|pt
   ============================================================ */
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Pagination'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Full pagination — page size selector, record summary, jump-to-page, size variants.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Basic with onChange';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — With jump + sizes';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — API — setPage, setTotal, setPageSize';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — siblings — visible pages on each side';

/* ============================================================
   UTILITIES
   ============================================================ */

function indentHtml(html) {
  let indent   = 0;
  const step   = 2;
  const voids  = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  let result   = '';
  const tokens = String(html).match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    const t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      const tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      const text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

/*
 * makeSection — creates the 3 tabs: Preview, HTML and JavaScript.
 * With lazy:false all panels are in the DOM when this function returns.
 *
 * @param {string} id          — id of the tabs container
 * @param {string} previewHtml — preview HTML
 * @param {string} jsCode      — example JS code
 * @param {string} [htmlCode]  — representative HTML snippet (optional)
 */
function makeSection(id, previewHtml, jsCode, htmlCode) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height:  '320px',
    lazy:    false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',        content: '<div id="cb-html-' + id + '" style="height:100%"></div>' },
      { id: id + '-js',      label: 'JavaScript',  content: '<div id="cb-js-'   + id + '" style="height:100%"></div>' },
    ],
  });

  new MTS.CodeBlock(document.getElementById('cb-html-' + id), {
    language: 'html',
    code:     htmlCode || indentHtml(previewHtml),
    copyable: true,
  });

  new MTS.CodeBlock(document.getElementById('cb-js-' + id), {
    language: 'javascript',
    code:     jsCode,
    copyable: true,
  });
}

/* ============================================================
   S1 — Basic with onChange
   ============================================================ */

const preview_s1 =
  '<div id="pag-basic"></div>' +
  '<div class="result-box" id="pag-result" style="margin-top:12px">' + (D.resultPagePlaceholder || '— change the page —') + '</div>';

const html_s1 =
  '<div id="my-pagination"\n' +
  '  data-total="250"\n' +
  '  data-page="1"\n' +
  '  data-page-size="25">\n' +
  '</div>\n\n' +
  '<script>\n' +
  '  new MTS.Pagination(\'#my-pagination\', {\n' +
  '    onChange: (e) => fetchData(e.detail.page, e.detail.pageSize),\n' +
  '  });\n' +
  '<\/script>';

const js_s1 =
  'new MTS.Pagination(\'#my-pagination\', {\n' +
  '  total:     250,\n' +
  '  page:      1,\n' +
  '  pageSize:  25,\n' +
  '  showSizes: true,   // page size selector\n' +
  '  showInfo:  true,   // "Showing 1-25 of 250"\n' +
  '  // Fires on page or page size change\n' +
  '  onChange: (e) => {\n' +
  '    console.log(e.detail.page);      // → current page\n' +
  '    console.log(e.detail.pageSize);  // → current page size\n' +
  '    console.log(e.detail.from);      // → first record\n' +
  '    console.log(e.detail.to);        // → last record\n' +
  '    console.log(e.detail.total);     // → total records\n' +
  '  },\n' +
  '});';

makeSection('tabs-s1', preview_s1, js_s1, html_s1);

new MTS.Pagination('#pag-basic', {
  total: 250, page: 1, pageSize: 25,
  onChange: function(e) {
    document.getElementById('pag-result').textContent =
      (D.onChangePrefix || 'onChange → page: ') + e.detail.page +
      (D.pageSizeLabel || ' | page size: ') + e.detail.pageSize +
      (D.fromLabel || ' | from: ') + e.detail.from +
      (D.toLabel || ' to: ') + e.detail.to;
  },
});

/* ============================================================
   S2 — With jump + sizes
   ============================================================ */

const preview_s2 =
  '<div class="demo-stack" style="gap:20px">' +
    '<div>' +
      '<div class="demo-label" style="margin-bottom:6px">size: sm + showJump</div>' +
      '<div id="pag-sm"></div>' +
    '</div>' +
    '<div>' +
      '<div class="demo-label" style="margin-bottom:6px">size: md (default)</div>' +
      '<div id="pag-md"></div>' +
    '</div>' +
    '<div>' +
      '<div class="demo-label" style="margin-bottom:6px">size: lg</div>' +
      '<div id="pag-lg"></div>' +
    '</div>' +
  '</div>';

const html_s2 =
  '<div id="pag-sm" data-total="500" data-size="sm"></div>\n' +
  '<div id="pag-md" data-total="500" data-size="md"></div>\n' +
  '<div id="pag-lg" data-total="500" data-size="lg"></div>';

const js_s2 =
  '// Small with jump-to-page\n' +
  'new MTS.Pagination(\'#pag-sm\', {\n' +
  '  total:    500,\n' +
  '  size:     \'sm\',\n' +
  '  showJump: true,  // input to jump to any page\n' +
  '});\n\n' +
  '// Medium (default)\n' +
  'new MTS.Pagination(\'#pag-md\', { total: 500, size: \'md\' });\n\n' +
  '// Large\n' +
  'new MTS.Pagination(\'#pag-lg\', { total: 500, size: \'lg\' });';

makeSection('tabs-s2', preview_s2, js_s2, html_s2);

new MTS.Pagination('#pag-sm', { total: 500, size: 'sm', showJump: true });
new MTS.Pagination('#pag-md', { total: 500, size: 'md' });
new MTS.Pagination('#pag-lg', { total: 500, size: 'lg' });

/* ============================================================
   S3 — Programmatic API
   ============================================================ */

const preview_s3 =
  '<div id="pag-api"></div>' +
  '<div class="demo-row" style="margin-top:8px;flex-wrap:wrap">' +
    '<button type="button" class="mts-btn mts-btn--secondary mts-btn--sm" id="btn-page1">setPage(1)</button>' +
    '<button type="button" class="mts-btn mts-btn--secondary mts-btn--sm" id="btn-page5">setPage(5)</button>' +
    '<button type="button" class="mts-btn mts-btn--secondary mts-btn--sm" id="btn-total500">setTotal(500)</button>' +
    '<button type="button" class="mts-btn mts-btn--secondary mts-btn--sm" id="btn-size50">setPageSize(50)</button>' +
    '<button type="button" class="mts-btn mts-btn--secondary mts-btn--sm" id="btn-state">getState()</button>' +
  '</div>' +
  '<div class="result-box" id="pag-api-res" style="margin-top:12px">' + (D.resultApiPlaceholder || '— use the buttons —') + '</div>';

const html_s3 =
  '<div id="my-pagination" data-total="250"></div>';

const js_s3 =
  'const pag = new MTS.Pagination(\'#my-pagination\', {\n' +
  '  total:    250,\n' +
  '  pageSize: 25,\n' +
  '  onChange: (e) => fetchData(e.detail.page, e.detail.pageSize),\n' +
  '});\n\n' +
  '// Navigate\n' +
  'pag.setPage(3);\n\n' +
  '// Update total after data load\n' +
  'pag.setTotal(500);\n\n' +
  '// Change page size (resets to page 1)\n' +
  'pag.setPageSize(50);\n\n' +
  '// Get current state\n' +
  'pag.getState();\n' +
  '// → { page: 1, pageSize: 50, total: 500, from: 1, to: 50 }';

makeSection('tabs-s3', preview_s3, js_s3, html_s3);

const pagApi = new MTS.Pagination('#pag-api', {
  total: 250, pageSize: 25,
  onChange: function(e) {
    document.getElementById('pag-api-res').textContent = (D.onChangePrefix || 'onChange → page: ') + e.detail.page;
  },
});

document.getElementById('btn-page1').addEventListener('click', function() {
  pagApi.setPage(1);
});
document.getElementById('btn-page5').addEventListener('click', function() {
  pagApi.setPage(5);
});
document.getElementById('btn-total500').addEventListener('click', function() {
  pagApi.setTotal(500);
  document.getElementById('pag-api-res').textContent = D.setTotalDone || 'setTotal(500) ✓';
});
document.getElementById('btn-size50').addEventListener('click', function() {
  pagApi.setPageSize(50);
  document.getElementById('pag-api-res').textContent = D.setPageSizeDone || 'setPageSize(50) ✓';
});
document.getElementById('btn-state').addEventListener('click', function() {
  document.getElementById('pag-api-res').textContent = JSON.stringify(pagApi.getState());
});

/* ============================================================
   S4 — siblings
   ============================================================ */

const preview_s4 =
  '<div class="demo-stack" style="gap:16px">' +
    '<div>' +
      '<div class="demo-label" style="margin-bottom:6px">siblings: 1 (default)</div>' +
      '<div id="pag-sib1"></div>' +
    '</div>' +
    '<div>' +
      '<div class="demo-label" style="margin-bottom:6px">siblings: 2</div>' +
      '<div id="pag-sib2"></div>' +
    '</div>' +
  '</div>';

const html_s4 =
  '<div id="pag-sib1" data-total="500"></div>\n' +
  '<div id="pag-sib2" data-total="500"></div>';

const js_s4 =
  '// siblings: pages shown on each side of the active page\n' +
  'new MTS.Pagination(\'#pag-sib1\', {\n' +
  '  total: 500, page: 5,\n' +
  '  siblings:  1,  // default — «... 4 [5] 6 ...»\n' +
  '  showSizes: false, showInfo: false,\n' +
  '});\n\n' +
  'new MTS.Pagination(\'#pag-sib2\', {\n' +
  '  total: 500, page: 5,\n' +
  '  siblings:  2,  // «... 3 4 [5] 6 7 ...»\n' +
  '  showSizes: false, showInfo: false,\n' +
  '});';

makeSection('tabs-s4', preview_s4, js_s4, html_s4);

new MTS.Pagination('#pag-sib1', { total: 500, page: 5, showSizes: false, showInfo: false, siblings: 1 });
new MTS.Pagination('#pag-sib2', { total: 500, page: 5, showSizes: false, showInfo: false, siblings: 2 });
