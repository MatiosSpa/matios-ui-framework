<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.SideNav — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-sidenav.css">
  <script src="../../support/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-sidenav.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.SideNav</h1>
    <p>Navegación lateral colapsable con grupos, submenús y badges.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-sidenav.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 — Básico</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Colapsable</div><div id="tabs-s2"></div></div>
</div>

<script>

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var sidenavApi;
var preview_s1 =
  '<div class="demo-stack">' +
    '<div class="demo-grid-outline demo-grid-outline--tall"><div id="sidenav-basic"></div></div>' +
    '<div class="result-box" id="sidenav-result">— selecciona un item —</div>' +
  '</div>';

var js_s1 =
  "new MTS.SideNav('#sidenav-basic', {\n" +
  "  active: 'dashboard',\n" +
  "  items: [\n" +
  "    { group: 'Main' },\n" +
  "    { id: 'dashboard', label: 'Dashboard', icon: MTS.Icon.get('grid') },\n" +
  "    { id: 'analytics', label: 'Analytics', icon: MTS.Icon.get('analytics'), badge: 'NEW' },\n" +
  "    { id: 'products', label: 'Products', icon: MTS.Icon.get('package'), children: [\n" +
  "      { id: 'all-products', label: 'All products' },\n" +
  "      { id: 'add-product', label: 'Add product' }\n" +
  "    ] },\n" +
  "    { divider: true },\n" +
  "    { group: 'Settings' },\n" +
  "    { id: 'settings', label: 'Settings', icon: MTS.Icon.get('cog') }\n" +
  "  ],\n" +
  "  onChange: function(e) { setResult('sidenav-result', 'active → ' + e.detail.item.id); }\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div class="demo-grid-outline demo-grid-outline--tall"><div id="sidenav-api"></div></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="sidenavApi.collapse()">collapse()</button>' +
      '<button class="demo-btn-sm" onclick="sidenavApi.expand()">expand()</button>' +
      '<button class="demo-btn-sm" onclick="sidenavApi.setActive(\'settings\')">setActive(\'settings\')</button>' +
    '</div>' +
    '<div class="result-box" id="sidenav-api-result">— usa la API —</div>' +
  '</div>';

var js_s2 =
  "var sidenavApi = new MTS.SideNav('#sidenav-api', {\n" +
  "  active: 'dashboard',\n" +
  "  items: [\n" +
  "    { id: 'dashboard', label: 'Dashboard', icon: MTS.Icon.get('grid') },\n" +
  "    { id: 'messages', label: 'Messages', icon: MTS.Icon.get('message-circle') },\n" +
  "    { id: 'settings', label: 'Settings', icon: MTS.Icon.get('cog') }\n" +
  "  ],\n" +
  "  onChange: function(e) { setResult('sidenav-api-result', 'active → ' + e.detail.item.id); }\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.SideNav('#sidenav-basic', {
    active: 'dashboard',
    items: [
      { group: 'Main' },
      { id: 'dashboard', label: 'Dashboard', icon: MTS.Icon.get('grid') },
      { id: 'analytics', label: 'Analytics', icon: MTS.Icon.get('analytics'), badge: 'NEW' },
      { id: 'products', label: 'Products', icon: MTS.Icon.get('package'), children: [
        { id: 'all-products', label: 'All products' },
        { id: 'add-product', label: 'Add product' }
      ] },
      { divider: true },
      { group: 'Settings' },
      { id: 'settings', label: 'Settings', icon: MTS.Icon.get('cog') }
    ],
    onChange: function(e) { setResult('sidenav-result', 'active → ' + e.detail.item.id); }
  });
}, '420px');

makeSection('tabs-s2', preview_s2, js_s2, function() {
  sidenavApi = new MTS.SideNav('#sidenav-api', {
    active: 'dashboard',
    items: [
      { id: 'dashboard', label: 'Dashboard', icon: MTS.Icon.get('grid') },
      { id: 'messages', label: 'Messages', icon: MTS.Icon.get('message-circle') },
      { id: 'settings', label: 'Settings', icon: MTS.Icon.get('cog') }
    ],
    onChange: function(e) { setResult('sidenav-api-result', 'active → ' + e.detail.item.id); }
  });
}, '420px');

</script>
</body>
</html>
