<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.SideNav — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.SideNav</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
</div>

<script>

/* ── Logo helper ── */
var LOGO_HTML = '<div style="width:28px;height:28px;background:linear-gradient(135deg,var(--mts-color-primary),var(--mts-color-accent,var(--mts-color-primary)));border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0">M</div>';

function indentHtml(html) {
  var indent = 0, step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) { indent = Math.max(0, indent - step); result += ' '.repeat(indent) + t + '\n'; }
    else if (/^<[^!]/.test(t)) { result += ' '.repeat(indent) + t + '\n'; var tag = (t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||''; if (!voids.test(tag) && !/\/>$/.test(t)) indent += step; }
    else { var text = t.replace(/\s+/g,' '); if (text) result += ' '.repeat(indent) + text + '\n'; }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.SideNav']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Collapsible side navigation. Requires an MTS.Menu instance in tree mode.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — With MTS.Menu';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Collapsible';

/* ════════════════════════════════════
   1 — WITH MTS.MENU
   ════════════════════════════════════ */
var js_s1 =
"var navMenu = new MTS.Menu({\n" +
"  items: [\n" +
"    { group: 'Main' },\n" +
"    { key: 'dashboard', label: 'Dashboard',  icon: 'mts-icon-home' },\n" +
"    { key: 'analytics', label: 'Analytics',  icon: 'mts-icon-bar-chart-2', badge: 'NEW' },\n" +
"    { key: 'products',  label: 'Products',   icon: 'mts-icon-package', children: [\n" +
"      { key: 'all-products', label: 'All products' },\n" +
"      { key: 'add-product',  label: 'Add product' }\n" +
"    ]},\n" +
"    { divider: true },\n" +
"    { group: 'Settings' },\n" +
"    { key: 'settings', label: 'Settings', icon: 'mts-icon-settings' }\n" +
"  ],\n" +
"  active: 'dashboard',\n" +
"  onClick: function(item) { /* your logic here */ }\n" +
"});\n\n" +
"new MTS.SideNav('#sidenav-basic', {\n" +
"  brand: {\n" +
"    logo:  '<!-- logo html -->',\n" +
"    title: 'MyApp',\n" +
"    onClick: function() { navMenu.setActive(''); }\n" +
"  },\n" +
"  menu:   navMenu,\n" +
"  footer: '<span>Matios UI · v2.0</span>'\n" +
"});";

makeSection('tabs-s1',
  '<div class="demo-stack">' +
    '<div class="demo-grid-outline demo-grid-outline--tall"><div id="sidenav-basic"></div></div>' +
    '<div class="result-box" id="sidenav-result">' + (D.resultBasic || '— select an item —') + '</div>' +
  '</div>',
  js_s1,
  function() {
    var navMenu = new MTS.Menu({
      items: [
        { group: D.groupMain || 'Main' },
        { key: 'dashboard', label: 'Dashboard',  icon: 'mts-icon-home' },
        { key: 'analytics', label: 'Analytics',  icon: 'mts-icon-bar-chart-2', badge: 'NEW' },
        { key: 'products',  label: 'Products',   icon: 'mts-icon-package', children: [
          { key: 'all-products', label: D.itemAllProducts || 'All products' },
          { key: 'add-product',  label: D.itemAddProduct || 'Add product' }
        ]},
        { divider: true },
        { group: D.groupSettings || 'Settings' },
        { key: 'settings', label: 'Settings', icon: 'mts-icon-settings' }
      ],
      active: 'dashboard',
      onClick: function(item) { setResult('sidenav-result', (D.activePrefix || 'active → ') + item.key); }
    });

    new MTS.SideNav('#sidenav-basic', {
      brand: {
        logo:  LOGO_HTML,
        title: 'MyApp',
        onClick: function() { navMenu.setActive(''); }
      },
      menu:   navMenu,
      footer: '<span style="font-size:10px;color:var(--mts-text-muted)">Matios UI · v2.0</span>'
    });
  },
'440px');

/* ════════════════════════════════════
   2 — COLLAPSIBLE
   ════════════════════════════════════ */
var sidenavApi;
var menuApi;

var js_s2 =
"var menuApi = new MTS.Menu({\n" +
"  items: [\n" +
"    { key: 'home',     label: 'Home',      icon: 'mts-icon-home' },\n" +
"    { key: 'messages', label: 'Messages',  icon: 'mts-icon-message-circle', badge: '5' },\n" +
"    { key: 'settings', label: 'Settings',  icon: 'mts-icon-settings' }\n" +
"  ],\n" +
"  active: 'home',\n" +
"  onClick: function(item) { /* your logic */ }\n" +
"});\n\n" +
"var sidenavApi = new MTS.SideNav('#sidenav-api', {\n" +
"  brand:     { logo: '<!-- logo -->', title: 'MyApp' },\n" +
"  menu:      menuApi,\n" +
"  collapsed: true,\n" +
"  onCollapse: function(e) { console.log('collapsed:', e.detail.collapsed); }\n" +
"});\n\n" +
"// Hover over the icons to see the label tooltip\n" +
"// Collapse API:\n" +
"sidenavApi.collapse();\n" +
"sidenavApi.expand();\n" +
"sidenavApi.toggleCollapse();\n" +
"menuApi.setActive('settings');";

makeSection('tabs-s2',
  '<div class="demo-stack">' +
    '<div class="demo-grid-outline demo-grid-outline--tall"><div id="sidenav-api"></div></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="sidenavApi.collapse()">collapse()</button>' +
      '<button class="demo-btn-sm" onclick="sidenavApi.expand()">expand()</button>' +
      '<button class="demo-btn-sm" onclick="sidenavApi.toggleCollapse()">toggleCollapse()</button>' +
      '<button class="demo-btn-sm" onclick="menuApi.setActive(\'settings\')">menu.setActive(\'settings\')</button>' +
    '</div>' +
    '<div class="result-box" id="sidenav-api-result">' + (D.resultApi || '— use the API —') + '</div>' +
  '</div>',
  js_s2,
  function() {
    menuApi = new MTS.Menu({
      items: [
        { key: 'home',     label: D.itemHome || 'Home',         icon: 'mts-icon-home' },
        { key: 'messages', label: D.itemMessages || 'Messages', icon: 'mts-icon-message-circle', badge: '5' },
        { key: 'settings', label: 'Settings', icon: 'mts-icon-settings' }
      ],
      active: 'home',
      onClick: function(item) { setResult('sidenav-api-result', (D.activePrefix || 'active → ') + item.key); }
    });

    sidenavApi = new MTS.SideNav('#sidenav-api', {
      brand:     { logo: LOGO_HTML, title: 'MyApp' },
      menu:      menuApi,
      collapsed: true,
      onCollapse: function(e) { setResult('sidenav-api-result', (D.collapsedPrefix || 'collapsed: ') + e.detail.collapsed); }
    });
  },
'440px');

</script>
</body>
