<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Menu — Demo</title>

  <style>
    .demo-topbar-wrap { border-radius:var(--mts-radius-lg);overflow:visible; }
    .demo-sidebar-wrap {
      display:flex;border-radius:var(--mts-radius-lg);overflow:hidden;
      border:1px solid var(--mts-border-color);height:300px;
    }
    .demo-sidebar-mock {
      width:240px;background:var(--mts-bg-surface);
      border-right:1px solid var(--mts-border-color);flex-shrink:0;overflow-y:auto;
    }
    .demo-content-mock {
      flex:1;display:flex;align-items:center;justify-content:center;
      color:var(--mts-text-muted);font-size:13px;
    }
    .demo-log {
      font-size:11px;font-family:'JetBrains Mono',monospace;
      color:var(--mts-color-primary);background:var(--mts-bg-surface-2);
      border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-md);
      padding:6px 12px;min-height:28px;margin-top:8px;
    }
    /* Panel redimensible para demostrar el overflow:"auto" (Priority+ Navigation).
       resize:horizontal necesita overflow!=visible; los dropdowns son position:fixed
       y escapan igual. */
    .demo-resize {
      resize:horizontal; overflow:hidden;
      min-width:320px; max-width:100%; width:680px;
      border:1px solid var(--mts-border-color); border-radius:var(--mts-radius-lg);
    }
    .demo-avatar {
      width:30px; height:30px; border-radius:50%;
      background:var(--mts-color-primary); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:12px; flex-shrink:0;
    }

<body>


<div class="demo-page">

  <div class="demo-header">
    <h1><span>MTS</span>.Menu</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <!-- ── 1 · HORIZONTAL in Topbar ── -->
  <div class="demo-section">
    <div class="demo-section-title" id="s1-title"></div>
    <div id="s1"></div>
  </div>

  <!-- ── 2 · TREE in SideNav ── -->
  <div class="demo-section">
    <div class="demo-section-title" id="s2-title"></div>
    <div id="s2"></div>
  </div>

  <!-- ── 3 · N LEVELS + badges + disabled ── -->
  <div class="demo-section">
    <div class="demo-section-title" id="s3-title"></div>
    <div id="s3"></div>
  </div>

  <!-- ── 4 · SAME INSTANCE: topbar + sidenav ── -->
  <div class="demo-section">
    <div class="demo-section-title" id="s4-title"></div>
    <div id="s4"></div>
  </div>

  <!-- ── 5 · PRIORITY+ NAVIGATION (overflow:"auto") ── -->
  <div class="demo-section">
    <div class="demo-section-title" id="s5-title"></div>
    <div id="s5"></div>
  </div>

</div>

<script>

// — Locale: shows English by default (public face); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Menu']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').innerHTML = D.subtitleHtml || 'Navigation menu with n levels, icons and a single <code>onClick</code> — for <strong>MTS.Topbar</strong> (horizontal) and <strong>MTS.SideNav</strong> (tree).';
document.getElementById('s1-title').textContent    = D.s1Title || '1 — Horizontal · MTS.Topbar + MTS.Menu';
document.getElementById('s2-title').textContent    = D.s2Title || '2 — Tree · MTS.SideNav + MTS.Menu';
document.getElementById('s3-title').textContent    = D.s3Title || '3 — N levels · badges · disabled';
document.getElementById('s4-title').textContent    = D.s4Title || '4 — One instance · Horizontal Topbar + Tree SideNav synced';
document.getElementById('s5-title').textContent    = D.s5Title || '5 — Priority+ Navigation · overflow:"auto"';

function fmt(tpl, item) {
  return String(tpl).replace('{key}', item.key).replace('{label}', item.label);
}

window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'setMode')   document.documentElement.setAttribute('data-mts-mode', e.data.mode);
  if (e.data.type === 'setAccent') {
    if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
    else document.documentElement.removeAttribute('data-mts-accent');
  }
});

function mk(id, html, js, h) {
  var cbHtml = id + '-cb-html';
  var cbJs   = id + '-cb-js';
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: h || '200px',
    tabs: [
      { id: id + '-p',    label: 'Preview',    content: '<div class="mts-p-4">' + html + '</div>' },
      { id: id + '-html', label: 'HTML',        content: '<div id="' + cbHtml + '" style="height:100%"></div>' },
      { id: id + '-js',   label: 'JavaScript',  content: '<div id="' + cbJs   + '" style="height:100%"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + cbHtml, { code: html.trim(), language: 'html', copyable: true, height: '100%' });
  new MTS.CodeBlock('#' + cbJs,   { code: js.trim(),   language: 'js',   copyable: true, height: '100%' });
}

var LOGO = '<div style="width:28px;height:28px;background:linear-gradient(135deg,var(--mts-color-primary),var(--mts-color-accent));border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px">M</div>';

/* ════════════════════════════════════
   1 · HORIZONTAL in Topbar
   ════════════════════════════════════ */
mk('s1',
'<div class="demo-topbar-wrap">\n' +
'  <div id="tb1"></div>\n' +
'</div>\n' +
'<div class="demo-log" id="log1">' + (D.logHint || '— click an item —') + '</div>',
"var menu1 = new MTS.Menu({\n" +
"  active: 'dashboard',\n" +
"  items: [\n" +
"    { key: 'dashboard', label: 'Dashboard', icon: 'mts-icon-home' },\n" +
"    { key: 'reportes',  label: 'Reports',   icon: 'mts-icon-bar-chart-2', children: [\n" +
"      { key: 'ventas',    label: 'Sales' },\n" +
"      { key: 'compras',   label: 'Purchases' },\n" +
"      { key: 'logistica', label: 'Logistics' },\n" +
"    ]},\n" +
"    { key: 'usuarios', label: 'Users', icon: 'mts-icon-users' },\n" +
"    { divider: true },\n" +
"    { key: 'config',   label: 'Config',   icon: 'mts-icon-settings' },\n" +
"  ],\n" +
"  onClick: function(item) { console.log(item.key); }\n" +
"});\n\n" +
"new MTS.Topbar('#tb1', {\n" +
"  brand: { logo: '...', title: 'My<span style=\"color:var(--mts-color-primary)\">App</span>' },\n" +
"  menu: menu1\n" +
"});",
'200px');

var menu1 = new MTS.Menu({
  active: 'dashboard',
  items: [
    { key: 'dashboard', label: D.lblDashboard || 'Dashboard', icon: 'mts-icon-home' },
    { key: 'reportes',  label: D.lblReports || 'Reports',     icon: 'mts-icon-bar-chart-2', children: [
      { key: 'ventas',    label: D.lblSales || 'Sales' },
      { key: 'compras',   label: D.lblPurchases || 'Purchases' },
      { key: 'logistica', label: D.lblLogistics || 'Logistics' },
    ]},
    { key: 'usuarios', label: D.lblUsers || 'Users', icon: 'mts-icon-users' },
    { divider: true },
    { key: 'config',   label: D.lblConfig || 'Config', icon: 'mts-icon-settings' },
  ],
  onClick: function(item) {
    var log = document.getElementById('log1');
    if (log) log.textContent = fmt(D.logResult || 'key: {key} · label: {label}', item);
  }
});

new MTS.Topbar('#tb1', {
  brand: { logo: LOGO, title: 'My<span style="color:var(--mts-color-primary)">App</span>' },
  menu: menu1
});

/* ════════════════════════════════════
   2 · TREE in SideNav
   ════════════════════════════════════ */
mk('s2',
'<div class="demo-sidebar-wrap">\n' +
'  <div id="sn2"></div>\n' +
'  <div class="demo-content-mock" id="content2">' + (D.selectHint || 'Select an item') + '</div>\n' +
'</div>',
"var menu2 = new MTS.Menu({\n" +
"  active: 'dashboard',\n" +
"  items: [\n" +
"    { key: 'dashboard', label: 'Dashboard', icon: 'mts-icon-home' },\n" +
"    { key: 'reportes',  label: 'Reports',   icon: 'mts-icon-bar-chart-2', children: [\n" +
"      { key: 'ventas',  label: 'Sales' },\n" +
"      { key: 'compras', label: 'Purchases' },\n" +
"    ]},\n" +
"    { divider: true },\n" +
"    { key: 'config',   label: 'Config',    icon: 'mts-icon-settings' },\n" +
"  ],\n" +
"  onClick: function(item) { console.log(item.key); }\n" +
"});\n\n" +
"new MTS.SideNav('#sn2', {\n" +
"  menu: menu2\n" +
"});",
'380px');

var menu2 = new MTS.Menu({
  active: 'dashboard',
  items: [
    { key: 'dashboard', label: D.lblDashboard || 'Dashboard', icon: 'mts-icon-home' },
    { key: 'reportes',  label: D.lblReports || 'Reports',     icon: 'mts-icon-bar-chart-2', children: [
      { key: 'ventas',  label: D.lblSales || 'Sales' },
      { key: 'compras', label: D.lblPurchases || 'Purchases' },
    ]},
    { divider: true },
    { key: 'config',   label: D.lblConfig || 'Config', icon: 'mts-icon-settings' },
  ],
  onClick: function(item) {
    var c = document.getElementById('content2');
    if (c) c.textContent = item.label;
  }
});

new MTS.SideNav('#sn2', { menu: menu2 });

/* ════════════════════════════════════
   3 · N LEVELS + badges + disabled
   ════════════════════════════════════ */
mk('s3',
'<div class="demo-sidebar-wrap">\n' +
'  <div id="sn3"></div>\n' +
'  <div class="demo-content-mock" id="content3">' + (D.selectHint || 'Select an item') + '</div>\n' +
'</div>',
"var menu3 = new MTS.Menu({\n" +
"  items: [\n" +
"    { key: 'home',  label: 'Home',        icon: 'mts-icon-home' },\n" +
"    { key: 'ops',   label: 'Operations',  icon: 'mts-icon-layers', badge: '3', children: [\n" +
"      { key: 'ops-ar', label: 'Argentina', children: [\n" +
"        { key: 'ops-ar-bs',  label: 'Buenos Aires' },\n" +
"        { key: 'ops-ar-cba', label: 'Córdoba' },\n" +
"      ]},\n" +
"      { key: 'ops-br', label: 'Brazil' },\n" +
"      { key: 'ops-cl', label: 'Chile', disabled: true },\n" +
"    ]},\n" +
"    { divider: true },\n" +
"    { key: 'admin', label: 'Admin', icon: 'mts-icon-shield', disabled: true },\n" +
"  ],\n" +
"  onClick: function(item) { console.log(item.key); }\n" +
"});\n\n" +
"new MTS.SideNav('#sn3', { menu: menu3 });",
'380px');

var menu3 = new MTS.Menu({
  items: [
    { key: 'home',  label: D.lblHome || 'Home',             icon: 'mts-icon-home' },
    { key: 'ops',   label: D.lblOperations || 'Operations', icon: 'mts-icon-layers', badge: '3', children: [
      { key: 'ops-ar', label: D.lblArgentina || 'Argentina', children: [
        { key: 'ops-ar-bs',  label: D.lblBuenosAires || 'Buenos Aires' },
        { key: 'ops-ar-cba', label: D.lblCordoba || 'Córdoba' },
      ]},
      { key: 'ops-br', label: D.lblBrazil || 'Brazil' },
      { key: 'ops-cl', label: D.lblChile || 'Chile', disabled: true },
    ]},
    { divider: true },
    { key: 'admin', label: D.lblAdmin || 'Admin', icon: 'mts-icon-shield', disabled: true },
  ],
  onClick: function(item) {
    var c = document.getElementById('content3');
    if (c) c.textContent = (D.keyPrefix || 'key: ') + item.key;
  }
});

new MTS.SideNav('#sn3', { menu: menu3 });

/* ════════════════════════════════════
   4 · SAME INSTANCE: topbar + sidenav
   ════════════════════════════════════ */
mk('s4',
'<div style="display:flex;flex-direction:column;border-radius:var(--mts-radius-lg);border:1px solid var(--mts-border-color)">\n' +
'  <div id="tb4"></div>\n' +
'  <div style="display:flex;height:260px">\n' +
'    <div id="sn4"></div>\n' +
'    <div class="demo-content-mock" id="content4">' + (D.selectHint || 'Select an item') + '</div>\n' +
'  </div>\n' +
'</div>',
"// A single instance — active state synced across topbar and sidebar\n" +
"var menu4 = new MTS.Menu({\n" +
"  active: 'inicio',\n" +
"  items: [\n" +
"    { key: 'inicio',   label: 'Home',    icon: 'mts-icon-home' },\n" +
"    { key: 'reportes', label: 'Reports', icon: 'mts-icon-bar-chart-2', children: [\n" +
"      { key: 'ventas',  label: 'Sales' },\n" +
"      { key: 'compras', label: 'Purchases' },\n" +
"    ]},\n" +
"    { key: 'usuarios', label: 'Users', icon: 'mts-icon-users', badge: '5' },\n" +
"  ],\n" +
"  onClick: function(item) {\n" +
"    document.getElementById('content4').textContent = item.label;\n" +
"  }\n" +
"});\n\n" +
"new MTS.Topbar('#tb4', {\n" +
"  brand: { logo: '...', title: 'App' },\n" +
"  menu: menu4\n" +
"});\n\n" +
"new MTS.SideNav('#sn4', {\n" +
"  collapsed: true,\n" +
"  menu: menu4\n" +
"});",
'420px');

var menu4 = new MTS.Menu({
  active: 'inicio',
  items: [
    { key: 'inicio',   label: D.lblHome || 'Home',       icon: 'mts-icon-home' },
    { key: 'reportes', label: D.lblReports || 'Reports', icon: 'mts-icon-bar-chart-2', children: [
      { key: 'ventas',  label: D.lblSales || 'Sales' },
      { key: 'compras', label: D.lblPurchases || 'Purchases' },
    ]},
    { key: 'usuarios', label: D.lblUsers || 'Users', icon: 'mts-icon-users', badge: '5' },
  ],
  onClick: function(item) {
    var c = document.getElementById('content4');
    if (c) c.textContent = item.label;
  }
});

new MTS.Topbar('#tb4', {
  brand: { logo: LOGO, title: 'App' },
  menu: menu4
});

new MTS.SideNav('#sn4', {
  collapsed: true,
  menu: menu4
});

/* ════════════════════════════════════
   5 · PRIORITY+ NAVIGATION (overflow:"auto")
   ════════════════════════════════════ */
mk('s5',
'<div class="demo-resize">\n' +
'  <div id="tb5"></div>\n' +
'</div>\n' +
'<div class="demo-log" id="hint5">' + (D.s5Hint || 'Resize the panel (drag the right edge →) — items that overflow collapse into "More".') + '</div>',
"// 13 módulos en un topbar — overflow agrupa lo que no entra en un \"Más\".\n" +
"var menu5 = new MTS.Menu({\n" +
"  items: modules,        // [{ key, label, icon }, …] ×13\n" +
"  overflow: 'auto'       // ← Priority+ Navigation (ResizeObserver)\n" +
"});\n\n" +
"new MTS.Topbar('#tb5', {\n" +
"  brand: { logo: '…', title: 'MatiosSPA' },\n" +
"  menu:  menu5,\n" +
"  end:   avatarEl        // el end-slot SIEMPRE queda reservado\n" +
"});",
'240px');

var ICON_POOL = ['mts-icon-home','mts-icon-bar-chart-2','mts-icon-users','mts-icon-settings','mts-icon-layers','mts-icon-shield'];
var modLabels = [
  D.lblDashboard || 'Dashboard', D.lblReports || 'Reports', D.lblSales || 'Sales',
  D.lblPurchases || 'Purchases', D.lblLogistics || 'Logistics', D.lblUsers || 'Users',
  D.lblConfig || 'Config', D.lblHome || 'Home', D.lblOperations || 'Operations',
  D.lblArgentina || 'Argentina', D.lblBrazil || 'Brazil', D.lblChile || 'Chile', D.lblAdmin || 'Admin'
];
var items5 = modLabels.map(function (lbl, i) {
  return { key: 'm' + i, label: lbl, icon: ICON_POOL[i % ICON_POOL.length] };
});

var menu5 = new MTS.Menu({
  active: 'm0',
  items: items5,
  overflow: 'auto',
  onClick: function (item) {
    var h = document.getElementById('hint5');
    if (h) h.textContent = fmt(D.logResult || 'key: {key} · label: {label}', item);
  }
});

new MTS.Topbar('#tb5', {
  brand: { logo: LOGO, title: 'Matios<span style="color:var(--mts-color-primary)">SPA</span>' },
  menu: menu5,
  end: '<div class="demo-avatar">GC</div>'
});

MTS.Icon.initAll();
</script>
</body>
</html>
