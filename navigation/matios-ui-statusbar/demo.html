<!DOCTYPE html>

  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
/* ── Locale: shows English by default (public face); ?lang=es|en|pt to switch ── */
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.StatusBar'] && MTS.getLocale()['MTS.StatusBar'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Bottom status bar with free slots (start, center, end). Ideal for secondary information: connection, version, environment, shortcuts, status messages. It is not navigation — it is context.';
document.getElementById('s1-title').textContent = D.s1Title || '1 — Default';
document.getElementById('s2-title').textContent = D.s2Title || '2 — Primary variant';
document.getElementById('s3-title').textContent = D.s3Title || '3 — Inverse variant';
document.getElementById('s4-title').textContent = D.s4Title || '4 — Center slot';
document.getElementById('s5-title').textContent = D.s5Title || '5 — Helper elements';
document.getElementById('s6-title').textContent = D.s6Title || '6 — Dynamic API';

/* ── Content helpers ──────────────────────────────── */
function buildStatus(label, dot) {
  return '<span class="mts-statusbar__item">' +
    '<span class="mts-statusbar__dot mts-statusbar__dot--' + dot + '"></span>' +
    label +
  '</span>';
}

function buildEnd(version) {
  return '<span class="mts-statusbar__item">Matios UI</span>' +
    '<span class="mts-statusbar__sep"></span>' +
    '<span class="mts-statusbar__item">' + version + '</span>';
}

/* ── indentHtml ───────────────────────────────────── */
function indentHtml(html) {
  var indent = 0;
  var tab = '  ';
  var result = '';
  var tokens = html.split(/(<[^>]+>)/g);
  for (var i = 0; i < tokens.length; i++) {
    var token = tokens[i].trim();
    if (!token) continue;
    if (/^<\//.test(token)) {
      indent = Math.max(0, indent - 1);
      result += tab.repeat(indent) + token + '\n';
    } else if (/^<[^!][^>]*[^/]>$/.test(token) && !/^<(br|hr|img|input|link|meta|area|base|col|embed|param|source|track|wbr)/i.test(token)) {
      result += tab.repeat(indent) + token + '\n';
      indent++;
    } else {
      result += tab.repeat(indent) + token + '\n';
    }
  }
  return result.trim();
}

/* ── makeSection ──────────────────────────────────── */
function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

/* ── S1 — Default ─────────────────────────────────── */
var appContent = D.appContent || 'app content';

var preview_s1 =
  '<div class="demo-frame">' +
    '<div class="demo-frame__body">' + appContent + '</div>' +
    '<div id="sb1"></div>' +
  '</div>';

var js_s1 =
'new MTS.StatusBar(\'#sb\', {\n' +
'  start:\n' +
'    \'<span class="mts-statusbar__item">\' +\n' +
'      \'<span class="mts-statusbar__dot mts-statusbar__dot--success"></span>\' +\n' +
'      \'Connected\' +\n' +
'    \'</span>\' +\n' +
'    \'<span class="mts-statusbar__sep"></span>\' +\n' +
'    \'<span class="mts-statusbar__item">\' +\n' +
'      \'<i class="mts-icon mts-icon-git-branch"></i> main\' +\n' +
'    \'</span>\',\n' +
'  end:\n' +
'    \'<span class="mts-statusbar__tag mts-statusbar__tag--primary">DEV</span>\' +\n' +
'    \'<span class="mts-statusbar__sep"></span>\' +\n' +
'    \'<span class="mts-statusbar__item">v1.0.0</span>\'\n' +
'});';

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.StatusBar('#sb1', {
    start:
      '<span class="mts-statusbar__item">' +
        '<span class="mts-statusbar__dot mts-statusbar__dot--success"></span>' +
        (D.connected || 'Connected') +
      '</span>' +
      '<span class="mts-statusbar__sep"></span>' +
      '<span class="mts-statusbar__item">' +
        '<i class="mts-icon mts-icon-git-branch" style="font-size:11px"></i>' +
        'main' +
      '</span>',
    end:
      '<span class="mts-statusbar__tag mts-statusbar__tag--primary">DEV</span>' +
      '<span class="mts-statusbar__sep"></span>' +
      '<span class="mts-statusbar__item">v1.0.0</span>'
  });
});

/* ── S2 — Primary ─────────────────────────────────── */

    '<div class="demo-frame__body">' + appContent + '</div>' +
    '<div id="sb2"></div>' +
  '</div>';

var js_s2 =
'new MTS.StatusBar(\'#sb\', {\n' +
'  variant: \'primary\',\n' +
'  start: \'...\',\n' +
'  end: \'...\'\n' +
'});';

makeSection('tabs-s2', preview_s2, js_s2, function() {

      '<span class="mts-statusbar__item mts-statusbar__item--clickable">' +
        '<i class="mts-icon mts-icon-git-branch" style="font-size:11px"></i>' +
        'main' +
      '</span>',
    end:

/* ── S3 — Inverse ─────────────────────────────────── */
var preview_s3 =
  '<div class="demo-frame">' +
    '<div class="demo-frame__body">' + appContent + '</div>' +
    '<div id="sb3"></div>' +
  '</div>';

var js_s3 =
'new MTS.StatusBar(\'#sb\', {\n' +
'  variant: \'inverse\',\n' +
'  start: \'...\',\n' +
'  end: \'...\'\n' +
'});';

makeSection('tabs-s3', preview_s3, js_s3, function() {

/* ── S4 — Center ──────────────────────────────────── */
var preview_s4 =

    '<div class="demo-frame__body">' + appContent + '</div>' +
    '<div id="sb4"></div>' +
  '</div>';

var js_s4 =
'new MTS.StatusBar(\'#sb\', {\n' +

/* ── S5 — Helper elements ─────────────────────────── */
var preview_s5 =

    '<div id="sb5"></div>' +
  '</div>';

var js_s5 =
'<!-- Status dots -->\n' +
'<span class="mts-statusbar__dot mts-statusbar__dot--success"></span>\n' +
'<span class="mts-statusbar__dot mts-statusbar__dot--warning"></span>\n' +
'<span class="mts-statusbar__dot mts-statusbar__dot--danger"></span>\n' +
'<span class="mts-statusbar__dot mts-statusbar__dot--muted"></span>\n' +
'\n' +
'<!-- Tags / pills -->\n' +
'<span class="mts-statusbar__tag mts-statusbar__tag--primary">primary</span>\n' +
'<span class="mts-statusbar__tag mts-statusbar__tag--success">success</span>\n' +
'<span class="mts-statusbar__tag mts-statusbar__tag--warning">warning</span>\n' +
'<span class="mts-statusbar__tag mts-statusbar__tag--danger">danger</span>\n' +
'\n' +

'<span class="mts-statusbar__sep"></span>\n' +

  new MTS.StatusBar('#sb5', {
    start:
      '<span class="mts-statusbar__item">' +
        '<span class="mts-statusbar__dot mts-statusbar__dot--success"></span>success' +
      '</span>' +
      '<span class="mts-statusbar__item">' +
        '<span class="mts-statusbar__dot mts-statusbar__dot--warning"></span>warning' +
      '</span>' +
      '<span class="mts-statusbar__item">' +

});

/* ── S6 — Dynamic API ─────────────────────────────── */
var preview_s6 =
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">' +
    '<button id="btn-s6-conectado" class="mts-btn mts-btn--secondary mts-btn--sm">' + (D.btnConnected || 'State: Connected') + '</button>' +

    '<button id="btn-s6-primary" class="mts-btn mts-btn--secondary mts-btn--sm">' + (D.btnPrimary || 'Variant: primary') + '</button>' +

    '<div class="demo-frame__body">' + appContent + '</div>' +
    '<div id="sb6"></div>' +
  '</div>';

var js_s6 =
'// Update slots individually\n' +
'sb.setStart(\'<span class="mts-statusbar__item">...</span>\');\n' +
'sb.setCenter(\'<span class="mts-statusbar__item">...</span>\');\n' +
'sb.setEnd(\'<span class="mts-statusbar__item">...</span>\');\n' +
'\n' +
'// Change variant on the fly\n' +
'sb.setVariant(\'primary\');   // \'default\' | \'primary\' | \'inverse\'\n' +
'\n' +
'// Direct reference to the slot element\n' +
'var el = sb.getSlot(\'start\');  // returns .mts-statusbar__start\n' +
'\n' +
'// Destroy\n' +
'sb.destroy();';

makeSection('tabs-s6', preview_s6, js_s6, function() {
  var sb6 = new MTS.StatusBar('#sb6', {
    start: buildStatus(D.connected || 'Connected', 'success'),
    end:   buildEnd('v1.0.0')
  });

  document.getElementById('btn-s6-conectado').addEventListener('click', function() {
    sb6.setStart(buildStatus(D.connected || 'Connected', 'success'));
  });
  document.getElementById('btn-s6-sinconexion').addEventListener('click', function() {
    sb6.setStart(buildStatus(D.disconnected || 'Offline', 'danger'));
  });
  document.getElementById('btn-s6-version').addEventListener('click', function() {
    sb6.setEnd(buildEnd('v2.1.0'));
  });
  document.getElementById('btn-s6-default').addEventListener('click', function() {
    sb6.setVariant('default');
  });
  document.getElementById('btn-s6-primary').addEventListener('click', function() {
    sb6.setVariant('primary');

  document.getElementById('btn-s6-inverse').addEventListener('click', function() {
    sb6.setVariant('inverse');
  });
});

/* ── Icons ────────────────────────────────────────── */
if (window.MTS && MTS.Icon) MTS.Icon.initAll();
</script>
