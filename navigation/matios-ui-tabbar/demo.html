<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.TabBar — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../shared/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-tabbar.css">
  <script src="../../shared/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-tabbar.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.TabBar</h1>
    <p>Barra de navegación tipo app móvil con variantes, badges y API básica.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-tabbar.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 — Base</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Variantes</div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — API</div><div id="tabs-s3"></div></div>
</div>

<script>

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="tb-base"></div>' +
    '<div class="result-box" id="tb-result">— cambia de tab —</div>' +
  '</div>';

var js_s1 =
  "new MTS.TabBar('#tb-base', {\n" +
  "  active: 'home',\n" +
  "  tabs: [\n" +
  "    { id: 'home', label: 'Home', icon: MTS.Icon.get('home') },\n" +
  "    { id: 'search', label: 'Search', icon: MTS.Icon.get('search') },\n" +
  "    { id: 'inbox', label: 'Inbox', icon: MTS.Icon.get('inbox'), badge: 3 },\n" +
  "    { id: 'profile', label: 'Profile', icon: MTS.Icon.get('contact') }\n" +
  "  ],\n" +
  "  onChange: function(e) { setResult('tb-result', 'active → ' + e.detail.id); }\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div class="demo-col"><div class="demo-label">Pill</div><div id="tb-pill"></div></div>' +
    '<div class="demo-col"><div class="demo-label">Floating</div><div id="tb-floating"></div></div>' +
  '</div>';

var js_s2 =
  "var tabs = [\n" +
  "  { id: 'home', label: 'Home', icon: MTS.Icon.get('home') },\n" +
  "  { id: 'activity', label: 'Activity', icon: MTS.Icon.get('activity') },\n" +
  "  { id: 'messages', label: 'Messages', icon: MTS.Icon.get('message-circle'), badge: 2 },\n" +
  "  { id: 'settings', label: 'Settings', icon: MTS.Icon.get('cog') }\n" +
  "];\n" +
  "new MTS.TabBar('#tb-pill', { variant: 'pill', tabs: tabs });\n" +
  "new MTS.TabBar('#tb-floating', { variant: 'floating', tabs: tabs });";

var preview_s3 =
  '<div class="demo-stack">' +
    '<div id="tb-api"></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="tbApi.setActive(\'search\')">setActive(\'search\')</button>' +
      '<button class="demo-btn-sm" onclick="tbApi.setBadge(\'inbox\', 9)">setBadge(\'inbox\', 9)</button>' +
    '</div>' +
    '<div class="result-box" id="tb-api-result">— usa la API —</div>' +
  '</div>';

var js_s3 =
  "var tbApi = new MTS.TabBar('#tb-api', {\n" +
  "  active: 'home',\n" +
  "  tabs: [\n" +
  "    { id: 'home', label: 'Home', icon: MTS.Icon.get('home') },\n" +
  "    { id: 'search', label: 'Search', icon: MTS.Icon.get('search') },\n" +
  "    { id: 'inbox', label: 'Inbox', icon: MTS.Icon.get('inbox'), badge: 1 }\n" +
  "  ],\n" +
  "  onChange: function(e) { setResult('tb-api-result', 'active → ' + e.detail.id); }\n" +
  "});";

var tbApi;
makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.TabBar('#tb-base', {
    active: 'home',
    tabs: [
      { id: 'home', label: 'Home', icon: MTS.Icon.get('home') },
      { id: 'search', label: 'Search', icon: MTS.Icon.get('search') },
      { id: 'inbox', label: 'Inbox', icon: MTS.Icon.get('inbox'), badge: 3 },
      { id: 'profile', label: 'Profile', icon: MTS.Icon.get('contact') }
    ],
    onChange: function(e) { setResult('tb-result', 'active → ' + e.detail.id); }
  });
});

makeSection('tabs-s2', preview_s2, js_s2, function() {
  var tabs = [
    { id: 'home', label: 'Home', icon: MTS.Icon.get('home') },
    { id: 'activity', label: 'Activity', icon: MTS.Icon.get('activity') },
    { id: 'messages', label: 'Messages', icon: MTS.Icon.get('message-circle'), badge: 2 },
    { id: 'settings', label: 'Settings', icon: MTS.Icon.get('cog') }
  ];
  new MTS.TabBar('#tb-pill', { variant: 'pill', tabs: tabs });
  new MTS.TabBar('#tb-floating', { variant: 'floating', tabs: tabs });
});

makeSection('tabs-s3', preview_s3, js_s3, function() {
  tbApi = new MTS.TabBar('#tb-api', {
    active: 'home',
    tabs: [
      { id: 'home', label: 'Home', icon: MTS.Icon.get('home') },
      { id: 'search', label: 'Search', icon: MTS.Icon.get('search') },
      { id: 'inbox', label: 'Inbox', icon: MTS.Icon.get('inbox'), badge: 1 }
    ],
    onChange: function(e) { setResult('tb-api-result', 'active → ' + e.detail.id); }
  });
});

</script>
</body>
</html>
