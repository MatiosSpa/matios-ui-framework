<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Topbar — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-crimson.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-rose.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-orange.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-sky.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-indigo.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-teal.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-slate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-bronze.css">
  <link rel="stylesheet" href="../../css-helpers/matios-ui-css-helpers.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">
  <link rel="stylesheet" href="../../utilities/matios-ui-codeblock/matios-ui-codeblock.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-sidenav/matios-ui-sidenav.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-menu/matios-ui-menu.css">
  <link rel="stylesheet" href="./matios-ui-topbar.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../support/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../forms/matios-ui-copybutton/matios-ui-copybutton.js"></script>
  <script src="../../utilities/matios-ui-codeblock/matios-ui-codeblock.js"></script>
  <script src="../../navigation/matios-ui-menu/matios-ui-menu.js"></script>
  <script src="../../navigation/matios-ui-sidenav/matios-ui-sidenav.js"></script>
  <script src="../../base/matios-ui-i18n.js"></script>
  <script src="./matios-ui-topbar-i18n.js"></script>
  <script src="./matios-ui-topbar.js"></script>
</head>
<body>


<div class="demo-page">

  <div class="demo-header">
    <h1><span>MTS</span>.Topbar</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <!-- ── 1 · BASIC ── -->
  <div class="demo-section">
    <div class="demo-section-title" id="s1-title"></div>
    <div id="s1"></div>
  </div>

  <!-- ── 2 · START + END SLOTS ── -->
  <div class="demo-section">
    <div class="demo-section-title" id="s2-title"></div>
    <div id="s2"></div>
  </div>

  <!-- ── 3 · DIVIDER AND GROUPED ACTIONS ── -->
  <div class="demo-section">
    <div class="demo-section-title" id="s3-title"></div>
    <div id="s3"></div>
  </div>

  <!-- ── 4 · FULL LAYOUT ── -->
  <div class="demo-section">
    <div class="demo-section-title" id="s4-title"></div>
    <div id="s4"></div>
  </div>

</div>

<script>
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'setMode')   document.documentElement.setAttribute('data-mts-mode', e.data.mode);
  if (e.data.type === 'setAccent') {
    if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
    else document.documentElement.removeAttribute('data-mts-accent');
  }
});

// — Locale: shows English by default (public face); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Topbar']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Top bar for dashboards and apps — brand, content slots and composition with SideNav.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Basic';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Start and end slots';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Divider and grouped actions';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Full layout (Topbar + SideNav)';

function mk(id, html, js, h) {
  var cbHtml = id + '-cb-html';
  var cbJs   = id + '-cb-js';
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: h || '200px',
    tabs: [
      { id: id + '-p',    label: 'Preview',     content: '<div class="mts-p-4">' + html + '</div>' },
      { id: id + '-html', label: 'HTML',         content: '<div id="' + cbHtml + '" style="height:100%"></div>' },
      { id: id + '-js',   label: 'JavaScript',   content: '<div id="' + cbJs   + '" style="height:100%"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + cbHtml, { code: html.trim(), language: 'html', copyable: true, height: '100%' });
  new MTS.CodeBlock('#' + cbJs,   { code: js.trim(),   language: 'js',   copyable: true, height: '100%' });
}

/* ── Logo helper ── */
var LOGO_HTML = '<div style="width:28px;height:28px;background:linear-gradient(135deg,var(--mts-color-primary),var(--mts-color-accent));border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0">M</div>';

/* ════════════════════════════════════
   1 · BASIC
   ════════════════════════════════════ */
mk('s1',
'<div id="tb1" style="border-radius:var(--mts-radius-lg);overflow:hidden"></div>',
"new MTS.Topbar('#tb1', {\n" +
"  brand: {\n" +
"    logo: '<!-- div with gradient -->',\n" +
"    title: 'My<span style=\"color:var(--mts-color-primary)\">App</span>',\n" +
"    onClick: function() { alert('Brand clicked'); }\n" +
"  }\n" +
"});",
'160px');

new MTS.Topbar('#tb1', {
  brand: {
    logo: LOGO_HTML,
    title: 'My<span style="color:var(--mts-color-primary)">App</span>',
    onClick: function() { alert(D.brandAlert || 'Brand clicked'); }
  }
});

/* ════════════════════════════════════
   2 · START + END SLOTS
   ════════════════════════════════════ */
mk('s2',
'<div id="tb2" style="border-radius:var(--mts-radius-lg);overflow:hidden"></div>',
"var tb2 = new MTS.Topbar('#tb2', {\n" +
"  brand: {\n" +
"    logo: '...',\n" +
"    title: 'Dashboard',\n" +
"    subtitle: 'v1.0.0'\n" +
"  },\n" +
"  end: '<button class=\"mts-btn mts-btn--ghost mts-btn--sm mts-btn--icon\" title=\"Notifications\">...</button>' +\n" +
"       '<button class=\"mts-btn mts-btn--secondary mts-btn--sm\">My account</button>'\n" +
"});",
'160px');

new MTS.Topbar('#tb2', {
  brand: {
    logo: LOGO_HTML,
    title: 'Dashboard',
    subtitle: 'v1.0.0'
  },
  end: '<button class="mts-btn mts-btn--ghost mts-btn--sm mts-btn--icon" title="' + (D.notificationsTitle || 'Notifications') + '"><i class="mts-icon mts-icon-bell"></i></button>' +
       '<button class="mts-btn mts-btn--secondary mts-btn--sm"><span class="mts-btn__label">' + (D.accountLabel || 'My account') + '</span></button>'
});

/* ════════════════════════════════════
   3 · DIVIDER AND GROUPED ACTIONS
   ════════════════════════════════════ */
mk('s3',
'<div id="tb3" style="border-radius:var(--mts-radius-lg);overflow:hidden"></div>',
"new MTS.Topbar('#tb3', {\n" +
"  brand: { logo: '...', title: 'CRM' },\n" +
"  start: '<span style=\"font-size:11px;color:var(--mts-text-muted)\">Customers / List</span>',\n" +
"  end:\n" +
"    '<button class=\"mts-btn mts-btn--ghost mts-btn--sm mts-btn--icon\">...</button>' +\n" +
"    '<button class=\"mts-btn mts-btn--ghost mts-btn--sm mts-btn--icon\">...</button>' +\n" +
"    '<span class=\"mts-topbar__divider\"></span>' +\n" +
"    '<button class=\"mts-btn mts-btn--primary mts-btn--sm\">+ New</button>'\n" +
"});",
'160px');

new MTS.Topbar('#tb3', {
  brand: { logo: LOGO_HTML, title: 'CRM' },
  start: '<span style="font-size:11px;color:var(--mts-text-muted)">' + (D.breadcrumb || 'Customers / List') + '</span>',
  end:
    '<button class="mts-btn mts-btn--ghost mts-btn--sm mts-btn--icon" title="' + (D.searchTitle || 'Search') + '"><i class="mts-icon mts-icon-search"></i></button>' +
    '<button class="mts-btn mts-btn--ghost mts-btn--sm mts-btn--icon" title="' + (D.settingsTitle || 'Settings') + '"><i class="mts-icon mts-icon-settings"></i></button>' +
    '<span class="mts-topbar__divider"></span>' +
    '<button class="mts-btn mts-btn--primary mts-btn--sm"><span class="mts-btn__label">' + (D.newButton || '+ New') + '</span></button>'
});

/* ════════════════════════════════════
   4 · FULL LAYOUT
   ════════════════════════════════════ */
mk('s4',
'<div style="height:260px;display:flex;flex-direction:column;border-radius:var(--mts-radius-lg);overflow:hidden;border:1px solid var(--mts-border-color)">\n' +
'  <div id="tb4"></div>\n' +
'  <div style="display:flex;flex:1;overflow:hidden">\n' +
'    <div id="sn4"></div>\n' +
'    <div style="flex:1;padding:16px;display:flex;align-items:center;justify-content:center;color:var(--mts-text-muted);font-size:13px">\n' +
'      ' + (D.mainContent || 'Main content') + '\n' +
'    </div>\n' +
'  </div>\n' +
'</div>',
"var sn4Menu = new MTS.Menu({\n" +
"  items: [\n" +
"    { key: 'home',      label: 'Home',      icon: 'mts-icon-home' },\n" +
"    { key: 'analytics', label: 'Analytics', icon: 'mts-icon-bar-chart-2' },\n" +
"    { key: 'users',     label: 'Users',     icon: 'mts-icon-users', badge: '3' },\n" +
"    { divider: true },\n" +
"    { key: 'settings',  label: 'Settings',  icon: 'mts-icon-settings' }\n" +
"  ],\n" +
"  active: 'home',\n" +
"  onClick: function(item) { console.log('nav:', item.key); }\n" +
"});\n\n" +
"new MTS.Topbar('#tb4', {\n" +
"  brand: { logo: '...', title: 'Dashboard' },\n" +
"  end: '<button class=\"mts-btn mts-btn--ghost mts-btn--sm mts-btn--icon\">...</button>'\n" +
"});\n\n" +
"new MTS.SideNav('#sn4', {\n" +
"  collapsed: true,\n" +
"  menu: sn4Menu\n" +
"});",
'380px');

(function() {
  var sn4Menu = new MTS.Menu({
    items: [
      { key: 'home',      label: (D.navHome || 'Home'),          icon: 'mts-icon-home' },
      { key: 'analytics', label: (D.navAnalytics || 'Analytics'), icon: 'mts-icon-bar-chart-2' },
      { key: 'users',     label: (D.navUsers || 'Users'),        icon: 'mts-icon-users', badge: '3' },
      { divider: true },
      { key: 'settings',  label: (D.navSettings || 'Settings'),  icon: 'mts-icon-settings' }
    ],
    active: 'home',
    onClick: function(item) { console.log('nav:', item.key); }
  });

  new MTS.Topbar('#tb4', {
    brand: { logo: LOGO_HTML, title: 'Dashboard' },
    end: '<button class="mts-btn mts-btn--ghost mts-btn--sm mts-btn--icon" title="' + (D.profileTitle || 'Profile') + '"><i class="mts-icon mts-icon-user"></i></button>'
  });

  new MTS.SideNav('#sn4', {
    collapsed: true,
    menu: sn4Menu
  });
})();
</script>
</body>
</html>
