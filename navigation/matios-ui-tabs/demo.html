  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
/* ============================================================
   LOCALE
   ============================================================ */

// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function () {

  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Tabs'] && MTS.getLocale()['MTS.Tabs'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Underline, pill and card — horizontal and vertical — icons, badges and programmatic API.';
document.getElementById('demo-notice').innerHTML     = D.notice   || 'Note: this demo uses a manual shell for <strong>Preview | HTML | JavaScript</strong> to avoid the clash between the outer and inner <strong>MTS.Tabs</strong> within the same component.';
document.getElementById('s1-title').textContent      = D.s1Title  || '1 — Underline (default)';
document.getElementById('s2-title').textContent      = D.s2Title  || '2 — Pill';
document.getElementById('s3-title').textContent      = D.s3Title  || '3 — Card';
document.getElementById('s4-title').textContent      = D.s4Title  || '4 — Vertical';
document.getElementById('s5-title').textContent      = D.s5Title  || '5 — With icons and badges';
document.getElementById('s6-title').textContent      = D.s6Title  || '6 — API — programmatic setActive()';

/* ============================================================
   UTILITIES
   ============================================================ */

function indentHtml(html) {
  let indent   = 0;
  const step   = 2;
  const voids  = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  let result   = '';
  const tokens = String(html).match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    const t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      const tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      const text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

/*
 * makeShellSection — builds the manual Preview | HTML | JavaScript shell.
 * A custom shell is used (instead of MTS.Tabs) to avoid a clash
 * between the demo tabs and the MTS.Tabs component being demonstrated.
 * The code is shown with MTS.CodeBlock.
 *
 * @param {string} hostId  — id of the container
 * @param {object} config
 *   @param {string}   config.previewHtml — preview HTML
 *   @param {string}   [config.htmlCode]  — HTML snippet for the HTML tab
 *   @param {string}   [config.jsCode]    — example JS code
 *   @param {function} [config.mount]     — callback that receives previewEl on mount
 */
function makeShellSection(hostId, config) {
  const host = document.getElementById(hostId);
  if (!host) return;

  // Stack wrapper
  const stack = document.createElement('div');
  stack.className = 'demo-stack';

  // Button group
  const btnGroup = document.createElement('div');
  btnGroup.className = 'mts-btn-group';
  btnGroup.setAttribute('role', 'tablist');
  btnGroup.setAttribute('aria-label', 'Demo code tabs');

  const panelNames  = ['preview', 'html', 'js'];
  const panelLabels = { preview: 'Preview', html: 'HTML', js: 'JavaScript' };

  // Panel elements
  const panelEls = {};
  panelNames.forEach(function(name) {
    const el = document.createElement('div');
    el.setAttribute('data-demo-content', name);
    if (name !== 'preview') el.style.display = 'none';
    panelEls[name] = el;
  });

  // Buttons
  panelNames.forEach(function(name, i) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mts-btn mts-btn--secondary mts-btn--sm' + (i === 0 ? ' mts-btn--active' : '');
    btn.setAttribute('data-demo-panel', name);
    btn.textContent = panelLabels[name];
    btn.addEventListener('click', function() {
      btnGroup.querySelectorAll('[data-demo-panel]').forEach(function(b) {
        b.classList.toggle('mts-btn--active', b === btn);
      });
      panelNames.forEach(function(n) {
        panelEls[n].style.display = n === name ? 'block' : 'none';
      });
    });
    btnGroup.appendChild(btn);
  });

  stack.appendChild(btnGroup);
  panelNames.forEach(function(name) { stack.appendChild(panelEls[name]); });
  host.appendChild(stack);

  // Preview content (component HTML string — accepted exception)
  panelEls.preview.innerHTML = config.previewHtml;

  // MTS.CodeBlock for HTML and JavaScript
  const htmlRaw = config.htmlCode || indentHtml(config.previewHtml);
  const jsRaw   = config.jsCode   || '// No JavaScript required for this example.';

  new MTS.CodeBlock(panelEls.html, {
    language: 'html',
    code:     htmlRaw,
    copyable: true,
  });

  new MTS.CodeBlock(panelEls.js, {
    language: 'javascript',
    code:     jsRaw,
    copyable: true,
  });

  if (typeof config.mount === 'function') {
    config.mount(panelEls.preview);
  }
}

/* ============================================================
   HELPERS
   ============================================================ */

function tabsContent(label) {
  var prefix = D.contentPrefix || 'Content of ';
  var suffix = D.contentSuffix || '.';
  return '<div style="padding:16px;font-size:14px;color:var(--mts-text-secondary)">' +
    '<p style="margin:0">' + prefix + '<strong>' + label + '</strong>' + suffix + '</p>' +
  '</div>';
}

const iconInbox = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>';
const iconSent  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';

/* ============================================================
   SECTIONS
   ============================================================ */

// S1 — Underline (default)
makeShellSection('shell-s1', {
  previewHtml:
    '<div id="tabs-underline"></div>' +
    '<div class="result-box" id="tabs-result" style="margin-top:12px">' + (D.resultPlaceholder || '— switch tabs —') + '</div>',
  htmlCode:
    '<div id="my-tabs"></div>',
  jsCode:
    'new MTS.Tabs(\'#my-tabs\', {\n' +
    '  variant: \'underline\',\n' +
    '  active: \'overview\',\n' +
    '  tabs: [\n' +
    '    { id: \'overview\', label: \'Overview\', content: \'<p>Overview content</p>\' },\n' +
    '    { id: \'details\',  label: \'Details\',  content: \'<p>Details content</p>\' },\n' +
    '    { id: \'history\',  label: \'History\',  content: \'<p>History content</p>\', disabled: true },\n' +
    '  ],\n' +
    '  onChange: function (e) {\n' +
    '    console.log(e.detail.id);\n' +
    '    console.log(e.detail.tab);\n' +
    '  },\n' +
    '});',
  mount: function() {
    new MTS.Tabs('#tabs-underline', {
      variant: 'underline',
      tabs: [
        { id: 'overview', label: 'Overview', content: tabsContent('Overview') },
        { id: 'details',  label: 'Details',  content: tabsContent('Details') },
        { id: 'history',  label: 'History',  content: tabsContent('History') },
        { id: 'disabled', label: 'Disabled', content: tabsContent('Disabled'), disabled: true },
      ],
      onChange: function(e) {
        document.getElementById('tabs-result').textContent = (D.onChangePrefix || 'onChange → id: ') + e.detail.id;
      },
    });
  },
});

// S2 — Pill
makeShellSection('shell-s2', {
  previewHtml: '<div id="tabs-pill"></div>',
  htmlCode:
    '<div id="my-tabs"></div>',
  jsCode:
    'new MTS.Tabs(\'#my-tabs\', {\n' +
    '  variant: \'pill\',\n' +
    '  tabs: [\n' +
    '    { id: \'day\',   label: \'Day\',   content: \'<p>Daily view</p>\' },\n' +
    '    { id: \'week\',  label: \'Week\',  content: \'<p>Weekly view</p>\' },\n' +
    '    { id: \'month\', label: \'Month\', content: \'<p>Monthly view</p>\' },\n' +
    '  ],\n' +
    '});',
  mount: function() {
    new MTS.Tabs('#tabs-pill', {
      variant: 'pill',
      tabs: [
        { id: 'day',   label: 'Day',   content: tabsContent('Day') },
        { id: 'week',  label: 'Week',  content: tabsContent('Week') },
        { id: 'month', label: 'Month', content: tabsContent('Month') },
      ],
    });
  },
});

// S3 — Card
makeShellSection('shell-s3', {
  previewHtml: '<div id="tabs-card"></div>',
  htmlCode:
    '<div id="my-tabs"></div>',
  jsCode:
    'new MTS.Tabs(\'#my-tabs\', {\n' +
    '  variant: \'card\',\n' +
    '  tabs: [\n' +
    '    { id: \'html\', label: \'HTML\', content: \'<pre><code>&lt;div&gt;Hello world&lt;/div&gt;</code></pre>\' },\n' +
    '    { id: \'css\',  label: \'CSS\',  content: \'<pre><code>div { color: red; }</code></pre>\' },\n' +
    '    { id: \'js\',   label: \'JS\',   content: \'<pre><code>console.log("hello");</code></pre>\' },\n' +
    '  ],\n' +
    '});',
  mount: function() {
    new MTS.Tabs('#tabs-card', {
      variant: 'card',
      tabs: [
        { id: 'html', label: 'HTML', content: '<pre style="margin:12px;font-size:12px;color:var(--mts-text-secondary)">&lt;div&gt;Hello world&lt;/div&gt;</pre>' },
        { id: 'css',  label: 'CSS',  content: '<pre style="margin:12px;font-size:12px;color:var(--mts-text-secondary)">div { color: red; }</pre>' },
        { id: 'js',   label: 'JS',   content: '<pre style="margin:12px;font-size:12px;color:var(--mts-text-secondary)">console.log("hello");</pre>' },
      ],
    });
  },
});

// S4 — Vertical
makeShellSection('shell-s4', {
  previewHtml: '<div id="tabs-vertical" style="min-height:220px"></div>',
  htmlCode:
    '<div id="my-tabs"></div>',
  jsCode:
    'new MTS.Tabs(\'#my-tabs\', {\n' +
    '  variant:   \'card\',\n' +
    '  direction: \'vertical\',\n' +
    '  navWidth:  \'160px\',\n' +
    '  height:    \'220px\',\n' +
    '  tabs: [\n' +
    '    { id: \'profile\',  label: \'Profile\',       content: \'<p>User profile settings</p>\' },\n' +
    '    { id: \'security\', label: \'Security\',      content: \'<p>Password and 2FA</p>\' },\n' +
    '    { id: \'billing\',  label: \'Billing\',       content: \'<p>Payment methods</p>\' },\n' +
    '    { id: \'notif\',    label: \'Notifications\', content: \'<p>Email preferences</p>\' },\n' +
    '  ],\n' +
    '});',
  mount: function() {
    new MTS.Tabs('#tabs-vertical', {
      variant:   'card',
      direction: 'vertical',
      navWidth:  '160px',
      height:    '220px',
      tabs: [
        { id: 'profile',  label: 'Profile',       content: tabsContent('Profile') },
        { id: 'security', label: 'Security',      content: tabsContent('Security') },
        { id: 'billing',  label: 'Billing',       content: tabsContent('Billing') },
        { id: 'notif',    label: 'Notifications', content: tabsContent('Notifications') },

});

// S5 — Icons and badges
makeShellSection('shell-s5', {
  previewHtml: '<div id="tabs-icons"></div>',
  htmlCode:
    '<div id="my-tabs"></div>',
  jsCode:
    'const ICON_INBOX = \'<svg>...</svg>\';\n' +
    'const ICON_SENT  = \'<svg>...</svg>\';\n\n' +
    'new MTS.Tabs(\'#my-tabs\', {\n' +
    '  variant: \'underline\',\n' +
    '  tabs: [\n' +
    '    { id: \'inbox\',  label: \'Inbox\',  icon: ICON_INBOX, badge: 5,     content: \'<p>5 new messages</p>\' },\n' +
    '    { id: \'sent\',   label: \'Sent\',   icon: ICON_SENT,  badge: null,  content: \'<p>Sent messages</p>\' },\n' +
    '    { id: \'drafts\', label: \'Drafts\',                   badge: \'NEW\', content: \'<p>Draft messages</p>\' },\n' +
    '  ],\n' +
    '});',
  mount: function() {
    new MTS.Tabs('#tabs-icons', {
      variant: 'underline',
      tabs: [
        { id: 'inbox',  label: 'Inbox',  icon: iconInbox, badge: 5,    content: tabsContent('Inbox') },
        { id: 'sent',   label: 'Sent',   icon: iconSent,  badge: null, content: tabsContent('Sent') },
        { id: 'drafts', label: 'Drafts',                  badge: 'NEW', content: tabsContent('Drafts') },
      ],
    });
  },
});

// S6 — Programmatic API
makeShellSection('shell-s6', {
  previewHtml:
    '<div id="tabs-api"></div>' +
    '<div class="demo-row" style="margin-top:8px;flex-wrap:wrap">' +
      '<button type="button" class="mts-btn mts-btn--secondary mts-btn--sm" id="btn-alpha">setActive(\'alpha\')</button>' +
      '<button type="button" class="mts-btn mts-btn--secondary mts-btn--sm" id="btn-beta">setActive(\'beta\')</button>' +
      '<button type="button" class="mts-btn mts-btn--secondary mts-btn--sm" id="btn-add">addTab(\'delta\')</button>' +
      '<button type="button" class="mts-btn mts-btn--secondary mts-btn--sm" id="btn-remove">removeTab(\'delta\')</button>' +
    '</div>' +
    '<div class="result-box" id="tabs-api-result" style="margin-top:12px">' + (D.apiResultPlaceholder || '— use the buttons —') + '</div>',
  htmlCode:
    '<div id="my-tabs"></div>\n' +
    '<div class="demo-row">\n' +
    '  <button type="button" class="mts-btn mts-btn--secondary mts-btn--sm">setActive(\'alpha\')</button>\n' +
    '  <button type="button" class="mts-btn mts-btn--secondary mts-btn--sm">setActive(\'beta\')</button>\n' +
    '  <button type="button" class="mts-btn mts-btn--secondary mts-btn--sm">addTab(\'delta\')</button>\n' +
    '  <button type="button" class="mts-btn mts-btn--secondary mts-btn--sm">removeTab(\'delta\')</button>\n' +
    '</div>',
  jsCode:
    'const tabs = new MTS.Tabs(\'#my-tabs\', {\n' +
    '  tabs: [\n' +
    '    { id: \'alpha\', label: \'Alpha\', content: \'<p>Alpha</p>\' },\n' +
    '    { id: \'beta\',  label: \'Beta\',  content: \'<p>Beta</p>\' },\n' +
    '    { id: \'gamma\', label: \'Gamma\', content: \'<p>Gamma</p>\' },\n' +
    '  ],\n' +
    '  onChange: function (e) {\n' +
    '    console.log(\'active:\', e.detail.id);\n' +
    '  },\n' +
    '});\n\n' +
    'tabs.setActive(\'beta\');\n' +
    'tabs.addTab({ id: \'delta\', label: \'Delta\', content: \'<p>Delta</p>\' });\n' +
    'tabs.removeTab(\'delta\');',
  mount: function() {
    const tabsApi = new MTS.Tabs('#tabs-api', {
      tabs: [
        { id: 'alpha', label: 'Alpha', content: tabsContent('Alpha') },
        { id: 'beta',  label: 'Beta',  content: tabsContent('Beta') },
        { id: 'gamma', label: 'Gamma', content: tabsContent('Gamma') },
      ],
      onChange: function(e) {
        document.getElementById('tabs-api-result').textContent = (D.onChangePrefix || 'onChange → id: ') + e.detail.id;
      },
    });

    document.getElementById('btn-alpha').addEventListener('click', function() {
      tabsApi.setActive('alpha');
    });
    document.getElementById('btn-beta').addEventListener('click', function() {
      tabsApi.setActive('beta');
    });
    document.getElementById('btn-add').addEventListener('click', function() {
      tabsApi.addTab({ id: 'delta', label: 'Delta', content: tabsContent('Delta') });
      document.getElementById('tabs-api-result').textContent = (D.addTabPrefix || 'addTab → id: ') + 'delta';
    });
    document.getElementById('btn-remove').addEventListener('click', function() {
      tabsApi.removeTab('delta');
      document.getElementById('tabs-api-result').textContent = (D.removeTabPrefix || 'removeTab → id: ') + 'delta';
    });
  },
});
</script>
