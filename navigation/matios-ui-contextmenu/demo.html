<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.ContextMenu — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-contextmenu.css">
  <script src="../../support/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-contextmenu.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.ContextMenu</h1>
    <p>Menú contextual por click derecho con acciones, iconos y shortcuts.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-contextmenu.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 — Básico</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Iconos y acciones</div><div id="tabs-s2"></div></div>
</div>

<script>

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="ctx-zone-basic" class="demo-grid-outline demo-grid-outline--tall">Click derecho aquí / Right click here</div>' +
    '<div class="result-box" id="ctx-result-basic">— abre el menú contextual —</div>' +
  '</div>';

var js_s1 =
  "new MTS.ContextMenu('#ctx-zone-basic', {\n" +
  "  items: [\n" +
  "    { id: 'copy', label: 'Copy' },\n" +
  "    { id: 'cut', label: 'Cut' },\n" +
  "    { id: 'paste', label: 'Paste' },\n" +
  "    { divider: true },\n" +
  "    { id: 'delete', label: 'Delete', danger: true }\n" +
  "  ],\n" +
  "  onSelect: function(e) { setResult('ctx-result-basic', 'select → ' + e.detail.id); }\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="ctx-zone-icons" class="demo-grid-outline demo-grid-outline--tall">Zona con iconos y shortcuts</div>' +
    '<div class="result-box" id="ctx-result-icons">— click derecho para probar items con iconos —</div>' +
  '</div>';

var js_s2 =
  "new MTS.ContextMenu('#ctx-zone-icons', {\n" +
  "  items: [\n" +
  "    { id: 'open', label: 'Open', icon: MTS.Icon.get('folder-open') },\n" +
  "    { id: 'copy', label: 'Copy', icon: MTS.Icon.get('copy'), shortcut: '⌘C' },\n" +
  "    { id: 'paste', label: 'Paste', icon: MTS.Icon.get('paste'), shortcut: '⌘V' },\n" +
  "    { divider: true },\n" +
  "    { id: 'delete', label: 'Delete', icon: MTS.Icon.get('trash'), danger: true }\n" +
  "  ],\n" +
  "  onSelect: function(e) { setResult('ctx-result-icons', 'select → ' + e.detail.id); }\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.ContextMenu('#ctx-zone-basic', {
    items: [
      { id: 'copy', label: 'Copy' },
      { id: 'cut', label: 'Cut' },
      { id: 'paste', label: 'Paste' },
      { divider: true },
      { id: 'delete', label: 'Delete', danger: true }
    ],
    onSelect: function(e) { setResult('ctx-result-basic', 'select → ' + e.detail.id); }
  });
}, '320px');

makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.ContextMenu('#ctx-zone-icons', {
    items: [
      { id: 'open', label: 'Open', icon: MTS.Icon.get('folder-open') },
      { id: 'copy', label: 'Copy', icon: MTS.Icon.get('copy'), shortcut: '⌘C' },
      { id: 'paste', label: 'Paste', icon: MTS.Icon.get('paste'), shortcut: '⌘V' },
      { divider: true },
      { id: 'delete', label: 'Delete', icon: MTS.Icon.get('trash'), danger: true }
    ],
    onSelect: function(e) { setResult('ctx-result-icons', 'select → ' + e.detail.id); }
  });
}, '320px');

</script>
</body>
</html>
