<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS Navigation — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../base/matios-ui-base.css">
  <link rel="stylesheet" href="../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../themes/matios-ui-mode-high-contrast.css">
  
  <link rel="stylesheet" href="../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="matios-ui-accordion/matios-ui-accordion.css">
  <link rel="stylesheet" href="../shared/demo-shared.css">
  <script src="../shared/demo-shared.js"></script>
  <script src="matios-ui-accordion/matios-ui-accordion.js"></script>
</head>
<body>
  <div class="demo-page demo-page--launcher">
    <div class="demo-header">
      <h1>MTS <span>Navigation</span></h1>
      <p>tabs · accordion · breadcrumb · stepper · drawer · dropdown · tabbar · pagination · contextmenu · commandpalette · sidenav</p>
    </div>

    <div id="navigation-launcher" class="demo-launcher"></div>
  </div>

  <script>
    initGroupLauncher('#navigation-launcher', [
      { id: 'tabs', component: 'tabs', title: 'MTS.Tabs', subtitle: 'Pestañas underline, pill, card y bordered — horizontal y vertical', src: 'matios-ui-tabs/demo.html' },
      { id: 'accordion', component: 'accordion', title: 'MTS.Accordion', subtitle: 'Secciones expandibles — individual o múltiple', src: 'matios-ui-accordion/demo.html' },
      { id: 'breadcrumb', component: 'breadcrumb', title: 'MTS.Breadcrumb', subtitle: 'Ruta de navegación con separadores, íconos y colapso', src: 'matios-ui-breadcrumb/demo.html' },
      { id: 'stepper', component: 'stepper', title: 'MTS.Stepper', subtitle: 'Flujo paso a paso — horizontal y vertical', src: 'matios-ui-stepper/demo.html' },
      { id: 'stepperProgress', component: 'stepProgress', title: 'MTS.StepProgress', subtitle: 'Flujo paso a paso — horizontal y vertical', src: 'matios-ui-stepprogress/demo.html' },
      { id: 'drawer', component: 'drawer', title: 'MTS.Drawer', subtitle: 'Panel lateral deslizante — derecha, izquierda, arriba, abajo', src: 'matios-ui-drawer/demo.html' },
      { id: 'dropdown', component: 'dropdown', title: 'MTS.Dropdown', subtitle: 'Menú desplegable con grupos, íconos, shortcuts y submenús', src: 'matios-ui-dropdown/demo.html' },
      { id: 'tabbar', component: 'tabbar', title: 'MTS.TabBar', subtitle: 'Navegación estilo app mobile — default, pill y floating', src: 'matios-ui-tabbar/demo.html' },
      { id: 'pagination', component: 'pagination', title: 'MTS.Pagination', subtitle: 'Paginación con resumen, page size y salto a página', src: 'matios-ui-pagination/demo.html' },
      { id: 'contextmenu', component: 'contextmenu', title: 'MTS.ContextMenu', subtitle: 'Menú contextual con click derecho y long press', src: 'matios-ui-contextmenu/demo.html' },
      { id: 'commandpalette', component: 'commandpalette', title: 'MTS.CommandPalette', subtitle: 'Paleta de comandos con búsqueda, grupos y shortcuts', src: 'matios-ui-commandpalette/demo.html' },
      { id: 'sidenav', component: 'sidenav', title: 'MTS.SideNav', subtitle: 'Navegación lateral colapsable con submenús y badges', src: 'matios-ui-sidenav/demo.html' }
    ]);
  </script>
</body>
</html>
