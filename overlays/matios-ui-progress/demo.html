<!DOCTYPE html>

  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trim();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>'   }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Progress'].demo) || {};

function fmtStep(value) {
  return (D.stepFormat || 'Step {value} of 10').replace('{value}', value);
}
function fmtChange(value, pct) {
  return (D.onChangeEcho || 'onChange → value:{value} pct:{pct}%').replace('{value}', value).replace('{pct}', pct);
}

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Bar · circle · indeterminate — variants, striped, animated and API methods.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Linear bars';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Striped and sizes';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Circular';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Indeterminate + API';

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="bar-default"></div>' +
    '<div id="bar-primary"></div>' +
    '<div id="bar-success"></div>' +
    '<div id="bar-warning"></div>' +
    '<div id="bar-danger"></div>' +
    '<div id="bar-info"></div>' +
    '<div id="bar-label"></div>' +
  '</div>';

var js_s1 =
  "new MTS.Progress('#bar-default', { type: 'bar', value: 20, variant: 'default', showValue: true });\n" +
  "new MTS.Progress('#bar-primary', { type: 'bar', value: 35, variant: 'primary', showValue: true });\n" +
  "new MTS.Progress('#bar-success', { type: 'bar', value: 55, variant: 'success', showValue: true });\n" +
  "new MTS.Progress('#bar-warning', { type: 'bar', value: 70, variant: 'warning', showValue: true });\n" +
  "new MTS.Progress('#bar-danger',  { type: 'bar', value: 85, variant: 'danger', showValue: true });\n" +
  "new MTS.Progress('#bar-info',    { type: 'bar', value: 95, variant: 'info', showValue: true });\n\n" +
  "new MTS.Progress('#bar-label', {\n" +
  "  type: 'bar',\n" +
  "  value: 3,\n" +
  "  max: 10,\n" +
  "  variant: 'primary',\n" +
  "  showLabel: true,\n" +
  "  label: 'Onboarding',\n" +
  "  labelFormat: function(value) { return 'Paso ' + value + ' de 10'; }\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="bar-striped"></div>' +
    '<div id="bar-animated"></div>' +
    '<div id="bar-xs"></div>' +
    '<div id="bar-sm"></div>' +
    '<div id="bar-md"></div>' +
    '<div id="bar-lg"></div>' +
  '</div>';

var js_s2 =
  "new MTS.Progress('#bar-striped', { type: 'bar', value: 60, striped: true, variant: 'primary', showValue: true });\n" +
  "new MTS.Progress('#bar-animated', { type: 'bar', value: 75, striped: true, animated: true, variant: 'success', showValue: true });\n\n" +
  "['xs','sm','md','lg'].forEach(function(size) {\n" +
  "  new MTS.Progress('#bar-' + size, {\n" +
  "    type: 'bar',\n" +
  "    value: 65,\n" +
  "    size: size,\n" +
  "    variant: 'primary',\n" +
  "    showValue: true,\n" +
  "    label: 'size: ' + size,\n" +
  "    showLabel: true\n" +
  "  });\n" +
  "});";

var preview_s3 =
  '<div class="demo-row">' +
    '<div id="circle-primary"></div>' +
    '<div id="circle-success"></div>' +
    '<div id="circle-warning"></div>' +
    '<div id="circle-danger"></div>' +
  '</div>';

var js_s3 =
  "new MTS.Progress('#circle-primary', { type: 'circle', value: 75, radius: 44, strokeWidth: 7, showValue: true, variant: 'primary' });\n" +
  "new MTS.Progress('#circle-success', { type: 'circle', value: 85, radius: 44, strokeWidth: 7, showValue: true, variant: 'success' });\n" +
  "new MTS.Progress('#circle-warning', { type: 'circle', value: 55, radius: 44, strokeWidth: 7, showValue: true, variant: 'warning' });\n" +
  "new MTS.Progress('#circle-danger',  { type: 'circle', value: 35, radius: 44, strokeWidth: 7, showValue: true, variant: 'danger' });";

var preview_s4 =
  '<div class="demo-stack">' +
    '<div id="pr-indeterminate"></div>' +
    '<div id="pr-api"></div>' +
    '<div class="demo-row">' +
      '<button id="btn-set-0" data-label="setValue(0)" data-variant="secondary"></button>' +
      '<button id="btn-inc-10" data-label="increment(10)" data-variant="primary"></button>' +
      '<button id="btn-set-100" data-label="setValue(100)" data-variant="success"></button>' +
      '<button id="btn-var-success" data-label="setVariant(success)" data-variant="secondary"></button>' +
      '<button id="btn-var-danger" data-label="setVariant(danger)" data-variant="danger"></button>' +
      '<button id="btn-reset" data-label="reset()" data-variant="ghost"></button>' +
    '</div>' +
    '<div class="result-box" id="pr-result">' + (D.resultHint || '— use the buttons —') + '</div>' +
  '</div>';

var js_s4 =
  "new MTS.Progress('#pr-indeterminate', { type: 'indeterminate', variant: 'primary' });\n\n" +
  "const prApi = new MTS.Progress('#pr-api', {\n" +
  "  type: 'bar',\n" +
  "  value: 30,\n" +
  "  variant: 'primary',\n" +
  "  showValue: true,\n" +
  "  onChange: function(e) {\n" +
  "    document.getElementById('pr-result').textContent = 'onChange → value:' + e.detail.value + ' pct:' + Math.round(e.detail.pct * 100) + '%';\n" +
  "  },\n" +
  "  onComplete: function() {\n" +
  "    document.getElementById('pr-result').textContent = 'onComplete → ¡Completado!';\n" +
  "  }\n" +
  "});\n\n" +
  "new MTS.Button('#btn-set-0');\n" +
  "new MTS.Button('#btn-inc-10');\n" +
  "new MTS.Button('#btn-set-100');\n" +
  "new MTS.Button('#btn-var-success');\n" +
  "new MTS.Button('#btn-var-danger');\n" +
  "new MTS.Button('#btn-reset');\n\n" +
  "document.getElementById('btn-set-0').addEventListener('click', function() { prApi.setValue(0); });\n" +
  "document.getElementById('btn-inc-10').addEventListener('click', function() { prApi.increment(10); });\n" +
  "document.getElementById('btn-set-100').addEventListener('click', function() { prApi.setValue(100); });\n" +
  "document.getElementById('btn-var-success').addEventListener('click', function() { prApi.setVariant('success'); });\n" +
  "document.getElementById('btn-var-danger').addEventListener('click', function() { prApi.setVariant('danger'); });\n" +
  "document.getElementById('btn-reset').addEventListener('click', function() { prApi.reset(); });";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.Progress('#bar-default', { type: 'bar', value: 20, variant: 'default', showValue: true });
  new MTS.Progress('#bar-primary', { type: 'bar', value: 35, variant: 'primary', showValue: true });
  new MTS.Progress('#bar-success', { type: 'bar', value: 55, variant: 'success', showValue: true });
  new MTS.Progress('#bar-warning', { type: 'bar', value: 70, variant: 'warning', showValue: true });
  new MTS.Progress('#bar-danger',  { type: 'bar', value: 85, variant: 'danger', showValue: true });
  new MTS.Progress('#bar-info',    { type: 'bar', value: 95, variant: 'info', showValue: true });
  new MTS.Progress('#bar-label', {
    type: 'bar', value: 3, max: 10, variant: 'primary', showLabel: true, label: (D.onboardingLabel || 'Onboarding'),
    labelFormat: function(value) { return fmtStep(value); }
  });
});

makeSection('tabs-s2', preview_s2, js_s2, function() {

  new MTS.Progress('#bar-animated', { type: 'bar', value: 75, striped: true, animated: true, variant: 'success', showValue: true });
  ['xs','sm','md','lg'].forEach(function(size) {
    new MTS.Progress('#bar-' + size, {
      type: 'bar', value: 65, size: size, variant: 'primary', showValue: true, label: 'size: ' + size, showLabel: true
    });
  });
});

makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.Progress('#circle-primary', { type: 'circle', value: 75, radius: 44, strokeWidth: 7, showValue: true, variant: 'primary' });
  new MTS.Progress('#circle-success', { type: 'circle', value: 85, radius: 44, strokeWidth: 7, showValue: true, variant: 'success' });
  new MTS.Progress('#circle-warning', { type: 'circle', value: 55, radius: 44, strokeWidth: 7, showValue: true, variant: 'warning' });
  new MTS.Progress('#circle-danger',  { type: 'circle', value: 35, radius: 44, strokeWidth: 7, showValue: true, variant: 'danger' });
});

makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.Progress('#pr-indeterminate', { type: 'indeterminate', variant: 'primary' });
  var prApi = new MTS.Progress('#pr-api', {
    type: 'bar',
    value: 30,
    variant: 'primary',
    showValue: true,
    onChange: function(e) {
      document.getElementById('pr-result').textContent = fmtChange(e.detail.value, Math.round(e.detail.pct * 100));
    },
    onComplete: function() {
      document.getElementById('pr-result').textContent = (D.onCompleteEcho || 'onComplete → Completed!');
    }
  });

  ['#btn-set-0','#btn-inc-10','#btn-set-100','#btn-var-success','#btn-var-danger','#btn-reset'].forEach(function(sel){
    new MTS.Button(sel);
  });

  document.getElementById('btn-set-0').addEventListener('click', function() { prApi.setValue(0); });
  document.getElementById('btn-inc-10').addEventListener('click', function() { prApi.increment(10); });
  document.getElementById('btn-set-100').addEventListener('click', function() { prApi.setValue(100); });
  document.getElementById('btn-var-success').addEventListener('click', function() { prApi.setVariant('success'); });
  document.getElementById('btn-var-danger').addEventListener('click', function() { prApi.setVariant('danger'); });
  document.getElementById('btn-reset').addEventListener('click', function() { prApi.reset(); });
});
</script>
