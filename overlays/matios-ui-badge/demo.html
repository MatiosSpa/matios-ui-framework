<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Badge</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>

  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s3-title"></div><div id="tabs-s3"></div></div>
</div>

<script>
function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>'   }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Badge']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Badges, pills and counters — CSS-only or via JS — removable tags and notification dots.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — CSS only';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Sizes and shapes';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Via JS';

var txtNoneNeeded      = D.jsNoneNeeded || '// No JavaScript needed.';
var txtCssOnly         = D.jsCssOnly || '// This variant uses only the component CSS classes.';
var txtCssShapes       = D.jsCssShapes || '// Sizes, shapes and dot/pulse work with CSS classes only.';
var txtResultPlaceholder = D.resultPlaceholder || '— use the buttons or remove a tag —';
var txtRemovePrefix    = D.removePrefix || 'onRemove → ';

var preview_s1 = `
<div class="demo-row" style="flex-wrap:wrap;gap:8px">
  <span class="mts-badge">Default</span>
  <span class="mts-badge mts-badge--primary">Primary</span>
  <span class="mts-badge mts-badge--success">Success</span>
  <span class="mts-badge mts-badge--warning">Warning</span>
  <span class="mts-badge mts-badge--danger">Danger</span>
  <span class="mts-badge mts-badge--info">Info</span>
  <span class="mts-badge mts-badge--accent">Accent</span>
</div>`;

var js_s1 = txtNoneNeeded + '\n' + txtCssOnly;

var preview_s2 = `
<div class="demo-row" style="flex-wrap:wrap;gap:12px;align-items:center">
  <span class="mts-badge mts-badge--primary mts-badge--xs">XS</span>
  <span class="mts-badge mts-badge--primary mts-badge--sm">SM</span>
  <span class="mts-badge mts-badge--primary">MD</span>
  <span class="mts-badge mts-badge--primary mts-badge--lg">LG</span>
  <span style="width:1px;height:20px;background:var(--mts-border-color)"></span>
  <span class="mts-badge mts-badge--success">Pill</span>
  <span class="mts-badge mts-badge--success mts-badge--square">Square</span>
  <span class="mts-badge mts-badge--danger mts-badge--dot mts-badge--pulse"></span>
</div>`;

var js_s2 = txtNoneNeeded + '\n' + txtCssShapes;

var preview_s3 = `
<div class="demo-stack">
  <div class="demo-row" style="flex-wrap:wrap;gap:16px;align-items:center;padding:8px 0">
    <span id="badge-count"></span>
    <div id="tag-container" style="display:flex;gap:6px;flex-wrap:wrap">
      <span id="tag-ts"></span>
      <span id="tag-react"></span>
      <span id="tag-css"></span>
    </div>
    <div style="position:relative;display:inline-flex">
      <button id="btn-notifs" data-label="Notifs" data-variant="secondary"></button>
      <span id="badge-dot" style="position:absolute;top:-4px;right:-4px"></span>
    </div>
  </div>
  <div class="demo-row" style="gap:8px;flex-wrap:wrap">
    <button id="btn-count-0" data-label="setCount(0)" data-variant="secondary"></button>
    <button id="btn-count-5" data-label="setCount(5)" data-variant="secondary"></button>
    <button id="btn-count-100" data-label="setCount(100)" data-variant="primary"></button>
  </div>
  <div class="result-box" id="badge-result">` + txtResultPlaceholder + `</div>
</div>`;

var js_s3 = `new MTS.Button('#btn-notifs');
new MTS.Button('#btn-count-0');
new MTS.Button('#btn-count-5');
new MTS.Button('#btn-count-100');

const badge = new MTS.Badge('#badge-count', {
  count: 42,
  maxCount: 99,
  variant: 'danger',
  shape: 'pill',
  size: 'md'
});

document.getElementById('btn-count-0').addEventListener('click', function () {
  badge.setCount(0);
});
document.getElementById('btn-count-5').addEventListener('click', function () {
  badge.setCount(5);
});
document.getElementById('btn-count-100').addEventListener('click', function () {
  badge.setCount(100);
});

function makeTag(id, label, variant) {
  new MTS.Badge('#' + id, {
    label: label,
    variant: variant,
    removable: true,
    onRemove: function (e) {
      e.detail.badge._el.remove();
      document.getElementById('badge-result').textContent = 'onRemove → "' + label + '"';
    }
  });
}

makeTag('tag-ts', 'TypeScript', 'primary');
makeTag('tag-react', 'React', 'info');
makeTag('tag-css', 'CSS', 'success');

new MTS.Badge('#badge-dot', {
  dot: true,
  pulse: true,
  variant: 'danger'
});`;

makeSection('tabs-s1', preview_s1, js_s1);
makeSection('tabs-s2', preview_s2, js_s2);
makeSection('tabs-s3', preview_s3, js_s3);

var bdCount = null;

function mountBadgeDemo() {
  new MTS.Button('#btn-notifs');
  new MTS.Button('#btn-count-0');
  new MTS.Button('#btn-count-5');
  new MTS.Button('#btn-count-100');

  bdCount = new MTS.Badge('#badge-count', {
    count: 42,
    maxCount: 99,
    variant: 'danger'
  });

  document.getElementById('btn-count-0').addEventListener('click', function () {
    bdCount.setCount(0);
  });
  document.getElementById('btn-count-5').addEventListener('click', function () {
    bdCount.setCount(5);
  });
  document.getElementById('btn-count-100').addEventListener('click', function () {
    bdCount.setCount(100);
  });

  function makeTag(id, label, variant) {
    new MTS.Badge('#' + id, {
      label: label,
      variant: variant,
      removable: true,
      onRemove: function (e) {
        e.detail.badge._el.remove();
        document.getElementById('badge-result').textContent = txtRemovePrefix + '"' + label + '"';
      }
    });
  }

  makeTag('tag-ts', 'TypeScript', 'primary');
  makeTag('tag-react', 'React', 'info');
  makeTag('tag-css', 'CSS', 'success');

  new MTS.Badge('#badge-dot', {
    dot: true,
    pulse: true,
    variant: 'danger'
  });
}

mountBadgeDemo();
</script>
