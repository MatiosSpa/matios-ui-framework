<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">

  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>'   }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Tooltip']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Tooltip with smart positioning — hover, click, focus, dark/light variants and HTML content.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Positions';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Triggers';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Variants and HTML';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — initAll()';

var labelTop     = D.labelTop     || 'Top';
var labelBottom  = D.labelBottom  || 'Bottom';
var labelLeft    = D.labelLeft    || 'Left';
var labelRight   = D.labelRight   || 'Right';
var labelHover   = D.labelHover   || 'Hover';
var labelClick   = D.labelClick   || 'Click';
var labelDark    = D.labelDark    || 'Dark';
var labelLight   = D.labelLight   || 'Light';
var labelHtml    = D.labelHtml    || 'With HTML';
var labelCustom  = D.labelCustom  || 'Custom color';
var labelDelay   = D.labelDelay   || 'With delay';
var focusPlaceholder = D.focusPlaceholder || 'Focus me';

var ttTop        = D.ttTop        || 'Tooltip top';
var ttBottom     = D.ttBottom     || 'Tooltip bottom';
var ttLeft       = D.ttLeft       || 'Tooltip left';
var ttRight      = D.ttRight      || 'Tooltip right';
var ttHover      = D.ttHover      || 'Hover tooltip';
var ttClick      = D.ttClick      || 'Click again to hide';
var ttFocus      = D.ttFocus      || 'Enter your email address';
var ttDark       = D.ttDark       || 'Dark variant (default)';
var ttLight      = D.ttLight      || 'Light variant';
var ttHtml       = D.ttHtml       || '<strong>Pro tip:</strong> Use ⌘S to save.';
var ttCustom     = D.ttCustom     || 'Custom violet tooltip';
var ttDelay      = D.ttDelay      || 'Appears after 500ms';
var ttDataTop    = D.ttDataTop    || 'Tooltip from data-tooltip';
var ttDataBottom = D.ttDataBottom || 'Bottom position';
var ttDataLight  = D.ttDataLight  || 'Light variant';
var ttDataClick  = D.ttDataClick  || 'Click trigger';

var preview_s1 = `
<div class="demo-row" style="justify-content:center;gap:16px;padding:24px 0;flex-wrap:wrap">
  <button id="tt-top" data-label="${labelTop}" data-variant="secondary"></button>
  <button id="tt-bottom" data-label="${labelBottom}" data-variant="secondary"></button>
  <button id="tt-left" data-label="${labelLeft}" data-variant="secondary"></button>
  <button id="tt-right" data-label="${labelRight}" data-variant="secondary"></button>
</div>`;

var js_s1 = `new MTS.Button('#tt-top');
new MTS.Button('#tt-bottom');
new MTS.Button('#tt-left');
new MTS.Button('#tt-right');

new MTS.Tooltip('#tt-top', { content: 'Tooltip arriba', position: 'top' });
new MTS.Tooltip('#tt-bottom', { content: 'Tooltip abajo', position: 'bottom' });
new MTS.Tooltip('#tt-left', { content: 'Tooltip izquierda', position: 'left' });
new MTS.Tooltip('#tt-right', { content: 'Tooltip derecha', position: 'right' });`;

var preview_s2 = `
<div class="demo-row" style="gap:16px;padding:12px 0;flex-wrap:wrap">
  <button id="tt-hover" data-label="${labelHover}" data-variant="secondary"></button>
  <button id="tt-click" data-label="${labelClick}" data-variant="secondary"></button>
  <input id="tt-focus" class="mts-input" placeholder="${focusPlaceholder}" style="width:180px">
</div>`;

var js_s2 = `new MTS.Button('#tt-hover');
new MTS.Button('#tt-click');
new MTS.Input('#tt-focus');

new MTS.Tooltip('#tt-hover', {
  content: 'Hover tooltip',
  trigger: 'hover'
});

new MTS.Tooltip('#tt-click', {
  content: 'Click again to hide',
  trigger: 'click'
});

new MTS.Tooltip('#tt-focus', {
  content: 'Enter your email address',
  trigger: 'focus',
  position: 'bottom'
});`;

var preview_s3 = `
<div class="demo-row" style="gap:16px;padding:12px 0;flex-wrap:wrap">
  <button id="tt-dark" data-label="${labelDark}" data-variant="secondary"></button>
  <button id="tt-light" data-label="${labelLight}" data-variant="secondary"></button>
  <button id="tt-html" data-label="${labelHtml}" data-variant="secondary"></button>
  <button id="tt-custom" data-label="${labelCustom}" data-variant="secondary"></button>
  <button id="tt-delay" data-label="${labelDelay}" data-variant="secondary"></button>
</div>`;

var js_s3 = `new MTS.Button('#tt-dark');
new MTS.Button('#tt-light');
new MTS.Button('#tt-html');
new MTS.Button('#tt-custom');
new MTS.Button('#tt-delay');

new MTS.Tooltip('#tt-dark', {
  content: 'Variante oscura (default)',
  variant: 'dark'
});

new MTS.Tooltip('#tt-light', {
  content: 'Variante clara',
  variant: 'light'
});

new MTS.Tooltip('#tt-html', {
  content: '<strong>Pro tip:</strong> Usa ⌘S para guardar.',
  position: 'bottom',
  maxWidth: 200
});

new MTS.Tooltip('#tt-custom', {
  content: 'Tooltip violeta custom',
  bg: '#7c3aed',
  color: '#ffffff'
});

new MTS.Tooltip('#tt-delay', {
  content: 'Aparece tras 500ms',
  delay: 500,
  hideDelay: 200
});`;

var preview_s4 = `
<div class="demo-row" style="gap:12px;padding:12px 0;flex-wrap:wrap">
  <button id="tt-data-top"
    data-label="${labelTop}"
    data-variant="secondary"
    data-tooltip="${ttDataTop}"
    data-tooltip-position="top"></button>

  <button id="tt-data-bottom"
    data-label="${labelBottom}"
    data-variant="secondary"
    data-tooltip="${ttDataBottom}"
    data-tooltip-position="bottom"></button>

  <button id="tt-data-light"
    data-label="${labelLight}"
    data-variant="secondary"
    data-tooltip="${ttDataLight}"
    data-tooltip-position="top"
    data-tooltip-variant="light"></button>

  <button id="tt-data-click"
    data-label="${labelClick}"
    data-variant="secondary"
    data-tooltip="${ttDataClick}"
    data-tooltip-trigger="click"></button>
</div>`;

var js_s4 = `new MTS.Button('#tt-data-top');
new MTS.Button('#tt-data-bottom');
new MTS.Button('#tt-data-light');
new MTS.Button('#tt-data-click');

MTS.Tooltip.initAll();

// También puedes inicializar dentro de un contenedor:
// MTS.Tooltip.initAll('#my-toolbar');`;

makeSection('tabs-s1', preview_s1, js_s1);
makeSection('tabs-s2', preview_s2, js_s2);
makeSection('tabs-s3', preview_s3, js_s3);
makeSection('tabs-s4', preview_s4, js_s4);

function mountTooltipDemo() {
  [
    '#tt-top','#tt-bottom','#tt-left','#tt-right',
    '#tt-hover','#tt-click',
    '#tt-dark','#tt-light','#tt-html','#tt-custom','#tt-delay',
    '#tt-data-top','#tt-data-bottom','#tt-data-light','#tt-data-click'
  ].forEach(function(sel) {
    new MTS.Button(sel);
  });

  new MTS.Input('#tt-focus');

  new MTS.Tooltip('#tt-top', { content: ttTop, position: 'top' });
  new MTS.Tooltip('#tt-bottom', { content: ttBottom, position: 'bottom' });
  new MTS.Tooltip('#tt-left', { content: ttLeft, position: 'left' });
  new MTS.Tooltip('#tt-right', { content: ttRight, position: 'right' });

  new MTS.Tooltip('#tt-hover', { content: ttHover, trigger: 'hover' });
  new MTS.Tooltip('#tt-click', { content: ttClick, trigger: 'click' });
  new MTS.Tooltip('#tt-focus', { content: ttFocus, trigger: 'focus', position: 'bottom' });

  new MTS.Tooltip('#tt-dark', { content: ttDark, variant: 'dark' });
  new MTS.Tooltip('#tt-light', { content: ttLight, variant: 'light' });
  new MTS.Tooltip('#tt-html', { content: ttHtml, position: 'bottom', maxWidth: 200 });
  new MTS.Tooltip('#tt-custom', { content: ttCustom, bg: '#7c3aed', color: '#fff' });
  new MTS.Tooltip('#tt-delay', { content: ttDelay, delay: 500, hideDelay: 200 });

  MTS.Tooltip.initAll();
}

mountTooltipDemo();
</script>
