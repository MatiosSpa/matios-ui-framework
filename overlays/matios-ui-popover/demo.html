<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

  <title>MTS.Popover — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

</div>

<script>
function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>'   }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Popover'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Rich tooltip — title, HTML body, arrow, positions, click/hover trigger.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Positions (click trigger)';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Hover + rich HTML content';

var preview_s1 =
  '<div class="demo-col">' +
    '<div class="demo-row" style="justify-content:center;gap:16px;padding:24px 0;flex-wrap:wrap">' +
      '<button id="pop-top"></button>' +
      '<button id="pop-bottom"></button>' +
      '<button id="pop-left"></button>' +
      '<button id="pop-right"></button>' +
    '</div>' +
    '<div class="result-box" id="pop-result">' + (D.resultPlaceholder || '— click a button —') + '</div>' +
  '</div>';

var js_s1 =
  "const content = '<p style=\"font-size:13px;color:var(--mts-text-muted)\">Contenido con <strong>HTML</strong> y posicionamiento inteligente.</p>';;\n\n" +
  "new MTS.Button('#pop-top',    { label: 'Top',    variant: 'secondary' });\n" +
  "new MTS.Button('#pop-bottom', { label: 'Bottom', variant: 'secondary' });\n" +
  "new MTS.Button('#pop-left',   { label: 'Left',   variant: 'secondary' });\n" +
  "new MTS.Button('#pop-right',  { label: 'Right',  variant: 'secondary' });\n\n" +
  "new MTS.Popover('#pop-top',    { title: 'Arriba',    content, position: 'top' });\n" +
  "new MTS.Popover('#pop-bottom', { title: 'Abajo',     content, position: 'bottom' });\n" +
  "new MTS.Popover('#pop-left',   { title: 'Izquierda', content, position: 'left' });\n" +
  "new MTS.Popover('#pop-right',  { title: 'Derecha',   content, position: 'right' });";

var preview_s2 =
  '<div class="demo-col">' +
    '<div class="demo-row" style="gap:16px;padding:12px 0;flex-wrap:wrap">' +
      '<button id="pop-hover"></button>' +
      '<button id="pop-html"></button>' +
      '<button id="pop-noclosable"></button>' +
      '<button id="pop-wide"></button>' +
    '</div>' +
  '</div>';

var js_s2 =
  "new MTS.Button('#pop-hover',      { label: 'Hover me',    variant: 'secondary' });\n" +
  "new MTS.Button('#pop-html',       { label: 'Rich HTML',   variant: 'secondary' });\n" +
  "new MTS.Button('#pop-noclosable', { label: 'Sin × close', variant: 'secondary' });\n" +
  "new MTS.Button('#pop-wide',       { label: 'Wide popover',variant: 'secondary' });\n\n" +
  "new MTS.Popover('#pop-hover', {\n" +
  "  title: 'Pro tip',\n" +
  "  content: '<p style=\"font-size:13px\">Usa <kbd>⌘S</kbd> para guardar rápido.</p>',\n" +
  "  trigger: 'hover',\n" +
  "  position: 'top'\n" +
  "});\n\n" +
  "new MTS.Popover('#pop-html', {\n" +
  "  title: 'Perfil de usuario',\n" +
  "  position: 'bottom',\n" +
  "  width: '240px',\n" +
  "  content: '<div style=\"display:flex;gap:10px;align-items:center\"><div style=\"width:36px;height:36px;border-radius:50%;background:var(--mts-color-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700\">A</div><div><div style=\"font-weight:600;font-size:13px\">Ana García</div><div style=\"font-size:11px;color:var(--mts-text-muted)\">ana@empresa.com</div></div></div>'\n" +
  "});\n\n" +
  "new MTS.Popover('#pop-noclosable', {\n" +
  "  title: 'Info',\n" +
  "  content: '<p style=\"font-size:13px;color:var(--mts-text-muted)\">Click fuera para cerrar.</p>',\n" +
  "  closable: false\n" +
  "});\n\n" +
  "new MTS.Popover('#pop-wide', {\n" +
  "  title: 'Detalles',\n" +
  "  content: '<p style=\"font-size:13px;color:var(--mts-text-muted)\">Este popover tiene un ancho mayor para mostrar más contenido.</p>',\n" +
  "  width: '380px'\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.Button('#pop-top',    { label: D.btnTop    || 'Top',    variant: 'secondary' });
  new MTS.Button('#pop-bottom', { label: D.btnBottom || 'Bottom', variant: 'secondary' });
  new MTS.Button('#pop-left',   { label: D.btnLeft   || 'Left',   variant: 'secondary' });
  new MTS.Button('#pop-right',  { label: D.btnRight  || 'Right',  variant: 'secondary' });

  var content = '<p style="font-size:13px;color:var(--mts-text-muted)">' + (D.bodyPositions || 'Content with <strong>HTML</strong> and smart positioning.') + '</p>';
  new MTS.Popover('#pop-top',    { title:(D.btnTop    || 'Top'),    content:content, position:'top',    onShow:function(){ document.getElementById('pop-result').textContent = 'onShow → top'; },    onHide:function(){ document.getElementById('pop-result').textContent = 'onHide → top'; } });
  new MTS.Popover('#pop-bottom', { title:(D.btnBottom || 'Bottom'), content:content, position:'bottom', onShow:function(){ document.getElementById('pop-result').textContent = 'onShow → bottom'; }, onHide:function(){ document.getElementById('pop-result').textContent = 'onHide → bottom'; } });
  new MTS.Popover('#pop-left',   { title:(D.btnLeft   || 'Left'),   content:content, position:'left',   onShow:function(){ document.getElementById('pop-result').textContent = 'onShow → left'; },   onHide:function(){ document.getElementById('pop-result').textContent = 'onHide → left'; } });
  new MTS.Popover('#pop-right',  { title:(D.btnRight  || 'Right'),  content:content, position:'right',  onShow:function(){ document.getElementById('pop-result').textContent = 'onShow → right'; },  onHide:function(){ document.getElementById('pop-result').textContent = 'onHide → right'; } });
});

makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.Button('#pop-hover',      { label: D.btnHover   || 'Hover me',     variant: 'secondary' });
  new MTS.Button('#pop-html',       { label: D.btnRichHtml|| 'Rich HTML',    variant: 'secondary' });
  new MTS.Button('#pop-noclosable', { label: D.btnNoClose || 'No × close',   variant: 'secondary' });
  new MTS.Button('#pop-wide',       { label: D.btnWide    || 'Wide popover', variant: 'secondary' });

  new MTS.Popover('#pop-hover',  { title:(D.titleProTip || 'Pro tip'), content:'<p style="font-size:13px">' + (D.bodyProTip || 'Use <kbd>⌘S</kbd> to save quickly.') + '</p>', trigger:'hover', position:'top' });
  new MTS.Popover('#pop-html', {
    title:(D.titleProfile || 'User profile'), position:'bottom', width:'240px',
    content:'<div style="display:flex;gap:10px;align-items:center"><div style="width:36px;height:36px;border-radius:50%;background:var(--mts-color-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">A</div><div><div style="font-weight:600;font-size:13px">Ana García</div><div style="font-size:11px;color:var(--mts-text-muted)">ana@empresa.com</div></div></div>'
  });
  new MTS.Popover('#pop-noclosable', { title:(D.titleInfo || 'Info'), content:'<p style="font-size:13px;color:var(--mts-text-muted)">' + (D.bodyInfo || 'Click outside to close.') + '</p>', closable:false });
  new MTS.Popover('#pop-wide', { title:(D.titleDetails || 'Details'), content:'<p style="font-size:13px;color:var(--mts-text-muted)">' + (D.bodyDetails || 'This popover has a larger width to show more content.') + '</p>', width:'380px' });
