<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Alert — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">

  <link rel="stylesheet" href="./matios-ui-alert.css">

<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Alert</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s3-title"></div><div id="tabs-s3"></div></div>
</div>

<script>
// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Alert']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Inline alerts and banners — variants, action button, auto-dismiss and CSS-only usage.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Variants';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — With action and auto-dismiss';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — CSS only';

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>'   }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="alert-info"></div>' +
    '<div id="alert-success"></div>' +
    '<div id="alert-warning"></div>' +
    '<div id="alert-danger"></div>' +
    '<div class="result-box" id="alert-result">' + (D.resultPlaceholder || '— close an alert —') + '</div>' +
  '</div>';

var js_s1 = `new MTS.Alert('#alert-info', {
  variant: 'info',
  title: 'New version available',
  message: 'Update to get the latest features.',
  onClose: function () {
    document.getElementById('alert-result').textContent = 'onClose → info';
  }
});

new MTS.Alert('#alert-success', {
  variant: 'success',
  title: 'Changes saved',
  message: 'Your data was saved successfully.',
  onClose: function () {
    document.getElementById('alert-result').textContent = 'onClose → success';
  }
});

new MTS.Alert('#alert-warning', {
  variant: 'warning',
  title: 'Session about to expire',
  message: 'Your session expires in 5 minutes.',
  onClose: function () {
    document.getElementById('alert-result').textContent = 'onClose → warning';
  }
});

new MTS.Alert('#alert-danger', {
  variant: 'danger',
  title: 'Connection error',
  message: 'Could not connect to the server.',
  onClose: function () {
    document.getElementById('alert-result').textContent = 'onClose → danger';
  }
});`;

var preview_s2 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<button id="btn-show-action" data-label="' + (D.btnShowAction || 'Show with action') + '" data-variant="secondary"></button>' +
      '<button id="btn-show-autodismiss" data-label="' + (D.btnShowAutodismiss || 'Auto-dismiss (3s)') + '" data-variant="primary"></button>' +
    '</div>' +
    '<div id="alert-action"></div>' +
    '<div class="result-box" id="alert-action-result">' + (D.actionResultPlaceholder || '— use the buttons —') + '</div>' +
  '</div>';

var js_s2 = `new MTS.Button('#btn-show-action');
new MTS.Button('#btn-show-autodismiss');

document.getElementById('btn-show-action').addEventListener('click', function () {
  document.getElementById('alert-action').innerHTML = '';

  new MTS.Alert('#alert-action', {
    variant: 'warning',
    title: 'Session about to expire',
    message: 'Your session expires in 5 minutes.',
    action: 'Renew now',
    onAction: function () {
      document.getElementById('alert-action-result').textContent = 'onAction → renew';
    },
    onClose: function () {
      document.getElementById('alert-action-result').textContent = 'onClose → dismissed';
    }
  });
});

document.getElementById('btn-show-autodismiss').addEventListener('click', function () {
  document.getElementById('alert-action').innerHTML = '';
  document.getElementById('alert-action-result').textContent = 'Auto-dismiss in 3 seconds...';

  new MTS.Alert('#alert-action', {
    variant: 'success',
    message: 'File uploaded successfully.',
    autoDismiss: 3000,
    closable: false,
    onClose: function () {
      document.getElementById('alert-action-result').textContent = 'onClose → auto-dismissed ✓';
    }
  });
});`;

var preview_s3 =
  '<div class="demo-stack">' +
    '<div class="mts-alert mts-alert--info">' +
      '<div class="mts-alert__body">' +
        '<div class="mts-alert__message">' + (D.cssInfoMessage || 'Info alert — CSS only.') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="mts-alert mts-alert--success">' +
      '<div class="mts-alert__body">' +
        '<div class="mts-alert__title">' + (D.cssSuccessTitle || 'Success') + '</div>' +
        '<div class="mts-alert__message">' + (D.cssSuccessMessage || 'Changes saved.') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="mts-alert mts-alert--warning">' +
      '<div class="mts-alert__body">' +
        '<div class="mts-alert__message">' + (D.cssWarningMessage || 'Warning — check your settings.') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="mts-alert mts-alert--danger">' +
      '<div class="mts-alert__body">' +
        '<div class="mts-alert__message">' + (D.cssDangerMessage || 'Error — the operation could not be completed.') + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';

var js_s3 = `// No JavaScript needed.
// This variant uses only the component's CSS classes.`;

makeSection('tabs-s1', preview_s1, js_s1);
makeSection('tabs-s2', preview_s2, js_s2);
makeSection('tabs-s3', preview_s3, js_s3);

function mountVariants() {
  ['info', 'success', 'warning', 'danger'].forEach(function(v) {
    var el = document.getElementById('alert-' + v);
    if (el) el.innerHTML = '';
  });

  new MTS.Alert('#alert-info', {
    variant: 'info',
    title: D.infoTitle || 'New version available',
    message: D.infoMessage || 'Update to get the latest features.',
    onClose: function () {
      document.getElementById('alert-result').textContent = D.echoInfo || 'onClose → info';
    }
  });

  new MTS.Alert('#alert-success', {
    variant: 'success',
    title: D.successTitle || 'Changes saved',
    message: D.successMessage || 'Your data was saved successfully.',
    onClose: function () {
      document.getElementById('alert-result').textContent = D.echoSuccess || 'onClose → success';
    }
  });

  new MTS.Alert('#alert-warning', {
    variant: 'warning',
    title: D.warningTitle || 'Session about to expire',
    message: D.warningMessage || 'Your session expires in 5 minutes.',
    onClose: function () {
      document.getElementById('alert-result').textContent = D.echoWarning || 'onClose → warning';
    }
  });

  new MTS.Alert('#alert-danger', {
    variant: 'danger',
    title: D.dangerTitle || 'Connection error',
    message: D.dangerMessage || 'Could not connect to the server.',
    onClose: function () {
      document.getElementById('alert-result').textContent = D.echoDanger || 'onClose → danger';
    }
  });
}

function bindActionButtons() {
  if (window.MTS && MTS.Button) {
    new MTS.Button('#btn-show-action');
    new MTS.Button('#btn-show-autodismiss');
  }

  document.getElementById('btn-show-action').addEventListener('click', function () {
    document.getElementById('alert-action').innerHTML = '';

    new MTS.Alert('#alert-action', {
      variant: 'warning',
      title: D.warningTitle || 'Session about to expire',
      message: D.warningMessage || 'Your session expires in 5 minutes.',
      action: D.actionLabel || 'Renew now',
      onAction: function () {
        document.getElementById('alert-action-result').textContent = D.echoAction || 'onAction → renew';
      },
      onClose: function () {
        document.getElementById('alert-action-result').textContent = D.echoActionClose || 'onClose → dismissed';
      }
    });
  });

  document.getElementById('btn-show-autodismiss').addEventListener('click', function () {
    document.getElementById('alert-action').innerHTML = '';
    document.getElementById('alert-action-result').textContent = D.autodismissCountdown || 'Auto-dismiss in 3 seconds...';

    new MTS.Alert('#alert-action', {
      variant: 'success',
      message: D.autodismissMessage || 'File uploaded successfully.',
      autoDismiss: 3000,
      closable: false,
      onClose: function () {
        document.getElementById('alert-action-result').textContent = D.echoAutodismiss || 'onClose → auto-dismissed ✓';
      }
    });
  });
}

mountVariants();
bindActionButtons();
</script>
</body>
