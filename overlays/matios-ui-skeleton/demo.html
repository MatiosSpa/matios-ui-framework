<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Skeleton — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-skeleton.css">
  <script src="../../support/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-skeleton.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>
<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Skeleton</h1>
    <p>Animated loading placeholder — text, circle, rect, card, list, table · pulse and wave animations.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-skeleton.md')">Docs</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 — Text · Circle · Rect</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Card · List · Table</div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — Animations</div><div id="tabs-s3"></div></div>
</div>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

var preview_s1 = `
<div class="demo-grid">
  <div>
    <div class="demo-label">variant: text (4 lines)</div>
    <div id="sk-text"></div>
  </div>
  <div>
    <div class="demo-label">variant: circle</div>
    <div id="sk-circle"></div>
  </div>
  <div>
    <div class="demo-label">variant: rect</div>
    <div id="sk-rect"></div>
  </div>
</div>`;

var js_s1 = `new MTS.Skeleton('#sk-text', {
  variant: 'text',
  lines: 4,
  animation: 'pulse'
});

new MTS.Skeleton('#sk-circle', {
  variant: 'circle',
  width: '56px',
  height: '56px'
});

new MTS.Skeleton('#sk-rect', {
  variant: 'rect',
  width: '100%',
  height: '120px'
});`;

var preview_s2 = `
<div class="demo-grid">
  <div>
    <div class="demo-label">variant: card</div>
    <div id="sk-card"></div>
  </div>
  <div>
    <div class="demo-label">variant: list (4 items)</div>
    <div id="sk-list"></div>
  </div>
  <div>
    <div class="demo-label">variant: table</div>
    <div id="sk-table"></div>
  </div>
</div>`;

var js_s2 = `new MTS.Skeleton('#sk-card', {
  variant: 'card'
});

new MTS.Skeleton('#sk-list', {
  variant: 'list',
  items: 4
});

new MTS.Skeleton('#sk-table', {
  variant: 'table',
  rows: 4,
  cols: 4
});`;

var preview_s3 = `
<div class="demo-grid">
  <div>
    <div class="demo-label">animation: pulse</div>
    <div id="sk-pulse"></div>
  </div>
  <div>
    <div class="demo-label">animation: wave</div>
    <div id="sk-wave"></div>
  </div>
  <div>
    <div class="demo-label">animation: none</div>
    <div id="sk-none"></div>
  </div>
</div>`;

var js_s3 = `new MTS.Skeleton('#sk-pulse', {
  variant: 'text',
  lines: 3,
  animation: 'pulse'
});

new MTS.Skeleton('#sk-wave', {
  variant: 'text',
  lines: 3,
  animation: 'wave'
});

new MTS.Skeleton('#sk-none', {
  variant: 'text',
  lines: 3,
  animation: 'none'
});`;

makeSection('tabs-s1', preview_s1, js_s1, function () {
  new MTS.Skeleton('#sk-text', { variant: 'text', lines: 4, animation: 'pulse' });
  new MTS.Skeleton('#sk-circle', { variant: 'circle', width: '56px', height: '56px' });
  new MTS.Skeleton('#sk-rect', { variant: 'rect', width: '100%', height: '120px' });
});

makeSection('tabs-s2', preview_s2, js_s2, function () {
  new MTS.Skeleton('#sk-card', { variant: 'card' });
  new MTS.Skeleton('#sk-list', { variant: 'list', items: 4 });
  new MTS.Skeleton('#sk-table', { variant: 'table', rows: 4, cols: 4 });
});

makeSection('tabs-s3', preview_s3, js_s3, function () {
  new MTS.Skeleton('#sk-pulse', { variant: 'text', lines: 3, animation: 'pulse' });
  new MTS.Skeleton('#sk-wave', { variant: 'text', lines: 3, animation: 'wave' });
  new MTS.Skeleton('#sk-none', { variant: 'text', lines: 3, animation: 'none' });
});
</script>
</body>
</html>
