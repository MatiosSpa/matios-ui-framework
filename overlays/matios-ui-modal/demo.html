  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>'   }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setText(id, value) {
  var el = document.getElementById(id);
  if (el) el.textContent = value;
}

var preview_s1 = `
<div class="demo-row">
  <button id="btn-modal-sm" data-variant="secondary" data-label="sm"></button>
  <button id="btn-modal-md" data-variant="secondary" data-label="md"></button>
  <button id="btn-modal-lg" data-variant="secondary" data-label="lg"></button>
  <button id="btn-modal-xl" data-variant="secondary" data-label="xl"></button>

</div>
<div class="result-box" id="modal-result">— abre un modal —</div>`;

var js_s1 = `// Sizes: 'sm' | 'md' | 'lg' | 'xl' | 'fullscreen'
function openModal(size) {
  new MTS.Modal({
    title: 'Modal — size: ' + size,
    body: '<p style="color:var(--mts-text-muted);font-size:13px">Contenido del modal con tamaño <strong>' + size + '</strong>.</p>',
    size: size,
    buttons: [
      { label: 'Cancelar', variant: 'ghost', close: true },
      {
        label: 'Aceptar',
        variant: 'primary',
        close: true,
        onClick: function () {
          document.getElementById('modal-result').textContent = 'onClick → size:' + size;
        }
      }
    ],
    onShown: function () {
      document.getElementById('modal-result').textContent = 'onShown → size:' + size;
    },
    onHidden: function () {
      document.getElementById('modal-result').textContent = 'onHidden → size:' + size;
    }
  }).show();
}`;

    },
    onCancel: function () {
      document.getElementById('modal-helper-result').textContent = 'onCancel → cancelado';
    }
  });
}

function showAlert() {
  MTS.Modal.alert({
    title: 'Listo',
    message: 'Los cambios fueron guardados correctamente.',
    onClose: function () {
      document.getElementById('modal-helper-result').textContent = 'onClose → aceptado';
    }
  });
}

function showPrompt() {
  MTS.Modal.prompt({
    title: 'Renombrar archivo',
    placeholder: 'Nuevo nombre...',
    value: 'documento.pdf',
    onConfirm: function (value) {
      document.getElementById('modal-helper-result').textContent = 'onConfirm → "' + value + '"';
    },
    onCancel: function () {
      document.getElementById('modal-helper-result').textContent = 'onCancel → cancelado';
    }
  });
}`;
