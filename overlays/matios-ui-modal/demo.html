<!DOCTYPE html>

  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>'   }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setText(id, value) {
  var el = document.getElementById(id);
  if (el) el.textContent = value;
}

// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Modal'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Dialog modal — sizes, footer buttons, scrollable, static, confirm/alert/prompt helpers.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Sizes';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Convenience helpers';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Static + scrollable body';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Border radius';

var preview_s1 = `
<div class="demo-row">
  <button id="btn-modal-sm" data-variant="secondary" data-label="sm"></button>
  <button id="btn-modal-md" data-variant="secondary" data-label="md"></button>
  <button id="btn-modal-lg" data-variant="secondary" data-label="lg"></button>
  <button id="btn-modal-xl" data-variant="secondary" data-label="xl"></button>
  <button id="btn-modal-fullscreen" data-variant="secondary" data-label="fullscreen"></button>
</div>
<div class="result-box" id="modal-result">` + (D.resultPlaceholder || '— open a modal —') + `</div>`;

var js_s1 = `// Sizes: 'sm' | 'md' | 'lg' | 'xl' | 'fullscreen'
function openModal(size) {
  new MTS.Modal({
    title: 'Modal — size: ' + size,
    body: '<p style="color:var(--mts-text-muted);font-size:13px">Modal content with size <strong>' + size + '</strong>.</p>',
    size: size,
    buttons: [
      { label: 'Cancel', variant: 'ghost', close: true },
      {
        label: 'Accept',
        variant: 'primary',
        close: true,
        onClick: function () {
          document.getElementById('modal-result').textContent = 'onClick → size:' + size;
        }
      }
    ],
    onShown: function () {
      document.getElementById('modal-result').textContent = 'onShown → size:' + size;
    },
    onHidden: function () {
      document.getElementById('modal-result').textContent = 'onHidden → size:' + size;
    }
  }).show();
}`;

var preview_s2 = `
<div class="demo-row">
  <button id="btn-modal-confirm" data-variant="secondary" data-label="confirm()"></button>
  <button id="btn-modal-alert" data-variant="secondary" data-label="alert()"></button>
  <button id="btn-modal-prompt" data-variant="secondary" data-label="prompt()"></button>
</div>
<div class="result-box" id="modal-helper-result">` + (D.helperPlaceholder || '— use the helpers —') + `</div>`;

var js_s2 = `// Confirm dialog
function showConfirm() {
  MTS.Modal.confirm({
    title: 'Delete record',
    message: 'This action cannot be undone.',
    confirm: 'Delete',
    cancel: 'Cancel',
    danger: true,
    onConfirm: function () {
      document.getElementById('modal-helper-result').textContent = 'onConfirm → confirmed';
    },
    onCancel: function () {
      document.getElementById('modal-helper-result').textContent = 'onCancel → cancelled';
    }
  });
}

function showAlert() {
  MTS.Modal.alert({
    title: 'Done',
    message: 'Your changes were saved successfully.',
    onClose: function () {
      document.getElementById('modal-helper-result').textContent = 'onClose → accepted';
    }
  });
}

function showPrompt() {
  MTS.Modal.prompt({
    title: 'Rename file',
    placeholder: 'New name...',
    value: 'document.pdf',
    onConfirm: function (value) {
      document.getElementById('modal-helper-result').textContent = 'onConfirm → "' + value + '"';
    },
    onCancel: function () {
      document.getElementById('modal-helper-result').textContent = 'onCancel → cancelled';
    }
  });
}`;

var preview_s3 = `
<div class="demo-row">
  <button id="btn-modal-static" data-variant="secondary" data-label="` + (D.staticBtn || 'Static modal') + `"></button>
  <button id="btn-modal-scrollable" data-variant="secondary" data-label="` + (D.scrollableBtn || 'Scrollable body') + `"></button>
</div>`;

var js_s3 = `function showStatic() {
  new MTS.Modal({
    title: 'Action required',
    body: '<p style="color:var(--mts-text-muted);font-size:13px">This modal does not close with Esc or by clicking outside.</p>',
    static: true,
    buttons: [
      { label: 'Got it', variant: 'primary', close: true }
    ]
  }).show();
}

function showScrollable() {
  new MTS.Modal({
    title: 'Terms and conditions',
    size: 'lg',
    scrollable: true,
    body: '<p style="color:var(--mts-text-muted);font-size:13px">' +
      'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. '.repeat(20) +
      '</p>',
    buttons: [
      { label: 'Reject', variant: 'ghost', close: true },
      { label: 'Accept', variant: 'primary', close: true }
    ]
  }).show();
}`;

makeSection('tabs-s1', preview_s1, js_s1, function () {
  ['sm', 'md', 'lg', 'xl', 'fullscreen'].forEach(function (size) {
    new MTS.Button('#btn-modal-' + size);
    document.getElementById('btn-modal-' + size).addEventListener('click', function () {
      openModal(size);
    });
  });
});

makeSection('tabs-s2', preview_s2, js_s2, function () {
  ['confirm', 'alert', 'prompt'].forEach(function (name) {
    new MTS.Button('#btn-modal-' + name);
  });

  document.getElementById('btn-modal-confirm').addEventListener('click', showConfirm);
  document.getElementById('btn-modal-alert').addEventListener('click', showAlert);
  document.getElementById('btn-modal-prompt').addEventListener('click', showPrompt);
});

makeSection('tabs-s3', preview_s3, js_s3, function () {
  new MTS.Button('#btn-modal-static');
  new MTS.Button('#btn-modal-scrollable');

  document.getElementById('btn-modal-static').addEventListener('click', showStatic);
  document.getElementById('btn-modal-scrollable').addEventListener('click', showScrollable);
});

/* ── 4 — Border radius ── */
var preview_s4 =
  '<div class="demo-row" style="gap:8px;flex-wrap:wrap;">' +
    '<div id="btn-radius-none"></div>' +
    '<div id="btn-radius-sm"></div>' +

var js_s4 =
  "// No radius (default)\n" +
  "new MTS.Modal({ title: 'No radius', radius: 'none', ... });\n\n" +
  "// Small rounding\n" +
  "new MTS.Modal({ title: 'Radius sm', radius: 'sm', ... });\n\n" +

          buttons: [{ label: D.radiusClose || 'Close', variant: 'primary', close: true }],
        }).show();
      },
    });
  });
}, '180px');

function openModal(size) {
  new MTS.Modal({
    title: (D.modalSizeTitle || 'Modal — size: ') + size,
    body: '<p style="color:var(--mts-text-muted);font-size:13px">' + (D.modalSizeBody || 'Modal content with size ') + '<strong>' + size + '</strong>.</p>',
    size: size,
    buttons: [
      { label: D.btnCancel || 'Cancel', variant: 'ghost', close: true },
      {
        label: D.btnAccept || 'Accept',
        variant: 'primary',
        close: true,
        onClick: function () {
          setText('modal-result', 'onClick → size:' + size);
        }
      }
    ],
    onShown: function () {
      setText('modal-result', 'onShown → size:' + size);
    },
    onHidden: function () {
      setText('modal-result', 'onHidden → size:' + size);
    }
  }).show();
}

function showConfirm() {
  MTS.Modal.confirm({
    title: D.confirmTitle || 'Delete record',
    message: D.confirmMessage || 'This action cannot be undone.',
    confirm: D.confirmConfirm || 'Delete',
    cancel: D.confirmCancel || 'Cancel',
    danger: true,
    onConfirm: function () {
      setText('modal-helper-result', 'onConfirm → ' + (D.confirmDone || 'confirmed'));
    },
    onCancel: function () {
      setText('modal-helper-result', 'onCancel → ' + (D.confirmCancelled || 'cancelled'));
    }
  });
}

function showAlert() {
  MTS.Modal.alert({
    title: D.alertTitle || 'Done',
    message: D.alertMessage || 'Your changes were saved successfully.',
    onClose: function () {
      setText('modal-helper-result', 'onClose → ' + (D.alertDone || 'accepted'));
    }
  });
}

function showPrompt() {
  MTS.Modal.prompt({
    title: D.promptTitle || 'Rename file',
    placeholder: D.promptPlaceholder || 'New name...',
    value: D.promptValue || 'document.pdf',
    onConfirm: function (value) {
      setText('modal-helper-result', 'onConfirm → "' + value + '"');
    },
    onCancel: function () {
      setText('modal-helper-result', 'onCancel → ' + (D.promptCancelled || 'cancelled'));
    }
  });
}

function showStatic() {
  new MTS.Modal({
    title: D.staticTitle || 'Action required',
    body: '<p style="color:var(--mts-text-muted);font-size:13px">' + (D.staticBody || 'This modal does not close with Esc or by clicking outside.') + '</p>',
    static: true,
    buttons: [
      { label: D.staticOk || 'Got it', variant: 'primary', close: true }
    ]
  }).show();
}

function showScrollable() {
  new MTS.Modal({
    title: D.termsTitle || 'Terms and conditions',
    size: 'lg',
    scrollable: true,
    body: '<p style="color:var(--mts-text-muted);font-size:13px">' +
      'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. '.repeat(20) +
      '</p>',
    buttons: [
      { label: D.termsReject || 'Reject', variant: 'ghost', close: true },
      { label: D.termsAccept || 'Accept', variant: 'primary', close: true }
    ]
  }).show();
}
</script>
