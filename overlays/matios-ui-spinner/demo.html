<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Spinner — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="./matios-ui-spinner.css?v=20">
  <link rel="stylesheet" href="../../utilities/matios-ui-codeblock/matios-ui-codeblock.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">
  <script src="../../support/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="./matios-ui-spinner.js?v=20"></script>
  <script src="../../utilities/matios-ui-codeblock/matios-ui-codeblock.js"></script>
  <script src="../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../forms/matios-ui-copybutton/matios-ui-copybutton.js"></script>
</head>
<body>


<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Spinner</h1>
    <p>Indicadores de carga animados — 12 variantes, tones de color, 5 tamaños, label y overlay.</p>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 — Variantes</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Tamaños</div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — Colores</div><div id="tabs-s3"></div></div>
  <div class="demo-section"><div class="demo-section-title">4 — Multi-color</div><div id="tabs-s4"></div></div>
  <div class="demo-section"><div class="demo-section-title">5 — Label</div><div id="tabs-s5"></div></div>
  <div class="demo-section"><div class="demo-section-title">6 — Overlay</div><div id="tabs-s6"></div></div>
</div>

<style>
.sp-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 20px 16px;
  min-width: 96px;
  border: 1px solid var(--mts-border-color);
  border-radius: var(--mts-radius-lg);
  background: var(--mts-bg-surface);
}
.sp-card span {
  font-size: 11px;
  font-weight: 500;
  color: var(--mts-text-muted);
  letter-spacing: .04em;
  white-space: nowrap;
}
.sp-group-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--mts-text-muted);
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--mts-border-color);
}
</style>

<script>
var VARIANTS = ['dual','ring','bars','roller','clock','ellipsis','grid','ripple','activity','triple','orbital','dots','bounce'];

/* ── Helpers ─────────────────────────────────────────────── */
function indentHtml(html) {
  var indent = 0, step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trim();
}
function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '240px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>'   }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

/* ── HTML builders ───────────────────────────────────────── */
function buildCards(prefix, variants) {
  var html = '';
  variants.forEach(function(v) {
    html += '<div class="sp-card"><div id="' + prefix + '-' + v + '"></div><span>' + v + '</span></div>';
  });
  return html;
}

function buildGroup(label, cardsHtml) {
  return '<div>' +
    '<div class="sp-group-label">' + label + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:10px">' + cardsHtml + '</div>' +
    '</div>';
}

/* ════════════════════════════════════════════════════════════
   1 — Variantes
   ════════════════════════════════════════════════════════════ */
var preview_s1 =
  '<div style="display:flex;flex-wrap:wrap;gap:12px;padding:16px 0">' +
  buildCards('s1', VARIANTS) +
  '</div>';

var js_s1 =
  "var variants = ['dual','ring','bars','roller','clock','ellipsis',\n" +
  "                'grid','ripple','activity','triple','orbital','dots','bounce'];\n\n" +
  "variants.forEach(function(v) {\n" +
  "  new MTS.Spinner('#s1-' + v, { variant: v, size: 'lg' });\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  VARIANTS.forEach(function(v) {
    new MTS.Spinner('#s1-' + v, { variant: v, size: 'lg' });
  });
}, '260px');

/* ════════════════════════════════════════════════════════════
   2 — Tamaños
   ════════════════════════════════════════════════════════════ */
var SIZES = ['xs','sm','md','lg','xl'];

var preview_s2 = '<div style="padding:8px 0;display:flex;flex-direction:column;gap:20px">';
SIZES.forEach(function(size) {
  preview_s2 += buildGroup(size, buildCards('s2-' + size, VARIANTS));
});
preview_s2 += '</div>';

var js_s2 =
  "var variants = ['dual','ring','bars','roller','clock','ellipsis',\n" +
  "                'grid','ripple','activity','triple','orbital','dots','bounce'];\n" +
  "var sizes    = ['xs','sm','md','lg','xl'];\n\n" +
  "sizes.forEach(function(size) {\n" +
  "  variants.forEach(function(v) {\n" +
  "    new MTS.Spinner('#s2-' + size + '-' + v, { variant: v, size: size });\n" +
  "  });\n" +
  "});";

makeSection('tabs-s2', preview_s2, js_s2, function() {
  SIZES.forEach(function(size) {
    VARIANTS.forEach(function(v) {
      new MTS.Spinner('#s2-' + size + '-' + v, { variant: v, size: size });
    });
  });
}, '560px');

/* ════════════════════════════════════════════════════════════
   3 — Colores
   ════════════════════════════════════════════════════════════ */
var COLOR_DEFS = [
  { key: 'primary', label: 'primary (default)', color: null       },
  { key: 'warning', label: 'warning',            color: 'warning'  },
  { key: 'danger',  label: 'danger',             color: 'danger'   },
  { key: 'success', label: 'success',            color: 'success'  },
  { key: 'muted',   label: 'muted',              color: 'muted'    },
  { key: 'custom',  label: 'color: "#f97316"',   color: '#f97316'  }
];

var preview_s3 = '<div style="padding:8px 0;display:flex;flex-direction:column;gap:20px">';
COLOR_DEFS.forEach(function(c) {
  preview_s3 += buildGroup(c.label, buildCards('s3-' + c.key, VARIANTS));
});
preview_s3 += '</div>';

var js_s3 =
  "var variants  = ['dual','ring','bars','roller','clock','ellipsis',\n" +
  "                 'grid','ripple','activity','triple','orbital','dots','bounce'];\n" +
  "var colorDefs = [\n" +
  "  { key: 'primary', color: null       },\n" +
  "  { key: 'warning', color: 'warning'  },\n" +
  "  { key: 'danger',  color: 'danger'   },\n" +
  "  { key: 'success', color: 'success'  },\n" +
  "  { key: 'muted',   color: 'muted'    },\n" +
  "  { key: 'custom',  color: '#f97316'  }\n" +
  "];\n\n" +
  "colorDefs.forEach(function(c) {\n" +
  "  variants.forEach(function(v) {\n" +
  "    var opts = { variant: v, size: 'md' };\n" +
  "    if (c.color) opts.color = c.color;\n" +
  "    new MTS.Spinner('#s3-' + c.key + '-' + v, opts);\n" +
  "  });\n" +
  "});";

makeSection('tabs-s3', preview_s3, js_s3, function() {
  COLOR_DEFS.forEach(function(c) {
    VARIANTS.forEach(function(v) {
      var opts = { variant: v, size: 'md' };
      if (c.color) opts.color = c.color;
      new MTS.Spinner('#s3-' + c.key + '-' + v, opts);
    });
  });
}, '660px');

/* ════════════════════════════════════════════════════════════
   4 — Multi-color
   orbital usa color2 · triple usa color2 + color3
   el resto solo color (se muestran con success para distinguir)
   ════════════════════════════════════════════════════════════ */
var preview_s4 =
  '<div style="display:flex;flex-wrap:wrap;gap:12px;padding:16px 0">' +
  buildCards('s4', VARIANTS) +
  '</div>';

var js_s4 =
  "// orbital, triple y bounce usan color2 visualmente\n" +
  "// triple además usa color3\n" +
  "var variants = ['dual','ring','bars','roller','clock','ellipsis',\n" +
  "                'grid','ripple','activity','triple','orbital','dots','bounce'];\n\n" +
  "variants.forEach(function(v) {\n" +
  "  var opts = {\n" +
  "    variant: v,\n" +
  "    size:    'lg',\n" +
  "    color:   'success',\n" +
  "    color2:  'var(--mts-color-warning, #f59e0b)'\n" +
  "  };\n" +
  "  if (v === 'triple') opts.color3 = 'var(--mts-color-danger, #ef4444)';\n" +
  "  new MTS.Spinner('#s4-' + v, opts);\n" +
  "});";

makeSection('tabs-s4', preview_s4, js_s4, function() {
  VARIANTS.forEach(function(v) {
    var opts = {
      variant: v,
      size:    'lg',
      color:   'success',
      color2:  'var(--mts-color-warning, #f59e0b)'
    };
    if (v === 'triple') opts.color3 = 'var(--mts-color-danger, #ef4444)';
    new MTS.Spinner('#s4-' + v, opts);
  });
}, '240px');

/* ════════════════════════════════════════════════════════════
   5 — Label
   ════════════════════════════════════════════════════════════ */
var preview_s5 =
  '<div style="display:flex;flex-wrap:wrap;gap:16px;padding:16px 0">';
VARIANTS.forEach(function(v) {
  preview_s5 += '<div id="s5-' + v + '"></div>';
});
preview_s5 += '</div>';

var js_s5 =
  "var variants = ['dual','ring','bars','roller','clock','ellipsis',\n" +
  "                'grid','ripple','activity','triple','orbital','dots','bounce'];\n\n" +
  "variants.forEach(function(v) {\n" +
  "  new MTS.Spinner('#s5-' + v, { variant: v, size: 'lg', label: 'Cargando...' });\n" +
  "});";

makeSection('tabs-s5', preview_s5, js_s5, function() {
  VARIANTS.forEach(function(v) {
    new MTS.Spinner('#s5-' + v, { variant: v, size: 'lg', label: 'Cargando...' });
  });
}, '240px');

/* ════════════════════════════════════════════════════════════
   6 — Overlay
   ════════════════════════════════════════════════════════════ */
var preview_s6 =
  '<div style="padding:24px 0;display:flex;flex-direction:column;gap:14px;align-items:flex-start">' +
    '<p style="margin:0;font-size:13px;color:var(--mts-text-muted)">Cubre la pantalla completa con fondo semitransparente. Se cierra automáticamente a los 2.5 s.</p>' +
    '<button id="s6-btn" data-label="Mostrar Overlay" data-variant="primary"></button>' +
  '</div>';

var js_s6 =
  "new MTS.Button('#s6-btn');\n\n" +
  "document.getElementById('s6-btn').addEventListener('click', function() {\n" +
  "  var el = document.createElement('div');\n" +
  "  document.body.appendChild(el);\n" +
  "  var sp = new MTS.Spinner(el, {\n" +
  "    variant: 'dual',\n" +
  "    size:    'xl',\n" +
  "    label:   'Cargando...',\n" +
  "    overlay: true\n" +
  "  });\n" +
  "  setTimeout(function() { sp.destroy(); el.remove(); }, 2500);\n" +
  "});";

makeSection('tabs-s6', preview_s6, js_s6, function() {
  new MTS.Button('#s6-btn');
  document.getElementById('s6-btn').addEventListener('click', function() {
    var el = document.createElement('div');
    document.body.appendChild(el);
    var sp = new MTS.Spinner(el, {
      variant: 'dual',
      size:    'xl',
      label:   'Cargando...',
      overlay: true
    });
    setTimeout(function() { sp.destroy(); el.remove(); }, 2500);
  });
}, '180px');
</script>

</body>
</html>
