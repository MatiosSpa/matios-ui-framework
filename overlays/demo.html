<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS Overlays — Demo</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../base/matios-ui-base.css">
  <link rel="stylesheet" href="../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../themes/matios-ui-mode-high-contrast.css">
  
  <link rel="stylesheet" href="../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../navigation/matios-ui-accordion/matios-ui-accordion.css">
  <link rel="stylesheet" href="../support/demo-shared.css">
  <script src="../support/demo-shared.js"></script>
  <script src="../navigation/matios-ui-accordion/matios-ui-accordion.js"></script>
</head>
<body>
  <div class="demo-page demo-page--launcher">
    <div class="demo-header">
      <h1>MTS <span>Overlays</span></h1>
      <p>alert · tooltip · modal · badge · progress · skeleton · spinner · toast · popover · lightbox</p>
    </div>

    <div id="overlays-launcher" class="demo-launcher"></div>
  </div>

  <script>
    initGroupLauncher('#overlays-launcher', [
      { id: 'alert', component: 'alert', title: 'MTS.Alert', subtitle: 'Alertas inline con variantes, íconos, acciones y auto-dismiss', src: 'matios-ui-alert/demo.html' },
      { id: 'tooltip', component: 'tooltip', title: 'MTS.Tooltip', subtitle: 'Posicionamiento inteligente, triggers y colores custom', src: 'matios-ui-tooltip/demo.html' },
      { id: 'modal', component: 'modal', title: 'MTS.Modal', subtitle: 'Modales con tamaños, botones configurables y helpers rápidos', src: 'matios-ui-modal/demo.html' },
      { id: 'badge', component: 'badge', title: 'MTS.Badge', subtitle: 'Badges, pills y contadores — via CSS puro o JS', src: 'matios-ui-badge/demo.html' },
      { id: 'progress', component: 'progress', title: 'MTS.Progress', subtitle: 'Barras de progreso — lineal, circular e indeterminado', src: 'matios-ui-progress/demo.html' },
      { id: 'skeleton', component: 'skeleton', title: 'MTS.Skeleton', subtitle: 'Placeholder animado de carga — text, card, list, table', src: 'matios-ui-skeleton/demo.html' },
      { id: 'spinner', component: 'spinner', title: 'MTS.Spinner', subtitle: 'Indicadores de carga — circle, ring, dots, bars, pulse', src: 'matios-ui-spinner/demo.html' },
      { id: 'toast', component: 'toast', title: 'MTS.Toast', subtitle: 'Notificaciones fugaces con posición, acción y barra de progreso', src: 'matios-ui-toast/demo.html' },
      { id: 'popover', component: 'popover', title: 'MTS.Popover', subtitle: 'Tooltip enriquecido con título, contenido HTML, flecha y cierre', src: 'matios-ui-popover/demo.html' },
      { id: 'lightbox', component: 'lightbox', title: 'MTS.Lightbox', subtitle: 'Visor de medios — imagen, video, YouTube, Vimeo, zoom, miniaturas', src: 'matios-ui-lightbox/demo.html' }
    ]);
  </script>
</body>
</html>
