name: CI

on:
  push:
    branches: [ main, "docs/english-normalization" ]
  pull_request:

jobs:
  smoke:
    name: Smoke test (load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      # Zero dependencies: the smoke test is pure Node, no install step.
      - name: Run smoke test
        run: node test/smoke.js
