<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Slider — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../utilities/matios-ui-codeblock/matios-ui-codeblock.css">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-slider.css">
  <script src="../../forms/matios-ui-copybutton/matios-ui-copybutton.js"></script>
  <script src="../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../utilities/matios-ui-sanitize/matios-ui-sanitize.js"></script>
  <script src="../../utilities/matios-ui-codeblock/matios-ui-codeblock.js"></script>
  <script src="../../support/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../../base/matios-ui-i18n.js"></script>
  <script src="./matios-ui-slider-i18n.js"></script>
  <script src="./matios-ui-slider.js"></script>
</head>
<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Slider</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s3-title"></div><div id="tabs-s3"></div></div>
</div>

<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Slider']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Simple slider, dual range and programmatic control using the standard demo pattern.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Simple slider';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Dual range';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — API';

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="sl-basic"></div>' +
    '<div id="sl-percent"></div>' +
    '<div id="sl-step"></div>' +
    '<div class="result-box" id="sl-result">' + (D.resultSimple || '— move the sliders —') + '</div>' +
  '</div>';

var js_s1 =
  "new MTS.Slider('#sl-basic', {\n" +
  "  label: 'Volumen',\n" +
  "  min: 0, max: 100, value: 65,\n" +
  "  showValue: true,\n" +
  "  onChange: function(e) { setResult('sl-result', 'Volumen → ' + e.detail.value); }\n" +
  "});\n\n" +
  "new MTS.Slider('#sl-percent', {\n" +
  "  label: 'Brillo',\n" +
  "  min: 0, max: 100, value: 80,\n" +
  "  showValue: true,\n" +
  "  labelFormat: function(v) { return v + '%'; },\n" +
  "  onChange: function(e) { setResult('sl-result', 'Brillo → ' + e.detail.value + '%'); }\n" +
  "});\n\n" +
  "new MTS.Slider('#sl-step', {\n" +
  "  label: 'Temperatura',\n" +
  "  min: 16, max: 30, step: 0.5, value: 22,\n" +
  "  showValue: true,\n" +
  "  labelFormat: function(v) { return v + '°C'; },\n" +
  "  onChange: function(e) { setResult('sl-result', 'Temperatura → ' + e.detail.value + '°C'); }\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="sl-range"></div>' +
    '<div id="sl-price"></div>' +
    '<div class="result-box" id="sl-range-result">' + (D.resultRange || '— move the ranges —') + '</div>' +
  '</div>';

var js_s2 =
  "new MTS.Slider('#sl-range', {\n" +
  "  range: true,\n" +
  "  label: 'Rango de edad',\n" +
  "  min: 0, max: 100, value: [25, 45],\n" +
  "  showValue: true,\n" +
  "  onChange: function(e) { setResult('sl-range-result', 'Edad → ' + e.detail.value.join(' – ')); }\n" +
  "});\n\n" +
  "new MTS.Slider('#sl-price', {\n" +
  "  range: true,\n" +
  "  label: 'Precio',\n" +
  "  min: 0, max: 1000, step: 10, value: [200, 700],\n" +
  "  showValue: true,\n" +
  "  labelFormat: function(v) { return '$' + v[0] + ' – $' + v[1]; },\n" +
  "  onChange: function(e) { setResult('sl-range-result', 'Precio → $' + e.detail.value[0] + ' – $' + e.detail.value[1]); }\n" +
  "});";

var preview_s3 =
  '<div class="demo-stack">' +
    '<div id="sl-api"></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="sliderApi(25)">setValue(25)</button>' +
      '<button class="demo-btn-sm" onclick="sliderApi(50)">setValue(50)</button>' +
      '<button class="demo-btn-sm" onclick="sliderApi(90)">setValue(90)</button>' +
    '</div>' +
    '<div class="result-box" id="sl-api-result">' + (D.resultApi || '— use the buttons —') + '</div>' +
  '</div>';

var js_s3 =
  "var sliderApiInstance = new MTS.Slider('#sl-api', {\n" +
  "  label: 'API demo',\n" +
  "  min: 0, max: 100, value: 40,\n" +
  "  showValue: true,\n" +
  "  onChange: function(e) { setResult('sl-api-result', 'change → ' + e.detail.value); }\n" +
  "});\n\n" +
  "function sliderApi(value) {\n" +
  "  sliderApiInstance.setValue(value);\n" +
  "  setResult('sl-api-result', 'setValue(' + value + ') ✓');\n" +
  "}";

var sliderApiInstance;
function sliderApi(value) {
  if (!sliderApiInstance) return;
  sliderApiInstance.setValue(value);
  setResult('sl-api-result', (D.echoSetValue || 'setValue(') + value + ') ✓');
}

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.Slider('#sl-basic', {
    label: D.labelVolume || 'Volume',
    min: 0, max: 100, value: 65,
    showValue: true,
    onChange: function(e) { setResult('sl-result', (D.echoVolume || 'Volume → ') + e.detail.value); }
  });
  new MTS.Slider('#sl-percent', {
    label: D.labelBrightness || 'Brightness',
    min: 0, max: 100, value: 80,
    showValue: true,
    labelFormat: function(v) { return v + '%'; },
    onChange: function(e) { setResult('sl-result', (D.echoBrightness || 'Brightness → ') + e.detail.value + '%'); }
  });
  new MTS.Slider('#sl-step', {
    label: D.labelTemperature || 'Temperature',
    min: 16, max: 30, step: 0.5, value: 22,
    showValue: true,
    labelFormat: function(v) { return v + '°C'; },
    onChange: function(e) { setResult('sl-result', (D.echoTemperature || 'Temperature → ') + e.detail.value + '°C'); }
  });
});

makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.Slider('#sl-range', {
    range: true,
    label: D.labelAgeRange || 'Age range',
    min: 0, max: 100, value: [25, 45],
    showValue: true,
    onChange: function(e) { setResult('sl-range-result', (D.echoAge || 'Age → ') + e.detail.value.join(' – ')); }
  });
  new MTS.Slider('#sl-price', {
    range: true,
    label: D.labelPrice || 'Price',
    min: 0, max: 1000, step: 10, value: [200, 700],
    showValue: true,
    labelFormat: function(v) { return '$' + v[0] + ' – $' + v[1]; },
    onChange: function(e) { setResult('sl-range-result', (D.echoPrice || 'Price → ') + '$' + e.detail.value[0] + ' – $' + e.detail.value[1]); }
  });
});

makeSection('tabs-s3', preview_s3, js_s3, function() {
  sliderApiInstance = new MTS.Slider('#sl-api', {
    label: D.labelApiDemo || 'API demo',
    min: 0, max: 100, value: 40,
    showValue: true,
    onChange: function(e) { setResult('sl-api-result', (D.echoChange || 'change → ') + e.detail.value); }
  });
});
</script>
</body>
</html>
