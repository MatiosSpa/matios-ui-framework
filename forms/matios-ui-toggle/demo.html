<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Toggle — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../utilities/matios-ui-codeblock/matios-ui-codeblock.css">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-toggle.css">
  <script src="../../forms/matios-ui-copybutton/matios-ui-copybutton.js"></script>
  <script src="../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../utilities/matios-ui-sanitize/matios-ui-sanitize.js"></script>
  <script src="../../utilities/matios-ui-codeblock/matios-ui-codeblock.js"></script>
  <script src="../../support/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../../base/matios-ui-i18n.js"></script>
  <script src="./matios-ui-toggle-i18n.js"></script>
  <script src="./matios-ui-toggle.js"></script>
</head>
<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Toggle</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>
  <div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s3-title"></div><div id="tabs-s3"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s4-title"></div><div id="tabs-s4"></div></div>
</div>

<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Toggle']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'On/off switch in different sizes, with label, disabled and programmatic API.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Sizes';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — With label and events';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Disabled';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Programmatic API';

var preview_s1 =
  '<div class="demo-row">' +
    '<div class="demo-col"><div class="demo-label">sm</div><div id="tgl-sm"></div></div>' +
    '<div class="demo-col"><div class="demo-label">md (default)</div><div id="tgl-md"></div></div>' +
    '<div class="demo-col"><div class="demo-label">lg</div><div id="tgl-lg"></div></div>' +
  '</div>';

var js_s1 =
  "new MTS.Toggle('#tgl-sm', { label: 'Small', size: 'sm' });\n" +
  "new MTS.Toggle('#tgl-md', { label: 'Medium', size: 'md', checked: true });\n" +
  "new MTS.Toggle('#tgl-lg', { label: 'Large', size: 'lg' });";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="tgl-label1"></div>' +
    '<div id="tgl-label2"></div>' +
    '<div id="tgl-nolabel"></div>' +
    '<div class="result-box" id="tgl-result">' + (D.resultS2Placeholder || '— interact with the toggles —') + '</div>' +
  '</div>';

var js_s2 =
  "new MTS.Toggle('#tgl-label1', {\n" +
  "  label: 'Active notifications',\n" +
  "  checked: true,\n" +
  "  onChange: function(e) { setResult('tgl-result', 'Notifications: ' + e.detail.checked); }\n" +
  "});\n" +
  "new MTS.Toggle('#tgl-label2', {\n" +
  "  label: 'Maintenance mode',\n" +
  "  onChange: function(e) { setResult('tgl-result', 'Maintenance: ' + e.detail.checked); }\n" +
  "});\n" +
  "new MTS.Toggle('#tgl-nolabel', {\n" +
  "  checked: false,\n" +
  "  onChange: function(e) { setResult('tgl-result', 'No label: ' + e.detail.checked); }\n" +
  "});";

var preview_s3 =
  '<div class="demo-stack">' +
    '<div id="tgl-dis-off"></div>' +
    '<div id="tgl-dis-on"></div>' +
  '</div>';

var js_s3 =
  "new MTS.Toggle('#tgl-dis-off', { label: 'Not available', disabled: true, checked: false });\n" +
  "new MTS.Toggle('#tgl-dis-on', { label: 'Forced active', disabled: true, checked: true });";

var preview_s4 =
  '<div class="demo-stack">' +
    '<div id="tgl-api"></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'isChecked\')">isChecked()</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'setTrue\')">setChecked(true)</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'setFalse\')">setChecked(false)</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'toggle\')">toggle()</button>' +
    '</div>' +
    '<div class="result-box" id="api-result">' + (D.resultApiPlaceholder || '— use the buttons to call the API —') + '</div>' +
  '</div>';

var js_s4 =
  "var toggle = new MTS.Toggle('#tgl-api', {\n" +
  "  label: 'Controlled toggle',\n" +
  "  checked: false,\n" +
  "  onChange: function(e) { setResult('api-result', 'changed: ' + e.detail.checked); }\n" +
  "});\n\n" +
  "toggle.isChecked();\n" +
  "toggle.setChecked(true);\n" +
  "toggle.setChecked(false);\n" +
  "toggle.toggle();";

var tglApi;

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.Toggle('#tgl-sm', { label: D.labelSmall || 'Small', size: 'sm' });
  new MTS.Toggle('#tgl-md', { label: D.labelMedium || 'Medium (default)', size: 'md', checked: true });
  new MTS.Toggle('#tgl-lg', { label: D.labelLarge || 'Large', size: 'lg' });
});
makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.Toggle('#tgl-label1', { label: D.labelNotifications || 'Active notifications', checked: true, onChange: function(e) { setResult('tgl-result', (D.echoNotifications || 'Notifications: ') + e.detail.checked); } });
  new MTS.Toggle('#tgl-label2', { label: D.labelMaintenance || 'Maintenance mode', onChange: function(e) { setResult('tgl-result', (D.echoMaintenance || 'Maintenance: ') + e.detail.checked); } });
  new MTS.Toggle('#tgl-nolabel', { checked: false, onChange: function(e) { setResult('tgl-result', (D.echoNoLabel || 'No label: ') + e.detail.checked); } });
});
makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.Toggle('#tgl-dis-off', { label: D.labelNotAvailable || 'Not available', disabled: true, checked: false });
  new MTS.Toggle('#tgl-dis-on', { label: D.labelForcedActive || 'Forced active', disabled: true, checked: true });
});
makeSection('tabs-s4', preview_s4, js_s4, function() {
  tglApi = new MTS.Toggle('#tgl-api', {
    label: D.labelControlled || 'Controlled toggle',
    checked: false,
    onChange: function(e) { setResult('api-result', (D.echoChanged || 'changed: ') + e.detail.checked); }
  });
});

function apiDemo(action) {
  var res = document.getElementById('api-result');
  if (!tglApi || !res) return;
  if (action === 'isChecked') res.textContent = (D.echoIsChecked || 'isChecked() → ') + tglApi.isChecked();
  if (action === 'setTrue')   { tglApi.setChecked(true);  res.textContent = D.echoSetTrue || 'setChecked(true) ✓'; }
  if (action === 'setFalse')  { tglApi.setChecked(false); res.textContent = D.echoSetFalse || 'setChecked(false) ✓'; }
  if (action === 'toggle')    { tglApi.toggle();          res.textContent = (D.echoToggle || 'toggle() → now: ') + tglApi.isChecked(); }
}

</script>
</body>
</html>
