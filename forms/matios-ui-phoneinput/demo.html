<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.PhoneInput — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../shared/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-phoneinput.css">
  <script src="../../shared/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-phoneinput.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.PhoneInput</h1>
    <p>Input de teléfono con selector de país, formato automático y enhancement progresivo desde HTML declarativo.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-phoneinput.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

<div class="demo-section"><div class="demo-section-title">1 — Básico — Chile default</div><div id="tabs-s1"></div></div>
<div class="demo-section"><div class="demo-section-title">2 — Diferentes países iniciales</div><div id="tabs-s2"></div></div>
<div class="demo-section"><div class="demo-section-title">3 — Tamaños + API</div><div id="tabs-s3"></div></div>
<div class="demo-section"><div class="demo-section-title">4 — HTML declarativo + enhancement</div><div id="tabs-s4"></div></div>
</div>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var m = t.match(/^<\s*([a-z0-9-]+)/i);
      var tag = m ? m[1] : '';
      var selfClosing = /\/>$/.test(t) || voids.test(tag);
      if (!selfClosing) indent += step;
    } else {
      result += ' '.repeat(indent) + t + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}


var preview_s1 =
  '<div class="demo-grid">' +
    '<div id="ph-basic"></div>' +
    '<div id="ph-hint"></div>' +
    '<div id="ph-disabled"></div>' +
  '</div>' +
  '<div class="result-box" id="res-ph">— interactúa —</div>';

var js_s1 =
  "new MTS.PhoneInput('#ph-basic', { label: 'Teléfono', country: 'CL', onChange: function(v) { setResult('res-ph', 'full: ' + v.full + ' | country: ' + v.country.name); } });\n" +
  "new MTS.PhoneInput('#ph-hint', { label: 'Con hint', country: 'CL', hint: 'Incluye el código de área' });\n" +
  "new MTS.PhoneInput('#ph-disabled', { label: 'Deshabilitado', country: 'CL', value: '912345678', disabled: true });";

var preview_s2 =
  '<div class="demo-grid">' +
    '<div id="ph-mx"></div>' +
    '<div id="ph-ar"></div>' +
    '<div id="ph-us"></div>' +
  '</div>';

var js_s2 =
  "new MTS.PhoneInput('#ph-mx', { country: 'MX', label: 'México' });\n" +
  "new MTS.PhoneInput('#ph-ar', { country: 'AR', label: 'Argentina' });\n" +
  "new MTS.PhoneInput('#ph-us', { country: 'US', label: 'EE.UU.' });";

var preview_s3 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div class="demo-col"><div class="demo-label">SM</div><div id="ph-sm"></div></div>' +
      '<div class="demo-col"><div class="demo-label">MD</div><div id="ph-md"></div></div>' +
      '<div class="demo-col"><div class="demo-label">LG + API</div><div id="ph-lg"></div></div>' +
    '</div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="phApiDemo(\'setCountry\')">setCountry(BR)</button>' +
      '<button class="demo-btn-sm" onclick="phApiDemo(\'setError\')">setError()</button>' +
      '<button class="demo-btn-sm" onclick="phApiDemo(\'clearError\')">clearError()</button>' +
      '<button class="demo-btn-sm" onclick="phApiDemo(\'getValue\')">getValue()</button>' +
    '</div>' +
    '<div class="result-box" id="res-ph-api">— interactúa —</div>' +
  '</div>';

var js_s3 =
  "new MTS.PhoneInput('#ph-sm', { label: 'SM', size: 'sm', country: 'CL' });\n" +
  "new MTS.PhoneInput('#ph-md', { label: 'MD', size: 'md', country: 'CL' });\n\n" +
  "var phApi = new MTS.PhoneInput('#ph-lg', { label: 'LG + API', size: 'lg', country: 'CL', onChange: function(v) { setResult('res-ph-api', 'full: ' + v.full); } });\n\n" +
  "phApi.getValue();\nphApi.setCountry('BR');\nphApi.setError('Número inválido');\nphApi.clearError();";

var preview_s4 =
  '<div class="demo-stack">' +
    '<div class="demo-col">' +
      '<div class="demo-label">HTML declarativo</div>' +
      '<div id="ph-declarative" data-label="Teléfono" data-country="CL" data-placeholder="9 1234 5678"></div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">HTML declarativo + enhancement</div>' +
      '<div id="ph-enhanced" data-label="Teléfono corporativo" data-country="MX" data-hint="Matios UI potencia el HTML base"></div>' +
      '<div class="result-box" id="res-ph-enhance">— cambia país o número para ver el enhancement —</div>' +
    '</div>' +
  '</div>';

var js_s4 =
  "new MTS.PhoneInput('#ph-declarative');\n\n" +
  "new MTS.PhoneInput('#ph-enhanced', { onChange: function(v) { setResult('res-ph-enhance', 'full: ' + v.full); }, onCountryChange: function(v) { setResult('res-ph-enhance', 'country: ' + v.country.name); } });";

var phApi;

function phApiDemo(action) {
  if (!phApi) return;
  if (action === 'setCountry') { phApi.setCountry('BR'); setResult('res-ph-api', 'setCountry(BR) aplicado'); }
  if (action === 'setError') { phApi.setError('Número inválido'); setResult('res-ph-api', 'setError() aplicado'); }
  if (action === 'clearError') { phApi.clearError(); setResult('res-ph-api', 'clearError() aplicado'); }
  if (action === 'getValue') { var v = phApi.getValue(); setResult('res-ph-api', 'getValue() → ' + v.full); }
}

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.PhoneInput('#ph-basic',{label:'Teléfono',country:'CL',onChange:function(v){setResult('res-ph','full: ' + v.full + ' | country: ' + v.country.name);}});
  new MTS.PhoneInput('#ph-hint',{label:'Con hint',country:'CL',hint:'Incluye el código de área'});
  new MTS.PhoneInput('#ph-disabled',{label:'Deshabilitado',country:'CL',value:'912345678',disabled:true});
});

makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.PhoneInput('#ph-mx',{label:'México',country:'MX'});
  new MTS.PhoneInput('#ph-ar',{label:'Argentina',country:'AR'});
  new MTS.PhoneInput('#ph-us',{label:'EE.UU.',country:'US'});
});

makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.PhoneInput('#ph-sm',{label:'SM',size:'sm',country:'CL'});
  new MTS.PhoneInput('#ph-md',{label:'MD',size:'md',country:'CL'});
  phApi = new MTS.PhoneInput('#ph-lg',{label:'LG + API',size:'lg',country:'CL',onChange:function(v){setResult('res-ph-api','full: ' + v.full);}});
});

makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.PhoneInput('#ph-declarative');
  new MTS.PhoneInput('#ph-enhanced',{onChange:function(v){setResult('res-ph-enhance','full: ' + v.full);},onCountryChange:function(v){setResult('res-ph-enhance','country: ' + v.country.name);}});
});

</script>
</body>
</html>
