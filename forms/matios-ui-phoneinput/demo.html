<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var m = t.match(/^<\s*([a-z0-9-]+)/i);
      var tag = m ? m[1] : '';
      var selfClosing = /\/>$/.test(t) || voids.test(tag);
      if (!selfClosing) indent += step;
    } else {
      result += ' '.repeat(indent) + t + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLanguage === 'function') MTS.setLanguage(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getString && MTS.getString()['MTS.PhoneInput'] && MTS.getString()['MTS.PhoneInput'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Phone input with country selector, automatic formatting and progressive enhancement from declarative HTML.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Basic — Chile default';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Different initial countries';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Sizes + API';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Declarative HTML + enhancement';

var L_phone           = D.labelPhone           || 'Phone';
var L_withHint        = D.labelWithHint         || 'With hint';
var L_disabled        = D.labelDisabled         || 'Disabled';
var L_hintAreaCode    = D.hintAreaCode          || 'Include the area code';
var L_mexico          = D.labelMexico           || 'Mexico';
var L_argentina       = D.labelArgentina        || 'Argentina';
var L_usa             = D.labelUsa              || 'USA';
var L_lgApi           = D.labelLgApi            || 'LG + API';
var L_corporatePhone  = D.labelCorporatePhone   || 'Corporate phone';
var L_hintEnhancement = D.hintEnhancement       || 'Matios UI enhances the base HTML';
var L_sectionDeclarative = D.sectionDeclarative || 'Declarative HTML';
var L_sectionEnhanced    = D.sectionEnhanced    || 'Declarative HTML + enhancement';
var L_resultPlaceholder        = D.resultPlaceholder        || '— interact —';
var L_resultEnhancePlaceholder = D.resultEnhancePlaceholder || '— change country or number to see the enhancement —';
var L_errorInvalid    = D.errorInvalid          || 'Invalid number';
var L_setCountryApplied = D.setCountryApplied   || 'setCountry(BR) applied';
var L_setErrorApplied   = D.setErrorApplied     || 'setError() applied';
var L_clearErrorApplied = D.clearErrorApplied   || 'clearError() applied';
var L_fullPrefix      = D.fullPrefix            || 'full: ';
var L_countryPrefix   = D.countryPrefix         || 'country: ';
var L_getValuePrefix  = D.getValuePrefix        || 'getValue() → ';

var preview_s1 =
  '<div class="demo-grid">' +
    '<div id="ph-basic"></div>' +
    '<div id="ph-hint"></div>' +
    '<div id="ph-disabled"></div>' +
  '</div>' +
  '<div class="result-box" id="res-ph">' + L_resultPlaceholder + '</div>';

var js_s1 =
  "new MTS.PhoneInput('#ph-basic', { label: 'Phone', country: 'CL', onChange: function(v) { setResult('res-ph', 'full: ' + v.full + ' | country: ' + v.country.name); } });\n" +
  "new MTS.PhoneInput('#ph-hint', { label: 'With hint', country: 'CL', hint: 'Include the area code' });\n" +
  "new MTS.PhoneInput('#ph-disabled', { label: 'Disabled', country: 'CL', value: '912345678', disabled: true });";

var preview_s2 =
  '<div class="demo-grid">' +
    '<div id="ph-mx"></div>' +
    '<div id="ph-ar"></div>' +
    '<div id="ph-us"></div>' +
  '</div>';

var js_s2 =
  "new MTS.PhoneInput('#ph-mx', { country: 'MX', label: 'Mexico' });\n" +
  "new MTS.PhoneInput('#ph-ar', { country: 'AR', label: 'Argentina' });\n" +
  "new MTS.PhoneInput('#ph-us', { country: 'US', label: 'USA' });";

var preview_s3 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div class="demo-col"><div class="demo-label">SM</div><div id="ph-sm"></div></div>' +
      '<div class="demo-col"><div class="demo-label">MD</div><div id="ph-md"></div></div>' +
      '<div class="demo-col"><div class="demo-label">LG + API</div><div id="ph-lg"></div></div>' +
    '</div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="phApiDemo(\'setCountry\')">setCountry(BR)</button>' +
      '<button class="demo-btn-sm" onclick="phApiDemo(\'setError\')">setError()</button>' +
      '<button class="demo-btn-sm" onclick="phApiDemo(\'clearError\')">clearError()</button>' +
      '<button class="demo-btn-sm" onclick="phApiDemo(\'getValue\')">getValue()</button>' +
    '</div>' +
    '<div class="result-box" id="res-ph-api">' + L_resultPlaceholder + '</div>' +
  '</div>';

var js_s3 =
  "new MTS.PhoneInput('#ph-sm', { label: 'SM', size: 'sm', country: 'CL' });\n" +
  "new MTS.PhoneInput('#ph-md', { label: 'MD', size: 'md', country: 'CL' });\n\n" +
  "var phApi = new MTS.PhoneInput('#ph-lg', { label: 'LG + API', size: 'lg', country: 'CL', onChange: function(v) { setResult('res-ph-api', 'full: ' + v.full); } });\n\n" +
  "phApi.getValue();\nphApi.setCountry('BR');\nphApi.setError('Invalid number');\nphApi.clearError();";

var preview_s4 =
  '<div class="demo-stack">' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + L_sectionDeclarative + '</div>' +
      '<div id="ph-declarative" data-label="' + L_phone + '" data-country="CL" data-placeholder="9 1234 5678"></div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + L_sectionEnhanced + '</div>' +
      '<div id="ph-enhanced" data-label="' + L_corporatePhone + '" data-country="MX" data-hint="' + L_hintEnhancement + '"></div>' +
      '<div class="result-box" id="res-ph-enhance">' + L_resultEnhancePlaceholder + '</div>' +
    '</div>' +
  '</div>';

var js_s4 =
  "new MTS.PhoneInput('#ph-declarative');\n\n" +
  "new MTS.PhoneInput('#ph-enhanced', { onChange: function(v) { setResult('res-ph-enhance', 'full: ' + v.full); }, onCountryChange: function(v) { setResult('res-ph-enhance', 'country: ' + v.country.name); } });";

var phApi;

function phApiDemo(action) {
  if (!phApi) return;
  if (action === 'setCountry') { phApi.setCountry('BR'); setResult('res-ph-api', L_setCountryApplied); }
  if (action === 'setError') { phApi.setError(L_errorInvalid); setResult('res-ph-api', L_setErrorApplied); }
  if (action === 'clearError') { phApi.clearError(); setResult('res-ph-api', L_clearErrorApplied); }
  if (action === 'getValue') { var v = phApi.getValue(); setResult('res-ph-api', L_getValuePrefix + v.full); }
}

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.PhoneInput('#ph-basic',{label:L_phone,country:'CL',onChange:function(v){setResult('res-ph',L_fullPrefix + v.full + ' | ' + L_countryPrefix + v.country.name);}});
  new MTS.PhoneInput('#ph-hint',{label:L_withHint,country:'CL',hint:L_hintAreaCode});
  new MTS.PhoneInput('#ph-disabled',{label:L_disabled,country:'CL',value:'912345678',disabled:true});
});

makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.PhoneInput('#ph-mx',{label:L_mexico,country:'MX'});
  new MTS.PhoneInput('#ph-ar',{label:L_argentina,country:'AR'});
  new MTS.PhoneInput('#ph-us',{label:L_usa,country:'US'});
});

makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.PhoneInput('#ph-sm',{label:'SM',size:'sm',country:'CL'});
  new MTS.PhoneInput('#ph-md',{label:'MD',size:'md',country:'CL'});
  phApi = new MTS.PhoneInput('#ph-lg',{label:L_lgApi,size:'lg',country:'CL',onChange:function(v){setResult('res-ph-api',L_fullPrefix + v.full);}});
});

makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.PhoneInput('#ph-declarative');
  new MTS.PhoneInput('#ph-enhanced',{onChange:function(v){setResult('res-ph-enhance',L_fullPrefix + v.full);},onCountryChange:function(v){setResult('res-ph-enhance',L_countryPrefix + v.country.name);}});
});

</script>
