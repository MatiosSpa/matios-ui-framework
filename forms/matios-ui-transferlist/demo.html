<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.TransferList - Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../shared/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-alert/matios-ui-alert.css">
  <link rel="stylesheet" href="./matios-ui-transferlist.css">
  <script src="../../shared/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
  <script src="./matios-ui-transferlist.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">-</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.TransferList</h1>
    <p>Transferencia entre listas con seleccion, mover uno, mover todos, drag & drop y validacion previa al traslado.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-transferlist.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 - Basico</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 - Roles por modulo</div><div id="tabs-s2"></div></div>
</div>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '520px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="demo-basic-transfer"></div>' +
  '</div>';

var js_s1 =
  "new MTS.TransferList('#demo-basic-transfer', {\n" +
  "  label: 'Etiquetas',\n" +
  "  availableTitle: 'Disponibles',\n" +
  "  selectedTitle: 'Seleccionadas',\n" +
  "  availableItems: [\n" +
  "    { id: 'design', label: 'Design', description: 'Perfil creativo' },\n" +
  "    { id: 'ops', label: 'Operations', description: 'Perfil operativo' },\n" +
  "    { id: 'support', label: 'Support', description: 'Perfil de soporte' }\n" +
  "  ],\n" +
  "  selectedItems: [\n" +
  "    { id: 'billing', label: 'Billing', description: 'Perfil financiero' }\n" +
  "  ],\n" +
  "  itemKey: 'id',\n" +
  "  itemLabel: 'label',\n" +
  "  itemDescription: 'description'\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="demo-role-alert"></div>' +
    '<div id="demo-role-transfer"></div>' +
  '</div>';

var js_s2 =
  "new MTS.TransferList('#demo-role-transfer', {\n" +
  "  label: 'Perfiles del rol',\n" +
  "  hint: 'No se permite repetir modulo en la lista derecha.',\n" +
  "  availableTitle: 'Perfiles disponibles',\n" +
  "  selectedTitle: 'Perfiles del rol',\n" +
  "  availableItems: profiles,\n" +
  "  selectedItems: [],\n" +
  "  itemKey: 'id',\n" +
  "  itemLabel: 'name',\n" +
  "  itemDescription: 'description',\n" +
  "  itemMeta: function(item) { return item.moduleName; },\n" +
  "  beforeTransfer: function(ctx) {\n" +
  "    if (ctx.to !== 'selected') return true;\n" +
  "    var duplicatedModule = ctx.selectedItems.some(function(selected) {\n" +
  "      return selected.moduleId === ctx.item.moduleId;\n" +
  "    });\n" +
  "    if (duplicatedModule) return 'Solo se permite un perfil por modulo.';\n" +
  "    return true;\n" +
  "  },\n" +
  "  onInvalidTransfer: function(event) {\n" +
  "    MTS.Alert.show('#demo-role-alert', {\n" +
  "      variant: 'warning',\n" +
  "      title: 'Transferencia bloqueada',\n" +
  "      message: event.detail.message,\n" +
  "      closable: true\n" +
  "    });\n" +
  "  }\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function () {
  new MTS.TransferList('#demo-basic-transfer', {
    label: 'Etiquetas',
    availableTitle: 'Disponibles',
    selectedTitle: 'Seleccionadas',
    availableItems: [
      { id: 'design', label: 'Design', description: 'Perfil creativo' },
      { id: 'ops', label: 'Operations', description: 'Perfil operativo' },
      { id: 'support', label: 'Support', description: 'Perfil de soporte' }
    ],
    selectedItems: [
      { id: 'billing', label: 'Billing', description: 'Perfil financiero' }
    ],
    itemKey: 'id',
    itemLabel: 'label',
    itemDescription: 'description'
  });
});

makeSection('tabs-s2', preview_s2, js_s2, function () {
  var profiles = [
    { id: 'users-base', name: 'Workspace base', description: 'Acceso base a usuarios.', moduleId: 'users', moduleName: 'Usuarios' },
    { id: 'users-supervisor', name: 'Supervisor operacional', description: 'Gestion avanzada de usuarios.', moduleId: 'users', moduleName: 'Usuarios' },
    { id: 'docs-editor', name: 'Editor documental', description: 'Edicion de documentos.', moduleId: 'documents', moduleName: 'Documentos' },
    { id: 'docs-approver', name: 'Aprobador documental', description: 'Aprobacion de documentos.', moduleId: 'documents', moduleName: 'Documentos' },
    { id: 'billing-view', name: 'Consulta financiera', description: 'Lectura de billing.', moduleId: 'billing', moduleName: 'Billing' }
  ];

  new MTS.TransferList('#demo-role-transfer', {
    label: 'Perfiles del rol',
    hint: 'Arrastra o mueve entre listas. No se permite repetir modulo en seleccionados.',
    availableTitle: 'Perfiles disponibles',
    selectedTitle: 'Perfiles del rol',
    availableItems: profiles,
    selectedItems: [],
    itemKey: 'id',
    itemLabel: 'name',
    itemDescription: 'description',
    itemMeta: function (item) { return item.moduleName; },
    beforeTransfer: function (ctx) {
      if (ctx.to !== 'selected') return true;
      var duplicatedModule = ctx.selectedItems.some(function (selected) {
        return selected.moduleId === ctx.item.moduleId;
      });
      if (duplicatedModule) return 'Solo se permite un perfil por modulo.';
      return true;
    },
    onInvalidTransfer: function (event) {
      document.getElementById('demo-role-alert').innerHTML = '';
      MTS.Alert.show('#demo-role-alert', {
        variant: 'warning',
        title: 'Transferencia bloqueada',
        message: event.detail.message,
        closable: true
      });
    },
    onChange: function () {
      document.getElementById('demo-role-alert').innerHTML = '';
    }
  });
}, '580px');
</script>
</body>
</html>
