<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

</div>

<script>
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0,indent-step); result+=' '.repeat(indent)+t+'\n'; }
    else if(/^<[^!]/.test(t)){
      result+=' '.repeat(indent)+t+'\n';
      var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||'';
      if(!voids.test(tag) && !/\/>$/.test(t)) indent+=step;
    } else {
      var text=t.replace(/\s+/g,' '); if(text) result+=' '.repeat(indent)+text+'\n';
    }
  });
  return result.trimEnd();
}
function showPickerOutput(id, val, fmt){
  var el=document.getElementById(id);
  if(el) el.textContent = fmt || String(val) || '—';
}

// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.DatePicker']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Date, time, range, month and week pickers. Each type is an independent class.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Date / Time / DateTime';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Date Range';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Month / Week';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Common API';
document.getElementById('s5-title').textContent      = D.s5Title || '5 — Linked range (From / To) · linkRange';

var preview1 =
  '<div class="demo-grid">' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + (D.labelDate || 'Date') + '</div>' +
      '<input type="text" id="picker-date">' +
      '<div class="result-box" id="out-picker-date">' + (D.outDate || '— pick a date —') + '</div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + (D.labelTime || 'Time') + '</div>' +
      '<input type="text" id="picker-time">' +
      '<div class="result-box" id="out-picker-time">' + (D.outTime || '— pick a time —') + '</div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + (D.labelDateTime || 'DateTime') + '</div>' +
      '<input type="text" id="picker-datetime">' +
      '<div class="result-box" id="out-picker-datetime">' + (D.outDateTime || '— pick date and time —') + '</div>' +
    '</div>' +
  '</div>';
var js1 =
  "new MTS.DatePicker.Date('#picker-date', {\n" +
  "  format: 'DD/MM/YYYY',\n" +
  "  clearable: true,\n" +
  "  onChange: function(e){ showPickerOutput('out-picker-date', e.detail.value, e.detail.formatted); }\n" +
  "});\n\n" +
  "new MTS.DatePicker.Time('#picker-time', {\n" +
  "  timeStep: 5,\n" +
  "  startHour: 8,\n" +
  "  endHour: 20,\n" +
  "  btnNow: 'Now',\n" +
  "  btnAccept: 'Accept',\n" +
  "  onChange: function(e){ showPickerOutput('out-picker-time', null, e.detail.formatted); }\n" +
  "});\n\n" +
  "new MTS.DatePicker.DateTime('#picker-datetime', {\n" +
  "  format: 'DD/MM/YYYY',\n" +
  "  timeStep: 5,\n" +
  "  btnToday: 'Today',\n" +
  "  btnAccept: 'Accept',\n" +
  "  onChange: function(e){ showPickerOutput('out-picker-datetime', e.detail.value, e.detail.formatted); }\n" +
  "});";

var preview2 =
  '<div class="demo-col">' +
    '<div class="demo-label">' + (D.labelRange || 'Date Range') + '</div>' +
    '<input type="text" id="picker-range">' +
    '<div class="result-box" id="out-picker-range">' + (D.outRange || '— pick a range —') + '</div>' +
  '</div>';
var js2 =
  "new MTS.DatePicker.DateRange('#picker-range', {\n" +
  "  format: 'DD/MM/YYYY',\n" +
  "  btnClear: 'Clear',\n" +
  "  btnAccept: 'Apply',\n" +
  "  onChange: function(e){\n" +
  "    var v = e.detail.value;\n" +
  "    var fmt = (v && v.start ? v.start.toLocaleDateString('en-US') : '—') + ' → ' + (v && v.end ? v.end.toLocaleDateString('en-US') : '—');\n" +
  "    showPickerOutput('out-picker-range', null, fmt);\n" +
  "  }\n" +
  "});";

var preview3 =
  '<div class="demo-grid">' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + (D.labelMonth || 'Month') + '</div>' +
      '<input type="text" id="picker-month">' +
      '<div class="result-box" id="out-picker-month">' + (D.outMonth || '— pick a month —') + '</div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + (D.labelWeek || 'Week') + '</div>' +
      '<input type="text" id="picker-week">' +
      '<div class="result-box" id="out-picker-week">' + (D.outWeek || '— pick a week —') + '</div>' +
    '</div>' +
  '</div>';
var js3 =
  "new MTS.DatePicker.Month('#picker-month', {\n" +
  "  onChange: function(e){ showPickerOutput('out-picker-month', null, e.detail.formatted); }\n" +
  "});\n\n" +
  "new MTS.DatePicker.Week('#picker-week', {\n" +
  "  onChange: function(e){ showPickerOutput('out-picker-week', null, e.detail.formatted); }\n" +
  "});";

var preview4 = '<div class="result-box">' + (D.apiHint || 'Common API available for every picker type.') + '</div>';
var js4 =
  "var picker = new MTS.DatePicker.Date('#mi-picker', { format: 'DD/MM/YYYY' });\n\n" +
  "picker.open();\n" +
  "picker.close();\n" +
  "picker.getValue();\n" +
  "picker.setValue(new Date());\n" +
  "picker.clear();\n" +
  "picker.destroy();\n\n" +
  "picker.on('change', function(e){\n" +
  "  console.log(e.detail.value, e.detail.formatted);\n" +
  "});\n" +
  "picker.on('open', function(){});\n" +
  "picker.on('close', function(){});";


function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '420px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}
makeSection('tabs-pk1', preview1, js1, function(){
  new MTS.DatePicker.Date('#picker-date', {
    format:'DD/MM/YYYY', clearable:true,
    onChange:function(e){ showPickerOutput('out-picker-date', e.detail.value, e.detail.formatted); }
  });
  new MTS.DatePicker.Time('#picker-time', {
    timeStep:5, startHour:8, endHour:20, btnNow:(D.btnNow || 'Now'), btnAccept:(D.btnAccept || 'Accept'),
    onChange:function(e){ showPickerOutput('out-picker-time', null, e.detail.formatted); }
  });
  new MTS.DatePicker.DateTime('#picker-datetime', {
    format:'DD/MM/YYYY', timeStep:5, btnToday:(D.btnToday || 'Today'), btnAccept:(D.btnAccept || 'Accept'),
    onChange:function(e){ showPickerOutput('out-picker-datetime', e.detail.value, e.detail.formatted); }
  });
}, '460px');

makeSection('tabs-pk2', preview2, js2, function(){
  new MTS.DatePicker.DateRange('#picker-range', {
    format:'DD/MM/YYYY', btnClear:(D.btnClear || 'Clear'), btnAccept:(D.btnApply || 'Apply'),
    onChange:function(e){
      var v=e.detail.value;
      var loc=(D.localeCode || 'en-US');
      var fmt=(v && v.start ? v.start.toLocaleDateString(loc) : '—') + ' → ' + (v && v.end ? v.end.toLocaleDateString(loc) : '—');
      showPickerOutput('out-picker-range', null, fmt);
    }
  });
}, '360px');

makeSection('tabs-pk3', preview3, js3, function(){
  new MTS.DatePicker.Month('#picker-month', { onChange:function(e){ showPickerOutput('out-picker-month', null, e.detail.formatted); } });
  new MTS.DatePicker.Week('#picker-week', { onChange:function(e){ showPickerOutput('out-picker-week', null, e.detail.formatted); } });
}, '400px');

makeSection('tabs-pk4', preview4, js4, null, '280px');

var preview5 =
  '<div class="demo-grid">' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + (D.labelFrom || 'From') + '</div>' +
      '<input type="text" id="pk-from">' +
      '<div class="result-box" id="out-pk-from">' + (D.outFrom || '— start —') + '</div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + (D.labelTo || 'To') + '</div>' +
      '<input type="text" id="pk-to">' +
      '<div class="result-box" id="out-pk-to">' + (D.outTo || '— end —') + '</div>' +
    '</div>' +
  '</div>';
var js5 =
  "// Two independent fields, linked: 'to' can't be before 'from'\n" +
  "var from = new MTS.DatePicker.Date('#pk-from', { format: 'DD/MM/YYYY' });\n" +
  "var to   = new MTS.DatePicker.Date('#pk-to',   { format: 'DD/MM/YYYY' });\n\n" +
  "MTS.DatePicker.linkRange(from, to);\n" +
  "// → to.minDate = from · from.maxDate = to · live calendar refresh";
makeSection('tabs-pk5', preview5, js5, function(){
  var from = new MTS.DatePicker.Date('#pk-from', { format:'DD/MM/YYYY', clearable:true,
    onChange:function(e){ showPickerOutput('out-pk-from', e.detail.value, e.detail.formatted); } });
  var to = new MTS.DatePicker.Date('#pk-to', { format:'DD/MM/YYYY', clearable:true,
    onChange:function(e){ showPickerOutput('out-pk-to', e.detail.value, e.detail.formatted); } });
  MTS.DatePicker.linkRange(from, to);
}, '420px');
</script>
