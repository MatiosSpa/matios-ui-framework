<script>

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLanguage === 'function') MTS.setLanguage(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getString && MTS.getString()['MTS.ConfirmButton'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle  || 'Two-step inline confirmation for sensitive actions, with progressive enhancement from declarative HTML.';
document.getElementById('s1-title').textContent      = D.s1Title   || '1 — Variants';
document.getElementById('s2-title').textContent      = D.s2Title   || '2 — No timeout';
document.getElementById('s3-title').textContent      = D.s3Title   || '3 — Sizes';
document.getElementById('s4-title').textContent      = D.s4Title   || '4 — API';
document.getElementById('s5-title').textContent      = D.s5Title   || '5 — Declarative HTML + enhancement';

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var m = t.match(/^<\s*([a-z0-9-]+)/i);
      var tag = m ? m[1] : '';
      var selfClosing = /\/>$/.test(t) || voids.test(tag);
      if (!selfClosing) indent += step;
    } else {
      result += ' '.repeat(indent) + t + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div id="cb-danger"></div>' +
      '<div id="cb-warning"></div>' +
      '<div id="cb-secondary"></div>' +
    '</div>' +
    '<div class="result-box" id="cb-result">' + (D.resultButtonsHint || '— interact with the buttons —') + '</div>' +
  '</div>';

var js_s1 =
  "new MTS.ConfirmButton('#cb-danger', { label: 'Delete record', confirmLabel: 'Yes, delete', variant: 'secondary', confirmVariant: 'danger', timeout: 4000, onConfirm: function() { setResult('cb-result', 'onConfirm → deleted ✓'); }, onCancel: function() { setResult('cb-result', 'onCancel → cancelled'); } });\n" +
  "new MTS.ConfirmButton('#cb-warning', { label: 'Archive', confirmLabel: 'Yes, archive', variant: 'secondary', confirmVariant: 'warning', timeout: 4000, onConfirm: function() { setResult('cb-result', 'onConfirm → archived ✓'); } });\n" +
  "new MTS.ConfirmButton('#cb-secondary', { label: 'Reset settings', confirmLabel: 'Confirm', variant: 'secondary', confirmVariant: 'secondary', timeout: 4000, onConfirm: function() { setResult('cb-result', 'onConfirm → reset ✓'); } });";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div id="cb-notimeout"></div>' +
      '<div id="cb-ghost"></div>' +
    '</div>' +
    '<div class="result-box" id="cb-timeout-result">' + (D.resultTimeoutHint || '— confirm or cancel —') + '</div>' +
  '</div>';

var js_s2 =
  "new MTS.ConfirmButton('#cb-notimeout', { label: 'Logout', confirmLabel: 'Yes, logout', variant: 'ghost', confirmVariant: 'danger', timeout: 0, onConfirm: function() { setResult('cb-timeout-result', 'onConfirm → logged out ✓'); }, onCancel: function() { setResult('cb-timeout-result', 'onCancel → cancelled'); } });\n" +
  "new MTS.ConfirmButton('#cb-ghost', { label: 'Publish', confirmLabel: 'Yes, publish', variant: 'secondary', confirmVariant: 'primary', timeout: 4000, onConfirm: function() { setResult('cb-timeout-result', 'onConfirm → published ✓'); } });";

var preview_s3 =
  '<div class="demo-row">' +
    '<div class="demo-col"><div class="demo-label">SM</div><div id="cb-sm"></div></div>' +
    '<div class="demo-col"><div class="demo-label">MD</div><div id="cb-md"></div></div>' +
    '<div class="demo-col"><div class="demo-label">LG</div><div id="cb-lg"></div></div>' +
  '</div>';

var js_s3 =
  "new MTS.ConfirmButton('#cb-sm', { label: 'Delete', size: 'sm', confirmVariant: 'danger', onConfirm: function() {} });\n" +
  "new MTS.ConfirmButton('#cb-md', { label: 'Delete', size: 'md', confirmVariant: 'danger', onConfirm: function() {} });\n" +
  "new MTS.ConfirmButton('#cb-lg', { label: 'Delete', size: 'lg', confirmVariant: 'danger', onConfirm: function() {} });";

var preview_s4 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div id="cb-api"></div>' +
      '<button class="demo-btn-sm" onclick="cbApiDemo(\'reset\')">reset()</button>' +
      '<button class="demo-btn-sm" onclick="cbApiDemo(\'disable\')">disable()</button>' +
      '<button class="demo-btn-sm" onclick="cbApiDemo(\'enable\')">enable()</button>' +
    '</div>' +
    '<div class="result-box" id="cb-api-result">' + (D.resultApiHint || '— use the buttons to call the API —') + '</div>' +
  '</div>';

var js_s4 =
  "var cbApi = new MTS.ConfirmButton('#cb-api', { label: 'Delete', confirmVariant: 'danger', onConfirm: function() { setResult('cb-api-result', 'onConfirm → confirmed'); }, onCancel: function() { setResult('cb-api-result', 'onCancel → cancelled'); } });\n\n" +
  "cbApi.reset();\ncbApi.disable();\ncbApi.enable();";

var preview_s5 =
  '<div class="demo-stack">' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + (D.labelDeclarative || 'Declarative HTML') + '</div>' +
      '<div id="cb-declarative" data-label="Delete record" data-confirm-label="Yes, delete" data-cancel-label="Cancel" data-variant="secondary" data-confirm-variant="danger" data-timeout="4000"></div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + (D.labelEnhanced || 'Declarative HTML + enhancement') + '</div>' +
      '<div id="cb-enhanced" data-label="Archive item" data-confirm-label="Yes, archive" data-variant="secondary" data-confirm-variant="warning" data-timeout="4000"></div>' +
      '<div class="result-box" id="cb-enhance-result">' + (D.resultEnhanceHint || '— confirm or cancel to see the enhancement —') + '</div>' +
    '</div>' +
  '</div>';

var js_s5 =
  "new MTS.ConfirmButton('#cb-declarative');\n\n" +
  "new MTS.ConfirmButton('#cb-enhanced', { onConfirm: function() { setResult('cb-enhance-result', 'onConfirm → archived ✓'); }, onCancel: function() { setResult('cb-enhance-result', 'onCancel → cancelled'); } });";

var cbApi;

function cbApiDemo(action) {
  if (!cbApi) return;
  if (action === 'reset') { cbApi.reset(); setResult('cb-api-result', D.echoResetApplied || 'reset() applied'); }
  if (action === 'disable') { cbApi.disable(); setResult('cb-api-result', D.echoDisableApplied || 'disable() applied'); }
  if (action === 'enable') { cbApi.enable(); setResult('cb-api-result', D.echoEnableApplied || 'enable() applied'); }
}

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.ConfirmButton('#cb-danger',{label:'Delete record',confirmLabel:'Yes, delete',variant:'secondary',confirmVariant:'danger',timeout:4000,onConfirm:function(){setResult('cb-result',D.echoDeleted || 'onConfirm → deleted ✓');},onCancel:function(){setResult('cb-result',D.echoCancelled || 'onCancel → cancelled');}});
  new MTS.ConfirmButton('#cb-warning',{label:'Archive',confirmLabel:'Yes, archive',variant:'secondary',confirmVariant:'warning',timeout:4000,onConfirm:function(){setResult('cb-result',D.echoArchived || 'onConfirm → archived ✓');}});
  new MTS.ConfirmButton('#cb-secondary',{label:'Reset settings',confirmLabel:'Confirm',variant:'secondary',confirmVariant:'secondary',timeout:4000,onConfirm:function(){setResult('cb-result',D.echoReset || 'onConfirm → reset ✓');}});
});

makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.ConfirmButton('#cb-notimeout',{label:'Logout',confirmLabel:'Yes, logout',variant:'ghost',confirmVariant:'danger',timeout:0,onConfirm:function(){setResult('cb-timeout-result',D.echoLoggedOut || 'onConfirm → logged out ✓');},onCancel:function(){setResult('cb-timeout-result',D.echoCancelled || 'onCancel → cancelled');}});
  new MTS.ConfirmButton('#cb-ghost',{label:'Publish',confirmLabel:'Yes, publish',variant:'secondary',confirmVariant:'primary',timeout:4000,onConfirm:function(){setResult('cb-timeout-result',D.echoPublished || 'onConfirm → published ✓');}});
});

makeSection('tabs-s3', preview_s3, js_s3, function() {

  new MTS.ConfirmButton('#cb-md',{label:'Delete',size:'md',confirmVariant:'danger',onConfirm:function(){}});
  new MTS.ConfirmButton('#cb-lg',{label:'Delete',size:'lg',confirmVariant:'danger',onConfirm:function(){}});

makeSection('tabs-s4', preview_s4, js_s4, function() {

});

makeSection('tabs-s5', preview_s5, js_s5, function() {
  new MTS.ConfirmButton('#cb-declarative');
  new MTS.ConfirmButton('#cb-enhanced',{onConfirm:function(){setResult('cb-enhance-result',D.echoArchived || 'onConfirm → archived ✓');},onCancel:function(){setResult('cb-enhance-result',D.echoCancelled || 'onCancel → cancelled');}});
});

</script>
