<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var m = t.match(/^<\s*([a-z0-9-]+)/i);
      var tag = m ? m[1] : '';
      var selfClosing = /\/>$/.test(t) || voids.test(tag);
      if (!selfClosing) indent += step;
    } else {
      result += ' '.repeat(indent) + t + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}


var preview_s1 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div id="cb-danger"></div>' +
      '<div id="cb-warning"></div>' +
      '<div id="cb-secondary"></div>' +
    '</div>' +
    '<div class="result-box" id="cb-result">— interactúa con los botones —</div>' +
  '</div>';

var js_s1 =
  "new MTS.ConfirmButton('#cb-danger', { label: 'Delete record', confirmLabel: 'Yes, delete', variant: 'secondary', confirmVariant: 'danger', timeout: 4000, onConfirm: function() { setResult('cb-result', 'onConfirm → deleted ✓'); }, onCancel: function() { setResult('cb-result', 'onCancel → cancelled'); } });\n" +
  "new MTS.ConfirmButton('#cb-warning', { label: 'Archive', confirmLabel: 'Yes, archive', variant: 'secondary', confirmVariant: 'warning', timeout: 4000, onConfirm: function() { setResult('cb-result', 'onConfirm → archived ✓'); } });\n" +
  "new MTS.ConfirmButton('#cb-secondary', { label: 'Reset settings', confirmLabel: 'Confirm', variant: 'secondary', confirmVariant: 'secondary', timeout: 4000, onConfirm: function() { setResult('cb-result', 'onConfirm → reset ✓'); } });";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div id="cb-notimeout"></div>' +
      '<div id="cb-ghost"></div>' +
    '</div>' +
    '<div class="result-box" id="cb-timeout-result">— confirma o cancela —</div>' +
  '</div>';

var js_s2 =
  "new MTS.ConfirmButton('#cb-notimeout', { label: 'Logout', confirmLabel: 'Yes, logout', variant: 'ghost', confirmVariant: 'danger', timeout: 0, onConfirm: function() { setResult('cb-timeout-result', 'onConfirm → logged out ✓'); }, onCancel: function() { setResult('cb-timeout-result', 'onCancel → cancelled'); } });\n" +
  "new MTS.ConfirmButton('#cb-ghost', { label: 'Publish', confirmLabel: 'Yes, publish', variant: 'secondary', confirmVariant: 'primary', timeout: 4000, onConfirm: function() { setResult('cb-timeout-result', 'onConfirm → published ✓'); } });";

var preview_s3 =
  '<div class="demo-row">' +
    '<div class="demo-col"><div class="demo-label">SM</div><div id="cb-sm"></div></div>' +
    '<div class="demo-col"><div class="demo-label">MD</div><div id="cb-md"></div></div>' +
    '<div class="demo-col"><div class="demo-label">LG</div><div id="cb-lg"></div></div>' +
  '</div>';

var js_s3 =
  "new MTS.ConfirmButton('#cb-sm', { label: 'Delete', size: 'sm', confirmVariant: 'danger', onConfirm: function() {} });\n" +
  "new MTS.ConfirmButton('#cb-md', { label: 'Delete', size: 'md', confirmVariant: 'danger', onConfirm: function() {} });\n" +
  "new MTS.ConfirmButton('#cb-lg', { label: 'Delete', size: 'lg', confirmVariant: 'danger', onConfirm: function() {} });";

var preview_s4 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div id="cb-api"></div>' +
      '<button class="demo-btn-sm" onclick="cbApiDemo(\'reset\')">reset()</button>' +
      '<button class="demo-btn-sm" onclick="cbApiDemo(\'disable\')">disable()</button>' +
      '<button class="demo-btn-sm" onclick="cbApiDemo(\'enable\')">enable()</button>' +
    '</div>' +
    '<div class="result-box" id="cb-api-result">— usa los botones para llamar la API —</div>' +
  '</div>';

var js_s4 =
  "var cbApi = new MTS.ConfirmButton('#cb-api', { label: 'Delete', confirmVariant: 'danger', onConfirm: function() { setResult('cb-api-result', 'onConfirm → confirmed'); }, onCancel: function() { setResult('cb-api-result', 'onCancel → cancelled'); } });\n\n" +
  "cbApi.reset();\ncbApi.disable();\ncbApi.enable();";

var preview_s5 =

    '<div class="demo-col">' +
      '<div class="demo-label">HTML declarativo</div>' +
      '<div id="cb-declarative" data-label="Delete record" data-confirm-label="Yes, delete" data-cancel-label="Cancel" data-variant="secondary" data-confirm-variant="danger" data-timeout="4000"></div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">HTML declarativo + enhancement</div>' +
      '<div id="cb-enhanced" data-label="Archive item" data-confirm-label="Yes, archive" data-variant="secondary" data-confirm-variant="warning" data-timeout="4000"></div>' +
      '<div class="result-box" id="cb-enhance-result">— confirma o cancela para ver el enhancement —</div>' +
    '</div>' +
  '</div>';

var js_s5 =
  "new MTS.ConfirmButton('#cb-declarative');\n\n" +
  "new MTS.ConfirmButton('#cb-enhanced', { onConfirm: function() { setResult('cb-enhance-result', 'onConfirm → archived ✓'); }, onCancel: function() { setResult('cb-enhance-result', 'onCancel → cancelled'); } });";

var cbApi;

function cbApiDemo(action) {
  if (!cbApi) return;
  if (action === 'reset') { cbApi.reset(); setResult('cb-api-result', 'reset() aplicado'); }
  if (action === 'disable') { cbApi.disable(); setResult('cb-api-result', 'disable() aplicado'); }
  if (action === 'enable') { cbApi.enable(); setResult('cb-api-result', 'enable() aplicado'); }
}

  new MTS.ConfirmButton('#cb-danger',{label:'Delete record',confirmLabel:'Yes, delete',variant:'secondary',confirmVariant:'danger',timeout:4000,onConfirm:function(){setResult('cb-result','onConfirm → deleted ✓');},onCancel:function(){setResult('cb-result','onCancel → cancelled');}});
  new MTS.ConfirmButton('#cb-warning',{label:'Archive',confirmLabel:'Yes, archive',variant:'secondary',confirmVariant:'warning',timeout:4000,onConfirm:function(){setResult('cb-result','onConfirm → archived ✓');}});
  new MTS.ConfirmButton('#cb-secondary',{label:'Reset settings',confirmLabel:'Confirm',variant:'secondary',confirmVariant:'secondary',timeout:4000,onConfirm:function(){setResult('cb-result','onConfirm → reset ✓');}});
});

  new MTS.ConfirmButton('#cb-notimeout',{label:'Logout',confirmLabel:'Yes, logout',variant:'ghost',confirmVariant:'danger',timeout:0,onConfirm:function(){setResult('cb-timeout-result','onConfirm → logged out ✓');},onCancel:function(){setResult('cb-timeout-result','onCancel → cancelled');}});
  new MTS.ConfirmButton('#cb-ghost',{label:'Publish',confirmLabel:'Yes, publish',variant:'secondary',confirmVariant:'primary',timeout:4000,onConfirm:function(){setResult('cb-timeout-result','onConfirm → published ✓');}});
