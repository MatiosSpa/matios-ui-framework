<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

    '<div id="inp-password" data-type="password" data-label="Contraseña" data-placeholder="••••••••" data-show-password></div>' +
    '<div id="inp-number" data-type="number" data-label="Cantidad" data-placeholder="0"></div>' +
  '</div>';

var js_s1 =
  "new MTS.Input('#inp-text');\n" +
  "new MTS.Input('#inp-email');\n" +
  "new MTS.Input('#inp-password');\n" +
  "new MTS.Input('#inp-number');";

var preview_s2 =
  '<div id="inp-textarea" data-type="textarea" data-label="Descripción" data-placeholder="Escribe aquí..." data-rows="4" data-max-length="300" data-show-count></div>';

var js_s2 =
  "new MTS.Input('#inp-textarea');";

var preview_s3 =
  '<div class="demo-grid">' +
    '<div id="inp-disabled" data-label="Campo deshabilitado" data-value="No editable" data-disabled></div>' +
    '<div id="inp-readonly" data-label="Solo lectura" data-value="Valor fijo" data-readonly></div>' +
    '<div id="inp-clearable" data-label="Con botón limpiar" data-placeholder="Escribe algo..." data-clearable></div>' +
    '<div id="inp-icon"></div>' +
  '</div>';

var js_s3 =
  "new MTS.Input('#inp-disabled');\n" +
  "new MTS.Input('#inp-readonly');\n" +
  "new MTS.Input('#inp-clearable');\n" +
  "new MTS.Input('#inp-icon', {\n" +
  "  label: 'Buscar',\n" +
  "  placeholder: 'Buscar...',\n" +
  "  iconLeft: MTS.Icon.get('search'),\n" +
  "  clearable: true\n" +
  "});";

var preview_s4 =

    '<div class="demo-grid">' +
      '<div id="inp-valid-email"></div>' +
      '<div id="inp-valid-len"></div>' +
    '</div>' +
    '<div class="result-box" id="valid-result">— interactúa con los campos, la validación ocurre al perder foco —</div>' +
  '</div>';

var js_s4 =
  "new MTS.Input('#inp-valid-email', {\n" +
  "  label: 'Email',\n" +
  "  placeholder: 'usuario@ejemplo.com',\n" +
  "  required: true,\n" +
  "  rules: { email: true },\n" +
  "  onBlur: function() { setResult('valid-result', 'Validado — válido: ' + this.isValid()); }\n" +
  "});\n\n" +
  "new MTS.Input('#inp-valid-len', {\n" +
  "  label: 'Usuario',\n" +
  "  placeholder: 'mínimo 4, máximo 20 caracteres',\n" +
  "  rules: { minLength: 4, maxLength: 20 },\n" +
  "  showCount: true,\n" +
  "  maxLength: 20\n" +
  "});";

var preview_s5 =
  '<div class="demo-stack">' +
    '<div id="inp-events" data-label="Campo con eventos" data-placeholder="Escribe algo..." data-hint="Observa los eventos en el panel inferior" data-required></div>' +
    '<div class="result-box" id="events-result">— interactúa con el campo —</div>' +
  '</div>';

var js_s5 =
  "new MTS.Input('#inp-events', {\n" +
  "  onChange: function(e) { setResult('events-result', 'change → \"' + e.detail.value + '\"'); },\n" +
  "  onFocus: function() { setResult('events-result', 'focus'); },\n" +
  "  onBlur: function(e) { setResult('events-result', 'blur → \"' + e.detail.value + '\"'); },\n" +
  "  onValidate: function(e) {\n" +
  "    setResult('events-result', 'validate → válido: ' + e.detail.valid + (e.detail.errors.length ? ' | ' + e.detail.errors[0] : ''));\n" +
  "  }\n" +
  "});";

var preview_s6 =
  '<div class="demo-stack">' +
    '<div id="inp-api" data-label="Campo controlado" data-placeholder="Controlado por API"></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'getValue\')">getValue()</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'setValue\')">setValue(\'Hola!\')</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'clear\')">clear()</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'disable\')">disable()</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'enable\')">enable()</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'setError\')">setError()</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'clearError\')">clearError()</button>' +
      '<button class="demo-btn-sm" onclick="apiDemo(\'focus\')">focus()</button>' +
    '</div>' +
    '<div class="result-box" id="api-result">— usa los botones para llamar la API —</div>' +
  '</div>';

var js_s6 =
  "var inpApi = new MTS.Input('#inp-api');\n\n" +
  "inpApi.getValue();\n" +
  "inpApi.setValue('Hola!');\n" +
  "inpApi.clear();\n" +
  "inpApi.disable();\n" +
  "inpApi.enable();\n" +
  "inpApi.setError('Mensaje de error externo');\n" +
  "inpApi.clearError();\n" +
  "inpApi.focus();";

var preview_s7 =
  '<div class="demo-stack">' +
    '<div class="demo-col">' +
      '<div class="demo-label">HTML declarativo</div>' +
      '<div id="inp-declarative" data-type="text" data-label="Nombre completo" data-placeholder="Ingresa tu nombre" data-hint="Inicializado desde data-*" data-clearable></div>' +
    '</div>' +
    '<div class="demo-col">' +

var js_s7 =

  "new MTS.Input('#inp-enhanced', {\n" +

makeSection('tabs-s1', preview_s1, js_s1, function() {

});

makeSection('tabs-s2', preview_s2, js_s2, function() {

});

makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.Input('#inp-disabled');
  new MTS.Input('#inp-readonly');
  new MTS.Input('#inp-clearable');

    label: 'Buscar',
    placeholder: 'Buscar...',
    iconLeft: MTS.Icon.get('search'),

    label: 'Usuario',
    placeholder: 'mínimo 4, máximo 20 caracteres',
    rules: { minLength: 4, maxLength: 20 },
    showCount: true,
    maxLength: 20

  new MTS.Input('#inp-events', {
    onChange: function(e) { setResult('events-result', 'change → "' + e.detail.value + '"'); },
    onFocus: function() { setResult('events-result', 'focus'); },
    onBlur: function(e) { setResult('events-result', 'blur → "' + e.detail.value + '"'); },
    onValidate: function(e) {
      setResult('events-result', 'validate → válido: ' + e.detail.valid + (e.detail.errors.length ? ' | ' + e.detail.errors[0] : ''));
    }
  });
});

var inpApi;
makeSection('tabs-s6', preview_s6, js_s6, function() {
  inpApi = new MTS.Input('#inp-api');
});

makeSection('tabs-s7', preview_s7, js_s7, function() {
  new MTS.Input('#inp-declarative');
  new MTS.Input('#inp-enhanced', {
    onChange: function(e) { setResult('enhancement-result', 'change → ' + e.detail.value); },
    onValidate: function(e) {
      setResult('enhancement-result', 'validate → válido: ' + e.detail.valid + (e.detail.errors.length ? ' | ' + e.detail.errors[0] : ''));
    }
  });
});

function apiDemo(action) {
  if (!inpApi) return;
  if (action === 'getValue')   setResult('api-result', 'getValue() → "' + inpApi.getValue() + '"');
  if (action === 'setValue')   { inpApi.setValue('Hola!'); setResult('api-result', 'setValue("Hola!") ✓'); }
  if (action === 'clear')      { inpApi.clear(); setResult('api-result', 'clear() ✓'); }
  if (action === 'disable')    { inpApi.disable(); setResult('api-result', 'disable() ✓'); }
  if (action === 'enable')     { inpApi.enable(); setResult('api-result', 'enable() ✓'); }
  if (action === 'setError')   { inpApi.setError('Error externo del servidor'); setResult('api-result', 'setError() ✓'); }
  if (action === 'clearError') { inpApi.clearError(); setResult('api-result', 'clearError() ✓'); }
  if (action === 'focus')      { inpApi.focus(); setResult('api-result', 'focus() ✓'); }
}
</script>
