    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

makeSection('tabs-s11', preview_s11, js_s11, function() {
  var ac11 = new MTS.Autocomplete('#ac-async', {
    datasource: function(query, done) {
      setTimeout(function() {
        var q = query.toLowerCase();
        done(_USERS_DB.filter(function(u) {
          return u.name.toLowerCase().indexOf(q) !== -1;
        }));
      }, 500);
    },
    valueField: 'id',
    textField:  'name',
    minChars:   2,
    debounce:   300,
    onSelect: function(item) {
      document.getElementById('ac-async-result').textContent =
        'text: ' + item.name + ' — value (id): ' + item.id + ' — email: ' + item.email;
    },
    onClear: function() {
      document.getElementById('ac-async-result').textContent = D.userAsyncPrompt || 'Select a user...';
    }
  });

  document.getElementById('ac-get-val').addEventListener('click', function() {
    var v = ac11.getValue();
    document.getElementById('ac-async-result').textContent =
      'getValue() → ' + (v !== null ? v : (D.getValueNull || 'null (no selection)'));
  });

  document.getElementById('ac-get-item').addEventListener('click', function() {
    var item = ac11.getItem();
    document.getElementById('ac-async-result').textContent =
      item ? 'getItem() → id:' + item.id + ' name:' + item.name : 'getItem() → null';
  });
}, '380px');

function apiDemo(action) {
  if (!inpApi) return;
  if (action === 'getValue')   setResult('api-result', 'getValue() → "' + inpApi.getValue() + '"');
  if (action === 'setValue')   { inpApi.setValue('Hi!'); setResult('api-result', 'setValue("Hi!") ✓'); }
  if (action === 'clear')      { inpApi.clear(); setResult('api-result', 'clear() ✓'); }
  if (action === 'disable')    { inpApi.disable(); setResult('api-result', 'disable() ✓'); }
  if (action === 'enable')     { inpApi.enable(); setResult('api-result', 'enable() ✓'); }
  if (action === 'setError')   { inpApi.setError(D.apiExternalError || 'External server error'); setResult('api-result', 'setError() ✓'); }
  if (action === 'clearError') { inpApi.clearError(); setResult('api-result', 'clearError() ✓'); }
  if (action === 'focus')      { inpApi.focus(); setResult('api-result', 'focus() ✓'); }
}
