<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Label — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">

  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../shared/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="./matios-ui-label.css">

<div class="demo-page">

    <h1><span>MTS</span>.Label</h1>

  <div class="demo-section"><div class="demo-section-title">2 — Hint y error</div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — Tamaños</div><div id="tabs-s3"></div></div>
  <div class="demo-section"><div class="demo-section-title">4 — API programática</div><div id="tabs-s4"></div></div>
  <div class="demo-section"><div class="demo-section-title">5 — HTML completo + enhancement</div><div id="tabs-s5"></div></div>
</div>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div class="mts-form-group">' +
      '<label class="mts-label" for="lbl-basic">Basic label</label>' +
      '<input class="mts-input" id="lbl-basic" placeholder="Regular field">' +
    '</div>' +
    '<div class="mts-form-group">' +
      '<label class="mts-label mts-label--required" for="lbl-required">Required field</label>' +
      '<input class="mts-input" id="lbl-required" placeholder="Required">' +
    '</div>' +
    '<div class="mts-form-group">' +
      '<label class="mts-label" for="lbl-optional">' +
        '<span class="mts-label__text">Optional field</span>' +
        '<span class="mts-label__optional">optional</span>' +
      '</label>' +
      '<input class="mts-input" id="lbl-optional" placeholder="Optional">' +
    '</div>' +
  '</div>';

var js_s1 =
  "// HTML puro: no requiere JavaScript\n" +
  "// Pure HTML: no JavaScript required";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div class="mts-form-group">' +
      '<label class="mts-label mts-label--required" for="lbl-hint">Email</label>' +
      '<input class="mts-input" id="lbl-hint" type="email" placeholder="user@example.com">' +
      '<span class="mts-form-hint">We\'ll never share your email.</span>' +
    '</div>' +
    '<div class="mts-form-group">' +
      '<label class="mts-label mts-label--required" for="lbl-error">Password</label>' +
      '<input class="mts-input" id="lbl-error" type="password" value="123">' +
      '<span class="mts-form-error">Minimum 8 characters required.</span>' +
    '</div>' +
  '</div>';

var js_s2 =
  "// Hint\n" +
  "new MTS.Label('#js-label-hint', {\n" +
  "  text: 'Email address',\n" +
  "  required: true,\n" +
  "  hint: \"We'll never share your email.\",\n" +
  "  forId: 'js-input-hint'\n" +
  "});\n\n" +
  "// Error\n" +
  "const lblError = new MTS.Label('#js-label-error', {\n" +
  "  text: 'Password',\n" +
  "  required: true,\n" +
  "  forId: 'js-input-error'\n" +
  "});\n" +
  "lblError.setError('Minimum 8 characters required.');";

var preview_s3 =
  '<div class="demo-stack">' +
    '<div class="mts-form-group">' +
      '<label class="mts-label mts-label--sm mts-label--required" for="lbl-sm">Small label</label>' +
      '<input class="mts-input" id="lbl-sm" placeholder="Small">' +
    '</div>' +
    '<div class="mts-form-group">' +
      '<label class="mts-label mts-label--required" for="lbl-md">Default label</label>' +
      '<input class="mts-input" id="lbl-md" placeholder="Default">' +
    '</div>' +
    '<div class="mts-form-group">' +
      '<label class="mts-label mts-label--lg mts-label--required" for="lbl-lg">Large label</label>' +
      '<input class="mts-input" id="lbl-lg" placeholder="Large">' +
    '</div>' +
  '</div>';

var js_s3 =
  "new MTS.Label('#js-label-sm', { text: 'Small label', size: 'sm', forId: 'js-input-sm' });\n" +
  "new MTS.Label('#js-label-md', { text: 'Default label', forId: 'js-input-md' });\n" +
  "new MTS.Label('#js-label-lg', { text: 'Large label', size: 'lg', forId: 'js-input-lg' });";

var preview_s4 =
  '<div class="demo-stack">' +
    '<div class="mts-form-group">' +
      '<label id="api-label"></label>' +
      '<input class="mts-input" id="api-input" placeholder="Controlled by API">' +
    '</div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="labelApiDemo(\'text\')">setText()</button>' +
      '<button class="demo-btn-sm" onclick="labelApiDemo(\'required\')">setRequired()</button>' +
      '<button class="demo-btn-sm" onclick="labelApiDemo(\'hint\')">setHint()</button>' +
      '<button class="demo-btn-sm" onclick="labelApiDemo(\'error\')">setError()</button>' +
      '<button class="demo-btn-sm" onclick="labelApiDemo(\'clear\')">clearError()</button>' +
    '</div>' +
    '<div class="result-box" id="label-api-result">— usa los botones para probar la API —</div>' +
  '</div>';

var js_s4 =
  "var labelApi = new MTS.Label('#api-label', {\n" +
  "  text: 'Profile name',\n" +
  "  forId: 'api-input'\n" +
  "});\n\n" +
  "labelApi.setText('Updated label');\n" +
  "labelApi.setRequired(true);\n" +
  "labelApi.setHint('Helper message');\n" +
  "labelApi.setError('Validation error');\n" +
  "labelApi.clearError();";

var preview_s5 =
  '<div class="mts-form-group">' +
    '<label id="decl-label" class="mts-label mts-label--required" for="decl-input">Email address</label>' +
    '<input class="mts-input" id="decl-input" type="email" placeholder="user@example.com">' +
  '</div>';

var js_s5 =
  "new MTS.Label('#decl-label', {\n" +
  "  forId: 'decl-input',\n" +
  "  hint: \"We'll never share your email.\"\n" +
  "});";

var labelApi;

function initS2() {
  new MTS.Label('#js-label-hint', {
    text: 'Email address',
    required: true,
    hint: "We'll never share your email.",
    forId: 'js-input-hint'
  });
  new MTS.Label('#js-label-error', {
    text: 'Password',
    required: true,
    forId: 'js-input-error'
  }).setError('Minimum 8 characters required.');
}

function initS3() {
  new MTS.Label('#js-label-sm', { text: 'Small label', size: 'sm', forId: 'js-input-sm' });
  new MTS.Label('#js-label-md', { text: 'Default label', forId: 'js-input-md' });
  new MTS.Label('#js-label-lg', { text: 'Large label', size: 'lg', forId: 'js-input-lg' });
}

function initS4() {
  labelApi = new MTS.Label('#api-label', {
    text: 'Profile name',
    forId: 'api-input'
  });
}

function labelApiDemo(action) {
  if (!labelApi) return;
  if (action === 'text') {
    labelApi.setText('Updated label');
    setResult('label-api-result', "setText('Updated label')");
  } else if (action === 'required') {
    labelApi.setRequired(true);
    setResult('label-api-result', 'setRequired(true)');
  } else if (action === 'hint') {
    labelApi.setHint('Helper message from API');
    setResult('label-api-result', "setHint('Helper message from API')");
  } else if (action === 'error') {
    labelApi.setError('Validation error from API');
    setResult('label-api-result', "setError('Validation error from API')");
  } else if (action === 'clear') {
    labelApi.clearError();
    setResult('label-api-result', 'clearError()');
  }
}

function initS5() {
  new MTS.Label('#decl-label', {
    forId: 'decl-input',
    hint: "We'll never share your email."
  });
}

makeSection('tabs-s1', preview_s1, js_s1);
makeSection('tabs-s2',
  '<div class="demo-stack">' +
    '<div class="mts-form-group">' +
      '<label id="js-label-hint"></label>' +
      '<input class="mts-input" id="js-input-hint" type="email" placeholder="user@example.com">' +
    '</div>' +
    '<div class="mts-form-group">' +
      '<label id="js-label-error"></label>' +
      '<input class="mts-input" id="js-input-error" type="password" value="123">' +
    '</div>' +
  '</div>', js_s2, initS2);
makeSection('tabs-s3',
  '<div class="demo-stack">' +
    '<div class="mts-form-group"><label id="js-label-sm"></label><input class="mts-input" id="js-input-sm" placeholder="Small"></div>' +
    '<div class="mts-form-group"><label id="js-label-md"></label><input class="mts-input" id="js-input-md" placeholder="Default"></div>' +
    '<div class="mts-form-group"><label id="js-label-lg"></label><input class="mts-input" id="js-input-lg" placeholder="Large"></div>' +
  '</div>', js_s3, initS3);
makeSection('tabs-s4', preview_s4, js_s4, initS4);
makeSection('tabs-s5', preview_s5, js_s5, initS5);
</script>
