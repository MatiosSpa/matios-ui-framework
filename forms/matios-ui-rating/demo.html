<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Rating — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../utilities/matios-ui-codeblock/matios-ui-codeblock.css">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">

  <script src="../../utilities/matios-ui-sanitize/matios-ui-sanitize.js"></script>
  <script src="../../utilities/matios-ui-codeblock/matios-ui-codeblock.js"></script>
  <script src="../../support/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-rating.js"></script>
</head>
<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Rating</h1>
    <p>Calificación por estrellas con variantes, tamaños y enhancement progresivo desde HTML declarativo.</p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 — Variantes</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Tamaños y API</div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — HTML declarativo + enhancement</div><div id="tabs-s3"></div></div>
</div>

<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="rating-basic"></div>' +
    '<div id="rating-half"></div>' +
    '<div id="rating-readonly"></div>' +
    '<div id="rating-10"></div>' +
    '<div class="result-box" id="rating-result">— haz click en las estrellas —</div>' +
  '</div>';

var js_s1 =
  "new MTS.Rating('#rating-basic', {\n" +
  "  value: 3,\n" +
  "  max: 5,\n" +
  "  onChange: function(e) { setResult('rating-result', 'Basic → ' + e.detail.value); }\n" +
  "});\n\n" +
  "new MTS.Rating('#rating-half', {\n" +
  "  value: 3.5,\n" +
  "  halfStars: true,\n" +
  "  onChange: function(e) { setResult('rating-result', 'Half → ' + e.detail.value); }\n" +
  "});\n\n" +
  "new MTS.Rating('#rating-readonly', {\n" +
  "  value: 4.5,\n" +
  "  halfStars: true,\n" +
  "  readonly: true\n" +
  "});\n\n" +
  "new MTS.Rating('#rating-10', {\n" +
  "  value: 7,\n" +
  "  max: 10,\n" +
  "  size: 'sm',\n" +
  "  onChange: function(e) { setResult('rating-result', 'Escala 10 → ' + e.detail.value); }\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="rating-sm"></div>' +
    '<div id="rating-md"></div>' +
    '<div id="rating-lg"></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="ratingApi(3)">setValue(3)</button>' +
      '<button class="demo-btn-sm" onclick="ratingApi(4)">setValue(4)</button>' +
      '<button class="demo-btn-sm" onclick="ratingApi(5)">setValue(5)</button>' +
      '<button class="demo-btn-sm" onclick="ratingApiGet()">getValue()</button>' +
    '</div>' +
    '<div class="result-box" id="rating-api-result">— usa los botones —</div>' +
  '</div>';

var js_s2 =
  "new MTS.Rating('#rating-sm', { value: 3, size: 'sm' });\n" +
  "new MTS.Rating('#rating-md', { value: 3, size: 'md' });\n" +
  "var ratingApiInstance = new MTS.Rating('#rating-lg', { value: 3, size: 'lg' });\n\n" +
  "ratingApiInstance.getValue();\n" +
  "ratingApiInstance.setValue(5);";

var preview_s3 =
  '<div class="demo-stack">' +
    '<div id="rating-declarative" data-value="4" data-half-stars data-size="lg"></div>' +
    '<div class="result-box" id="rating-declarative-result">— HTML declarativo + enhancement —</div>' +
  '</div>';

var js_s3 =
  "new MTS.Rating('#rating-declarative', {\n" +
  "  onChange: function(e) {\n" +
  "    setResult('rating-declarative-result', 'onChange → ' + e.detail.value);\n" +
  "  }\n" +
  "});";

var ratingApiInstance;
function ratingApi(value) {
  if (!ratingApiInstance) return;
  ratingApiInstance.setValue(value);
  setResult('rating-api-result', 'setValue(' + value + ') ✓');
}
function ratingApiGet() {
  if (!ratingApiInstance) return;
  setResult('rating-api-result', 'getValue() → ' + ratingApiInstance.getValue());
}

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.Rating('#rating-basic', {
    value: 3,
    max: 5,
    onChange: function(e) { setResult('rating-result', 'Basic → ' + e.detail.value); }
  });
  new MTS.Rating('#rating-half', {
    value: 3.5,
    halfStars: true,
    onChange: function(e) { setResult('rating-result', 'Half → ' + e.detail.value); }
  });
  new MTS.Rating('#rating-readonly', {
    value: 4.5,
    halfStars: true,
    readonly: true
  });
  new MTS.Rating('#rating-10', {
    value: 7,
    max: 10,
    size: 'sm',
    onChange: function(e) { setResult('rating-result', 'Escala 10 → ' + e.detail.value); }
  });
});

makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.Rating('#rating-sm', { value: 3, size: 'sm' });
  new MTS.Rating('#rating-md', { value: 3, size: 'md' });
  ratingApiInstance = new MTS.Rating('#rating-lg', { value: 3, size: 'lg' });
});

makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.Rating('#rating-declarative', {
    onChange: function(e) { setResult('rating-declarative-result', 'onChange → ' + e.detail.value); }
  });
});
</script>
</body>
