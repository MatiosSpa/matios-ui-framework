<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Radio — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../shared/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-radio.css">
  <script src="../../shared/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-radio.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Radio</h1>
    <p>Grupo de radio buttons vertical y horizontal, con opción deshabilitada y grupo completo disabled.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-radio.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>
  <div class="demo-section"><div class="demo-section-title">1 — Vertical (default)</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Horizontal</div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — Con opción deshabilitada</div><div id="tabs-s3"></div></div>
  <div class="demo-section"><div class="demo-section-title">4 — Grupo completo deshabilitado</div><div id="tabs-s4"></div></div>
</div>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="radio-v"></div>' +
    '<div class="result-box" id="radio-v-result">— selecciona una opción —</div>' +
  '</div>';

var js_s1 =
  "new MTS.Radio('#radio-v', {\n" +
  "  name: 'prioridad',\n" +
  "  value: 'medium',\n" +
  "  options: [\n" +
  "    { value: 'high', label: 'Alta' },\n" +
  "    { value: 'medium', label: 'Media' },\n" +
  "    { value: 'low', label: 'Baja' }\n" +
  "  ],\n" +
  "  onChange: function(e) { setResult('radio-v-result', 'valor: ' + e.detail.value); }\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="radio-h"></div>' +
    '<div class="result-box" id="radio-h-result">— selecciona una opción —</div>' +
  '</div>';

var js_s2 =
  "new MTS.Radio('#radio-h', {\n" +
  "  horizontal: true,\n" +
  "  name: 'vista',\n" +
  "  value: 'tabla',\n" +
  "  options: [\n" +
  "    { value: 'tabla', label: 'Tabla' },\n" +
  "    { value: 'tarjetas', label: 'Tarjetas' },\n" +
  "    { value: 'lista', label: 'Lista' }\n" +
  "  ],\n" +
  "  onChange: function(e) { setResult('radio-h-result', 'valor: ' + e.detail.value); }\n" +
  "});";

var preview_s3 = '<div id="radio-dis-opt"></div>';

var js_s3 =
  "new MTS.Radio('#radio-dis-opt', {\n" +
  "  horizontal: true,\n" +
  "  name: 'plan',\n" +
  "  value: 'free',\n" +
  "  options: [\n" +
  "    { value: 'free', label: 'Free' },\n" +
  "    { value: 'pro', label: 'Pro' },\n" +
  "    { value: 'enterprise', label: 'Enterprise (próximamente)', disabled: true }\n" +
  "  ]\n" +
  "});";

var preview_s4 = '<div id="radio-dis-all"></div>';

var js_s4 =
  "new MTS.Radio('#radio-dis-all', {\n" +
  "  disabled: true,\n" +
  "  name: 'estado',\n" +
  "  value: 'activo',\n" +
  "  options: [\n" +
  "    { value: 'activo', label: 'Activo' },\n" +
  "    { value: 'inactivo', label: 'Inactivo' },\n" +
  "    { value: 'pendiente', label: 'Pendiente' }\n" +
  "  ]\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.Radio('#radio-v', {
    name: 'prioridad',
    value: 'medium',
    options: [
      { value: 'high', label: 'Alta' },
      { value: 'medium', label: 'Media' },
      { value: 'low', label: 'Baja' }
    ],
    onChange: function(e) { setResult('radio-v-result', 'valor: ' + e.detail.value); }
  });
});
makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.Radio('#radio-h', {
    horizontal: true,
    name: 'vista',
    value: 'tabla',
    options: [
      { value: 'tabla', label: 'Tabla' },
      { value: 'tarjetas', label: 'Tarjetas' },
      { value: 'lista', label: 'Lista' }
    ],
    onChange: function(e) { setResult('radio-h-result', 'valor: ' + e.detail.value); }
  });
});
makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.Radio('#radio-dis-opt', {
    horizontal: true,
    name: 'plan',
    value: 'free',
    options: [
      { value: 'free', label: 'Free' },
      { value: 'pro', label: 'Pro' },
      { value: 'enterprise', label: 'Enterprise (próximamente)', disabled: true }
    ]
  });
});
makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.Radio('#radio-dis-all', {
    disabled: true,
    name: 'estado',
    value: 'activo',
    options: [
      { value: 'activo', label: 'Activo' },
      { value: 'inactivo', label: 'Inactivo' },
      { value: 'pendiente', label: 'Pendiente' }
    ]
  });
});

</script>
</body>
</html>
