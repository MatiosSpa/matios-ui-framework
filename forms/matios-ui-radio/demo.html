<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">

  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <div class="demo-section"><div class="demo-section-title" id="s4-title"></div><div id="tabs-s4"></div></div>
</div>

<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: shows English by default (public face); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Radio']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Vertical and horizontal radio button group, with a disabled option and a fully disabled group.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Vertical (default)';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Horizontal';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — With a disabled option';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Fully disabled group';

var selectPlaceholder = D.selectPlaceholder || '— select an option —';
var valuePrefix       = D.valuePrefix || 'value: ';

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="radio-v"></div>' +
    '<div class="result-box" id="radio-v-result">' + selectPlaceholder + '</div>' +
  '</div>';

var js_s1 =
  "new MTS.Radio('#radio-v', {\n" +
  "  name: 'priority',\n" +
  "  value: 'medium',\n" +
  "  options: [\n" +
  "    { value: 'high', label: 'High' },\n" +
  "    { value: 'medium', label: 'Medium' },\n" +
  "    { value: 'low', label: 'Low' }\n" +
  "  ],\n" +
  "  onChange: function(e) { setResult('radio-v-result', 'value: ' + e.detail.value); }\n" +
  "});";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="radio-h"></div>' +
    '<div class="result-box" id="radio-h-result">' + selectPlaceholder + '</div>' +
  '</div>';

var js_s2 =
  "new MTS.Radio('#radio-h', {\n" +
  "  horizontal: true,\n" +
  "  name: 'view',\n" +
  "  value: 'table',\n" +
  "  options: [\n" +
  "    { value: 'table', label: 'Table' },\n" +
  "    { value: 'cards', label: 'Cards' },\n" +
  "    { value: 'list', label: 'List' }\n" +
  "  ],\n" +
  "  onChange: function(e) { setResult('radio-h-result', 'value: ' + e.detail.value); }\n" +
  "});";

var preview_s3 = '<div id="radio-dis-opt"></div>';

var js_s3 =
  "new MTS.Radio('#radio-dis-opt', {\n" +
  "  horizontal: true,\n" +
  "  name: 'plan',\n" +
  "  value: 'free',\n" +
  "  options: [\n" +
  "    { value: 'free', label: 'Free' },\n" +
  "    { value: 'pro', label: 'Pro' },\n" +
  "    { value: 'enterprise', label: 'Enterprise (coming soon)', disabled: true }\n" +
  "  ]\n" +
  "});";

var preview_s4 = '<div id="radio-dis-all"></div>';

var js_s4 =
  "new MTS.Radio('#radio-dis-all', {\n" +
  "  disabled: true,\n" +
  "  name: 'status',\n" +
  "  value: 'active',\n" +
  "  options: [\n" +
  "    { value: 'active', label: 'Active' },\n" +
  "    { value: 'inactive', label: 'Inactive' },\n" +
  "    { value: 'pending', label: 'Pending' }\n" +
  "  ]\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.Radio('#radio-v', {
    name: 'priority',
    value: 'medium',
    options: [
      { value: 'high', label: D.optHigh || 'High' },
      { value: 'medium', label: D.optMedium || 'Medium' },
      { value: 'low', label: D.optLow || 'Low' }
    ],
    onChange: function(e) { setResult('radio-v-result', valuePrefix + e.detail.value); }
  });
});
makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.Radio('#radio-h', {
    horizontal: true,
    name: 'view',
    value: 'table',
    options: [
      { value: 'table', label: D.optTable || 'Table' },
      { value: 'cards', label: D.optCards || 'Cards' },
      { value: 'list', label: D.optList || 'List' }
    ],
    onChange: function(e) { setResult('radio-h-result', valuePrefix + e.detail.value); }
  });
});
makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.Radio('#radio-dis-opt', {
    horizontal: true,
    name: 'plan',
    value: 'free',
    options: [
      { value: 'free', label: D.optFree || 'Free' },
      { value: 'pro', label: D.optPro || 'Pro' },
      { value: 'enterprise', label: D.optEnterprise || 'Enterprise (coming soon)', disabled: true }
    ]
  });
});
makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.Radio('#radio-dis-all', {
    disabled: true,
    name: 'status',
    value: 'active',
    options: [
      { value: 'active', label: D.optActive || 'Active' },
      { value: 'inactive', label: D.optInactive || 'Inactive' },
      { value: 'pending', label: D.optPending || 'Pending' }
    ]
  });
});

</script>
