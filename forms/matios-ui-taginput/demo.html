<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.TagInput'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Tags with local suggestions, async search and progressive enhancement from declarative HTML.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Local suggestions';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Async autocomplete';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Maximum limit';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Declarative HTML + enhancement';

var labelGuests             = D.labelGuests || 'Guests';
var labelSkills             = D.labelSkills || 'Skills';
var placeholderSearchUser   = D.placeholderSearchUser || 'Search user...';
var placeholderSearchOrType = D.placeholderSearchOrType || 'Search or type...';
var tagUrgent   = D.tagUrgent || 'Urgent';
var tagPending  = D.tagPending || 'Pending';
var tagApproved = D.tagApproved || 'Approved';
var tagBlocked  = D.tagBlocked || 'Blocked';
var tagReview   = D.tagReview || 'Review';

var preview_s1 =
  '<div class="demo-stack">' +
    '<div id="tags-basic"></div>' +
    '<div class="result-box" id="tags-result">' + resultBasicPlaceholder + '</div>' +
  '</div>';

var js_s1 =
  "new MTS.TagInput('#tags-basic', {\n" +
  "  label: '" + labelTags + "',\n" +
  "  tags: [\n" +
  "    { uid: 'urgent', name: '" + tagUrgent + "' },\n" +
  "    { uid: 'review', name: '" + tagReview + "' }\n" +

  "  suggestions: [\n" +
  "    { uid: 'urgent', name: '" + tagUrgent + "' },\n" +

  "    { uid: 'approved', name: '" + tagApproved + "' },\n" +
  "    { uid: 'blocked', name: '" + tagBlocked + "' },\n" +

  "  ],\n" +

  "    setResult('tags-result', JSON.stringify(e.detail.tags));\n" +
  "  }\n" +
  "});";

var preview_s2 =

    '<div id="tags-async"></div>' +

var js_s2 =
  "new MTS.TagInput('#tags-async', {\n" +
  "  label: '" + labelGuests + "',\n" +
  "  placeholder: '" + placeholderSearchUser + "',\n" +
  "  onSearch: async function(query) {\n" +
  "    var all = [\n" +

  "  onChange: function(e) {\n" +

  "  }\n" +
  "});";

var preview_s3 =

var preview_s4 =

  "  }\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {

}, '400px');
