<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.FormGuard — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-midnight.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-obsidian.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-forest.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-abyss.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-ember.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dune.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-crimson.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-rose.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-orange.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-sky.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-indigo.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-teal.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-slate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-bronze.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <!-- MTS components used in the demo -->
  <link rel="stylesheet" href="../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../matios-ui-toggle/matios-ui-toggle.css">
  <link rel="stylesheet" href="../matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-modal/matios-ui-modal.css">
  <!-- FormGuard -->
  <link rel="stylesheet" href="./matios-ui-formguard.css">

  <script src="../../support/demo-shared.js"></script>
  <script src="../../base/matios-ui-i18n.js"></script>
  <script src="./matios-ui-formguard-i18n.js"></script>
  <script src="../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../matios-ui-input/matios-ui-input.js"></script>
  <script src="../matios-ui-select/matios-ui-select.js"></script>
  <script src="../matios-ui-toggle/matios-ui-toggle.js"></script>
  <script src="../matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../matios-ui-button/matios-ui-button.js"></script>
  <script src="../../overlays/matios-ui-modal/matios-ui-modal.js"></script>
  <script src="./matios-ui-formguard.js"></script>
</head>
<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.FormGuard</h1>
    <p id="demo-subtitle"></p>
  </div>

  <!-- 1: Basic form with Input, Select, Toggle -->
  <section class="demo-section">
    <h2 class="demo-section-title" id="s1-title"></h2>
    <p class="demo-section-desc" id="s1-desc"></p>

    <div
      class="mts-card"
      data-mts-form
      data-mts-form-id="profile-form"
      data-mts-form-save="#btn-guardar-1"
      style="max-width:560px;"
    >
      <div class="mts-card__header">
        <span class="mts-card__title" id="s1-card-title"></span>
      </div>
      <div class="mts-card__body" style="display:flex;flex-direction:column;gap:16px;">
        <div id="nombre-1"></div>
        <div id="rol-1"></div>
        <div id="activo-1"></div>
        <div id="notif-1"></div>
      </div>
      <div class="mts-card__footer" style="display:flex;gap:8px;justify-content:flex-end;">
        <div id="btn-volver-1"></div>
        <div id="btn-guardar-1"></div>
      </div>
    </div>

    <div id="log-1" style="margin-top:12px;font-size:13px;color:var(--mts-text-secondary);min-height:20px;"></div>
  </section>

  <!-- 2: Two independent forms -->
  <section class="demo-section">
    <h2 class="demo-section-title" id="s2-title"></h2>
    <p class="demo-section-desc" id="s2-desc"></p>

    <div style="display:flex;gap:24px;flex-wrap:wrap;">

      <div
        class="mts-card"
        data-mts-form
        data-mts-form-id="form-a"
        data-mts-form-save="#btn-save-a"
        style="flex:1;min-width:260px;"
      >
        <div class="mts-card__header"><span class="mts-card__title" id="s2-card-a-title"></span></div>
        <div class="mts-card__body" style="display:flex;flex-direction:column;gap:16px;">
          <div id="nombre-a"></div>
          <div id="email-a"></div>
        </div>
        <div class="mts-card__footer" style="display:flex;gap:8px;justify-content:flex-end;">
          <div id="btn-back-a"></div>
          <div id="btn-save-a"></div>
        </div>
      </div>

      <div
        class="mts-card"
        data-mts-form
        data-mts-form-id="form-b"
        data-mts-form-save="#btn-save-b"
        style="flex:1;min-width:260px;"
      >
        <div class="mts-card__header"><span class="mts-card__title" id="s2-card-b-title"></span></div>
        <div class="mts-card__body" style="display:flex;flex-direction:column;gap:16px;">
          <div id="empresa-b"></div>
          <div id="pais-b"></div>
        </div>
        <div class="mts-card__footer" style="display:flex;gap:8px;justify-content:flex-end;">
          <div id="btn-back-b"></div>
          <div id="btn-save-b"></div>
        </div>
      </div>

    </div>

    <div id="log-2" style="margin-top:12px;font-size:13px;color:var(--mts-text-secondary);min-height:20px;">
      <span id="s2-dirty-label"></span> <strong id="dirty-count">0</strong>
    </div>
  </section>

  <!-- 3: Dynamically injected form (SPA) -->
  <section class="demo-section">
    <h2 class="demo-section-title" id="s3-title"></h2>
    <p class="demo-section-desc" id="s3-desc"></p>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <div id="btn-inject-form"></div>
      <div id="btn-remove-form"></div>
    </div>
    <div id="dynamic-container"></div>
  </section>

  <!-- 4: programmatic snapshot-sync -->
  <section class="demo-section">
    <h2 class="demo-section-title" id="s4-title"></h2>
    <p class="demo-section-desc">
      <span id="s4-desc-before"></span><code>setValue()</code><span id="s4-desc-middle"></span><code>mts:form:snapshot-sync</code><span id="s4-desc-after"></span>
    </p>
    <div
      class="mts-card"
      data-mts-form
      data-mts-form-id="sync-form"
      data-mts-form-save="#btn-save-4"
      style="max-width:480px;"
    >
      <div class="mts-card__header"><span class="mts-card__title" id="s4-card-title"></span></div>
      <div class="mts-card__body" style="display:flex;flex-direction:column;gap:16px;">
        <div id="titulo-4"></div>
        <div id="estado-4"></div>
      </div>
      <div class="mts-card__footer" style="display:flex;gap:8px;justify-content:flex-end;">
        <div id="btn-load-4"></div>
        <div id="btn-save-4"></div>
      </div>
    </div>
    <div id="log-4" style="margin-top:12px;font-size:13px;color:var(--mts-text-secondary);min-height:20px;"></div>
  </section>

</div>

<script>
(function () {

  /* — Locale: shows English by default (public face); ?lang=es|en|pt to switch — */
  (function () {
    var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
    var lang = m ? m[1] : 'en';
    if (window.MTS) { if (typeof MTS.setLocale === 'function') { MTS.setLocale(lang); } else { MTS._locale = lang; } }
  })();
  var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.FormGuard'].demo) || {};

  /* ── Static texts from the locale ── */
  document.getElementById('demo-subtitle').textContent  = D.subtitle    || 'Declarative dirty-tracking — snapshot, navigation modal, beforeunload, visual indicators';
  document.getElementById('s1-title').textContent       = D.s1Title     || '1 — Basic form with MTS components';
  document.getElementById('s1-desc').textContent        = D.s1Desc      || 'Change any field. The asterisk appears in the title and the dot on the Save button. Revert the change — the form returns to clean automatically.';
  document.getElementById('s1-card-title').textContent  = D.s1CardTitle || 'User profile';
  document.getElementById('s2-title').textContent       = D.s2Title     || '2 — Two independent forms';
  document.getElementById('s2-desc').textContent        = D.s2Desc      || 'Each form has its own snapshot. The global counter shows how many are dirty.';
  document.getElementById('s2-card-a-title').textContent = D.s2CardATitle || 'Form A';
  document.getElementById('s2-card-b-title').textContent = D.s2CardBTitle || 'Form B';
  document.getElementById('s2-dirty-label').textContent = D.s2DirtyLabel || 'Dirty forms:';
  document.getElementById('s3-title').textContent       = D.s3Title     || '3 — Dynamic adoption (SPA / MutationObserver)';
  document.getElementById('s3-desc').textContent        = D.s3Desc      || 'The form is injected into the DOM after FormGuard is already active. It is adopted automatically by the MutationObserver.';
  document.getElementById('s4-title').textContent       = D.s4Title     || '4 — Programmatic snapshot-sync';
  document.getElementById('s4-desc-before').textContent = D.s4DescBefore || 'Load data via ';
  document.getElementById('s4-desc-middle').textContent = D.s4DescMiddle || ' and fire ';
  document.getElementById('s4-desc-after').textContent  = D.s4DescAfter  || ' so FormGuard re-takes the snapshot without marking it dirty.';
  document.getElementById('s4-card-title').textContent  = D.s4CardTitle || 'Loaded data';

  /* ── Start FormGuard (only once in the shell) ── */
  MTS.FormGuard.start();

  /* ══════════════════════════════════════════════════
     1 — Basic form
  ══════════════════════════════════════════════════ */
  var inNombre  = new MTS.Input('#nombre-1', { label: D.s1LabelNombre || 'Name', value: 'Ana López', placeholder: D.s1PlaceholderNombre || 'Full name' });
  var selRol    = new MTS.Select('#rol-1', {
    label: D.s1LabelRol || 'Role',
    value: 'editor',
    options: [
      { value: 'admin',  label: D.s1OptAdmin  || 'Administrator' },
      { value: 'editor', label: D.s1OptEditor || 'Editor' },
      { value: 'viewer', label: D.s1OptViewer || 'Viewer' }
    ]
  });
  var togActivo = new MTS.Toggle('#activo-1', { label: D.s1LabelActivo || 'Active account', checked: true });
  var chkNotif  = new MTS.Checkbox('#notif-1', { label: D.s1LabelNotif || 'Receive notifications', checked: false, value: 'notif' });

  new MTS.Button('#btn-volver-1', {
    label: D.s1BtnBack || 'Back',
    variant: 'ghost',
    attrs: { 'data-mts-form-back': '' }
  });

  new MTS.Button('#btn-guardar-1', {
    label: D.s1BtnSave || 'Save',
    variant: 'primary',
    onClick: function () {
      document.querySelector('[data-mts-form-id="profile-form"]').dispatchEvent(
        new CustomEvent('mts:form:save-ack', { bubbles: true, detail: { formId: 'profile-form' } })
      );
      document.getElementById('log-1').textContent = D.s1MsgSaved || 'Saved successfully — snapshot reset.';
    }
  });

  document.addEventListener('mts:form:dirty-change', function (e) {
    if (e.detail.formId !== 'profile-form') { return; }
    document.getElementById('log-1').textContent = e.detail.isDirty
      ? (D.s1MsgDirty || 'The form has unsaved changes.')
      : (D.s1MsgClean || 'The form is clean.');
  });

  /* ══════════════════════════════════════════════════
     2 — Two forms
  ══════════════════════════════════════════════════ */
  new MTS.Input('#nombre-a',  { label: D.s2LabelNombre  || 'Name',    value: 'Carlos Díaz' });
  new MTS.Input('#email-a',   { label: D.s2LabelEmail   || 'Email',   value: 'carlos@example.com', type: 'email' });
  new MTS.Input('#empresa-b', { label: D.s2LabelEmpresa || 'Company', value: 'Acme Corp' });
  new MTS.Select('#pais-b', {
    label: D.s2LabelPais || 'Country',
    value: 'cl',
    options: [
      { value: 'cl', label: D.s2OptChile     || 'Chile' },
      { value: 'ar', label: D.s2OptArgentina || 'Argentina' },
      { value: 'co', label: D.s2OptColombia  || 'Colombia' }
    ]
  });

  new MTS.Button('#btn-back-a', { label: D.s2BtnBack || 'Back',  variant: 'ghost',   attrs: { 'data-mts-form-back': '' } });
  new MTS.Button('#btn-save-a', { label: D.s2BtnSave || 'Save', variant: 'primary', onClick: function () {
    document.querySelector('[data-mts-form-id="form-a"]').dispatchEvent(
      new CustomEvent('mts:form:save-ack', { bubbles: true, detail: { formId: 'form-a' } })
    );
  }});
  new MTS.Button('#btn-back-b', { label: D.s2BtnBack || 'Back',  variant: 'ghost',   attrs: { 'data-mts-form-back': '' } });
  new MTS.Button('#btn-save-b', { label: D.s2BtnSave || 'Save', variant: 'primary', onClick: function () {
    document.querySelector('[data-mts-form-id="form-b"]').dispatchEvent(
      new CustomEvent('mts:form:save-ack', { bubbles: true, detail: { formId: 'form-b' } })
    );
  }});

  document.addEventListener('mts:form:dirty-change', function () {
    document.getElementById('dirty-count').textContent = MTS.FormGuard.getDirtyCount();
  });

  /* ══════════════════════════════════════════════════
     3 — Dynamic form
  ══════════════════════════════════════════════════ */
  var _dynamicForm  = null;
  var _dynamicInput = null;

  new MTS.Button('#btn-inject-form', {
    label: D.s3BtnInject || 'Inject form',
    variant: 'primary',
    onClick: function () {
      if (_dynamicForm) { return; }
      _dynamicForm = document.createElement('div');
      _dynamicForm.className = 'mts-card';
      _dynamicForm.setAttribute('data-mts-form', '');
      _dynamicForm.setAttribute('data-mts-form-id', 'dynamic-form');
      _dynamicForm.innerHTML =
        '<div class="mts-card__header"><span class="mts-card__title">' + (D.s3CardTitle || 'Dynamic form') + '</span></div>' +
        '<div class="mts-card__body" style="padding:16px;"><div id="dyn-input-wrap"></div></div>';
      document.getElementById('dynamic-container').appendChild(_dynamicForm);
      /* wait for the MutationObserver to adopt the form, then instantiate and sync */
      setTimeout(function () {
        _dynamicInput = new MTS.Input('#dyn-input-wrap', { label: D.s3LabelCampo || 'Dynamic field', value: '' });
        /* re-snapshot now that _mtsInstance is already in the DOM */
        _dynamicForm.dispatchEvent(new CustomEvent('mts:form:snapshot-sync', { bubbles: true }));
      }, 50);
    }
  });

  new MTS.Button('#btn-remove-form', {
    label: D.s3BtnRemove || 'Remove form',
    variant: 'ghost',
    onClick: function () {
      if (!_dynamicForm) { return; }
      _dynamicForm.parentNode.removeChild(_dynamicForm);
      _dynamicForm  = null;
      _dynamicInput = null;
    }
  });

  /* ══════════════════════════════════════════════════
     4 — programmatic snapshot-sync
  ══════════════════════════════════════════════════ */
  var inTitulo  = new MTS.Input('#titulo-4', { label: D.s4LabelTitulo || 'Project title', value: '' });
  var selEstado = new MTS.Select('#estado-4', {
    label: D.s4LabelEstado || 'Status',
    value: null,
    options: [
      { value: 'draft',    label: D.s4OptDraft    || 'Draft' },
      { value: 'active',   label: D.s4OptActive   || 'Active' },
      { value: 'archived', label: D.s4OptArchived || 'Archived' }
    ]
  });

  new MTS.Button('#btn-load-4', {
    label: D.s4BtnLoad || 'Load data',
    variant: 'secondary',
    onClick: function () {
      inTitulo.setValue('Project Alpha');
      selEstado.setValue('active');
      document.querySelector('[data-mts-form-id="sync-form"]').dispatchEvent(
        new CustomEvent('mts:form:snapshot-sync', { bubbles: true })
      );
      document.getElementById('log-4').textContent = D.s4MsgLoaded || 'Data loaded — snapshot synced. The form is clean.';
    }
  });

  new MTS.Button('#btn-save-4', {
    label: D.s4BtnSave || 'Save',
    variant: 'primary',
    onClick: function () {
      document.querySelector('[data-mts-form-id="sync-form"]').dispatchEvent(
        new CustomEvent('mts:form:save-ack', { bubbles: true, detail: { formId: 'sync-form' } })
      );
      document.getElementById('log-4').textContent = D.s4MsgSaved || 'Saved — snapshot reset.';
    }
  });

  document.addEventListener('mts:form:dirty-change', function (e) {
    if (e.detail.formId !== 'sync-form') { return; }
    if (e.detail.isDirty) {
      document.getElementById('log-4').textContent = D.s4MsgDirty || 'There are unsaved changes.';
    }
  });

})();
</script>

</body>
</html>
