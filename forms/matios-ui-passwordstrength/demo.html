<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<body>

  <div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s3-title"></div><div id="tabs-s3"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s4-title"></div><div id="tabs-s4"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s5-title"></div><div id="tabs-s5"></div></div>
</div>

<script>
/* ── Standard demo helpers ── */
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0,indent-step); result+=' '.repeat(indent)+t+'\n'; }
    else if(/^<[^!]/.test(t)){
      result+=' '.repeat(indent)+t+'\n';
      var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||'';
      if(!voids.test(tag) && !/\/>$/.test(t)) indent+=step;
    } else { var text=t.replace(/\s+/g,' '); if(text) result+=' '.repeat(indent)+text+'\n'; }
  });
  return result.trimEnd();
}

// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.PasswordStrength']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Real-time password strength meter. Configurable: min/max length, uppercase, lowercase, numbers and special symbols.';
document.getElementById('s1-title').textContent = D.s1Title || '1 — Basic (minimum length only)';
document.getElementById('s2-title').textContent = D.s2Title || '2 — Full rules';
document.getElementById('s3-title').textContent = D.s3Title || '3 — Bar only (no checklist)';
document.getElementById('s4-title').textContent = D.s4Title || '4 — Integration with MTS.Validate';
document.getElementById('s5-title').textContent = D.s5Title || '5 — onChange callback';

/* ══════════════════════════════════════════════════════════════
   1 — Basic
══════════════════════════════════════════════════════════════ */
var preview1 =
  '<div class="demo-stack" style="max-width:320px;">' +
    '<div class="mts-form-group" id="s1-pass"></div>' +
    '<div id="s1-meter"></div>' +
  '</div>';

var js1 =
  "const inPass = new MTS.Input('#s1-pass', {\n" +
  "  label:       'Password',\n" +
  "  type:        'password',\n" +
  "  placeholder: '••••••••',\n" +
  "});\n\n" +
  "new MTS.PasswordStrength('#s1-meter', {\n" +
  "  input:     inPass,\n" +
  "  minLength: 8,\n" +
  "});";


function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '420px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}
makeSection('tabs-s1', preview1, js1, function() {
  var inPass = new MTS.Input('#s1-pass', {
    label: D.labelPassword || 'Password', type: 'password', placeholder: '••••••••',
  });
  new MTS.PasswordStrength('#s1-meter', {
    input: inPass, minLength: 8,
  });
}, '280px');

/* ══════════════════════════════════════════════════════════════
   2 — Full rules
══════════════════════════════════════════════════════════════ */
var preview2 =
  '<div class="demo-stack" style="max-width:360px;">' +
    '<div class="mts-form-group" id="s2-pass"></div>' +
    '<div id="s2-meter"></div>' +
  '</div>';

var js2 =
  "const inPass = new MTS.Input('#s2-pass', {\n" +
  "  label:       'New password',\n" +
  "  type:        'password',\n" +
  "  placeholder: '••••••••',\n" +
  "});\n\n" +
  "new MTS.PasswordStrength('#s2-meter', {\n" +
  "  input:          inPass,\n" +
  "  minLength:      8,\n" +
  "  minUppercase:   1,\n" +
  "  minLowercase:   1,\n" +
  "  minNumbers:     1,\n" +
  "  minSpecial:     1,\n" +
  "  allowedSpecial: '!@#$%^&*',\n" +
  "});";

makeSection('tabs-s2', preview2, js2, function() {
  var inPass = new MTS.Input('#s2-pass', {
    label: D.labelNewPassword || 'New password', type: 'password', placeholder: '••••••••',
  });
  new MTS.PasswordStrength('#s2-meter', {
    input: inPass, minLength: 8,
    minUppercase: 1, minLowercase: 1, minNumbers: 1,
    minSpecial: 1, allowedSpecial: '!@#$%^&*',
  });
}, '360px');

/* ══════════════════════════════════════════════════════════════
   3 — Bar only (no checklist)
══════════════════════════════════════════════════════════════ */
var preview3 =
  '<div class="demo-stack" style="max-width:320px;">' +
    '<div class="mts-form-group" id="s3-pass"></div>' +
    '<div id="s3-meter"></div>' +
  '</div>';

var js3 =
  "const inPass = new MTS.Input('#s3-pass', {\n" +
  "  label:       'Password',\n" +
  "  type:        'password',\n" +
  "  placeholder: '••••••••',\n" +
  "});\n\n" +
  "new MTS.PasswordStrength('#s3-meter', {\n" +
  "  input:          inPass,\n" +
  "  minLength:      6,\n" +
  "  minNumbers:     1,\n" +
  "  minSpecial:     1,\n" +
  "  allowedSpecial: '!@#$%',\n" +
  "  showChecklist:  false,   // bar only, no list\n" +
  "});";

makeSection('tabs-s3', preview3, js3, function() {
  var inPass = new MTS.Input('#s3-pass', {
    label: D.labelPassword || 'Password', type: 'password', placeholder: '••••••••',
  });
  new MTS.PasswordStrength('#s3-meter', {
    input: inPass, minLength: 6,
    minNumbers: 1, minSpecial: 1, allowedSpecial: '!@#$%',
    showChecklist: false,
  });
}, '240px');

/* ══════════════════════════════════════════════════════════════
   4 — Integration with MTS.Validate
══════════════════════════════════════════════════════════════ */
var preview4 =
  '<div class="demo-stack" style="max-width:360px;">' +
    '<div class="mts-form">' +
      '<div class="mts-form-group" id="s4-pass"></div>' +
      '<div id="s4-meter"></div>' +
      '<div class="mts-form-group" id="s4-confirm"></div>' +
      '<div id="s4-btn" style="margin-top:12px;"></div>' +
    '</div>' +
  '</div>';

var js4 =
  "const inPass = new MTS.Input('#s4-pass', {\n" +
  "  name: 'password', label: 'New password', type: 'password',\n" +
  "});\n\n" +
  "const meter = new MTS.PasswordStrength('#s4-meter', {\n" +
  "  input: inPass, minLength: 8, minUppercase: 1,\n" +
  "  minNumbers: 1, minSpecial: 1, allowedSpecial: '!@#$%^&*',\n" +
  "});\n\n" +
  "const inConfirm = new MTS.Input('#s4-confirm', {\n" +
  "  name: 'confirm', label: 'Confirm password', type: 'password',\n" +
  "});\n\n" +
  "// meter.isValid() as a custom rule in MTS.Validate:\n" +
  "new MTS.Button('#s4-btn', {\n" +
  "  label: 'Save password', variant: 'primary', block: true,\n" +
  "  onClick: function() {\n" +
  "    var ok = true;\n" +
  "    if (!meter.isValid()) { inPass.setError('Does not meet the requirements.'); ok = false; }\n" +
  "    else                  { inPass.clearError(); }\n" +
  "    if (inConfirm.getValue() !== inPass.getValue()) { inConfirm.setError('Do not match.'); ok = false; }\n" +
  "    else                                            { inConfirm.clearError(); }\n" +
  "    if (ok) alert('✓ score: ' + meter.getScore() + '% — level: ' + meter.getLevel());\n" +
  "  },\n" +
  "});";

makeSection('tabs-s4', preview4, js4, function() {
  var inPass = new MTS.Input('#s4-pass', {
    name: 'password', label: D.labelNewPassword || 'New password', type: 'password', placeholder: '••••••••',
  });
  var meter = new MTS.PasswordStrength('#s4-meter', {
    input: inPass, minLength: 8, minUppercase: 1,
    minNumbers: 1, minSpecial: 1, allowedSpecial: '!@#$%^&*',
  });
  var inConfirm = new MTS.Input('#s4-confirm', {
    name: 'confirm', label: D.labelConfirm || 'Confirm password', type: 'password', placeholder: '••••••••',
  });
  new MTS.Button('#s4-btn', {
    label: D.btnSave || 'Save password', variant: 'primary', block: true,
    onClick: function() {
      var ok = true;
      if (!meter.isValid()) { inPass.setError(D.errRequirements || 'Does not meet the requirements.'); ok = false; }
      else                  { inPass.clearError(); }
      if (inConfirm.getValue() !== inPass.getValue()) { inConfirm.setError(D.errMismatch || 'Do not match.'); ok = false; }
      else                                            { inConfirm.clearError(); }
      if (ok) alert((D.savedPrefix || '✓ score: ') + meter.getScore() + '%' + (D.savedLevel || ' — level: ') + meter.getLevel());
    },
  });
}, '480px');

/* ══════════════════════════════════════════════════════════════
   5 — onChange callback
══════════════════════════════════════════════════════════════ */
var preview5 =
  '<div class="demo-stack" style="max-width:360px;">' +
    '<div class="mts-form-group" id="s5-pass"></div>' +
    '<div id="s5-meter"></div>' +
    '<div id="s5-log" class="result-box" style="margin-top:12px;font-family:monospace;font-size:12px;">' + (D.logPlaceholder || 'Type something to see the callback...') + '</div>' +
  '</div>';

var js5 =
  "new MTS.PasswordStrength('#s5-meter', {\n" +
  "  input:    inPass,\n" +
  "  minLength: 8, minUppercase: 1, minNumbers: 1, minSpecial: 1,\n" +
  "  onChange: function(data) {\n" +
  "    console.log(data.score);    // 0-100\n" +
  "    console.log(data.level);    // 'weak'|'fair'|'strong'|'very-strong'\n" +
  "    console.log(data.isValid);  // boolean\n" +
  "    console.log(data.results);  // [{ label, ok }]\n" +
  "  },\n" +
  "});";

makeSection('tabs-s5', preview5, js5, function() {
  var inPass = new MTS.Input('#s5-pass', {
    label: D.labelPassword || 'Password', type: 'password', placeholder: '••••••••',
  });
  var logEl = document.getElementById('s5-log');
  new MTS.PasswordStrength('#s5-meter', {
    input: inPass,
    minLength: 8, minUppercase: 1, minNumbers: 1,
    minSpecial: 1, allowedSpecial: '!@#$%^&*',
    onChange: function(data) {
      logEl.textContent =
        (D.logScore || 'score: ') + data.score   + '%\n' +
        (D.logLevel || 'level: ') + data.level   + '\n' +
        (D.logValid || 'isValid: ') + data.isValid;
    },
  });
}, '400px');
</script>

</body>
