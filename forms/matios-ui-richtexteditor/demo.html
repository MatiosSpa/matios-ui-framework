  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

makeSection("tabs-s1", "<div id=\"rte-full\"></div><div class=\"result-box\" id=\"rte-result\" style=\"min-height:40px;max-height:80px;overflow:auto;font-family:var(--mts-font-mono);font-size:11px;white-space:pre-wrap\">\u2014 el HTML aparece aqu\u00ed al escribir \u2014</div>", "<div id=\"my-editor\"></div>\n\n<script>\n  new MTS.RichTextEditor('#my-editor', {\n    placeholder: 'Start writing...',\n    height:      '240px',\n    // Fires on every content change / Se dispara al cambiar el contenido\n    onChange: (html) => console.log(html),\n    onFocus:  ()     => console.log('focused'),\n    onBlur:   (html) => console.log('blurred'),\n  });\n<\/script>", "const rte = new MTS.RichTextEditor('#my-editor', {\n  // Initial HTML / HTML inicial\n  value: '<p>Hello <strong>world</strong></p>',\n\n  placeholder: 'Start writing...',\n  height:      '240px',\n  minHeight:   '120px',\n\n  // All toolbar groups / Todos los grupos de toolbar\n  toolbar: ['format', 'lists', 'align', 'insert', 'clean'],\n\n  // Fires on every change / Se dispara en cada cambio\n  onChange: (html) => console.log(html),\n  onFocus:  ()     => console.log('focused'),\n  onBlur:   (html) => console.log('blurred'),\n});");

makeSection("tabs-s3", "<div id=\"rte-api\"></div><div class=\"demo-row\" style=\"margin-top:8px;flex-wrap:wrap\">\n<button class=\"demo-btn-sm\" onclick=\"document.getElementById('rte-api-res').textContent = 'getValue() \u2192 ' + rteApi.getValue()\">getValue()</button>\n<button class=\"demo-btn-sm\" onclick=\"document.getElementById('rte-api-res').textContent = 'getText() \u2192 ' + rteApi.getText()\">getText()</button>\n<button class=\"demo-btn-sm\" onclick=\"rteApi.setValue('&lt;p&gt;Set via &lt;strong&gt;setValue()&lt;/strong&gt;&lt;/p&gt;'); document.getElementById('rte-api-res').textContent = 'setValue() \u2713'\">setValue()</button>\n<button class=\"demo-btn-sm\" onclick=\"rteApi.clear(); document.getElementById('rte-api-res').textContent = 'clear() \u2713'\">clear()</button>\n<button class=\"demo-btn-sm\" onclick=\"rteApi.disable(); document.getElementById('rte-api-res').textContent = 'disable() \u2713'\">disable()</button>\n<button class=\"demo-btn-sm\" onclick=\"rteApi.enable(); document.getElementById('rte-api-res').textContent = 'enable() \u2713'\">enable()</button>\n<button class=\"demo-btn-sm\" onclick=\"rteApi.focus()\">focus()</button>\n</div><div class=\"result-box\" id=\"rte-api-res\">\u2014 usa los botones \u2014</div>", "<div id=\"my-editor\"></div>\n\n<script>\n  const rte = new MTS.RichTextEditor('#my-editor', {\n    value: '<p>Initial content</p>',\n  });\n  rte.getValue()    // \u2192 HTML string\n  rte.getText()     // \u2192 plain text\n  rte.setValue('<p>New content</p>')\n  rte.clear()\n  rte.disable()\n  rte.enable()\n  rte.focus()\n  rte.insertHTML('<strong>inserted</strong>')\n<\/script>", "const rte = new MTS.RichTextEditor('#my-editor', {\n  value: '<p>Initial <em>content</em></p>',\n  onChange: (html) => console.log(html),\n});\n\n// Get HTML / Obtener HTML\nrte.getValue()     // \u2192 '<p>Initial <em>content</em></p>'\n\n// Get plain text / Obtener texto plano\nrte.getText()      // \u2192 'Initial content'\n\n// Set HTML / Establecer HTML\nrte.setValue('<p>New <strong>content</strong></p>')\n\n// Clear / Limpiar\nrte.clear()\n\n// Disable / enable / Deshabilitar / habilitar\nrte.disable()\nrte.enable()\n\n// Insert HTML at cursor / Insertar HTML en el cursor\nrte.insertHTML('<mark>highlighted</mark>')");
