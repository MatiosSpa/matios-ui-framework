  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

</div>

<script>
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0,indent-step); result+=' '.repeat(indent)+t+'\n'; }
    else if(/^<[^!]/.test(t)){
      result+=' '.repeat(indent)+t+'\n';
      var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||'';
      if(!voids.test(tag) && !/\/>$/.test(t)) indent+=step;
    } else {
      var text=t.replace(/\s+/g,' '); if(text) result+=' '.repeat(indent)+text+'\n';
    }
  });
  return result.trimEnd();
}
function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.FileUpload']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Drag & drop file zone with validation, previews and API helpers.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Images with preview';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Single document';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Multiple types + API';

var hintImages        = D.hintImages || 'PNG, JPG up to 2MB · Max 5';
var labelSingle       = D.labelSingle || 'Upload your CV as PDF';
var hintSingle        = D.hintSingle || 'PDF up to 5MB';
var hintDocs          = D.hintDocs || 'PDF, Word or Excel up to 10MB';
var resultPlaceholder = D.resultPlaceholder || '— upload files to see the callbacks —';
var apiPlaceholder    = D.apiPlaceholder || '— use the buttons —';
var echoClear         = D.echoClear || 'clear() ✓';

function echoChange(n)    { return (D.echoChange || 'onChange → {n} file(s)').replace('{n}', n); }
function echoAdd(name)    { return (D.echoAdd || 'onAdd → "{name}"').replace('{name}', name); }
function echoRemove(name) { return (D.echoRemove || 'onRemove → "{name}"').replace('{name}', name); }
function echoError(err)   { return (D.echoError || 'onError → {error}').replace('{error}', err); }
function echoGetFiles(f)  { return (D.echoGetFiles || 'getFiles() → {files}').replace('{files}', f); }

var preview1 =
  '<div class="demo-stack">' +
    '<div id="fu-images"></div>' +
    '<div class="result-box" id="fu-result">' + resultPlaceholder + '</div>' +
  '</div>';
var js1 =
  "new MTS.FileUpload('#fu-images', {\n" +
  "  accept: 'image/*',\n" +
  "  multiple: true,\n" +
  "  maxSize: 2,\n" +
  "  maxFiles: 5,\n" +
  "  hint: 'PNG, JPG hasta 2MB · Máx 5',\n" +
  "  onChange: function(files){ document.getElementById('fu-result').textContent = 'onChange → ' + files.length + ' archivo(s)'; },\n" +
  "  onAdd: function(file){ document.getElementById('fu-result').textContent = 'onAdd → \"' + file.name + '\"'; },\n" +
  "  onRemove: function(file){ document.getElementById('fu-result').textContent = 'onRemove → \"' + file.name + '\"'; },\n" +
  "  onError: function(errors){ document.getElementById('fu-result').textContent = 'onError → ' + errors[0]; }\n" +
  "});";

var preview2 = '<div id="fu-single"></div>';
var js2 =
  "new MTS.FileUpload('#fu-single', {\n" +
  "  accept: '.pdf',\n" +
  "  multiple: false,\n" +
  "  maxSize: 5,\n" +
  "  preview: false,\n" +
  "  label: 'Sube tu CV en PDF',\n" +
  "  hint: 'PDF hasta 5MB'\n" +
  "});";

var preview3 =
  '<div class="demo-stack">' +
    '<div id="fu-docs"></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="setResult(\'fu-api-result\', echoGetFiles(fuDocs.getFiles().map(function(f){ return f.name; }).join(\', \')))">getFiles()</button>' +
      '<button class="demo-btn-sm" onclick="fuDocs.clear(); setResult(\'fu-api-result\', echoClear)">clear()</button>' +
      '<button class="demo-btn-sm" onclick="fuDocs.open()">open()</button>' +
    '</div>' +
    '<div class="result-box" id="fu-api-result">' + apiPlaceholder + '</div>' +
  '</div>';
var js3 =
  "var fuDocs = new MTS.FileUpload('#fu-docs', {\n" +
  "  accept: '.pdf,.doc,.docx,.xls,.xlsx',\n" +
  "  multiple: true,\n" +
  "  maxSize: 10,\n" +
  "  preview: false,\n" +
  "  hint: 'PDF, Word o Excel hasta 10MB',\n" +
  "  onChange: function(files){ document.getElementById('fu-api-result').textContent = 'onChange → ' + files.length + ' archivo(s)'; }\n" +
  "});\n\n" +
  "fuDocs.getFiles();\n" +
  "fuDocs.clear();\n" +
  "fuDocs.open();";

makeSection('tabs-fu1', preview1, js1, function(){
  new MTS.FileUpload('#fu-images', {
    accept:'image/*', multiple:true, maxSize:2, maxFiles:5,
    hint:hintImages,
    onChange:function(files){ setResult('fu-result', echoChange(files.length)); },
    onAdd:function(file){ setResult('fu-result', echoAdd(file.name)); },
    onRemove:function(file){ setResult('fu-result', echoRemove(file.name)); },
    onError:function(errors){ setResult('fu-result', echoError(errors[0])); }
  });
}, '420px');

makeSection('tabs-fu2', preview2, js2, function(){
  new MTS.FileUpload('#fu-single', {
    accept:'.pdf', multiple:false, maxSize:5, preview:false,
    label:labelSingle, hint:hintSingle
  });
}, '300px');

var fuDocs;
makeSection('tabs-fu3', preview3, js3, function(){
  fuDocs = new MTS.FileUpload('#fu-docs', {
    accept:'.pdf,.doc,.docx,.xls,.xlsx', multiple:true, maxSize:10, preview:false,
    hint:hintDocs,
    onChange:function(files){ setResult('fu-api-result', echoChange(files.length)); }
  });
}, '420px');
</script>
