<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.FileUpload — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../shared/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-fileupload.css">
  <script src="../../shared/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-fileupload.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.FileUpload</h1>
    <p>Drag & drop file zone with validation, previews and API helpers.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-fileupload.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title">1 — Imágenes con preview / Images with preview</div><div id="tabs-fu1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Documento único / Single document</div><div id="tabs-fu2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — Múltiples tipos + API / Multiple types + API</div><div id="tabs-fu3"></div></div>
</div>

<script>
function esc(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0,indent-step); result+=' '.repeat(indent)+t+'\n'; }
    else if(/^<[^!]/.test(t)){
      result+=' '.repeat(indent)+t+'\n';
      var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||'';
      if(!voids.test(tag) && !/\/>$/.test(t)) indent+=step;
    } else {
      var text=t.replace(/\s+/g,' '); if(text) result+=' '.repeat(indent)+text+'\n';
    }
  });
  return result.trimEnd();
}
function htmlTab(previewHtml){
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">'+esc(indentHtml(previewHtml))+'</pre>';
}
function jsTab(code){
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">'+esc(code)+'</pre>';
}
function makeSection(id, previewHtml, jsCode, initFn, height){
  new MTS.Tabs('#'+id,{variant:'card',height:height||'380px',lazy:false,tabs:[
    {id:id+'-preview',label:'Preview',content:previewHtml},
    {id:id+'-html',label:'HTML',content:htmlTab(previewHtml)},
    {id:id+'-js',label:'JavaScript',content:jsTab(jsCode)}
  ]});
  if(typeof initFn==='function') initFn();
}

var preview1 =
  '<div class="demo-stack">' +
    '<div id="fu-images"></div>' +
    '<div class="result-box" id="fu-result">— sube archivos para ver los callbacks —</div>' +
  '</div>';
var js1 =
  "new MTS.FileUpload('#fu-images', {\n" +
  "  accept: 'image/*',\n" +
  "  multiple: true,\n" +
  "  maxSize: 2,\n" +
  "  maxFiles: 5,\n" +
  "  hint: 'PNG, JPG hasta 2MB · Máx 5',\n" +
  "  onChange: function(files){ document.getElementById('fu-result').textContent = 'onChange → ' + files.length + ' archivo(s)'; },\n" +
  "  onAdd: function(file){ document.getElementById('fu-result').textContent = 'onAdd → \"' + file.name + '\"'; },\n" +
  "  onRemove: function(file){ document.getElementById('fu-result').textContent = 'onRemove → \"' + file.name + '\"'; },\n" +
  "  onError: function(errors){ document.getElementById('fu-result').textContent = 'onError → ' + errors[0]; }\n" +
  "});";

var preview2 = '<div id="fu-single"></div>';
var js2 =
  "new MTS.FileUpload('#fu-single', {\n" +
  "  accept: '.pdf',\n" +
  "  multiple: false,\n" +
  "  maxSize: 5,\n" +
  "  preview: false,\n" +
  "  label: 'Sube tu CV en PDF',\n" +
  "  hint: 'PDF hasta 5MB'\n" +
  "});";

var preview3 =
  '<div class="demo-stack">' +
    '<div id="fu-docs"></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="document.getElementById(\'fu-api-result\').textContent = \'getFiles() → \' + fuDocs.getFiles().map(function(f){ return f.name; }).join(\', \')">getFiles()</button>' +
      '<button class="demo-btn-sm" onclick="fuDocs.clear(); document.getElementById(\'fu-api-result\').textContent = \'clear() ✓\'">clear()</button>' +
      '<button class="demo-btn-sm" onclick="fuDocs.open()">open()</button>' +
    '</div>' +
    '<div class="result-box" id="fu-api-result">— usa los botones —</div>' +
  '</div>';
var js3 =
  "var fuDocs = new MTS.FileUpload('#fu-docs', {\n" +
  "  accept: '.pdf,.doc,.docx,.xls,.xlsx',\n" +
  "  multiple: true,\n" +
  "  maxSize: 10,\n" +
  "  preview: false,\n" +
  "  hint: 'PDF, Word o Excel hasta 10MB',\n" +
  "  onChange: function(files){ document.getElementById('fu-api-result').textContent = 'onChange → ' + files.length + ' archivo(s)'; }\n" +
  "});\n\n" +
  "fuDocs.getFiles();\n" +
  "fuDocs.clear();\n" +
  "fuDocs.open();";

makeSection('tabs-fu1', preview1, js1, function(){
  new MTS.FileUpload('#fu-images', {
    accept:'image/*', multiple:true, maxSize:2, maxFiles:5,
    hint:'PNG, JPG hasta 2MB · Máx 5',
    onChange:function(files){ document.getElementById('fu-result').textContent = 'onChange → ' + files.length + ' archivo(s)'; },
    onAdd:function(file){ document.getElementById('fu-result').textContent = 'onAdd → "' + file.name + '"'; },
    onRemove:function(file){ document.getElementById('fu-result').textContent = 'onRemove → "' + file.name + '"'; },
    onError:function(errors){ document.getElementById('fu-result').textContent = 'onError → ' + errors[0]; }
  });
}, '420px');

makeSection('tabs-fu2', preview2, js2, function(){
  new MTS.FileUpload('#fu-single', {
    accept:'.pdf', multiple:false, maxSize:5, preview:false,
    label:'Sube tu CV en PDF', hint:'PDF hasta 5MB'
  });
}, '300px');

var fuDocs;
makeSection('tabs-fu3', preview3, js3, function(){
  fuDocs = new MTS.FileUpload('#fu-docs', {
    accept:'.pdf,.doc,.docx,.xls,.xlsx', multiple:true, maxSize:10, preview:false,
    hint:'PDF, Word o Excel hasta 10MB',
    onChange:function(files){ document.getElementById('fu-api-result').textContent = 'onChange → ' + files.length + ' archivo(s)'; }
  });
}, '420px');
</script>
</body>
</html>
