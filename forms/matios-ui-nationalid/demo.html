<!DOCTYPE html>
<html lang="en" data-mts-mode="light">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/); var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{ var p=window.parent; if(p&&p!==window){
        var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
        var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
        if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
        if(pa) document.documentElement.setAttribute('data-mts-accent',pa); else document.documentElement.removeAttribute('data-mts-accent');
      }}catch(e){}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.NationalId — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../css-helpers/matios-ui-css-helpers.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">
  <link rel="stylesheet" href="../../utilities/matios-ui-codeblock/matios-ui-codeblock.css">
  <link rel="stylesheet" href="./matios-ui-nationalid.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../support/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../forms/matios-ui-copybutton/matios-ui-copybutton.js"></script>
  <script src="../../utilities/matios-ui-codeblock/matios-ui-codeblock.js"></script>
  <script src="../../base/matios-ui-i18n.js"></script>
  <script src="./matios-ui-nationalid-i18n.js"></script>
  <script src="./matios-ui-nationalid.js"></script>
  <style>
    .nid-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; }
    .nid-field__badge { display:inline-block; margin-top:6px; font-size:12px; font-weight:600; }
    .nid-field__badge--valid   { color:var(--mts-color-success); }
    .nid-field__badge--invalid { color:var(--mts-color-danger); }
    .nid-field__badge--empty   { color:var(--mts-text-muted); font-weight:400; }
    .nid-countries { display:flex; flex-wrap:wrap; gap:8px; }
    .nid-country { padding:4px 10px; border:1px solid var(--mts-border-color); border-radius:var(--mts-radius-md); background:var(--mts-bg-surface-2); font-size:13px; font-weight:600; color:var(--mts-text-primary); }
    .nid-note { margin-top:12px; font-size:13px; color:var(--mts-text-muted); }
  </style>
</head>
<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.NationalId</h1>
    <p id="demo-subtitle"></p>
  </div>

  <div class="demo-section">
    <div class="demo-section-title" id="s1-title"></div>
    <div id="s1"></div>
  </div>

  <div class="demo-section">
    <div class="demo-section-title" id="s2-title"></div>
    <div class="nid-countries" id="countries"></div>
    <p class="nid-note" id="countries-note"></p>
  </div>
</div>

<script>
// — Locale: English default (public face); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.NationalId']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').innerHTML = D.subtitleHtml || 'Formats and validates legal IDs per country as you type.';
document.getElementById('s1-title').textContent    = D.s1Title || '1 — By country';
document.getElementById('s2-title').textContent    = D.s2Title || '2 — Available countries';

// live theme from the explorer iframe
window.addEventListener('message', function (e) {
  if (!e.data) return;
  if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
  if (e.data.type === 'setAccent') {
    if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
    else document.documentElement.removeAttribute('data-mts-accent');
  }
});

// Preview/HTML/JS tabs + copyable code (same helper as the other demos)
function mk(id, html, js, h) {
  var cbHtml = id + '-cb-html';
  var cbJs   = id + '-cb-js';
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: h || '300px',
    tabs: [
      { id: id + '-p',    label: 'Preview',    content: '<div class="mts-p-4">' + html + '</div>' },
      { id: id + '-html', label: 'HTML',       content: '<div id="' + cbHtml + '" style="height:100%"></div>' },
      { id: id + '-js',   label: 'JavaScript', content: '<div id="' + cbJs   + '" style="height:100%"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + cbHtml, { code: html.trim(), language: 'html', copyable: true, height: '100%' });
  new MTS.CodeBlock('#' + cbJs,   { code: js.trim(),   language: 'js',   copyable: true, height: '100%' });
}

function setBadge(badgeId, e) {
  var b = document.getElementById(badgeId);
  if (!b) return;
  if (!e.raw)      { b.className = 'nid-field__badge nid-field__badge--empty';   b.textContent = D.empty || '— enter an ID —'; }
  else if (e.valid){ b.className = 'nid-field__badge nid-field__badge--valid';   b.textContent = '✓ ' + (D.valid || 'Valid') + ' · ' + e.type.toUpperCase(); }
  else             { b.className = 'nid-field__badge nid-field__badge--invalid'; b.textContent = '✕ ' + (D.invalid || 'Invalid'); }
}

function mountField(hostId, badgeId, country, label) {
  setBadge(badgeId, { raw: '' });
  new MTS.NationalId.Input('#' + hostId, {
    country: country,
    label: label,
    onChange: function (e) { setBadge(badgeId, e); }
  });
}

/* ── 1 · By country (with Preview / HTML / JS tabs) ── */
var FIELDS = [
  { host: 'ex-cl', badge: 'bd-cl', country: 'CL', label: D.lblCL || 'Chile · RUT' },
  { host: 'ex-br', badge: 'bd-br', country: 'BR', label: D.lblBR || 'Brazil · CPF / CNPJ (auto)' },
  { host: 'ex-ar', badge: 'bd-ar', country: 'AR', label: D.lblAR || 'Argentina · CUIT' },
  { host: 'ex-es', badge: 'bd-es', country: 'ES', label: D.lblES || 'Spain · DNI / NIE' }
];
var s1html = '<div class="nid-grid">\n' + FIELDS.map(function (f) {
  return '  <div class="nid-field"><div id="' + f.host + '"></div><span class="nid-field__badge nid-field__badge--empty" id="' + f.badge + '"></span></div>';
}).join('\n') + '\n</div>';

var s1js =
  "// Country by prop (like MTS.PhoneInput) — formats + validates as you type\n" +
  "new MTS.NationalId.Input('#rut', {\n" +
  "  country: 'CL',\n" +
  "  label: 'RUT',\n" +
  "  required: true,\n" +
  "  onChange: function (v) {\n" +
  "    // { raw, formatted, valid, dv, type, country }\n" +
  "    saveBtn.disabled = !v.valid;\n" +
  "  }\n" +
  "});\n\n" +
  "// BR auto-detects CPF (11) vs CNPJ (14)\n" +
  "new MTS.NationalId.Input('#doc', { country: 'BR' });\n\n" +
  "// also: AR (CUIT) · ES (DNI/NIE) · PE · CO · UY · EC · PT …\n" +
  "// pure core (no UI): MTS.NationalId.validate('CL', '12.345.678-5')";

mk('s1', s1html, s1js, '360px');
FIELDS.forEach(function (f) { mountField(f.host, f.badge, f.country, f.label); });

/* ── 2 · Available countries ── */
var cc = document.getElementById('countries');
MTS.NationalId.countries().forEach(function (code) {
  var c = MTS.NationalId.getCountry(code);
  var el = document.createElement('span');
  el.className = 'nid-country';
  el.textContent = code + ' · ' + Object.keys(c.types).map(function (t) { return c.types[t].label; }).join(' / ');
  cc.appendChild(el);
});
document.getElementById('countries-note').innerHTML = D.countriesNote || 'Extensible registry: add more with <code>MTS.NationalId.registerCountry(code, def)</code>.';

if (window.MTS && MTS.Icon) MTS.Icon.initAll();
</script>
</body>
</html>
