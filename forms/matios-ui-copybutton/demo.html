<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.CopyButton — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>

</div>

<div class="demo-page">

    <h1><span>MTS</span>.CopyButton</h1>
    <p>Botón para copiar texto o contenido objetivo al portapapeles con feedback visual.</p>

      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-copybutton.md')">Documentación</button>

  <div class="demo-section"><div class="demo-section-title">2 — Solo ícono</div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — Con target</div><div id="tabs-s3"></div></div>
  <div class="demo-section"><div class="demo-section-title">4 — Bloque de código</div><div id="tabs-s4"></div></div>
  <div class="demo-section"><div class="demo-section-title">5 — HTML declarativo + enhancement</div><div id="tabs-s5"></div></div>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<button id="cp-primary"></button>' +
      '<button id="cp-secondary"></button>' +
      '<button id="cp-ghost"></button>' +
    '</div>' +
    '<div class="demo-row">' +
      '<button id="cp-sm"></button>' +
      '<button id="cp-lg"></button>' +
    '</div>' +
    '<div class="result-box" id="cp-result">— haz click para copiar —</div>' +
  '</div>';

var js_s1 =
  "new MTS.CopyButton('#cp-primary', { text: 'npm install matios-ui', label: 'Copy', variant: 'primary', onCopy: function(e) { setResult('cp-result', 'copiado: ' + e.detail.text); } });\n" +
  "new MTS.CopyButton('#cp-secondary', { text: 'npm install matios-ui', label: 'Copy', variant: 'secondary' });\n" +
  "new MTS.CopyButton('#cp-ghost', { text: 'npm install matios-ui', label: 'Copy', variant: 'ghost' });\n" +
  "new MTS.CopyButton('#cp-sm', { text: 'copy me', label: 'Small', size: 'sm', variant: 'secondary' });\n" +
  "new MTS.CopyButton('#cp-lg', { text: 'copy me', label: 'Large', size: 'lg', variant: 'secondary' });";

var preview_s2 =
  '<div class="demo-row">' +
    '<button id="cp-icon1"></button>' +
    '<button id="cp-icon2"></button>' +
    '<button id="cp-icon3"></button>' +
  '</div>';

var js_s2 =
  "new MTS.CopyButton('#cp-icon1', { text: 'copy me', iconOnly: true, size: 'sm', variant: 'ghost' });\n" +
  "new MTS.CopyButton('#cp-icon2', { text: 'copy me', iconOnly: true, variant: 'secondary' });\n" +
  "new MTS.CopyButton('#cp-icon3', { text: 'copy me', iconOnly: true, variant: 'primary' });";

var preview_s3 =
  '<div class="demo-stack">' +
    '<div class="mts-form-group">' +
      '<label class="mts-label" for="api-key-input">API Key</label>' +
      '<div class="demo-row">' +
        '<input id="api-key-input" class="mts-input" value="sk-1234567890abcdef" readonly>' +
        '<button id="cp-apikey"></button>' +
      '</div>' +
    '</div>' +
    '<div class="mts-form-group">' +
      '<label class="mts-label" for="install-input">Install command</label>' +
      '<div class="demo-row">' +
        '<input id="install-input" class="mts-input" value="npm install matios-ui" readonly>' +
        '<button id="cp-install"></button>' +
      '</div>' +
    '</div>' +
  '</div>';

var js_s3 =
  "new MTS.CopyButton('#cp-apikey', { target: '#api-key-input', iconOnly: true, variant: 'primary' });\n" +
  "new MTS.CopyButton('#cp-install', { target: '#install-input', iconOnly: true, variant: 'secondary' });";

var preview_s4 =
  '<div class="demo-stack">' +
    '<pre id="code-npm" class="demo-code">npm install matios-ui</pre>' +
    '<div class="demo-row">' +
      '<button id="cp-code"></button>' +
    '</div>' +
  '</div>';

var js_s4 =
  "new MTS.CopyButton('#cp-code', { target: '#code-npm', label: 'Copy code', variant: 'secondary' });";

var preview_s5 =
  '<button id="btn-copy-decl" data-text="npm install matios-ui" data-label="Copy" data-variant="secondary"></button>';

var js_s5 =
  "new MTS.CopyButton('#btn-copy-decl');";

function initS1() {
  new MTS.CopyButton('#cp-primary', {
    text: 'npm install matios-ui',
    label: 'Copy',
    variant: 'primary',
    onCopy: function(e) { setResult('cp-result', 'copiado: ' + e.detail.text); }
  });
  new MTS.CopyButton('#cp-secondary', { text: 'npm install matios-ui', label: 'Copy', variant: 'secondary' });
  new MTS.CopyButton('#cp-ghost', { text: 'npm install matios-ui', label: 'Copy', variant: 'ghost' });
  new MTS.CopyButton('#cp-sm', { text: 'copy me', label: 'Small', size: 'sm', variant: 'secondary' });
  new MTS.CopyButton('#cp-lg', { text: 'copy me', label: 'Large', size: 'lg', variant: 'secondary' });
}

function initS2() {
  new MTS.CopyButton('#cp-icon1', { text: 'copy me', iconOnly: true, size: 'sm', variant: 'ghost' });
  new MTS.CopyButton('#cp-icon2', { text: 'copy me', iconOnly: true, variant: 'secondary' });
  new MTS.CopyButton('#cp-icon3', { text: 'copy me', iconOnly: true, variant: 'primary' });
}

function initS3() {
  new MTS.CopyButton('#cp-apikey', { target: '#api-key-input', iconOnly: true, variant: 'primary' });
  new MTS.CopyButton('#cp-install', { target: '#install-input', iconOnly: true, variant: 'secondary' });
}

function initS4() {
  new MTS.CopyButton('#cp-code', { target: '#code-npm', label: 'Copy code', variant: 'secondary' });
}

function initS5() {
  new MTS.CopyButton('#btn-copy-decl');
}

makeSection('tabs-s1', preview_s1, js_s1, initS1);
makeSection('tabs-s2', preview_s2, js_s2, initS2);
makeSection('tabs-s3', preview_s3, js_s3, initS3);
makeSection('tabs-s4', preview_s4, js_s4, initS4);
makeSection('tabs-s5', preview_s5, js_s5, initS5);
</script>
</body>
</html>
