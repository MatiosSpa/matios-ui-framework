<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.NumberInput — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">

<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.NumberInput</h1>

    <div class="demo-header-actions">
    </div>

  </div>

<div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-s1"></div></div>
<div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
<div class="demo-section"><div class="demo-section-title" id="s3-title"></div><div id="tabs-s3"></div></div>
<div class="demo-section"><div class="demo-section-title" id="s4-title"></div><div id="tabs-s4"></div></div>
<div class="demo-section"><div class="demo-section-title" id="s5-title"></div><div id="tabs-s5"></div></div>
<div class="demo-section"><div class="demo-section-title" id="s6-title"></div><div id="tabs-s6"></div></div>
</div>

<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var m = t.match(/^<\s*([a-z0-9-]+)/i);
      var tag = m ? m[1] : '';
      var selfClosing = /\/>$/.test(t) || voids.test(tag);
      if (!selfClosing) indent += step;
    } else {
      result += ' '.repeat(indent) + t + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.NumberInput']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Number input with +/− buttons, min/max, step and currency and percentage formats.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Basic with min/max/step';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Formats: currency and percentage';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Prefix and Suffix';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Sizes';
document.getElementById('s5-title').textContent      = D.s5Title || '5 — Programmatic API';
document.getElementById('s6-title').textContent      = D.s6Title || '6 — Declarative HTML + enhancement';

var labelQuantity    = D.labelQuantity    || 'Quantity';
var labelStep5       = D.labelStep5       || 'Every 5 units';
var labelDecimals    = D.labelDecimals    || 'With 2 decimals';
var echoBasic        = D.echoBasic        || 'value: ';
var echoFormatted    = D.echoFormatted    || ' | formatted: ';
var labelPriceClp    = D.labelPriceClp    || 'Price (CLP)';
var labelPriceUsd    = D.labelPriceUsd    || 'Price (USD)';
var labelDiscount    = D.labelDiscount    || 'Discount';
var echoPercent      = D.echoPercent      || 'Percentage → ';
var labelAmount      = D.labelAmount      || 'Amount';
var labelWeight      = D.labelWeight      || 'Weight';
var labelTemperature = D.labelTemperature || 'Temperature';
var sizeSm           = D.sizeSm           || 'Size SM';
var sizeMd           = D.sizeMd           || 'Size MD';
var sizeLg           = D.sizeLg           || 'Size LG';
var labelPoints      = D.labelPoints      || 'Accumulated points';
var hintPoints       = D.hintPoints       || 'Minimum 0, maximum 100';
var apiExternalError = D.apiExternalError || 'External error message';
var echoGetValue     = D.echoGetValue     || 'getValue() → ';
var echoSetValue     = D.echoSetValue     || 'setValue(0) applied';
var echoSetError     = D.echoSetError     || 'setError() applied';
var echoClearError   = D.echoClearError   || 'clearError() applied';
var echoDisable      = D.echoDisable      || 'disable() applied';
var echoEnable       = D.echoEnable       || 'enable() applied';
var echoFocus        = D.echoFocus        || 'focus() applied';
var labelDeclHtml    = D.labelDeclHtml    || 'Declarative HTML';
var labelEnhanceHtml = D.labelEnhanceHtml || 'Declarative HTML + enhancement';
var labelUnits       = D.labelUnits       || 'Units';
var hintEnhance      = D.hintEnhance      || 'Matios UI enhances the base HTML';
var resBasicTxt      = D.resBasic         || '— interact with the inputs —';
var resFormatTxt     = D.resFormat        || '— change the values —';
var resApiTxt        = D.resApi           || '— use the buttons to call the API —';
var resEnhanceTxt    = D.resEnhance       || '— change the value to see the enhancement —';

var preview_s1 =
  '<div class="demo-grid">' +
    '<div id="ni-basic"></div>' +
    '<div id="ni-step"></div>' +
    '<div id="ni-decimals"></div>' +
  '</div>' +
  '<div class="result-box" id="res-basic">' + resBasicTxt + '</div>';

var js_s1 =
  "new MTS.NumberInput('#ni-basic', {\n" +
  "  label: 'Cantidad',\n" +
  "  value: 1,\n" +
  "  min: 0,\n" +
  "  max: 10,\n" +
  "  onChange: function(value, formatted) {\n" +
  "    setResult('res-basic', 'valor: ' + value + ' | formateado: ' + formatted);\n" +
  "  }\n" +
  "});\n\n" +
  "new MTS.NumberInput('#ni-step', { label: 'Cada 5 unidades', value: 0, min: 0, max: 100, step: 5 });\n" +
  "new MTS.NumberInput('#ni-decimals', { label: 'Con 2 decimales', value: 1.5, step: 0.1, decimals: 2 });";

var preview_s2 =
  '<div class="demo-grid">' +
    '<div id="ni-clp"></div>' +
    '<div id="ni-usd"></div>' +
    '<div id="ni-pct"></div>' +
  '</div>' +
  '<div class="result-box" id="res-format">' + resFormatTxt + '</div>';

var js_s2 =
  "new MTS.NumberInput('#ni-clp', { label: 'Precio (CLP)', value: 15000, format: 'currency', currency: 'CLP', locale: 'es-CL', step: 500, min: 0, onChange: function(v, f) { setResult('res-format', 'CLP → ' + f); } });\n" +
  "new MTS.NumberInput('#ni-usd', { label: 'Precio (USD)', value: 99, format: 'currency', currency: 'USD', locale: 'en-US', step: 1, decimals: 2, min: 0, onChange: function(v, f) { setResult('res-format', 'USD → ' + f); } });\n" +
  "new MTS.NumberInput('#ni-pct', { label: 'Descuento', value: 10, format: 'percent', min: 0, max: 100, step: 5, onChange: function(v, f) { setResult('res-format', 'Porcentaje → ' + f); } });";

var preview_s3 =
  '<div class="demo-grid">' +
    '<div id="ni-prefix"></div>' +
    '<div id="ni-suffix"></div>' +
    '<div id="ni-both"></div>' +
  '</div>';

var js_s3 =
  "new MTS.NumberInput('#ni-prefix', { label: 'Monto', prefix: '$', value: 500, step: 100, min: 0 });\n" +
  "new MTS.NumberInput('#ni-suffix', { label: 'Peso', suffix: 'kg', value: 75, step: 0.5, decimals: 1, min: 0 });\n" +
  "new MTS.NumberInput('#ni-both', { label: 'Temperatura', prefix: '~', suffix: '°C', value: 20, min: -20, max: 50 });";

var preview_s4 =
  '<div class="demo-row">' +
    '<div class="demo-col"><div class="demo-label">SM</div><div id="ni-sm"></div></div>' +
    '<div class="demo-col"><div class="demo-label">MD</div><div id="ni-md"></div></div>' +
    '<div class="demo-col"><div class="demo-label">LG</div><div id="ni-lg"></div></div>' +
  '</div>';

var js_s4 =
  "new MTS.NumberInput('#ni-sm', { label: 'Tamaño SM', size: 'sm', value: 1, min: 0 });\n" +
  "new MTS.NumberInput('#ni-md', { label: 'Tamaño MD', size: 'md', value: 1, min: 0 });\n" +
  "new MTS.NumberInput('#ni-lg', { label: 'Tamaño LG', size: 'lg', value: 1, min: 0 });";

var preview_s5 =
  '<div class="demo-stack">' +
    '<div id="ni-api"></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'getValue\')">getValue()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'setValue\')">setValue(0)</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'setError\')">setError()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'clearError\')">clearError()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'disable\')">disable()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'enable\')">enable()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'focus\')">focus()</button>' +
    '</div>' +
    '<div class="result-box" id="res-api">' + resApiTxt + '</div>' +
  '</div>';

var js_s5 =
  "var niApi = new MTS.NumberInput('#ni-api', { label: 'Puntos acumulados', value: 50, min: 0, max: 100, hint: 'Mínimo 0, máximo 100' });\n\n" +
  "niApi.getValue();\n" +
  "niApi.setValue(0);\n" +
  "niApi.setError('Valor inválido');\n" +
  "niApi.clearError();\n" +
  "niApi.disable();\n" +
  "niApi.enable();\n" +
  "niApi.focus();";

var preview_s6 =
  '<div class="demo-stack">' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + labelDeclHtml + '</div>' +
      '<div id="ni-declarative" data-label="' + labelUnits + '" data-value="12" data-min="0" data-max="50" data-step="1"></div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">' + labelEnhanceHtml + '</div>' +
      '<div id="ni-enhanced" data-label="' + labelAmount + '" data-value="1500" data-prefix="$" data-step="100" data-hint="' + hintEnhance + '"></div>' +
      '<div class="result-box" id="res-enhance">' + resEnhanceTxt + '</div>' +
    '</div>' +
  '</div>';

var js_s6 =
  "new MTS.NumberInput('#ni-declarative');\n\n" +
  "new MTS.NumberInput('#ni-enhanced', {\n" +
  "  onChange: function(value, formatted) {\n" +
  "    setResult('res-enhance', 'valor: ' + value + ' | formateado: ' + formatted);\n" +
  "  }\n" +
  "});";

var niApi;

function niApiDemo(action) {
  if (!niApi) return;
  if (action === 'getValue') setResult('res-api', echoGetValue + niApi.getValue());
  if (action === 'setValue') { niApi.setValue(0); setResult('res-api', echoSetValue); }
  if (action === 'setError') { niApi.setError(apiExternalError); setResult('res-api', echoSetError); }
  if (action === 'clearError') { niApi.clearError(); setResult('res-api', echoClearError); }
  if (action === 'disable') { niApi.disable(); setResult('res-api', echoDisable); }
  if (action === 'enable') { niApi.enable(); setResult('res-api', echoEnable); }
  if (action === 'focus') { niApi.focus(); setResult('res-api', echoFocus); }
}

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.NumberInput('#ni-basic',{label:labelQuantity,value:1,min:0,max:10,onChange:function(v,f){setResult('res-basic',echoBasic+v+echoFormatted+f);}});
  new MTS.NumberInput('#ni-step',{label:labelStep5,value:0,min:0,max:100,step:5});
  new MTS.NumberInput('#ni-decimals',{label:labelDecimals,value:1.5,step:0.1,decimals:2});
});

makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.NumberInput('#ni-clp',{label:labelPriceClp,value:15000,format:'currency',currency:'CLP',locale:'es-CL',step:500,min:0,onChange:function(v,f){setResult('res-format','CLP → '+f);}});
  new MTS.NumberInput('#ni-usd',{label:labelPriceUsd,value:99,format:'currency',currency:'USD',locale:'en-US',step:1,decimals:2,min:0,onChange:function(v,f){setResult('res-format','USD → '+f);}});
  new MTS.NumberInput('#ni-pct',{label:labelDiscount,value:10,format:'percent',min:0,max:100,step:5,onChange:function(v,f){setResult('res-format',echoPercent+f);}});
});

makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.NumberInput('#ni-prefix',{label:labelAmount,prefix:'$',value:500,step:100,min:0});
  new MTS.NumberInput('#ni-suffix',{label:labelWeight,suffix:'kg',value:75,step:0.5,decimals:1,min:0});
  new MTS.NumberInput('#ni-both',{label:labelTemperature,prefix:'~',suffix:'°C',value:20,min:-20,max:50});
});

makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.NumberInput('#ni-sm',{label:sizeSm,size:'sm',value:1,min:0});
  new MTS.NumberInput('#ni-md',{label:sizeMd,size:'md',value:1,min:0});
  new MTS.NumberInput('#ni-lg',{label:sizeLg,size:'lg',value:1,min:0});
});

makeSection('tabs-s5', preview_s5, js_s5, function() {
  niApi = new MTS.NumberInput('#ni-api',{label:labelPoints,value:50,min:0,max:100,hint:hintPoints});
});

makeSection('tabs-s6', preview_s6, js_s6, function() {
  new MTS.NumberInput('#ni-declarative');
  new MTS.NumberInput('#ni-enhanced',{onChange:function(v,f){setResult('res-enhance',echoBasic+v+echoFormatted+f);}});
});

</script>
</body>
</html>
