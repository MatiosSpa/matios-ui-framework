<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.NumberInput — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-numberinput.css">
  <script src="../../support/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>

<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.NumberInput</h1>
    <p>Input numérico con botones +/−, min/max, step y formatos de moneda y porcentaje.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-numberinput.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

<div class="demo-section"><div class="demo-section-title">1 — Básico con min/max/step</div><div id="tabs-s1"></div></div>
<div class="demo-section"><div class="demo-section-title">2 — Formatos: moneda y porcentaje</div><div id="tabs-s2"></div></div>
<div class="demo-section"><div class="demo-section-title">3 — Prefix y Suffix</div><div id="tabs-s3"></div></div>
<div class="demo-section"><div class="demo-section-title">4 — Tamaños</div><div id="tabs-s4"></div></div>
<div class="demo-section"><div class="demo-section-title">5 — API programática</div><div id="tabs-s5"></div></div>
<div class="demo-section"><div class="demo-section-title">6 — HTML declarativo + enhancement</div><div id="tabs-s6"></div></div>
</div>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var m = t.match(/^<\s*([a-z0-9-]+)/i);
      var tag = m ? m[1] : '';
      var selfClosing = /\/>$/.test(t) || voids.test(tag);
      if (!selfClosing) indent += step;
    } else {
      result += ' '.repeat(indent) + t + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}


var preview_s1 =
  '<div class="demo-grid">' +
    '<div id="ni-basic"></div>' +
    '<div id="ni-step"></div>' +
    '<div id="ni-decimals"></div>' +
  '</div>' +
  '<div class="result-box" id="res-basic">— interactúa con los inputs —</div>';

var js_s1 =
  "new MTS.NumberInput('#ni-basic', {\n" +
  "  label: 'Cantidad',\n" +
  "  value: 1,\n" +
  "  min: 0,\n" +
  "  max: 10,\n" +
  "  onChange: function(value, formatted) {\n" +
  "    setResult('res-basic', 'valor: ' + value + ' | formateado: ' + formatted);\n" +
  "  }\n" +
  "});\n\n" +
  "new MTS.NumberInput('#ni-step', { label: 'Cada 5 unidades', value: 0, min: 0, max: 100, step: 5 });\n" +
  "new MTS.NumberInput('#ni-decimals', { label: 'Con 2 decimales', value: 1.5, step: 0.1, decimals: 2 });";

var preview_s2 =
  '<div class="demo-grid">' +
    '<div id="ni-clp"></div>' +
    '<div id="ni-usd"></div>' +
    '<div id="ni-pct"></div>' +
  '</div>' +
  '<div class="result-box" id="res-format">— cambia los valores —</div>';

var js_s2 =
  "new MTS.NumberInput('#ni-clp', { label: 'Precio (CLP)', value: 15000, format: 'currency', currency: 'CLP', locale: 'es-CL', step: 500, min: 0, onChange: function(v, f) { setResult('res-format', 'CLP → ' + f); } });\n" +
  "new MTS.NumberInput('#ni-usd', { label: 'Precio (USD)', value: 99, format: 'currency', currency: 'USD', locale: 'en-US', step: 1, decimals: 2, min: 0, onChange: function(v, f) { setResult('res-format', 'USD → ' + f); } });\n" +
  "new MTS.NumberInput('#ni-pct', { label: 'Descuento', value: 10, format: 'percent', min: 0, max: 100, step: 5, onChange: function(v, f) { setResult('res-format', 'Porcentaje → ' + f); } });";

var preview_s3 =
  '<div class="demo-grid">' +
    '<div id="ni-prefix"></div>' +
    '<div id="ni-suffix"></div>' +
    '<div id="ni-both"></div>' +
  '</div>';

var js_s3 =
  "new MTS.NumberInput('#ni-prefix', { label: 'Monto', prefix: '$', value: 500, step: 100, min: 0 });\n" +
  "new MTS.NumberInput('#ni-suffix', { label: 'Peso', suffix: 'kg', value: 75, step: 0.5, decimals: 1, min: 0 });\n" +
  "new MTS.NumberInput('#ni-both', { label: 'Temperatura', prefix: '~', suffix: '°C', value: 20, min: -20, max: 50 });";

var preview_s4 =
  '<div class="demo-row">' +
    '<div class="demo-col"><div class="demo-label">SM</div><div id="ni-sm"></div></div>' +
    '<div class="demo-col"><div class="demo-label">MD</div><div id="ni-md"></div></div>' +
    '<div class="demo-col"><div class="demo-label">LG</div><div id="ni-lg"></div></div>' +
  '</div>';

var js_s4 =
  "new MTS.NumberInput('#ni-sm', { label: 'Tamaño SM', size: 'sm', value: 1, min: 0 });\n" +
  "new MTS.NumberInput('#ni-md', { label: 'Tamaño MD', size: 'md', value: 1, min: 0 });\n" +
  "new MTS.NumberInput('#ni-lg', { label: 'Tamaño LG', size: 'lg', value: 1, min: 0 });";

var preview_s5 =
  '<div class="demo-stack">' +
    '<div id="ni-api"></div>' +
    '<div class="demo-row">' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'getValue\')">getValue()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'setValue\')">setValue(0)</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'setError\')">setError()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'clearError\')">clearError()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'disable\')">disable()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'enable\')">enable()</button>' +
      '<button class="demo-btn-sm" onclick="niApiDemo(\'focus\')">focus()</button>' +
    '</div>' +
    '<div class="result-box" id="res-api">— usa los botones para llamar la API —</div>' +
  '</div>';

var js_s5 =
  "var niApi = new MTS.NumberInput('#ni-api', { label: 'Puntos acumulados', value: 50, min: 0, max: 100, hint: 'Mínimo 0, máximo 100' });\n\n" +
  "niApi.getValue();\n" +
  "niApi.setValue(0);\n" +
  "niApi.setError('Valor inválido');\n" +
  "niApi.clearError();\n" +
  "niApi.disable();\n" +
  "niApi.enable();\n" +
  "niApi.focus();";

var preview_s6 =
  '<div class="demo-stack">' +
    '<div class="demo-col">' +
      '<div class="demo-label">HTML declarativo</div>' +
      '<div id="ni-declarative" data-label="Unidades" data-value="12" data-min="0" data-max="50" data-step="1"></div>' +
    '</div>' +
    '<div class="demo-col">' +
      '<div class="demo-label">HTML declarativo + enhancement</div>' +
      '<div id="ni-enhanced" data-label="Monto" data-value="1500" data-prefix="$" data-step="100" data-hint="Matios UI potencia el HTML base"></div>' +
      '<div class="result-box" id="res-enhance">— cambia el valor para ver el enhancement —</div>' +
    '</div>' +
  '</div>';

var js_s6 =
  "new MTS.NumberInput('#ni-declarative');\n\n" +
  "new MTS.NumberInput('#ni-enhanced', {\n" +
  "  onChange: function(value, formatted) {\n" +
  "    setResult('res-enhance', 'valor: ' + value + ' | formateado: ' + formatted);\n" +
  "  }\n" +
  "});";

var niApi;

function niApiDemo(action) {
  if (!niApi) return;
  if (action === 'getValue') setResult('res-api', 'getValue() → ' + niApi.getValue());
  if (action === 'setValue') { niApi.setValue(0); setResult('res-api', 'setValue(0) aplicado'); }
  if (action === 'setError') { niApi.setError('Mensaje de error externo'); setResult('res-api', 'setError() aplicado'); }
  if (action === 'clearError') { niApi.clearError(); setResult('res-api', 'clearError() aplicado'); }
  if (action === 'disable') { niApi.disable(); setResult('res-api', 'disable() aplicado'); }
  if (action === 'enable') { niApi.enable(); setResult('res-api', 'enable() aplicado'); }
  if (action === 'focus') { niApi.focus(); setResult('res-api', 'focus() aplicado'); }
}

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.NumberInput('#ni-basic',{label:'Cantidad',value:1,min:0,max:10,onChange:function(v,f){setResult('res-basic','valor: '+v+' | formateado: '+f);}});
  new MTS.NumberInput('#ni-step',{label:'Cada 5 unidades',value:0,min:0,max:100,step:5});
  new MTS.NumberInput('#ni-decimals',{label:'Con 2 decimales',value:1.5,step:0.1,decimals:2});
});

makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.NumberInput('#ni-clp',{label:'Precio (CLP)',value:15000,format:'currency',currency:'CLP',locale:'es-CL',step:500,min:0,onChange:function(v,f){setResult('res-format','CLP → '+f);}});
  new MTS.NumberInput('#ni-usd',{label:'Precio (USD)',value:99,format:'currency',currency:'USD',locale:'en-US',step:1,decimals:2,min:0,onChange:function(v,f){setResult('res-format','USD → '+f);}});
  new MTS.NumberInput('#ni-pct',{label:'Descuento',value:10,format:'percent',min:0,max:100,step:5,onChange:function(v,f){setResult('res-format','Porcentaje → '+f);}});
});

makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.NumberInput('#ni-prefix',{label:'Monto',prefix:'$',value:500,step:100,min:0});
  new MTS.NumberInput('#ni-suffix',{label:'Peso',suffix:'kg',value:75,step:0.5,decimals:1,min:0});
  new MTS.NumberInput('#ni-both',{label:'Temperatura',prefix:'~',suffix:'°C',value:20,min:-20,max:50});
});

makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.NumberInput('#ni-sm',{label:'Tamaño SM',size:'sm',value:1,min:0});
  new MTS.NumberInput('#ni-md',{label:'Tamaño MD',size:'md',value:1,min:0});
  new MTS.NumberInput('#ni-lg',{label:'Tamaño LG',size:'lg',value:1,min:0});
});

makeSection('tabs-s5', preview_s5, js_s5, function() {
  niApi = new MTS.NumberInput('#ni-api',{label:'Puntos acumulados',value:50,min:0,max:100,hint:'Mínimo 0, máximo 100'});
});

makeSection('tabs-s6', preview_s6, js_s6, function() {
  new MTS.NumberInput('#ni-declarative');
  new MTS.NumberInput('#ni-enhanced',{onChange:function(v,f){setResult('res-enhance','valor: '+v+' | formateado: '+f);}});
});

</script>
</body>
</html>
