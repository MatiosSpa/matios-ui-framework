<!DOCTYPE html>

  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

makeSection("tabs-s4", "<form class=\"mts-form mts-form--horizontal\" onsubmit=\"return false\" style=\"max-width:520px\">\n<div class=\"mts-form-group\">\n<label class=\"mts-form-label mts-form-label--required\">Email</label>\n<input class=\"mts-input\" placeholder=\"user@example.com\" type=\"email\"/>\n</div>\n<div class=\"mts-form-group\">\n<label class=\"mts-form-label\">Password</label>\n<input class=\"mts-input\" placeholder=\"Min 8 characters\" type=\"password\"/>\n<span class=\"mts-form-hint\">Minimum 8 characters.</span>\n</div>\n<div class=\"mts-form-group\">\n<label class=\"mts-form-label\">Role</label>\n<input class=\"mts-input\" placeholder=\"Admin\"/>\n</div>\n<div class=\"mts-form-footer mts-form-footer--end\">\n<button class=\"mts-btn mts-btn--primary\" type=\"button\">Save</button>\n</div>\n</form>", "<form class=\"mts-form mts-form--horizontal\">\n  <div class=\"mts-form-group\">\n    <label class=\"mts-form-label\">Email</label>\n    <input class=\"mts-input\" type=\"email\">\n  </div>\n</form>\n\n<\!-- Custom label width / Ancho de label personalizado -->\n<form class=\"mts-form mts-form--horizontal\" style=\"--mts-form-label-width:200px\">\n  ...\n</form>", "// Pure CSS component \u2014 no JavaScript enhancement required.\n// This demo shows layout patterns using HTML classes only.\n// Use the HTML tab as the source of truth for implementation.");
