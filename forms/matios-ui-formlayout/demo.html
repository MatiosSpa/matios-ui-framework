<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: (typeof JS_BY_ID !== 'undefined' && JS_BY_ID[id]) || jsCode || '', language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

// — Locale: shows English by default (public face); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);

})();

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Form layout system — pure CSS. Stack, grid, horizontal, inline, sections and card.';
document.getElementById('s1-title').textContent = D.s1Title || '1 — Stack (default)';
document.getElementById('s2-title').textContent = D.s2Title || '2 — Grid — 2 columns';

// — JavaScript tab: FormLayout is pure CSS (no MTS.FormLayout class). Each entry
//   rebuilds the section's form with the DOM API + the real field components

const JS_BY_ID = {
  "tabs-s1": `// FormLayout is pure CSS — there is no MTS.FormLayout class.
// Build the .mts-form skeleton with the DOM API, then mount the field
// components (MTS.Input / MTS.Button) inside it. No innerHTML.
const form = document.createElement('form');
form.className = 'mts-form';

// Full name (required)
const gName = document.createElement('div');
gName.className = 'mts-form-group';
const lName = document.createElement('label');
lName.className = 'mts-form-label mts-form-label--required';
lName.textContent = 'Full name';
gName.appendChild(lName);
form.appendChild(gName);
new MTS.Input(gName, { placeholder: 'John Doe', renderMode: 'field-only' });

// Email (with hint)
const gEmail = document.createElement('div');
gEmail.className = 'mts-form-group';
const lEmail = document.createElement('label');
lEmail.className = 'mts-form-label';
lEmail.textContent = 'Email';
gEmail.appendChild(lEmail);
form.appendChild(gEmail);
new MTS.Input(gEmail, { type: 'email', hint: "We'll send confirmations here.", renderMode: 'field-only' });

// Footer actions
const footer = document.createElement('div');
footer.className = 'mts-form-footer mts-form-footer--end';
form.appendChild(footer);
const bCancel = document.createElement('button');
bCancel.type = 'button';
footer.appendChild(bCancel);
new MTS.Button(bCancel, { label: 'Cancel', variant: 'secondary' });
const bSave = document.createElement('button');
bSave.type = 'button';
footer.appendChild(bSave);
new MTS.Button(bSave, { label: 'Save', variant: 'primary' });

document.querySelector('#form-target').appendChild(form);`,
