<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Checkbox — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../shared/demo-shared.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-checkbox.css">
  <script src="../../shared/demo-shared.js"></script>
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-checkbox.js"></script>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Checkbox</h1>
    <p>Checkbox individual, estados básicos, grupos vertical y horizontal, y grupo disabled.</p>
    <div class="demo-header-actions">
      <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-checkbox.md')">Documentación</button>
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>
  <div class="demo-section"><div class="demo-section-title">1 — Checkbox individual</div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title">2 — Grupo vertical (default)</div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title">3 — Grupo horizontal</div><div id="tabs-s3"></div></div>
  <div class="demo-section"><div class="demo-section-title">4 — Grupo completamente deshabilitado</div><div id="tabs-s4"></div></div>
</div>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

var preview_s1 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div class="demo-col"><div class="demo-label">Normal</div><div id="chk-normal"></div></div>' +
      '<div class="demo-col"><div class="demo-label">Pre-marcado</div><div id="chk-checked"></div></div>' +
      '<div class="demo-col"><div class="demo-label">Indeterminado</div><div id="chk-indeterminate"></div></div>' +
      '<div class="demo-col"><div class="demo-label">Disabled</div><div id="chk-disabled"></div></div>' +
      '<div class="demo-col"><div class="demo-label">Disabled checked</div><div id="chk-disabled-checked"></div></div>' +
    '</div>' +
    '<div class="result-box" id="chk-result">— interactúa con los checkboxes —</div>' +
  '</div>';

var js_s1 =
  "new MTS.Checkbox('#chk-normal', { label: 'Acepto los términos', onChange: function(e) { setResult('chk-result', 'checked: ' + e.detail.checked); } });\n" +
  "new MTS.Checkbox('#chk-checked', { label: 'Pre-marcado', checked: true, onChange: function(e) { setResult('chk-result', 'checked: ' + e.detail.checked); } });\n" +
  "new MTS.Checkbox('#chk-indeterminate', { label: 'Selección parcial', indeterminate: true });\n" +
  "new MTS.Checkbox('#chk-disabled', { label: 'Disabled', disabled: true });\n" +
  "new MTS.Checkbox('#chk-disabled-checked', { label: 'Disabled checked', checked: true, disabled: true });";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="chk-group-v"></div>' +
    '<div class="result-box" id="chk-group-result">— selecciona opciones —</div>' +
  '</div>';

var js_s2 =
  "new MTS.CheckboxGroup('#chk-group-v', {\n" +
  "  options: [\n" +
  "    { value: 'pdf', label: 'PDF' },\n" +
  "    { value: 'xlsx', label: 'Excel' },\n" +
  "    { value: 'csv', label: 'CSV', disabled: true },\n" +
  "    { value: 'docx', label: 'Word' }\n" +
  "  ],\n" +
  "  value: ['pdf'],\n" +
  "  onChange: function(e) { setResult('chk-group-result', 'valores: ' + JSON.stringify(e.detail.value)); }\n" +
  "});";

var preview_s3 = '<div id="chk-group-h"></div>';

var js_s3 =
  "new MTS.CheckboxGroup('#chk-group-h', {\n" +
  "  horizontal: true,\n" +
  "  options: [\n" +
  "    { value: 'lun', label: 'Lunes' },\n" +
  "    { value: 'mar', label: 'Martes' },\n" +
  "    { value: 'mie', label: 'Miércoles' },\n" +
  "    { value: 'jue', label: 'Jueves' },\n" +
  "    { value: 'vie', label: 'Viernes' }\n" +
  "  ],\n" +
  "  value: ['lun', 'mie']\n" +
  "});";

var preview_s4 = '<div id="chk-group-dis"></div>';

var js_s4 =
  "new MTS.CheckboxGroup('#chk-group-dis', {\n" +
  "  disabled: true,\n" +
  "  options: [\n" +
  "    { value: 'a', label: 'Opción A' },\n" +
  "    { value: 'b', label: 'Opción B' },\n" +
  "    { value: 'c', label: 'Opción C' }\n" +
  "  ],\n" +
  "  value: ['a']\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.Checkbox('#chk-normal', { label: 'Acepto los términos', onChange: function(e) { setResult('chk-result', 'checked: ' + e.detail.checked); } });
  new MTS.Checkbox('#chk-checked', { label: 'Pre-marcado', checked: true, onChange: function(e) { setResult('chk-result', 'checked: ' + e.detail.checked); } });
  new MTS.Checkbox('#chk-indeterminate', { label: 'Selección parcial', indeterminate: true });
  new MTS.Checkbox('#chk-disabled', { label: 'Disabled', disabled: true });
  new MTS.Checkbox('#chk-disabled-checked', { label: 'Disabled checked', checked: true, disabled: true });
});
makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.CheckboxGroup('#chk-group-v', {
    options: [
      { value: 'pdf', label: 'PDF' },
      { value: 'xlsx', label: 'Excel' },
      { value: 'csv', label: 'CSV', disabled: true },
      { value: 'docx', label: 'Word' }
    ],
    value: ['pdf'],
    onChange: function(e) { setResult('chk-group-result', 'valores: ' + JSON.stringify(e.detail.value)); }
  });
});
makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.CheckboxGroup('#chk-group-h', {
    horizontal: true,
    options: [
      { value: 'lun', label: 'Lunes' },
      { value: 'mar', label: 'Martes' },
      { value: 'mie', label: 'Miércoles' },
      { value: 'jue', label: 'Jueves' },
      { value: 'vie', label: 'Viernes' }
    ],
    value: ['lun', 'mie']
  });
});
makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.CheckboxGroup('#chk-group-dis', {
    disabled: true,
    options: [
      { value: 'a', label: 'Opción A' },
      { value: 'b', label: 'Opción B' },
      { value: 'c', label: 'Opción C' }
    ],
    value: ['a']
  });
});

</script>
</body>
</html>
