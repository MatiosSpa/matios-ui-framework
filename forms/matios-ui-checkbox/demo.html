  <div class="demo-section"><div class="demo-section-title" id="s4-title"></div><div id="tabs-s4"></div></div>

<script>

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '340px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

function setResult(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Checkbox'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Single checkbox, basic states, vertical and horizontal groups, and a disabled group.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Single checkbox';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Vertical group (default)';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Horizontal group';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Fully disabled group';

var labelNormal          = D.labelNormal || 'Normal';
var labelChecked         = D.labelChecked || 'Pre-checked';
var labelIndeterminate   = D.labelIndeterminate || 'Indeterminate';
var labelDisabled        = D.labelDisabled || 'Disabled';
var labelDisabledChecked = D.labelDisabledChecked || 'Disabled checked';
var resultBasic          = D.resultBasicPlaceholder || '— interact with the checkboxes —';
var resultGroup          = D.resultGroupPlaceholder || '— select options —';
var cbAccept             = D.cbAccept || 'I accept the terms';
var cbPreChecked         = D.cbPreChecked || 'Pre-checked';
var cbPartial            = D.cbPartial || 'Partial selection';
var echoChecked          = D.echoChecked || 'checked: ';
var echoValues           = D.echoValues || 'values: ';
var dayMon               = D.dayMon || 'Monday';
var dayTue               = D.dayTue || 'Tuesday';
var dayWed               = D.dayWed || 'Wednesday';
var dayThu               = D.dayThu || 'Thursday';
var dayFri               = D.dayFri || 'Friday';
var optA                 = D.optA || 'Option A';
var optB                 = D.optB || 'Option B';
var optC                 = D.optC || 'Option C';

var preview_s1 =
  '<div class="demo-stack">' +
    '<div class="demo-row">' +
      '<div class="demo-col"><div class="demo-label">' + labelNormal + '</div><div id="chk-normal"></div></div>' +
      '<div class="demo-col"><div class="demo-label">' + labelChecked + '</div><div id="chk-checked"></div></div>' +
      '<div class="demo-col"><div class="demo-label">' + labelIndeterminate + '</div><div id="chk-indeterminate"></div></div>' +
      '<div class="demo-col"><div class="demo-label">' + labelDisabled + '</div><div id="chk-disabled"></div></div>' +
      '<div class="demo-col"><div class="demo-label">' + labelDisabledChecked + '</div><div id="chk-disabled-checked"></div></div>' +
    '</div>' +
    '<div class="result-box" id="chk-result">' + resultBasic + '</div>' +
  '</div>';

var js_s1 =
  "new MTS.Checkbox('#chk-normal', { label: 'Acepto los términos', onChange: function(e) { setResult('chk-result', 'checked: ' + e.detail.checked); } });\n" +
  "new MTS.Checkbox('#chk-checked', { label: 'Pre-marcado', checked: true, onChange: function(e) { setResult('chk-result', 'checked: ' + e.detail.checked); } });\n" +
  "new MTS.Checkbox('#chk-indeterminate', { label: 'Selección parcial', indeterminate: true });\n" +
  "new MTS.Checkbox('#chk-disabled', { label: 'Disabled', disabled: true });\n" +
  "new MTS.Checkbox('#chk-disabled-checked', { label: 'Disabled checked', checked: true, disabled: true });";

var preview_s2 =
  '<div class="demo-stack">' +
    '<div id="chk-group-v"></div>' +
    '<div class="result-box" id="chk-group-result">' + resultGroup + '</div>' +
  '</div>';

var js_s2 =
  "new MTS.CheckboxGroup('#chk-group-v', {\n" +
  "  options: [\n" +
  "    { value: 'pdf', label: 'PDF' },\n" +
  "    { value: 'xlsx', label: 'Excel' },\n" +
  "    { value: 'csv', label: 'CSV', disabled: true },\n" +
  "    { value: 'docx', label: 'Word' }\n" +
  "  ],\n" +
  "  value: ['pdf'],\n" +
  "  onChange: function(e) { setResult('chk-group-result', 'valores: ' + JSON.stringify(e.detail.value)); }\n" +
  "});";

var preview_s3 = '<div id="chk-group-h"></div>';

var js_s3 =
  "new MTS.CheckboxGroup('#chk-group-h', {\n" +
  "  horizontal: true,\n" +
  "  options: [\n" +
  "    { value: 'lun', label: 'Lunes' },\n" +
  "    { value: 'mar', label: 'Martes' },\n" +
  "    { value: 'mie', label: 'Miércoles' },\n" +
  "    { value: 'jue', label: 'Jueves' },\n" +
  "    { value: 'vie', label: 'Viernes' }\n" +
  "  ],\n" +
  "  value: ['lun', 'mie']\n" +
  "});";

var preview_s4 = '<div id="chk-group-dis"></div>';

var js_s4 =
  "new MTS.CheckboxGroup('#chk-group-dis', {\n" +
  "  disabled: true,\n" +
  "  options: [\n" +
  "    { value: 'a', label: 'Opción A' },\n" +
  "    { value: 'b', label: 'Opción B' },\n" +
  "    { value: 'c', label: 'Opción C' }\n" +
  "  ],\n" +
  "  value: ['a']\n" +
  "});";

makeSection('tabs-s1', preview_s1, js_s1, function() {
  new MTS.Checkbox('#chk-normal', { label: cbAccept, onChange: function(e) { setResult('chk-result', echoChecked + e.detail.checked); } });
  new MTS.Checkbox('#chk-checked', { label: cbPreChecked, checked: true, onChange: function(e) { setResult('chk-result', echoChecked + e.detail.checked); } });
  new MTS.Checkbox('#chk-indeterminate', { label: cbPartial, indeterminate: true });
  new MTS.Checkbox('#chk-disabled', { label: labelDisabled, disabled: true });
  new MTS.Checkbox('#chk-disabled-checked', { label: labelDisabledChecked, checked: true, disabled: true });
});
makeSection('tabs-s2', preview_s2, js_s2, function() {
  new MTS.CheckboxGroup('#chk-group-v', {
    options: [
      { value: 'pdf', label: 'PDF' },
      { value: 'xlsx', label: 'Excel' },
      { value: 'csv', label: 'CSV', disabled: true },
      { value: 'docx', label: 'Word' }
    ],
    value: ['pdf'],
    onChange: function(e) { setResult('chk-group-result', echoValues + JSON.stringify(e.detail.value)); }
  });
});
makeSection('tabs-s3', preview_s3, js_s3, function() {
  new MTS.CheckboxGroup('#chk-group-h', {
    horizontal: true,
    options: [
      { value: 'lun', label: dayMon },
      { value: 'mar', label: dayTue },
      { value: 'mie', label: dayWed },
      { value: 'jue', label: dayThu },
      { value: 'vie', label: dayFri }
    ],
    value: ['lun', 'mie']
  });
});
makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.CheckboxGroup('#chk-group-dis', {
    disabled: true,
    options: [
      { value: 'a', label: optA },
      { value: 'b', label: optB },
      { value: 'c', label: optC }
    ],
    value: ['a']
  });
});

</script>
