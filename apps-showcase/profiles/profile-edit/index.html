<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit profile - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-midnight.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-obsidian.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-forest.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-abyss.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-ember.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dune.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../../forms/matios-ui-select/matios-ui-select.js"></script>
  <script src="../../../forms/matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="profile-edit-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    var MODULE_PERMISSIONS = {
      users: [
        { value: 'users.view', label: 'View user list' },
        { value: 'users.create', label: 'Create users' },
        { value: 'users.edit', label: 'Edit users' },
        { value: 'users.block', label: 'Block or unblock users' },
        { value: 'users.password', label: 'Change user passwords' }
      ],
      documents: [
        { value: 'documents.view', label: 'View documents' },
        { value: 'documents.upload', label: 'Upload documents' },
        { value: 'documents.edit', label: 'Edit document metadata' },
        { value: 'documents.download', label: 'Download documents' },
        { value: 'documents.share', label: 'Share documents' }
      ],
      billing: [
        { value: 'billing.plan', label: 'View current plan' },
        { value: 'billing.invoices', label: 'View invoice history' },
        { value: 'billing.methods', label: 'Manage payment methods' },
        { value: 'billing.usage', label: 'Review usage and limits' }
      ],
      support: [
        { value: 'support.inbox', label: 'View ticket inbox' },
        { value: 'support.assign', label: 'Assign tickets' },
        { value: 'support.resolve', label: 'Resolve tickets' },
        { value: 'support.export', label: 'Export cases' }
      ]
    };

    var permissionGroup = null;

    new MTS.Card('#profile-edit-panel', {
      title: 'Edit profile',
      subtitle: 'Profile settings by module',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex--column mts-gap-4">' +
          '<div id="profile-edit-alert"></div>' +
          '<p class="mts-text--md mts-text-color--muted mts-m-0">Editing keeps the same format: name, description, module and detailed permissions for the selected module.</p>' +
          '<div class="mts-grid mts-grid--gap-md">' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="profile-edit-name"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="profile-edit-module"></div></div>' +
            '<div class="mts-g-col-12"><div id="profile-edit-description"></div></div>' +
          '</div>' +
          '<div class="mts-surface mts-p-4">' +
            '<div class="mts-d-flex mts-flex--column mts-gap-3">' +
              '<div>' +
                '<h3 class="mts-h4 mts-m-0">Module permissions</h3>' +
                '<p id="profile-edit-permissions-copy" class="mts-text--sm mts-text-color--muted mts-mt-2 mts-mb-0">Permissions loaded according to the profile module.</p>' +
              '</div>' +
              '<div id="profile-edit-permissions"></div>' +
            '</div>' +
          '</div>' +
        '</div>',
      footerAlign: 'between',
      footer: [
        {
          label: 'Back to profiles',
          variant: 'ghost',
          icon: MTS.Icon.get('arrow-left'),
          onClick: function () {
            openScreen('../profile-list/index.html');
          }
        },
        {
          label: 'Save changes',
          variant: 'primary',
          icon: MTS.Icon.get('save'),
          onClick: function () {
            submitEdit();
          }
        }
      ]
    });

    var nameInput = new MTS.Input('#profile-edit-name', {
      type: 'text',
      label: 'Name',
      value: 'Document operations',
      iconLeft: MTS.Icon.get('layers')
    });

    var moduleSelect = new MTS.Select('#profile-edit-module', {
      label: 'Module',
      value: 'users',
      options: [
        { value: 'users', label: 'Users' },
        { value: 'documents', label: 'Documents' },
        { value: 'billing', label: 'Billing' },
        { value: 'support', label: 'Support' }
      ],
      onChange: function (event) {
        renderPermissionGroup(event.detail.value, []);
      }
    });

    var descriptionInput = new MTS.Input('#profile-edit-description', {
      type: 'text',
      label: 'Description',
      value: 'Manages users, documents and traceability for internal operations.',
      iconLeft: MTS.Icon.get('file-text')
    });

    function clearAlerts() {
      document.getElementById('profile-edit-alert').innerHTML = '';
    }

    function showAlert(variant, title, message) {
      clearAlerts();
      MTS.Alert.show('#profile-edit-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function clearFieldErrors() {
      nameInput.clearError();
      descriptionInput.clearError();
    }

    function renderPermissionGroup(moduleValue, selectedValues) {
      var host = document.getElementById('profile-edit-permissions');
      var copy = document.getElementById('profile-edit-permissions-copy');
      var options = MODULE_PERMISSIONS[moduleValue] || [];
      host.innerHTML = '';
      permissionGroup = null;

      if (!moduleValue) {
        copy.textContent = 'Select a module to load its permissions.';
        return;
      }

      copy.textContent = 'Permissions available for the ' + getModuleLabel(moduleValue) + ' module.';
      permissionGroup = new MTS.CheckboxGroup('#profile-edit-permissions', {
        options: options,
        value: selectedValues || []
      });
    }

    function submitEdit() {
      var name = nameInput.getValue().trim();
      var description = descriptionInput.getValue().trim();
      var moduleValue = moduleSelect.getValue();
      var permissions = permissionGroup ? permissionGroup.getValue() : [];

      clearFieldErrors();
      clearAlerts();

      if (!name) {
        nameInput.setError('Enter the profile name');
        return;
      }

      if (!description) {
        descriptionInput.setError('Enter the profile description');
        return;
      }

      if (!moduleValue) {
        showAlert('warning', 'Module missing', 'Select the profile module before saving.');
        return;
      }

      if (!permissions.length) {
        showAlert('warning', 'Permissions missing', 'Select at least one module permission before saving.');
        return;
      }

      showAlert(
        'success',
        'Profile updated',
        'Changes would be saved to <strong>' + escapeHtml(name) + '</strong> in the <strong>' + escapeHtml(getModuleLabel(moduleValue)) + '</strong> module with <strong>' + permissions.length + '</strong> active permissions.'
      );
    }

    function getModuleLabel(value) {
      var options = moduleSelect.options || [];
      for (var i = 0; i < options.length; i++) {
        if (options[i].value === value) return options[i].label;
      }
      return value || '-';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    renderPermissionGroup('users', ['users.view', 'users.edit', 'users.block']);
    MTS.Icon.initAll();
  </script>
</body>
</html>
