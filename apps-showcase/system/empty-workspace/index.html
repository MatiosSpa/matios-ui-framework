<body>
  <div class="empty-workspace-page">
    <main class="empty-workspace-page__main mts-grid mts-grid--gap-md">
      <section class="empty-workspace-page__hero mts-surface mts-g-col-12">
        <div class="empty-workspace-page__eyebrow">First-run state</div>
        <h1 class="empty-workspace-page__hero-title">Your workspace doesn't have any data yet.</h1>
        <p class="empty-workspace-page__hero-copy">
          This initial state helps you get started without friction: invite your team, import content, or
          create the first workspace without leaving the user staring at an empty screen.
        </p>
        <div class="empty-workspace-page__badges">
          <span id="empty-badge-state"></span>
          <span id="empty-badge-owner"></span>
        </div>
        <div class="empty-workspace-page__actions">
          <div id="empty-create-button"></div>
          <div id="empty-import-button"></div>
        </div>
      </section>

      <section class="mts-g-col-12">
        <div id="empty-feedback"></div>
      </section>

      <section class="mts-g-col-12">
        <div class="mts-grid mts-grid--gap-md" id="empty-cards"></div>
      </section>
    </main>
  </div>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });
  </script>
  <script>
    var nextSteps = [
      { id: 'ns1', title: 'Invite team', subtitle: 'People', summary: 'Add owners, admins, or base members to share the workspace setup.' },
      { id: 'ns2', title: 'Import data', subtitle: 'Migration', summary: 'Upload files, connect an external source, or bring information from another tool.' },
      { id: 'ns3', title: 'Create first space', subtitle: 'Operations', summary: 'Open an initial project, folder, or module so your team can start working.' }
    ];

    new MTS.Badge('#empty-badge-state', {
      label: 'No data yet',
      variant: 'warning',
      size: 'sm'
    });

    new MTS.Badge('#empty-badge-owner', {
      label: 'Owner setup required',
      variant: 'default',
      size: 'sm'
    });

    new MTS.Button('#empty-create-button', {
      label: 'Create space',
      variant: 'primary',
      iconLeft: MTS.Icon.get('folder-plus'),
      onClick: function () {
        notify('success', 'Simulated action', 'This is where the flow to create the first workspace space would normally begin.');
      }
    });

    new MTS.Button('#empty-import-button', {
      label: 'Import data',
      variant: 'secondary',
      iconLeft: MTS.Icon.get('download'),
      onClick: function () {
        notify('info', 'Simulated import', 'The view covers the CTA for bringing in initial data.');
      }
    });

    function notify(variant, title, message) {
      MTS.Alert.show('#empty-feedback', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function renderCards() {
      var host = document.getElementById('empty-cards');
      host.innerHTML = '';

      nextSteps.forEach(function (item, index) {
        var wrap = document.createElement('div');
        wrap.className = 'mts-g-col-12 mts-g-col-lg-4';
        host.appendChild(wrap);

        var cardHost = document.createElement('div');
        wrap.appendChild(cardHost);

        new MTS.Card(cardHost, {
          title: item.title,
          subtitle: item.subtitle,
          variant: index === 0 ? 'elevated' : 'outlined',
          size: 'lg',
          body: '<p class="empty-workspace-page__card-copy">' + item.summary + '</p>',
          footerAlign: 'start',
          footer: [{
            label: 'Get started',
            variant: 'ghost',
            icon: MTS.Icon.get('arrow-right'),
            onClick: function () {
              notify('success', 'Simulated step', 'The "' + item.title + '" step was activated.');
            }
          }]
        });
      });
    }

    renderCards();
    MTS.Icon.initAll();
  </script>
</body>
</html>
