<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crear rol - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-transferlist/matios-ui-transferlist.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-badge/matios-ui-badge.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../../forms/matios-ui-select/matios-ui-select.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../forms/matios-ui-transferlist/matios-ui-transferlist.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="role-create-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    var MODULE_PROFILES = {
      users: [
        {
          id: 'users-workspace-base',
          name: 'Workspace base',
          description: 'Acceso operativo base para la administracion diaria de usuarios.',
          moduleId: 'users',
          moduleName: 'Usuarios'
        },
        {
          id: 'users-supervisor-operacional',
          name: 'Supervisor operacional',
          description: 'Gestion avanzada de usuarios, trazabilidad y aprobaciones internas.',
          moduleId: 'users',
          moduleName: 'Usuarios'
        },
        {
          id: 'users-auditor-usuarios',
          name: 'Auditor de usuarios',
          description: 'Consulta historica, revision de cambios y evidencia de auditoria.',
          moduleId: 'users',
          moduleName: 'Usuarios'
        }
      ],
      documents: [
        {
          id: 'documents-lector-documental',
          name: 'Lector documental',
          description: 'Consulta documentos y seguimiento del flujo sin capacidad de edicion.',
          moduleId: 'documents',
          moduleName: 'Documentos'
        },
        {
          id: 'documents-editor-documental',
          name: 'Editor documental',
          description: 'Edicion de contenido, metadatos y gestion de versiones activas.',
          moduleId: 'documents',
          moduleName: 'Documentos'
        },
        {
          id: 'documents-aprobador-documental',
          name: 'Aprobador documental',
          description: 'Validacion final del circuito documental y autorizacion de cambios.',
          moduleId: 'documents',
          moduleName: 'Documentos'
        }
      ],
      billing: [
        {
          id: 'billing-consulta-financiera',
          name: 'Consulta financiera',
          description: 'Lectura de indicadores de billing, conciliacion y seguimiento basico.',
          moduleId: 'billing',
          moduleName: 'Billing'
        },
        {
          id: 'billing-administrador-cobros',
          name: 'Administrador de cobros',
          description: 'Operacion de cobranzas, regularizaciones y excepciones de facturacion.',
          moduleId: 'billing',
          moduleName: 'Billing'
        },
        {
          id: 'billing-auditor-billing',
          name: 'Auditor billing',
          description: 'Revision de movimientos, desvios y consistencia operativa del modulo.',
          moduleId: 'billing',
          moduleName: 'Billing'
        }
      ],
      support: [
        {
          id: 'support-agente-mesa',
          name: 'Agente de mesa',
          description: 'Gestion de tickets entrantes, seguimiento y atencion de primer nivel.',
          moduleId: 'support',
          moduleName: 'Soporte'
        },
        {
          id: 'support-coordinador-soporte',
          name: 'Coordinador de soporte',
          description: 'Priorizacion operativa, escalamiento y control del backlog del modulo.',
          moduleId: 'support',
          moduleName: 'Soporte'
        },
        {
          id: 'support-qa-soporte',
          name: 'QA soporte',
          description: 'Revision de cierres, calidad de respuesta y mejora del flujo de soporte.',
          moduleId: 'support',
          moduleName: 'Soporte'
        }
      ]
    };

    var ALL_PROFILES = Object.keys(MODULE_PROFILES).reduce(function (list, moduleId) {
      return list.concat(MODULE_PROFILES[moduleId]);
    }, []);

    var selectedProfiles = {};
    var roleProfilesTransfer = null;
    var moduleFilterSelect = null;

    new MTS.Card('#role-create-panel', {
      title: 'Crear rol',
      subtitle: 'Agrupacion de perfiles por modulo',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex-col mts-gap-4">' +
          '<div id="role-create-alert"></div>' +
          '<section class="mts-surface mts-p-4 mts-d-flex mts-justify-between mts-gap-4 mts-flex-wrap">' +
            '<div class="mts-d-flex mts-flex-col mts-gap-2">' +
              '<p class="mts-text-md mts-m-0">Construye el rol seleccionando perfiles operativos desde una sola interaccion. Cada modulo puede tener un unico perfil activo dentro del rol.</p>' +
              '<p class="mts-text-sm mts-text-muted mts-m-0">Arrastra entre listas o usa los controles centrales. Si intentas repetir modulo, la transferencia se bloquea y el item vuelve visualmente a su origen.</p>' +
            '</div>' +
            '<div>' +
              '<span id="role-create-status" class="mts-badge mts-badge--info mts-badge--sm">Sin perfiles asignados</span>' +
            '</div>' +
          '</section>' +
          '<div class="mts-grid mts-grid--gap-md">' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="role-create-name"></div></div>' +
            '<div class="mts-g-col-12"><div id="role-create-description"></div></div>' +
          '</div>' +
          '<section class="mts-surface mts-p-4 mts-d-flex mts-flex-col mts-gap-4">' +
            '<div class="mts-d-flex mts-items-center mts-justify-between mts-gap-3 mts-flex-wrap">' +
              '<div>' +
                '<h3 class="mts-h4 mts-m-0">Asignacion de perfiles</h3>' +
                '<p class="mts-text-sm mts-text-muted mts-m-0">Caso real del showcase para validar `MTS.TransferList` en el flujo de roles.</p>' +
              '</div>' +
            '</div>' +
            '<div class="mts-grid mts-grid--gap-md mts-grid--center">' +
              '<div class="mts-g-col-12 mts-g-col-md-6">' +
                '<div id="role-create-module-filter"></div>' +
              '</div>' +
              '<div class="mts-g-col-12 mts-g-col-md-6 mts-d-flex mts-items-center mts-justify-between">' +
                '<span id="role-create-filter-count" class="mts-badge mts-badge--neutral mts-badge--sm">0 perfiles visibles</span>' +
              '</div>' +
            '</div>' +
            '<div id="role-create-transfer"></div>' +
          '</section>' +
          '<section class="mts-surface mts-p-4">' +
            '<div class="mts-d-flex mts-items-center mts-justify-between mts-gap-3 mts-flex-wrap">' +
              '<div>' +
                '<h3 class="mts-h4 mts-m-0">Resumen del rol</h3>' +
                '<p class="mts-text-sm mts-text-muted mts-m-0">Vista rapida de los modulos que ya quedaron cubiertos.</p>' +
              '</div>' +
              '<span id="role-create-count" class="mts-badge mts-badge--info mts-badge--sm">0 modulos</span>' +
            '</div>' +
            '<div id="role-create-summary" class="mts-grid mts-grid--gap-md mts-mt-4"></div>' +
          '</section>' +
        '</div>',
      footerAlign: 'between',
      footer: [
        {
          label: 'Volver a roles',
          variant: 'ghost',
          icon: MTS.Icon.get('arrow-left'),
          onClick: function () {
            openScreen('../role-list/index.html');
          }
        },
        {
          label: 'Crear rol',
          variant: 'primary',
          icon: MTS.Icon.get('plus-circle'),
          onClick: function () {
            submitCreate();
          }
        }
      ]
    });

    var nameInput = new MTS.Input('#role-create-name', {
      type: 'text',
      label: 'Nombre',
      placeholder: 'Ej: Operador integral',
      iconLeft: MTS.Icon.get('shield')
    });

    var descriptionInput = new MTS.Input('#role-create-description', {
      type: 'text',
      label: 'Descripcion',
      placeholder: 'Describe el alcance operacional del rol',
      iconLeft: MTS.Icon.get('file-text')
    });

    moduleFilterSelect = new MTS.Select('#role-create-module-filter', {
      label: 'Filtrar disponibles por modulo',
      value: 'all',
      options: [
        { value: 'all', label: 'Todos los modulos' },
        { value: 'users', label: 'Usuarios' },
        { value: 'documents', label: 'Documentos' },
        { value: 'billing', label: 'Billing' },
        { value: 'support', label: 'Soporte' }
      ],
      onChange: function () {
        applyProfileFilter();
      }
    });

    roleProfilesTransfer = new MTS.TransferList('#role-create-transfer', {
      label: 'Perfiles del rol',
      hint: 'No se permite repetir modulo en la lista derecha. Usa el filtro para acotar la lista disponible cuando crece el catalogo.',
      originTitle: 'Perfiles disponibles',
      selectedTitle: 'Perfiles del rol',
      originEmptyText: 'No quedan perfiles disponibles.',
      selectedEmptyText: 'Aun no hay perfiles dentro del rol.',
      originDataSource: ALL_PROFILES,
      selectedDataSource: [],
      validateUnique: true,
      validateKey: 'moduleId',
      duplicateMessage: 'Ya existe un perfil asignado para este modulo.',
      renderItem: function (item) {
        return '' +
          '<div class="mts-transferlist__item-main">' +
            '<div class="mts-transferlist__item-label">' + escapeHtml(item.name) + '</div>' +
            '<div class="mts-transferlist__item-desc">' + escapeHtml(item.description) + '</div>' +
          '</div>' +
          '<span class="mts-transferlist__item-meta">' + escapeHtml(item.moduleName) + '</span>';
      }
    });

    roleProfilesTransfer.on('change', function (event) {
      var detail = event.detail;
      var item = detail.item;

      syncSelectedProfiles();
      applyProfileFilter();

      if (detail.to === 'selected') {
        showAlert(
          'success',
          'Perfil agregado',
          'El rol ahora usa <strong>' + escapeHtml(item.name) + '</strong> para el modulo <strong>' + escapeHtml(item.moduleName) + '</strong>.'
        );
        return;
      }

      showAlert(
        'info',
        'Perfil quitado',
        'Se retiro <strong>' + escapeHtml(item.name) + '</strong> del modulo <strong>' + escapeHtml(item.moduleName) + '</strong>.'
      );
    });

    roleProfilesTransfer.on('invalid-transfer', function (event) {
      var item = event.detail.item;

      showAlert(
        'warning',
        'Transferencia bloqueada',
        'El rol ya tiene un perfil para <strong>' + escapeHtml(item.moduleName) + '</strong>. Quita el actual antes de mover <strong>' + escapeHtml(item.name) + '</strong>.'
      );
    });

    function syncSelectedProfiles() {
      selectedProfiles = {};

      roleProfilesTransfer.getSelectedItems().forEach(function (item) {
        selectedProfiles[item.moduleId] = item;
      });

      renderSelectedProfilesSummary();
    }

    function applyProfileFilter() {
      var selectedItems = roleProfilesTransfer.getSelectedItems();
      var selectedIds = selectedItems.reduce(function (map, item) {
        map[item.id] = true;
        return map;
      }, {});
      var moduleFilterValue = moduleFilterSelect ? moduleFilterSelect.getValue() : 'all';
      var filteredOriginProfiles = ALL_PROFILES.filter(function (item) {
        if (selectedIds[item.id]) return false;
        if (!moduleFilterValue || moduleFilterValue === 'all') return true;
        return item.moduleId === moduleFilterValue;
      });

      roleProfilesTransfer.setItems({
        originDataSource: filteredOriginProfiles,
        selectedDataSource: selectedItems
      });

      document.getElementById('role-create-filter-count').textContent =
        filteredOriginProfiles.length + (filteredOriginProfiles.length === 1 ? ' perfil visible' : ' perfiles visibles');
    }

    function renderSelectedProfilesSummary() {
      var items = Object.keys(selectedProfiles)
        .map(function (moduleId) { return selectedProfiles[moduleId]; })
        .sort(function (a, b) { return a.moduleName.localeCompare(b.moduleName); });

      document.getElementById('role-create-count').textContent = items.length + (items.length === 1 ? ' modulo' : ' modulos');
      document.getElementById('role-create-status').textContent = items.length
        ? items.length + (items.length === 1 ? ' perfil activo' : ' perfiles activos')
        : 'Sin perfiles asignados';

      if (!items.length) {
        document.getElementById('role-create-summary').innerHTML =
          '<div class="mts-g-col-12">' +
            '<div class="mts-surface mts-p-4 mts-d-flex mts-flex-col mts-gap-2 mts-items-center mts-justify-center mts-text-center">' +
            '<strong>El rol esta vacio.</strong>' +
            '<span>Empieza moviendo perfiles desde la lista izquierda para armar la cobertura por modulo.</span>' +
            '</div>' +
          '</div>';
        return;
      }

      document.getElementById('role-create-summary').innerHTML = items.map(function (item) {
        return '' +
          '<article class="mts-surface mts-p-4 mts-d-flex mts-flex-col mts-gap-2 mts-g-col-12 mts-g-col-md-6 mts-g-col-xl-3">' +
            '<span class="mts-text-xs mts-text-semibold mts-text-accent">' + escapeHtml(item.moduleName) + '</span>' +
            '<h4 class="mts-h4 mts-m-0">' + escapeHtml(item.name) + '</h4>' +
            '<p class="mts-text-sm mts-text-muted mts-m-0">' + escapeHtml(item.description) + '</p>' +
          '</article>';
      }).join('');
    }

    function clearAlerts() {
      document.getElementById('role-create-alert').innerHTML = '';
    }

    function showAlert(variant, title, message) {
      clearAlerts();
      MTS.Alert.show('#role-create-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function clearFieldErrors() {
      nameInput.clearError();
      descriptionInput.clearError();
    }

    function submitCreate() {
      var name = nameInput.getValue().trim();
      var description = descriptionInput.getValue().trim();
      var modules = Object.keys(selectedProfiles);

      clearFieldErrors();
      clearAlerts();

      if (!name) {
        nameInput.setError('Ingresa el nombre del rol');
        return;
      }

      if (!description) {
        descriptionInput.setError('Ingresa la descripcion del rol');
        return;
      }

      if (!modules.length) {
        showAlert('warning', 'Faltan perfiles', 'Agrega al menos un perfil por modulo antes de guardar el rol.');
        return;
      }

      showAlert(
        'success',
        'Rol preparado',
        'Se registraria el rol <strong>' + escapeHtml(name) + '</strong> con <strong>' + modules.length + '</strong> modulos asociados.'
      );
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    syncSelectedProfiles();
    applyProfileFilter();
    MTS.Icon.initAll();
  </script>
</body>
</html>
