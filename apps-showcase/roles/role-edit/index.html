<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit role - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-midnight.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-obsidian.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-forest.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-abyss.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-ember.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dune.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-transferlist/matios-ui-transferlist.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-badge/matios-ui-badge.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../../forms/matios-ui-select/matios-ui-select.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../forms/matios-ui-transferlist/matios-ui-transferlist.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="role-edit-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    var MODULE_PROFILES = {
      users: [
        {
          id: 'users-workspace-base',
          name: 'Base workspace',
          description: 'Baseline operational access for day-to-day user administration.',
          moduleId: 'users',
          moduleName: 'Users'
        },
        {
          id: 'users-supervisor-operacional',
          name: 'Operations supervisor',
          description: 'Advanced user management, traceability and internal approvals.',
          moduleId: 'users',
          moduleName: 'Users'
        },
        {
          id: 'users-auditor-usuarios',
          name: 'User auditor',
          description: 'Historical lookup, change review and audit evidence.',
          moduleId: 'users',
          moduleName: 'Users'
        }
      ],
      documents: [
        {
          id: 'documents-lector-documental',
          name: 'Document reader',
          description: 'View documents and track the workflow without edit capabilities.',
          moduleId: 'documents',
          moduleName: 'Documents'
        },
        {
          id: 'documents-editor-documental',
          name: 'Document editor',
          description: 'Content and metadata editing and management of active versions.',
          moduleId: 'documents',
          moduleName: 'Documents'
        },
        {
          id: 'documents-aprobador-documental',
          name: 'Document approver',
          description: 'Final validation of the document circuit and change authorization.',
          moduleId: 'documents',
          moduleName: 'Documents'
        }
      ],
      billing: [
        {
          id: 'billing-consulta-financiera',
          name: 'Financial viewer',
          description: 'Read billing indicators, reconciliation and basic tracking.',
          moduleId: 'billing',
          moduleName: 'Billing'
        },
        {
          id: 'billing-administrador-cobros',
          name: 'Collections administrator',
          description: 'Collections operation, adjustments and billing exceptions.',
          moduleId: 'billing',
          moduleName: 'Billing'
        },
        {
          id: 'billing-auditor-billing',
          name: 'Billing auditor',
          description: 'Review of movements, deviations and operational consistency of the module.',
          moduleId: 'billing',
          moduleName: 'Billing'
        }
      ],
      support: [
        {
          id: 'support-agente-mesa',
          name: 'Desk agent',
          description: 'Handle incoming tickets, follow-up and first-level support.',
          moduleId: 'support',
          moduleName: 'Support'
        },
        {
          id: 'support-coordinador-soporte',
          name: 'Support coordinator',
          description: 'Operational prioritization, escalation and control of the module backlog.',
          moduleId: 'support',
          moduleName: 'Support'
        },
        {
          id: 'support-qa-soporte',
          name: 'Support QA',
          description: 'Review of closures, response quality and support workflow improvement.',
          moduleId: 'support',
          moduleName: 'Support'
        }
      ]
    };

    var INITIAL_SELECTED_PROFILE_IDS = [
      'users-supervisor-operacional',
      'documents-editor-documental',
      'support-coordinador-soporte'
    ];

    var ALL_PROFILES = Object.keys(MODULE_PROFILES).reduce(function (list, moduleId) {
      return list.concat(MODULE_PROFILES[moduleId]);
    }, []);

    var INITIAL_SELECTED_PROFILES = ALL_PROFILES.filter(function (item) {
      return INITIAL_SELECTED_PROFILE_IDS.indexOf(item.id) !== -1;
    });

    var selectedProfiles = {};
    var roleProfilesTransfer = null;
    var moduleFilterSelect = null;

    new MTS.Card('#role-edit-panel', {
      title: 'Edit role',
      subtitle: 'Adjust profiles by module',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex--column mts-gap-4">' +
          '<div id="role-edit-alert"></div>' +
          '<section class="mts-surface mts-p-4 mts-d-flex mts-justify-content--between mts-gap-4 mts-flex--wrap">' +
            '<div class="mts-d-flex mts-flex--column mts-gap-2">' +
              '<p class="mts-text--md mts-m-0">Adjust an existing role with the same visual experience used when creating one. Each module keeps a single active profile.</p>' +
              '<p class="mts-text--sm mts-text-color--muted mts-m-0">To replace a profile, remove the current one and move the new one from the available list. If you try to repeat a module, the transfer is blocked and bounces back to the origin.</p>' +
            '</div>' +
            '<div>' +
              '<span id="role-edit-status" class="mts-badge mts-badge--info mts-badge--sm">0 active profiles</span>' +
            '</div>' +
          '</section>' +
          '<div class="mts-grid mts-grid--gap-md">' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="role-edit-name"></div></div>' +
            '<div class="mts-g-col-12"><div id="role-edit-description"></div></div>' +
          '</div>' +
          '<section class="mts-surface mts-p-4 mts-d-flex mts-flex--column mts-gap-4">' +
            '<div class="mts-d-flex mts-align-items--center mts-justify-content--between mts-gap-3 mts-flex--wrap">' +
              '<div>' +
                '<h3 class="mts-h4 mts-m-0">Role profiles</h3>' +
                '<p class="mts-text--sm mts-text-color--muted mts-m-0">Edit view aligned with the `role-create` experience.</p>' +
              '</div>' +
            '</div>' +
            '<div class="mts-grid mts-grid--gap-md mts-grid--center">' +
              '<div class="mts-g-col-12 mts-g-col-md-6">' +
                '<div id="role-edit-module-filter"></div>' +
              '</div>' +
              '<div class="mts-g-col-12 mts-g-col-md-6 mts-d-flex mts-align-items--center mts-justify-content--between">' +
                '<span id="role-edit-filter-count" class="mts-badge mts-badge--neutral mts-badge--sm">0 visible profiles</span>' +
              '</div>' +
            '</div>' +
            '<div id="role-edit-transfer"></div>' +
          '</section>' +
          '<section class="mts-surface mts-p-4">' +
            '<div class="mts-d-flex mts-align-items--center mts-justify-content--between mts-gap-3 mts-flex--wrap">' +
              '<div>' +
                '<h3 class="mts-h4 mts-m-0">Current coverage</h3>' +
                '<p class="mts-text--sm mts-text-color--muted mts-m-0">Role summary after each adjustment to quickly check which modules are still covered.</p>' +
              '</div>' +
              '<span id="role-edit-count" class="mts-badge mts-badge--info mts-badge--sm">0 modules</span>' +
            '</div>' +
            '<div id="role-edit-summary" class="mts-grid mts-grid--gap-md mts-mt-4"></div>' +
          '</section>' +
        '</div>',
      footerAlign: 'between',
      footer: [
        {
          label: 'Back to roles',
          variant: 'ghost',
          icon: MTS.Icon.get('arrow-left'),
          onClick: function () {
            openScreen('../role-list/index.html');
          }
        },
        {
          label: 'Save changes',
          variant: 'primary',
          icon: MTS.Icon.get('save'),
          onClick: function () {
            submitEdit();
          }
        }
      ]
    });

    var nameInput = new MTS.Input('#role-edit-name', {
      type: 'text',
      label: 'Name',
      value: 'Full operator',
      iconLeft: MTS.Icon.get('shield')
    });

    var descriptionInput = new MTS.Input('#role-edit-description', {
      type: 'text',
      label: 'Description',
      value: 'Groups users, documents and support profiles for daily operations.',
      iconLeft: MTS.Icon.get('file-text')
    });

    moduleFilterSelect = new MTS.Select('#role-edit-module-filter', {
      label: 'Filter available by module',
      value: 'all',
      options: [
        { value: 'all', label: 'All modules' },
        { value: 'users', label: 'Users' },
        { value: 'documents', label: 'Documents' },
        { value: 'billing', label: 'Billing' },
        { value: 'support', label: 'Support' }
      ],
      onChange: function () {
        applyProfileFilter();
      }
    });

    roleProfilesTransfer = new MTS.TransferList('#role-edit-transfer', {
      label: 'Role profiles',
      hint: 'The role starts with active profiles. Use the filter to explore the available list and move changes in a controlled way.',
      originTitle: 'Available profiles',
      selectedTitle: 'Active profiles',
      originEmptyText: 'No profiles available for this filter.',
      selectedEmptyText: 'The role has no active profiles left.',
      originDataSource: ALL_PROFILES.filter(function (item) {
        return INITIAL_SELECTED_PROFILE_IDS.indexOf(item.id) === -1;
      }),
      selectedDataSource: INITIAL_SELECTED_PROFILES,
      validateUnique: true,
      validateKey: 'moduleId',
      duplicateMessage: 'An active profile already exists for this module.',
      renderItem: function (item) {
        return '' +
          '<div class="mts-transferlist__item-main">' +
            '<div class="mts-transferlist__item-label">' + escapeHtml(item.name) + '</div>' +
            '<div class="mts-transferlist__item-desc">' + escapeHtml(item.description) + '</div>' +
          '</div>' +
          '<span class="mts-transferlist__item-meta">' + escapeHtml(item.moduleName) + '</span>';
      }
    });

    roleProfilesTransfer.on('change', function (event) {
      var detail = event.detail;
      var item = detail.item;

      syncSelectedProfiles();
      applyProfileFilter();

      if (detail.to === 'selected') {
        showAlert(
          'success',
          'Profile applied',
          'The role now uses <strong>' + escapeHtml(item.name) + '</strong> for the <strong>' + escapeHtml(item.moduleName) + '</strong> module.'
        );
        return;
      }

      showAlert(
        'info',
        'Profile removed',
        'Removed <strong>' + escapeHtml(item.name) + '</strong> from the <strong>' + escapeHtml(item.moduleName) + '</strong> module.'
      );
    });

    roleProfilesTransfer.on('invalid-transfer', function (event) {
      var item = event.detail.item;

      showAlert(
        'warning',
        'Transfer blocked',
        'The role already has an active profile for <strong>' + escapeHtml(item.moduleName) + '</strong>. Remove the current one before moving <strong>' + escapeHtml(item.name) + '</strong>.'
      );
    });

    function syncSelectedProfiles() {
      selectedProfiles = {};

      roleProfilesTransfer.getSelectedItems().forEach(function (item) {
        selectedProfiles[item.moduleId] = item;
      });

      renderSelectedProfilesSummary();
    }

    function applyProfileFilter() {
      var selectedItems = roleProfilesTransfer.getSelectedItems();
      var selectedIds = selectedItems.reduce(function (map, item) {
        map[item.id] = true;
        return map;
      }, {});
      var moduleFilterValue = moduleFilterSelect ? moduleFilterSelect.getValue() : 'all';
      var filteredOriginProfiles = ALL_PROFILES.filter(function (item) {
        if (selectedIds[item.id]) return false;
        if (!moduleFilterValue || moduleFilterValue === 'all') return true;
        return item.moduleId === moduleFilterValue;
      });

      roleProfilesTransfer.setItems({
        originDataSource: filteredOriginProfiles,
        selectedDataSource: selectedItems
      });

      document.getElementById('role-edit-filter-count').textContent =
        filteredOriginProfiles.length + (filteredOriginProfiles.length === 1 ? ' visible profile' : ' visible profiles');
    }

    function renderSelectedProfilesSummary() {
      var items = Object.keys(selectedProfiles)
        .map(function (moduleId) { return selectedProfiles[moduleId]; })
        .sort(function (a, b) { return a.moduleName.localeCompare(b.moduleName); });

      document.getElementById('role-edit-count').textContent = items.length + (items.length === 1 ? ' module' : ' modules');
      document.getElementById('role-edit-status').textContent = items.length
        ? items.length + (items.length === 1 ? ' active profile' : ' active profiles')
        : 'No active profiles';

      if (!items.length) {
        document.getElementById('role-edit-summary').innerHTML =
          '<div class="mts-g-col-12">' +
            '<div class="mts-surface mts-p-4 mts-d-flex mts-flex--column mts-gap-2 mts-align-items--center mts-justify-content--center mts-text--center">' +
            '<strong>The role is empty.</strong>' +
            '<span>Move profiles back from the left list to restore coverage by module.</span>' +
            '</div>' +
          '</div>';
        return;
      }

      document.getElementById('role-edit-summary').innerHTML = items.map(function (item) {
        return '' +
          '<article class="mts-surface mts-p-4 mts-d-flex mts-flex--column mts-gap-2 mts-g-col-12 mts-g-col-md-6 mts-g-col-xl-3">' +
            '<span class="mts-text--xs mts-fw--semibold mts-text-color--accent">' + escapeHtml(item.moduleName) + '</span>' +
            '<h4 class="mts-h4 mts-m-0">' + escapeHtml(item.name) + '</h4>' +
            '<p class="mts-text--sm mts-text-color--muted mts-m-0">' + escapeHtml(item.description) + '</p>' +
          '</article>';
      }).join('');
    }

    function clearAlerts() {
      document.getElementById('role-edit-alert').innerHTML = '';
    }

    function showAlert(variant, title, message) {
      clearAlerts();
      MTS.Alert.show('#role-edit-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function clearFieldErrors() {
      nameInput.clearError();
      descriptionInput.clearError();
    }

    function submitEdit() {
      var name = nameInput.getValue().trim();
      var description = descriptionInput.getValue().trim();
      var modules = Object.keys(selectedProfiles);

      clearFieldErrors();
      clearAlerts();

      if (!name) {
        nameInput.setError('Enter the role name');
        return;
      }

      if (!description) {
        descriptionInput.setError('Enter the role description');
        return;
      }

      if (!modules.length) {
        showAlert('warning', 'Missing profiles', 'The role must keep at least one associated profile.');
        return;
      }

      showAlert(
        'success',
        'Role updated',
        'Changes would be saved for <strong>' + escapeHtml(name) + '</strong> with <strong>' + modules.length + '</strong> active modules.'
      );
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    syncSelectedProfiles();
    applyProfileFilter();
    MTS.Icon.initAll();
  </script>
</body>
</html>
