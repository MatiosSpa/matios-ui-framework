<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editar rol - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../../data/matios-ui-table/matios-ui-table.css">
  <link rel="stylesheet" href="role-edit.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../../forms/matios-ui-select/matios-ui-select.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="role-edit-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    var MODULE_PROFILES = {
      users: [
        { value: 'workspace-base', label: 'Workspace base' },
        { value: 'supervisor-operacional', label: 'Supervisor operacional' },
        { value: 'auditor-usuarios', label: 'Auditor de usuarios' }
      ],
      documents: [
        { value: 'lector-documental', label: 'Lector documental' },
        { value: 'editor-documental', label: 'Editor documental' },
        { value: 'aprobador-documental', label: 'Aprobador documental' }
      ],
      billing: [
        { value: 'consulta-financiera', label: 'Consulta financiera' },
        { value: 'administrador-cobros', label: 'Administrador de cobros' },
        { value: 'auditor-billing', label: 'Auditor billing' }
      ],
      support: [
        { value: 'agente-mesa', label: 'Agente de mesa' },
        { value: 'coordinador-soporte', label: 'Coordinador de soporte' },
        { value: 'qa-soporte', label: 'QA soporte' }
      ]
    };

    var selectedProfiles = {
      users: 'supervisor-operacional',
      documents: 'editor-documental',
      support: 'coordinador-soporte'
    };

    new MTS.Card('#role-edit-panel', {
      title: 'Editar rol',
      subtitle: 'Ajuste de perfiles por modulo',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex-col mts-gap-4">' +
          '<div id="role-edit-alert"></div>' +
          '<p class="mts-text-md mts-text-muted mts-m-0">El mismo modulo no puede tener mas de un perfil dentro del rol. Si agregas otro, reemplaza al actual.</p>' +
          '<div class="mts-grid mts-grid--gap-md">' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="role-edit-name"></div></div>' +
            '<div class="mts-g-col-12"><div id="role-edit-description"></div></div>' +
          '</div>' +
          '<div class="mts-surface mts-p-4">' +
            '<div class="mts-d-flex mts-flex-col mts-gap-3">' +
              '<h3 class="mts-h4 mts-m-0">Reemplazar perfil por modulo</h3>' +
              '<div class="mts-grid mts-grid--gap-md">' +
                '<div class="mts-g-col-12 mts-g-col-md-5"><div id="role-edit-module"></div></div>' +
                '<div class="mts-g-col-12 mts-g-col-md-5"><div id="role-edit-profile"></div></div>' +
                '<div class="mts-g-col-12 mts-g-col-md-2 mts-d-flex mts-items-end"><button id="role-edit-add" type="button"></button></div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="mts-surface mts-p-4">' +
            '<div class="mts-d-flex mts-flex-col mts-gap-3">' +
              '<div class="mts-d-flex mts-items-center mts-justify-between mts-gap-3">' +
                '<h3 class="mts-h4 mts-m-0">Perfiles seleccionados</h3>' +
                '<span id="role-edit-count" class="mts-badge mts-badge--info mts-badge--sm">0 modulos</span>' +
              '</div>' +
              '<div id="role-edit-selected"></div>' +
            '</div>' +
          '</div>' +
        '</div>',
      footerAlign: 'between',
      footer: [
        {
          label: 'Volver a roles',
          variant: 'ghost',
          icon: MTS.Icon.get('arrow-left'),
          onClick: function () {
            openScreen('../role-list/index.html');
          }
        },
        {
          label: 'Guardar cambios',
          variant: 'primary',
          icon: MTS.Icon.get('save'),
          onClick: function () {
            submitEdit();
          }
        }
      ]
    });

    var nameInput = new MTS.Input('#role-edit-name', {
      type: 'text',
      label: 'Nombre',
      value: 'Operador integral',
      iconLeft: MTS.Icon.get('shield')
    });

    var descriptionInput = new MTS.Input('#role-edit-description', {
      type: 'text',
      label: 'Descripcion',
      value: 'Agrupa perfiles de usuarios, documentos y soporte para operacion diaria.',
      iconLeft: MTS.Icon.get('file-text')
    });

    var moduleSelect = new MTS.Select('#role-edit-module', {
      label: 'Modulo',
      value: 'documents',
      options: [
        { value: 'users', label: 'Usuarios' },
        { value: 'documents', label: 'Documentos' },
        { value: 'billing', label: 'Billing' },
        { value: 'support', label: 'Soporte' }
      ],
      onChange: function (event) {
        syncProfileOptions(event.detail.value);
      }
    });

    var profileSelect = new MTS.Select('#role-edit-profile', {
      label: 'Perfil',
      placeholder: 'Selecciona un perfil',
      hint: 'Se listan solo perfiles del modulo seleccionado.',
      options: []
    });

    new MTS.Button('#role-edit-add', {
      label: 'Aplicar',
      variant: 'secondary',
      icon: MTS.Icon.get('save'),
      onClick: function () {
        addSelectedProfile();
      }
    });

    document.getElementById('role-edit-selected').addEventListener('click', function (event) {
      var actionButton = event.target.closest('[data-role-selected-module]');
      if (!actionButton) return;

      var moduleValue = actionButton.getAttribute('data-role-selected-module');
      delete selectedProfiles[moduleValue];
      renderSelectedProfiles();
      showAlert('info', 'Perfil quitado', 'Se quito el perfil del modulo <strong>' + escapeHtml(getModuleLabel(moduleValue)) + '</strong>.');
    });

    function syncProfileOptions(moduleValue) {
      var options = MODULE_PROFILES[moduleValue] || [];
      profileSelect.setOptions(options, !!moduleValue);
      if (selectedProfiles[moduleValue]) profileSelect.setValue(selectedProfiles[moduleValue]);
      else profileSelect.clear();
    }

    function addSelectedProfile() {
      var moduleValue = moduleSelect.getValue();
      var profileValue = profileSelect.getValue();

      clearAlerts();

      if (!moduleValue) {
        showAlert('warning', 'Falta el modulo', 'Selecciona un modulo antes de asignar un perfil al rol.');
        return;
      }

      if (!profileValue) {
        showAlert('warning', 'Falta el perfil', 'Selecciona el perfil que quieres dejar activo en ese modulo.');
        return;
      }

      var replacing = !!selectedProfiles[moduleValue];
      selectedProfiles[moduleValue] = profileValue;
      renderSelectedProfiles();

      showAlert(
        replacing ? 'info' : 'success',
        replacing ? 'Perfil reemplazado' : 'Perfil agregado',
        'El rol ahora usa <strong>' + escapeHtml(getProfileLabel(moduleValue, profileValue)) + '</strong> para el modulo <strong>' + escapeHtml(getModuleLabel(moduleValue)) + '</strong>.'
      );
    }

    function renderSelectedProfiles() {
      var modules = Object.keys(selectedProfiles);
      document.getElementById('role-edit-count').textContent = modules.length + (modules.length === 1 ? ' modulo' : ' modulos');

      if (!modules.length) {
        document.getElementById('role-edit-selected').innerHTML = '<p class="mts-text-sm mts-text-muted mts-m-0">Aun no hay perfiles seleccionados para este rol.</p>';
        return;
      }

      document.getElementById('role-edit-selected').innerHTML =
        '<div class="mts-table-wrap">' +
          '<table class="mts-table mts-table--striped">' +
            '<thead>' +
              '<tr>' +
                '<th class="mts-table__th">Modulo</th>' +
                '<th class="mts-table__th">Perfil</th>' +
                '<th class="mts-table__th mts-table__th--actions">Acciones</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody>' +
              modules.map(function (moduleValue) {
                return '' +
                  '<tr class="mts-table__row">' +
                    '<td class="mts-table__td">' + escapeHtml(getModuleLabel(moduleValue)) + '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(getProfileLabel(moduleValue, selectedProfiles[moduleValue])) + '</td>' +
                    '<td class="mts-table__td mts-table__td--actions">' +
                      '<button class="mts-btn mts-btn--ghost mts-btn--sm" data-role-selected-module="' + escapeHtml(moduleValue) + '">' + MTS.Icon.get('trash') + ' Quitar</button>' +
                    '</td>' +
                  '</tr>';
              }).join('') +
            '</tbody>' +
          '</table>' +
        '</div>';

      MTS.Icon.initAll();
    }

    function clearAlerts() {
      document.getElementById('role-edit-alert').innerHTML = '';
    }

    function showAlert(variant, title, message) {
      clearAlerts();
      MTS.Alert.show('#role-edit-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function clearFieldErrors() {
      nameInput.clearError();
      descriptionInput.clearError();
    }

    function submitEdit() {
      var name = nameInput.getValue().trim();
      var description = descriptionInput.getValue().trim();
      var modules = Object.keys(selectedProfiles);

      clearFieldErrors();
      clearAlerts();

      if (!name) {
        nameInput.setError('Ingresa el nombre del rol');
        return;
      }

      if (!description) {
        descriptionInput.setError('Ingresa la descripcion del rol');
        return;
      }

      if (!modules.length) {
        showAlert('warning', 'Faltan perfiles', 'El rol debe conservar al menos un perfil asociado.');
        return;
      }

      showAlert(
        'success',
        'Rol actualizado',
        'Se guardarian cambios sobre <strong>' + escapeHtml(name) + '</strong> con <strong>' + modules.length + '</strong> modulos activos.'
      );
    }

    function getModuleLabel(value) {
      var options = moduleSelect.options || [];
      for (var i = 0; i < options.length; i++) {
        if (options[i].value === value) return options[i].label;
      }
      return value || '-';
    }

    function getProfileLabel(moduleValue, profileValue) {
      var options = MODULE_PROFILES[moduleValue] || [];
      for (var i = 0; i < options.length; i++) {
        if (options[i].value === profileValue) return options[i].label;
      }
      return profileValue || '-';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    syncProfileOptions('documents');
    renderSelectedProfiles();
    MTS.Icon.initAll();
  </script>
</body>
</html>
