<!DOCTYPE html>
<html lang="es" data-mts-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Configuración — Matios UI</title>
  <script>(function(){var m=(location.hash||"").match(/mts-theme=([a-z-]+)/);if(m)document.documentElement.setAttribute("data-mts-theme",m[1]);try{var p=window.parent;if(p&&p!==window){var pt=p.currentThemeVal||p.document.documentElement.getAttribute("data-mts-theme");if(pt)document.documentElement.setAttribute("data-mts-theme",pt);}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-high-contrast.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../../forms/matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../forms/matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-alert/matios-ui-alert.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../forms/matios-ui-select/matios-ui-select.js"></script>
  <script src="../../forms/matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
<style>
*{box-sizing:border-box}
body{background:var(--mts-bg-body);color:var(--mts-text-primary);font-family:var(--mts-font-family);margin:0;min-height:100vh;}
.app-topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;background:var(--mts-bg-surface);border-bottom:1px solid var(--mts-border-color);position:sticky;top:0;z-index:100;}
.app-topbar-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mts-text-muted);cursor:pointer;padding:4px 8px;border-radius:var(--mts-radius-md);border:none;background:none;transition:color .15s,background .15s;font-family:var(--mts-font-family);}
.app-topbar-back:hover{color:var(--mts-text-primary);background:var(--mts-bg-surface-2);}
.app-topbar-title{font-size:14px;font-weight:700;color:var(--mts-text-primary);flex:1;}
.app-topbar-badge{font-size:10px;padding:2px 8px;border-radius:var(--mts-radius-full);background:var(--mts-color-primary-light);color:var(--mts-color-primary);font-weight:700;}
.app-content{padding:24px;max-width:1100px;margin:0 auto;}
.app-card{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:24px;}
.app-section{display:flex;flex-direction:column;gap:20px;}
.app-grid{display:grid;gap:16px;}
.app-grid-2{grid-template-columns:1fr 1fr;}
.app-grid-3{grid-template-columns:1fr 1fr 1fr;}
.app-grid-4{grid-template-columns:repeat(4,1fr);}
.app-h2{font-size:18px;font-weight:800;margin:0 0 4px;}
.app-h2 span{color:var(--mts-color-primary);}
.app-sub{font-size:13px;color:var(--mts-text-muted);margin:0 0 20px;}
.app-divider{border:none;border-top:1px solid var(--mts-border-color);margin:20px 0;}
.app-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mts-text-muted);margin-bottom:6px;}
.app-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.app-theme{position:fixed;bottom:16px;right:16px;display:flex;gap:4px;z-index:999;}
.app-theme-btn{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:var(--mts-bg-surface);color:var(--mts-text-secondary);}
.app-theme-btn:hover{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.app-grid-2,.app-grid-3,.app-grid-4{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app-topbar"><button class="app-topbar-back" onclick="goBack()">&#8592; Volver</button><span class="app-topbar-title">Configuración de Cuenta</span><span class="app-topbar-badge">Settings</span></div>
<style>
.cfg-content{padding:24px;max-width:800px;margin:0 auto;}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--mts-border-color);}
.cfg-row:last-child{border-bottom:none;}
.cfg-row-info h4{margin:0 0 2px;font-size:14px;font-weight:600;}
.cfg-row-info p{margin:0;font-size:12px;color:var(--mts-text-muted);}
.cfg-danger-zone{border:1px solid var(--mts-color-danger,#f87171);border-radius:var(--mts-radius-lg);padding:20px;}
</style>
<div class="cfg-content">
  <div style="margin-bottom:24px;">
    <h2 class="app-h2">Configuración <span>de Cuenta</span></h2>
    <p class="app-sub">Administra las preferencias y configuración de tu cuenta</p>
  </div>
  <div id="cfg-alert" style="margin-bottom:16px;"></div>
  <div id="cfg-tabs"></div>
</div><div class="app-theme">
  <button class="app-theme-btn" onclick="setTheme('dark')">Dark</button>
  <button class="app-theme-btn" onclick="setTheme('light')">Light</button>
  <button class="app-theme-btn" onclick="setTheme('violet')">Violet</button>
  <button class="app-theme-btn" onclick="setTheme('blue')">Blue</button>
</div>
<script>
function setTheme(t){document.documentElement.setAttribute('data-mts-theme',t);try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'setTheme',theme:t},'*');}catch(e){}}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='setTheme')document.documentElement.setAttribute('data-mts-theme',e.data.theme);});
function goBack(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'closeApp'},'*');return;}}catch(e){}window.history.back();}
</script>
<script>

new MTS.Tabs('#cfg-tabs',{
  variant:'bordered',
  tabs:[
    {id:'general',  label:'General',     icon:MTS.Icon.get('settings'),  content:buildGeneral()},
    {id:'plan',     label:'Plan',        icon:MTS.Icon.get('credit-card'),content:buildPlan()},
    {id:'seguridad',label:'Seguridad',   icon:MTS.Icon.get('shield'),    content:buildSeguridad()},
    {id:'peligro',  label:'Zona peligro',icon:MTS.Icon.get('alert'),     content:buildDanger()},
  ],
});

function buildGeneral(){
  var d=document.createElement('div');
  d.innerHTML='<div style="display:flex;flex-direction:column;gap:16px;padding:4px 0;">'
    +'<div id="cfg-ws-name"></div>'
    +'<div id="cfg-idioma"></div>'
    +'<div id="cfg-zona"></div>'
    +'<div style="display:flex;flex-direction:column;gap:10px;padding:8px 0;">'
    +'<div id="cfg-t1"></div><div id="cfg-t2"></div><div id="cfg-t3"></div>'
    +'</div>'
    +'<div style="display:flex;justify-content:flex-end;"><div id="cfg-save"></div></div>'
    +'</div>';
  setTimeout(function(){
    new MTS.Input('#cfg-ws-name',{label:'Nombre del workspace',value:'Matios Corp',name:'workspace'});
    new MTS.Select('#cfg-idioma',{label:'Idioma',options:[{value:'es',label:'Español'},{value:'en',label:'English'},{value:'pt',label:'Português'}],value:'es'});
    new MTS.Select('#cfg-zona',{label:'Zona horaria',options:[{value:'cl',label:'Chile (UTC-3)'},{value:'ar',label:'Argentina (UTC-3)'},{value:'mx',label:'México (UTC-6)'}],value:'cl'});
    new MTS.Toggle('#cfg-t1',{label:'Modo mantenimiento',checked:false});
    new MTS.Toggle('#cfg-t2',{label:'Registro público de usuarios',checked:true});
    new MTS.Toggle('#cfg-t3',{label:'Logs de auditoría',checked:true});
    new MTS.Button('#cfg-save',{label:'Guardar configuración',variant:'primary',onClick:function(e,inst){
      inst.setLoading(true);
      setTimeout(function(){inst.setLoading(false);MTS.Alert.show('#cfg-alert',{variant:'success',title:'Guardado',message:'Configuración actualizada.',autoDismiss:3000});},900);
    }});
  },50);
  return d;
}

function buildPlan(){
  var d=document.createElement('div');
  d.innerHTML='<div style="padding:4px 0;display:flex;flex-direction:column;gap:16px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--mts-color-primary-light);border:1px solid var(--mts-color-primary);border-radius:var(--mts-radius-lg);">'
    +'<div><div style="font-size:16px;font-weight:800;color:var(--mts-color-primary);">Plan Pro</div>'
    +'<div style="font-size:12px;color:var(--mts-text-muted);margin-top:2px;">$29/mes · Facturación anual · Próximo cobro: 1 May 2026</div></div>'
    +'<span class="mts-badge mts-badge--primary">Activo</span></div>'
    +'<div><div class="app-label" style="margin-bottom:12px;">Uso del plan</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px;">'
    +'<div style="display:flex;justify-content:space-between;font-size:13px;"><span>Usuarios</span><span style="color:var(--mts-text-muted);">8 / 25</span></div>'
    +'<div style="height:6px;background:var(--mts-border-color);border-radius:3px;"><div style="width:32%;height:100%;background:var(--mts-color-primary);border-radius:3px;"></div></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:13px;"><span>Almacenamiento</span><span style="color:var(--mts-text-muted);">4.2 GB / 50 GB</span></div>'
    +'<div style="height:6px;background:var(--mts-border-color);border-radius:3px;"><div style="width:8%;height:100%;background:var(--mts-color-success,#22c55e);border-radius:3px;"></div></div>'
    +'</div></div>'
    +'<div id="cfg-plan-btn"></div></div>';
  setTimeout(function(){
    new MTS.Button('#cfg-plan-btn',{label:'Actualizar a Enterprise',variant:'secondary',iconLeft:MTS.Icon.get('arrow-up'),onClick:function(){alert('Demo: upgrade');}});
  },50);
  return d;
}

function buildSeguridad(){
  var d=document.createElement('div');
  d.innerHTML='<div style="padding:4px 0;display:flex;flex-direction:column;gap:0;">'
    +'<div class="cfg-row"><div class="cfg-row-info"><h4>Autenticación de dos factores</h4><p>Añade una capa extra de seguridad</p></div><div id="cfg-2fa"></div></div>'
    +'<div class="cfg-row"><div class="cfg-row-info"><h4>Sesiones activas</h4><p>3 dispositivos conectados</p></div><div id="cfg-sesiones-btn"></div></div>'
    +'<div class="cfg-row"><div class="cfg-row-info"><h4>IP whitelist</h4><p>Restringe acceso por IP</p></div><div id="cfg-ip"></div></div>'
    +'<div class="cfg-row"><div class="cfg-row-info"><h4>Expiración de sesión</h4><p>Cerrar sesión automáticamente</p></div><div id="cfg-exp-sel" style="width:180px;"></div></div>'
    +'</div>';
  setTimeout(function(){
    new MTS.Toggle('#cfg-2fa',{checked:true});
    new MTS.Button('#cfg-sesiones-btn',{label:'Ver sesiones',variant:'ghost',size:'sm',onClick:function(){alert('Demo: 3 sesiones activas');}});
    new MTS.Toggle('#cfg-ip',{checked:false});
    new MTS.Select('#cfg-exp-sel',{options:[{value:'1h',label:'1 hora'},{value:'8h',label:'8 horas'},{value:'24h',label:'24 horas'},{value:'never',label:'Nunca'}],value:'8h'});
  },50);
  return d;
}

function buildDanger(){
  var d=document.createElement('div');
  d.innerHTML='<div style="padding:4px 0;display:flex;flex-direction:column;gap:16px;">'
    +'<div class="cfg-danger-zone">'
    +'<h4 style="margin:0 0 4px;color:var(--mts-color-danger);">⚠️ Zona de peligro</h4>'
    +'<p style="margin:0 0 16px;font-size:13px;color:var(--mts-text-muted);">Las siguientes acciones son irreversibles. Procede con precaución.</p>'
    +'<div style="display:flex;flex-direction:column;gap:12px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">'
    +'<div><div style="font-size:13px;font-weight:600;">Exportar todos los datos</div><div style="font-size:12px;color:var(--mts-text-muted);">Descarga todos tus datos en formato JSON</div></div>'
    +'<div id="cfg-export-btn"></div></div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">'
    +'<div><div style="font-size:13px;font-weight:600;">Eliminar cuenta</div><div style="font-size:12px;color:var(--mts-text-muted);">Elimina permanentemente tu cuenta y todos sus datos</div></div>'
    +'<div id="cfg-delete-btn"></div></div>'
    +'</div></div></div>';
  setTimeout(function(){
    new MTS.Button('#cfg-export-btn',{label:'Exportar datos',variant:'ghost',size:'sm',iconLeft:MTS.Icon.get('download'),onClick:function(){alert('Demo: exportando datos...');}});
    new MTS.Button('#cfg-delete-btn',{label:'Eliminar cuenta',variant:'danger',size:'sm',iconLeft:MTS.Icon.get('trash'),onClick:function(){
      MTS.Modal.confirm({title:'¿Eliminar cuenta?',message:'Esta acción es permanente e irreversible. Todos tus datos serán eliminados.',variant:'danger',onConfirm:function(){alert('Demo: cuenta eliminada');}});
    }});
  },50);
  return d;
}

</script>
</body>
</html>
