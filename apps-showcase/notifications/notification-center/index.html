<body>
  <div class="notification-center-page">
    <header class="notification-center-page__topbar mts-surface">
      <div class="notification-center-page__brand">
        <div class="notification-center-page__logo">N</div>
        <div>
          <div class="notification-center-page__title">Notification Center</div>
          <div class="notification-center-page__subtitle">Operational alerts, mentions and recent product events</div>
        </div>
      </div>
      <div class="notification-center-page__topbar-actions">
        <div id="notification-mark-all"></div>
      </div>
    </header>

    <main class="notification-center-page__main mts-grid mts-grid--gap-md">
      <section class="notification-center-page__hero mts-surface mts-g-col-12">
        <div class="notification-center-page__eyebrow">Alerts center</div>
        <h1 class="notification-center-page__hero-title">Keep what matters visible without wasting time on scattered inboxes.</h1>
        <p class="notification-center-page__hero-text">
          This view brings together product notifications, pending actions and relevant alerts so the end user can clear, prioritize and act fast.
        </p>
      </section>

      <section class="mts-g-col-12 mts-g-col-xl-8">
        <div class="mts-form-card notification-center-page__list-card">
          <div id="notification-feedback"></div>
          <div class="notification-center-page__toolbar mts-grid mts-grid--gap-md">
            <div class="mts-g-col-12 mts-g-col-lg-8"><div id="notification-search"></div></div>
            <div class="mts-g-col-12 mts-g-col-lg-4 notification-center-page__toolbar-actions">
              <div id="notification-filter-unread"></div>
              <div id="notification-filter-critical"></div>
            </div>
          </div>
          <div class="notification-center-page__items" id="notification-items"></div>
        </div>
      </section>

      <aside class="mts-g-col-12 mts-g-col-xl-4 notification-center-page__sidebar">
        <div id="notification-summary-card"></div>
        <div id="notification-rules-card"></div>
      </aside>
    </main>
  </div>

  <script>
    window.addEventListener('message',function(e){
      if(!e.data) return;
      if(e.data.type==='setMode') document.documentElement.setAttribute('data-mts-mode',e.data.mode);
      if(e.data.type==='setAccent'){
        if(e.data.accent) document.documentElement.setAttribute('data-mts-accent',e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });
  </script>
  <script>
    var NOTIFICATIONS = [
      { id:'nt-1', title:'Permissions adjusted in Invoice', body:'The effective profile of the Invoice module was updated for the Matios Studio workspace.', tag:'Security', variant:'danger', unread:true },
      { id:'nt-2', title:'Mention in ticket HD-201', body:'Paula requested a final validation before closing the case with the client.', tag:'Support', variant:'warning', unread:true },
      { id:'nt-3', title:'New focus block in planner', body:'Time was reserved on the agenda to review the child company creation and workspace selector.', tag:'Planner', variant:'info', unread:false },
      { id:'nt-4', title:'Signup With Company updated', body:'The flow is now aligned with theme, language and onboarding structure.', tag:'Onboarding', variant:'success', unread:false }
    ];
    var filters = { query:'', unread:false, critical:false };

    new MTS.Button('#notification-mark-all',{
      label:'Mark all as read',
      variant:'secondary',
      iconLeft:MTS.Icon.get('check'),
      onClick:function(){
        NOTIFICATIONS.forEach(function(item){ item.unread=false; });
        renderNotifications();
        MTS.Alert.show('#notification-feedback',{
          variant:'success',
          title:'Inbox updated',
          message:'All the example notifications were marked as read.',
          closable:true
        });
      }
    });

    var searchInput = new MTS.Input('#notification-search',{
      label:'Search notification',
      type:'text',
      placeholder:'Title, tag or content',
      iconLeft:MTS.Icon.get('search')
    });

    new MTS.Button('#notification-filter-unread',{
      label:'Unread only',
      variant:'secondary',
      iconLeft:MTS.Icon.get('mail'),
      onClick:function(){
        filters.unread = !filters.unread;
        renderNotifications();
      }
    });

    new MTS.Button('#notification-filter-critical',{
      label:'Critical only',
      variant:'secondary',
      iconLeft:MTS.Icon.get('alert-triangle'),
      onClick:function(){
        filters.critical = !filters.critical;
        renderNotifications();
      }
    });

    new MTS.Card('#notification-summary-card',{
      title:'Alerts summary',
      subtitle:'Inbox status',
      variant:'elevated',
      size:'lg',
      body:
        '<div class="notification-center-page__meta-list">'+
          '<div><span>Unread</span><strong>2</strong></div>'+
          '<div><span>Critical</span><strong>1</strong></div>'+
          '<div><span>Last cleanup</span><strong>Today · 09:28</strong></div>'+
        '</div>'
    });

    new MTS.Card('#notification-rules-card',{
      title:'Visible rules',
      subtitle:'Expected behavior',
      variant:'outlined',
      size:'lg',
      body:
        '<div class="notification-center-page__rules">'+
          '<div><i class="mts-icon mts-icon-bell"></i><span>Every important alert must have a clear exit.</span></div>'+
          '<div><i class="mts-icon mts-icon-check-circle"></i><span>Clearing the inbox must not break the user context.</span></div>'+
          '<div><i class="mts-icon mts-icon-activity"></i><span>Critical events must stay visible even when the rest is archived.</span></div>'+
        '</div>'
    });

    function getVisibleNotifications() {
      return NOTIFICATIONS.filter(function(item){
        var haystack = (item.title + ' ' + item.body + ' ' + item.tag).toLowerCase();
        var queryOk = !filters.query || haystack.indexOf(filters.query) !== -1;
        var unreadOk = !filters.unread || item.unread;
        var criticalOk = !filters.critical || item.variant === 'danger';
        return queryOk && unreadOk && criticalOk;
      });
    }

    function renderNotifications() {
      var host = document.getElementById('notification-items');
      host.innerHTML = '';
      var visible = getVisibleNotifications();

      if (!visible.length) {
        MTS.Alert.show('#notification-items',{
          variant:'warning',
          title:'No results',
          message:'The current filter combination left the inbox empty.',
          closable:false
        });
        return;
      }

      visible.forEach(function(item){
        var cardHost = document.createElement('div');
        cardHost.className = 'notification-center-page__item';
        host.appendChild(cardHost);

        var footerActions = [];
        footerActions.push({
          label: item.unread ? 'Mark as read' : 'Reopen',
          variant: 'secondary',
          onClick: function(){
            item.unread = !item.unread;
            renderNotifications();
          }
        });
        footerActions.push({
          label:'Archive',
          variant:'ghost',
          onClick:function(){
            item.unread = false;
            MTS.Alert.show('#notification-feedback',{
              variant:'info',
              title:'Notification archived',
              message:'The alert moved out of the main focus, but keeps its trace in the example.',
              closable:true
            });
            renderNotifications();
          }
        });

        new MTS.Card(cardHost,{
          title:item.title,
          subtitle:item.unread ? 'Unread' : 'Read',
          variant:item.unread ? 'elevated' : 'outlined',
          size:'lg',
          body:
            '<div class="notification-center-page__item-body">'+
              '<p>'+item.body+'</p>'+
              '<div class="notification-center-page__item-meta">'+
                '<span class="notification-center-page__tag" id="badge-'+item.id+'"></span>'+
                (item.unread ? '<span class="notification-center-page__unread-dot"></span>' : '') +
              '</div>'+
            '</div>',
          footerAlign:'between',
          footer:footerActions
        });

        new MTS.Badge('#badge-'+item.id,{
          label:item.tag,
          variant:item.variant,
          size:'sm'
        });
      });

      MTS.Icon.initAll();
    }

    var nativeSearch;
    setTimeout(function(){
      nativeSearch = document.querySelector('#notification-search input');
      if(nativeSearch){
        nativeSearch.addEventListener('input',function(e){
          filters.query = (e.target.value || '').toLowerCase();
          renderNotifications();
        });
      }
    },0);

    renderNotifications();
    MTS.Icon.initAll();
  </script>
</body>
</html>
