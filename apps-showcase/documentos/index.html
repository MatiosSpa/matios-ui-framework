<!DOCTYPE html>
<html lang="es" data-mts-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Documentos — Matios UI</title>
  <script>(function(){var m=(location.hash||"").match(/mts-theme=([a-z-]+)/);if(m)document.documentElement.setAttribute("data-mts-theme",m[1]);try{var p=window.parent;if(p&&p!==window){var pt=p.currentThemeVal||p.document.documentElement.getAttribute("data-mts-theme");if(pt)document.documentElement.setAttribute("data-mts-theme",pt);}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-high-contrast.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <link rel="stylesheet" href="../../forms/matios-ui-fileupload/matios-ui-fileupload.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-modal/matios-ui-modal.css">
  <link rel="stylesheet" href="../../display/matios-ui-emptystate/matios-ui-emptystate.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-dropdown/matios-ui-dropdown.css">
  <script src="../../forms/matios-ui-fileupload/matios-ui-fileupload.js"></script>
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../overlays/matios-ui-modal/matios-ui-modal.js"></script>
  <script src="../../display/matios-ui-emptystate/matios-ui-emptystate.js"></script>
  <script src="../../navigation/matios-ui-dropdown/matios-ui-dropdown.js"></script>
<style>
*{box-sizing:border-box}
body{background:var(--mts-bg-body);color:var(--mts-text-primary);font-family:var(--mts-font-family);margin:0;min-height:100vh;}
.app-topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;background:var(--mts-bg-surface);border-bottom:1px solid var(--mts-border-color);position:sticky;top:0;z-index:100;}
.app-topbar-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mts-text-muted);cursor:pointer;padding:4px 8px;border-radius:var(--mts-radius-md);border:none;background:none;transition:color .15s,background .15s;font-family:var(--mts-font-family);}
.app-topbar-back:hover{color:var(--mts-text-primary);background:var(--mts-bg-surface-2);}
.app-topbar-title{font-size:14px;font-weight:700;color:var(--mts-text-primary);flex:1;}
.app-topbar-badge{font-size:10px;padding:2px 8px;border-radius:var(--mts-radius-full);background:var(--mts-color-primary-light);color:var(--mts-color-primary);font-weight:700;}
.app-content{padding:24px;max-width:1100px;margin:0 auto;}
.app-card{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:24px;}
.app-section{display:flex;flex-direction:column;gap:20px;}
.app-grid{display:grid;gap:16px;}
.app-grid-2{grid-template-columns:1fr 1fr;}
.app-grid-3{grid-template-columns:1fr 1fr 1fr;}
.app-grid-4{grid-template-columns:repeat(4,1fr);}
.app-h2{font-size:18px;font-weight:800;margin:0 0 4px;}
.app-h2 span{color:var(--mts-color-primary);}
.app-sub{font-size:13px;color:var(--mts-text-muted);margin:0 0 20px;}
.app-divider{border:none;border-top:1px solid var(--mts-border-color);margin:20px 0;}
.app-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mts-text-muted);margin-bottom:6px;}
.app-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.app-theme{position:fixed;bottom:16px;right:16px;display:flex;gap:4px;z-index:999;}
.app-theme-btn{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:var(--mts-bg-surface);color:var(--mts-text-secondary);}
.app-theme-btn:hover{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.app-grid-2,.app-grid-3,.app-grid-4{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app-topbar"><button class="app-topbar-back" onclick="goBack()">&#8592; Volver</button><span class="app-topbar-title">Biblioteca de Documentos</span><span class="app-topbar-badge">Archivos</span></div>
<style>
.doc-content{padding:20px 24px;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
.doc-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.doc-card{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:10px;}
.doc-card:hover{box-shadow:var(--mts-shadow-md);border-color:var(--mts-color-primary);}
.doc-icon{font-size:32px;text-align:center;}
.doc-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-meta{font-size:11px;color:var(--mts-text-muted);}
.doc-table{width:100%;border-collapse:collapse;font-size:13px;}
.doc-table th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mts-text-muted);background:var(--mts-bg-surface-2);border-bottom:1px solid var(--mts-border-color);}
.doc-table td{padding:10px 12px;border-bottom:1px solid var(--mts-border-color);vertical-align:middle;}
.doc-table tr:hover td{background:var(--mts-bg-surface);}
.view-btn.active{background:var(--mts-color-primary);color:#fff;border-color:var(--mts-color-primary);}
</style>
<div class="doc-content">
  <div class="doc-toolbar">
    <span style="font-size:15px;font-weight:800;">Mis Documentos</span>
    <span class="mts-badge mts-badge--default" id="doc-count">8 archivos</span>
    <span style="flex:1;"></span>
    <div id="doc-search-wrap" style="width:200px;"></div>
    <button class="mts-btn mts-btn--ghost mts-btn--sm view-btn active" id="btn-view-grid" onclick="setView('grid')">⊞ Grid</button>
    <button class="mts-btn mts-btn--ghost mts-btn--sm view-btn" id="btn-view-list" onclick="setView('list')">☰ Lista</button>
    <div id="doc-upload-btn"></div>
  </div>
  <div id="doc-upload-area" style="display:none;"></div>
  <div id="doc-grid" class="doc-grid"></div>
  <table class="doc-table" id="doc-table" style="display:none;">
    <thead><tr><th>Nombre</th><th>Tipo</th><th>Tamaño</th><th>Modificado</th><th></th></tr></thead>
    <tbody id="doc-tbody"></tbody>
  </table>
</div><div class="app-theme">
  <button class="app-theme-btn" onclick="setTheme('dark')">Dark</button>
  <button class="app-theme-btn" onclick="setTheme('light')">Light</button>
  <button class="app-theme-btn" onclick="setTheme('violet')">Violet</button>
  <button class="app-theme-btn" onclick="setTheme('blue')">Blue</button>
</div>
<script>
function setTheme(t){document.documentElement.setAttribute('data-mts-theme',t);try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'setTheme',theme:t},'*');}catch(e){}}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='setTheme')document.documentElement.setAttribute('data-mts-theme',e.data.theme);});
function goBack(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'closeApp'},'*');return;}}catch(e){}window.history.back();}
</script>
<script>

var DOCS=[
  {id:1,name:'Contrato_Final_2026.pdf',   type:'PDF',  size:'2.4 MB',  date:'Hoy 10:30',    icon:'📄',  badge:'success'},
  {id:2,name:'Presupuesto_Q1.xlsx',        type:'Excel',size:'840 KB',   date:'Ayer',         icon:'📊',  badge:'success'},
  {id:3,name:'Propuesta_Cliente.docx',     type:'Word', size:'1.2 MB',   date:'27 Mar',       icon:'📝',  badge:'default'},
  {id:4,name:'Diseño_UI_v3.fig',           type:'Figma',size:'12.8 MB',  date:'26 Mar',       icon:'🎨',  badge:'info'},
  {id:5,name:'Manual_Usuario.pdf',         type:'PDF',  size:'5.1 MB',   date:'25 Mar',       icon:'📄',  badge:'default'},
  {id:6,name:'Datos_Clientes.csv',         type:'CSV',  size:'320 KB',   date:'24 Mar',       icon:'📋',  badge:'warning'},
  {id:7,name:'Presentacion_Ejecutiva.pptx',type:'PPT',  size:'8.3 MB',   date:'20 Mar',       icon:'📊',  badge:'default'},
  {id:8,name:'Backup_DB_marzo.sql',        type:'SQL',  size:'45.2 MB',  date:'15 Mar',       icon:'🗄️',  badge:'default'},
];
var currentView='grid';
var searchQuery='';

new MTS.Input('#doc-search-wrap',{placeholder:'Buscar archivos...',iconLeft:MTS.Icon.get('search'),onChange:function(e){searchQuery=e.detail.value.toLowerCase();renderDocs();}});

new MTS.Button('#doc-upload-btn',{label:'+ Subir',variant:'primary',size:'sm',iconLeft:MTS.Icon.get('upload'),onClick:function(){
  var area=document.getElementById('doc-upload-area');
  if(area.style.display==='none'){
    area.style.display='block';
    if(!area.dataset.built){
      new MTS.FileUpload(area,{accept:'.pdf,.docx,.xlsx,.pptx,.csv',multiple:true,maxSize:50,
        label:'Arrastra archivos aquí o <span>selecciona</span>',
        hint:'PDF, Word, Excel, PPT, CSV hasta 50MB',
        onChange:function(files){
          files.forEach(function(f){
            DOCS.unshift({id:Date.now()+Math.random(),name:f.name,type:f.name.split('.').pop().toUpperCase(),
              size:(f.size/1024/1024).toFixed(1)+' MB',date:'Ahora',icon:'📄',badge:'success'});
          });
          renderDocs();area.style.display='none';
        }
      });
      area.dataset.built='1';
    }
  } else { area.style.display='none'; }
}});

function setView(v){
  currentView=v;
  document.getElementById('btn-view-grid').classList.toggle('active',v==='grid');
  document.getElementById('btn-view-list').classList.toggle('active',v==='list');
  renderDocs();
}

function renderDocs(){
  var filtered=DOCS.filter(function(d){return !searchQuery||d.name.toLowerCase().includes(searchQuery);});
  document.getElementById('doc-count').textContent=filtered.length+' archivos';
  var grid=document.getElementById('doc-grid');
  var table=document.getElementById('doc-table');
  if(currentView==='grid'){
    grid.style.display='grid';table.style.display='none';
    grid.innerHTML='';
    filtered.forEach(function(d){
      var card=document.createElement('div');card.className='doc-card';
      card.innerHTML='<div class="doc-icon">'+d.icon+'</div>'
        +'<div class="doc-name" title="'+d.name+'">'+d.name+'</div>'
        +'<div class="doc-meta" style="display:flex;justify-content:space-between;">'
        +'<span class="mts-badge mts-badge--'+d.badge+' mts-badge--xs">'+d.type+'</span>'
        +'<span>'+d.size+'</span></div>';
      grid.appendChild(card);
    });
  } else {
    grid.style.display='none';table.style.display='table';
    var tbody=document.getElementById('doc-tbody');tbody.innerHTML='';
    filtered.forEach(function(d){
      var tr=document.createElement('tr');
      tr.innerHTML='<td style="font-weight:600;">'+d.icon+' '+d.name+'</td>'
        +'<td><span class="mts-badge mts-badge--'+d.badge+'">'+d.type+'</span></td>'
        +'<td style="color:var(--mts-text-muted);">'+d.size+'</td>'
        +'<td style="color:var(--mts-text-muted);font-size:12px;">'+d.date+'</td>'
        +'<td><button class="mts-btn mts-btn--ghost mts-btn--sm mts-btn--icon" onclick="alert(\'Demo: descargar '+d.name+'\')">'+MTS.Icon.get('download')+'</button></td>';
      tbody.appendChild(tr);
    });
  }
}
renderDocs();

</script>
</body>
</html>
