<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create user - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../../forms/matios-ui-select/matios-ui-select.js"></script>
  <script src="../../../forms/matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="user-create-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    new MTS.Card('#user-create-panel', {
      title: 'Create user',
      subtitle: 'Base setup for an internal account',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex--column mts-gap-4">' +
          '<div id="user-create-alert"></div>' +
          '<p class="mts-text--md mts-text-color--muted mts-m-0">First name, last name, email and username are required. The role defines the associated profiles that we will manage separately later.</p>' +
          '<div class="mts-grid mts-grid--gap-md">' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-first-name"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-last-name"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-email"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-username"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-phone"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-area"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-role-name"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-supervisor"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-role"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-create-status"></div></div>' +
          '</div>' +
          '<div class="mts-d-flex mts-flex--column mts-gap-3">' +
            '<div id="user-create-generate-password"></div>' +
            '<div id="user-create-send-access"></div>' +
          '</div>' +
        '</div>',
      footerAlign: 'between',
      footer: [
        {
          label: 'Back to users',
          variant: 'ghost',
          icon: MTS.Icon.get('arrow-left'),
          onClick: function () {
            openScreen('../user-list/index.html');
          }
        },
        {
          label: 'Create user',
          variant: 'primary',
          icon: MTS.Icon.get('user-plus'),
          onClick: function () {
            submitCreate();
          }
        }
      ]
    });

    var firstNameInput = new MTS.Input('#user-create-first-name', {
      type: 'text',
      label: 'First name',
      placeholder: 'Enter the first name',
      iconLeft: MTS.Icon.get('user')
    });

    var lastNameInput = new MTS.Input('#user-create-last-name', {
      type: 'text',
      label: 'Last name',
      placeholder: 'Enter the last name',
      iconLeft: MTS.Icon.get('user')
    });

    var emailInput = new MTS.Input('#user-create-email', {
      type: 'email',
      label: 'Email',
      placeholder: 'name@company.cl',
      iconLeft: MTS.Icon.get('mail')
    });

    var usernameInput = new MTS.Input('#user-create-username', {
      type: 'text',
      label: 'Username',
      placeholder: 'internal username',
      iconLeft: MTS.Icon.get('user')
    });

    var phoneInput = new MTS.Input('#user-create-phone', {
      type: 'text',
      label: 'Phone',
      placeholder: '+56 9 0000 0000',
      iconLeft: MTS.Icon.get('phone')
    });

    var areaSelect = new MTS.Select('#user-create-area', {
      label: 'Area',
      placeholder: 'Select an area',
      options: [
        { value: 'Operaciones', label: 'Operations' },
        { value: 'Finanzas', label: 'Finance' },
        { value: 'Soporte', label: 'Support' },
        { value: 'Tecnologia', label: 'Technology' }
      ]
    });

    var roleNameInput = new MTS.Input('#user-create-role-name', {
      type: 'text',
      label: 'Job title',
      placeholder: 'e.g. Senior analyst',
      iconLeft: MTS.Icon.get('briefcase')
    });

    var supervisorInput = new MTS.Input('#user-create-supervisor', {
      type: 'text',
      label: 'Supervisor',
      placeholder: 'Supervisor name',
      iconLeft: MTS.Icon.get('user')
    });

    var roleSelect = new MTS.Select('#user-create-role', {
      label: 'Role',
      placeholder: 'Select a role',
      hint: 'The role defines associated profiles and permissions.',
      options: [
        { value: 'workspace-user', label: 'Workspace user' },
        { value: 'operations-lead', label: 'Operations supervisor' },
        { value: 'finance-analyst', label: 'Finance analyst' },
        { value: 'support-coordinator', label: 'Support coordinator' }
      ]
    });

    var statusSelect = new MTS.Select('#user-create-status', {
      label: 'Initial status',
      value: 'active',
      options: [
        { value: 'active', label: 'Active' },
        { value: 'pending', label: 'Pending access' },
        { value: 'blocked', label: 'Blocked' }
      ]
    });

    var generatePasswordCheckbox = new MTS.Checkbox('#user-create-generate-password', {
      label: 'Generate password automatically',
      checked: true
    });

    var sendAccessCheckbox = new MTS.Checkbox('#user-create-send-access', {
      label: 'Send access by email on save',
      checked: true
    });

    function clearAlerts() {
      document.getElementById('user-create-alert').innerHTML = '';
    }

    function showAlert(variant, title, message) {
      clearAlerts();
      MTS.Alert.show('#user-create-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function clearFieldErrors() {
      firstNameInput.clearError();
      lastNameInput.clearError();
      emailInput.clearError();
      usernameInput.clearError();
    }

    function submitCreate() {
      var firstName = firstNameInput.getValue().trim();
      var lastName = lastNameInput.getValue().trim();
      var email = emailInput.getValue().trim();
      var username = usernameInput.getValue().trim();
      var role = roleSelect.getValue();
      var status = statusSelect.getValue() || 'active';

      clearFieldErrors();
      clearAlerts();

      if (!firstName) {
        firstNameInput.setError('Enter the first name');
        return;
      }

      if (!lastName) {
        lastNameInput.setError('Enter the last name');
        return;
      }

      if (!email) {
        emailInput.setError('Enter the email');
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailInput.setError('Enter a valid email');
        return;
      }

      if (!username) {
        usernameInput.setError('Enter the username');
        return;
      }

      if (!role) {
        showAlert('warning', 'Role is missing', 'Select a role to determine the base access for the user.');
        return;
      }

      showAlert(
        'success',
        'User ready',
        '<strong>' + escapeHtml(firstName + ' ' + lastName) + '</strong> would be registered with username <strong>@' + escapeHtml(username) + '</strong>, role <strong>' + escapeHtml(getRoleLabel(role)) + '</strong> and status <strong>' + escapeHtml(getStatusLabel(status)) + '</strong>' +
          (generatePasswordCheckbox.isChecked() ? ' with an automatic password.' : '.') +
          (sendAccessCheckbox.isChecked() ? ' The access email would also be sent.' : '')
      );
    }

    function getRoleLabel(value) {
      var options = roleSelect.options || [];
      for (var i = 0; i < options.length; i++) {
        if (options[i].value === value) return options[i].label;
      }
      return value || '-';
    }

    function getStatusLabel(value) {
      if (value === 'pending') return 'Pending access';
      if (value === 'blocked') return 'Blocked';
      return 'Active';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    MTS.Icon.initAll();
  </script>
</body>
</html>
