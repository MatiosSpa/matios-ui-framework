<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editar usuario - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-modal/matios-ui-modal.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../../forms/matios-ui-select/matios-ui-select.js"></script>
  <script src="../../../forms/matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
  <script src="../../../overlays/matios-ui-modal/matios-ui-modal.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="user-edit-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    new MTS.Card('#user-edit-panel', {
      title: 'Editar usuario',
      subtitle: 'Ajuste administrativo de cuenta',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex--column mts-gap-4">' +
          '<div id="user-edit-alert"></div>' +
          '<p class="mts-text--md mts-text-color--muted mts-m-0">Aqui se ajustan datos base, area, estado y rol. El cambio de clave vive aparte en modal para no mezclarlo con el formulario principal.</p>' +
          '<div class="mts-grid mts-grid--gap-md">' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-first-name"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-last-name"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-email"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-username"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-phone"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-area"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-role-name"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-supervisor"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-role"></div></div>' +
            '<div class="mts-g-col-12 mts-g-col-md-6"><div id="user-edit-status"></div></div>' +
          '</div>' +
          '<div class="mts-d-flex mts-flex--column mts-gap-3">' +
            '<div id="user-edit-force-reset"></div>' +
            '<div id="user-edit-notify"></div>' +
          '</div>' +
        '</div>',
      footerAlign: 'between',
      footer: [
        {
          label: 'Volver',
          variant: 'ghost',
          icon: MTS.Icon.get('arrow-left'),
          onClick: function () {
            openScreen('../user-list/index.html');
          }
        },
        {
          label: 'Ver detalle',
          variant: 'secondary',
          icon: MTS.Icon.get('arrow-right'),
          onClick: function () {
            openScreen('../user-detail/index.html');
          }
        },
        {
          label: 'Cambiar clave',
          variant: 'secondary',
          icon: MTS.Icon.get('key'),
          onClick: function () {
            openPasswordModal('admin');
          }
        },
        {
          label: 'Guardar cambios',
          variant: 'primary',
          icon: MTS.Icon.get('save'),
          onClick: function () {
            submitEdit();
          }
        }
      ]
    });

    var firstNameInput = new MTS.Input('#user-edit-first-name', {
      type: 'text',
      label: 'Nombre',
      value: 'Camila',
      iconLeft: MTS.Icon.get('user')
    });

    var lastNameInput = new MTS.Input('#user-edit-last-name', {
      type: 'text',
      label: 'Apellido',
      value: 'Soto',
      iconLeft: MTS.Icon.get('user')
    });

    var emailInput = new MTS.Input('#user-edit-email', {
      type: 'email',
      label: 'Correo',
      value: 'camila.soto@matios.dev',
      iconLeft: MTS.Icon.get('mail')
    });

    var usernameInput = new MTS.Input('#user-edit-username', {
      type: 'text',
      label: 'Username',
      value: 'csoto',
      iconLeft: MTS.Icon.get('user')
    });

    var phoneInput = new MTS.Input('#user-edit-phone', {
      type: 'text',
      label: 'Telefono',
      value: '+56 9 8765 4321',
      iconLeft: MTS.Icon.get('phone')
    });

    var areaSelect = new MTS.Select('#user-edit-area', {
      label: 'Area',
      value: 'Operaciones',
      options: [
        { value: 'Operaciones', label: 'Operaciones' },
        { value: 'Finanzas', label: 'Finanzas' },
        { value: 'Soporte', label: 'Soporte' },
        { value: 'Tecnologia', label: 'Tecnologia' }
      ]
    });

    var roleNameInput = new MTS.Input('#user-edit-role-name', {
      type: 'text',
      label: 'Cargo',
      value: 'Operations Lead',
      iconLeft: MTS.Icon.get('briefcase')
    });

    var supervisorInput = new MTS.Input('#user-edit-supervisor', {
      type: 'text',
      label: 'Supervisor',
      value: 'Founder account',
      iconLeft: MTS.Icon.get('user')
    });

    var roleSelect = new MTS.Select('#user-edit-role', {
      label: 'Rol',
      value: 'operations-lead',
      hint: 'El rol controla los perfiles asociados al usuario.',
      options: [
        { value: 'workspace-user', label: 'Usuario workspace' },
        { value: 'operations-lead', label: 'Supervisor Operacional' },
        { value: 'finance-analyst', label: 'Analista Finance' },
        { value: 'support-coordinator', label: 'Coordinador de Soporte' }
      ]
    });

    var statusSelect = new MTS.Select('#user-edit-status', {
      label: 'Estado',
      value: 'active',
      options: [
        { value: 'active', label: 'Activo' },
        { value: 'pending', label: 'Pendiente de acceso' },
        { value: 'blocked', label: 'Bloqueado' }
      ]
    });

    var forceResetCheckbox = new MTS.Checkbox('#user-edit-force-reset', {
      label: 'Forzar cambio de clave al proximo inicio de sesion'
    });

    var notifyCheckbox = new MTS.Checkbox('#user-edit-notify', {
      label: 'Notificar cambios al usuario por correo',
      checked: true
    });

    function clearAlerts() {
      document.getElementById('user-edit-alert').innerHTML = '';
    }

    function showAlert(variant, title, message) {
      clearAlerts();
      MTS.Alert.show('#user-edit-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function clearFieldErrors() {
      firstNameInput.clearError();
      lastNameInput.clearError();
      emailInput.clearError();
      usernameInput.clearError();
    }

    function submitEdit() {
      var firstName = firstNameInput.getValue().trim();
      var lastName = lastNameInput.getValue().trim();
      var email = emailInput.getValue().trim();
      var username = usernameInput.getValue().trim();
      var role = roleSelect.getValue();

      clearFieldErrors();
      clearAlerts();

      if (!firstName) {
        firstNameInput.setError('Ingresa el nombre');
        return;
      }

      if (!lastName) {
        lastNameInput.setError('Ingresa el apellido');
        return;
      }

      if (!email) {
        emailInput.setError('Ingresa el correo');
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailInput.setError('Ingresa un correo valido');
        return;
      }

      if (!username) {
        usernameInput.setError('Ingresa el username');
        return;
      }

      if (!role) {
        showAlert('warning', 'Falta el rol', 'Selecciona un rol antes de guardar los cambios del usuario.');
        return;
      }

      showAlert(
        'success',
        'Usuario actualizado',
        'Se guardarian cambios sobre <strong>' + escapeHtml(firstName + ' ' + lastName) + '</strong> con rol <strong>' + escapeHtml(getRoleLabel(role)) + '</strong>' +
          (notifyCheckbox.isChecked() ? ' y se enviaria notificacion al correo.' : '.')
      );
    }

    function openPasswordModal(initialMode) {
      var body = document.createElement('div');
      body.className = 'mts-d-flex mts-flex--column mts-gap-4';
      body.innerHTML =
        '<div id="change-password-alert"></div>' +
        '<div id="change-password-mode"></div>' +
        '<div id="change-password-current"></div>' +
        '<div id="change-password-next"></div>' +
        '<div id="change-password-confirm"></div>' +
        '<div id="change-password-force"></div>';

      var modeSelect;
      var currentPasswordInput;
      var nextPasswordInput;
      var confirmPasswordInput;
      var forceChangeCheckbox;

      var modal = new MTS.Modal({
        title: 'Cambiar clave',
        body: body,
        size: 'md',
        scrollable: true,
        buttons: [
          { label: 'Cancelar', variant: 'ghost', close: true },
          {
            label: 'Guardar clave',
            variant: 'primary',
            onClick: function () {
              submitPasswordChange();
            }
          }
        ],
        onShown: function () {
          modeSelect = new MTS.Select('#change-password-mode', {
            label: 'Contexto',
            value: initialMode,
            options: [
              { value: 'admin', label: 'Administrador cambia clave' },
              { value: 'user', label: 'Usuario cambia su propia clave' }
            ],
            onChange: function () {
              syncPasswordMode();
            }
          });

          currentPasswordInput = new MTS.Input('#change-password-current', {
            type: 'password',
            label: 'Clave actual',
            placeholder: 'Ingresa la clave actual',
            iconLeft: MTS.Icon.get('lock'),
            showPassword: true
          });

          nextPasswordInput = new MTS.Input('#change-password-next', {
            type: 'password',
            label: 'Nueva clave',
            placeholder: 'Ingresa la nueva clave',
            iconLeft: MTS.Icon.get('lock'),
            showPassword: true
          });

          confirmPasswordInput = new MTS.Input('#change-password-confirm', {
            type: 'password',
            label: 'Confirmar nueva clave',
            placeholder: 'Repite la nueva clave',
            iconLeft: MTS.Icon.get('lock'),
            showPassword: true
          });

          forceChangeCheckbox = new MTS.Checkbox('#change-password-force', {
            label: 'Forzar cambio de clave al proximo inicio'
          });

          syncPasswordMode();
        },
        onHidden: function () {
          modal.destroy();
        }
      });

      modal.show();

      function syncPasswordMode() {
        var currentField = document.getElementById('change-password-current');
        var forceField = document.getElementById('change-password-force');
        var isUserMode = modeSelect.getValue() === 'user';

        currentField.classList.toggle('mts-d-none', !isUserMode);
        forceField.classList.toggle('mts-d-none', isUserMode);
        clearPasswordErrors();
      }

      function clearPasswordErrors() {
        if (currentPasswordInput) currentPasswordInput.clearError();
        if (nextPasswordInput) nextPasswordInput.clearError();
        if (confirmPasswordInput) confirmPasswordInput.clearError();
      }

      function submitPasswordChange() {
        var mode = modeSelect.getValue();
        var currentPassword = currentPasswordInput.getValue().trim();
        var nextPassword = nextPasswordInput.getValue().trim();
        var confirmPassword = confirmPasswordInput.getValue().trim();

        clearPasswordErrors();

        if (mode === 'user' && !currentPassword) {
          currentPasswordInput.setError('Ingresa la clave actual');
          return;
        }

        if (!nextPassword) {
          nextPasswordInput.setError('Ingresa la nueva clave');
          return;
        }

        if (nextPassword.length < 8) {
          nextPasswordInput.setError('La clave debe tener al menos 8 caracteres');
          return;
        }

        if (!confirmPassword) {
          confirmPasswordInput.setError('Confirma la nueva clave');
          return;
        }

        if (nextPassword !== confirmPassword) {
          confirmPasswordInput.setError('Las claves no coinciden');
          return;
        }

        modal.hide();
        showAlert(
          'success',
          'Clave actualizada',
          mode === 'user'
            ? 'Se simularia el cambio de clave validando la clave actual del usuario.'
            : 'Se simularia el cambio de clave administrativo' + (forceChangeCheckbox.isChecked() ? ' forzando renovacion en el proximo acceso.' : '.')
        );
      }
    }

    function getRoleLabel(value) {
      var options = roleSelect.options || [];
      for (var i = 0; i < options.length; i++) {
        if (options[i].value === value) return options[i].label;
      }
      return value || '-';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    MTS.Icon.initAll();
  </script>
</body>
</html>
