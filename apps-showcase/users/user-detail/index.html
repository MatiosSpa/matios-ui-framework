<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User detail - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-midnight.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-obsidian.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-forest.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-abyss.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-ember.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dune.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../display/matios-ui-avatar/matios-ui-avatar.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-modal/matios-ui-modal.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../display/matios-ui-avatar/matios-ui-avatar.js"></script>
  <script src="../../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../../forms/matios-ui-select/matios-ui-select.js"></script>
  <script src="../../../forms/matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
  <script src="../../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../../overlays/matios-ui-modal/matios-ui-modal.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="user-detail-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    new MTS.Card('#user-detail-panel', {
      title: 'User detail',
      subtitle: 'Administrative record for an internal account',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex--column mts-gap-4">' +
          '<div id="user-detail-alert"></div>' +
          '<div class="mts-d-flex mts-align-items--center mts-justify-content--between mts-gap-4">' +
            '<div class="mts-d-flex mts-align-items--center mts-gap-3">' +
              '<div id="user-detail-avatar"></div>' +
              '<div class="mts-d-flex mts-flex--column mts-gap-2">' +
                '<p class="mts-text--sm mts-text-color--muted mts-m-0">Users</p>' +
                '<div class="mts-d-flex mts-align-items--center mts-gap-2 mts-flex--wrap">' +
                  '<h1 class="mts-h1 mts-m-0">Camila Soto</h1>' +
                  '<span id="user-detail-status-badge"></span>' +
                  '<span id="user-detail-area-badge"></span>' +
                '</div>' +
                '<p class="mts-text--md mts-text-color--muted mts-m-0">Administrative account focused on operations, documents and internal traceability.</p>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<section class="mts-surface mts-d-flex mts-flex--column mts-gap-3">' +
            '<div>' +
              '<strong class="mts-text--md mts-text-color--primary">Personal information</strong>' +
              '<p class="mts-text--sm mts-text-color--muted mts-mt-1 mts-mb-0">Base identity of the user within the system.</p>' +
            '</div>' +
            '<div class="mts-grid mts-grid--gap-md">' +
              infoCell('First name', 'Camila') +
              infoCell('Last name', 'Soto') +
              infoCell('Email', 'camila.soto@matios.dev') +
              infoCell('Username', 'csoto') +
              infoCell('Phone', '+56 9 8765 4321') +
              infoCell('Internal code', 'USR-1024') +
            '</div>' +
          '</section>' +
          '<section class="mts-surface mts-d-flex mts-flex--column mts-gap-3">' +
            '<div>' +
              '<strong class="mts-text--md mts-text-color--primary">Organization and access</strong>' +
              '<p class="mts-text--sm mts-text-color--muted mts-mt-1 mts-mb-0">Internal context, assigned role and current operational status.</p>' +
            '</div>' +
            '<div class="mts-grid mts-grid--gap-md">' +
              infoCell('Area', 'Operations') +
              infoCell('Position', 'Operations Lead') +
              infoCell('Role', 'Operations Supervisor') +
              infoCell('Supervisor', 'Founder account') +
              infoCell('Company', 'Matios Studio') +
              infoCell('Current status', 'Active') +
              infoCell('Created on', 'March 12, 2026') +
              infoCell('Last access', 'Today, 09:14') +
            '</div>' +
          '</section>' +
          '<section class="mts-surface mts-d-flex mts-flex--column mts-gap-3">' +
            '<div>' +
              '<strong class="mts-text--md mts-text-color--primary">Role and associated profiles</strong>' +
              '<p class="mts-text--sm mts-text-color--muted mts-mt-1 mts-mb-0">The visible profiles are understood as derived from the current role.</p>' +
            '</div>' +
            '<div class="mts-d-flex mts-flex--column mts-gap-2">' +
              '<div class="mts-d-flex mts-flex--column mts-gap-1">' +
                '<span class="mts-text--sm mts-text-color--muted">Current role</span>' +
                '<strong class="mts-text--md mts-text-color--primary">Operations Supervisor</strong>' +
              '</div>' +
              '<div class="mts-d-flex mts-gap-2 mts-flex--wrap">' +
                MTS.Badge.html('Base workspace', 'primary', 'sm') +
                MTS.Badge.html('Operations', 'accent', 'sm') +
                MTS.Badge.html('Documents', 'info', 'sm') +
              '</div>' +
            '</div>' +
          '</section>' +
          '<section class="mts-surface mts-d-flex mts-flex--column mts-gap-3">' +
            '<div>' +
              '<strong class="mts-text--md mts-text-color--primary">Security and activity</strong>' +
              '<p class="mts-text--sm mts-text-color--muted mts-mt-1 mts-mb-0">Access control, recent sessions and relevant events.</p>' +
            '</div>' +
            '<div class="mts-grid mts-grid--gap-md">' +
              '<div class="mts-g-col-12 mts-g-col-xl-4">' +
                '<div class="mts-d-flex mts-flex--column mts-gap-2">' +
                  securityRow('MFA', 'Active') +
                  securityRow('Mandatory password change', 'No') +
                  securityRow('Current session', 'Chrome · Santiago') +
                '</div>' +
              '</div>' +
              '<div class="mts-g-col-12 mts-g-col-xl-8">' +
                '<div class="mts-d-flex mts-flex--column mts-gap-3">' +
                  timelineRow('Today, 09:14', 'Successful OTP login', 'Validated user, code and primary workspace.') +
                  timelineRow('Yesterday, 18:41', 'Profile update', 'The documents profile was added for internal approvals.') +
                  timelineRow('April 18, 16:22', 'Contact details change', 'The record phone and supervisor were normalized.') +
                '</div>' +
              '</div>' +
            '</div>' +
          '</section>' +
        '</div>',
      footerAlign: 'between',
      footer: [
        {
          label: 'Back',
          variant: 'ghost',
          icon: MTS.Icon.get('arrow-left'),
          onClick: function () {
            openScreen('../user-list/index.html');
          }
        },
        {
          label: 'Edit',
          variant: 'secondary',
          icon: MTS.Icon.get('edit'),
          onClick: function () {
            openScreen('../user-edit/index.html');
          }
        },
        {
          label: 'Force sign-out',
          variant: 'secondary',
          icon: MTS.Icon.get('refresh-cw'),
          onClick: function () {
            showAlert('warning', 'Session invalidated', 'The remote sign-out of the user active sessions would be simulated.');
          }
        },
        {
          label: 'Block user',
          variant: 'ghost',
          icon: MTS.Icon.get('slash'),
          onClick: function () {
            showAlert('warning', 'User blocked', 'The action would be simulated on Camila Soto and logged in the audit trail.');
          }
        },
        {
          label: 'Change password',
          variant: 'primary',
          icon: MTS.Icon.get('key'),
          onClick: function () {
            openPasswordModal('admin');
          }
        }
      ]
    });

    new MTS.Avatar('#user-detail-avatar', {
      name: 'Camila Soto',
      size: 'lg',
      status: 'online'
    });

    new MTS.Badge('#user-detail-status-badge', {
      label: 'Active',
      variant: 'success',
      size: 'sm'
    });

    new MTS.Badge('#user-detail-area-badge', {
      label: 'Operations',
      variant: 'accent',
      size: 'sm'
    });

    function showAlert(variant, title, message) {
      document.getElementById('user-detail-alert').innerHTML = '';
      MTS.Alert.show('#user-detail-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function openPasswordModal(initialMode) {
      var body = document.createElement('div');
      body.className = 'mts-d-flex mts-flex--column mts-gap-4';
      body.innerHTML =
        '<div id="change-password-alert"></div>' +
        '<div id="change-password-mode"></div>' +
        '<div id="change-password-current"></div>' +
        '<div id="change-password-next"></div>' +
        '<div id="change-password-confirm"></div>' +
        '<div id="change-password-force"></div>';

      var modeSelect;
      var currentPasswordInput;
      var nextPasswordInput;
      var confirmPasswordInput;
      var forceChangeCheckbox;

      var modal = new MTS.Modal({
        title: 'Change password',
        body: body,
        size: 'md',
        scrollable: true,
        buttons: [
          { label: 'Cancel', variant: 'ghost', close: true },
          {
            label: 'Save password',
            variant: 'primary',
            onClick: function () {
              submitPasswordChange();
            }
          }
        ],
        onShown: function () {
          modeSelect = new MTS.Select('#change-password-mode', {
            label: 'Context',
            value: initialMode,
            options: [
              { value: 'admin', label: 'Administrator changes password' },
              { value: 'user', label: 'User changes their own password' }
            ],
            onChange: function () {
              syncPasswordMode();
            }
          });

          currentPasswordInput = new MTS.Input('#change-password-current', {
            type: 'password',
            label: 'Current password',
            placeholder: 'Enter the current password',
            iconLeft: MTS.Icon.get('lock'),
            showPassword: true
          });

          nextPasswordInput = new MTS.Input('#change-password-next', {
            type: 'password',
            label: 'New password',
            placeholder: 'Enter the new password',
            iconLeft: MTS.Icon.get('lock'),
            showPassword: true
          });

          confirmPasswordInput = new MTS.Input('#change-password-confirm', {
            type: 'password',
            label: 'Confirm new password',
            placeholder: 'Repeat the new password',
            iconLeft: MTS.Icon.get('lock'),
            showPassword: true
          });

          forceChangeCheckbox = new MTS.Checkbox('#change-password-force', {
            label: 'Force password change at next sign-in'
          });

          syncPasswordMode();
        },
        onHidden: function () {
          modal.destroy();
        }
      });

      modal.show();

      function syncPasswordMode() {
        var currentField = document.getElementById('change-password-current');
        var forceField = document.getElementById('change-password-force');
        var isUserMode = modeSelect.getValue() === 'user';

        currentField.classList.toggle('mts-d-none', !isUserMode);
        forceField.classList.toggle('mts-d-none', isUserMode);
        clearPasswordErrors();
      }

      function clearPasswordErrors() {
        if (currentPasswordInput) currentPasswordInput.clearError();
        if (nextPasswordInput) nextPasswordInput.clearError();
        if (confirmPasswordInput) confirmPasswordInput.clearError();
      }

      function submitPasswordChange() {
        var mode = modeSelect.getValue();
        var currentPassword = currentPasswordInput.getValue().trim();
        var nextPassword = nextPasswordInput.getValue().trim();
        var confirmPassword = confirmPasswordInput.getValue().trim();

        clearPasswordErrors();

        if (mode === 'user' && !currentPassword) {
          currentPasswordInput.setError('Enter the current password');
          return;
        }

        if (!nextPassword) {
          nextPasswordInput.setError('Enter the new password');
          return;
        }

        if (nextPassword.length < 8) {
          nextPasswordInput.setError('The password must be at least 8 characters long');
          return;
        }

        if (!confirmPassword) {
          confirmPasswordInput.setError('Confirm the new password');
          return;
        }

        if (nextPassword !== confirmPassword) {
          confirmPasswordInput.setError('The passwords do not match');
          return;
        }

        modal.hide();
        showAlert(
          'success',
          'Password updated',
          mode === 'user'
            ? 'The password change would be simulated by validating the user current password.'
            : 'The administrative password change would be simulated' + (forceChangeCheckbox.isChecked() ? ', forcing renewal at the next sign-in.' : '.')
        );
      }
    }

    function infoCell(label, value) {
      return '' +
        '<div class="mts-g-col-12 mts-g-col-md-6">' +
          '<div class="mts-d-flex mts-flex--column mts-gap-1">' +
            '<span class="mts-text--sm mts-text-color--muted">' + escapeHtml(label) + '</span>' +
            '<strong class="mts-text--sm mts-text-color--primary">' + escapeHtml(value) + '</strong>' +
          '</div>' +
        '</div>';
    }

    function timelineRow(date, title, copy) {
      return '' +
        '<div class="mts-surface mts-d-flex mts-flex--column mts-gap-1">' +
          '<span class="mts-text--sm mts-text-color--muted">' + escapeHtml(date) + '</span>' +
          '<strong class="mts-text--md mts-text-color--primary">' + escapeHtml(title) + '</strong>' +
          '<span class="mts-text--sm mts-text-color--muted">' + escapeHtml(copy) + '</span>' +
        '</div>';
    }

    function securityRow(label, value) {
      return '' +
        '<div class="mts-d-flex mts-align-items--center mts-justify-content--between mts-gap-3">' +
          '<span class="mts-text--sm mts-text-color--muted">' + escapeHtml(label) + '</span>' +
          '<strong class="mts-text--sm mts-text-color--primary">' + escapeHtml(value) + '</strong>' +
        '</div>';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    MTS.Icon.initAll();
  </script>
</body>
</html>
