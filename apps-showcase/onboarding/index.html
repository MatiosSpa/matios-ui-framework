<style>
*{box-sizing:border-box}
body{background:var(--mts-bg-body);color:var(--mts-text-color--primary);font-family:var(--mts-font-family);margin:0;min-height:100vh;}
.app-topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;background:var(--mts-bg-surface);border-bottom:1px solid var(--mts-border-color);position:sticky;top:0;z-index:100;}
.app-topbar-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mts-text-color--muted);cursor:pointer;padding:4px 8px;border-radius:var(--mts-radius-md);border:none;background:none;transition:color .15s,background .15s;font-family:var(--mts-font-family);}
.app-topbar-back:hover{color:var(--mts-text-color--primary);background:var(--mts-bg-surface-2);}
.app-topbar-title{font-size:14px;font-weight:700;color:var(--mts-text-color--primary);flex:1;}
.app-topbar-badge{font-size:10px;padding:2px 8px;border-radius:var(--mts-radius-full);background:var(--mts-color-primary-light);color:var(--mts-color-primary);font-weight:700;}
.app-content{padding:24px;max-width:1100px;margin:0 auto;}
.app-card{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:24px;}
.app-section{display:flex;flex-direction:column;gap:20px;}
.app-grid{display:grid;gap:16px;}
.app-grid-2{grid-template-columns:1fr 1fr;}
.app-grid-3{grid-template-columns:1fr 1fr 1fr;}
.app-grid-4{grid-template-columns:repeat(4,1fr);}
.app-h2{font-size:18px;font-weight:800;margin:0 0 4px;}
.app-h2 span{color:var(--mts-color-primary);}
.app-sub{font-size:13px;color:var(--mts-text-color--muted);margin:0 0 20px;}
.app-divider{border:none;border-top:1px solid var(--mts-border-color);margin:20px 0;}
.app-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mts-text-color--muted);margin-bottom:6px;}
.app-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.app-theme{position:fixed;bottom:16px;right:16px;display:flex;gap:4px;z-index:999;}
.app-theme-btn{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:var(--mts-bg-surface);color:var(--mts-text-color--secondary);}
.app-theme-btn:hover{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.app-grid-2,.app-grid-3,.app-grid-4{grid-template-columns:1fr;}}
</style>

<body>
<div class="app-topbar"><span id="onb-back"></span><span class="app-topbar-title">Onboarding</span><span class="app-topbar-badge">Wizard</span></div>
<style>
.onb-wrap{min-height:calc(100vh - 50px);display:flex;align-items:center;justify-content:center;padding:32px 24px;}
.onb-card{width:100%;max-width:520px;}
.onb-step{display:none;flex-direction:column;gap:20px;}
.onb-step.active{display:flex;}
.onb-actions{display:flex;gap:10px;justify-content:space-between;margin-top:8px;}
.onb-icon{font-size:40px;margin-bottom:8px;}
.onb-stepper{margin-bottom:28px;}
.onb-center{text-align:center;padding:14px 0;}
.onb-h2{margin:0 0 8px;font-size:22px;font-weight:800;}
.onb-h3{margin:0 0 4px;font-size:16px;font-weight:700;}
.onb-muted{margin:0;font-size:13px;color:var(--mts-text-color--muted);}
.onb-lead{margin:0 0 24px;font-size:14px;color:var(--mts-text-color--muted);}
.onb-note{margin:0 0 8px;font-size:14px;color:var(--mts-text-color--muted);}
.onb-note-sm{margin:0 0 24px;font-size:13px;color:var(--mts-text-color--muted);}
</style>
<div class="onb-wrap">
  <div class="onb-card">
    <div id="onb-stepper" class="onb-stepper"></div>
    <div class="app-card">
      <!-- Step 1: Welcome -->
      <div class="onb-step active" id="onb-0">
        <div class="onb-center">
          <div class="onb-icon">👋</div>
          <h2 class="onb-h2">Welcome to Matios!</h2>
          <p class="onb-lead">Let's set up your workspace in 3 simple steps.</p>
          <div id="btn-onb-start"></div>
        </div>
      </div>
      <!-- Step 2: Workspace -->
      <div class="onb-step" id="onb-1">
        <div><h3 class="onb-h3">Your workspace</h3>
        <p class="onb-muted">Customize your workspace</p></div>
        <div id="onb-workspace-name"></div>
        <div id="onb-industry"></div>
        <div id="onb-team-size"></div>
        <div class="onb-actions">
          <div id="btn-onb-back1"></div>
          <div id="btn-onb-next1"></div>
        </div>
      </div>
      <!-- Step 3: Team -->
      <div class="onb-step" id="onb-2">
        <div><h3 class="onb-h3">Invite your team</h3>
        <p class="onb-muted">Add your collaborators' emails</p></div>
        <div id="onb-emails"></div>
        <div id="onb-rol"></div>
        <div class="onb-actions">
          <div id="btn-onb-back2"></div>
          <div id="btn-onb-next2"></div>
        </div>
      </div>
      <!-- Step 4: Done -->
      <div class="onb-step" id="onb-3">
        <div class="onb-center">
          <div class="onb-icon">🚀</div>
          <h2 class="onb-h2">All set!</h2>
          <p class="onb-note">Your workspace <strong id="onb-ws-name-final"></strong> is configured.</p>
          <p class="onb-note-sm">Invitations have been sent to your team.</p>
          <div id="btn-onb-finish"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
function goBack(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'closeApp'},'*');return;}}catch(e){}window.history.back();}
new MTS.Button('#onb-back',{label:'← Back',variant:'ghost',size:'sm',onClick:goBack});
</script>
<script>

var onbStep=0;
var stepper=new MTS.Stepper('#onb-stepper',{
  direction:'horizontal',
  steps:[
    {id:'s0',label:'Start'},
    {id:'s1',label:'Workspace'},
    {id:'s2',label:'Team'},
    {id:'s3',label:'Done'},
  ],
  active:0,
});
new MTS.Button('#btn-onb-start',{label:'Get started →',variant:'primary',onClick:function(){goOnb(1);}});
var wsNameInp=new MTS.Input('#onb-workspace-name',{label:'Workspace name',placeholder:'e.g. Acme Corp',value:''});
var industSel=new MTS.Select('#onb-industry',{label:'Industry',placeholder:'Select...',options:[
  {value:'tech',label:'Technology'},{value:'salud',label:'Healthcare'},{value:'edu',label:'Education'},
  {value:'fin',label:'Finance'},{value:'retail',label:'Retail'},{value:'otro',label:'Other'},
]});
var teamSel=new MTS.Select('#onb-team-size',{label:'Team size',placeholder:'Select...',options:[
  {value:'1',label:'Just me'},{value:'2-5',label:'2-5 people'},{value:'6-20',label:'6-20 people'},
  {value:'21+',label:'21+ people'},
]});
new MTS.Button('#btn-onb-back1',{label:'← Back',variant:'ghost',onClick:function(){goOnb(0);}});
new MTS.Button('#btn-onb-next1',{label:'Next →',variant:'primary',onClick:function(e,inst){
  if(!wsNameInp.getValue().trim()){wsNameInp.setError('Name is required');return;}
  goOnb(2);
}});
var emailInp=new MTS.Input('#onb-emails',{label:'Team emails',placeholder:'juan@empresa.com, ana@empresa.com'});
var rolSel=new MTS.Select('#onb-rol',{label:'Default role',options:[
  {value:'admin',label:'Administrator'},{value:'editor',label:'Editor'},{value:'viewer',label:'Viewer'},
],value:'editor'});
new MTS.Button('#btn-onb-back2',{label:'← Back',variant:'ghost',onClick:function(){goOnb(1);}});
new MTS.Button('#btn-onb-next2',{label:'Finish setup',variant:'primary',onClick:function(e,inst){
  inst.setLoading(true);
  setTimeout(function(){
    inst.setLoading(false);
    document.getElementById('onb-ws-name-final').textContent='"'+wsNameInp.getValue()+'"';
    goOnb(3);
  },1500);
}});
new MTS.Button('#btn-onb-finish',{label:'Go to dashboard →',variant:'primary',onClick:function(){goBack();}});

function goOnb(n){
  document.querySelectorAll('.onb-step').forEach(function(el){el.classList.remove('active');});
  document.getElementById('onb-'+n).classList.add('active');
  onbStep=n;
  if(stepper.goTo)stepper.goTo(n);
}

</script>
</body>
</html>
