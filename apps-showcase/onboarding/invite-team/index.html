<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invite Team - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-midnight.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-obsidian.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-forest.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-abyss.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-ember.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dune.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-taginput/matios-ui-taginput.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-select/matios-ui-select.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../forms/matios-ui-taginput/matios-ui-taginput.js"></script>
  <script src="../../../forms/matios-ui-select/matios-ui-select.js"></script>
  <script src="../../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../../forms/matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
</head>
<body>
  <main class="mts-d-flex mts-align-items--center mts-justify-content--center mts-p-4 mts-min-vh-100">
    <section class="mts-card mts-card--elevated mts-w--100 mts-max-w-xl">
      <div class="mts-card__body mts-p-6">
        <div class="mts-text--center mts-mb-4">
          <p class="mts-text--sm mts-text-color--muted mts-m-0">Matios UI</p>
          <h1 class="mts-h1 mts-mt-2">Invite your team</h1>
          <p class="mts-text--md mts-text-color--muted mts-mt-2 mts-mb-0">Set up initial access for your first teammates.</p>
        </div>

        <div class="mts-d-flex mts-flex--column mts-gap-4">
          <div id="invite-team-alert"></div>
          <div id="invite-team-members"></div>
          <div id="invite-team-role"></div>
          <div id="invite-team-message"></div>
          <div id="invite-team-copy"></div>
          <div id="invite-team-submit"></div>
        </div>
      </div>

      <div class="mts-card__footer mts-card__footer--between">
        <div id="invite-team-skip"></div>
        <div id="invite-team-back"></div>
      </div>
    </section>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    var membersInput = new MTS.TagInput('#invite-team-members', {
      label: 'Team emails',
      placeholder: 'Add an email and press Enter',
      allowCustom: true,
      suggestions: [
        { uid: 'ana@acme.com', name: 'ana@acme.com' },
        { uid: 'carlos@acme.com', name: 'carlos@acme.com' },
        { uid: 'sofia@acme.com', name: 'sofia@acme.com' }
      ]
    });

    var roleSelect = new MTS.Select('#invite-team-role', {
      label: 'Initial role',
      placeholder: 'Select a base role',
      options: [
        { value: 'general', label: 'General' },
        { value: 'operations', label: 'Operations' },
        { value: 'document-viewer', label: 'Document Viewer' },
        { value: 'billing-editor', label: 'Billing Editor' }
      ]
    });

    var messageInput = new MTS.Input('#invite-team-message', {
      type: 'text',
      label: 'Welcome message',
      placeholder: 'We are sharing access so you can get started today',
      iconLeft: MTS.Icon.get('mail')
    });

    var copyCheckbox = new MTS.Checkbox('#invite-team-copy', {
      label: 'I want to receive a copy of the invitations summary'
    });

    new MTS.Button('#invite-team-skip', {
      label: 'Continue without inviting',
      variant: 'link',
      onClick: function () {
        openScreen('../onboarding-complete/index.html');
      }
    });

    new MTS.Button('#invite-team-back', {
      label: 'Back',
      variant: 'link',
      onClick: function () {
        openScreen('../signup-with-company/index.html');
      }
    });

    var submitButton = new MTS.Button('#invite-team-submit', {
      label: 'Send invitations',
      variant: 'primary',
      block: true,
      onClick: function (event, instance) {
        submitInvites(instance);
      }
    });

    function clearAlerts() {
      document.getElementById('invite-team-alert').innerHTML = '';
    }

    function showAlert(variant, title, message) {
      clearAlerts();
      MTS.Alert.show('#invite-team-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function getRoleLabel(value) {
      var options = roleSelect.options || [];
      for (var i = 0; i < options.length; i++) {
        if (options[i].value === value) return options[i].label;
      }
      return value || '-';
    }

    function submitInvites(button) {
      var tags = membersInput.getTags();
      var roleValue = roleSelect.getValue();
      var message = messageInput.getValue().trim();

      messageInput.clearError();
      clearAlerts();

      if (!tags.length) {
        showAlert('warning', 'Add at least one email', 'We need at least one person in the initial batch.');
        return;
      }

      for (var i = 0; i < tags.length; i++) {
        if (!isValidEmail(tags[i].uid)) {
          showAlert('warning', 'There are invalid emails', 'Review the invitations and keep only valid emails.');
          return;
        }
      }

      if (!roleValue) {
        showAlert('warning', 'Initial role is missing', 'Select the base access package for the team.');
        return;
      }

      if (message && message.length > 96) {
        messageInput.setError('Keep the message under 96 characters');
        return;
      }

      button.setLoading(true);
      button.setLabel('Preparing invitations...');

      setTimeout(function () {
        button.setLoading(false);
        button.setLabel('Send invitations');
        showAlert(
          'success',
          'Batch ready',
          'Sending would be simulated for <strong>' + tags.length + ' people</strong> with the <strong>' + escapeHtml(getRoleLabel(roleValue)) + '</strong> role' +
            (copyCheckbox.isChecked() ? ' and a copy to the administrator.' : '.')
        );
      }, 800);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    MTS.Icon.initAll();
  </script>
</body>
</html>
