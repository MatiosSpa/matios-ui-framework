  <meta charset="UTF-8">

  <title>Signup With Company - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>

  <link rel="stylesheet" href="../../../themes/matios-ui-mode-ember.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dune.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">

  <script src="../../../forms/matios-ui-toggle/matios-ui-toggle.js"></script>
  <script src="../../../forms/matios-ui-select/matios-ui-select.js"></script>

</head>
<body>
  <main class="mts-d-flex mts-align-items--center mts-justify-content--center mts-p-4 mts-min-vh-100">
    <section class="mts-card mts-card--elevated mts-w--100 mts-max-w-xl">
      <div class="mts-card__body mts-p-6">
        <div class="mts-text--center mts-mb-4">
          <p class="mts-text--sm mts-text-color--muted mts-m-0">Matios UI</p>
          <h1 class="mts-h1 mts-mt-2">Create account + company</h1>
        </div>

        <div class="mts-d-flex mts-flex--column mts-gap-4">
          <div id="signup-company-alert"></div>
          <div id="signup-company-first-name"></div>
          <div id="signup-company-last-name"></div>
          <div id="signup-company-email"></div>
          <div id="signup-company-phone"></div>
          <div id="signup-company-name"></div>
          <div id="signup-company-industry"></div>
          <div id="signup-company-team-size"></div>

          <section class="mts-surface mts-d-flex mts-align-items--center mts-justify-content--between mts-gap-4">
            <div class="mts-d-flex mts-flex--column mts-gap-1">
              <strong class="mts-text--sm mts-fw--semibold mts-text-color--primary">Automatic password</strong>
              <span class="mts-text--sm mts-text-color--muted">Generate a temporary password and send it to the work email</span>
            </div>
            <div id="signup-company-auto-password"></div>
          </section>

          <div id="signup-company-password"></div>
          <div id="signup-company-password-confirm"></div>
          <div id="signup-company-terms"></div>
          <div id="signup-company-updates"></div>
          <div id="signup-company-submit"></div>
        </div>
      </div>

      <div class="mts-card__footer mts-card__footer--center">
        <span class="mts-text--md mts-text-color--muted">Already have an account?</span>
        <div id="signup-company-login"></div>
      </div>
    </section>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    var autoPassword = false;

    var firstNameInput = new MTS.Input('#signup-company-first-name', {
      type: 'text',
      label: 'First name',
      placeholder: 'Enter your first name',
      iconLeft: MTS.Icon.get('user')
    });

    var lastNameInput = new MTS.Input('#signup-company-last-name', {
      type: 'text',
      label: 'Last name',
      placeholder: 'Enter your last name',
      iconLeft: MTS.Icon.get('user')
    });

    var emailInput = new MTS.Input('#signup-company-email', {
      type: 'email',
      label: 'Work email',
      placeholder: 'Enter your email',
      iconLeft: MTS.Icon.get('mail')
    });

    var phoneInput = new MTS.Input('#signup-company-phone', {
      type: 'text',
      label: 'Phone',
      placeholder: '+56 9 1234 5678',
      iconLeft: MTS.Icon.get('phone')
    });

    var companyNameInput = new MTS.Input('#signup-company-name', {
      type: 'text',
      label: 'Company',
      placeholder: 'Enter the company name',
      iconLeft: MTS.Icon.get('briefcase')
    });

    var industrySelect = new MTS.Select('#signup-company-industry', {
      label: 'Industry',
      placeholder: 'Select an industry',
      options: [
        { value: 'saas', label: 'Software and SaaS' },
        { value: 'services', label: 'Professional services' },
        { value: 'retail', label: 'Retail and eCommerce' },
        { value: 'finance', label: 'Finance and insurance' },
        { value: 'logistics', label: 'Logistics and operations' }
      ]
    });

    var teamSizeSelect = new MTS.Select('#signup-company-team-size', {
      label: 'Team size',
      placeholder: 'Select a range',
      options: [
        { value: '1-10', label: '1 to 10 people' },
        { value: '11-50', label: '11 to 50 people' },
        { value: '51-200', label: '51 to 200 people' },
        { value: '200+', label: 'More than 200 people' }
      ]
    });

    var autoPasswordToggle = new MTS.Toggle('#signup-company-auto-password', {
      checked: false,
      onChange: function (event) {
        autoPassword = !!event.detail.checked;
        syncPasswordMode();
      }
    });

    var passwordInput = new MTS.Input('#signup-company-password', {
      type: 'password',
      label: 'Password',
      placeholder: 'Create a password',
      iconLeft: MTS.Icon.get('lock'),
      showPassword: true
    });

    var confirmPasswordInput = new MTS.Input('#signup-company-password-confirm', {
      type: 'password',
      label: 'Confirm password',
      placeholder: 'Repeat your password',
      iconLeft: MTS.Icon.get('lock'),
      showPassword: true
    });

    var termsCheckbox = new MTS.Checkbox('#signup-company-terms', {
      label: 'I accept the terms and conditions'
    });

    new MTS.Checkbox('#signup-company-updates', {
      label: 'I want to receive product updates'
    });

    new MTS.Button('#signup-company-login', {
      label: 'Go to login',
      variant: 'link',
      size: 'sm',
      onClick: function () {
        openScreen('../../login/login/index.html');
      }
    });

    var submitButton = new MTS.Button('#signup-company-submit', {
      label: 'Create account and company',
      variant: 'primary',
      block: true,
      onClick: function (event, instance) {
        submitSignup(instance);
      }
    });

    function clearAlerts() {
      document.getElementById('signup-company-alert').innerHTML = '';
    }

    function showAlert(variant, title, message) {
      clearAlerts();
      MTS.Alert.show('#signup-company-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function isChecked(instance) {
      return instance && typeof instance.isChecked === 'function' ? instance.isChecked() : false;
    }

    function syncPasswordMode() {
      document.getElementById('signup-company-password').classList.toggle('mts-d-none', autoPassword);
      document.getElementById('signup-company-password-confirm').classList.toggle('mts-d-none', autoPassword);
      passwordInput.clearError();
      confirmPasswordInput.clearError();
      autoPasswordToggle.setChecked(autoPassword);
    }

    function submitSignup(button) {
      var firstName = firstNameInput.getValue().trim();
      var lastName = lastNameInput.getValue().trim();
      var email = emailInput.getValue().trim();
      var phone = phoneInput.getValue().trim();
      var companyName = companyNameInput.getValue().trim();
      var industry = industrySelect.getValue();
      var teamSize = teamSizeSelect.getValue();
      var password = passwordInput.getValue().trim();
      var confirmPassword = confirmPasswordInput.getValue().trim();

      firstNameInput.clearError();
      lastNameInput.clearError();
      emailInput.clearError();
      phoneInput.clearError();
      companyNameInput.clearError();
      passwordInput.clearError();
      confirmPasswordInput.clearError();
      clearAlerts();

      if (!firstName) {
        firstNameInput.setError('Enter your first name');
        return;
      }

      if (!lastName) {
        lastNameInput.setError('Enter your last name');
        return;
      }

      if (!email) {
        emailInput.setError('Enter your email');
        return;
      }

      if (phone && !/^[+\d\s()-]{8,}$/.test(phone)) {
        phoneInput.setError('Enter a valid phone number or leave it empty');
        return;
      }

      if (!companyName) {
        companyNameInput.setError('Enter the company name');
        return;
      }

      if (!industry) {
        showAlert('warning', 'Industry missing', 'Select the industry to continue.');
        return;
      }

      if (!teamSize) {
        showAlert('warning', 'Team missing', 'Select the team size to continue.');
        return;
      }

      if (!isChecked(termsCheckbox)) {
        showAlert('warning', 'Terms missing', 'You must accept the terms to continue.');
        return;
      }

      if (!autoPassword) {
        if (!password) {
          passwordInput.setError('Create a password');
          return;
        }

        if (password.length < 8) {
          passwordInput.setError('The password must be at least 8 characters long');
          return;
        }

        if (!confirmPassword) {
          confirmPasswordInput.setError('Confirm your password');
          return;
        }

        if (password !== confirmPassword) {
          confirmPasswordInput.setError('The passwords do not match');
          return;
        }
      }

      button.setLoading(true);
      button.setLabel('Creating...');

      setTimeout(function () {
        button.setLoading(false);
        button.setLabel('Create account and company');

        if (autoPassword) {
          showAlert('success', 'Company created', 'Would create <strong>' + escapeHtml(companyName) + '</strong> and send a temporary password to <strong>' + escapeHtml(email) + '</strong>.');
        } else {
          showAlert('success', 'Company created', 'Would create <strong>' + escapeHtml(companyName) + '</strong> with an admin account for <strong>' + escapeHtml(email) + '</strong>.');
        }
      }, 700);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    syncPasswordMode();
    MTS.Icon.initAll();
  </script>
</body>
</html>
