<!DOCTYPE html>
<html lang="es" data-mts-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestión de Tareas — Matios UI</title>
  <script>(function(){var m=(location.hash||"").match(/mts-theme=([a-z-]+)/);if(m)document.documentElement.setAttribute("data-mts-theme",m[1]);try{var p=window.parent;if(p&&p!==window){var pt=p.currentThemeVal||p.document.documentElement.getAttribute("data-mts-theme");if(pt)document.documentElement.setAttribute("data-mts-theme",pt);}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-high-contrast.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <link rel="stylesheet" href="../../forms/matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-progress/matios-ui-progress.css">
  <link rel="stylesheet" href="../../display/matios-ui-emptystate/matios-ui-emptystate.css">
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../forms/matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../../overlays/matios-ui-progress/matios-ui-progress.js"></script>
  <script src="../../display/matios-ui-emptystate/matios-ui-emptystate.js"></script>
<style>
*{box-sizing:border-box}
body{background:var(--mts-bg-body);color:var(--mts-text-color--primary);font-family:var(--mts-font-family);margin:0;min-height:100vh;}
.app-topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;background:var(--mts-bg-surface);border-bottom:1px solid var(--mts-border-color);position:sticky;top:0;z-index:100;}
.app-topbar-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mts-text-color--muted);cursor:pointer;padding:4px 8px;border-radius:var(--mts-radius-md);border:none;background:none;transition:color .15s,background .15s;font-family:var(--mts-font-family);}
.app-topbar-back:hover{color:var(--mts-text-color--primary);background:var(--mts-bg-surface-2);}
.app-topbar-title{font-size:14px;font-weight:700;color:var(--mts-text-color--primary);flex:1;}
.app-topbar-badge{font-size:10px;padding:2px 8px;border-radius:var(--mts-radius-full);background:var(--mts-color-primary-light);color:var(--mts-color-primary);font-weight:700;}
.app-content{padding:24px;max-width:1100px;margin:0 auto;}
.app-card{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:24px;}
.app-section{display:flex;flex-direction:column;gap:20px;}
.app-grid{display:grid;gap:16px;}
.app-grid-2{grid-template-columns:1fr 1fr;}
.app-grid-3{grid-template-columns:1fr 1fr 1fr;}
.app-grid-4{grid-template-columns:repeat(4,1fr);}
.app-h2{font-size:18px;font-weight:800;margin:0 0 4px;}
.app-h2 span{color:var(--mts-color-primary);}
.app-sub{font-size:13px;color:var(--mts-text-color--muted);margin:0 0 20px;}
.app-divider{border:none;border-top:1px solid var(--mts-border-color);margin:20px 0;}
.app-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mts-text-color--muted);margin-bottom:6px;}
.app-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.app-theme{position:fixed;bottom:16px;right:16px;display:flex;gap:4px;z-index:999;}
.app-theme-btn{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:var(--mts-bg-surface);color:var(--mts-text-color--secondary);}
.app-theme-btn:hover{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.app-grid-2,.app-grid-3,.app-grid-4{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app-topbar"><button class="app-topbar-back" onclick="goBack()">&#8592; Volver</button><span class="app-topbar-title">Gestión de Tareas</span><span class="app-topbar-badge">To-do</span></div>
<style>
.task-content{padding:24px;max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
.task-add{display:flex;gap:10px;align-items:flex-end;}
.task-add>div:first-child{flex:1;}
.task-list{display:flex;flex-direction:column;gap:2px;}
.task-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-md);transition:background .15s;}
.task-item:hover{background:var(--mts-bg-surface-2);}
.task-item.done .task-title{text-decoration:line-through;color:var(--mts-text-color--muted);}
.task-title{flex:1;font-size:14px;}
.task-meta{display:flex;align-items:center;gap:8px;}
.task-del{background:none;border:none;color:var(--mts-text-color--muted);cursor:pointer;padding:4px;border-radius:4px;font-size:16px;line-height:1;transition:color .15s;}
.task-del:hover{color:var(--mts-color-danger);}
.task-filters{display:flex;gap:6px;flex-wrap:wrap;}
.task-filter{padding:4px 12px;border-radius:var(--mts-radius-full);font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:none;color:var(--mts-text-color--muted);font-family:inherit;transition:all .15s;}
.task-filter.active{background:var(--mts-color-primary);border-color:var(--mts-color-primary);color:#fff;}
</style>
<div class="task-content">
  <div>
    <h2 class="app-h2">Mis <span>Tareas</span></h2>
    <p class="app-sub">Organiza y completa tus pendientes del día</p>
  </div>
  <div id="task-progress"></div>
  <div class="task-add">
    <div id="task-input"></div>
    <div id="btn-add-task"></div>
  </div>
  <div class="task-filters" id="task-filters">
    <button class="task-filter active" data-filter="all" onclick="setFilter('all',this)">Todas</button>
    <button class="task-filter" data-filter="pending" onclick="setFilter('pending',this)">Pendientes</button>
    <button class="task-filter" data-filter="done" onclick="setFilter('done',this)">Completadas</button>
  </div>
  <div id="task-list" class="task-list"></div>
  <div id="task-empty" style="display:none;"></div>
</div><div class="app-theme">
  <button class="app-theme-btn" onclick="setTheme('dark')">Dark</button>
  <button class="app-theme-btn" onclick="setTheme('light')">Light</button>
  <button class="app-theme-btn" onclick="setTheme('violet')">Violet</button>
  <button class="app-theme-btn" onclick="setTheme('blue')">Blue</button>
</div>
<script>
function setTheme(t){document.documentElement.setAttribute('data-mts-theme',t);try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'setTheme',theme:t},'*');}catch(e){}}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='setTheme')document.documentElement.setAttribute('data-mts-theme',e.data.theme);});
function goBack(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'closeApp'},'*');return;}}catch(e){}window.history.back();}
</script>
<script>

var tasks=[
  {id:1,title:'Revisar mockups del dashboard',      done:false,priority:'high'},
  {id:2,title:'Reunión con el cliente a las 15:00', done:false,priority:'medium'},
  {id:3,title:'Actualizar dependencias del proyecto',done:false,priority:'low'},
  {id:4,title:'Escribir tests unitarios del módulo auth',done:false,priority:'high'},
  {id:5,title:'Enviar informe semanal al equipo',   done:true, priority:'medium'},
  {id:6,title:'Revisar PRs pendientes en GitHub',   done:false,priority:'medium'},
];
var currentFilter='all';
var progBar=new MTS.Progress('#task-progress',{value:0,showLabel:true,showValue:true,label:'Progreso del día'});
var taskInput=new MTS.Input('#task-input',{placeholder:'Nueva tarea...',label:'Agregar tarea'});
new MTS.Button('#btn-add-task',{label:'Agregar',variant:'primary',onClick:function(){
  var t=taskInput.getValue().trim();
  if(!t){taskInput.setError('Escribe una tarea');return;}
  tasks.unshift({id:Date.now(),title:t,done:false,priority:'medium'});
  taskInput.setValue('');taskInput.clearError?.();
  renderTasks();
}});
new MTS.EmptyState('#task-empty',{variant:'no-data',size:'sm',title:'Sin tareas',description:'Agrega una tarea arriba para comenzar.'});

var PRIO_COLORS={high:'var(--mts-color-danger)',medium:'var(--mts-color-warning)',low:'var(--mts-color-success,#22c55e)'};
var PRIO_LABELS={high:'Alta',medium:'Media',low:'Baja'};

function renderTasks(){
  var filtered=tasks.filter(function(t){
    if(currentFilter==='pending')return !t.done;
    if(currentFilter==='done')return t.done;
    return true;
  });
  var list=document.getElementById('task-list');
  var empty=document.getElementById('task-empty');
  list.innerHTML='';
  if(!filtered.length){list.style.display='none';empty.style.display='block';}
  else{list.style.display='flex';empty.style.display='none';}
  filtered.forEach(function(task){
    var item=document.createElement('div');
    item.className='task-item'+(task.done?' done':'');
    var dot='<span style="width:8px;height:8px;border-radius:50%;background:'+PRIO_COLORS[task.priority]+';flex-shrink:0;"></span>';
    item.innerHTML='<input type="checkbox" '+(task.done?'checked':'')+' style="cursor:pointer;width:16px;height:16px;accent-color:var(--mts-color-primary);">'
      +'<span class="task-title">'+task.title+'</span>'
      +'<span class="task-meta">'+dot+'<span style="font-size:10px;color:var(--mts-text-color--muted);">'+PRIO_LABELS[task.priority]+'</span></span>'
      +'<button class="task-del" title="Eliminar">×</button>';
    item.querySelector('input').addEventListener('change',function(e){
      task.done=e.target.checked;renderTasks();
    });
    item.querySelector('.task-del').addEventListener('click',function(){
      tasks=tasks.filter(function(t){return t.id!==task.id;});renderTasks();
    });
    list.appendChild(item);
  });
  var done=tasks.filter(function(t){return t.done;}).length;
  var pct=tasks.length?Math.round(done/tasks.length*100):0;
  progBar.setValue(pct);
  progBar._labelEl&&(progBar._labelEl.textContent='Progreso del día — '+done+' de '+tasks.length+' completadas');
}
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.task-filter').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderTasks();
}
renderTasks();

</script>
</body>
</html>
