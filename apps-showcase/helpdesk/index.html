<style>
*{box-sizing:border-box}
body{background:var(--mts-bg-body);color:var(--mts-text-color--primary);font-family:var(--mts-font-family);margin:0;min-height:100vh;}
.app-topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;background:var(--mts-bg-surface);border-bottom:1px solid var(--mts-border-color);position:sticky;top:0;z-index:100;}
.app-topbar-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mts-text-color--muted);cursor:pointer;padding:4px 8px;border-radius:var(--mts-radius-md);border:none;background:none;transition:color .15s,background .15s;font-family:var(--mts-font-family);}
.app-topbar-back:hover{color:var(--mts-text-color--primary);background:var(--mts-bg-surface-2);}
.app-topbar-title{font-size:14px;font-weight:700;color:var(--mts-text-color--primary);flex:1;}
.app-topbar-badge{font-size:10px;padding:2px 8px;border-radius:var(--mts-radius-full);background:var(--mts-color-primary-light);color:var(--mts-color-primary);font-weight:700;}
.app-content{padding:24px;max-width:1100px;margin:0 auto;}
.app-card{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:24px;}
.app-section{display:flex;flex-direction:column;gap:20px;}
.app-grid{display:grid;gap:16px;}
.app-grid-2{grid-template-columns:1fr 1fr;}
.app-grid-3{grid-template-columns:1fr 1fr 1fr;}
.app-grid-4{grid-template-columns:repeat(4,1fr);}
.app-h2{font-size:18px;font-weight:800;margin:0 0 4px;}
.app-h2 span{color:var(--mts-color-primary);}
.app-sub{font-size:13px;color:var(--mts-text-color--muted);margin:0 0 20px;}
.app-divider{border:none;border-top:1px solid var(--mts-border-color);margin:20px 0;}
.app-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mts-text-color--muted);margin-bottom:6px;}
.app-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.app-theme{position:fixed;bottom:16px;right:16px;display:flex;gap:4px;z-index:999;}
.app-theme-btn{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:var(--mts-bg-surface);color:var(--mts-text-color--secondary);}
.app-theme-btn:hover{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.app-grid-2,.app-grid-3,.app-grid-4{grid-template-columns:1fr;}}
</style>

<body>
<div class="app-topbar"><span id="hd-back"></span><span class="app-topbar-title">Help Desk</span><span class="app-topbar-badge">Helpdesk</span></div>
<style>
.hd-content{padding:20px 24px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
.hd-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.hd-table{width:100%;border-collapse:collapse;font-size:13px;}
.hd-table th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mts-text-color--muted);background:var(--mts-bg-surface-2);border-bottom:1px solid var(--mts-border-color);}
.hd-table td{padding:12px 14px;border-bottom:1px solid var(--mts-border-color);vertical-align:middle;}
.hd-table tr:hover td{background:var(--mts-bg-surface);cursor:pointer;}
.hd-subject{font-weight:600;}
.hd-user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mts-text-color--muted);}
.hd-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.hd-stat{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:16px;}
.hd-stat-val{font-size:28px;font-weight:800;margin-bottom:2px;}
.hd-stat-lbl{font-size:11px;color:var(--mts-text-color--muted);}
.hd-stat-val--warn{color:var(--mts-color-warning);}
.hd-stat-val--primary{color:var(--mts-color-primary);}
.hd-stat-val--success{color:var(--mts-color-success);}
.hd-toolbar-title{font-size:15px;font-weight:700;}
.hd-spacer{flex:1;}
.hd-filter{width:160px;}
.hd-table-card{padding:0;overflow:hidden;}
.hd-td-id{font-size:11px;color:var(--mts-text-color--muted);font-weight:600;}
.hd-td-muted{font-size:12px;color:var(--mts-text-color--muted);}
.hd-td-muted-sm{font-size:11px;color:var(--mts-text-color--muted);}
.hd-avatar{width:22px;height:22px;border-radius:50%;background:var(--mts-color-primary);color:var(--mts-color-primary-text);font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.hd-modal-form{display:flex;flex-direction:column;gap:14px;}
.hd-detail{display:flex;flex-direction:column;gap:20px;font-size:13px;}
.hd-detail-row{display:flex;gap:16px;flex-wrap:wrap;}
.hd-field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mts-text-color--muted);margin-bottom:6px;}
.hd-field-val{font-weight:600;}
.hd-drawer-footer{display:flex;gap:8px;}
</style>
<div class="hd-content">
  <!-- Stats -->
  <div class="hd-stats">
    <div class="hd-stat"><div class="hd-stat-val">47</div><div class="hd-stat-lbl">Total tickets</div></div>
    <div class="hd-stat"><div class="hd-stat-val hd-stat-val--warn">12</div><div class="hd-stat-lbl">Unassigned</div></div>
    <div class="hd-stat"><div class="hd-stat-val hd-stat-val--primary">18</div><div class="hd-stat-lbl">In progress</div></div>
    <div class="hd-stat"><div class="hd-stat-val hd-stat-val--success">17</div><div class="hd-stat-lbl">Resolved today</div></div>
  </div>
  <!-- Toolbar -->
  <div class="hd-toolbar">
    <span class="hd-toolbar-title">Recent tickets</span>
    <span class="hd-spacer"></span>
    <div id="hd-filter-sel" class="hd-filter"></div>
    <div id="hd-btn-nuevo"></div>
  </div>
  <!-- Tabla -->
  <div class="app-card hd-table-card">
    <table class="hd-table">
      <thead><tr>
        <th>#</th><th>Subject</th><th>User</th><th>Status</th><th>Priority</th><th>Assigned</th><th>Created</th>
      </tr></thead>
      <tbody id="hd-tbody"></tbody>
    </table>
  </div>
</div>
<script>
function goBack(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'closeApp'},'*');return;}}catch(e){}window.history.back();}
new MTS.Button('#hd-back',{label:'← Back',variant:'ghost',size:'sm',onClick:goBack});
</script>
<script>

var TICKETS=[
  {id:1048,subject:'Error uploading PDF files',       user:'María Torres', status:'open',     priority:'high',   agent:'Carlos R.',   created:'10 min ago'},
  {id:1047,subject:'Cannot access the module',        user:'Juan Martínez',status:'progress', priority:'high',   agent:'Ana López',   created:'25 min ago'},
  {id:1046,subject:'New feature request',             user:'Rosa Silva',  status:'open',     priority:'medium', agent:'—',           created:'1h ago'},
  {id:1045,subject:'404 error on dashboard',          user:'Pedro Díaz',  status:'progress', priority:'medium', agent:'Luis G.',     created:'2h ago'},
  {id:1044,subject:'Problem with Excel export',       user:'Sofía Castro',status:'resolved', priority:'low',    agent:'Carlos R.',   created:'3h ago'},
  {id:1043,subject:'Update billing information',      user:'Diego Herrera',status:'open',    priority:'low',    agent:'—',           created:'4h ago'},
  {id:1042,subject:'Double charge on subscription',   user:'Valentina L.', status:'progress',priority:'high',   agent:'Ana López',   created:'Yesterday'},
  {id:1041,subject:'Mobile app closes by itself',     user:'Andrés Muñoz', status:'resolved',priority:'medium', agent:'Luis G.',     created:'Yesterday'},
];
var STATUS_MAP={open:{label:'Open',v:'warning'},progress:{label:'In progress',v:'info'},resolved:{label:'Resolved',v:'success'}};
var PRIO_MAP={high:{label:'High',v:'danger'},medium:{label:'Medium',v:'warning'},low:{label:'Low',v:'default'}};

new MTS.Select('#hd-filter-sel',{placeholder:'Filter by status...',clearable:true,options:[
  {value:'open',label:'Open'},{value:'progress',label:'In progress'},{value:'resolved',label:'Resolved'},
],onSelect:function(e){renderTickets(e.detail.value);}});

var hdModal=null;
new MTS.Button('#hd-btn-nuevo',{label:'+ New ticket',variant:'primary',size:'sm',onClick:function(){
  if(!hdModal){
    hdModal=new MTS.Modal({
      title:'New support ticket',
      body:'<div class="hd-modal-form">'
        +'<div id="hd-m-subject"></div>'
        +'<div id="hd-m-desc"></div>'
        +'<div id="hd-m-prio"></div>'
        +'</div>',
      buttons:[
        {label:'Cancel',variant:'ghost',close:true},
        {label:'Create ticket',variant:'primary',close:true,onClick:function(){MTS.Toast.show({variant:'success',message:'Demo: ticket created'});}}
      ],
      onShow:function(){
        setTimeout(function(){
          new MTS.Input('#hd-m-subject',{label:'Subject',placeholder:'Briefly describe the problem'});
          new MTS.Input('#hd-m-desc',{type:'textarea',label:'Description',placeholder:'Provide problem details...',rows:3});
          new MTS.Select('#hd-m-prio',{label:'Priority',options:[{value:'low',label:'Low'},{value:'medium',label:'Medium'},{value:'high',label:'High'}],value:'medium'});
        },50);
      }
    });
  }
  hdModal.show();
}});

function renderTickets(filter){
  var list=filter?TICKETS.filter(function(t){return t.status===filter;}):TICKETS;
  var tbody=document.getElementById('hd-tbody');
  tbody.innerHTML='';
  list.forEach(function(t){
    var sm=STATUS_MAP[t.status];var pm=PRIO_MAP[t.priority];
    var tr=document.createElement('tr');
    tr.innerHTML='<td class="hd-td-id">#'+t.id+'</td>'
      +'<td class="hd-subject">'+t.subject+'</td>'
      +'<td class="hd-user"><span class="hd-avatar">'+t.user.split(' ').map(function(x){return x[0];}).join('')+'</span>'+t.user+'</td>'
      +'<td><span class="mts-badge mts-badge--'+sm.v+'">'+sm.label+'</span></td>'
      +'<td><span class="mts-badge mts-badge--'+pm.v+'">'+pm.label+'</span></td>'
      +'<td class="hd-td-muted">'+t.agent+'</td>'
      +'<td class="hd-td-muted-sm">'+t.created+'</td>';
    tr.addEventListener('click',function(){openTicket(t);});
    tbody.appendChild(tr);
  });
}

var ticketDrawer=null;
function openTicket(t){
  var sm=STATUS_MAP[t.status];var pm=PRIO_MAP[t.priority];
  var content='<div class="hd-detail">'
    +'<div><div class="hd-field-label">SUBJECT</div>'
    +'<div class="hd-field-val">'+t.subject+'</div></div>'
    +'<div class="hd-detail-row">'
    +'<div><div class="hd-field-label">STATUS</div>'
    +'<span class="mts-badge mts-badge--'+sm.v+'">'+sm.label+'</span></div>'
    +'<div><div class="hd-field-label">PRIORITY</div>'
    +'<span class="mts-badge mts-badge--'+pm.v+'">'+pm.label+'</span></div>'
    +'<div><div class="hd-field-label">USER</div>'
    +'<span>'+t.user+'</span></div></div>'
    +'<div><div class="hd-field-label">HISTORY</div>'
    +'<div id="ticket-tl-'+t.id+'"></div></div>'
    +'</div>';

  if(!ticketDrawer){
    ticketDrawer=new MTS.Drawer({position:'right',size:'md',title:'Ticket #'+t.id,content:content,
      footer:'<div class="hd-drawer-footer"><button class="mts-btn mts-btn--primary mts-btn--sm" onclick="ticketDrawer.hide()">Close ticket</button><button class="mts-btn mts-btn--ghost mts-btn--sm" onclick="ticketDrawer.hide()">Assign</button></div>'
    });
  } else {
    ticketDrawer.title=t.id;
    var bd=ticketDrawer._bodyEl;
    if(bd)bd.innerHTML=content;
  }
  ticketDrawer.show();
  setTimeout(function(){
    var tlEl=document.getElementById('ticket-tl-'+t.id);
    if(!tlEl)return;
    new MTS.Timeline(tlEl,{direction:'vertical',align:'left',events:[
      {id:'ev1',title:'Ticket opened',date:t.created,badge:{label:'Open',variant:'warning'}},
      {id:'ev2',title:'Assigned to '+t.agent,date:'5 min ago',badge:{label:'Assigned',variant:'info'}},
    ]});
  },100);
}

renderTickets();

</script>
</body>
