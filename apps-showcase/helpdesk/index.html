<!DOCTYPE html>
<html lang="es" data-mts-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mesa de Ayuda — Matios UI</title>
  <script>(function(){var m=(location.hash||"").match(/mts-theme=([a-z-]+)/);if(m)document.documentElement.setAttribute("data-mts-theme",m[1]);try{var p=window.parent;if(p&&p!==window){var pt=p.currentThemeVal||p.document.documentElement.getAttribute("data-mts-theme");if(pt)document.documentElement.setAttribute("data-mts-theme",pt);}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-high-contrast.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-modal/matios-ui-modal.css">
  <link rel="stylesheet" href="../../display/matios-ui-avatar/matios-ui-avatar.css">
  <link rel="stylesheet" href="../../display/matios-ui-timeline/matios-ui-timeline.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-drawer/matios-ui-drawer.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../forms/matios-ui-select/matios-ui-select.css">
  <script src="../../overlays/matios-ui-modal/matios-ui-modal.js"></script>
  <script src="../../display/matios-ui-avatar/matios-ui-avatar.js"></script>
  <script src="../../display/matios-ui-timeline/matios-ui-timeline.js"></script>
  <script src="../../navigation/matios-ui-drawer/matios-ui-drawer.js"></script>
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../forms/matios-ui-select/matios-ui-select.js"></script>
<style>
*{box-sizing:border-box}
body{background:var(--mts-bg-body);color:var(--mts-text-color--primary);font-family:var(--mts-font-family);margin:0;min-height:100vh;}
.app-topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;background:var(--mts-bg-surface);border-bottom:1px solid var(--mts-border-color);position:sticky;top:0;z-index:100;}
.app-topbar-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mts-text-color--muted);cursor:pointer;padding:4px 8px;border-radius:var(--mts-radius-md);border:none;background:none;transition:color .15s,background .15s;font-family:var(--mts-font-family);}
.app-topbar-back:hover{color:var(--mts-text-color--primary);background:var(--mts-bg-surface-2);}
.app-topbar-title{font-size:14px;font-weight:700;color:var(--mts-text-color--primary);flex:1;}
.app-topbar-badge{font-size:10px;padding:2px 8px;border-radius:var(--mts-radius-full);background:var(--mts-color-primary-light);color:var(--mts-color-primary);font-weight:700;}
.app-content{padding:24px;max-width:1100px;margin:0 auto;}
.app-card{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:24px;}
.app-section{display:flex;flex-direction:column;gap:20px;}
.app-grid{display:grid;gap:16px;}
.app-grid-2{grid-template-columns:1fr 1fr;}
.app-grid-3{grid-template-columns:1fr 1fr 1fr;}
.app-grid-4{grid-template-columns:repeat(4,1fr);}
.app-h2{font-size:18px;font-weight:800;margin:0 0 4px;}
.app-h2 span{color:var(--mts-color-primary);}
.app-sub{font-size:13px;color:var(--mts-text-color--muted);margin:0 0 20px;}
.app-divider{border:none;border-top:1px solid var(--mts-border-color);margin:20px 0;}
.app-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mts-text-color--muted);margin-bottom:6px;}
.app-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.app-theme{position:fixed;bottom:16px;right:16px;display:flex;gap:4px;z-index:999;}
.app-theme-btn{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:var(--mts-bg-surface);color:var(--mts-text-color--secondary);}
.app-theme-btn:hover{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.app-grid-2,.app-grid-3,.app-grid-4{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app-topbar"><button class="app-topbar-back" onclick="goBack()">&#8592; Volver</button><span class="app-topbar-title">Mesa de Ayuda</span><span class="app-topbar-badge">Helpdesk</span></div>
<style>
.hd-content{padding:20px 24px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
.hd-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.hd-table{width:100%;border-collapse:collapse;font-size:13px;}
.hd-table th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mts-text-color--muted);background:var(--mts-bg-surface-2);border-bottom:1px solid var(--mts-border-color);}
.hd-table td{padding:12px 14px;border-bottom:1px solid var(--mts-border-color);vertical-align:middle;}
.hd-table tr:hover td{background:var(--mts-bg-surface);cursor:pointer;}
.hd-subject{font-weight:600;}
.hd-user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mts-text-color--muted);}
.hd-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.hd-stat{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:16px;}
.hd-stat-val{font-size:28px;font-weight:800;margin-bottom:2px;}
.hd-stat-lbl{font-size:11px;color:var(--mts-text-color--muted);}
</style>
<div class="hd-content">
  <!-- Stats -->
  <div class="hd-stats">
    <div class="hd-stat"><div class="hd-stat-val">47</div><div class="hd-stat-lbl">Tickets totales</div></div>
    <div class="hd-stat"><div class="hd-stat-val" style="color:var(--mts-color-warning);">12</div><div class="hd-stat-lbl">Sin asignar</div></div>
    <div class="hd-stat"><div class="hd-stat-val" style="color:var(--mts-color-primary);">18</div><div class="hd-stat-lbl">En progreso</div></div>
    <div class="hd-stat"><div class="hd-stat-val" style="color:var(--mts-color-success,#22c55e);">17</div><div class="hd-stat-lbl">Resueltos hoy</div></div>
  </div>
  <!-- Toolbar -->
  <div class="hd-toolbar">
    <span style="font-size:15px;font-weight:700;">Tickets recientes</span>
    <span style="flex:1;"></span>
    <div id="hd-filter-sel" style="width:160px;"></div>
    <div id="hd-btn-nuevo"></div>
  </div>
  <!-- Tabla -->
  <div class="app-card" style="padding:0;overflow:hidden;">
    <table class="hd-table">
      <thead><tr>
        <th>#</th><th>Asunto</th><th>Usuario</th><th>Estado</th><th>Prioridad</th><th>Asignado</th><th>Creado</th>
      </tr></thead>
      <tbody id="hd-tbody"></tbody>
    </table>
  </div>
</div><div class="app-theme">
  <button class="app-theme-btn" onclick="setTheme('dark')">Dark</button>
  <button class="app-theme-btn" onclick="setTheme('light')">Light</button>
  <button class="app-theme-btn" onclick="setTheme('violet')">Violet</button>
  <button class="app-theme-btn" onclick="setTheme('blue')">Blue</button>
</div>
<script>
function setTheme(t){document.documentElement.setAttribute('data-mts-theme',t);try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'setTheme',theme:t},'*');}catch(e){}}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='setTheme')document.documentElement.setAttribute('data-mts-theme',e.data.theme);});
function goBack(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'closeApp'},'*');return;}}catch(e){}window.history.back();}
</script>
<script>

var TICKETS=[
  {id:1048,subject:'Error al subir archivos PDF',    user:'María Torres', status:'open',     priority:'high',   agent:'Carlos R.',   created:'Hace 10 min'},
  {id:1047,subject:'No puedo acceder al módulo',      user:'Juan Martínez',status:'progress', priority:'high',   agent:'Ana López',   created:'Hace 25 min'},
  {id:1046,subject:'Solicitud de nueva funcionalidad',user:'Rosa Silva',  status:'open',     priority:'medium', agent:'—',           created:'Hace 1h'},
  {id:1045,subject:'Error 404 en dashboard',          user:'Pedro Díaz',  status:'progress', priority:'medium', agent:'Luis G.',     created:'Hace 2h'},
  {id:1044,subject:'Problema con exportación Excel',  user:'Sofía Castro',status:'resolved', priority:'low',    agent:'Carlos R.',   created:'Hace 3h'},
  {id:1043,subject:'Actualizar datos de facturación', user:'Diego Herrera',status:'open',    priority:'low',    agent:'—',           created:'Hace 4h'},
  {id:1042,subject:'Doble cobro en suscripción',      user:'Valentina L.', status:'progress',priority:'high',   agent:'Ana López',   created:'Ayer'},
  {id:1041,subject:'App mobile se cierra sola',       user:'Andrés Muñoz', status:'resolved',priority:'medium', agent:'Luis G.',     created:'Ayer'},
];
var STATUS_MAP={open:{label:'Abierto',v:'warning'},progress:{label:'En progreso',v:'info'},resolved:{label:'Resuelto',v:'success'}};
var PRIO_MAP={high:{label:'Alta',v:'danger'},medium:{label:'Media',v:'warning'},low:{label:'Baja',v:'default'}};

new MTS.Select('#hd-filter-sel',{placeholder:'Filtrar por estado...',clearable:true,options:[
  {value:'open',label:'Abiertos'},{value:'progress',label:'En progreso'},{value:'resolved',label:'Resueltos'},
],onSelect:function(e){renderTickets(e.detail.value);}});

var hdModal=null;
new MTS.Button('#hd-btn-nuevo',{label:'+ Nuevo ticket',variant:'primary',size:'sm',onClick:function(){
  if(!hdModal){
    hdModal=new MTS.Modal({
      title:'Nuevo ticket de soporte',
      body:'<div style="display:flex;flex-direction:column;gap:14px;">'
        +'<div id="hd-m-subject"></div>'
        +'<div id="hd-m-desc"></div>'
        +'<div id="hd-m-prio"></div>'
        +'</div>',
      buttons:[
        {label:'Cancelar',variant:'ghost',close:true},
        {label:'Crear ticket',variant:'primary',close:true,onClick:function(){alert('Demo: ticket creado');}}
      ],
      onShow:function(){
        setTimeout(function(){
          new MTS.Input('#hd-m-subject',{label:'Asunto',placeholder:'Describe el problema brevemente'});
          new MTS.Input('#hd-m-desc',{type:'textarea',label:'Descripción',placeholder:'Detalla el problema...',rows:3});
          new MTS.Select('#hd-m-prio',{label:'Prioridad',options:[{value:'low',label:'Baja'},{value:'medium',label:'Media'},{value:'high',label:'Alta'}],value:'medium'});
        },50);
      }
    });
  }
  hdModal.show();
}});

function renderTickets(filter){
  var list=filter?TICKETS.filter(function(t){return t.status===filter;}):TICKETS;
  var tbody=document.getElementById('hd-tbody');
  tbody.innerHTML='';
  list.forEach(function(t){
    var sm=STATUS_MAP[t.status];var pm=PRIO_MAP[t.priority];
    var tr=document.createElement('tr');
    tr.innerHTML='<td style="font-size:11px;color:var(--mts-text-color--muted);font-weight:600;">#'+t.id+'</td>'
      +'<td class="hd-subject">'+t.subject+'</td>'
      +'<td class="hd-user"><span style="width:22px;height:22px;border-radius:50%;background:var(--mts-color-primary);color:var(--mts-color-primary-text);font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;">'+t.user.split(' ').map(function(x){return x[0];}).join('')+'</span>'+t.user+'</td>'
      +'<td><span class="mts-badge mts-badge--'+sm.v+'">'+sm.label+'</span></td>'
      +'<td><span class="mts-badge mts-badge--'+pm.v+'">'+pm.label+'</span></td>'
      +'<td style="font-size:12px;color:var(--mts-text-color--muted);">'+t.agent+'</td>'
      +'<td style="font-size:11px;color:var(--mts-text-color--muted);">'+t.created+'</td>';
    tr.addEventListener('click',function(){openTicket(t);});
    tbody.appendChild(tr);
  });
}

var ticketDrawer=null;
function openTicket(t){
  var sm=STATUS_MAP[t.status];var pm=PRIO_MAP[t.priority];
  var content='<div style="display:flex;flex-direction:column;gap:20px;font-size:13px;">'
    +'<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mts-text-color--muted);margin-bottom:6px;">ASUNTO</div>'
    +'<div style="font-weight:600;">'+t.subject+'</div></div>'
    +'<div style="display:flex;gap:16px;flex-wrap:wrap;">'
    +'<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mts-text-color--muted);margin-bottom:4px;">ESTADO</div>'
    +'<span class="mts-badge mts-badge--'+sm.v+'">'+sm.label+'</span></div>'
    +'<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mts-text-color--muted);margin-bottom:4px;">PRIORIDAD</div>'
    +'<span class="mts-badge mts-badge--'+pm.v+'">'+pm.label+'</span></div>'
    +'<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mts-text-color--muted);margin-bottom:4px;">USUARIO</div>'
    +'<span>'+t.user+'</span></div></div>'
    +'<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mts-text-color--muted);margin-bottom:8px;">HISTORIAL</div>'
    +'<div id="ticket-tl-'+t.id+'"></div></div>'
    +'</div>';

  if(!ticketDrawer){
    ticketDrawer=new MTS.Drawer({position:'right',size:'md',title:'Ticket #'+t.id,content:content,
      footer:'<div style="display:flex;gap:8px;"><button class="mts-btn mts-btn--primary mts-btn--sm" onclick="ticketDrawer.hide()">Cerrar ticket</button><button class="mts-btn mts-btn--ghost mts-btn--sm" onclick="ticketDrawer.hide()">Asignar</button></div>'
    });
  } else {
    ticketDrawer.title=t.id;
    var bd=ticketDrawer._bodyEl;
    if(bd)bd.innerHTML=content;
  }
  ticketDrawer.show();
  setTimeout(function(){
    var tlEl=document.getElementById('ticket-tl-'+t.id);
    if(!tlEl)return;
    new MTS.Timeline(tlEl,{direction:'vertical',align:'left',events:[
      {id:'ev1',title:'Ticket abierto',date:t.created,badge:{label:'Abierto',variant:'warning'}},
      {id:'ev2',title:'Asignado a '+t.agent,date:'Hace 5 min',badge:{label:'Asignado',variant:'info'}},
    ]});
  },100);
}

renderTickets();

</script>
</body>
</html>
