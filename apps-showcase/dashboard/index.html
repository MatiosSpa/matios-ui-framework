<style>
*{box-sizing:border-box}
body{background:var(--mts-bg-body);color:var(--mts-text-color--primary);font-family:var(--mts-font-family);margin:0;min-height:100vh;}
.app-topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;background:var(--mts-bg-surface);border-bottom:1px solid var(--mts-border-color);position:sticky;top:0;z-index:100;}
.app-topbar-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mts-text-color--muted);cursor:pointer;padding:4px 8px;border-radius:var(--mts-radius-md);border:none;background:none;transition:color .15s,background .15s;font-family:var(--mts-font-family);}
.app-topbar-back:hover{color:var(--mts-text-color--primary);background:var(--mts-bg-surface-2);}
.app-topbar-title{font-size:14px;font-weight:700;color:var(--mts-text-color--primary);flex:1;}
.app-topbar-badge{font-size:10px;padding:2px 8px;border-radius:var(--mts-radius-full);background:var(--mts-color-primary-light);color:var(--mts-color-primary);font-weight:700;}
.app-content{padding:24px;max-width:1100px;margin:0 auto;}
.app-card{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:24px;}
.app-section{display:flex;flex-direction:column;gap:20px;}
.app-grid{display:grid;gap:16px;}
.app-grid-2{grid-template-columns:1fr 1fr;}
.app-grid-3{grid-template-columns:1fr 1fr 1fr;}
.app-grid-4{grid-template-columns:repeat(4,1fr);}
.app-h2{font-size:18px;font-weight:800;margin:0 0 4px;}
.app-h2 span{color:var(--mts-color-primary);}
.app-sub{font-size:13px;color:var(--mts-text-color--muted);margin:0 0 20px;}
.app-divider{border:none;border-top:1px solid var(--mts-border-color);margin:20px 0;}
.app-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mts-text-color--muted);margin-bottom:6px;}
.app-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.app-theme{position:fixed;bottom:16px;right:16px;display:flex;gap:4px;z-index:999;}
.app-theme-btn{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:var(--mts-bg-surface);color:var(--mts-text-color--secondary);}
.app-theme-btn:hover{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.app-grid-2,.app-grid-3,.app-grid-4{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app-topbar"><span id="dash-back"></span><span class="app-topbar-title">Dashboard</span><span class="app-topbar-badge">Metrics</span></div>
<style>
.dash-content{padding:20px 24px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:24px;}
.dash-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.dash-table{width:100%;border-collapse:collapse;font-size:13px;}
.dash-table th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mts-text-color--muted);background:var(--mts-bg-surface-2);border-bottom:1px solid var(--mts-border-color);}
.dash-table td{padding:10px 12px;border-bottom:1px solid var(--mts-border-color);vertical-align:middle;}
.dash-table tr:last-child td{border-bottom:none;}
.dash-table tr:hover td{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.dash-row{grid-template-columns:1fr;}}
.dash-greeting{display:flex;align-items:center;gap:12px;}
.dash-greeting-title{font-size:18px;font-weight:800;}
.dash-greeting-sub{font-size:13px;color:var(--mts-text-color--muted);}
.dash-card-label{margin-bottom:14px;}
.dash-status-list{display:flex;flex-direction:column;gap:16px;}
.dash-td-name{font-weight:600;}
.dash-td-muted{font-size:12px;color:var(--mts-text-color--muted);}
.dash-progress-td{min-width:120px;}
.dash-progress-cell{display:flex;align-items:center;gap:8px;}
.dash-progress-track{flex:1;height:6px;background:var(--mts-border-color);border-radius:3px;overflow:hidden;}
.dash-progress-fill{height:100%;background:var(--mts-color-primary);border-radius:3px;}
.dash-progress-pct{font-size:11px;color:var(--mts-text-color--muted);white-space:nowrap;}
.dash-team{display:flex;align-items:center;padding-left:6px;}
.dash-team-avatar{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--mts-color-primary);color:var(--mts-color-primary-text);font-size:9px;font-weight:700;align-items:center;justify-content:center;margin-right:-6px;border:2px solid var(--mts-bg-surface);}
</style>
<div class="dash-content">
  <!-- Greeting -->
  <div class="dash-greeting">
    <div id="dash-av"></div>
    <div>
      <div class="dash-greeting-title">Good morning, Juan 👋</div>
      <div class="dash-greeting-sub">Monday, March 30, 2026</div>
    </div>
  </div>

  <!-- KPIs -->
  <div class="dash-kpis">
    <div id="kpi-1"></div><div id="kpi-2"></div>
    <div id="kpi-3"></div><div id="kpi-4"></div>
  </div>

  <!-- Main row -->
  <div class="dash-row">
    <!-- Recent activity -->
    <div class="app-card">
      <div class="app-label dash-card-label">Recent activity</div>
      <div id="dash-timeline"></div>
    </div>
    <!-- Service status -->
    <div class="app-card">
      <div class="app-label dash-card-label">Service status</div>
      <div class="dash-status-list">
        <div id="prog-api"></div>
        <div id="prog-db"></div>
        <div id="prog-cdn"></div>
        <div id="prog-queue"></div>
      </div>
    </div>
  </div>

  <!-- Recent projects table -->
  <div class="app-card">
    <div class="app-label dash-card-label">Recent projects</div>
    <table class="dash-table">
      <thead><tr>
        <th>Project</th><th>Status</th><th>Progress</th><th>Team</th><th>Due</th>
      </tr></thead>
      <tbody id="dash-projects"></tbody>
    </table>
  </div>
</div>
<script>
function goBack(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'closeApp'},'*');return;}}catch(e){}window.history.back();}
new MTS.Button('#dash-back',{label:'← Back',variant:'ghost',size:'sm',onClick:goBack});
</script>
<script>

new MTS.Avatar('#dash-av',{name:'Juan Pérez',size:'lg',status:'online'});

new MTS.KPICard('#kpi-1',{label:'Monthly revenue',value:'$84,320',unit:'',trend:12.5,trendLabel:'vs last month',sparkline:[42,38,55,60,48,72,65,84],variant:'success',onClick:function(){}});
new MTS.KPICard('#kpi-2',{label:'Active users',value:'3,842',trend:8.3,trendLabel:'vs last week',sparkline:[90,85,92,88,95,91,98,100],variant:'primary'});
new MTS.KPICard('#kpi-3',{label:'Active projects',value:'24',trend:-2.1,trendLabel:'vs yesterday',sparkline:[28,25,27,26,24,23,24,24],variant:'warning'});
new MTS.KPICard('#kpi-4',{label:'Open tickets',value:'7',trend:41.0,trendLabel:'last 24h',sparkline:[2,1,3,2,4,5,6,7],variant:'danger'});

new MTS.Timeline('#dash-timeline',{
  direction:'vertical',align:'left',
  events:[
    {id:'t1',title:'New user registered',date:'5 min ago',badge:{label:'New',variant:'success'}},
    {id:'t2',title:'Deploy completed — v2.1.4',date:'1h ago',badge:{label:'Deploy',variant:'primary'}},
    {id:'t3',title:'Automatic backup run',date:'3h ago',badge:{label:'System',variant:'default'}},
    {id:'t4',title:'Error 500 in API /payments',date:'4h ago',badge:{label:'Error',variant:'danger'}},
    {id:'t5',title:'Monthly report generated',date:'Yesterday 09:00',badge:{label:'Report',variant:'info'}},
  ],
});

new MTS.Progress('#prog-api',   {value:99,label:'Main API',        showLabel:true,showValue:true,variant:'success'});
new MTS.Progress('#prog-db',    {value:87,label:'Database',        showLabel:true,showValue:true,variant:'success'});
new MTS.Progress('#prog-cdn',   {value:62,label:'CDN / Storage',   showLabel:true,showValue:true,variant:'warning'});
new MTS.Progress('#prog-queue', {value:34,label:'Job queue',       showLabel:true,showValue:true,variant:'danger'});

var PROJECTS=[
  {name:'Customer Portal',status:'In progress', statusV:'info',   progress:68, team:['Juan P.','María A.','Carlos R.'], due:'Apr 15'},
  {name:'App Mobile v2',  status:'In review',   statusV:'warning',progress:91, team:['Ana T.','Pedro D.'],              due:'Apr 05'},
  {name:'API Gateway',    status:'Completed',   statusV:'success',progress:100,team:['Rosa M.'],                        due:'Mar 28'},
  {name:'Dashboard BI',   status:'Paused',      statusV:'default',progress:42, team:['Luis G.','Sofía C.'],             due:'May 30'},
];
var tbody=document.getElementById('dash-projects');
PROJECTS.forEach(function(p){
  var tr=document.createElement('tr');
  var avatarsHtml=p.team.slice(0,3).map(function(n){
    var ini=n.split(' ').map(function(x){return x[0];}).join('').toUpperCase();
    return '<span class="dash-team-avatar">'+ini+'</span>';
  }).join('');
  tr.innerHTML='<td class="dash-td-name">'+p.name+'</td>'
    +'<td><span class="mts-badge mts-badge--'+p.statusV+'">'+p.status+'</span></td>'
    +'<td class="dash-progress-td"><div class="dash-progress-cell"><div class="dash-progress-track"><div class="dash-progress-fill" style="width:'+p.progress+'%"></div></div><span class="dash-progress-pct">'+p.progress+'%</span></div></td>'
    +'<td><div class="dash-team">'+avatarsHtml+'</div></td>'
    +'<td class="dash-td-muted">'+p.due+'</td>';
  tbody.appendChild(tr);
});

</script>
</body>
</html>
