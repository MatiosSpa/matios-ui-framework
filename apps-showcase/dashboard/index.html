<!DOCTYPE html>
<html lang="es" data-mts-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — Matios UI</title>
  <script>(function(){var m=(location.hash||"").match(/mts-theme=([a-z-]+)/);if(m)document.documentElement.setAttribute("data-mts-theme",m[1]);try{var p=window.parent;if(p&&p!==window){var pt=p.currentThemeVal||p.document.documentElement.getAttribute("data-mts-theme");if(pt)document.documentElement.setAttribute("data-mts-theme",pt);}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-theme-high-contrast.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <link rel="stylesheet" href="../../display/matios-ui-kpicard/matios-ui-kpicard.css">
  <link rel="stylesheet" href="../../display/matios-ui-avatar/matios-ui-avatar.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-progress/matios-ui-progress.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../display/matios-ui-timeline/matios-ui-timeline.css">
  <script src="../../display/matios-ui-kpicard/matios-ui-kpicard.js"></script>
  <script src="../../display/matios-ui-avatar/matios-ui-avatar.js"></script>
  <script src="../../overlays/matios-ui-progress/matios-ui-progress.js"></script>
  <script src="../../display/matios-ui-timeline/matios-ui-timeline.js"></script>
<style>
*{box-sizing:border-box}
body{background:var(--mts-bg-body);color:var(--mts-text-color--primary);font-family:var(--mts-font-family);margin:0;min-height:100vh;}
.app-topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;background:var(--mts-bg-surface);border-bottom:1px solid var(--mts-border-color);position:sticky;top:0;z-index:100;}
.app-topbar-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mts-text-color--muted);cursor:pointer;padding:4px 8px;border-radius:var(--mts-radius-md);border:none;background:none;transition:color .15s,background .15s;font-family:var(--mts-font-family);}
.app-topbar-back:hover{color:var(--mts-text-color--primary);background:var(--mts-bg-surface-2);}
.app-topbar-title{font-size:14px;font-weight:700;color:var(--mts-text-color--primary);flex:1;}
.app-topbar-badge{font-size:10px;padding:2px 8px;border-radius:var(--mts-radius-full);background:var(--mts-color-primary-light);color:var(--mts-color-primary);font-weight:700;}
.app-content{padding:24px;max-width:1100px;margin:0 auto;}
.app-card{background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:24px;}
.app-section{display:flex;flex-direction:column;gap:20px;}
.app-grid{display:grid;gap:16px;}
.app-grid-2{grid-template-columns:1fr 1fr;}
.app-grid-3{grid-template-columns:1fr 1fr 1fr;}
.app-grid-4{grid-template-columns:repeat(4,1fr);}
.app-h2{font-size:18px;font-weight:800;margin:0 0 4px;}
.app-h2 span{color:var(--mts-color-primary);}
.app-sub{font-size:13px;color:var(--mts-text-color--muted);margin:0 0 20px;}
.app-divider{border:none;border-top:1px solid var(--mts-border-color);margin:20px 0;}
.app-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mts-text-color--muted);margin-bottom:6px;}
.app-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.app-theme{position:fixed;bottom:16px;right:16px;display:flex;gap:4px;z-index:999;}
.app-theme-btn{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:var(--mts-bg-surface);color:var(--mts-text-color--secondary);}
.app-theme-btn:hover{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.app-grid-2,.app-grid-3,.app-grid-4{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app-topbar"><button class="app-topbar-back" onclick="goBack()">&#8592; Volver</button><span class="app-topbar-title">Dashboard</span><span class="app-topbar-badge">Métricas</span></div>
<style>
.dash-content{padding:20px 24px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:24px;}
.dash-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.dash-table{width:100%;border-collapse:collapse;font-size:13px;}
.dash-table th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mts-text-color--muted);background:var(--mts-bg-surface-2);border-bottom:1px solid var(--mts-border-color);}
.dash-table td{padding:10px 12px;border-bottom:1px solid var(--mts-border-color);vertical-align:middle;}
.dash-table tr:last-child td{border-bottom:none;}
.dash-table tr:hover td{background:var(--mts-bg-surface-2);}
@media(max-width:640px){.dash-row{grid-template-columns:1fr;}}
</style>
<div class="dash-content">
  <!-- Saludo -->
  <div style="display:flex;align-items:center;gap:12px;">
    <div id="dash-av"></div>
    <div>
      <div style="font-size:18px;font-weight:800;">Buenos días, Juan 👋</div>
      <div style="font-size:13px;color:var(--mts-text-color--muted);">Lunes 30 de marzo, 2026</div>
    </div>
  </div>

  <!-- KPIs -->
  <div class="dash-kpis">
    <div id="kpi-1"></div><div id="kpi-2"></div>
    <div id="kpi-3"></div><div id="kpi-4"></div>
  </div>

  <!-- Fila principal -->
  <div class="dash-row">
    <!-- Actividad reciente -->
    <div class="app-card">
      <div class="app-label" style="margin-bottom:14px;">Actividad reciente</div>
      <div id="dash-timeline"></div>
    </div>
    <!-- Estado de servicios -->
    <div class="app-card">
      <div class="app-label" style="margin-bottom:16px;">Estado de servicios</div>
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div id="prog-api"></div>
        <div id="prog-db"></div>
        <div id="prog-cdn"></div>
        <div id="prog-queue"></div>
      </div>
    </div>
  </div>

  <!-- Tabla últimos proyectos -->
  <div class="app-card">
    <div class="app-label" style="margin-bottom:14px;">Proyectos recientes</div>
    <table class="dash-table">
      <thead><tr>
        <th>Proyecto</th><th>Estado</th><th>Progreso</th><th>Equipo</th><th>Vence</th>
      </tr></thead>
      <tbody id="dash-projects"></tbody>
    </table>
  </div>
</div><div class="app-theme">
  <button class="app-theme-btn" onclick="setTheme('dark')">Dark</button>
  <button class="app-theme-btn" onclick="setTheme('light')">Light</button>
  <button class="app-theme-btn" onclick="setTheme('violet')">Violet</button>
  <button class="app-theme-btn" onclick="setTheme('blue')">Blue</button>
</div>
<script>
function setTheme(t){document.documentElement.setAttribute('data-mts-theme',t);try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'setTheme',theme:t},'*');}catch(e){}}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='setTheme')document.documentElement.setAttribute('data-mts-theme',e.data.theme);});
function goBack(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'closeApp'},'*');return;}}catch(e){}window.history.back();}
</script>
<script>

new MTS.Avatar('#dash-av',{name:'Juan Pérez',size:'lg',status:'online'});

new MTS.KPICard('#kpi-1',{label:'Ingresos del mes',value:'$84,320',unit:'',trend:12.5,trendLabel:'vs mes anterior',sparkline:[42,38,55,60,48,72,65,84],variant:'success',onClick:function(){}});
new MTS.KPICard('#kpi-2',{label:'Usuarios activos',value:'3,842',trend:8.3,trendLabel:'vs semana pasada',sparkline:[90,85,92,88,95,91,98,100],variant:'primary'});
new MTS.KPICard('#kpi-3',{label:'Proyectos activos',value:'24',trend:-2.1,trendLabel:'vs ayer',sparkline:[28,25,27,26,24,23,24,24],variant:'warning'});
new MTS.KPICard('#kpi-4',{label:'Tickets abiertos',value:'7',trend:41.0,trendLabel:'últimas 24h',sparkline:[2,1,3,2,4,5,6,7],variant:'danger'});

new MTS.Timeline('#dash-timeline',{
  direction:'vertical',align:'left',
  events:[
    {id:'t1',title:'Nuevo usuario registrado',date:'Hace 5 min',badge:{label:'Nuevo',variant:'success'}},
    {id:'t2',title:'Deploy completado — v2.1.4',date:'Hace 1h',badge:{label:'Deploy',variant:'primary'}},
    {id:'t3',title:'Backup automático ejecutado',date:'Hace 3h',badge:{label:'Sistema',variant:'default'}},
    {id:'t4',title:'Error 500 en API /payments',date:'Hace 4h',badge:{label:'Error',variant:'danger'}},
    {id:'t5',title:'Informe mensual generado',date:'Ayer 09:00',badge:{label:'Reporte',variant:'info'}},
  ],
});

new MTS.Progress('#prog-api',   {value:99,label:'API Principal',   showLabel:true,showValue:true,variant:'success'});
new MTS.Progress('#prog-db',    {value:87,label:'Base de datos',   showLabel:true,showValue:true,variant:'success'});
new MTS.Progress('#prog-cdn',   {value:62,label:'CDN / Storage',   showLabel:true,showValue:true,variant:'warning'});
new MTS.Progress('#prog-queue', {value:34,label:'Cola de trabajos',showLabel:true,showValue:true,variant:'danger'});

var PROJECTS=[
  {name:'Portal Clientes',status:'En curso',   statusV:'info',   progress:68, team:['Juan P.','María A.','Carlos R.'], due:'15 Abr'},
  {name:'App Mobile v2',  status:'Revisión',   statusV:'warning',progress:91, team:['Ana T.','Pedro D.'],              due:'05 Abr'},
  {name:'API Gateway',    status:'Completado', statusV:'success',progress:100,team:['Rosa M.'],                        due:'28 Mar'},
  {name:'Dashboard BI',   status:'Pausado',    statusV:'default',progress:42, team:['Luis G.','Sofía C.'],             due:'30 May'},
];
var tbody=document.getElementById('dash-projects');
PROJECTS.forEach(function(p){
  var tr=document.createElement('tr');
  var avatarsHtml=p.team.slice(0,3).map(function(n){
    var ini=n.split(' ').map(function(x){return x[0];}).join('').toUpperCase();
    return '<span style="display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--mts-color-primary);color:var(--mts-color-primary-text);font-size:9px;font-weight:700;align-items:center;justify-content:center;margin-right:-6px;border:2px solid var(--mts-bg-surface)">'+ini+'</span>';
  }).join('');
  tr.innerHTML='<td style="font-weight:600">'+p.name+'</td>'
    +'<td><span class="mts-badge mts-badge--'+p.statusV+'">'+p.status+'</span></td>'
    +'<td style="min-width:120px"><div style="display:flex;align-items:center;gap:8px;"><div style="flex:1;height:6px;background:var(--mts-border-color);border-radius:3px;overflow:hidden;"><div style="height:100%;width:'+p.progress+'%;background:var(--mts-color-primary);border-radius:3px;"></div></div><span style="font-size:11px;color:var(--mts-text-color--muted);white-space:nowrap;">'+p.progress+'%</span></div></td>'
    +'<td><div style="display:flex;align-items:center;padding-left:6px;">'+avatarsHtml+'</div></td>'
    +'<td style="font-size:12px;color:var(--mts-text-color--muted);">'+p.due+'</td>';
  tbody.appendChild(tr);
});

</script>
</body>
</html>
