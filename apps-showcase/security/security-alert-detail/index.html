<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Security Alert Detail - Matios UI</title>
  <script>(function(){var sp=location.search||location.hash||'';var mm=sp.match(/mts-mode=([a-z-]+)/);var ma=sp.match(/mts-accent=([a-z-]+)/);if(mm)document.documentElement.setAttribute('data-mts-mode',mm[1]);if(ma)document.documentElement.setAttribute('data-mts-accent',ma[1]);try{var p=window.parent;if(p&&p!==window){var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');if(pm)document.documentElement.setAttribute('data-mts-mode',pm);if(pa)document.documentElement.setAttribute('data-mts-accent',pa);else document.documentElement.removeAttribute('data-mts-accent');}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-toast/matios-ui-toast.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../../overlays/matios-ui-toast/matios-ui-toast.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="security-alert-detail-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    new MTS.Card('#security-alert-detail-panel', {
      title: 'Alert detail',
      subtitle: 'Security incident',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex--column mts-gap-4">' +
          '<div class="mts-d-flex mts-flex--column mts-gap-2">' +
            '<div class="mts-d-flex mts-align-items--center mts-gap-2 mts-flex--wrap">' +
              MTS.Badge.html('High risk', 'danger', 'sm') +
              MTS.Badge.html('Open', 'warning', 'sm') +
            '</div>' +
            '<p class="mts-text--md mts-text-color--muted mts-m-0">The alert was triggered by a sign-in from Bogota for a user who normally operates from Santiago.</p>' +
          '</div>' +
          '<div class="mts-grid mts-grid--gap-md">' +
            '<section class="mts-surface mts-g-col-12 mts-g-col-xl-8 mts-d-flex mts-flex--column mts-gap-3">' +
              '<div>' +
                '<strong class="mts-text--md mts-text-color--primary">Incident summary</strong>' +
                '<p class="mts-text--sm mts-text-color--muted mts-mt-1 mts-mb-0">Baseline context for the alert before deciding on containment or closure.</p>' +
              '</div>' +
              '<div class="mts-grid mts-grid--gap-md">' +
                summaryCell('User', 'Camila Soto') +
                summaryCell('Location', 'Bogota, CO') +
                summaryCell('Device', 'Windows Workstation') +
                summaryCell('Method', 'SSO + 2FA') +
                summaryCell('Time', 'Yesterday, 18:10') +
                summaryCell('Primary signal', 'New location') +
              '</div>' +
            '</section>' +
            '<section class="mts-surface mts-g-col-12 mts-g-col-xl-4 mts-d-flex mts-flex--column mts-gap-3">' +
              '<div>' +
                '<strong class="mts-text--md mts-text-color--primary">Operational decision</strong>' +
                '<p class="mts-text--sm mts-text-color--muted mts-mt-1 mts-mb-0">Quick actions on the alert.</p>' +
              '</div>' +
              '<ul class="mts-d-flex mts-flex--column mts-gap-2 mts-p-0 mts-m-0">' +
                '<li class="mts-text--sm mts-text-color--secondary">Check whether there was a declared trip or VPN.</li>' +
                '<li class="mts-text--sm mts-text-color--secondary">Compare with nearby sessions from the same user.</li>' +
                '<li class="mts-text--sm mts-text-color--secondary">Contain if there is no valid context.</li>' +
              '</ul>' +
            '</section>' +
          '</div>' +
          '<section class="mts-surface mts-d-flex mts-flex--column mts-gap-3">' +
            '<div>' +
              '<strong class="mts-text--md mts-text-color--primary">Analysis</strong>' +
              '<p class="mts-text--sm mts-text-color--muted mts-mt-1 mts-mb-0">The strongest signal is the location outside the usual pattern. Although the second factor succeeded, it is worth validating context before closing the incident.</p>' +
            '</div>' +
            '<div class="mts-grid mts-grid--gap-md">' +
              analysisRow('Suggested action', 'Validate the origin with the user and review nearby sessions.') +
              analysisRow('Containment', 'Close sessions and force re-authentication if there is no valid context.') +
              analysisRow('Recommended status', 'Keep open until the origin is confirmed.') +
            '</div>' +
          '</section>' +
          '<section class="mts-surface mts-d-flex mts-flex--column mts-gap-3">' +
            '<div>' +
              '<strong class="mts-text--md mts-text-color--primary">Timeline</strong>' +
              '<p class="mts-text--sm mts-text-color--muted mts-mt-1 mts-mb-0">Nearby events to assess the risk.</p>' +
            '</div>' +
            '<div class="mts-d-flex mts-flex--column mts-gap-3">' +
              timelineRow('Yesterday, 18:10', 'Sign-in from Bogota, CO', 'SSO + 2FA completed successfully.') +
              timelineRow('Yesterday, 18:13', 'Alert opened by Security', 'A location outside the usual pattern was detected.') +
              timelineRow('Today, 08:20', 'Review pending', 'Context with the user still needs to be validated.') +
            '</div>' +
          '</section>' +
        '</div>',
      footerAlign: 'between',
      footer: [
        {
          label: 'Contain access',
          variant: 'secondary',
          icon: MTS.Icon.get('shield-check'),
          onClick: function () {
            notify('warning', 'Alert containment was simulated.');
          }
        },
        {
          label: 'Escalate',
          variant: 'ghost',
          icon: MTS.Icon.get('alert'),
          onClick: function () {
            notify('info', 'The alert was escalated to a stricter playbook.');
          }
        },
        {
          label: 'Mark safe',
          variant: 'primary',
          icon: MTS.Icon.get('check-circle'),
          onClick: function () {
            notify('success', 'The alert was closed as a valid origin.');
          }
        }
      ]
    });

    function summaryCell(label, value) {
      return '<div class="mts-g-col-12 mts-g-col-md-6 mts-g-col-xl-4"><div class="mts-surface mts-p-3 mts-d-flex mts-flex--column mts-gap-1"><span class="mts-text--xs mts-text-color--muted">' + label + '</span><strong class="mts-text--sm mts-text-color--primary">' + value + '</strong></div></div>';
    }

    function analysisRow(label, value) {
      return '<div class="mts-g-col-12 mts-g-col-md-4"><div class="mts-surface mts-p-3 mts-d-flex mts-flex--column mts-gap-1"><span class="mts-text--xs mts-text-color--muted">' + label + '</span><strong class="mts-text--sm mts-text-color--primary">' + value + '</strong></div></div>';
    }

    function timelineRow(date, title, copy) {
      return '<article class="mts-surface mts-p-3 mts-d-flex mts-flex--column mts-gap-1"><span class="mts-text--xs mts-text-color--muted">' + date + '</span><strong class="mts-text--sm mts-text-color--primary">' + title + '</strong><p class="mts-text--sm mts-text-color--secondary mts-m-0">' + copy + '</p></article>';
    }

    function notify(variant, message) {
      MTS.Toast.show({
        variant: variant,
        message: message,
        position: 'bottom-right'
      });
    }

    MTS.Icon.initAll();
  </script>
</body>
</html>
