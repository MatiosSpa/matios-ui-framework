<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Security Alert Detail - Matios UI</title>
  <script>(function(){var sp=location.search||location.hash||'';var mm=sp.match(/mts-mode=([a-z-]+)/);var ma=sp.match(/mts-accent=([a-z-]+)/);if(mm)document.documentElement.setAttribute('data-mts-mode',mm[1]);if(ma)document.documentElement.setAttribute('data-mts-accent',ma[1]);try{var p=window.parent;if(p&&p!==window){var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');if(pm)document.documentElement.setAttribute('data-mts-mode',pm);if(pa)document.documentElement.setAttribute('data-mts-accent',pa);else document.documentElement.removeAttribute('data-mts-accent');}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-toast/matios-ui-toast.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../../overlays/matios-ui-toast/matios-ui-toast.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="security-alert-detail-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    new MTS.Card('#security-alert-detail-panel', {
      title: 'Detalle de alerta',
      subtitle: 'Security incident',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex-col mts-gap-4">' +
          '<div class="mts-d-flex mts-flex-col mts-gap-2">' +
            '<div class="mts-d-flex mts-items-center mts-gap-2 mts-flex-wrap">' +
              MTS.Badge.html('Riesgo alto', 'danger', 'sm') +
              MTS.Badge.html('Abierta', 'warning', 'sm') +
            '</div>' +
            '<p class="mts-text-md mts-text-muted mts-m-0">La alerta se gatillo por un inicio de sesion desde Bogota para un usuario que normalmente opera desde Santiago.</p>' +
          '</div>' +
          '<div class="mts-grid mts-grid--gap-md">' +
            '<section class="mts-surface mts-g-col-12 mts-g-col-xl-8 mts-d-flex mts-flex-col mts-gap-3">' +
              '<div>' +
                '<strong class="mts-text-md mts-text-primary">Resumen del incidente</strong>' +
                '<p class="mts-text-sm mts-text-muted mts-mt-1 mts-mb-0">Contexto base de la alerta antes de decidir contencion o cierre.</p>' +
              '</div>' +
              '<div class="mts-grid mts-grid--gap-md">' +
                summaryCell('Usuario', 'Camila Soto') +
                summaryCell('Ubicacion', 'Bogota, CO') +
                summaryCell('Dispositivo', 'Windows Workstation') +
                summaryCell('Metodo', 'SSO + 2FA') +
                summaryCell('Hora', 'Ayer, 18:10') +
                summaryCell('Senal principal', 'Nueva ubicacion') +
              '</div>' +
            '</section>' +
            '<section class="mts-surface mts-g-col-12 mts-g-col-xl-4 mts-d-flex mts-flex-col mts-gap-3">' +
              '<div>' +
                '<strong class="mts-text-md mts-text-primary">Decision operativa</strong>' +
                '<p class="mts-text-sm mts-text-muted mts-mt-1 mts-mb-0">Acciones rapidas sobre la alerta.</p>' +
              '</div>' +
              '<ul class="mts-d-flex mts-flex-col mts-gap-2 mts-p-0 mts-m-0">' +
                '<li class="mts-text-sm mts-text-secondary">Validar si hubo viaje o VPN declarada.</li>' +
                '<li class="mts-text-sm mts-text-secondary">Comparar con sesiones cercanas del mismo usuario.</li>' +
                '<li class="mts-text-sm mts-text-secondary">Contener si no existe contexto valido.</li>' +
              '</ul>' +
            '</section>' +
          '</div>' +
          '<section class="mts-surface mts-d-flex mts-flex-col mts-gap-3">' +
            '<div>' +
              '<strong class="mts-text-md mts-text-primary">Analisis</strong>' +
              '<p class="mts-text-sm mts-text-muted mts-mt-1 mts-mb-0">La señal más fuerte es la ubicación fuera del patrón habitual. Aunque el segundo factor fue exitoso, conviene validar contexto antes de cerrar el incidente.</p>' +
            '</div>' +
            '<div class="mts-grid mts-grid--gap-md">' +
              analysisRow('Accion sugerida', 'Validar origen con la usuaria y revisar sesiones cercanas.') +
              analysisRow('Contencion', 'Cerrar sesiones y forzar reautenticacion si no hay contexto valido.') +
              analysisRow('Estado recomendado', 'Mantener abierta hasta confirmar origen.') +
            '</div>' +
          '</section>' +
          '<section class="mts-surface mts-d-flex mts-flex-col mts-gap-3">' +
            '<div>' +
              '<strong class="mts-text-md mts-text-primary">Linea de tiempo</strong>' +
              '<p class="mts-text-sm mts-text-muted mts-mt-1 mts-mb-0">Eventos cercanos para evaluar el riesgo.</p>' +
            '</div>' +
            '<div class="mts-d-flex mts-flex-col mts-gap-3">' +
              timelineRow('Ayer, 18:10', 'Inicio de sesion desde Bogota, CO', 'SSO + 2FA completado con exito.') +
              timelineRow('Ayer, 18:13', 'Alerta abierta por Security', 'Se detecta ubicacion fuera del patron habitual.') +
              timelineRow('Hoy, 08:20', 'Revision pendiente', 'Aun falta validar contexto con la usuaria.') +
            '</div>' +
          '</section>' +
        '</div>',
      footerAlign: 'between',
      footer: [
        {
          label: 'Contener acceso',
          variant: 'secondary',
          icon: MTS.Icon.get('shield-check'),
          onClick: function () {
            notify('warning', 'Se simulo la contencion de la alerta.');
          }
        },
        {
          label: 'Escalar',
          variant: 'ghost',
          icon: MTS.Icon.get('alert'),
          onClick: function () {
            notify('info', 'La alerta se escalo a un playbook mas estricto.');
          }
        },
        {
          label: 'Marcar segura',
          variant: 'primary',
          icon: MTS.Icon.get('check-circle'),
          onClick: function () {
            notify('success', 'La alerta quedo cerrada como origen valido.');
          }
        }
      ]
    });

    function summaryCell(label, value) {
      return '<div class="mts-g-col-12 mts-g-col-md-6 mts-g-col-xl-4"><div class="mts-surface mts-p-3 mts-d-flex mts-flex-col mts-gap-1"><span class="mts-text-xs mts-text-muted">' + label + '</span><strong class="mts-text-sm mts-text-primary">' + value + '</strong></div></div>';
    }

    function analysisRow(label, value) {
      return '<div class="mts-g-col-12 mts-g-col-md-4"><div class="mts-surface mts-p-3 mts-d-flex mts-flex-col mts-gap-1"><span class="mts-text-xs mts-text-muted">' + label + '</span><strong class="mts-text-sm mts-text-primary">' + value + '</strong></div></div>';
    }

    function timelineRow(date, title, copy) {
      return '<article class="mts-surface mts-p-3 mts-d-flex mts-flex-col mts-gap-1"><span class="mts-text-xs mts-text-muted">' + date + '</span><strong class="mts-text-sm mts-text-primary">' + title + '</strong><p class="mts-text-sm mts-text-secondary mts-m-0">' + copy + '</p></article>';
    }

    function notify(variant, message) {
      MTS.Toast.show({
        variant: variant,
        message: message,
        position: 'bottom-right'
      });
    }

    MTS.Icon.initAll();
  </script>
</body>
</html>
