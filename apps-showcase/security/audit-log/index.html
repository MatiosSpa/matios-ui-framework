<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audit Log - Matios UI</title>
  <script>(function(){var sp=location.search||location.hash||'';var mm=sp.match(/mts-mode=([a-z-]+)/);var ma=sp.match(/mts-accent=([a-z-]+)/);if(mm)document.documentElement.setAttribute('data-mts-mode',mm[1]);if(ma)document.documentElement.setAttribute('data-mts-accent',ma[1]);try{var p=window.parent;if(p&&p!==window){var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');if(pm)document.documentElement.setAttribute('data-mts-mode',pm);if(pa)document.documentElement.setAttribute('data-mts-accent',pa);else document.documentElement.removeAttribute('data-mts-accent');}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-toast/matios-ui-toast.css">
  <link rel="stylesheet" href="../../../data/matios-ui-table/matios-ui-table.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../../overlays/matios-ui-toast/matios-ui-toast.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="audit-log-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    var events = [
      { id: 'AUD-141', actor: 'Camila Soto', action: 'Cambio de metodo de pago', target: 'Billing', severity: 'high', severityLabel: 'Alta', when: 'Hoy, 09:12', description: 'Se actualizo la tarjeta principal del workspace.' },
      { id: 'AUD-137', actor: 'Diego Paredes', action: 'Invitacion aprobada', target: 'Admin', severity: 'medium', severityLabel: 'Media', when: 'Hoy, 08:22', description: 'Se habilito acceso a dos perfiles de soporte.' },
      { id: 'AUD-129', actor: 'System', action: 'Nueva ubicacion detectada', target: 'Security', severity: 'high', severityLabel: 'Alta', when: 'Ayer, 18:10', description: 'Una sesion ingreso desde Bogota, CO.' },
      { id: 'AUD-121', actor: 'Laura Herrera', action: 'Canal de integracion actualizado', target: 'Integrations', severity: 'low', severityLabel: 'Baja', when: '18 abril', description: 'La integracion de Slack cambio al canal #ops-alerts.' }
    ];

    new MTS.Card('#audit-log-panel', {
      title: 'Audit Log',
      subtitle: 'Trazabilidad operativa',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex--column mts-gap-4">' +
          '<p class="mts-text--md mts-text-color--muted mts-m-0">Revisa eventos sensibles del workspace por actor, modulo y severidad, con acciones simples de seguimiento.</p>' +
          '<div class="mts-d-flex mts-align-items--center mts-justify-content--between mts-gap-3 mts-flex--wrap">' +
            '<span id="audit-results-meta" class="mts-badge mts-badge--info mts-badge--sm">0 resultados</span>' +
            '<div id="audit-export-button"></div>' +
          '</div>' +
          '<div id="audit-results"></div>' +
        '</div>'
    });

    new MTS.Button('#audit-export-button', {
      label: 'Exportar log',
      variant: 'secondary',
      iconLeft: MTS.Icon.get('download'),
      onClick: function () {
        notify('success', 'Se simulo la exportacion del log de auditoria.');
      }
    });

    document.getElementById('audit-log-panel').addEventListener('click', function (event) {
      var button = event.target.closest('[data-audit-action]');
      if (!button) return;

      var action = button.getAttribute('data-audit-action');
      var id = button.getAttribute('data-audit-id');
      var item = getEventById(id);
      if (!item) return;

      if (action === 'review') {
        notify('success', item.id + ' quedo marcado como revisado.');
      }

      if (action === 'context') {
        notify('info', 'Aqui abririas el contexto completo para ' + item.id + '.');
      }
    });

    function getEventById(id) {
      for (var i = 0; i < events.length; i++) {
        if (events[i].id === id) return events[i];
      }
      return null;
    }

    function severityVariant(value) {
      if (value === 'high') return 'danger';
      if (value === 'medium') return 'warning';
      return 'info';
    }

    function notify(variant, message) {
      MTS.Toast.show({
        variant: variant,
        message: message,
        position: 'bottom-right'
      });
    }

    function actionButton(action, id, icon, label) {
      return '' +
        '<button class="mts-btn mts-btn--ghost mts-btn--sm mts-mr-1" data-audit-action="' + action + '" data-audit-id="' + id + '">' +
          MTS.Icon.get(icon) + ' ' + escapeHtml(label) +
        '</button>';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderEvents() {
      var host = document.getElementById('audit-results');
      var meta = document.getElementById('audit-results-meta');
      var visible = events.slice();

      meta.textContent = visible.length + (visible.length === 1 ? ' resultado' : ' resultados');

      host.innerHTML =
        '<div class="mts-table-wrap">' +
          '<table class="mts-table mts-table--hover mts-table--striped">' +
            '<thead>' +
              '<tr>' +
                '<th class="mts-table__th">Evento</th>' +
                '<th class="mts-table__th">Actor</th>' +
                '<th class="mts-table__th">Modulo</th>' +
                '<th class="mts-table__th">Descripcion</th>' +
                '<th class="mts-table__th">Fecha</th>' +
                '<th class="mts-table__th">Severidad</th>' +
                '<th class="mts-table__th mts-table__th--actions">Acciones</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody>' +
              visible.map(function (item) {
                return '' +
                  '<tr class="mts-table__row">' +
                    '<td class="mts-table__td">' +
                      '<div class="mts-d-flex mts-flex--column mts-gap-1">' +
                        '<strong class="mts-text--sm mts-text-color--primary">' + escapeHtml(item.action) + '</strong>' +
                        '<span class="mts-text--sm mts-text-color--muted">' + escapeHtml(item.id) + '</span>' +
                      '</div>' +
                    '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(item.actor) + '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(item.target) + '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(item.description) + '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(item.when) + '</td>' +
                    '<td class="mts-table__td"><span class="mts-badge mts-badge--' + severityVariant(item.severity) + ' mts-badge--sm">' + escapeHtml(item.severityLabel) + '</span></td>' +
                    '<td class="mts-table__td mts-table__td--actions">' +
                      actionButton('review', item.id, 'check-circle', 'Revisar') +
                      actionButton('context', item.id, 'file-text', 'Contexto') +
                    '</td>' +
                  '</tr>';
              }).join('') +
            '</tbody>' +
          '</table>' +
        '</div>';

      MTS.Icon.initAll();
    }

    renderEvents();
    MTS.Icon.initAll();
  </script>
</body>
</html>
