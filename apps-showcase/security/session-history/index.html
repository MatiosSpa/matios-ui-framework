<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Session History - Matios UI</title>
  <script>(function(){var sp=location.search||location.hash||'';var mm=sp.match(/mts-mode=([a-z-]+)/);var ma=sp.match(/mts-accent=([a-z-]+)/);if(mm)document.documentElement.setAttribute('data-mts-mode',mm[1]);if(ma)document.documentElement.setAttribute('data-mts-accent',ma[1]);try{var p=window.parent;if(p&&p!==window){var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');if(pm)document.documentElement.setAttribute('data-mts-mode',pm);if(pa)document.documentElement.setAttribute('data-mts-accent',pa);else document.documentElement.removeAttribute('data-mts-accent');}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-midnight.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-obsidian.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-forest.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-abyss.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-ember.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dune.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-toast/matios-ui-toast.css">
  <link rel="stylesheet" href="../../../data/matios-ui-table/matios-ui-table.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../../overlays/matios-ui-toast/matios-ui-toast.js"></script>
</head>
<body>
  <main class="mts-p-4">
    <div id="session-history-panel"></div>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    var sessions = [
      { id: 'SES-201', device: 'MacBook Pro', browser: 'Chrome', city: 'Santiago, CL', lastSeen: 'Active now', status: 'active', statusLabel: 'Active', risk: 'Recognized', user: 'Camila Soto' },
      { id: 'SES-184', device: 'iPhone 15', browser: 'Safari', city: 'Santiago, CL', lastSeen: '2 h ago', status: 'recent', statusLabel: 'Recent', risk: 'Trusted', user: 'Camila Soto' },
      { id: 'SES-173', device: 'Windows Workstation', browser: 'Edge', city: 'Bogota, CO', lastSeen: '3 days ago', status: 'attention', statusLabel: 'Review', risk: 'New location', user: 'Camila Soto' },
      { id: 'SES-165', device: 'iPad Air', browser: 'Safari', city: 'Lima, PE', lastSeen: '5 days ago', status: 'recent', statusLabel: 'Recent', risk: 'Declared travel', user: 'Camila Soto' }
    ];

    new MTS.Card('#session-history-panel', {
      title: 'Session History',
      subtitle: 'Access monitoring',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="mts-d-flex mts-flex--column mts-gap-4">' +
          '<p class="mts-text--md mts-text-color--muted mts-m-0">Review active and recent sessions by device, location and risk, with direct actions on each row.</p>' +
          '<div class="mts-d-flex mts-align-items--center mts-justify-content--between mts-gap-3 mts-flex--wrap">' +
            '<span id="sessions-results-meta" class="mts-badge mts-badge--info mts-badge--sm">0 results</span>' +
            '<div id="sessions-signout-all"></div>' +
          '</div>' +
          '<div id="sessions-results"></div>' +
        '</div>'
    });

    new MTS.Button('#sessions-signout-all', {
      label: 'Sign out all',
      variant: 'secondary',
      iconLeft: MTS.Icon.get('refresh-cw'),
      onClick: function () {
        notify('warning', 'Remote sign-out of all active sessions was simulated.');
      }
    });

    document.getElementById('session-history-panel').addEventListener('click', function (event) {
      var button = event.target.closest('[data-session-action]');
      if (!button) return;

      var action = button.getAttribute('data-session-action');
      var id = button.getAttribute('data-session-id');
      var session = getSessionById(id);
      if (!session) return;

      if (action === 'close') {
        notify('success', 'Sign-out of the session on ' + session.device + ' was simulated.');
      }

      if (action === 'trust') {
        notify('info', session.device + ' was marked as a known origin.');
      }
    });

    function getSessionById(id) {
      for (var i = 0; i < sessions.length; i++) {
        if (sessions[i].id === id) return sessions[i];
      }
      return null;
    }

    function badgeVariant(status) {
      if (status === 'active') return 'success';
      if (status === 'recent') return 'warning';
      return 'danger';
    }

    function notify(variant, message) {
      MTS.Toast.show({
        variant: variant,
        message: message,
        position: 'bottom-right'
      });
    }

    function actionButton(action, sessionId, icon, label) {
      return '' +
        '<button class="mts-btn mts-btn--ghost mts-btn--sm mts-mr-1" data-session-action="' + action + '" data-session-id="' + sessionId + '">' +
          MTS.Icon.get(icon) + ' ' + escapeHtml(label) +
        '</button>';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderSessions() {
      var host = document.getElementById('sessions-results');
      var meta = document.getElementById('sessions-results-meta');
      var visible = sessions.slice();

      meta.textContent = visible.length + (visible.length === 1 ? ' result' : ' results');

      host.innerHTML =
        '<div class="mts-table-wrap">' +
          '<table class="mts-table mts-table--hover mts-table--striped">' +
            '<thead>' +
              '<tr>' +
                '<th class="mts-table__th">Device</th>' +
                '<th class="mts-table__th">Browser</th>' +
                '<th class="mts-table__th">Location</th>' +
                '<th class="mts-table__th">User</th>' +
                '<th class="mts-table__th">Last activity</th>' +
                '<th class="mts-table__th">Risk</th>' +
                '<th class="mts-table__th">Status</th>' +
                '<th class="mts-table__th mts-table__th--actions">Actions</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody>' +
              visible.map(function (session) {
                return '' +
                  '<tr class="mts-table__row">' +
                    '<td class="mts-table__td">' +
                      '<div class="mts-d-flex mts-flex--column mts-gap-1">' +
                        '<strong class="mts-text--sm mts-text-color--primary">' + escapeHtml(session.device) + '</strong>' +
                        '<span class="mts-text--sm mts-text-color--muted">' + escapeHtml(session.id) + '</span>' +
                      '</div>' +
                    '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(session.browser) + '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(session.city) + '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(session.user) + '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(session.lastSeen) + '</td>' +
                    '<td class="mts-table__td">' + escapeHtml(session.risk) + '</td>' +
                    '<td class="mts-table__td"><span class="mts-badge mts-badge--' + badgeVariant(session.status) + ' mts-badge--sm">' + escapeHtml(session.statusLabel) + '</span></td>' +
                    '<td class="mts-table__td mts-table__td--actions">' +
                      actionButton('close', session.id, 'refresh-cw', 'Sign out') +
                      actionButton('trust', session.id, 'check-circle', 'Trust') +
                    '</td>' +
                  '</tr>';
              }).join('') +
            '</tbody>' +
          '</table>' +
        '</div>';

      MTS.Icon.initAll();
    }

    renderSessions();
    MTS.Icon.initAll();
  </script>
</body>
</html>
