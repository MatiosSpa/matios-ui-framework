<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<body>
  <main class="mts-d-flex mts-align-items--center mts-justify-content--center mts-p-4 mts-min-vh-100">
    <section class="mts-card mts-card--elevated mts-w--100 mts-max-w-lg">
      <div class="mts-card__body mts-p-6">
        <div class="mts-text--center mts-mb-4">
          <p class="mts-text--sm mts-text-color--muted mts-m-0">Matios UI</p>
          <h1 class="mts-h1 mts-mt-2">Sign in</h1>
        </div>

        <div class="mts-d-flex mts-flex--column mts-gap-4">
          <div id="login-alert"></div>
          <div id="identity-field"></div>
          <div id="password-field"></div>

          <section class="mts-surface mts-d-flex mts-align-items--center mts-justify-content--between mts-gap-4">
            <div class="mts-d-flex mts-flex--column mts-gap-1 mts-flex--1">
              <strong class="mts-text--sm mts-fw--semibold mts-text-color--primary">OTP</strong>
              <span class="mts-text--sm mts-text-color--muted">Send code to email</span>
            </div>
            <div id="otp-toggle"></div>
          </section>

          <div class="mts-d-flex mts-align-items--center mts-justify-content--between mts-gap-4">
            <div id="remember-check"></div>
            <div id="forgot-button"></div>
          </div>

          <div id="submit-button"></div>
        </div>
      </div>

      <div class="mts-card__footer mts-card__footer--center">
        <span class="mts-text--md mts-text-color--muted">Don't have an account?</span>
        <div id="create-account-button"></div>
      </div>
    </section>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });
  </script>
  <script>
    var otpMode = false;

    var identityInput = new MTS.Input('#identity-field', {
      type: 'text',
      label: 'Username',
      placeholder: 'Enter your username',
      iconLeft: MTS.Icon.get('user'),
      autocomplete: 'username'
    });

    var passwordInput = new MTS.Input('#password-field', {
      type: 'password',
      label: 'Password',
      placeholder: 'Enter your password',
      iconLeft: MTS.Icon.get('lock'),
      showPassword: true,
      autocomplete: 'current-password'
    });

    var otpToggle = new MTS.Toggle('#otp-toggle', {
      checked: false,
      onChange: function (event) {
        otpMode = !!event.detail.checked;
        syncMode();
      }
    });

    new MTS.Checkbox('#remember-check', {
      label: 'Remember me'
    });

    new MTS.Button('#forgot-button', {
      label: 'Forgot my password',
      variant: 'link',
      onClick: function () {}
    });

    new MTS.Button('#create-account-button', {
      label: 'Create account',
      variant: 'link',
      size: 'sm',
      onClick: function () {}
    });

    var submitButton = new MTS.Button('#submit-button', {
      label: 'Sign in',
      variant: 'primary',
      block: true,
      onClick: function (event, instance) {
        submitLogin(instance);
      }
    });

    function clearAlerts() {
      document.getElementById('login-alert').innerHTML = '';
    }

    function showAlert(variant, title, message) {
      clearAlerts();
      MTS.Alert.show('#login-alert', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    function syncMode() {
      var passwordField = document.getElementById('password-field');

      passwordField.classList.toggle('mts-d-none', otpMode);
      submitButton.setLabel(otpMode ? 'Send code' : 'Sign in');
      passwordInput.clearError();
      identityInput.clearError();
      clearAlerts();
      otpToggle.setChecked(otpMode);
    }

    function submitLogin(button) {
      var identity = identityInput.getValue().trim();
      var password = passwordInput.getValue().trim();

      identityInput.clearError();
      passwordInput.clearError();
      clearAlerts();

      if (!identity) {
        identityInput.setError('Enter your username');
        return;
      }

      if (!otpMode && !password) {
        passwordInput.setError('Enter your password');
        return;
      }

      button.setLoading(true);
      button.setLabel(otpMode ? 'Sending code...' : 'Validating...');

      setTimeout(function () {
        button.setLoading(false);
        button.setLabel(otpMode ? 'Send code' : 'Sign in');

        if (otpMode) {
          showAlert('success', 'Code sent', 'Check the email associated with <strong>' + escapeHtml(identity) + '</strong>.');
        } else {
          showAlert('info', 'Access granted', 'Sign-in validated for <strong>' + escapeHtml(identity) + '</strong>.');
        }
      }, 700);
    }
... 

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    syncMode();
    MTS.Icon.initAll();
  </script>
</body>
</html>
