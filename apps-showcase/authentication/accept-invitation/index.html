<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accept Invitation - Matios UI</title>
  <script>
    (function () {
      var source = location.search || location.hash || '';
      var modeMatch = source.match(/mts-mode=([a-z-]+)/);
      var accentMatch = source.match(/mts-accent=([a-z-]+)/);

      if (modeMatch) document.documentElement.setAttribute('data-mts-mode', modeMatch[1]);
      if (accentMatch) document.documentElement.setAttribute('data-mts-accent', accentMatch[1]);

      try {
        var parentWindow = window.parent;
        if (parentWindow && parentWindow !== window) {
          var parentMode = parentWindow.currentModeVal || parentWindow.document.documentElement.getAttribute('data-mts-mode');
          var parentAccent = parentWindow.currentAccentVal || parentWindow.document.documentElement.getAttribute('data-mts-accent');

          if (parentMode) document.documentElement.setAttribute('data-mts-mode', parentMode);
          if (parentAccent) document.documentElement.setAttribute('data-mts-accent', parentAccent);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (error) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-midnight.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-obsidian.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-forest.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-abyss.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-ember.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dune.css">
  <link rel="stylesheet" href="../../../css-helpers/matios-ui-css-helpers.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-input/matios-ui-input.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../forms/matios-ui-input/matios-ui-input.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../forms/matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
</head>
<body>
  <main class="mts-d-flex mts-align-items--center mts-justify-content--center mts-p-4 mts-min-vh-100">
    <section class="mts-card mts-card--elevated mts-w--100 mts-max-w-xl">
      <div class="mts-card__body mts-p-6">
        <div class="mts-text--center mts-mb-4">
          <p class="mts-text--sm mts-text-color--muted mts-m-0">Matios UI</p>
          <h1 class="mts-h1 mts-mt-2">Accept invitation</h1>
          <p class="mts-text--md mts-text-color--muted mts-mt-2 mts-mb-0">Confirm your access to the invited workspace.</p>
        </div>

        <div class="mts-d-flex mts-flex--column mts-gap-4">
          <div id="invite-alert"></div>
          <div id="invite-email"></div>
          <div id="invite-name"></div>

          <section class="mts-surface mts-d-flex mts-flex--column mts-gap-3">
            <div>
              <p class="mts-text--sm mts-text-color--muted mts-mb-1 mts-mt-0">Company</p>
              <p class="mts-text--md mts-text-color--primary mts-m-0">Acme Chile</p>
            </div>
            <div>
              <p class="mts-text--sm mts-text-color--muted mts-mb-1 mts-mt-0">Effective role</p>
              <p class="mts-text--md mts-text-color--primary mts-m-0">General</p>
            </div>
            <div>
              <p class="mts-text--sm mts-text-color--muted mts-mb-1 mts-mt-0">Included profiles</p>
              <p class="mts-text--md mts-text-color--primary mts-m-0">ConfigSystem Admin, Document View, Invoice Edit</p>
            </div>
          </section>

          <div id="invite-terms"></div>
          <div id="invite-submit"></div>
        </div>
      </div>

      <div class="mts-card__footer mts-card__footer--between">
        <div id="invite-login-btn"></div>
        <div id="invite-back-btn"></div>
      </div>
    </section>
  </main>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });

    function goBack() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'closeApp' }, '*');
          return;
        }
      } catch (error) {}
      window.history.back();
    }

    function openScreen(path) {
      var params = location.search || '';
      window.location.href = path + params;
    }

    var emailInput = new MTS.Input('#invite-email', {
      type: 'email',
      label: 'Invited email',
      placeholder: 'equipo@matios.dev',
      value: 'equipo@matios.dev',
      iconLeft: MTS.Icon.get('mail')
    });

    var nameInput = new MTS.Input('#invite-name', {
      type: 'text',
      label: 'Display name',
      placeholder: 'Enter your name',
      iconLeft: MTS.Icon.get('user')
    });

    var termsCheckbox = new MTS.Checkbox('#invite-terms', {
      label: 'I confirm that I accept this invitation and the associated access'
    });

    new MTS.Button('#invite-login-btn', {
      label: 'Back to login',
      variant: 'link',
      onClick: function () {
        openScreen('../login/index.html');
      }
    });

    new MTS.Button('#invite-back-btn', {
      label: 'Back to group',
      variant: 'link',
      onClick: function () {
        goBack();
      }
    });

    var submitButton = new MTS.Button('#invite-submit', {
      label: 'Accept invitation',
      variant: 'primary',
      block: true,
      onClick: function (event, instance) {
        acceptInvitation(instance);
      }
    });

    function clearAlert() {
      document.getElementById('invite-alert').innerHTML = '';
    }

    function showAlert(options) {
      clearAlert();
      MTS.Alert.show('#invite-alert', options);
    }

    function isChecked(instance) {
      return instance && typeof instance.isChecked === 'function' ? instance.isChecked() : false;
    }

    function acceptInvitation(button) {
      var email = emailInput.getValue().trim();
      var name = nameInput.getValue().trim();

      clearAlert();
      emailInput.clearError();
      nameInput.clearError();

      if (!email) {
        emailInput.setError('An email must be associated with the invitation');
        return;
      }

      if (!name) {
        nameInput.setError('You must enter your display name');
        return;
      }

      if (!isChecked(termsCheckbox)) {
        showAlert({
          variant: 'warning',
          title: 'Confirm the invitation',
          message: 'You must confirm that you accept the invitation before continuing.',
          closable: true
        });
        return;
      }

      button.setLoading(true);
      button.setLabel('Accepting...');

      setTimeout(function () {
        button.setLoading(false);
        button.setLabel('Accept invitation');
        showAlert({
          variant: 'success',
          title: 'Invitation accepted',
          message: 'Access would be ready for <strong>' + escapeHtml(name) + '</strong> at <strong>Acme Chile</strong>.',
          closable: true
        });
      }, 800);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    MTS.Icon.initAll();
  </script>
</body>
</html>
