<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plan Change Preview - Matios UI</title>
  <script>(function(){var sp=location.search||location.hash||'';var mm=sp.match(/mts-mode=([a-z-]+)/);var ma=sp.match(/mts-accent=([a-z-]+)/);if(mm)document.documentElement.setAttribute('data-mts-mode',mm[1]);if(ma)document.documentElement.setAttribute('data-mts-accent',ma[1]);try{var p=window.parent;if(p&&p!==window){var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');if(pm)document.documentElement.setAttribute('data-mts-mode',pm);if(pa)document.documentElement.setAttribute('data-mts-accent',pa);else document.documentElement.removeAttribute('data-mts-accent');}}catch(e){}})();</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-midnight.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-obsidian.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-forest.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-abyss.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-ember.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-mode-dune.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../../display/matios-ui-card/matios-ui-card.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-alert/matios-ui-alert.css">
  <link rel="stylesheet" href="../../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="plan-change-preview.css">
  <script src="../../../icons/matios-ui-icons.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../../display/matios-ui-card/matios-ui-card.js"></script>
  <script src="../../../overlays/matios-ui-alert/matios-ui-alert.js"></script>
  <script src="../../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
</head>
<body>
  <div class="plan-change-page">
    <header class="plan-change-page__topbar mts-surface">
      <div class="plan-change-page__brand">
        <div class="plan-change-page__logo">M</div>
        <div>
          <div class="plan-change-page__title">Plan Change Preview</div>
          <div class="plan-change-page__subtitle">Impact and proration before confirming a plan change</div>
        </div>
      </div>
      <div class="plan-change-page__actions">
        <div id="plan-change-confirm"></div>
      </div>
    </header>

    <main class="plan-change-page__main mts-grid mts-grid--gap-md">
      <section class="plan-change-page__hero mts-surface mts-g-col-12">
        <div>
          <div class="plan-change-page__eyebrow">Billing decision</div>
          <h1 class="plan-change-page__hero-title">Scale Annual → Scale Plus</h1>
          <p class="plan-change-page__hero-copy">
            Preview to understand the impact of the change before confirming: incremental cost,
            effective date, added resources, and effect on the current billing cycle.
          </p>
          <div class="plan-change-page__badges">
            <span id="plan-change-badge-current"></span>
            <span id="plan-change-badge-next"></span>
          </div>
        </div>
      </section>

      <section class="mts-g-col-12 mts-g-col-xl-8 plan-change-page__stack">
        <div id="plan-change-summary-card"></div>
        <div id="plan-change-impact-card"></div>
      </section>

      <aside class="mts-g-col-12 mts-g-col-xl-4 plan-change-page__sidebar">
        <div id="plan-change-cost-card"></div>
        <div id="plan-change-feedback"></div>
      </aside>
    </main>
  </div>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'setMode') document.documentElement.setAttribute('data-mts-mode', e.data.mode);
      if (e.data.type === 'setAccent') {
        if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
        else document.documentElement.removeAttribute('data-mts-accent');
      }
    });
  </script>
  <script>
    new MTS.Button('#plan-change-confirm', {
      label: 'Confirm change',
      variant: 'primary',
      iconLeft: MTS.Icon.get('check-circle'),
      onClick: function () {
        notify('success', 'Change simulated', 'The screen covers the final step to apply the new plan.');
      }
    });

    new MTS.Badge('#plan-change-badge-current', {
      label: 'Current plan',
      variant: 'default',
      size: 'sm'
    });

    new MTS.Badge('#plan-change-badge-next', {
      label: 'Suggested plan',
      variant: 'primary',
      size: 'sm'
    });

    new MTS.Card('#plan-change-summary-card', {
      title: 'Change summary',
      subtitle: 'Before confirming',
      variant: 'elevated',
      size: 'lg',
      body:
        '<div class="plan-change-page__summary-grid">' +
          infoCell('Current plan', 'Scale Annual') +
          infoCell('New plan', 'Scale Plus') +
          infoCell('Effective date', 'Today, 11:00') +
          infoCell('Proration', 'USD 186') +
          infoCell('Next renewal', 'May 12, 2026') +
          infoCell('Change owner', 'Finance Ops') +
        '</div>'
    });

    new MTS.Card('#plan-change-impact-card', {
      title: 'What changes',
      subtitle: 'Capacity and limits',
      variant: 'outlined',
      size: 'lg',
      body:
        '<div class="plan-change-page__impact">' +
          '<div class="plan-change-page__impact-row"><strong>Seats</strong><span>50 → 80</span></div>' +
          '<div class="plan-change-page__impact-row"><strong>API requests</strong><span>1M → 2.5M</span></div>' +
          '<div class="plan-change-page__impact-row"><strong>Storage</strong><span>250 GB → 500 GB</span></div>' +
          '<div class="plan-change-page__impact-row"><strong>Audit retention</strong><span>180d → 365d</span></div>' +
        '</div>'
    });

    new MTS.Card('#plan-change-cost-card', {
      title: 'Financial impact',
      subtitle: 'This cycle',
      variant: 'outlined',
      size: 'lg',
      body:
        '<div class="plan-change-page__cost">' +
          '<div><span>Immediate charge</span><strong>USD 186</strong></div>' +
          '<div><span>New monthly equivalent</span><strong>USD 1,520</strong></div>' +
          '<div><span>Notes</span><strong>Includes proration for the remaining days in the cycle</strong></div>' +
        '</div>'
    });

    function infoCell(label, value) {
      return '<div class="plan-change-page__info-cell"><span>' + label + '</span><strong>' + value + '</strong></div>';
    }

    function notify(variant, title, message) {
      MTS.Alert.show('#plan-change-feedback', {
        variant: variant,
        title: title,
        message: message,
        closable: true
      });
    }

    MTS.Icon.initAll();
  </script>
</body>
</html>
