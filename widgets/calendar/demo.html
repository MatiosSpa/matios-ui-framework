<!DOCTYPE html>

<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8">
  <script>
    /* Registrar Mock API Service Worker */
    if ('serviceWorker' in navigator) {
      /* SW encapsulado en la carpeta del componente.
         Archivo: widgets/calendar/sw-calendar.js
         Scope:   ./ (relativo = /widgets/calendar/) */
      async function _initSW() {
        /* 1. Limpiar SWs viejos con scope o ruta distinta */
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) {
          if (r.scope.includes('widgets/calendar') || r.scope.includes('mock-api')) {
            if (!r.scope.endsWith('/widgets/calendar/') && !r.scriptURL?.includes('widgets/calendar/sw-calendar')) {
              console.log('[sw-calendar] Desregistrando SW viejo:', r.scope);
              await r.unregister();
            }
          }
        }
        /* 2. Registrar SW desde la carpeta del componente */
        const reg = await navigator.serviceWorker.register('./sw-calendar.js', { scope: './' });
        console.log('[sw-calendar] Registrado — scope:', reg.scope);
        if (reg.active) {
          _markSwReady();
        } else {
          /* Esperar activación */
          const sw = reg.installing || reg.waiting;
          if (sw) {
            sw.addEventListener('statechange', e => {
              if (e.target.state === 'activated') _markSwReady();
            });
          }
          /* También escuchar controllerchange */
          navigator.serviceWorker.addEventListener('controllerchange', _markSwReady, { once: true });
        }
      }
      _initSW().catch(err => console.warn('[sw-calendar] No disponible (necesita servidor HTTP):', err.message));
    }
    function _markSwReady() {
      const opt = document.querySelector('#cfgMockApi option[value="events"]');
      if (opt) opt.textContent = '⚡ sw-calendar ✓ (activo)';
      console.log('[sw-calendar] ✓ Activo — interceptando /widgets/calendar/mock-api/*');
    }
  </script>

<div id="mi-calendario" style="height:100vh"></div>

<script>
(async () => {

  // Uso minimo - modales por defecto del CalendarUI
  const ui = new MTS.CalendarUI('#mi-calendario', {
    calendarOptions: {
      view:      'week',
      days:      MTS.Calendar.DAYS_MON_FRI,
      startTime: '08:00',
      endTime:   '19:00',
    },

    // onEvent - se llama DESPUES de que el modal confirma
    // action: 'create' | 'update' | 'delete' | 'drop' | 'resize'
    // event:  datos del evento ya con los cambios
    // cal:    instancia MTS.Calendar
    onEvent: async (action, event, cal) => {
      switch (action) {
        case 'create':
          const res   = await fetch('/api/events', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(event) });
          const saved = await res.json();
          cal.updateEvent(event.id, { id:saved.id, uid:saved.id });
          break;
        case 'update':
          await fetch('/api/events/' + (event.uid ?? event.id), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(event) });
          break;
        case 'delete':
          await fetch('/api/events/' + (event.uid ?? event.id), { method:'DELETE' });
          cal.removeEvent(event.uid ?? event.id);
          break;
        case 'drop':
        case 'resize':
          await fetch('/api/events/' + (event.uid ?? event.id), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(event) });
          break;
      }
    },
  });
  await ui.init();


  // Uso avanzado - modales propios
  // renderXXXEventModal recibe (cal, event) y debe retornar:

  //   null / undefined si cancela       -> CalendarUI no hace nada

  const uiCustom = new MTS.CalendarUI('#mi-calendario', {

      });

        resolve(confirm('Eliminar "' + event.title + '"?') ? event : null);
      });
