  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

  <script>
    /* Register Mock API Service Worker */
    if ('serviceWorker' in navigator) {
      /* SW encapsulated in the component folder.
         File:  widgets/calendar/sw-calendar.js
         Scope: ./ (relative = /widgets/calendar/) */
      async function _initSW() {
        /* 1. Clean up old SWs with a different scope or path */
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) {
          if (r.scope.includes('widgets/calendar') || r.scope.includes('mock-api')) {
            if (!r.scope.endsWith('/widgets/calendar/') && !r.scriptURL?.includes('widgets/calendar/sw-calendar')) {
              console.log('[sw-calendar] Unregistering old SW:', r.scope);
              await r.unregister();
            }
          }
        }
        /* 2. Register SW from the component folder */
        const reg = await navigator.serviceWorker.register('./sw-calendar.js', { scope: './' });
        if (reg.active) {
          _markSwReady();
        } else {
          /* Wait for activation */
          const sw = reg.installing || reg.waiting;
          if (sw) {
            sw.addEventListener('statechange', e => {
              if (e.target.state === 'activated') _markSwReady();
            });
          }
          /* Also listen for controllerchange */
          navigator.serviceWorker.addEventListener('controllerchange', _markSwReady, { once: true });
        }
      }
      _initSW().catch(err => console.warn('[sw-calendar] Not available (requires HTTP server):', err.message));
    }
    function _markSwReady() {
      const opt = document.querySelector('#cfgMockApi option[value="events"]');
      if (opt) opt.textContent = '⚡ sw-calendar ✓ (active)';
    }
  </script>

<div id="my-calendar" style="height:100vh"></div>

<script>
(async () => {

  // Minimal usage - default CalendarUI modals
  const ui = new MTS.CalendarUI('#my-calendar', {
    calendarOptions: {
      view:      'week',
      days:      MTS.Calendar.DAYS_MON_FRI,
      startTime: '08:00',
      endTime:   '19:00',
    },

    // onEvent - called AFTER the modal confirms
    // action: 'create' | 'update' | 'delete' | 'drop' | 'resize'
    // event:  event data already with the changes applied
    // cal:    MTS.Calendar instance
    onEvent: async (action, event, cal) => {
      switch (action) {
        case 'create':
          const res   = await fetch('/api/events', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(event) });
          const saved = await res.json();
          cal.updateEvent(event.id, { id:saved.id, uid:saved.id });
          break;
        case 'update':
          await fetch('/api/events/' + (event.uid ?? event.id), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(event) });
          break;
        case 'delete':
          await fetch('/api/events/' + (event.uid ?? event.id), { method:'DELETE' });
          cal.removeEvent(event.uid ?? event.id);
          break;
        case 'drop':
        case 'resize':
          await fetch('/api/events/' + (event.uid ?? event.id), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(event) });
          break;
      }
    },
  });
  await ui.init();


  // Advanced usage - custom modals
  // renderXXXEventModal receives (cal, event) and must return:
  //   the modified event if confirmed   -> CalendarUI calls onEvent automatically
  //   null / undefined if cancelled      -> CalendarUI does nothing

  const uiCustom = new MTS.CalendarUI('#my-calendar', {

    renderNewEventModal: async (cal, event) => {
      // event contains: date, dayNumber, startH, endH (data from the clicked cell)
      return new Promise((resolve) => {
        const modal = new MTS.Modal({
          title: 'New event',
          body:  document.getElementById('my-new-form'), // your HTML
          buttons: [
            { label:'Cancel', variant:'ghost',  onClick: () => { modal.hide(); resolve(null); } },
            { label:'Save',   variant:'primary', onClick: () => {
                const title = document.getElementById('my-title').value.trim();
                if (!title) return;
                modal.hide();
                resolve({ ...event, title: title }); // CalendarUI will call onEvent('create', result, cal)
            }},
          ],
        });
        modal.show();
      });
    },

    renderEventDeleteModal: async (cal, event) => {
      return new Promise((resolve) => {
        resolve(confirm('Delete "' + event.title + '"?') ? event : null);
      });
    },

    onEvent: async (action, event, cal) => {
      // Only reaches here if the modal returned data (user did not cancel)
      if (action === 'create') {
        const res = await fetch('/api/events', { method:'POST', body:JSON.stringify(event) });
        const saved = await res.json();
        cal.addEvent({ ...event, id:saved.id });
      }
      if (action === 'delete') {
        await fetch('/api/events/' + event.id, { method:'DELETE' });
        cal.removeEvent(event.id);
      }
    },
  });
  await uiCustom.init();

})();
</script>
