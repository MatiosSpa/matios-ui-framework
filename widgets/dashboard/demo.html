<!-- ── Shell root ──────────────────────────────────────── -->
<div id="shell" style="height:100vh">
  <div id="tb"></div>
  <div id="nav"></div>
  <div id="main" class="mts-shell__main--scroll">
    <div class="mts-d-flex mts-flex--column mts-p-6 mts-gap-5" style="min-width:0">

      <!-- Breadcrumb -->

      <!-- Page header -->

        <div>
          <div style="font-size:22px;font-weight:700;color:var(--mts-text-primary);line-height:1.2">Dashboard</div>

        <div class="mts-d-flex mts-align-items--center mts-gap-2 mts-flex-shrink--0">

        <div class="mts-g-col-3" id="kpi-users"></div>
        <div class="mts-g-col-3" id="kpi-orders"></div>
        <div class="mts-g-col-3" id="kpi-conversion"></div>
      </div>

      <!-- Contenido: tabla + panel lateral -->
      <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;min-width:0">

        <!-- Tabla de pedidos -->
        <div id="orders-table"></div>

        <!-- Panel lateral -->
        <div class="mts-d-flex mts-flex--column mts-gap-4">
          <div id="card-products"></div>
          <div id="card-activity"></div>
        </div>

      </div>
    </div>
  </div>

<!-- ── Scripts ─────────────────────────────────────────── -->

<script src="../../layout/matios-ui-shell/matios-ui-shell.js"></script>

<script>

/* ============================================================
   DATOS FALSOS
   ============================================================ */

const CLIENTES = [
  'Ana Torres','Luis Herrera','María Gómez','Carlos Ríos','Paula Vargas',
  'Diego Morales','Sofía Castro','Andrés Ruiz','Valentina Ortiz','Matías Peña',
  'Camila Soto','Sebastián Díaz','Isabella Flores','Emilio Reyes','Natalia Vega',
  'Rodrigo Campos','Fernanda Luna','Javier Mendoza','Daniela Aguirre','Tomás Silva',
];

const PRODUCTOS = [
  'Laptop Pro 15"','Monitor UltraWide','Teclado Mecánico','Mouse Inalámbrico','Auriculares BT',
  'Webcam HD','Hub USB-C','SSD 1TB','RAM 32GB','Silla Ergonómica',
  'Escritorio Ajustable','Micrófono Condensador','Luz de Ring','Cable HDMI 4K','Impresora Láser',
];

const ESTADOS = ['Pendiente','En proceso','Entregado','Cancelado'];

const ESTADO_VARIANT = {
  'Pendiente':   'warning',
  'En proceso':  'primary',
  'Entregado':   'success',
  'Cancelado':   'danger',
};

function seededRand(seed) {
  const x = Math.sin(seed + 1) * 10000;
  return x - Math.floor(x);
}

function buildOrders() {
  const rows = [];
  const base = new Date(2026, 3, 1);
  for (let i = 0; i < 80; i++) {
    const r5   = seededRand(i * 19 + 11);
    const d    = new Date(base.getTime() + Math.floor(r5 * 32) * 86400000);
    const mm   = String(d.getMonth() + 1).padStart(2, '0');
    const dd   = String(d.getDate()).padStart(2, '0');
    rows.push({
      id:       '#' + String(1000 + i).padStart(4, '0'),
      cliente:  CLIENTES[Math.floor(seededRand(i * 7  + 3) * CLIENTES.length)],
      producto: PRODUCTOS[Math.floor(seededRand(i * 11 + 5) * PRODUCTOS.length)],
      total:    '$' + (Math.floor(seededRand(i * 13 + 7) * 9800) + 200).toLocaleString('es-CL'),
      estado:   ESTADOS[Math.floor(seededRand(i * 17 + 9) * ESTADOS.length)],
      fecha:    dd + '/' + mm + '/' + d.getFullYear(),
    });
  }
  return rows;
}

const ORDERS = buildOrders();

/* ============================================================
   SIDENAV + MENU
   (antes que Shell para que _syncClasses no borre grid-area)
   ============================================================ */

const navMenu = new MTS.Menu({
  active: 'dashboard',
  items: [
    { key: 'dashboard',     label: 'Dashboard',     icon: 'mts-icon-bar-chart-2' },
    { key: 'usuarios',      label: 'Usuarios',      icon: 'mts-icon-users' },
    { key: 'productos',     label: 'Productos',      icon: 'mts-icon-package' },
    { key: 'pedidos',       label: 'Pedidos',        icon: 'mts-icon-shopping-cart', badge: '48' },
    { key: 'reportes',      label: 'Reportes',       icon: 'mts-icon-file-text' },
    { key: 'sep-1',         divider: true },
    { key: 'configuracion', label: 'Configuración',  icon: 'mts-icon-settings' },
  ],
  onClick: function(item) {
    MTS.Toast.show({ message: 'Navegando a: ' + item.label, variant: 'info', duration: 2000 });
  },
});

new MTS.SideNav('#nav', {
  menu: navMenu,
  brand: {
    logo: '<svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg"><rect width="28" height="28" rx="6" fill="var(--mts-color-primary,#6366f1)"/><text x="14" y="19" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="12" font-weight="700" fill="#fff">AC</text></svg>',
    title:    'Acme Corp',
    subtitle: 'Plataforma Admin',
  },
});

/* ============================================================
   TOPBAR — slot end con MTS.Button + MTS.Badge + MTS.Avatar
   (antes que Shell — _build() reemplaza className)
   ============================================================ */

const topbarEndEl = document.createElement('div');
topbarEndEl.className = 'mts-d-flex mts-align-items--center mts-gap-2';

/* Botón modo */
const modeBtnEl = document.createElement('button');
modeBtnEl.id    = 'btn-mode-toggle';
modeBtnEl.title = 'Cambiar modo';
new MTS.Button(modeBtnEl, {
  variant:  'ghost',
  iconOnly: true,
  iconLeft: '<i class="mts-icon mts-icon-sun"></i>',
});
topbarEndEl.appendChild(modeBtnEl);

/* Notificaciones */
const notifWrap = document.createElement('div');
notifWrap.className    = 'mts-d-inline-flex mts-align-items--center';
notifWrap.style.position = 'relative';

const notifBtnEl = document.createElement('button');
notifBtnEl.id    = 'btn-notifications';
notifBtnEl.title = 'Notificaciones';
new MTS.Button(notifBtnEl, {
  variant:  'ghost',
  iconOnly: true,
  iconLeft: '<i class="mts-icon mts-icon-bell"></i>',
});
notifWrap.appendChild(notifBtnEl);

const notifDotEl = document.createElement('span');
new MTS.Badge(notifDotEl, { dot: true, variant: 'danger' });
notifDotEl.style.cssText = 'position:absolute;top:6px;right:6px;border:2px solid var(--mts-bg-surface);pointer-events:none';
notifWrap.appendChild(notifDotEl);
topbarEndEl.appendChild(notifWrap);

/* Avatar trigger */
const avatarTrigger = document.createElement('div');
avatarTrigger.id         = 'topbar-avatar-wrap';
avatarTrigger.style.cssText = 'cursor:pointer;border-radius:50%';
avatarTrigger.title      = 'Mi cuenta';
topbarEndEl.appendChild(avatarTrigger);

new MTS.Topbar('#tb', {
  end:    topbarEndEl,
  shadow: false,
});

/* Avatar en el slot end */
const avatarWrap = document.getElementById('topbar-avatar-wrap');
if (avatarWrap) {
  const avatarEl = document.createElement('div');
  avatarWrap.appendChild(avatarEl);
  new MTS.Avatar(avatarEl, {
    name:   'Carlos Méndez',
    size:   'sm',
    status: 'online',
  });
}

/* ============================================================
   STATUSBAR
   (antes que Shell — _syncClasses() reemplaza className)
   ============================================================ */

new MTS.StatusBar('#sb', {
  variant: 'default',
  start:   '<i class="mts-icon mts-icon-git-branch"></i>&nbsp;production',
  center:  '<span class="mts-badge mts-badge--success mts-badge--xs mts-badge--dot"></span>&nbsp;En línea',
  end:     '<span class="mts-badge mts-badge--primary mts-badge--xs mts-badge--square">PROD</span>&nbsp;&nbsp;v1.0.0',
});

/* ============================================================
   SHELL — siempre al último para que classList.add()
   no sea pisado por las inicializaciones anteriores
   ============================================================ */

new MTS.Shell('#shell', {
  topbar:    '#tb',
  sidenav:   '#nav',
  main:      '#main',
  statusbar: '#sb',
  height:    '100vh',
});

/* ============================================================
   DROPDOWNS — MTS.Dropdown
   (después de Shell para que los triggers estén en el DOM)
   ============================================================ */

new MTS.Dropdown(notifBtnEl, {
  position: 'bottom-end',
  items: [
    {
      id:    'n1',
      label: 'Pedido #1047 entregado',
      icon:  '<i class="mts-icon mts-icon-check-circle"></i>',
      onClick: function() { MTS.Toast.show({ message: 'Pedido #1047 entregado', variant: 'success', duration: 2000 }); },
    },
    {
      id:    'n2',
      label: 'Nuevo usuario: Rodrigo Campos',
      icon:  '<i class="mts-icon mts-icon-user-plus"></i>',
      onClick: function() { MTS.Toast.show({ message: 'Nuevo usuario registrado', variant: 'info', duration: 2000 }); },
    },
    {
      id:    'n3',
      label: 'Pedido #1044 cancelado',
      icon:  '<i class="mts-icon mts-icon-x-circle"></i>',
      onClick: function() { MTS.Toast.show({ message: 'Pedido #1044 cancelado', variant: 'danger', duration: 2000 }); },
    },
    {
      id:    'n4',
      label: 'Pago recibido de Luis Herrera',
      icon:  '<i class="mts-icon mts-icon-dollar-sign"></i>',
      onClick: function() { MTS.Toast.show({ message: 'Pago procesado correctamente', variant: 'success', duration: 2000 }); },
    },
    {
      id:    'n5',
      label: 'Reporte mensual generado',
      icon:  '<i class="mts-icon mts-icon-file-text"></i>',
      onClick: function() { MTS.Toast.show({ message: 'Reporte listo para descargar', variant: 'info', duration: 2000 }); },
    },
    { divider: true },
    {
      id:    'ver-todas',
      label: 'Ver todas las notificaciones',
      onClick: function() { MTS.Toast.show({ message: 'Centro de notificaciones en construcción.', variant: 'info', duration: 2500 }); },
    },
  ],
});

new MTS.Dropdown(avatarTrigger, {
  position: 'bottom-end',
  items: [
    {
      id:    'perfil',
      label: 'Mi perfil',
      icon:  '<i class="mts-icon mts-icon-user"></i>',
      onClick: function() { MTS.Toast.show({ message: 'Mi perfil — en construcción.', variant: 'info', duration: 2000 }); },
    },
    {
      id:    'config',
      label: 'Configuración',
      icon:  '<i class="mts-icon mts-icon-settings"></i>',
      onClick: function() { MTS.Toast.show({ message: 'Configuración — en construcción.', variant: 'info', duration: 2000 }); },
    },
    {
      id:    'ayuda',
      label: 'Ayuda',
      icon:  '<i class="mts-icon mts-icon-help-circle"></i>',
      onClick: function() { MTS.Toast.show({ message: 'Ayuda — en construcción.', variant: 'info', duration: 2000 }); },
    },
    { divider: true },
    {
      id:    'logout',
      label: 'Cerrar sesión',
      icon:  '<i class="mts-icon mts-icon-log-out"></i>',
      danger: true,
      onClick: function() { MTS.Toast.show({ message: 'Sesión cerrada.', variant: 'warning', duration: 2500 }); },
    },
  ],
});

/* ── Toggle modo oscuro/claro ───────────────────────────── */

document.addEventListener('click', function(e) {
  if (!e.target.closest('#btn-mode-toggle')) return;
  const html   = document.documentElement;
  const isDark = html.getAttribute('data-mts-mode') === 'dark';
  html.setAttribute('data-mts-mode', isDark ? 'light' : 'dark');
  const icon = modeBtnEl.querySelector('.mts-icon');
  if (icon) icon.className = 'mts-icon ' + (isDark ? 'mts-icon-sun' : 'mts-icon-moon');
});

/* ── Botón Exportar ─────────────────────────────────────── */

document.addEventListener('click', function(e) {
  if (!e.target.closest('#btn-export')) return;
  MTS.Toast.show({ message: 'Exportando datos...', variant: 'success', duration: 2500 });
});

/* ── Botón Nuevo pedido ─────────────────────────────────── */

document.addEventListener('click', function(e) {
  if (!e.target.closest('#btn-new-order')) return;
  MTS.Toast.show({ message: 'Formulario de nuevo pedido en construcción.', variant: 'info', duration: 3000 });
});

MTS.Icon.initAll();

/* ============================================================
   BREADCRUMB
   ============================================================ */

new MTS.Breadcrumb('#breadcrumb-el', {
  items: [
    { label: 'Inicio' },
    { label: 'Dashboard' },
  ],
});

/* ============================================================
   KPI CARDS
   ============================================================ */

new MTS.KPICard('#kpi-revenue', {
  label:      'Ingresos del mes',
  value:      '$24.580',
  trend:      12.4,
  trendLabel: 'vs mes anterior',
  sparkline:  [14200, 16800, 15400, 18200, 19600, 21000, 20400, 22800, 24580],
  variant:    'default',
  icon:       '<i class="mts-icon mts-icon-trending-up"></i>',
});

new MTS.KPICard('#kpi-users', {
  label:      'Usuarios activos',
  value:      '1.284',
  trend:      8.2,
  trendLabel: 'vs mes anterior',
  sparkline:  [980, 1020, 1080, 1100, 1150, 1200, 1180, 1240, 1284],
  variant:    'default',
  icon:       '<i class="mts-icon mts-icon-users"></i>',
});

new MTS.KPICard('#kpi-orders', {
  label:      'Pedidos hoy',
  value:      '48',
  trend:      -3.1,
  trendLabel: 'vs ayer',
  sparkline:  [55, 62, 58, 49, 51, 60, 57, 50, 48],
  variant:    'default',
  icon:       '<i class="mts-icon mts-icon-shopping-cart"></i>',
});

new MTS.KPICard('#kpi-conversion', {
  label:      'Tasa de conversión',
  value:      '3.24%',
  trend:      0.8,
  trendLabel: 'vs semana anterior',
  sparkline:  [2.8, 2.9, 3.0, 2.95, 3.1, 3.15, 3.08, 3.20, 3.24],
  variant:    'default',
  icon:       '<i class="mts-icon mts-icon-percent"></i>',
});

/* ============================================================
   DATA TABLE — PEDIDOS
   ============================================================ */

new MTS.DataTable({
  elementId: 'orders-table',
  columns: [
    { field: 'id',       label: 'ID',       sortable: true,  align: 'end', width: '90px'  },
    { field: 'cliente',  label: 'Cliente',  sortable: true                                 },
    { field: 'producto', label: 'Producto', sortable: true                                 },
    { field: 'total',    label: 'Total',    sortable: false,               width: '110px'  },
    {
      field:    'estado',
      label:    'Estado',
      sortable: true,
      width:    '130px',
      render:   function(v) {
        const variant = ESTADO_VARIANT[v] || 'default';
        return MTS.Badge.html(v, variant, 'sm', 'pill');
      },
    },
    { field: 'fecha', label: 'Fecha', sortable: true, width: '110px' },
  ],
  dataSource: function(query) {
    let src = ORDERS.slice();

    if (query.search) {
      const s = query.search.toLowerCase();
      src = src.filter(function(row) {
        return (
          row.id.toLowerCase().indexOf(s) >= 0      ||
          row.cliente.toLowerCase().indexOf(s) >= 0  ||
          row.producto.toLowerCase().indexOf(s) >= 0 ||
          row.estado.toLowerCase().indexOf(s) >= 0
        );
      });
    }

    if (query.orderBy) {
      const dir = query.orderDir === 'desc' ? -1 : 1;
      src.sort(function(a, b) {
        const av = (a[query.orderBy] || '').toString();
        const bv = (b[query.orderBy] || '').toString();
        return dir * av.localeCompare(bv, 'es');
      });
    }

    const total = src.length;
    const start = (query.pageNumber - 1) * query.pageSize;
    const page  = src.slice(start, start + query.pageSize);

    return Promise.resolve({ data: page, total: total });
  },
  rowId:    'id',
  pageSize: 10,
  hover:    true,
  striped:  true,
  search:   { enabled: true, minChars: 1 },
  locale:   'es',
});

/* ============================================================
   CARD TOP PRODUCTOS
   ============================================================ */

const TOP_PRODUCTS = [
  { name: 'Laptop Pro 15"',    units: 34, pct: 100 },
  { name: 'Monitor UltraWide', units: 28, pct: 82  },
  { name: 'Teclado Mecánico',  units: 22, pct: 65  },
  { name: 'Mouse Inalámbrico', units: 19, pct: 56  },
  { name: 'Auriculares BT',    units: 15, pct: 44  },
];

const PROGRESS_VARIANTS = ['primary', 'success', 'info', 'warning', 'danger'];

const productBodyEl = document.createElement('div');
TOP_PRODUCTS.forEach(function(p, idx) {
  const row = document.createElement('div');
  if (idx < TOP_PRODUCTS.length - 1) row.className = 'mts-mb-3';

  const labelRow = document.createElement('div');
  labelRow.className = 'mts-d-flex mts-justify-content--between mts-mb-1';
  labelRow.style.cssText = 'font-size:13px;color:var(--mts-text-secondary)';

  const nameSpan = document.createElement('span');
  nameSpan.style.cssText = 'font-weight:500;color:var(--mts-text-primary)';
  nameSpan.textContent = p.name;

  const unitSpan = document.createElement('span');
  unitSpan.textContent = p.units + ' uds.';

  labelRow.appendChild(nameSpan);
  labelRow.appendChild(unitSpan);
  row.appendChild(labelRow);

  const progressContainer = document.createElement('div');
  new MTS.Progress(progressContainer, {
    type:    'bar',
    value:   p.pct,
    variant: PROGRESS_VARIANTS[idx] || 'primary',
    size:    'sm',
    rounded: true,
  });
  row.appendChild(progressContainer);
  productBodyEl.appendChild(row);
});

new MTS.Card('#card-products', {
  title:   'Top productos',
  body:    '',
  variant: 'outlined',
  actions: [{ label: 'Ver todos', variant: 'ghost', onClick: function() {
    MTS.Toast.show({ message: 'Sección de productos en construcción.', variant: 'info', duration: 2000 });
  }}],
});
document.querySelector('#card-products .mts-card__body').appendChild(productBodyEl);

/* ============================================================
   CARD ACTIVIDAD RECIENTE
