var CLIENTES = [
  'Ana Torres','Luis Herrera','María Gómez','Carlos Ríos','Paula Vargas',
  'Diego Morales','Sofía Castro','Andrés Ruiz','Valentina Ortiz','Matías Peña',
  'Camila Soto','Sebastián Díaz','Isabella Flores','Emilio Reyes','Natalia Vega',
  'Rodrigo Campos','Fernanda Luna','Javier Mendoza','Daniela Aguirre','Tomás Silva',
];

var PRODUCTOS = [
  'Laptop Pro 15"','Monitor UltraWide','Teclado Mecánico','Mouse Inalámbrico','Auriculares BT',
  'Webcam HD','Hub USB-C','SSD 1TB','RAM 32GB','Silla Ergonómica',
  'Escritorio Ajustable','Micrófono Condensador','Luz de Ring','Cable HDMI 4K','Impresora Láser',
];

var ESTADOS = ['Pendiente','En proceso','Entregado','Cancelado'];

var ESTADO_VARIANT = {
  'Pendiente':   'warning',
  'En proceso':  'primary',
  'Entregado':   'success',
  'Cancelado':   'danger',
};

function seededRand(seed) {
  var x = Math.sin(seed + 1) * 10000;
  return x - Math.floor(x);
}

function buildOrders() {
  var rows  = [];
  var base  = new Date(2026, 3, 1);
  var i, r, r2, r3, r4, r5, d, mm, dd, fecha;
  for (i = 0; i < 80; i++) {
    r  = seededRand(i * 7  + 3);
    r2 = seededRand(i * 11 + 5);
    r3 = seededRand(i * 13 + 7);
    r4 = seededRand(i * 17 + 9);
    r5 = seededRand(i * 19 + 11);
    d  = new Date(base.getTime() + Math.floor(r5 * 32) * 86400000);
    mm = String(d.getMonth() + 1).padStart(2, '0');
    dd = String(d.getDate()).padStart(2, '0');
    fecha = dd + '/' + mm + '/' + d.getFullYear();
    rows.push({
      id:       '#' + String(1000 + i).padStart(4, '0'),
      cliente:  CLIENTES[Math.floor(r  * CLIENTES.length)],
      producto: PRODUCTOS[Math.floor(r2 * PRODUCTOS.length)],
      total:    '$' + (Math.floor(r3 * 9800) + 200).toLocaleString('es-CL'),
      estado:   ESTADOS[Math.floor(r4 * ESTADOS.length)],
      fecha:    fecha,
    });
  }
  return rows;
}

var ORDERS = buildOrders();

/* ============================================================

/* ============================================================
   DROPDOWNS — usuario y notificaciones
   ============================================================ */

var _activeDd = null;

function closeDd() {
  if (_activeDd && _activeDd.parentNode) {
    _activeDd.parentNode.removeChild(_activeDd);
  }
  _activeDd = null;
}

function positionDd(dd, triggerEl) {
  var rect = triggerEl.getBoundingClientRect();
  var ddW  = dd.offsetWidth || 240;
  var left = rect.right - ddW;
  if (left < 8) left = 8;
  if (left + ddW > window.innerWidth - 8) left = window.innerWidth - ddW - 8;
  dd.style.top  = (rect.bottom + 6) + 'px';
  dd.style.left = left + 'px';
}

function openDd(dd, triggerEl) {
  if (_activeDd === dd) { closeDd(); return; }
  closeDd();
  document.body.appendChild(dd);
  _activeDd = dd;
  positionDd(dd, triggerEl);
}

/* Cierra al hacer click fuera */
document.addEventListener('click', function(e) {
  if (!_activeDd) return;
  var trigger = document.getElementById('topbar-avatar-wrap');
  var bell    = document.getElementById('btn-notifications');
  if (
    _activeDd.contains(e.target) ||
    (trigger && trigger.contains(e.target)) ||
    (bell    && bell.contains(e.target))
  ) return;
  closeDd();
}, true);

/* ── Estilos inline compartidos para los dropdowns ─── */
var DD_PANEL_CSS = 'position:fixed;z-index:9999;background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg,12px);box-shadow:0 8px 32px rgba(0,0,0,.14);overflow:hidden';
var DD_ITEM_CSS  = 'padding:10px 16px;font-size:13px;cursor:pointer;transition:background .12s';

function ddHover(el) {
  el.addEventListener('mouseenter', function() { el.style.background = 'var(--mts-bg-surface-2)'; });
  el.addEventListener('mouseleave', function() { el.style.background = ''; });
}

/* ── Usuario dropdown ───────────────────────────────── */

function buildUserDd() {
  var dd = document.createElement('div');
  dd.style.cssText = DD_PANEL_CSS + ';width:230px';

  /* Header */
  var head = document.createElement('div');
  head.className = 'mts-d-flex mts-align-items--center mts-gap-2 mts-p-4';
  head.style.borderBottom = '1px solid var(--mts-border-color)';

  var avatarInner = document.createElement('div');
  new MTS.Avatar(avatarInner, { name: 'Carlos Méndez', size: 'sm' });
  head.appendChild(avatarInner);

  var info = document.createElement('div');
  info.className = 'mts-flex--1';
  info.style.minWidth = '0';

  var nameEl = document.createElement('div');
  nameEl.style.cssText = 'font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
  nameEl.textContent = 'Carlos Méndez';

  var emailEl = document.createElement('div');
  emailEl.style.cssText = 'font-size:11px;color:var(--mts-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
  emailEl.textContent = 'carlos@acmecorp.com';

  info.appendChild(nameEl);
  info.appendChild(emailEl);
  head.appendChild(info);
  dd.appendChild(head);

  /* Ítems */
  var USER_ITEMS = [
    { icon: 'mts-icon-user',        label: 'Mi perfil' },
    { icon: 'mts-icon-settings',    label: 'Configuración' },
    { icon: 'mts-icon-help-circle', label: 'Ayuda' },
  ];

  USER_ITEMS.forEach(function(it) {
    var item = document.createElement('div');
    item.className = 'mts-d-flex mts-align-items--center mts-gap-2';
    item.style.cssText = DD_ITEM_CSS + ';color:var(--mts-text-primary)';
    ddHover(item);

    var icon = document.createElement('i');
    icon.className = 'mts-icon ' + it.icon;
    icon.style.cssText = 'font-size:16px;color:var(--mts-text-muted);flex-shrink:0';

    var label = document.createElement('span');
    label.textContent = it.label;

    item.appendChild(icon);
    item.appendChild(label);
    item.addEventListener('click', function() {
      closeDd();
      MTS.Toast.show({ message: it.label + ' — en construcción.', variant: 'info', duration: 2000 });
    });
    dd.appendChild(item);
  });

  /* Divider */
  var divider = document.createElement('div');
  divider.style.cssText = 'height:1px;background:var(--mts-border-color);margin:4px 0';
  dd.appendChild(divider);

  /* Cerrar sesión */
  var logout = document.createElement('div');
  logout.className = 'mts-d-flex mts-align-items--center mts-gap-2';
  logout.style.cssText = DD_ITEM_CSS + ';color:var(--mts-color-danger,#ef4444)';
  ddHover(logout);

  var logoutIcon = document.createElement('i');
  logoutIcon.className = 'mts-icon mts-icon-log-out';
  logoutIcon.style.cssText = 'font-size:16px;color:var(--mts-color-danger,#ef4444);flex-shrink:0';
  var logoutLabel = document.createElement('span');
  logoutLabel.textContent = 'Cerrar sesión';
  logout.appendChild(logoutIcon);
  logout.appendChild(logoutLabel);
  logout.addEventListener('click', function() {
    closeDd();
    MTS.Toast.show({ message: 'Sesión cerrada.', variant: 'warning', duration: 2500 });
  });
  dd.appendChild(logout);

  MTS.Icon.initAll(dd);
  return dd;
}

/* ── Notificaciones dropdown ────────────────────────── */

var NOTIFS = [
  { color: 'var(--mts-color-success,#22c55e)', msg: 'Pedido #1047 entregado',          time: 'Hace 5 min'   },
  { color: 'var(--mts-color-primary,#6366f1)', msg: 'Nuevo usuario: Rodrigo Campos',   time: 'Hace 18 min'  },
  { color: 'var(--mts-color-danger,#ef4444)',  msg: 'Pedido #1044 cancelado',          time: 'Hace 42 min'  },
  { color: 'var(--mts-color-warning,#f59e0b)', msg: 'Pago recibido de Luis Herrera',   time: 'Hace 1 hora'  },
  { color: 'var(--mts-color-info,#0ea5e9)',    msg: 'Reporte mensual generado',        time: 'Hace 2 horas' },
];

function buildNotifDd() {
  var dd = document.createElement('div');
  dd.style.cssText = DD_PANEL_CSS + ';width:300px';

  /* Header */
  var head = document.createElement('div');
  head.className = 'mts-d-flex mts-align-items--center mts-justify-content--between';
  head.style.cssText = 'padding:12px 16px;border-bottom:1px solid var(--mts-border-color)';

  var title = document.createElement('span');
  title.style.cssText = 'font-weight:600;font-size:14px;color:var(--mts-text-primary)';
  title.textContent = 'Notificaciones';

  var clearBtn = document.createElement('button');
  clearBtn.className = 'mts-btn mts-btn--ghost mts-btn--xs';
  clearBtn.textContent = 'Limpiar';

  head.appendChild(title);
  head.appendChild(clearBtn);
  dd.appendChild(head);

  /* Items */
  NOTIFS.forEach(function(n) {
    var item = document.createElement('div');
    item.className = 'mts-d-flex mts-align-items--start mts-gap-2';
    item.style.cssText = 'padding:11px 16px;border-bottom:1px solid var(--mts-border-color);cursor:pointer;transition:background .12s';
    ddHover(item);

    var dot = document.createElement('span');
    dot.style.cssText = 'width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;background:' + n.color;

    var body = document.createElement('div');
    body.className = 'mts-flex--1';
    body.style.minWidth = '0';

    var msg = document.createElement('div');
    msg.style.cssText = 'font-size:13px;font-weight:500;color:var(--mts-text-primary)';
    msg.textContent = n.msg;

    var time = document.createElement('div');
    time.style.cssText = 'font-size:11px;color:var(--mts-text-muted);margin-top:2px';
    time.textContent = n.time;

    body.appendChild(msg);
    body.appendChild(time);
    item.appendChild(dot);
    item.appendChild(body);
    item.addEventListener('click', function() {
      closeDd();
      MTS.Toast.show({ message: n.msg, variant: 'info', duration: 2500 });
    });
    dd.appendChild(item);
  });

  /* Footer */
  var footer = document.createElement('div');
  footer.style.cssText = 'padding:10px 16px;text-align:center;border-top:1px solid var(--mts-border-color)';

  var verTodas = document.createElement('button');
  verTodas.className = 'mts-btn mts-btn--ghost mts-btn--sm';
  verTodas.textContent = 'Ver todas las notificaciones';
  verTodas.addEventListener('click', function() {
    closeDd();
    MTS.Toast.show({ message: 'Centro de notificaciones en construcción.', variant: 'info', duration: 2500 });
  });
  footer.appendChild(verTodas);
  dd.appendChild(footer);

  return dd;
}

/* ── Listeners ──────────────────────────────────────── */

/* Toggle de modo oscuro/claro */
document.addEventListener('click', function(e) {
  var btn = e.target.closest('#btn-mode-toggle');
  if (!btn) return;
  var html   = document.documentElement;
  var isDark = html.getAttribute('data-mts-mode') === 'dark';
  html.setAttribute('data-mts-mode', isDark ? 'light' : 'dark');
  var icon = document.getElementById('mode-icon');
  if (icon) {
    icon.className = isDark ? 'mts-icon mts-icon-sun' : 'mts-icon mts-icon-moon';
  }
});

/* Avatar → user dropdown */
document.addEventListener('click', function(e) {
  var wrap = e.target.closest('#topbar-avatar-wrap');
  if (!wrap) return;
  openDd(buildUserDd(), wrap);
});

/* Bell → notifications dropdown */
document.addEventListener('click', function(e) {
  var btn = e.target.closest('#btn-notifications');
  if (!btn) return;
  openDd(buildNotifDd(), btn);
});

   ============================================================ */

new MTS.DataTable({
  elementId: 'orders-table',
  columns: [
    { field: 'id',       label: 'ID',       sortable: true,  align: 'end', width: '90px'  },
    { field: 'cliente',  label: 'Cliente',  sortable: true                                 },
    { field: 'producto', label: 'Producto', sortable: true                                 },
    { field: 'total',    label: 'Total',    sortable: false,               width: '110px'  },
    {
      field:    'estado',
      label:    'Estado',
      sortable: true,
      width:    '130px',
      render:   function(v) {
        var variant = ESTADO_VARIANT[v] || 'default';
        return MTS.Badge.html(v, variant, 'sm', 'pill');
      },
    },
    { field: 'fecha', label: 'Fecha', sortable: true, width: '110px' },
  ],
  dataSource: function(query) {
    var src = ORDERS.slice();

    if (query.search) {
      var s = query.search.toLowerCase();
      src = src.filter(function(row) {
        return (
          row.id.toLowerCase().indexOf(s) >= 0      ||
          row.cliente.toLowerCase().indexOf(s) >= 0  ||
          row.producto.toLowerCase().indexOf(s) >= 0 ||
          row.estado.toLowerCase().indexOf(s) >= 0
        );
      });
    }

    if (query.orderBy) {
      var dir = query.orderDir === 'desc' ? -1 : 1;
      src.sort(function(a, b) {
        var av = (a[query.orderBy] || '').toString();
        var bv = (b[query.orderBy] || '').toString();
        return dir * av.localeCompare(bv, 'es');
      });
    }

    var total = src.length;
    var start = (query.pageNumber - 1) * query.pageSize;
    var page  = src.slice(start, start + query.pageSize);

    return Promise.resolve({ data: page, total: total });
  },
  rowId:    'id',
  pageSize: 10,
  hover:    true,
  striped:  true,
  search:   { enabled: true, minChars: 1 },
  locale:   'es',
});
