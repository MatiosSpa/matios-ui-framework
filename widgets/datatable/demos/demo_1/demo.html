  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

  <div class="demo-section">
    <div id="tabs-s1"></div>

<script src="../../matios-ui-datatable.js"></script>
<script src="../../matios-ui-datatable-i18n.js"></script>
<script>

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: 'auto',
    lazy:    false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cbhtml" style="height:100%"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cbjs"   style="height:100%"></div>' },
    ],
  });
  new MTS.CodeBlock('#' + id + '-cbhtml', { code: previewHtml, language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cbjs',   { code: jsCode,      language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

const preview_s1 = '<div id="table1"></div>';

const js_s1 =
`new MTS.DataTable({
  elementId: 'table1',
  columns: [
    { field: 'id',         label: '#',      sortable: true, align: 'end', width: '60px' },
    { field: 'name',       label: 'Name',       sortable: true },
    { field: 'email',      label: 'Email',      sortable: true },
    { field: 'department', label: 'Department', sortable: true },
    { field: 'role',       label: 'Role',       sortable: true },
  ],
  dataSource: { url: '../../mock-api/items', method: 'GET' },
  rowId:    'id',
  pageSize: 8,
  hover:    true,
  sort:     { column: 'name', direction: 'asc' },
  search:   { enabled: true, minChars: 2, width: '260px' },
  pagination: { pageSizeOptions: [5, 8, 15, 25] },
  texts: {
    search:   'Search user...',
    noData:   'No users found',
    showing:  'Showing {start}–{end} of {total} users',
    previous: '← Previous',
    next:     'Next →',
  },
  onAfterLoad: (result) => {
    console.log('[usersTable.onAfterLoad]', result.total, 'records');
  },
});`;

function initTables() {
  makeSection('tabs-s1', preview_s1, js_s1, () => {
    new MTS.DataTable({
      elementId: 'table1',
      columns: [
        { field: 'id',         label: '#',      sortable: true, align: 'end', width: '60px' },
        { field: 'name',       label: 'Name',       sortable: true },
        { field: 'email',      label: 'Email',      sortable: true },
        { field: 'department', label: 'Department', sortable: true },
        { field: 'role',       label: 'Role',       sortable: true },
      ],
      dataSource: { url: '../../mock-api/items', method: 'GET' },
      rowId:    'id',
      pageSize: 8,
      hover:    true,
      sort:     { column: 'name', direction: 'asc' },
      search:   { enabled: true, minChars: 2, width: '260px' },
      pagination: { pageSizeOptions: [5, 8, 15, 25] },
      texts: {
        search:   'Search user...',
        noData:   'No users found',
        showing:  'Showing {start}–{end} of {total} users',
        previous: '← Previous',
        next:     'Next →',
      },
      onAfterLoad: (result) => {
        console.log('[usersTable.onAfterLoad]', result.total, 'records');
      },
    });
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../../sw-datatable.js', { scope: '../../' })
    .then(reg => {
      if (reg.active) { initTables(); return; }
      const sw = reg.installing || reg.waiting;
      sw.addEventListener('statechange', () => { if (sw.state === 'activated') initTables(); });
      navigator.serviceWorker.addEventListener('controllerchange', initTables, { once: true });
    })
    .catch(err => console.warn('[Demo] SW error:', err));
}
</script>
