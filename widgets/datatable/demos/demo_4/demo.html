<!DOCTYPE html>

<head>
  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<body>

<div class="demo-page">
  <div class="demo-section">
    <div id="tabs-s4"></div>
  </div>
</div>

<script src="../../matios-ui-datatable.js"></script>
<script src="../../matios-ui-datatable-i18n.js"></script>
<script src="../../plugins/shared/matios-ui-datatable-menu.js"></script>
<script src="../../plugins/contextmenu/matios-ui-datatable-contextmenu.js"></script>
<script>

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height:  '560px',
    lazy:    false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cbhtml" style="height:100%"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cbjs"   style="height:100%"></div>' },
    ],
  });
  new MTS.CodeBlock('#' + id + '-cbhtml', { code: previewHtml, language: 'html',       height: '100%', copyable: true });
  new MTS.CodeBlock('#' + id + '-cbjs',   { code: jsCode,      language: 'javascript', height: '100%', copyable: true });
  if (typeof initFn === 'function') initFn();
}

const preview_s4 =
  '<div id="table4"></div>' +
  '<div class="result-box" id="ctxStatus">No action — right-click or the "Actions" button</div>';

const js_s4 =
`const ctxMenu = new MTS.DataTableContextMenuPlugin({
  items: [
    {
      label: 'View detail',
      icon:  'eye',
      action: (item) => { ctxStatus.textContent = \`View: \${item.name} — \${item.email}\`; },
    },
    {
      label:     'Edit',
      icon:      'edit',
      shortcut:  'E',
      condition: (item) => item.status === 'active',
      action: (item) => { ctxStatus.textContent = \`Edit: \${item.name}\`; },
    },
    { separator: true },
    {
      label:     'Activate',
      icon:      'check-circle',
      condition: (item) => item.status === 'inactive',
      action: (item) => { ctxStatus.textContent = \`Activate: \${item.name}\`; },
    },
    {
      label:     'Deactivate',
      icon:      'pause',
      condition: (item) => item.status === 'active',
      action: (item) => { ctxStatus.textContent = \`Deactivate: \${item.name}\`; },
    },
    { separator: true },
    {
      label:  'Delete',
      icon:   'trash',
      danger: true,
      action: (item) => { ctxStatus.textContent = \`Delete: \${item.name}\`; },
    },
  ],
  onOpen:  (item) => console.log('[ctxMenuTable.onOpen]',  item),
  onClose: ()     => console.log('[ctxMenuTable.onClose]'),
});

new MTS.DataTable({
  elementId: 'table4',
  columns: [
    { field: 'id',         label: '#',      sortable: true, align: 'end', width: '60px' },
    { field: 'name',       label: 'Name',       sortable: true },
    { field: 'role',       label: 'Role',       sortable: true },
    { field: 'department', label: 'Department', sortable: true },
    {
      field: 'status',
      label: 'Status',
      sortable: true,
      align: 'center',
      width: '110px',
      render: (value) => {
        const cls = value === 'active' ? 'mts-badge--success' : 'mts-badge--danger';
        const lbl = value === 'active' ? 'Active' : 'Inactive';
        return \`<span class="mts-badge \${cls}">\${lbl}</span>\`;
      },
    },
  ],
  dataSource:   { url: '/widgets/datatable/mock-api/items', method: 'GET' },
  rowId:        'id',
  pageSize:     8,
  hover:        true,
  search:       { enabled: true, minChars: 1, width: '240px' },
  actionColumn: true,
  plugins:      [ctxMenu],
});`;

function initTables() {
  makeSection('tabs-s4', preview_s4, js_s4, () => {
    const ctxStatus = document.getElementById('ctxStatus');

    const ctxMenu = new MTS.DataTableContextMenuPlugin({
      items: [
        {
          label: 'View detail',
          icon:  'eye',
          action: (item) => {
            console.log('[ctxMenuTable.onView]', item);
            ctxStatus.textContent = `View: ${item.name} — ${item.email}`;
          },
        },
        {
          label:     'Edit',
          icon:      'edit',
          shortcut:  'E',
          condition: (item) => item.status === 'active',
          action: (item) => {
            console.log('[ctxMenuTable.onEdit]', item);
            ctxStatus.textContent = `Edit: ${item.name}`;
          },
        },
        { separator: true },
        {
          label:     'Activate',
          icon:      'check-circle',
          condition: (item) => item.status === 'inactive',
          action: (item) => {
            console.log('[ctxMenuTable.onActivate]', item);
            ctxStatus.textContent = `Activate: ${item.name}`;
          },
        },
        {
          label:     'Deactivate',
          icon:      'pause',
          condition: (item) => item.status === 'active',
          action: (item) => {
            console.log('[ctxMenuTable.onDeactivate]', item);
            ctxStatus.textContent = `Deactivate: ${item.name}`;
          },
        },
        { separator: true },
        {
          label:  'Delete',
          icon:   'trash',
          danger: true,
          action: (item) => {
            console.log('[ctxMenuTable.onDelete]', item);
            ctxStatus.textContent = `Delete: ${item.name}`;
          },
        },
      ],
      onOpen:  (item) => console.log('[ctxMenuTable.onOpen]',  item),
      onClose: ()     => console.log('[ctxMenuTable.onClose]'),
    });

    new MTS.DataTable({
      elementId: 'table4',
      columns: [
        { field: 'id',         label: '#',      sortable: true, align: 'end', width: '60px' },
        { field: 'name',       label: 'Name',       sortable: true },
        { field: 'role',       label: 'Role',       sortable: true },
        { field: 'department', label: 'Department', sortable: true },
        {
          field: 'status',
          label: 'Status',
          sortable: true,
          align: 'center',
          width: '110px',
          render: (value) => {
            const cls = value === 'active' ? 'mts-badge--success' : 'mts-badge--danger';
            const lbl = value === 'active' ? 'Active' : 'Inactive';
            return `<span class="mts-badge ${cls}">${lbl}</span>`;
          },
        },
      ],
      dataSource:   { url: '/widgets/datatable/mock-api/items', method: 'GET' },
      rowId:        'id',
      pageSize:     8,
      hover:        true,
      search:       { enabled: true, minChars: 1, width: '240px' },
      actionColumn: true,
      plugins:      [ctxMenu],
    });
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../../sw-datatable.js', { scope: '/widgets/datatable/' })
    .then(reg => {
      if (reg.active) { initTables(); return; }
      const sw = reg.installing || reg.waiting;
      sw.addEventListener('statechange', () => { if (sw.state === 'activated') initTables(); });
      navigator.serviceWorker.addEventListener('controllerchange', initTables, { once: true });
    })
    .catch(err => console.warn('[Demo] SW error:', err));
}
</script>
</body>
