<!DOCTYPE html>
<html lang="en" data-mts-mode="light">
<head>
  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<div class="demo-page">
  <div class="demo-section">
    <div id="tabs-s9"></div>
  </div>
</div>

<script src="../../matios-ui-datatable.js"></script>
<script src="../../matios-ui-datatable-i18n.js"></script>
<script src="../../plugins/columnvisibility/matios-ui-datatable-columnvisibility.js"></script>
<script>

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height:  '540px',
    lazy:    false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cbhtml" style="height:100%"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cbjs"   style="height:100%"></div>' },
    ],
  });
  new MTS.CodeBlock('#' + id + '-cbhtml', { code: previewHtml, language: 'html',       height: '100%', copyable: true });
  new MTS.CodeBlock('#' + id + '-cbjs',   { code: jsCode,      language: 'javascript', height: '100%', copyable: true });
  if (typeof initFn === 'function') initFn();
}

const preview_s9 = '<div id="table9"></div>';

const js_s9 =
`const colVis = new MTS.DataTableColumnVisibilityPlugin();

new MTS.DataTable({
  elementId: 'table9',
  columns: [
    { field: 'id',         label: '#',             sortable: true, align: 'end', width: '60px',  alwaysVisible: true },
    { field: 'name',       label: 'Name',          sortable: true,                               alwaysVisible: true },
    { field: 'email',      label: 'Email',         sortable: true },
    { field: 'department', label: 'Department',    sortable: true },
    { field: 'role',       label: 'Role',          sortable: true },
    { field: 'joinDate',   label: 'Join date',     sortable: true, align: 'end', width: '140px' },
    {
      field: 'status', label: 'Status', sortable: true, align: 'center', width: '110px',
      render: (value) => {
        const cls = value === 'active' ? 'mts-badge--success' : 'mts-badge--danger';
        const lbl = value === 'active' ? 'Active' : 'Inactive';
        return \`<span class="mts-badge \${cls}">\${lbl}</span>\`;
      },
    },
  ],
  dataSource: { url: '/widgets/datatable/mock-api/items', method: 'GET' },
  rowId:    'id',
  pageSize: 8,
  hover:    true,
  search:   { enabled: true, minChars: 1, width: '240px' },
  plugins:  [colVis],
  onAfterLoad: (result) => {
    console.log('[colVisTable.onAfterLoad]', result.total, 'records');
  },
});`;

function initTables() {
  makeSection('tabs-s9', preview_s9, js_s9, () => {
    const colVis = new MTS.DataTableColumnVisibilityPlugin();

    new MTS.DataTable({
      elementId: 'table9',
      columns: [
        { field: 'id',         label: '#',             sortable: true, align: 'end', width: '60px',  alwaysVisible: true },
        { field: 'name',       label: 'Name',          sortable: true,                               alwaysVisible: true },
        { field: 'email',      label: 'Email',         sortable: true },
        { field: 'department', label: 'Department',    sortable: true },
        { field: 'role',       label: 'Role',          sortable: true },
        { field: 'joinDate',   label: 'Join date',     sortable: true, align: 'end', width: '140px' },
        {
          field: 'status',
          label: 'Status',
          sortable: true,
          align: 'center',
          width: '110px',
          render: (value) => {
            const cls = value === 'active' ? 'mts-badge--success' : 'mts-badge--danger';
            const lbl = value === 'active' ? 'Active' : 'Inactive';
            return `<span class="mts-badge ${cls}">${lbl}</span>`;
          },
        },
      ],
      dataSource: { url: '/widgets/datatable/mock-api/items', method: 'GET' },
      rowId:     'id',
      pageSize:  8,
      hover:     true,
      search:    { enabled: true, minChars: 1, width: '240px' },
      plugins:   [colVis],
      onAfterLoad: (result) => {
        console.log('[colVisTable.onAfterLoad]', result.total, 'records');
      },
    });
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../../sw-datatable.js', { scope: '/widgets/datatable/' })
    .then(reg => {
      if (reg.active) { initTables(); return; }
      const sw = reg.installing || reg.waiting;
      sw.addEventListener('statechange', () => { if (sw.state === 'activated') initTables(); });
      navigator.serviceWorker.addEventListener('controllerchange', initTables, { once: true });
    })
    .catch(err => console.warn('[Demo] SW error:', err));
}
</script>
