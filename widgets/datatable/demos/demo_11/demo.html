  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height:  '680px',
    lazy:    false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cbhtml" style="height:100%"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cbjs"   style="height:100%"></div>' },
    ],
  });
  new MTS.CodeBlock('#' + id + '-cbhtml', { code: previewHtml, language: 'html',       height: '100%', copyable: true });
  new MTS.CodeBlock('#' + id + '-cbjs',   { code: jsCode,      language: 'javascript', height: '100%', copyable: true });
  if (typeof initFn === 'function') initFn();
}

const preview_s11 = '<div id="table11"></div>';

const js_s11 =
`// ── HttpClient ────────────────────────────────────────────────────────────
const http = new MTS.HttpClient({
  baseUrl: '',
  debug:   true,
  headers: { 'X-App-Name': 'matios-ui-demo' },
});

// Public PDF URL to demonstrate a real preview in the iframe.
// Google Docs Viewer is used as a universal viewer.
const PDF_DEMO_URL = 'https://docs.google.com/viewer'
  + '?url=' + encodeURIComponent('https://www.africau.edu/images/default/sample.pdf')
  + '&embedded=true';

// ── Plugin 1: Toolbar ─────────────────────────────────────────────────────
const toolbar = new MTS.DataTableToolbarPlugin({
  buttons: [
    { label: 'Upload',     icon: 'upload',      tooltip: 'Upload a file to the current folder',
      action: () => dmUpload.open() },
    { label: 'New folder', icon: 'folder-plus', tooltip: 'Create a new folder here',
      action: () => console.log('[dm.onNewFolder]') },
    { separator: true },
    { label: 'Download', icon: 'download', tooltip: 'Download the selected files',
      condition: (table) => table.getSelection().length > 0,
      action: (table) => console.log('[dm.onDownload]', table.getSelection()) },
    { label: 'Rename',   icon: 'edit',     tooltip: 'Rename the selected item',
      condition: (table) => table.getSelection().length === 1,
      action: (table) => console.log('[dm.onRename]', table.getSelection()[0]) },
    { label: 'Move',     icon: 'move',     tooltip: 'Move the selected items',
      condition: (table) => table.getSelection().length > 0,
      action: (table) => console.log('[dm.onMove]', table.getSelection()) },
    { label: 'Delete',   icon: 'trash',    danger: true, tooltip: 'Delete the selected items',
      condition: (table) => table.getSelection().length > 0,
      action: (table) => console.log('[dm.onDelete]', table.getSelection()) },
  ],
});

// ── Plugin 2: Filter ──────────────────────────────────────────────────────
const filter = new MTS.DataTableFilterPlugin({
  filters: [
    { field: 'status',         label: 'Status',   type: 'select',
      options: [{ value: 'active', label: 'Active' }, { value: 'archived', label: 'Archived' }] },
    { field: 'workflowStatus', label: 'Workflow', type: 'select',
      options: [
        { value: 'draft',    label: 'Draft'        },
        { value: 'pending',  label: 'Pending'      },
        { value: 'review',   label: 'In review'    },
        { value: 'approved', label: 'Approved'     },
        { value: 'signed',   label: 'Signed'       },
        { value: 'rejected', label: 'Rejected'     },
      ],
    },
  ],
});

// ── Plugin 3: ColumnVisibility ────────────────────────────────────────────
const colVis = new MTS.DataTableColumnVisibilityPlugin();

// ── Plugin 4: Upload ──────────────────────────────────────────────────────
const dmUpload = new MTS.DocumentManagerUploadPlugin({
  uploadProgress: 'bar',
  uploadCheck: {
    onCheckFileExists: (file, folder) => {
      const items = dmUpload._dm?.getItems() ?? [];
      const found = items.find(i => i.type === 'file' && i.name === file.name);
      return found ? { version: found.version ?? 'v1' } : false;
    },
  },
});

// ── Plugin 5: Preview ─────────────────────────────────────────────────────
// Instantiated before dm so it can be passed as a plugin and used in
// onFileClick / onPrev / onNext. dm is declared afterwards; the callbacks
// close over it by reference (safe at runtime).
const dmPreview = new MTS.DocumentManagerPreviewPlugin({

  panels: [
    new MTS.DocumentManagerPreviewBasicInfoPanel(),
  ],

  // Fallback when show() does not receive an explicit URL.
  urlResolver: (item) => 'preview.html?name=' + encodeURIComponent(item.name || ''),

  onDownload: (item) => {
    console.log('[dmPreview.onDownload]', item);
    // window.open('/api/documents/' + item.id + '/download');
  },

  // Replace document: returning a Promise activates the indeterminate bar.
  onReplace: (item, file, version) => {
    console.log('[dmPreview.onReplace]', item, file, version);
    return http.upload('/widgets/datatable/mock-api/documents/' + item.id + '/replace', file, {
      data: { version: version },
    }).then((res) => {
      if (!res.success) throw new Error(res.message);
    });
  },

  // Navigation between files in the current folder.
  onPrev: (currentItem) => {
    console.log('[dmPreview.onPrev]', currentItem);
    const files = dm.getItems().filter((i) => i.type === 'file');
    const idx   = files.findIndex((i) => i.id === currentItem.id);
    if (idx > 0) dmPreview.show(files[idx - 1]);
  },
  onNext: (currentItem) => {
    console.log('[dmPreview.onNext]', currentItem);
    const files = dm.getItems().filter((i) => i.type === 'file');
    const idx   = files.findIndex((i) => i.id === currentItem.id);
    if (idx < files.length - 1) dmPreview.show(files[idx + 1]);
  },

  panelVisible: true,
  panelWidth:   '340px',
});

// ── Plugin 6: DocumentManager ─────────────────────────────────────────────
const dm = new MTS.DocumentManagerPlugin({
  rootLabel:   'Documents',
  breadcrumb:  true,
  dragDrop:    true,

  accept:        '.pdf,.docx,.xlsx,.html,.pptx,image/*',
  multiple:      true,
  maxFiles:      10,
  maxFileSizeMB: 25,
  onFileExists:  'ask',

  dropzone:   true,
  onFileDrop: (files, folder) => dmUpload.open(files, folder),

  onUpload: async (file, folder, { action, currentVersion } = {}) => {
    const fd = new FormData();
    fd.append('file',           file);
    fd.append('folderId',       folder?.id ?? '');
    fd.append('action',         action         ?? '');
    fd.append('currentVersion', currentVersion ?? '');
    const res = await http.post('/widgets/datatable/mock-api/documents/upload', fd);
    if (!res.success) throw new Error(res.message ?? 'Error uploading the file');
  },
  onUploaded: (files, folder) => console.log('[dm.onUploaded]', { files, folder }),
  onError:    (err, file, folder) => console.log('[dm.onError]', { err, file, folder }),

  // onFileClick explicitly connects to the preview.
  onFileClick: (item) => {
    console.log('[dm.onFileClick]', item);
    // PDFs use Google Docs Viewer to show a real document in the iframe.
    if (item.ext === 'pdf') {
      dmPreview.show(item, PDF_DEMO_URL);
    } else {
      dmPreview.show(item);
    }
  },

  onDrop: (items, folder) => console.log('[dm.onDrop]', { items, folder }),

  plugins: [
    dmUpload,
    dmPreview,
    new MTS.DocumentManagerContextMenuPlugin({
      onView:     (item)  => dmPreview.show(item),
      onDownload: (items) => console.log('[dm.onDownload]', items),
      onOpen:     (item)  => console.log('[dm.onOpen]',     item),
      onRename:   (item)  => console.log('[dm.onRename]',   item),
      onMove:     (items) => console.log('[dm.onMove]',     items),
      onDelete:   (items) => console.log('[dm.onDelete]',   items),
      plugins: [
        new MTS.DocumentManagerWorkflowPlugin({
          statusField:   'workflowStatus',
          showInToolbar: true,
          onStart:           (items) => console.log('[dm.onStart]',           items),
          onSendForApproval: (items) => console.log('[dm.onSendForApproval]', items),
          onApprove:         (items) => console.log('[dm.onApprove]',         items),
          onSign:            (items) => console.log('[dm.onSign]',            items),
          onReject:          (items) => console.log('[dm.onReject]',          items),
          onRestart:         (items) => console.log('[dm.onRestart]',         items),
        }),
      ],
    }),
  ],
});

// ── DataTable ─────────────────────────────────────────────────────────────
new MTS.DataTable({
  elementId: 'table11',
  columns: [
    { field: 'name',           label: 'Name',     sortable: true, alwaysVisible: true,
      render: (v, row) => MTS.DocumentManagerPlugin.renderName(v, row) },
    { field: 'sizeFormatted',  label: 'Size',     align: 'end',    width: '100px' },
    { field: 'modifiedAt',     label: 'Modified', sortable: true,  align: 'end', width: '130px' },
    { field: 'status',         label: 'Status',   align: 'center', width: '110px',
      render: MTS.DocumentManagerPlugin.renderStatus },
    { field: 'workflowStatus', label: 'Workflow', align: 'center', width: '130px',
      render: MTS.DocumentManagerPlugin.renderWorkflowStatus },
  ],
  dataSource: async (query) => {
    const res = await http.get('/widgets/datatable/mock-api/documents', { params: query });
    if (!res.success) throw new Error(res.message);
    return res.data;
  },
  rowId:             'id',
  pageSize:          5,
  hover:             true,
  locale:            'en',
  fixedHeader:       true,
  fixedHeaderHeight: '480px',
  sort:      { column: 'name', direction: 'asc' },
  search:    { enabled: true, minChars: 1, width: '260px' },
  selection: { mode: 'single' },
  pagination: { pageSizeOptions: [5, 10, 20, 50, 100] },
  actionColumn: true,
  plugins: [toolbar, filter, colVis, dm],
  onSelectionChange: (items) => {
    toolbar.update();
    console.log('[table.onSelectionChange]', items);
  },
});`;

function initTables() {
  makeSection('tabs-s11', preview_s11, js_s11, function() {

    // ── HttpClient ────────────────────────────────────────────────────────
    var http = new MTS.HttpClient({
      baseUrl: '',
      debug:   true,
      headers: { 'X-App-Name': 'matios-ui-demo' },
    });

    var PDF_DEMO_URL = 'https://docs.google.com/viewer'
      + '?url=' + encodeURIComponent('https://www.africau.edu/images/default/sample.pdf')
      + '&embedded=true';

    // ── Plugin 1: Toolbar ─────────────────────────────────────────────────
    var toolbar = new MTS.DataTableToolbarPlugin({
      buttons: [
        {
          label:   'Upload',
          icon:    'upload',
          tooltip: 'Upload a file to the current folder',
          action:  function() { dmUpload.open(); },
        },
        {
          label:   'New folder',
          icon:    'folder-plus',
          tooltip: 'Create a new folder here',
          action:  function() { console.log('[dm.onNewFolder]'); },
        },
        { separator: true },
        {
          label:     'Download',
          icon:      'download',
          tooltip:   'Download the selected files',
          condition: function(table) { return table.getSelection().length > 0; },
          action:    function(table) { console.log('[dm.onDownload]', table.getSelection()); },
        },
        {
          label:     'Rename',
          icon:      'edit',
          tooltip:   'Rename the selected item',
          condition: function(table) { return table.getSelection().length === 1; },
          action:    function(table) { console.log('[dm.onRename]', table.getSelection()[0]); },
        },
        {
          label:     'Move',
          icon:      'move',
          tooltip:   'Move the selected items',
          condition: function(table) { return table.getSelection().length > 0; },
          action:    function(table) { console.log('[dm.onMove]', table.getSelection()); },
        },
        {
          label:     'Delete',
          icon:      'trash',
          danger:    true,
          tooltip:   'Delete the selected items',
          condition: function(table) { return table.getSelection().length > 0; },
          action:    function(table) { console.log('[dm.onDelete]', table.getSelection()); },
        },
      ],
    });

    // ── Plugin 2: Filter ──────────────────────────────────────────────────
    var filter = new MTS.DataTableFilterPlugin({
      filters: [
        {
          field:   'status',
          label:   'Status',
          type:    'select',
          options: [
            { value: 'active',   label: 'Active'   },
            { value: 'archived', label: 'Archived' },
          ],
        },
        {
          field:   'workflowStatus',
          label:   'Workflow',
          type:    'select',
          options: [
            { value: 'draft',    label: 'Draft'     },
            { value: 'pending',  label: 'Pending'   },
            { value: 'review',   label: 'In review' },
            { value: 'approved', label: 'Approved'  },
            { value: 'signed',   label: 'Signed'    },
            { value: 'rejected', label: 'Rejected'  },
          ],
        },
      ],
    });

    // ── Plugin 3: ColumnVisibility ────────────────────────────────────────
    var colVis = new MTS.DataTableColumnVisibilityPlugin();

    // ── Plugin 4: Upload ──────────────────────────────────────────────────
    var dmUpload = new MTS.DocumentManagerUploadPlugin({
      uploadProgress: 'bar',
      uploadCheck: {
        onCheckFileExists: function(file, folder) {
          var items = (dmUpload._dm && dmUpload._dm.getItems()) ? dmUpload._dm.getItems() : [];
          var found = items.find(function(i) { return i.type === 'file' && i.name === file.name; });
          return found ? { version: found.version || 'v1' } : false;
        },
      },
    });

    // ── Plugin 5: Workflow (variable nombrada para acceder a participantsPanel) ─
    var dmWorkflow = new MTS.DocumentManagerWorkflowPlugin({
      statusField:   'workflowStatus',
      showInToolbar: true,
      currentUser:   'crojas',   // logged-in user — it is their turn in the mock

      onLoadParticipants: function(item) {
        return http.get('/widgets/datatable/mock-api/documents/' + item.id + '/participants')
          .then(function(res) { return res.data && res.data.data ? res.data.data : []; });
      },
      onReorder: function(participants, item) {
        console.log('[dm.onReorder] new order:', participants.map(function(p) { return { order: p.order, user: p.user, status: p.status }; }));
        return http.post(
          '/widgets/datatable/mock-api/documents/' + item.id + '/participants/reorder',
          { order: participants.map(function(p) { return p.id; }) }
        );
      },

      onStart:           function(items) { console.log('[dm.onStart]',           items); },
      onSendForApproval: function(items) { console.log('[dm.onSendForApproval]', items); },
      onApprove:         function(items, participant) { console.log('[dm.onApprove]', items, 'participant:', participant); },
      onSign:            function(items) { console.log('[dm.onSign]',            items); },
      onReject:          function(items, participant) { console.log('[dm.onReject]',  items, 'participant:', participant); },
      onRestart:         function(items) { console.log('[dm.onRestart]',         items); },
    });

    // ── Plugin 6: Preview ─────────────────────────────────────────────────
    var dmMetadata = new MTS.DocumentManagerPreviewMetadataPanel({
      onLoad: function(item) {
        return http.get('/widgets/datatable/mock-api/documents/' + item.id + '/metadata')
          .then(function(res) { return res.data && res.data.data ? res.data.data : []; });
      },
      onSave: function(item, fields) {
        console.log('[dmMetadata.onSave] item:', item, '| fields:', fields);
        return http.put('/widgets/datatable/mock-api/documents/' + item.id + '/metadata', {
          fields:   fields,
          document: item,
        }).then(function(res) {
          if (!res.data || !res.data.success) throw new Error('Error saving');
        });
      },
    });

    var dmNotes = new MTS.DocumentManagerPreviewNotesPanel({
      onLoad: function(item) {
        return http.get('/widgets/datatable/mock-api/documents/' + item.id + '/notes')
          .then(function(res) { return res.data && res.data.data ? res.data.data : []; });
      },
      onSave: function(item, text) {
        console.log('[dmNotes.onSave] item:', item, '| text:', text);
        return http.post('/widgets/datatable/mock-api/documents/' + item.id + '/notes', {
          text:     text,
          document: item,
        }).then(function(res) {
          if (!res.data || !res.data.data) throw new Error('No response');
          return res.data.data;
        });
      },
      onDelete: function(note, item) {
        console.log('[dmNotes.onDelete]', note.id, item.id);
        return Promise.resolve();
      },
    });

    var dmVersions = new MTS.DocumentManagerPreviewVersionsPanel({
      onLoad: function(item) {
        return http.get('/widgets/datatable/mock-api/documents/' + item.id + '/versions')
          .then(function(res) { return res.data && res.data.data ? res.data.data : []; });
      },
      onVersionSelect: function(version, item) {
        console.log('[dmVersions.onVersionSelect]', { version: version.version, name: version.name }, item.id);
      },
    });

    var dmPreview = new MTS.DocumentManagerPreviewPlugin({
      panels: [
        new MTS.DocumentManagerPreviewBasicInfoPanel(),
        dmMetadata,
        dmVersions,
        dmNotes,
        dmWorkflow.participantsPanel,
      ],
      urlResolver: function(item) {
        return 'preview.html?name=' + encodeURIComponent(item.name || '');
      },
      onDownload: function(item) {
        console.log('[dmPreview.onDownload]', item);
      },
      onReplace: function(item, file, version) {
        console.log('[dmPreview.onReplace]', item, file, version);
        return http.upload('/widgets/datatable/mock-api/documents/' + item.id + '/replace', file, {
          data: { version: version },
        }).then(function(res) {
          if (!res.success) throw new Error(res.message);
        });
      },
      onPrev: function(currentItem) {
        console.log('[dmPreview.onPrev]', currentItem);
        var files = dm.getItems().filter(function(i) { return i.type === 'file'; });
        var idx   = files.findIndex(function(i) { return i.id === currentItem.id; });
        if (idx > 0) dmPreview.show(files[idx - 1]);
      },
      onNext: function(currentItem) {
        console.log('[dmPreview.onNext]', currentItem);
        var files = dm.getItems().filter(function(i) { return i.type === 'file'; });
        var idx   = files.findIndex(function(i) { return i.id === currentItem.id; });
        if (idx < files.length - 1) dmPreview.show(files[idx + 1]);
      },
      panelVisible: true,
      panelWidth:   '340px',
    });

    // ── Plugin 6: DocumentManager ─────────────────────────────────────────
    var dm = new MTS.DocumentManagerPlugin({
      rootLabel:   'Documents',
      breadcrumb:  true,
      dragDrop:    true,

      accept:        '.pdf,.docx,.xlsx,.html,.pptx,image/*',
      multiple:      true,
      maxFiles:      10,
      maxFileSizeMB: 25,
      onFileExists:  'ask',

      dropzone:   true,
      onFileDrop: function(files, folder) { dmUpload.open(files, folder); },

      onUpload: async function(file, folder, opts) {
        var action         = (opts && opts.action)         || '';
        var currentVersion = (opts && opts.currentVersion) || '';
        var fd = new FormData();
        fd.append('file',           file);
        fd.append('folderId',       folder ? folder.id : '');
        fd.append('action',         action);
        fd.append('currentVersion', currentVersion);
        var res = await http.post('/widgets/datatable/mock-api/documents/upload', fd);
        if (!res.success) throw new Error(res.message || 'Error uploading the file');
      },
      onUploaded: function(files, folder) { console.log('[dm.onUploaded]', { files: files, folder: folder }); },
      onError:    function(err, file, folder) { console.log('[dm.onError]', { err: err, file: file, folder: folder }); },

      onFileClick: function(item) {
        console.log('[dm.onFileClick]', item);
        if (item.ext === 'pdf') {
          dmPreview.show(item, PDF_DEMO_URL);
        } else {
          dmPreview.show(item);
        }
      },
      onDrop: function(items, folder) { console.log('[dm.onDrop]', { items: items, folder: folder }); },

      plugins: [
        dmUpload,
        dmPreview,
        new MTS.DocumentManagerContextMenuPlugin({
          onView:     function(item)  { dmPreview.show(item); },
          onDownload: function(items) { console.log('[dm.onDownload]', items); },
          onOpen:     function(item)  { console.log('[dm.onOpen]',     item);  },
          onRename:   function(item)  { console.log('[dm.onRename]',   item);  },
          onMove:     function(items) { console.log('[dm.onMove]',     items); },
          onDelete:   function(items) { console.log('[dm.onDelete]',   items); },
          plugins: [
            dmWorkflow,
          ],
        }),
      ],
    });

    // ── DataTable ─────────────────────────────────────────────────────────
    new MTS.DataTable({
      elementId: 'table11',
      columns: [
        { field: 'name',           label: 'Name',     sortable: true, alwaysVisible: true,
          render: function(v, row) { return MTS.DocumentManagerPlugin.renderName(v, row); } },
        { field: 'sizeFormatted',  label: 'Size',     align: 'end',    width: '100px' },
        { field: 'modifiedAt',     label: 'Modified', sortable: true,  align: 'end', width: '130px' },
        { field: 'status',         label: 'Status',   align: 'center', width: '110px',
          render: MTS.DocumentManagerPlugin.renderStatus },
        { field: 'workflowStatus', label: 'Workflow', align: 'center', width: '130px',
          render: MTS.DocumentManagerPlugin.renderWorkflowStatus },
      ],
      dataSource: async function(query) {
        var res = await http.get('/widgets/datatable/mock-api/documents', { params: query });
        if (!res.success) throw new Error(res.message);
        return res.data;
      },
      rowId:             'id',
      pageSize:          5,
      hover:             true,
      locale:            'en',
      fixedHeader:       true,
      fixedHeaderHeight: '480px',
      sort:      { column: 'name', direction: 'asc' },
      search:    { enabled: true, minChars: 1, width: '260px' },
      selection: { mode: 'single' },
      pagination: { pageSizeOptions: [5, 10, 20, 50, 100] },
      actionColumn: true,
      plugins: [toolbar, filter, colVis, dm],
      onSelectionChange: function(items) {
        toolbar.update();
        console.log('[table.onSelectionChange]', items);
      },
    });

  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../../sw-datatable.js', { scope: '/widgets/datatable/' })
    .then(function(reg) {
      if (reg.active) { initTables(); return; }
      var sw = reg.installing || reg.waiting;
      sw.addEventListener('statechange', function() { if (sw.state === 'activated') initTables(); });
      navigator.serviceWorker.addEventListener('controllerchange', initTables, { once: true });
    })
    .catch(function(err) { console.warn('[Demo] SW error:', err); });
}
</script>
</body>
</html>
