<!DOCTYPE html>
<html lang="es" data-mts-mode="light">
<head>
  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataTable — 5 — DocumentManagerPlugin</title>
  <link rel="stylesheet" href="../../../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../../../themes/matios-ui-mode-dark.css">

  <script src="../../../../support/demo-shared.js"></script>

  <script src="../../../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>

<body>

<div class="demo-page">
  <div class="demo-section">
    <div id="tabs-s5"></div>
  </div>
</div>

<script src="../../matios-ui-datatable.js"></script>
<script src="../../matios-ui-datatable-i18n.js"></script>
<script src="../../plugins/shared/matios-ui-datatable-menu.js"></script>
<script src="../../plugins/documentmanager/matios-ui-datatable-documentmanager.js"></script>
<script src="../../plugins/documentmanager/matios-ui-datatable-documentmanager-contextmenu.js"></script>
<script src="../../plugins/documentmanager/matios-ui-datatable-documentmanager-workflow.js"></script>
<script>

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height:  '640px',
    lazy:    false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cbhtml" style="height:100%"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cbjs"   style="height:100%"></div>' },
    ],
  });
  new MTS.CodeBlock('#' + id + '-cbhtml', { code: previewHtml, language: 'html',       height: '100%' });
  new MTS.CodeBlock('#' + id + '-cbjs',   { code: jsCode,      language: 'javascript', height: '100%' });
  if (typeof initFn === 'function') initFn();
}

const preview_s5 = '<div id="table5"></div>';

const js_s5 =
`const http = new MTS.HttpClient({ baseUrl: '', debug: true });

const dm = new MTS.DocumentManagerPlugin({
  rootLabel:   'Documentos',
  breadcrumb:  true,
  dragDrop:    true,
  onFileClick: (item)          => console.log('[documentTable.onFileClick]',  item),
  onDrop:      (items, folder) => console.log('[documentTable.onDrop]', { items, folder }),
  plugins: [
    new MTS.DocumentManagerContextMenuPlugin({
      onView:     (item)  => console.log('[documentTable.onView]',     item),
      onDownload: (items) => console.log('[documentTable.onDownload]', items),
      onOpen:     (item)  => console.log('[documentTable.onOpen]',     item),
      onRename:   (item)  => console.log('[documentTable.onRename]',   item),
      onMove:     (items) => console.log('[documentTable.onMove]',     items),
      onDelete:   (items) => console.log('[documentTable.onDelete]',   items),
      plugins: [
        new MTS.DocumentManagerWorkflowPlugin({
          statusField:       'workflowStatus',
          onStart:           (items) => console.log('[documentTable.onStart]',           items),
          onSendForApproval: (items) => console.log('[documentTable.onSendForApproval]', items),
          onApprove:         (items) => console.log('[documentTable.onApprove]',         items),
          onSign:            (items) => console.log('[documentTable.onSign]',            items),
          onReject:          (items) => console.log('[documentTable.onReject]',          items),
          onRestart:         (items) => console.log('[documentTable.onRestart]',         items),
        }),
      ],
    }),
  ],
});

new MTS.DataTable({
  elementId: 'table5',
  columns: [
    {
      field: 'name',
      label: 'Nombre',
      sortable: true,
      render: (v, row) => MTS.DocumentManagerPlugin.renderName(v, row),
    },
    { field: 'size',     label: 'Tamaño',    align: 'end',    width: '100px', render: MTS.DocumentManagerPlugin.renderSize },
    { field: 'modified', label: 'Modificado', sortable: true, align: 'end',   width: '130px' },
    { field: 'status',         label: 'Estado',   align: 'center', width: '110px', render: MTS.DocumentManagerPlugin.renderStatus },
    { field: 'workflowStatus', label: 'Workflow',  align: 'center', width: '120px', render: MTS.DocumentManagerPlugin.renderWorkflowStatus },
  ],
  dataSource: async (query) => {
    const res = await http.get('/widgets/datatable/mock-api/documents', { params: query });
    if (!res.success) throw new Error(res.message);
    return res.data;
  },
  rowId:        'id',
  pageSize:     10,
  hover:        true,
  sort:         { column: 'name', direction: 'asc' },
  search:       { enabled: true, minChars: 1, width: '240px' },
  selection:    { mode: 'multi' },
  actionColumn: true,
  plugins:      [dm],
});`;

function initTables() {
  makeSection('tabs-s5', preview_s5, js_s5, () => {
    const docsHttp = new MTS.HttpClient({
      baseUrl: '',
      debug:   true,
      headers: { 'X-App-Name': 'matios-ui-demo' },
    });

    const dm = new MTS.DocumentManagerPlugin({
      rootLabel:   'Documentos',
      breadcrumb:  true,
      dragDrop:    true,
      onFileClick: (item)          => console.log('[documentTable.onFileClick]',  item),
      onDrop:      (items, folder) => console.log('[documentTable.onDrop]', { items, folder }),
      plugins: [
        new MTS.DocumentManagerContextMenuPlugin({
          onView:      (item)  => console.log('[documentTable.onView]',      item),
          onDownload:  (items) => console.log('[documentTable.onDownload]',  items),
          onOpen:      (item)  => console.log('[documentTable.onOpen]',      item),
          onRename:    (item)  => console.log('[documentTable.onRename]',    item),
          onMove:      (items) => console.log('[documentTable.onMove]',      items),
          onDelete:    (items) => console.log('[documentTable.onDelete]',    items),
          plugins: [
            new MTS.DocumentManagerWorkflowPlugin({
              statusField:       'workflowStatus',
              onStart:           (items) => console.log('[documentTable.onStart]',           items),
              onSendForApproval: (items) => console.log('[documentTable.onSendForApproval]', items),
              onApprove:         (items) => console.log('[documentTable.onApprove]',         items),
              onSign:            (items) => console.log('[documentTable.onSign]',            items),
              onReject:          (items) => console.log('[documentTable.onReject]',          items),
              onRestart:         (items) => console.log('[documentTable.onRestart]',         items),
            }),
          ],
        }),
      ],
    });

    new MTS.DataTable({
      elementId: 'table5',
      columns: [
        {
          field: 'name',
          label: 'Nombre',
          sortable: true,
          render: (v, row) => MTS.DocumentManagerPlugin.renderName(v, row),
        },
        {
          field:  'size',
          label:  'Tamaño',
          align:  'end',
          width:  '100px',
          render: MTS.DocumentManagerPlugin.renderSize,
        },
        { field: 'modified', label: 'Modificado', sortable: true, align: 'end', width: '130px' },
        {
          field:  'status',
          label:  'Estado',
          align:  'center',
          width:  '110px',
          render: MTS.DocumentManagerPlugin.renderStatus,
        },
        {
          field:  'workflowStatus',
          label:  'Workflow',
          align:  'center',
          width:  '120px',
          render: MTS.DocumentManagerPlugin.renderWorkflowStatus,
        },
      ],
      dataSource: async (query) => {
        const res = await docsHttp.get('/widgets/datatable/mock-api/documents', { params: query });
        if (!res.success) throw new Error(res.message);
        return res.data;
      },
      rowId:        'id',
      pageSize:     10,
      hover:        true,
      sort:         { column: 'name', direction: 'asc' },
      search:       { enabled: true, minChars: 1, width: '240px' },
      selection:    { mode: 'multi' },
      actionColumn: true,
      plugins:      [dm],
    });
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../../sw-datatable.js', { scope: '/widgets/datatable/' })
    .then(reg => {
      if (reg.active) { initTables(); return; }
      const sw = reg.installing || reg.waiting;
      sw.addEventListener('statechange', () => { if (sw.state === 'activated') initTables(); });
      navigator.serviceWorker.addEventListener('controllerchange', initTables, { once: true });
    })
    .catch(err => console.warn('[Demo] SW error:', err));
}
</script>
</body>
</html>
