<!DOCTYPE html>

  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<div class="demo-page">
  <div class="demo-section">
    <div id="tabs-s12"></div>

</div>

<script>

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height:  '680px',
    lazy:    false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cbhtml" style="height:100%"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cbjs"   style="height:100%"></div>' },
    ],
  });
  new MTS.CodeBlock('#' + id + '-cbhtml', { code: previewHtml, language: 'html',       height: '100%' });
  new MTS.CodeBlock('#' + id + '-cbjs',   { code: jsCode,      language: 'javascript', height: '100%' });
  if (typeof initFn === 'function') initFn();
}

const preview_s12 = '<div id="table12"></div>';

const js_s12 =
`// ── HttpClient ─────────────────────────────────────────────────────────────
const http = new MTS.HttpClient({ baseUrl: '', debug: true });

// ── URL de un PDF público para demostrar la vista previa real ───────────────
// Se usa Google Docs Viewer como visor universal de PDFs en iframe.
const PDF_DEMO_URL = 'https://docs.google.com/viewer'
  + '?url=' + encodeURIComponent('https://www.africau.edu/images/default/sample.pdf')
  + '&embedded=true';

// ── Plugin 1: PreviewPlugin ─────────────────────────────────────────────────
// Se instancia antes que DocumentManagerPlugin para poder
// pasarlo como plugin Y usarlo en onFileClick.
const dmPreview = new MTS.DocumentManagerPreviewPlugin({

  // Sub-paneles del acordeón lateral.
  // Cada panel es independiente y puede cargar datos async.
  panels: [
    new MTS.DocumentManagerPreviewBasicInfoPanel(),
  ],

  // Fallback: URL resuelta a partir del ítem cuando show() no recibe URL explícita.
  // En producción apuntaría a tu endpoint de previsualización.
  urlResolver: function(item) {
    return 'preview.html?name=' + encodeURIComponent(item.name || '');
  },

  // Botón "Descargar" en el header del modal.
  // Recibe el ítem completo — el dev decide el destino.
  onDownload: function(item) {
    console.log('[dmPreview.onDownload]', item);
    // window.open('/api/documents/' + item.id + '/download');
  },

  panelVisible: true,    // panel lateral abierto al inicio (default: true)
  panelWidth:   '340px',
});

// ── Plugin 2: Toolbar ───────────────────────────────────────────────────────
const toolbar = new MTS.DataTableToolbarPlugin({
  buttons: [
    { label: 'Nueva carpeta', icon: 'folder-plus',
      action: function() { console.log('[dm.onNuevaCarpeta]'); } },
  ],
});

// ── Plugin 3: DocumentManager ───────────────────────────────────────────────
const dm = new MTS.DocumentManagerPlugin({
  rootLabel:  'Documentos',
  breadcrumb: true,
  dragDrop:   true,

  // onFileClick conecta explícitamente el dm con el preview.
  // Esto permite al dev usar su propio modal, navegación, etc.
  onFileClick: function(item) {
    console.log('[dm.onFileClick]', item);

    // show(item) — usa urlResolver
    // show(item, url) — url sobreescribe urlResolver para esta apertura
    //
    // Para archivos PDF en la demo usamos un visor externo (Google Docs Viewer)
    // para mostrar un documento real en el iframe:
    if (item.ext === 'pdf') {
      dmPreview.show(item, PDF_DEMO_URL);
    } else {
      dmPreview.show(item);
    }
  },

  onDrop: function(items, folder) {
    console.log('[dm.onDrop]', { items, folder });
  },

  plugins: [
    dmPreview,
    new MTS.DocumentManagerContextMenuPlugin({
      onView:     function(item)  { dmPreview.show(item); },
      onDownload: function(items) { console.log('[dm.ctx.onDownload]', items); },
      onRename:   function(item)  { console.log('[dm.ctx.onRename]',   item);  },
      onDelete:   function(items) { console.log('[dm.ctx.onDelete]',   items); },
    }),
  ],
});

// ── DataTable ───────────────────────────────────────────────────────────────
new MTS.DataTable({
  elementId: 'table12',
  columns: [
    { field: 'name',     label: 'Nombre',     sortable: true, alwaysVisible: true,
      render: function(v, row) { return MTS.DocumentManagerPlugin.renderName(v, row); } },
    { field: 'sizeFormatted', label: 'Tamaño', align: 'end', width: '100px' },
    { field: 'modifiedAt', label: 'Modificado', sortable: true, align: 'end', width: '130px' },
    { field: 'status',   label: 'Estado',     align: 'center', width: '110px',
      render: MTS.DocumentManagerPlugin.renderStatus },
  ],
  dataSource: async function(query) {
    const res = await http.get('/widgets/datatable/mock-api/documents', { params: query });
    if (!res.success) throw new Error(res.message);
    return res.data;
  },
  rowId:             'id',
  pageSize:          10,
  hover:             true,
  locale:            'es',
  fixedHeader:       true,
  fixedHeaderHeight: '480px',
  sort:      { column: 'name', direction: 'asc' },
  search:    { enabled: true, minChars: 1, width: '260px' },
  selection: { mode: 'single' },
  plugins:   [toolbar, dm],
});`;

function initTables() {
  makeSection('tabs-s12', preview_s12, js_s12, function() {

    var http = new MTS.HttpClient({ baseUrl: '', debug: true });

    var PDF_DEMO_URL = 'https://docs.google.com/viewer'
      + '?url=' + encodeURIComponent('https://www.africau.edu/images/default/sample.pdf')
      + '&embedded=true';

    var dmPreview = new MTS.DocumentManagerPreviewPlugin({
      panels: [
        new MTS.DocumentManagerPreviewBasicInfoPanel(),
      ],
      urlResolver: function(item) {
        return 'preview.html?name=' + encodeURIComponent(item.name || '');
      },
      onDownload: function(item) {
        console.log('[dmPreview.onDownload]', item);
      },
      panelVisible: true,
      panelWidth:   '340px',
    });

    var toolbar = new MTS.DataTableToolbarPlugin({
      buttons: [
        { label: 'Nueva carpeta', icon: 'folder-plus',
          action: function() { console.log('[dm.onNuevaCarpeta]'); } },
      ],
    });

    var dm = new MTS.DocumentManagerPlugin({
      rootLabel:  'Documentos',
      breadcrumb: true,
      dragDrop:   true,

      onFileClick: function(item) {
        console.log('[dm.onFileClick]', item);
        if (item.ext === 'pdf') {
          dmPreview.show(item, PDF_DEMO_URL);
        } else {
          dmPreview.show(item);
        }
      },

      onDrop: function(items, folder) {
        console.log('[dm.onDrop]', { items, folder });
      },

      plugins: [
        dmPreview,
        new MTS.DocumentManagerContextMenuPlugin({
          onView:     function(item)  { dmPreview.show(item); },
          onDownload: function(items) { console.log('[dm.ctx.onDownload]', items); },
          onRename:   function(item)  { console.log('[dm.ctx.onRename]',   item);  },
          onDelete:   function(items) { console.log('[dm.ctx.onDelete]',   items); },
        }),
      ],
    });

    new MTS.DataTable({
      elementId: 'table12',
      columns: [
        { field: 'name',         label: 'Nombre',     sortable: true, alwaysVisible: true,
          render: function(v, row) { return MTS.DocumentManagerPlugin.renderName(v, row); } },
        { field: 'sizeFormatted', label: 'Tamaño',    align: 'end',    width: '100px' },
        { field: 'modifiedAt',   label: 'Modificado', sortable: true,  align: 'end', width: '130px' },
        { field: 'status',       label: 'Estado',     align: 'center', width: '110px',
          render: MTS.DocumentManagerPlugin.renderStatus },
      ],
      dataSource: function(query) {
        return http.get('/widgets/datatable/mock-api/documents', { params: query })
          .then(function(res) {
            if (!res.success) throw new Error(res.message);
            return res.data;
          });
      },
      rowId:             'id',
      pageSize:          10,
      hover:             true,
      locale:            'es',
      fixedHeader:       true,
      fixedHeaderHeight: '480px',
      sort:      { column: 'name', direction: 'asc' },
      search:    { enabled: true, minChars: 1, width: '260px' },
      selection: { mode: 'single' },
      plugins:   [toolbar, dm],
    });

  });
}

initTables();

</script>
