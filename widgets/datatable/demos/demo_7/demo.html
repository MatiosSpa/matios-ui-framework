<!DOCTYPE html>
<html lang="en" data-mts-mode="light">
<head>
  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<body>

<div class="demo-page">
  <div class="demo-section">
    <div id="tabs-s7"></div>
  </div>
</div>

<script src="../../matios-ui-datatable.js"></script>
<script src="../../matios-ui-datatable-i18n.js"></script>
<script src="../../plugins/toolbar/matios-ui-datatable-toolbar.js"></script>
<script>

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height:  '560px',
    lazy:    false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cbhtml" style="height:100%"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cbjs"   style="height:100%"></div>' },
    ],
  });
  new MTS.CodeBlock('#' + id + '-cbhtml', { code: previewHtml, language: 'html',       height: '100%', copyable: true });
  new MTS.CodeBlock('#' + id + '-cbjs',   { code: jsCode,      language: 'javascript', height: '100%', copyable: true });
  if (typeof initFn === 'function') initFn();
}

const preview_s7 =
  '<div id="table7"></div>' +
  '<div class="result-box" id="toolbarStatus">No action</div>';

const js_s7 =
`const toolbarBtns = new MTS.DataTableToolbarPlugin({
  buttons: [
    { label: 'New',   icon: 'plus',     tooltip: 'Create a new record',
      action: (table) => { toolbarStatus.textContent = 'onNew'; } },
    { label: 'Export', icon: 'download', tooltip: 'Export visible data',
      action: () => { toolbarStatus.textContent = 'onExport'; } },
    { icon: 'refresh',  tooltip: 'Reload table',
      action: (table) => { table.reload(); toolbarStatus.textContent = 'onReload'; } },
    { separator: true },
    { label: 'Import', tooltip: 'Import from file',
      action: () => { toolbarStatus.textContent = 'onImport'; } },
    { separator: true },
    {
      label:     'Delete selection',
      icon:      'trash',
      danger:    true,
      tooltip:   'Delete the selected records',
      condition: (table) => table.getSelection().length > 0,
      action: (table) => {
        toolbarStatus.textContent = 'onDelete → ' + table.getSelection().map(i => i.name).join(', ');
      },
    },
  ],
});

new MTS.DataTable({
  elementId: 'table7',
  columns: [
    { field: 'id',         label: '#',      sortable: true, align: 'end', width: '60px' },
    { field: 'name',       label: 'Name',   sortable: true },
    { field: 'email',      label: 'Email',  sortable: true },
    { field: 'department', label: 'Area',   sortable: true },
    {
      field: 'status', label: 'Status', sortable: true, align: 'center', width: '110px',
      render: (value) => {
        const cls = value === 'active' ? 'mts-badge--success' : 'mts-badge--danger';
        const lbl = value === 'active' ? 'Active' : 'Inactive';
        return \`<span class="mts-badge \${cls}">\${lbl}</span>\`;
      },
    },
  ],
  dataSource: { url: '/widgets/datatable/mock-api/items', method: 'GET' },
  rowId:     'id',
  pageSize:  8,
  hover:     true,
  search:    { enabled: true, minChars: 1, width: '240px' },
  selection: { mode: 'multi' },
  plugins:   [toolbarBtns],
  onSelectionChange: (items) => { toolbarBtns.update(); },
});`;

function initTables() {
  makeSection('tabs-s7', preview_s7, js_s7, () => {
    const toolbarStatus = document.getElementById('toolbarStatus');

    const toolbarBtns = new MTS.DataTableToolbarPlugin({
      buttons: [
        {
          label:   'New',
          icon:    'plus',
          tooltip: 'Create a new record',
          action:  (table) => {
            console.log('[toolbarTable.onNew]', table.getSelection());
            toolbarStatus.textContent = 'onNew';
          },
        },
        {
          label:   'Export',
          icon:    'download',
          tooltip: 'Export visible data',
          action:  () => {
            console.log('[toolbarTable.onExport]');
            toolbarStatus.textContent = 'onExport';
          },
        },
        {
          icon:    'refresh',
          tooltip: 'Reload table',
          action:  (table) => {
            console.log('[toolbarTable.onReload]');
            toolbarStatus.textContent = 'onReload';
            table.reload();
          },
        },
        { separator: true },
        {
          label:   'Import',
          tooltip: 'Import from file',
          action:  () => {
            console.log('[toolbarTable.onImport]');
            toolbarStatus.textContent = 'onImport';
          },
        },
        { separator: true },
        {
          label:     'Delete selection',
          icon:      'trash',
          danger:    true,
          tooltip:   'Delete the selected records',
          condition: (table) => table.getSelection().length > 0,
          action:    (table) => {
            const sel = table.getSelection();
            console.log('[toolbarTable.onDelete]', sel);
            toolbarStatus.textContent = 'onDelete → ' + sel.map(i => i.name).join(', ');
          },
        },
      ],
    });

    new MTS.DataTable({
      elementId: 'table7',
      columns: [
        { field: 'id',         label: '#',      sortable: true, align: 'end', width: '60px' },
        { field: 'name',       label: 'Name',   sortable: true },
        { field: 'email',      label: 'Email',  sortable: true },
        { field: 'department', label: 'Area',   sortable: true },
        {
          field: 'status',
          label: 'Status',
          sortable: true,
          align: 'center',
          width: '110px',
          render: (value) => {
            const cls = value === 'active' ? 'mts-badge--success' : 'mts-badge--danger';
            const lbl = value === 'active' ? 'Active' : 'Inactive';
            return `<span class="mts-badge ${cls}">${lbl}</span>`;
          },
        },
      ],
      dataSource: { url: '/widgets/datatable/mock-api/items', method: 'GET' },
      rowId:     'id',
      pageSize:  8,
      hover:     true,
      search:    { enabled: true, minChars: 1, width: '240px' },
      selection: { mode: 'multi' },
      plugins:   [toolbarBtns],
      onSelectionChange: (items) => {
        console.log('[toolbarTable.onSelectionChange]', items);
        toolbarBtns.update();
      },
    });
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../../sw-datatable.js', { scope: '/widgets/datatable/' })
    .then(reg => {
      if (reg.active) { initTables(); return; }
      const sw = reg.installing || reg.waiting;
      sw.addEventListener('statechange', () => { if (sw.state === 'activated') initTables(); });
      navigator.serviceWorker.addEventListener('controllerchange', initTables, { once: true });
    })
    .catch(err => console.warn('[Demo] SW error:', err));
}
</script>
