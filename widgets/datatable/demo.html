  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<body>


<div class="demo-page">

  <div class="demo-header">
    <h1><span>MTS</span>.DataTable</h1>
    <p>Dynamic datatable with server-side pagination, search, sort, selection and a plugin system. Pure core with no external dependencies.</p>
  </div>

  <div id="dt-demos-accordion"></div>

</div>

<script>
  const DEMOS = [
    { id: 'd1',  label: '1 — Basic with search and pagination',                                  src: 'demos/demo_1/demo.html'  },
    { id: 'd2',  label: '2 — Multiple selection with checkboxes',                                 src: 'demos/demo_2/demo.html'  },
    { id: 'd3',  label: '3 — Custom render per cell + fixed header + rowClass',                   src: 'demos/demo_3/demo.html'  },
    { id: 'd4',  label: '4 — MTS.ContextMenuPlugin (right click + actions column)',               src: 'demos/demo_4/demo.html'  },
    { id: 'd5',  label: '5 — MTS.DataTableColumnActionsPlugin (standalone actions column)',       src: 'demos/demo_6/demo.html'  },
    { id: 'd6',  label: '6 — MTS.DataTableToolbarPlugin (toolbar buttons)',                       src: 'demos/demo_7/demo.html'  },
    { id: 'd7',  label: '7 — MTS.DataTableFilterPlugin (filters with chips)',                     src: 'demos/demo_8/demo.html'  },
    { id: 'd8',  label: '8 — MTS.DataTableColumnVisibilityPlugin (column toggle)',                src: 'demos/demo_9/demo.html'  },
    { id: 'd9',  label: '9 — MTS.DataTableExpandRowPlugin (expandable rows)',                     src: 'demos/demo_10/demo.html' },
    { id: 'd10', label: '10 — DocumentManager completo (Upload + Preview + Workflow + Filter + ColVis)', src: 'demos/demo_11/demo.html' },
  ];

  /* Propaga modo y acento activo al iframe que se abre */
  function buildFrameSrc(src) {
    const mode   = document.documentElement.getAttribute('data-mts-mode')   || 'light';
    const accent = document.documentElement.getAttribute('data-mts-accent') || '';
    let url = src + '?mts-mode=' + mode;
    if (accent) url += '&mts-accent=' + accent;
    return url;
  }

  const accordion = new MTS.Accordion('#dt-demos-accordion', {
    multiple: false,
    items: DEMOS.map(d => ({
      id:      d.id,
      title:   d.label,
      content: `<iframe
                  class="dt-demo-frame demo-launcher__iframe"
                  data-src="${d.src}"
                  title="${d.label}">
                </iframe>`,
    })),
    onOpen: (e) => {
      const body = document.getElementById(`mts-acc-body-${e.detail.id}`);
      if (!body) return;
      const frame = body.querySelector('iframe[data-src]');
      if (!frame) return;

      /* Carga lazy: asigna src la primera vez que se abre el panel */
      frame.src = buildFrameSrc(frame.getAttribute('data-src'));
      frame.removeAttribute('data-src');

      /* Auto-sizing: ajusta la altura al contenido real del iframe */
      frame.addEventListener('load', () => {
        const syncHeight = () => {
          try {
            const h = frame.contentDocument.documentElement.scrollHeight;
            if (h > 0) frame.style.height = h + 'px';
          } catch (_) {}
        };
        syncHeight();
        /* Sigue sincronizando cuando la tabla termina de cargar los datos */
        try {
          const ro = new ResizeObserver(syncHeight);
          ro.observe(frame.contentDocument.documentElement);
        } catch (_) {}
      }, { once: true });
    },
  });

  /* Abre el primer panel al cargar */
  accordion.open('d1');
</script>
