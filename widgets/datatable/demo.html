<!DOCTYPE html>
<html lang="es" data-mts-mode="light">
<head>
  <script>
    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTS.DataTable — Demo</title>
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-accordion/matios-ui-accordion.css">
  <script src="../../support/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-accordion/matios-ui-accordion.js"></script>
  <style>
    .dt-demo-frame {
      display: block;
      width: 100%;
      min-height: 1100px;
      border: none;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>

<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent('corporate')">Corporate</button>
  <button class="demo-btn-sm" onclick="setAccent('navy')">Navy</button>
  <button class="demo-btn-sm" onclick="setAccent('emerald')">Emerald</button>
  <button class="demo-btn-sm" onclick="setAccent('petrol')">Petrol</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>

<div class="demo-page">

  <div class="demo-header">
    <h1><span>MTS</span>.DataTable</h1>
    <p>Datatable dinámico con paginación server-side, búsqueda, sort, selección y sistema de plugins. Core puro sin dependencias externas.</p>
  </div>

  <div id="dt-demos-accordion"></div>

</div>

<script>
  const DEMOS = [
    { id: 'd1',  label: '1 — Básico con búsqueda y paginación',                                  src: 'demos/demo_1/demo.html'  },
    { id: 'd2',  label: '2 — Selección múltiple con checkboxes',                                 src: 'demos/demo_2/demo.html'  },
    { id: 'd3',  label: '3 — Custom render por celda + fixed header + rowClass',                 src: 'demos/demo_3/demo.html'  },
    { id: 'd4',  label: '4 — MTS.ContextMenuPlugin (clic derecho + columna de acciones)',        src: 'demos/demo_4/demo.html'  },
    { id: 'd5',  label: '5 — MTS.DataTableColumnActionsPlugin (columna de acciones standalone)', src: 'demos/demo_6/demo.html'  },
    { id: 'd6',  label: '6 — MTS.DataTableToolbarPlugin (botones en toolbar)',                   src: 'demos/demo_7/demo.html'  },
    { id: 'd7',  label: '7 — MTS.DataTableFilterPlugin (filtros con chips)',                     src: 'demos/demo_8/demo.html'  },
    { id: 'd8',  label: '8 — MTS.DataTableColumnVisibilityPlugin (toggle de columnas)',          src: 'demos/demo_9/demo.html'  },
    { id: 'd9',  label: '9 — MTS.DataTableExpandRowPlugin (filas expandibles)',                  src: 'demos/demo_10/demo.html' },
    { id: 'd10', label: '10 — DataTable + DocumentManager Plugin',                               src: 'demos/demo_11/demo.html' },
  ];

  /* Propaga modo y acento activo al iframe que se abre */
  function buildFrameSrc(src) {
    const mode   = document.documentElement.getAttribute('data-mts-mode')   || 'light';
    const accent = document.documentElement.getAttribute('data-mts-accent') || '';
    let url = src + '?mts-mode=' + mode;
    if (accent) url += '&mts-accent=' + accent;
    return url;
  }

  const accordion = new MTS.Accordion('#dt-demos-accordion', {
    multiple: false,
    items: DEMOS.map(d => ({
      id:      d.id,
      title:   d.label,
      content: `<iframe
                  class="dt-demo-frame"
                  data-src="${d.src}"
                  title="${d.label}">
                </iframe>`,
    })),
    onOpen: (e) => {
      const body = document.getElementById(`mts-acc-body-${e.detail.id}`);
      if (!body) return;
      const frame = body.querySelector('iframe[data-src]');
      if (!frame) return;

      /* Carga lazy: asigna src la primera vez que se abre el panel */
      frame.src = buildFrameSrc(frame.getAttribute('data-src'));
      frame.removeAttribute('data-src');

      /* Auto-sizing: ajusta la altura al contenido real del iframe */
      frame.addEventListener('load', () => {
        const syncHeight = () => {
          try {
            const h = frame.contentDocument.documentElement.scrollHeight;
            if (h > 0) frame.style.height = h + 'px';
          } catch (_) {}
        };
        syncHeight();
        /* Sigue sincronizando cuando la tabla termina de cargar los datos */
        try {
          const ro = new ResizeObserver(syncHeight);
          ro.observe(frame.contentDocument.documentElement);
        } catch (_) {}
      }, { once: true });
    },
  });

  /* Abre el primer panel al cargar */
  accordion.open('d1');
</script>
</body>
</html>
