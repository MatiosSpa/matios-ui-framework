<!DOCTYPE html>
<html lang="es" class="mts-h-full" data-mts-mode="light">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../../themes/matios-ui-accent-navy.css">

  <link rel="stylesheet" href="../matios-ui-kanban/matios-ui-kanban.css">

  <script src="../../../navigation/matios-ui-topbar/matios-ui-topbar.js"></script>
  <script src="../../../forms/matios-ui-button/matios-ui-button.js"></script>

<body class="mts-vh-100 mts-p-0 mts-d-flex mts-flex-col mts-overflow-hidden">

<div id="sb-toolbar"></div>
<div class="mts-flex-1 mts-min-h-0 mts-d-flex mts-flex-col mts-overflow-hidden"><div id="sprint" class="mts-flex-1 mts-min-h-0"></div></div>

<script>
/* ═══ LOCALE ═══ Todo texto del demo sale del locale del componente (MTS.SprintBoard). */
/* Public demo: default English; ?lang=es|en|pt to switch. */
(function () { var m = (location.search || '').match(/[?&]lang=(es|en|pt)/); if (window.MTS && MTS.setLocale) MTS.setLocale(m ? m[1] : 'en'); })();
var LS = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.SprintBoard']) || {};
var UI = LS.ui || {};
var TYPES = UI.types || {}, PRIOS = UI.priorities || {};

/* ═══ DATOS ═══ */
var TEAM = ['Ana Torres', 'Luis Pérez', 'María Soto', 'Carlos Ruiz', 'Pedro Díaz'];
var SP_VALUES = [1, 2, 3, 5, 8, 13, 21];

var SPRINTS = [
  { id:'sprint-7', number:7, name:'Sprint 7', goal:'Cerrar UI de Onboarding',
    startDate:'2026-06-01', endDate:'2026-06-14', status:'active', capacity:40, committed:38 },
];
var STORIES = [
  { id:'s1', code:'PRJ-42', title:'Registro con cuenta de Google', type:'userstory', storyPoints:5, priority:'high',
    tags:['auth'], assignees:[{ name:'Ana Torres' }], sprintId:'sprint-7', status:'done' },
  { id:'s2', code:'PRJ-43', title:'Pantalla de bienvenida', type:'userstory', storyPoints:3, priority:'medium',
    tags:['ui'], assignees:[{ name:'Luis Pérez' }], sprintId:'sprint-7', status:'wip' },
  { id:'s3', code:'PRJ-44', title:'Validación del formulario de registro', type:'task', storyPoints:2, priority:'medium',
    tags:['forms'], assignees:[{ name:'María Soto' }], sprintId:'sprint-7', status:'wip' },
  { id:'s4', code:'PRJ-45', title:'El avatar no carga en Safari', type:'bug', storyPoints:3, priority:'high',
    tags:['bug'], assignees:[{ name:'Carlos Ruiz' }], sprintId:'sprint-7', status:'todo' },
  { id:'s5', code:'PRJ-50', title:'Exportar reporte a PDF', type:'task', storyPoints:3, priority:'medium',
    tags:['reportes'], assignees:[{ name:'Pedro Díaz' }], sprintId:null, status:null },
  { id:'s6', code:'PRJ-51', title:'Modo oscuro en el dashboard', type:'userstory', storyPoints:5, priority:'low',
    tags:['ui'], assignees:[{ name:'Ana Torres' }], sprintId:null, status:null },
  { id:'s7', code:'PRJ-52', title:'La sesión expira sin aviso', type:'bug', storyPoints:2, priority:'high',
    tags:['bug','auth'], assignees:[{ name:'Carlos Ruiz' }], sprintId:null, status:null },
  { id:'s8', code:'PRJ-53', title:'Evaluar WebSockets para notificaciones', type:'spike', storyPoints:8, priority:'medium',
    tags:['research'], assignees:[{ name:'María Soto' }], sprintId:null, status:null },
];

function mockDS() {
  return new Promise(function (resolve) {
    setTimeout(function () { resolve({ stories: STORIES, sprints: SPRINTS }); }, 300);
  });
}

function logEv(badge, msg, detail) { if (dev) dev.log(badge, msg, detail); }

/* Simula el envío al backend (console.log + Activity Log). En real: fetch(path, {method, body}). */
function apiSim(method, path, payload) {
  if (window.console && console.log) {
    console.log('%c→ API ' + method + ' ' + path, 'color:#10b981;font-weight:700', payload);
  }
  logEv('api', method + ' ' + path, JSON.stringify(payload));
  return Promise.resolve({ ok: true, status: 200 });
}

/* ═══ ESTADO ═══ */
var sprint = null, dev = null, mode = 'add', editId = null;
var titleInput = null, typeSelect = null, prioSelect = null, pointsSelect = null, assigneeSelect = null, descInput = null;

/* ═══ MODAL DE ALTA / EDICIÓN ═══ */
var form = document.createElement('form');
form.id = 'sb-form';
form.className = 'mts-form';
form.innerHTML =
  '<div id="sb-title" name="title"></div>' +
  '<div class="mts-d-flex mts-gap-3"><div id="sb-type" name="type" class="mts-flex-1"></div><div id="sb-priority" name="priority" class="mts-flex-1"></div></div>' +
  '<div class="mts-d-flex mts-gap-3"><div id="sb-points" name="storyPoints" class="mts-flex-1"></div><div id="sb-assignee" name="assignee" class="mts-flex-1"></div></div>' +
  '<div id="sb-desc" name="description"></div>';

function saveHandler() {
  if (!titleInput.getValue().trim()) { titleInput.setError(UI.needTitle || 'Ingresa un título'); return; }
  titleInput.clearError();
  if (mode === 'add') { sprint.submitAddTask(); return; }
  if (mode === 'edit' && editId) {
    sprint.updateStory(editId, {
      title:       titleInput.getValue(),
      type:        typeSelect.getValue(),
      priority:    prioSelect.getValue(),
      storyPoints: pointsSelect.getValue() ? Number(pointsSelect.getValue()) : undefined,
      assignees:   assigneeSelect.getValue() ? [{ name: assigneeSelect.getValue() }] : [],
      description: descInput.getValue() || undefined,
    });
    modal.hide();
  }
}

var modal = new MTS.Modal({
  title: UI.cardTitle || 'Historia', body: form, size: 'md', scrollable: true,
  buttons: [
    { label: UI.cancel || 'Cancelar', variant: 'ghost', close: true },
    { label: UI.del || 'Eliminar', variant: 'danger', onClick: function () {
        if (mode === 'edit' && editId) sprint.deleteStory(editId);
        modal.hide();
    } },
    { label: UI.save || 'Guardar', variant: 'primary', onClick: saveHandler },
  ],
});

function selOpts(map, order) {
  return order.map(function (k) { return { value: k, label: map[k] || k }; });
}

titleInput     = new MTS.Input('#sb-title', { label: UI.fTitle || 'Título', autocomplete: 'browser-off' });
typeSelect     = new MTS.Select('#sb-type', { label: UI.fType || 'Tipo', value: 'userstory',
  options: selOpts(TYPES, ['userstory', 'task', 'bug', 'epic', 'spike']) });
prioSelect     = new MTS.Select('#sb-priority', { label: UI.fPriority || 'Prioridad', value: 'medium',
  options: selOpts(PRIOS, ['low', 'medium', 'high', 'critical']) });
pointsSelect   = new MTS.Select('#sb-points', { label: UI.fPoints || 'Puntos (SP)', value: '',
  options: [{ value: '', label: '—' }].concat(SP_VALUES.map(function (v) { return { value: String(v), label: String(v) }; })) });
assigneeSelect = new MTS.Select('#sb-assignee', { label: UI.fAssignee || 'Responsable', value: '',
  options: [{ value: '', label: '—' }].concat(TEAM.map(function (n) { return { value: n, label: n }; })) });
descInput      = new MTS.Input('#sb-desc', { label: UI.fDesc || 'Descripción', autocomplete: 'browser-off' });

function openForAdd() {
  mode = 'add'; editId = null;
  titleInput.setValue(''); titleInput.clearError();
  typeSelect.setValue('userstory'); prioSelect.setValue('medium');
  pointsSelect.setValue(''); assigneeSelect.setValue(''); descInput.setValue('');
  modal.show();
}

function openForEdit(story) {
  mode = 'edit'; editId = story.id;
  titleInput.setValue(story.title || ''); titleInput.clearError();
  typeSelect.setValue(story.type || 'userstory');
  prioSelect.setValue(story.priority || 'medium');
  pointsSelect.setValue(story.storyPoints != null ? String(story.storyPoints) : '');
  assigneeSelect.setValue(story.assignees && story.assignees[0] ? story.assignees[0].name : '');
  descInput.setValue(story.description || '');
  modal.show();
}

/* ═══ SPRINT BOARD ═══ */
sprint = new MTS.SprintBoard('#sprint', {
  dataSource:   mockDS,
  showVelocity: true,
  addTask: { form: '#sb-form', open: openForAdd, close: function () { modal.hide(); } },
  onLoad:           function (e) { logEv('view', 'Cargado', e.stories.length + ' historias · ' + e.sprints.length + ' sprints'); },
  onAddTask:        function (e) { e.resolve(e.data); },
  onStoryAdd:       function (e) { apiSim('POST', '/api/stories', e.story); },
  onStoryChange:    function (e) { apiSim('PATCH', '/api/stories/' + e.story.id, e.fields); },
  onStoryMove:      function (e) { apiSim('PATCH', '/api/stories/' + e.story.id, { from: e.from, to: e.to }); },
  onStoryDelete:    function (e) { apiSim('DELETE', '/api/stories/' + e.story.id, { id: e.story.id }); },
  onSprintStart:    function (e) { apiSim('POST', '/api/sprints/' + e.sprint.id + '/start', { id: e.sprint.id }); },
  onSprintComplete: function (e) { apiSim('POST', '/api/sprints/' + e.sprint.id + '/complete', { done: e.doneStories.length, pending: e.pendingStories.length }); },
  onSelect:         function (e) { if (e.stories.length === 1) openForEdit(e.stories[0]); },
});

/* ═══ DEV PANEL (Config · Log · Code) ═══ */
dev = new MTS.DevPanel('#sprint', { watch: sprint, panels: ['config', 'log', 'code'] });

/* ═══ TOOLBAR (brand) ═══ */
new MTS.Topbar('#sb-toolbar', { brand: { title: UI.brand || 'MTS.SprintBoard' }, shadow: false, sticky: false });

if (window.MTS && MTS.Icon) MTS.Icon.initAll();
</script>
</body>
</html>
