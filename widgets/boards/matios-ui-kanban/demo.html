<!DOCTYPE html>

<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<body class="mts-vh-100 mts-p-0 mts-d-flex mts-flex-col mts-overflow-hidden">

<div id="kb-toolbar"></div>
<div class="mts-flex-1 mts-min-h-0 mts-d-flex mts-flex-col mts-overflow-hidden"><div id="kanban" class="mts-flex-1 mts-min-h-0"></div></div>

<script>
/* ═══ LOCALE ═══ All demo text comes from the component locale (MTS.Kanban). */
/* Public demo: default English; ?lang=es|en|pt to switch. */
(function () { var m = (location.search || '').match(/[?&]lang=(es|en|pt)/); if (window.MTS && MTS.setLocale) MTS.setLocale(m ? m[1] : 'en'); })();
var LK = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Kanban']) || {};
var UI = LK.ui || {};

/* ═══ DATA ═══ */
var TEAM = ['Ana García', 'Luis Pérez', 'María Torres', 'Carlos Ruiz', 'Pedro Mora'];

function buildColumns() {
  var c = UI.cols || {};
  return [
    { id:'todo',   title:c.todo   || 'To do',      color:'#64748b', cards:[
      { id:'c1', title:'Set up repository',       priority:'high',   assignee:'Ana García' },
      { id:'c2', title:'Define MVP scope',        priority:'medium', assignee:'Luis Pérez' } ] },
    { id:'doing',  title:c.doing  || 'In progress', color:'#f59e0b', wip:3, cards:[
      { id:'c3', title:'API design',              priority:'medium', assignee:'María Torres' },
      { id:'c4', title:'Data model',              priority:'low',    assignee:'Carlos Ruiz' } ] },
    { id:'review', title:c.review || 'In review',  color:'#3b82f6', cards:[
      { id:'c5', title:'Security review',         priority:'high',   assignee:'Pedro Mora' } ] },
    { id:'done',   title:c.done   || 'Done',       color:'#10b981', cards:[
      { id:'c6', title:'Project setup',           priority:'low',    assignee:'Ana García' } ] },
  ];
}

function mockDS() {
  return new Promise(function (resolve) {
    setTimeout(function () { resolve({ columns: buildColumns() }); }, 300);
  });
}

function logEv(badge, msg, detail) { if (dev) dev.log(badge, msg, detail); }

/* Simulates sending to the backend (console.log + Activity Log). In production: fetch(path, {method, body}). */
function apiSim(method, path, payload) {
  if (window.console && console.log) {
    console.log('%c→ API ' + method + ' ' + path, 'color:#10b981;font-weight:700', payload);
  }
  logEv('api', method + ' ' + path, JSON.stringify(payload));
  return Promise.resolve({ ok: true, status: 200 });
}

/* ═══ STATE ═══ */
var kanban = null, dev = null, mode = 'add', editId = null;
var titleInput = null, prioSelect = null, assigneeSelect = null, descInput = null;

/* ═══ ADD / EDIT MODAL (single modal; the Save button decides by mode) ═══ */
var form = document.createElement('form');
form.id = 'kb-form';
form.className = 'mts-form';
form.innerHTML =
  '<div id="kb-title" name="title"></div>' +
  '<div id="kb-priority" name="priority"></div>' +
  '<div id="kb-assignee" name="assignee"></div>' +
  '<div id="kb-desc" name="description"></div>';

function saveHandler() {
  if (!titleInput.getValue().trim()) { titleInput.setError(UI.needTitle || 'Enter a title'); return; }
  titleInput.clearError();
  if (mode === 'add') { kanban.submitAddTask(); return; }
  if (mode === 'edit' && editId) {
    kanban.updateCard(editId, {
      title:       titleInput.getValue(),
      priority:    prioSelect.getValue(),
      assignee:    assigneeSelect.getValue() || undefined,
      description: descInput.getValue() || undefined,
    });
    modal.hide();
  }
}

var modal = new MTS.Modal({
  title: UI.cardTitle || 'Card', body: form, size: 'sm', scrollable: true,
  buttons: [
    { label: UI.cancel || 'Cancel', variant: 'ghost', close: true },
    { label: UI.del || 'Delete', variant: 'danger', onClick: function () {
        if (mode === 'edit' && editId) kanban.removeCard(editId);
        modal.hide();
    } },
    { label: UI.save || 'Save', variant: 'primary', onClick: saveHandler },
  ],
});

titleInput     = new MTS.Input('#kb-title', { label: UI.fTitle || 'Title', autocomplete: 'browser-off' });
prioSelect     = new MTS.Select('#kb-priority', { label: UI.fPriority || 'Priority', value: 'medium', options: [
  { value: 'low',    label: LK.priorityLow    || 'Low' },
  { value: 'medium', label: LK.priorityMedium || 'Medium' },
  { value: 'high',   label: LK.priorityHigh   || 'High' },
] });
assigneeSelect = new MTS.Select('#kb-assignee', { label: UI.fAssignee || 'Assignee', value: '', options:
  [{ value: '', label: '—' }].concat(TEAM.map(function (n) { return { value: n, label: n }; })) });
descInput      = new MTS.Input('#kb-desc', { label: UI.fDesc || 'Description', autocomplete: 'browser-off' });

function openForAdd() {
  mode = 'add'; editId = null;
  titleInput.setValue(''); titleInput.clearError();
  prioSelect.setValue('medium'); assigneeSelect.setValue(''); descInput.setValue('');
  modal.show();
}

function openForEdit(card) {
  mode = 'edit'; editId = card.id;
  titleInput.setValue(card.title || ''); titleInput.clearError();
  prioSelect.setValue(card.priority || 'medium');
  assigneeSelect.setValue(card.assignee || '');
  descInput.setValue(card.description || '');
  modal.show();
}

/* ═══ KANBAN ═══ */
kanban = new MTS.Kanban('#kanban', {
  dataSource:  mockDS,
  editColumns: true,
  addTask: { showButton: false, form: '#kb-form', open: openForAdd, close: function () { modal.hide(); } },
  onLoad:         function (e) { logEv('view', 'Loaded', e.columns.length + ' columns'); },
  onAddTask:      function (e) { e.resolve(e.data); },
  onCardAdd:      function (e) { apiSim('POST', '/api/cards', e.card); },
  onCardChange:   function (e) { apiSim('PATCH', '/api/cards/' + e.card.id, e.fields); },
  onCardMove:     function (e) { apiSim('PATCH', '/api/cards/' + e.card.id, { colId: e.toColId, position: e.position }); },
  onCardDelete:   function (e) { apiSim('DELETE', '/api/cards/' + e.card.id, { id: e.card.id }); },
  onColumnAdd:    function (e) { apiSim('POST', '/api/columns', { id: e.column.id, title: e.column.title, index: e.index }); },
  onColumnRemove: function (e) { apiSim('DELETE', '/api/columns/' + e.column.id, { id: e.column.id }); },
  onColumnChange: function (e) { apiSim('PATCH', '/api/columns/' + e.column.id, e.fields); },
  onCardClick:    function (e) { logEv('click', 'Open', e.card.title); openForEdit(e.card); },
});

/* ═══ DEV PANEL (Config · Log · Code) ═══ */
dev = new MTS.DevPanel('#kanban', { watch: kanban, panels: ['config', 'log', 'code'] });

/* ═══ TOOLBAR: Topbar + Button ═══ */
var endEl = document.createElement('div');
endEl.className = 'mts-d-flex mts-gap-2 mts-items-center';
endEl.innerHTML = '<div id="kb-btn-add"></div>';

new MTS.Topbar('#kb-toolbar', { brand: { title: UI.brand || 'MTS.Kanban' }, end: endEl, shadow: false, sticky: false });
new MTS.Button('#kb-btn-add', { label: UI.addCard || '+ Card', iconLeft: '<i class="mts-icon mts-icon-add"></i>', size: 'sm', variant: 'ghost', onClick: openForAdd });

if (window.MTS && MTS.Icon) MTS.Icon.initAll();
</script>
