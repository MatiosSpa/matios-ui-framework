<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.ScrollSpy — Demo</title>
      <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">

  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">

</head>
<body>
<div class="demo-page">

  <div class="demo-header">
    <h1><span>MTS</span>.ScrollSpy</h1>
    <p>Resalta el link activo al hacer scroll por las secciones.</p>
    <div  class="demo-header-actions"></div>
    <div class="demo-docs-panel" id="dp"></div>
  </div>
  <div class="demo-section">
    <div class="demo-section-title">1 — Demo interactivo — scroll dentro del panel</div>
    <div id="scrollspy-code-1"></div>
  </div>
</div>
<script>
function setMode(mode){document.documentElement.setAttribute('data-mts-mode',mode);} 
function setAccent(accent){if(accent)document.documentElement.setAttribute('data-mts-accent',accent);else document.documentElement.removeAttribute('data-mts-accent');}
if(window!==window.top){var ts=document.querySelector('.demo-theme');if(ts)ts.style.display='none';}
function toggleDocs(id,p){var panel=document.getElementById(id);if(!panel)return;panel.classList.toggle('open');if(!panel.classList.contains('open')||panel.dataset.loaded)return;panel.innerHTML='<em style="color:var(--mts-text-muted)">Cargando...</em>';fetch(p).then(function(r){return r.text();}).then(function(md){panel.innerHTML=mdToHtml(md);panel.dataset.loaded='1';}).catch(function(){panel.innerHTML='<em>Error al cargar.</em>';});}
function mdToHtml(md){if(!md)return'';var blocks=[];var h=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/```(\w*)\n?([\s\S]*?)```/g,function(_,l,c){blocks.push(c.trim());return'\x00B'+(blocks.length-1)+'\x00';}).replace(/^---+$/gm,'<hr>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^\|(.+)\|\s*\n\|[-| :]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm,function(_,hdr,rows){var ths=hdr.split('|').filter(function(c){return c.trim();}).map(function(c){return'<th>'+c.trim()+'</th>';}).join('');var trs=rows.trim().split('\n').map(function(r){return'<tr>'+r.split('|').filter(function(c){return c.trim();}).map(function(c){return'<td>'+c.trim()+'</td>';}).join('')+'</tr>';}).join('');return'<table><thead><tr>'+ths+'</tr></thead><tbody>'+trs+'</tbody></table>';}).replace(/^[*-] (.+)$/gm,'<li>$1</li>').replace(/((?:<li>[^<]*<\/li>\n?)+)/g,'<ul>$1</ul>').replace(/^(?!<)(.+)$/gm,'<p>$1</p>');return h.replace(/\x00B(\d+)\x00/g,function(_,i){return'<pre><code>'+blocks[+i]+'</code></pre>';});}
function buildScrollSpyDemo(){
  var host=document.getElementById('scrollspy-code-1');
  if(!host) return;
  var previewHtml='<div class="spy-wrap"><nav id="spy-nav" class="spy-nav mts-spy-nav mts-spy-nav--indicator"><a href="#s-intro">Introducción</a><a href="#s-install">Instalación</a><a href="#s-uso">Uso básico</a><a href="#s-api">API</a><a href="#s-eventos">Eventos</a></nav><div id="spy-scroll" class="spy-content"><div id="s-intro" class="spy-section"><h3>Introducción</h3><p>MTS.ScrollSpy resalta el enlace activo según la sección visible dentro del contenedor de scroll.</p><p>Este ejemplo usa un panel interno con scroll para validar que la navegación cambie correctamente al recorrer cada bloque.</p><p>La idea es mantener el panel izquierdo sincronizado con el contenido derecho sin depender del scroll global de la ventana.</p></div><div id="s-install" class="spy-section"><h3>Instalación</h3><p>Incluye el archivo CSS para el nav y el JS del componente en la página donde lo necesites.</p><p>El nav puede usar enlaces con <code>href="#id"</code> y el componente se encarga de aplicar la clase activa.</p><p>También puedes ajustar el offset si tienes headers fijos o separaciones visuales adicionales.</p></div><div id="s-uso" class="spy-section"><h3>Uso básico</h3><p>Define tus secciones con IDs únicos y pásalas en la opción <code>sections</code>.</p><p>Luego indica el selector del nav y, si el scroll ocurre dentro de un panel, usa <code>scrollContainer</code>.</p><p>Con eso el componente cambia el estado activo automáticamente mientras se desplaza el contenido.</p></div><div id="s-api" class="spy-section"><h3>API</h3><p>La instancia mantiene sincronizado el nav y expone <code>destroy()</code> para limpiar listeners cuando el componente ya no se usa.</p><p>También puedes reaccionar a cada cambio con <code>onChange</code> y obtener el <code>id</code>, la sección y el link activo.</p><p>Esto sirve para analytics, headers contextuales o navegación secundaria.</p></div><div id="s-eventos" class="spy-section"><h3>Eventos</h3><p>En cada cambio puedes actualizar textos de estado, métricas o cualquier otro indicador visual.</p><p>En esta demo, el panel inferior muestra el nombre de la sección activa mientras haces scroll.</p><p>Si llegas hasta aquí, ScrollSpy debería marcar correctamente la última sección del panel.</p></div></div></div><div class="result-box" id="res-spy">— haz scroll en el panel de arriba —</div>';
  var htmlCode=`<nav id="spy-nav" class="mts-spy-nav mts-spy-nav--indicator">\n  <a href="#s-intro">Introducción</a>\n  <a href="#s-install">Instalación</a>\n  <a href="#s-uso">Uso básico</a>\n  <a href="#s-api">API</a>\n  <a href="#s-eventos">Eventos</a>\n</nav>\n\n<div id="spy-scroll">\n  <section id="s-intro">...</section>\n  <section id="s-install">...</section>\n  <section id="s-uso">...</section>\n  <section id="s-api">...</section>\n  <section id="s-eventos">...</section>\n</div>`;
  var jsCode=`new MTS.ScrollSpy({\n  sections: '#s-intro, #s-install, #s-uso, #s-api, #s-eventos',\n  nav: '#spy-nav',\n  scrollContainer: '#spy-scroll',\n  offset: 24,\n  onChange: ({ id, section, link }) => {\n    console.log('sección activa:', id);\n  },\n});`;
  new MTS.Tabs(host,{variant:'card',lazy:false,active:'preview',tabs:[{id:'preview',label:'Preview',content:previewHtml},{id:'html',label:'HTML',content:'<div id="spy-cb-html"></div>'},{id:'js',label:'JavaScript',content:'<div id="spy-cb-js"></div>'}]});
  new MTS.CodeBlock('#spy-cb-html', { code: htmlCode, language: 'html',       copyable: true });
  new MTS.CodeBlock('#spy-cb-js',   { code: jsCode,   language: 'javascript', copyable: true });
  new MTS.ScrollSpy({sections:'#s-intro, #s-install, #s-uso, #s-api, #s-eventos',nav:'#spy-nav',scrollContainer:'#spy-scroll',offset:24,onChange:function(payload){var title=payload.section?payload.section.querySelector('h3').textContent:'—';var box=document.getElementById('res-spy');if(box) box.textContent='sección activa: "'+title+'"';}});
}
buildScrollSpyDemo();
</script>
</body>
</html>
