<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.IntersectionReveal — Demo</title>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-corporate.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-navy.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-emerald.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-petrol.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">
  <link rel="stylesheet" href="../../overlays/matios-ui-badge/matios-ui-badge.css">
  <link rel="stylesheet" href="../../utilities/matios-ui-codeblock/matios-ui-codeblock.css">
  <link rel="stylesheet" href="./matios-ui-intersectionreveal.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../support/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../../forms/matios-ui-copybutton/matios-ui-copybutton.js"></script>
  <script src="../../overlays/matios-ui-badge/matios-ui-badge.js"></script>
  <script src="../../utilities/matios-ui-sanitize/matios-ui-sanitize.js"></script>
  <script src="../../utilities/matios-ui-codeblock/matios-ui-codeblock.js"></script>
  <script src="../../base/matios-ui-i18n.js"></script>
  <script src="./matios-ui-intersectionreveal-i18n.js"></script>
  <script src="./matios-ui-intersectionreveal.js"></script>

</head>
<body>
<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.IntersectionReveal</h1>
    <p id="ir-subtitle">Animates elements as they enter the viewport. Replaces AOS/ScrollReveal.</p>
    <div  class="demo-header-actions"></div>
    <div class="demo-docs-panel" id="dp"></div>
  </div>

  <div class="demo-section">
    <div class="demo-section-title" id="ir-s1-title">1 — Different animations</div>
    <div id="intersection-code-1"></div>
  </div>
</div>
<script>
// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.IntersectionReveal'].demo) || {};

(function () {
  var sub = document.getElementById('ir-subtitle');
  if (sub) sub.textContent = D.subtitle || 'Animates elements as they enter the viewport. Replaces AOS/ScrollReveal.';
  var s1 = document.getElementById('ir-s1-title');
  if (s1) s1.textContent = D.s1Title || '1 — Different animations';
})();

function setMode(mode){document.documentElement.setAttribute('data-mts-mode',mode);}
function setAccent(accent){if(accent)document.documentElement.setAttribute('data-mts-accent',accent);else document.documentElement.removeAttribute('data-mts-accent');}
if(window!==window.top){var ts=document.querySelector('.demo-theme');if(ts)ts.style.display='none';}
function toggleDocs(id,p){var panel=document.getElementById(id);if(!panel)return;panel.classList.toggle('open');if(!panel.classList.contains('open')||panel.dataset.loaded)return;panel.innerHTML='<em style="color:var(--mts-text-muted)">Loading...</em>';fetch(p).then(function(r){return r.text();}).then(function(md){panel.innerHTML=mdToHtml(md);panel.dataset.loaded='1';}).catch(function(){panel.innerHTML='<em>Error.</em>';});}
function mdToHtml(md){if(!md)return'';var blocks=[];var h=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/```(\w*)\n?([\s\S]*?)```/g,function(_,l,c){blocks.push(c.trim());return'\x00B'+(blocks.length-1)+'\x00';}).replace(/^---+$/gm,'<hr>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^\|(.+)\|\s*\n\|[-| :]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm,function(_,hdr,rows){var ths=hdr.split('|').filter(function(c){return c.trim();}).map(function(c){return'<th>'+c.trim()+'</th>';}).join('');var trs=rows.trim().split('\n').map(function(r){return'<tr>'+r.split('|').filter(function(c){return c.trim();}).map(function(c){return'<td>'+c.trim()+'</td>';}).join('')+'</tr>';}).join('');return'<table><thead><tr>'+ths+'</tr></thead><tbody>'+trs+'</tbody></table>';}).replace(/^[*-] (.+)$/gm,'<li>$1</li>').replace(/((?:<li>[^<]*<\/li>\n?)+)/g,'<ul>$1</ul>').replace(/^(?!<)(.+)$/gm,'<p>$1</p>');return h.replace(/\x00B(\d+)\x00/g,function(_,i){return'<pre><code>'+blocks[+i]+'</code></pre>';});}
window.__mtsIrCards=[];
function initReveal(){window.__mtsIrCards=[];document.querySelectorAll('#intersection-code-1 .mts-ir__card').forEach(function(card,index){window.__mtsIrCards.push(card);new MTS.IntersectionReveal(card,{animation:['fade-up','fade-down','fade-left','fade-right','zoom','flip'][index]||'fade-up',duration:600,delay:80,threshold:0,once:false});});}
function replayReveal(){
  var cards = window.__mtsIrCards || [];
  if (!cards.length) {
    var nodeList = document.querySelectorAll('#ir-grid1 .mts-ir__card');
    for (var i = 0; i < nodeList.length; i++) cards.push(nodeList[i]);
  }
  if (window.__mtsIrInstance && typeof window.__mtsIrInstance.destroy === 'function') window.__mtsIrInstance.destroy();
  cards.forEach(function(card) {
    card.style.transition    = 'none';
    card.style.opacity       = '';
    card.style.transform     = '';
    card.style.transformOrigin = '';
  });
  void document.body.offsetWidth;
  requestAnimationFrame(function() { initReveal(); });
}
function buildIntersectionRevealDemo(){
  var host=document.getElementById('intersection-code-1'); if(!host) return;
  var cardFadeUp    = D.cardFadeUp    || 'From below';
  var cardFadeDown  = D.cardFadeDown  || 'From above';
  var cardFadeLeft  = D.cardFadeLeft  || 'From the right';
  var cardFadeRight = D.cardFadeRight || 'From the left';
  var cardZoom      = D.cardZoom      || 'Zoom in';
  var cardFlip      = D.cardFlip      || 'Vertical flip';
  var replayBtnText = D.replayBtn     || 'Replay animation';
  var previewHtml=`<div class="mts-ir">\n  <div class="mts-ir__grid" id="ir-grid1">\n    <div class="mts-ir__card"><span class="mts-ir__icon" data-icon="arrow-up"></span><div class="mts-ir__title">fade-up</div><p class="mts-ir__text">${cardFadeUp}</p></div>\n    <div class="mts-ir__card"><span class="mts-ir__icon" data-icon="arrow-down"></span><div class="mts-ir__title">fade-down</div><p class="mts-ir__text">${cardFadeDown}</p></div>\n    <div class="mts-ir__card"><span class="mts-ir__icon" data-icon="arrow-left"></span><div class="mts-ir__title">fade-left</div><p class="mts-ir__text">${cardFadeLeft}</p></div>\n    <div class="mts-ir__card"><span class="mts-ir__icon" data-icon="arrow-right"></span><div class="mts-ir__title">fade-right</div><p class="mts-ir__text">${cardFadeRight}</p></div>\n    <div class="mts-ir__card"><span class="mts-ir__icon" data-icon="zoom-in"></span><div class="mts-ir__title">zoom</div><p class="mts-ir__text">${cardZoom}</p></div>\n    <div class="mts-ir__card"><span class="mts-ir__icon" data-icon="refresh-cw"></span><div class="mts-ir__title">flip</div><p class="mts-ir__text">${cardFlip}</p></div>\n  </div>\n  <div class="mts-ir__actions"><button class="demo-btn-sm" id="ir-replay-btn">${replayBtnText}</button></div>\n</div>`;
  var htmlCode=`<div class="mts-ir">\n  <div class="mts-ir__grid">\n    <div class="mts-ir__card">...</div>\n    <div class="mts-ir__card">...</div>\n  </div>\n</div>`;
  var jsCode=`new MTS.IntersectionReveal('.mts-ir__card', {\n  animation: 'fade-up',\n  duration: 600,\n  delay: 80,\n  threshold: 0,\n  once: false,\n});`;
  new MTS.Tabs(host,{variant:'card',lazy:false,active:'preview',tabs:[{id:'preview',label:'Preview',content:previewHtml},{id:'html',label:'HTML',content:'<div id="ir-cb-html"></div>'},{id:'js',label:'JavaScript',content:'<div id="ir-cb-js"></div>'}]});
  var replayBtn = document.getElementById('ir-replay-btn');
  if (replayBtn) replayBtn.addEventListener('click', replayReveal);
  new MTS.CodeBlock('#ir-cb-html', { code: htmlCode, language: 'html',       copyable: true });
  new MTS.CodeBlock('#ir-cb-js',   { code: jsCode,   language: 'javascript', copyable: true });
  document.querySelectorAll('#intersection-code-1 .mts-ir__icon[data-icon]').forEach(function(el){var name=el.getAttribute('data-icon'); if(window.MTS&&MTS.Icons&&typeof MTS.Icons.render==='function') MTS.Icons.render(el,name);});
  initReveal();
}
buildIntersectionRevealDemo();
</script>
</body>
</html>
