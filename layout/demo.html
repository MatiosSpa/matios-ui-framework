<!DOCTYPE html>
<html lang="es" data-mts-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS Layout — Demo</title>
      <script>
    (function(){
      var m=(location.hash||'').match(/mts-theme=([a-z-]+)/);
      if(m) document.documentElement.setAttribute('data-mts-theme',m[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pt=p.currentThemeVal||p.document.documentElement.getAttribute('data-mts-theme');
          if(pt) document.documentElement.setAttribute('data-mts-theme',pt);
        }
      }catch(e){}
    })();
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../base/matios-ui-base.css">
  <link rel="stylesheet" href="../themes/matios-ui-theme-dark.css">
  <link rel="stylesheet" href="../themes/matios-ui-theme-light.css">
  <link rel="stylesheet" href="../themes/matios-ui-theme-violet.css">
  <link rel="stylesheet" href="../themes/matios-ui-theme-blue.css">
  <link rel="stylesheet" href="../themes/matios-ui-theme-olive.css">
  <link rel="stylesheet" href="../themes/matios-ui-theme-high-contrast.css">
  <style>
    *{box-sizing:border-box}
    body{background:var(--mts-bg-body);color:var(--mts-text-primary);font-family:var(--mts-font-family);margin:0;padding:24px 24px 48px;}
    .demo-page{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
    .demo-header{padding-bottom:20px;margin-bottom:8px;border-bottom:1px solid var(--mts-border-color);}
    .demo-header h1{font-size:22px;font-weight:800;margin:0 0 4px;}
    .demo-header h1 span{color:var(--mts-color-primary);}
    .demo-header p{font-size:13px;color:var(--mts-text-muted);margin:0;}
    .acc{border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);overflow:hidden;transition:box-shadow .2s;}
    .acc:hover{box-shadow:var(--mts-shadow-sm);}
    .acc-header{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;background:var(--mts-bg-surface);user-select:none;transition:background .15s;}
    .acc-header:hover{background:var(--mts-bg-surface-2);}
    .acc-arrow{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--mts-color-primary);font-size:14px;font-weight:700;transition:transform .25s;flex-shrink:0;}
    .acc.open .acc-arrow{transform:rotate(90deg);}
    .acc-title{font-size:13px;font-weight:700;color:var(--mts-text-primary);flex:1;}
    .acc-subtitle{font-size:11px;color:var(--mts-text-muted);}
    .acc-body{display:none;border-top:1px solid var(--mts-border-color);background:var(--mts-bg-body);}
    .acc.open .acc-body{display:block;}
    .acc-iframe{width:100%;border:none;min-height:400px;display:block;}
    .demo-theme{position:fixed;top:12px;right:12px;display:flex;gap:4px;z-index:999;flex-wrap:wrap;max-width:240px;justify-content:flex-end;}
    .demo-btn-sm{padding:3px 9px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--mts-border-color);background:var(--mts-bg-surface);color:var(--mts-text-secondary);}
    .demo-btn-sm:hover{background:var(--mts-bg-surface-2);}
  </style>
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setTheme('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setTheme('light')">Light</button>
  <button class="demo-btn-sm" onclick="setTheme('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setTheme('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setTheme('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setTheme('high-contrast')">HC</button>
</div>
<div class="demo-page">
  <div class="demo-header">
    <h1>MTS <span>Layout</span></h1>
    <p>scrollspy · intersectionreveal</p>
  </div>
  
  <div class="acc" id="acc-scrollspy">
    <div class="acc-header" onclick="toggleAcc('acc-scrollspy','matios-ui-scrollspy/demo.html')">
      <span class="acc-arrow">›</span>
      <span class="acc-title">MTS.ScrollSpy</span>
      <span class="acc-subtitle">Resalta el link activo al hacer scroll por las secciones</span>
    </div>
    <div class="acc-body"><iframe class="acc-iframe" id="iframe-acc-scrollspy" src="about:blank"></iframe></div>
  </div>
  <div class="acc" id="acc-intersectionreveal">
    <div class="acc-header" onclick="toggleAcc('acc-intersectionreveal','matios-ui-intersectionreveal/demo.html')">
      <span class="acc-arrow">›</span>
      <span class="acc-title">MTS.IntersectionReveal</span>
      <span class="acc-subtitle">Anima elementos al entrar al viewport — reemplaza AOS/ScrollReveal</span>
    </div>
    <div class="acc-body"><iframe class="acc-iframe" id="iframe-acc-intersectionreveal" src="about:blank"></iframe></div>
  </div>
</div>
<script>
var currentTheme=document.documentElement.getAttribute('data-mts-theme')||'dark';
function setTheme(t){currentTheme=t;document.documentElement.setAttribute('data-mts-theme',t);document.querySelectorAll('.acc-iframe').forEach(function(iframe){if(iframe.src&&iframe.src!=='about:blank'){try{iframe.contentWindow.postMessage({type:'setTheme',theme:t},'*');}catch(e){}var src=iframe.src.split('#')[0];iframe.src=src+'#mts-theme='+t;}});try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'setTheme',theme:t},'*');}catch(e){}}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='setTheme'){currentTheme=e.data.theme;document.documentElement.setAttribute('data-mts-theme',e.data.theme);document.querySelectorAll('.acc-iframe').forEach(function(iframe){if(iframe.src&&iframe.src!=='about:blank'){try{iframe.contentWindow.postMessage({type:'setTheme',theme:e.data.theme},'*');}catch(ex){}}});}});
if(window!==window.top){var ts=document.querySelector('.demo-theme');if(ts)ts.style.display='none';}
function toggleAcc(id,src){var acc=document.getElementById(id);var iframe=document.getElementById('iframe-'+id);if(acc.classList.contains('open')){acc.classList.remove('open');return;}acc.classList.add('open');if(iframe.src==='about:blank'){iframe.src=src+'#mts-theme='+currentTheme;iframe.addEventListener('load',function(){try{var h=iframe.contentDocument.body.scrollHeight;if(h>300)iframe.style.height=(h+32)+'px';}catch(e){iframe.style.height='600px';}});}else{try{iframe.contentWindow.postMessage({type:'setTheme',theme:currentTheme},'*');}catch(e){}}}
</script>
</body>
</html>
