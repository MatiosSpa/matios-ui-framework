<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Scroll — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<body>


<div class="demo-page">

<script>
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'setMode')   document.documentElement.setAttribute('data-mts-mode', e.data.mode);
  if (e.data.type === 'setAccent') {
    if (e.data.accent) document.documentElement.setAttribute('data-mts-accent', e.data.accent);
    else document.documentElement.removeAttribute('data-mts-accent');
  }
});

/*
  mk(id, html, js, height)
  - Preview : html envuelto en mts-p-4
  - HTML    : CodeBlock con el HTML del ejemplo
  - JS      : CodeBlock con el código de inicialización
*/
function mk(id, html, js, h) {
  var cbHtml = id + '-cb-html';
  var cbJs   = id + '-cb-js';

  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: h || '280px',
    tabs: [
      { id: id + '-p',    label: 'Preview',     content: '<div class="mts-p-4">' + html + '</div>' },
      { id: id + '-html', label: 'HTML',         content: '<div id="' + cbHtml + '" style="height:100%"></div>' },
      { id: id + '-js',   label: 'JavaScript',   content: '<div id="' + cbJs   + '" style="height:100%"></div>' }
    ]
  });

  new MTS.CodeBlock('#' + cbHtml, { code: html.trim(), language: 'html', copyable: true, height: '100%' });
  new MTS.CodeBlock('#' + cbJs,   { code: js.trim(),   language: 'js',   copyable: true, height: '100%' });
}

// — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Scroll']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Scrollable container with themed scrollbar, adaptive edge fades and position events.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Vertical (default)';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Horizontal';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Both';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Custom fadeBg (inside surface)';
document.getElementById('s5-title').textContent      = D.s5Title || '5 — Events onScroll · onReachStart · onReachEnd';
document.getElementById('s6-title').textContent      = D.s6Title || '6 — Programmatic API';
document.getElementById('s5-log').textContent        = D.logWaiting || 'Waiting for scroll...';

/* ── Contenido de ejemplo ── */
var paras = [
  D.para1 || 'UI systems design is the art of creating coherent, reusable components that scale across any digital product.',
  D.para2 || 'A good design system defines tokens, patterns and behaviors that teams can adopt without friction.',
  D.para3 || 'Visual consistency does not happen by chance — it comes from deliberate decisions, documented and shared.',
  D.para4 || 'Each component should be able to live in isolation without depending on the context where it is used.',
  D.para5 || 'Dark mode is not just inverting colors — it means rethinking contrasts, hierarchies and shadows from scratch.',
  D.para6 || 'Accessibility is not a layer on top of design: it is part of the design from the very first stroke.',
  D.para7 || 'CSS tokens let the same component adapt to any theme without touching a single line of JS.',
];

function makeParas() {
  return paras.map(function(p, i) {
    return '<p style="padding:8px 0;border-bottom:1px solid var(--mts-border-color);margin:0;font-size:13px">' + (i+1) + '. ' + p + '</p>';
  }).join('\n  ');
}

/* ════════════════════════════════════
   1 · VERTICAL
   ════════════════════════════════════ */
mk('s1',
/* HTML */
'<div id="scroll-v" style="height:180px">\n' +
'  ' + makeParas() + '\n' +
'</div>',
/* JS */
"new MTS.Scroll('#scroll-v', {\n" +
"  direction: 'vertical'\n" +
'});',
'280px');

new MTS.Scroll('#scroll-v', { direction: 'vertical' });

/* ════════════════════════════════════
   2 · HORIZONTAL
   ════════════════════════════════════ */
var hItems = [
  D.chipComponents || 'Components', D.chipTokens || 'Tokens', D.chipThemes || 'Themes', D.chipDarkMode || 'Dark Mode', D.chipAccessibility || 'Accessibility',
  D.chipTypography || 'Typography', D.chipIcons || 'Icons', D.chipSpacing || 'Spacing', D.chipBorders || 'Borders', D.chipShadows || 'Shadows',
  D.chipAnimations || 'Animations', D.chipForms || 'Forms', D.chipOverlays || 'Overlays', D.chipNavigation || 'Navigation', D.chipDisplay || 'Display'
].map(function(label) {
  return '<div style="flex-shrink:0;padding:12px 20px;border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-md);font-size:13px;white-space:nowrap">' + label + '</div>';
}).join('\n    ');

mk('s2',
/* HTML */
'<div id="scroll-h" style="height:80px">\n' +
'  <div style="display:flex;gap:8px;align-items:center;height:100%">\n' +
'    ' + hItems + '\n' +
'  </div>\n' +
'</div>',
/* JS */
"new MTS.Scroll('#scroll-h', {\n" +
"  direction: 'horizontal'\n" +
'});',
'200px');

new MTS.Scroll('#scroll-h', { direction: 'horizontal' });

/* ════════════════════════════════════
   3 · BOTH
   ════════════════════════════════════ */
var gridCells = '';
for (var r = 1; r <= 8; r++) {
  for (var c = 1; c <= 8; c++) {
    gridCells += '<div style="flex-shrink:0;width:100px;height:48px;border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-sm);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mts-text-muted)">' + r + ',' + c + '</div>';
  }
}

mk('s3',
/* HTML */
'<div id="scroll-b" style="height:180px">\n' +
'  <div style="display:flex;flex-wrap:wrap;gap:6px;width:900px">\n' +
'    <!-- 64 celdas -->\n' +
'  </div>\n' +
'</div>',
/* JS */
"new MTS.Scroll('#scroll-b', {\n" +
"  direction: 'both'\n" +
'});',
'290px');

/* Instancia real con celdas reales */
var scrollBEl = document.getElementById('scroll-b');
if (scrollBEl) {
  var inner = scrollBEl.querySelector('div');
  if (inner) inner.innerHTML = gridCells;
}
new MTS.Scroll('#scroll-b', { direction: 'both' });

/* ════════════════════════════════════
   4 · fadeBg personalizado
   ════════════════════════════════════ */
mk('s4',
/* HTML */
'<div style="background:var(--mts-bg-surface);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:16px">\n' +
'  <div id="scroll-fg" style="height:140px">\n' +
'    ' + makeParas() + '\n' +
'  </div>\n' +
'</div>',
/* JS */
"new MTS.Scroll('#scroll-fg', {\n" +
"  direction: 'vertical',\n" +
"  fadeBg: 'var(--mts-bg-surface)' // ← hace match con el fondo del contenedor\n" +
'});',
'290px');

new MTS.Scroll('#scroll-fg', {
  direction: 'vertical',
  fadeBg: 'var(--mts-bg-surface)'
});

/* ════════════════════════════════════
   5 · EVENTOS
   ════════════════════════════════════ */
mk('s5',
/* HTML */
'<div id="scroll-ev" style="height:160px">\n' +
'  ' + makeParas() + '\n' +
'</div>',
/* JS */
"new MTS.Scroll('#scroll-ev', {\n" +
"  direction: 'vertical',\n" +
"  onScroll: function(e) {\n" +
"    console.log('scrollTop:', e.scrollTop, '| percent:', e.percent + '%');\n" +
"  },\n" +
"  onReachStart: function() {\n" +
"    console.log('llegaste al inicio');\n" +
"  },\n" +
"  onReachEnd: function() {\n" +
"    console.log('llegaste al final — cargar más datos');\n" +
"  }\n" +
'});',
'290px');

new MTS.Scroll('#scroll-ev', {
  direction: 'vertical',
  onScroll: function(e) {
    document.getElementById('s5-log').textContent =
      (D.logScroll || 'onScroll → scrollTop: ') + e.scrollTop + 'px  |  ' + e.percent + '%';
  },
  onReachStart: function() {
    document.getElementById('s5-log').textContent = D.logReachStart || '⬆ onReachStart — you reached the start';
  },
  onReachEnd: function() {
    document.getElementById('s5-log').textContent = D.logReachEnd || '⬇ onReachEnd — you reached the end';
  }
});

/* ════════════════════════════════════
   6 · API PROGRAMÁTICA
   ════════════════════════════════════ */
mk('s6',
/* HTML */
'<div style="display:flex;flex-direction:column;gap:8px">\n' +
'  <div id="s6-btns" style="display:flex;gap:8px;flex-wrap:wrap"></div>\n' +
'  <div id="scroll-api" style="height:160px">\n' +
'    ' + makeParas() + '\n' +
'  </div>\n' +
'</div>',
/* JS */
"const scroll = new MTS.Scroll('#scroll-api', { direction: 'vertical' });\n\n" +
"scroll.scrollTo(200);\n" +
"scroll.scrollTo(200, false);\n" +
"scroll.scrollToStart();\n" +
"scroll.scrollToEnd();\n" +
"scroll.getScroll();\n" +
"scroll.getPercent();\n" +
"scroll.update();\n" +
"scroll.destroy();",
'310px');

var scrollApi = new MTS.Scroll('#scroll-api', { direction: 'vertical' });

[
  { label: 'scrollToStart()', fn: function() { scrollApi.scrollToStart(); } },
  { label: 'scrollToEnd()',   fn: function() { scrollApi.scrollToEnd(); } },
  { label: 'scrollTo(80)',    fn: function() { scrollApi.scrollTo(80); } },
  { label: 'getPercent()',    fn: function() { alert((D.alertPosition || 'Position: ') + scrollApi.getPercent() + '%'); } },
].forEach(function(item) {
  new MTS.Button('#s6-btns', {
    label: item.label,
    variant: 'secondary',
    size: 'sm',
    onClick: item.fn
  });
});

MTS.Icon.initAll();
</script>
</body>
