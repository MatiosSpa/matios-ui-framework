<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.Splitter — Demo</title>
      <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../shared/demo-shared.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="./matios-ui-splitter.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../shared/demo-shared.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="./matios-ui-splitter.js"></script>  
</head>
<body>
<div class="demo-theme">
  <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
  <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
  <button class="demo-btn-sm demo-btn-sep">—</button>
  <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
  <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
  <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
  <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
</div>
<div class="demo-page">  <style>
    .sp-panel{background:var(--mts-bg-surface);padding:16px;min-height:0;display:flex;flex-direction:column;gap:8px;}
    .sp-panel h4{font-size:13px;font-weight:700;margin:0;color:var(--mts-text-secondary);}
    .sp-panel p{font-size:12px;color:var(--mts-text-muted);margin:0;line-height:1.6;}
    .sp-wrap{border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);overflow:hidden;}.mts-splitter-demo__code{display:block;margin:0;background:var(--mts-bg-surface-2);border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-md);padding:12px 14px;font-size:12px;font-family:var(--mts-font-mono);color:var(--mts-text-secondary);overflow-x:auto;white-space:pre;line-height:1.65;}.mts-splitter-demo__code code{font-family:inherit;color:inherit;}
  </style>
  <div class="demo-header">
    <h1><span>MTS</span>.Splitter</h1>
    <p>Paneles redimensionables con drag. Horizontal, vertical y colapsable.</p>
    <div  class="demo-header-actions"><button class="demo-docs-btn" onclick="toggleDocs('dp','./matios-ui-splitter.md')">📄 Documentación</button></div>
    <div class="demo-docs-panel" id="dp"></div>
  </div>

  <div class="demo-section">
    <div class="demo-section-title">1 — Horizontal — arrastra el divisor</div>
    <div id="splitter-code-1"></div>
  </div>

  <div class="demo-section">
    <div class="demo-section-title">2 — Vertical + colapsable con doble click</div>
    <div id="splitter-code-2"></div>
  </div>
</div>
<script>
function setTheme(t){document.documentElement.setAttribute('data-mts-theme',t);try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'setTheme',theme:t},'*');}catch(e){}}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='setTheme')document.documentElement.setAttribute('data-mts-theme',e.data.theme);});
if(window!==window.top){var ts=document.querySelector('.demo-theme');if(ts)ts.style.display='none';}
function toggleDocs(id,p){var panel=document.getElementById(id);if(!panel)return;panel.classList.toggle('open');if(!panel.classList.contains('open')||panel.dataset.loaded)return;panel.innerHTML='<em style="color:var(--mts-text-muted)">Cargando...</em>';fetch(p).then(function(r){return r.text();}).then(function(md){panel.innerHTML=mdToHtml(md);panel.dataset.loaded='1';}).catch(function(){panel.innerHTML='<em>Error.</em>';});}
function mdToHtml(md){if(!md)return'';var blocks=[];var h=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/```(\w*)\n?([\s\S]*?)```/g,function(_,l,c){blocks.push(c.trim());return'\x00B'+(blocks.length-1)+'\x00';}).replace(/^---+$/gm,'<hr>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^\|(.+)\|\s*\n\|[-| :]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm,function(_,hdr,rows){var ths=hdr.split('|').filter(function(c){return c.trim();}).map(function(c){return'<th>'+c.trim()+'</th>';}).join('');var trs=rows.trim().split('\n').map(function(r){return'<tr>'+r.split('|').filter(function(c){return c.trim();}).map(function(c){return'<td>'+c.trim()+'</td>';}).join('')+'</tr>';}).join('');return'<table><thead><tr>'+ths+'</tr></thead><tbody>'+trs+'</tbody></table>';}).replace(/^[*-] (.+)$/gm,'<li>$1</li>').replace(/((?:<li>[^<]*<\/li>\n?)+)/g,'<ul>$1</ul>').replace(/^(?!<)(.+)$/gm,'<p>$1</p>');return h.replace(/\x00B(\d+)\x00/g,function(_,i){return'<pre><code>'+blocks[+i]+'</code></pre>';});}

function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function codeBlock(source){return '<pre class="mts-splitter-demo__code"><code>'+escapeHtml(source)+'</code></pre>';}
function buildSplitterSection(target, previewHtml, htmlCode, jsCode){
  new MTS.Tabs(target,{variant:'card',lazy:false,active:'preview',tabs:[
    {id:'preview',label:'Preview',content:previewHtml},
    {id:'html',label:'HTML',content:codeBlock(htmlCode)},
    {id:'js',label:'JavaScript',content:codeBlock(jsCode)}
  ]});
}
var splitterPreview1 = `<div class="sp-wrap" id="sp-h">
  <div class="sp-panel"><h4>Panel izquierdo</h4><p>Arrastra el divisor central para redimensionar los paneles.</p></div>
  <div class="sp-panel"><h4>Panel derecho</h4><p>El tamaño mínimo es 15% y el máximo 85%.</p></div>
</div>
<div class="result-box" id="res-sp">— arrastra el divisor —</div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
  <button class="demo-btn-sm" style="padding:5px 12px;font-size:11px;" onclick="spH.setSize(30)">setSize(30%)</button>
  <button class="demo-btn-sm" style="padding:5px 12px;font-size:11px;" onclick="spH.setSize(50)">setSize(50%)</button>
  <button class="demo-btn-sm" style="padding:5px 12px;font-size:11px;" onclick="spH.setSize(70)">setSize(70%)</button>
  <button class="demo-btn-sm" style="padding:5px 12px;font-size:11px;" onclick="var s=spH.getSizes();document.getElementById('res-sp').textContent='getSizes() → '+JSON.stringify(s)">getSizes()</button>
</div>`;
var splitterPreview2 = `<div class="sp-wrap" id="sp-v" style="height:280px;">
  <div class="sp-panel"><h4>Panel superior</h4><p>Doble click en el divisor para colapsar el panel inferior.</p></div>
  <div class="sp-panel"><h4>Panel inferior</h4><p>Restaura haciendo doble click nuevamente en el divisor.</p></div>
</div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
  <button class="demo-btn-sm" style="padding:5px 12px;font-size:11px;" onclick="spV.collapseSecond()">collapseSecond()</button>
  <button class="demo-btn-sm" style="padding:5px 12px;font-size:11px;" onclick="spV.restore()">restore()</button>
</div>`;
buildSplitterSection('#splitter-code-1', splitterPreview1, `<div id="split-horizontal">
  <div>Panel izquierdo</div>
  <div>Panel derecho</div>
</div>`, `const splitter = new MTS.Splitter('#split-horizontal', {
  direction: 'horizontal',
  initialSize: 40,
  minSize: 15,
  maxSize: 85,
  onChange: ({ firstSize, secondSize }) => console.log(firstSize, secondSize),
});`);
buildSplitterSection('#splitter-code-2', splitterPreview2, `<div id="split-vertical">
  <div>Panel superior</div>
  <div>Panel inferior</div>
</div>`, `const splitter = new MTS.Splitter('#split-vertical', {
  direction: 'vertical',
  initialSize: 60,
  collapsible: true,
  onDragEnd: ({ firstSize, secondSize }) => console.log(firstSize, secondSize),
});`);
document.getElementById('sp-h').style.height='200px';
var spH=new MTS.Splitter('#sp-h',{direction:'horizontal',initialSize:40,minSize:15,maxSize:85,onChange:function(e){document.getElementById('res-sp').textContent='onChange → primer panel: '+Math.round(e.firstSize)+'% | segundo: '+Math.round(e.secondSize)+'%';}});
var spV=new MTS.Splitter('#sp-v',{direction:'vertical',initialSize:60,collapsible:true,gutterSize:'8px'});
</script></body></html>
