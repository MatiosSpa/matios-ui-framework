  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

  <style>
    /* ── Visual layout mockup ──────────────────── */
    .shell-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 8px;
    }

    .shell-card {
      border: 1px solid var(--mts-border-color);
      border-radius: var(--mts-radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .shell-card:hover,
    .shell-card--active {
      border-color: var(--mts-color-primary);
      box-shadow: 0 0 0 3px var(--mts-color-primary-light);
    }
    .shell-card__label {
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--mts-text-muted);
      text-align: center;
      border-top: 1px solid var(--mts-border-color);
      background: var(--mts-bg-surface);
    }
    .shell-card--active .shell-card__label {
      color: var(--mts-color-primary);
    }

    /* Layout thumbnail */
    .mini-shell {
      display: grid;
      height: 80px;
      background: var(--mts-bg-body);
      gap: 1px;
    }
    .mini-shell__topbar {
      background: var(--mts-bg-surface);
      border-bottom: 1px solid var(--mts-border-color);
    }
    .mini-shell__sidenav {
      background: var(--mts-bg-surface);
      border-right: 1px solid var(--mts-border-color);
    }
    .mini-shell__main {
      background: var(--mts-bg-surface-2);
    }
    .mini-shell__statusbar {
      background: var(--mts-bg-surface);
      border-top: 1px solid var(--mts-border-color);
    }

    /* Templates for each variant */
    .mini-shell--main-only {
      grid-template: "main" 1fr / 1fr;
    }
    .mini-shell--top {
      grid-template: "topbar" 12px "main" 1fr / 1fr;
    }
    .mini-shell--side {
      grid-template: "sidenav main" 1fr / 22px 1fr;
    }
    .mini-shell--status {
      grid-template: "main" 1fr "status" 10px / 1fr;
    }
    .mini-shell--top-side {
      grid-template: "topbar topbar" 12px "sidenav main" 1fr / 22px 1fr;
    }
    .mini-shell--top-status {
      grid-template: "topbar" 12px "main" 1fr "status" 10px / 1fr;
    }
    .mini-shell--side-status {
      grid-template: "sidenav main" 1fr "sidenav status" 10px / 22px 1fr;
    }
    .mini-shell--full {
      grid-template: "topbar topbar" 12px "sidenav main" 1fr "sidenav status" 10px / 22px 1fr;
    }

    /* ── Interactive preview ────────────────────────── */
    .preview-wrap {
      border: 1px solid var(--mts-border-color);
      border-radius: var(--mts-radius-lg);
      overflow: hidden;
      height: 220px;
      position: relative;
    }

    /* Shell in the preview */
    #previewShell-s2,
    #previewShell-s3 {
      height: 100%;
    }

    .preview-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--mts-text-muted);
      opacity: .6;
    }

    .preview-topbar {
      background: var(--mts-bg-surface);
      border-bottom: 1px solid var(--mts-border-color);
    }
    .preview-sidenav {
      background: var(--mts-bg-surface);
      border-right: 1px solid var(--mts-border-color);
      min-width: 60px;
    }
    .preview-main {
      background: var(--mts-bg-body);
      font-size: 11px;
      color: var(--mts-text-muted);
      flex-direction: column;
      gap: 8px;
    }
    .preview-statusbar {
      background: var(--mts-bg-surface);
      border-top: 1px solid var(--mts-border-color);
    }

    /* Toggle slots */
    .slot-toggles {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .slot-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border: 1px solid var(--mts-border-color);
      border-radius: var(--mts-radius-md);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--mts-text-muted);
      background: var(--mts-bg-surface);
      transition: all .12s;
      user-select: none;
    }
    .slot-toggle:hover { border-color: var(--mts-color-primary); color: var(--mts-text-primary); }
    .slot-toggle--on {
      border-color: var(--mts-color-primary);
      background: var(--mts-color-primary-light);
      color: var(--mts-color-primary);
    }
    .slot-toggle__dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: currentColor;
    }
  </style>

<script>

(function () {

  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();

document.getElementById('s3-title').textContent      = D.s3Title || '3 — Masterpage pattern';

function indentHtml(html) {
  var indent = 0, step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) { indent = Math.max(0, indent - step); result += ' '.repeat(indent) + t + '\n'; }
    else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

/* ════════════════════════════════════════════════════
   makeSection — standard demo pattern
   htmlCode optional: if omitted, uses indentHtml(previewHtml)
════════════════════════════════════════════════════ */
function makeSection(id, previewHtml, jsCode, initFn, htmlCode) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '360px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: htmlCode || indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode   || '',                      language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

/* ════════════════════════════════════════════════════
   S1 — Layout combinations
════════════════════════════════════════════════════ */
var s1Html = [

  '    <div class="mini-shell mini-shell--main-only">',

  '      <div class="mini-shell__main" style="grid-area:main"></div>',

  '    <div class="shell-card__label">' + (D.cardFull || 'top + side + status') + '</div>',
  '  </div>',
  '</div>'
].join('\n');

var s1Js = [
  '// 1. Initialize components on their elements',
  "var topbar    = new MTS.Topbar('#topbar', { brand: { title: 'My App' }, end: '...' });",
  "var sidenav   = new MTS.SideNav('#sidenav', { menu: mainMenu });",
  "var statusbar = new MTS.StatusBar('#statusbar', { start: '...', end: '...' });",
  '',
  '// 2. Shell joins them — accepts any combination of the three',
  "new MTS.Shell('#app', {",
  '  topbar:    topbar,      // MTS.Topbar instance',
  '  sidenav:   sidenav,     // MTS.SideNav instance',

].join('\n');

/* ════════════════════════════════════════════════════
   Actual HTML for each section (separate from the visual preview)
════════════════════════════════════════════════════ */
var s1HtmlCode = [
  '<!-- Shell does not create elements — it works on the ones that already exist. -->',
  '<!-- It assigns MTS classes to each child according to its role.              -->',
  '<div id="app">',
  '  <div id="topbar"></div>',
  '  <div id="sidenav"></div>',
  '  <div id="main"></div>',
  '  <div id="statusbar"></div>',
  '</div>',

].join('\n');

var s2HtmlCode = [
  '<!-- DOM state after new MTS.Shell() with top + side active -->',
  '<div id="app" class="mts-shell mts-shell--top mts-shell--side">',
  '  <div id="topbar"  class="mts-shell__topbar"></div>',
  '  <div id="sidenav" class="mts-shell__sidenav"></div>',

].join('\n');

var s3HtmlCode = [
  '<!DOCTYPE html>',
  '<html lang="en" data-mts-mode="dark">',
  '<head>',
  '  <!-- Required base -->',
  '  <link rel="stylesheet" href="matios-ui-base.css">',

makeSection('tabs-s1', s1Html, s1Js, function() {
  var cards = document.querySelectorAll('#tabs-s1-preview .shell-card');
  cards.forEach(function(card) {
    card.addEventListener('click', function() {
      var allCards = document.querySelectorAll('#tabs-s1-preview .shell-card');

      card.classList.add('shell-card--active');

var s2Html = [
  '<div class="slot-toggles">',

var s2Js = [
  '// MTS instances, string selectors and Elements: all valid',
  "new MTS.Shell('#app', {",
  '  topbar:    topbarInstance,                    // MTS instance',
  "  sidenav:   '#sidenav',                        // string selector",
  "  statusbar: document.getElementById('status'), // direct Element",

  "var mainEl = shell.getSlot('main');",

makeSection('tabs-s2', s2Html, s2Js, function() {
  var slotsS2 = { top: false, side: false, status: false };
  var shellS2 = null;

  function buildPreviewS2() {
    var topEl    = document.getElementById('prevTopbar-s2');
    var sideEl   = document.getElementById('prevSidenav-s2');
    var mainEl   = document.getElementById('prevMain-s2');
    var statusEl = document.getElementById('prevStatusbar-s2');

    if (!topEl || !sideEl || !mainEl || !statusEl) return;

    topEl.style.display    = slotsS2.top    ? '' : 'none';
    sideEl.style.display   = slotsS2.side   ? '' : 'none';
    statusEl.style.display = slotsS2.status ? '' : 'none';

    if (shellS2) shellS2.destroy();

    shellS2 = new MTS.Shell('#previewShell-s2', {
      topbar:    slotsS2.top    ? topEl    : null,
      sidenav:   slotsS2.side   ? sideEl   : null,
      main:      mainEl,
      statusbar: slotsS2.status ? statusEl : null,
      height:    '100%'
    });
  }

  function toggleSlotS2(name) {
    slotsS2[name] = !slotsS2[name];
    var toggle = document.getElementById('toggle-' + name + '-s2');
    if (toggle) toggle.classList.toggle('slot-toggle--on', slotsS2[name]);
    buildPreviewS2();
  }

  var btnTop    = document.getElementById('toggle-top-s2');
  var btnSide   = document.getElementById('toggle-side-s2');
  var btnStatus = document.getElementById('toggle-status-s2');

  if (btnTop)    btnTop.addEventListener('click',    function() { toggleSlotS2('top'); });
  if (btnSide)   btnSide.addEventListener('click',   function() { toggleSlotS2('side'); });
  if (btnStatus) btnStatus.addEventListener('click', function() { toggleSlotS2('status'); });

  buildPreviewS2();
}, s2HtmlCode);

/* ════════════════════════════════════════════════════
   S3 — Masterpage pattern
════════════════════════════════════════════════════ */
var s3Html = [
  '<div class="slot-toggles">',
  '  <div class="slot-toggle" id="toggle-top-s3">',
  '    <span class="slot-toggle__dot"></span>' + (D.toggleTopbar || 'Topbar'),
  '  </div>',
  '  <div class="slot-toggle" id="toggle-side-s3">',
  '    <span class="slot-toggle__dot"></span>' + (D.toggleSidenav || 'SideNav'),
  '  </div>',
  '  <div class="slot-toggle" id="toggle-status-s3">',
  '    <span class="slot-toggle__dot"></span>' + (D.toggleStatusbar || 'StatusBar'),
  '  </div>',
  '</div>',
  '<div class="preview-wrap">',
  '  <div id="previewShell-s3">',
  '    <div id="prevTopbar-s3"    class="preview-slot preview-topbar"    style="display:none">' + (D.slotTopbar || 'Topbar') + '</div>',
  '    <div id="prevSidenav-s3"   class="preview-slot preview-sidenav"   style="display:none">' + (D.slotSide || 'Side') + '</div>',
  '    <div id="prevMain-s3"      class="preview-slot preview-main">',
  '      <span style="font-size:22px">&#11035;</span>',
  '      <span>' + (D.slotMainMaster || 'main (masterpage)') + '</span>',
  '    </div>',
  '    <div id="prevStatusbar-s3" class="preview-slot preview-statusbar" style="display:none">' + (D.slotStatusbar || 'StatusBar') + '</div>',
  '  </div>',
  '</div>'
].join('\n');

var s3Js = [
  '// -- One-time setup (masterpage) ----------------------------------------',
  "var topbar    = new MTS.Topbar('#topbar', { brand: { title: 'My App' } });",
  "var sidenav   = new MTS.SideNav('#sidenav', { menu: appMenu });",
  "var statusbar = new MTS.StatusBar('#statusbar', { start: '● Online' });",
  '',
  "var shell = new MTS.Shell('#app', {",
  '  topbar:    topbar,',
  '  sidenav:   sidenav,',
  '  statusbar: statusbar,',
  "  main:      '#main'",
  '});',
  '',
  '// -- Navigation — only the main changes, the shell persists -------------',
  '',
  '// Option A: setMain() with raw HTML',
  'appMenu = new MTS.Menu({',
  '  onClick: function(item) {',
  '    shell.setMain(renderPage(item.key));',
  "    statusbar.setStart('● ' + item.label);",
  '  }',
  '});',
  '',
  'function renderPage(key) {',
  '  var pages = {',
  "    dashboard: '<h1>Dashboard</h1><p>Welcome.</p>',",
  "    users:     '<h1>Users</h1><ul>...</ul>',",
  "    config:    '<h1>Settings</h1><form>...</form>',",
  '  };',
  "  return pages[key] || '<p>Page not found</p>';",
  '}',
  '',
  '// Option B: setMain() with an Element created in JS',
  'shell.setMain(new DashboardView().render());',
  '',
  '// Option C: direct access to the viewport to mount a router',
  "var viewport = shell.getSlot('main');",
  'myRouter.mount(viewport);  // any SPA router'
].join('\n');

makeSection('tabs-s3', s3Html, s3Js, function() {
  var slotsS3 = { top: false, side: false, status: false };
  var shellS3 = null;

  function buildPreviewS3() {
    var topEl    = document.getElementById('prevTopbar-s3');
    var sideEl   = document.getElementById('prevSidenav-s3');
    var mainEl   = document.getElementById('prevMain-s3');
    var statusEl = document.getElementById('prevStatusbar-s3');

    if (!topEl || !sideEl || !mainEl || !statusEl) return;

    topEl.style.display    = slotsS3.top    ? '' : 'none';
    sideEl.style.display   = slotsS3.side   ? '' : 'none';
    statusEl.style.display = slotsS3.status ? '' : 'none';

    if (shellS3) shellS3.destroy();

    shellS3 = new MTS.Shell('#previewShell-s3', {
      topbar:    slotsS3.top    ? topEl    : null,
      sidenav:   slotsS3.side   ? sideEl   : null,
      main:      mainEl,
      statusbar: slotsS3.status ? statusEl : null,
      height:    '100%'
    });
  }

  function toggleSlotS3(name) {
    slotsS3[name] = !slotsS3[name];
    var toggle = document.getElementById('toggle-' + name + '-s3');
    if (toggle) toggle.classList.toggle('slot-toggle--on', slotsS3[name]);
    buildPreviewS3();
  }

  var btnTop    = document.getElementById('toggle-top-s3');
  var btnSide   = document.getElementById('toggle-side-s3');
  var btnStatus = document.getElementById('toggle-status-s3');

  if (btnTop)    btnTop.addEventListener('click',    function() { toggleSlotS3('top'); });
  if (btnSide)   btnSide.addEventListener('click',   function() { toggleSlotS3('side'); });
  if (btnStatus) btnStatus.addEventListener('click', function() { toggleSlotS3('status'); });

  buildPreviewS3();
}, s3HtmlCode);
</script>
</body>
