  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

<script>
  // — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
  (function () {
    var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
    var lang = m ? m[1] : 'en';
    if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
  })();
  var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Grid'] && MTS.getLocale()['MTS.Grid'].demo) || {};

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  setText('demo-subtitle', D.subtitle || 'Structural page layout with native CSS Grid, responsive spans and layout helpers.');
  setText('alert-title', D.alertTitle || 'Visual support used in this demo');

  var alertMessageEl = document.getElementById('alert-message');
  if (alertMessageEl) {
    alertMessageEl.innerHTML =
      MTS.Sanitize.text(D.alertMessagePre || 'This page only uses ') +
      '<strong>.demo-grid-outline</strong>' +
      MTS.Sanitize.text(D.alertMessageMid || ' and ') +
      '<strong>.demo-grid-outline--tall</strong>' +
      MTS.Sanitize.text(D.alertMessageEnd || ' from ') +
      '<code>./support/demo-shared.css</code>' +
      MTS.Sanitize.text(D.alertMessageTail || ' to make the grid boundaries easier to read.');
  }

  setText('s1-title',  D.s1Title  || '1 — Two halves');
  setText('s1-desc',   D.s1Desc   || 'Basic 12-column split using two equal 6/6 spans.');
  setText('s2-title',  D.s2Title  || '2 — Three equal columns');
  setText('s2-desc',   D.s2Desc   || 'Same visual weight across three content blocks.');
  setText('s3-title',  D.s3Title  || '3 — Main + sidebar');
  setText('s3-desc',   D.s3Desc   || 'A classic 8/4 layout for content and sidebar composition.');
  setText('s4-title',  D.s4Title  || '4 — Responsive 12 → 6 → 4');
  setText('s4-desc',   D.s4Desc   || 'Stacks on small screens and redistributes as space grows.');
  setText('s5-title',  D.s5Title  || '5 — Start column + full width');
  setText('s5-desc',   D.s5Desc   || 'Place a block starting later in the grid and force a full-width row when needed.');
  setText('s6-title',  D.s6Title  || '6 — Gap scale');
  setText('s6-desc',   D.s6Desc   || 'Compare small, medium and large spacing without changing the column contract.');
  setText('s7-title',  D.s7Title  || '7 — Vertical alignment');
  setText('s7-desc',   D.s7Desc   || 'Use item self-alignment when blocks with different heights need different anchors.');
  setText('s8-title',  D.s8Title  || '8 — Row span');
  setText('s8-desc',   D.s8Desc   || 'Let one item span more than one row while the rest flows around it.');
  setText('s9-title',  D.s9Title  || '9 — Sidebar helpers');
  setText('s9-desc',   D.s9Desc   || 'Use the built-in shortcuts for common sidebar/page shell layouts.');
  setText('s10-title', D.s10Title || '10 — Auto fit');
  setText('s10-desc',  D.s10Desc  || 'Automatically fit as many columns as the available width allows.');
  setText('s11-title', D.s11Title || '11 — JavaScript API');
  setText('s11-desc',  D.s11Desc  || 'The helper renders the same CSS contract. It does not invent a second layout system.');

  function mountPreview(id, html) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  function mountCodeTabs(id, previewId, key, htmlCode, jsCode, afterPreview) {
    var previewEl = document.getElementById(previewId);
    var previewHtml = previewEl ? previewEl.outerHTML : '<div></div>';
    if (previewEl) previewEl.remove();
    new MTS.Tabs('#' + id, {
      variant: 'card',
      height:  '350px',
      lazy:    false,
      active:  'preview-' + key,
      tabs: [
        { id: 'preview-' + key, label: 'Preview',    content: previewHtml },
        { id: 'html-' + key,    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
        { id: 'js-' + key,      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' },
      ],
    });
    new MTS.CodeBlock('#' + id + '-cb-html', { code: htmlCode || '', language: 'html',       copyable: true });
    new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode  || '', language: 'javascript',  copyable: true });
    if (typeof afterPreview === 'function') afterPreview();
  }

  var examples = {
    basic: {
      html: `<div class="mts-grid mts-grid--gap-md">
  <div class="mts-g-col-6">
    <div class="demo-grid-outline">.mts-g-col-6</div>
  </div>
  <div class="mts-g-col-6">
    <div class="demo-grid-outline">.mts-g-col-6</div>
  </div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    equal3: {
      html: `<div class="mts-grid mts-grid--gap-md">
  <div class="mts-g-col-4"><div class="demo-grid-outline">.mts-g-col-4</div></div>
  <div class="mts-g-col-4"><div class="demo-grid-outline">.mts-g-col-4</div></div>
  <div class="mts-g-col-4"><div class="demo-grid-outline">.mts-g-col-4</div></div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    mainSidebar: {
      html: `<div class="mts-grid mts-grid--gap-md">
  <div class="mts-g-col-8"><div class="demo-grid-outline">Main — .mts-g-col-8</div></div>
  <div class="mts-g-col-4"><div class="demo-grid-outline">Sidebar — .mts-g-col-4</div></div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    responsive: {
      html: `<div class="mts-grid mts-grid--gap-md">
  <div class="mts-g-col-12 mts-g-col-md-6 mts-g-col-lg-4"><div class="demo-grid-outline">12 / md 6 / lg 4</div></div>
  <div class="mts-g-col-12 mts-g-col-md-6 mts-g-col-lg-4"><div class="demo-grid-outline">12 / md 6 / lg 4</div></div>
  <div class="mts-g-col-12 mts-g-col-md-12 mts-g-col-lg-4"><div class="demo-grid-outline">12 / md 12 / lg 4</div></div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    startFull: {
      html: `<div class="mts-grid mts-grid--gap-md">
  <div class="mts-g-col-4 mts-g-start-3"><div class="demo-grid-outline">.mts-g-col-4 + .mts-g-start-3</div></div>
  <div class="mts-g-col-full"><div class="demo-grid-outline">.mts-g-col-full</div></div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    gapScale: {
      html: `<div class="demo-stack">
  <div class="mts-grid mts-grid--gap-sm">
    <div class="mts-g-col-6"><div class="demo-grid-outline">gap-sm</div></div>
    <div class="mts-g-col-6"><div class="demo-grid-outline">gap-sm</div></div>
  </div>
  <div class="mts-grid mts-grid--gap-md">
    <div class="mts-g-col-6"><div class="demo-grid-outline">gap-md</div></div>
    <div class="mts-g-col-6"><div class="demo-grid-outline">gap-md</div></div>
  </div>
  <div class="mts-grid mts-grid--gap-lg">
    <div class="mts-g-col-6"><div class="demo-grid-outline">gap-lg</div></div>
    <div class="mts-g-col-6"><div class="demo-grid-outline">gap-lg</div></div>
  </div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    vertical: {
      html: `<div class="mts-grid mts-grid--gap-md" style="--mts-rows: 1;">
  <div class="mts-g-col-4 mts-g-self-start"><div class="demo-grid-outline demo-grid-outline--tall">.mts-g-self-start</div></div>
  <div class="mts-g-col-4 mts-g-self-center"><div class="demo-grid-outline">.mts-g-self-center</div></div>
  <div class="mts-g-col-4 mts-g-self-end"><div class="demo-grid-outline">.mts-g-self-end</div></div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    rowSpan: {
      html: `<div class="mts-grid mts-grid--gap-md" style="--mts-rows: 3;">
  <div class="mts-g-col-6 mts-g-row-2"><div class="demo-grid-outline demo-grid-outline--tall">.mts-g-col-6 + .mts-g-row-2</div></div>
  <div class="mts-g-col-6"><div class="demo-grid-outline">Top right</div></div>
  <div class="mts-g-col-6"><div class="demo-grid-outline">Middle right</div></div>
  <div class="mts-g-col-full"><div class="demo-grid-outline">.mts-g-col-full</div></div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    sidebarHelpers: {
      html: `<div class="demo-stack">
  <div class="mts-grid mts-grid--sidebar mts-grid--gap-md">
    <div><div class="demo-grid-outline">Sidebar helper</div></div>
    <div><div class="demo-grid-outline">Content helper</div></div>
  </div>
  <div class="mts-grid mts-grid--sidebar-right mts-grid--gap-md">
    <div><div class="demo-grid-outline">Content helper</div></div>
    <div><div class="demo-grid-outline">Sidebar helper</div></div>
  </div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    autofit: {
      html: `<div class="mts-grid mts-grid--auto-fit mts-grid--gap-md" style="--mts-col-min: 140px;">
  <div><div class="demo-grid-outline">Auto fit</div></div>
  <div><div class="demo-grid-outline">Auto fit</div></div>
  <div><div class="demo-grid-outline">Auto fit</div></div>
  <div><div class="demo-grid-outline">Auto fit</div></div>
</div>`,
      js: `// CSS-first example — no JavaScript required`
    },
    jsApi: {
      html: `<div id="grid-js-runtime"></div>`,
      js: `const grid = new MTS.Grid('#grid-js-runtime', {
  className: 'mts-grid--gap-md',
  items: [
    {
      col: 8,
      html: '<div class="demo-grid-outline">Main — col 8</div>'
    },
    {
      col: 4,
      html: '<div class="demo-grid-outline">Sidebar — col 4</div>'
    },
    {
      full: true,
      html: '<div class="demo-grid-outline">Footer — full width</div>'
    }
  ]
});`
    }
  };

  mountPreview('preview-basic', examples.basic.html);
  mountPreview('preview-equal-3', examples.equal3.html);
  mountPreview('preview-main-sidebar', examples.mainSidebar.html);
  mountPreview('preview-responsive', examples.responsive.html);
  mountPreview('preview-start-full', examples.startFull.html);
  mountPreview('preview-gap-scale', examples.gapScale.html);
  mountPreview('preview-vertical', examples.vertical.html);
  mountPreview('preview-row-span', examples.rowSpan.html);
  mountPreview('preview-sidebar-helpers', examples.sidebarHelpers.html);
  mountPreview('preview-autofit', examples.autofit.html);
  mountPreview('preview-js-api', examples.jsApi.html);

  new MTS.Grid('#grid-js-runtime', {
    className: 'mts-grid--gap-md',
    items: [
      { col: 8, html: '<div class="demo-grid-outline">Main — col 8</div>' },
      { col: 4, html: '<div class="demo-grid-outline">Sidebar — col 4</div>' },
      { full: true, html: '<div class="demo-grid-outline">Footer — full width</div>' }
    ]
  });

  mountCodeTabs('tabs-basic', 'preview-basic', 'basic', examples.basic.html, examples.basic.js);
  mountCodeTabs('tabs-equal-3', 'preview-equal-3', 'equal-3', examples.equal3.html, examples.equal3.js);
  mountCodeTabs('tabs-main-sidebar', 'preview-main-sidebar', 'main-sidebar', examples.mainSidebar.html, examples.mainSidebar.js);
  mountCodeTabs('tabs-responsive', 'preview-responsive', 'responsive', examples.responsive.html, examples.responsive.js);
  mountCodeTabs('tabs-start-full', 'preview-start-full', 'start-full', examples.startFull.html, examples.startFull.js);
  mountCodeTabs('tabs-gap-scale', 'preview-gap-scale', 'gap-scale', examples.gapScale.html, examples.gapScale.js);
  mountCodeTabs('tabs-vertical', 'preview-vertical', 'vertical', examples.vertical.html, examples.vertical.js);
  mountCodeTabs('tabs-row-span', 'preview-row-span', 'row-span', examples.rowSpan.html, examples.rowSpan.js);
  mountCodeTabs('tabs-sidebar-helpers', 'preview-sidebar-helpers', 'sidebar-helpers', examples.sidebarHelpers.html, examples.sidebarHelpers.js);
  mountCodeTabs('tabs-autofit', 'preview-autofit', 'autofit', examples.autofit.html, examples.autofit.js);
  mountCodeTabs('tabs-js-api', 'preview-js-api', 'js-api', examples.jsApi.html, examples.jsApi.js, function(){
    new MTS.Grid('#grid-js-runtime', {
      className: 'mts-grid--gap-md',
      items: [
        { col: 8, html: '<div class="demo-grid-outline">Main — col 8</div>' },
        { col: 4, html: '<div class="demo-grid-outline">Sidebar — col 4</div>' },
        { full: true, html: '<div class="demo-grid-outline">Footer — full width</div>' }
      ]
    });
  });
</script>
