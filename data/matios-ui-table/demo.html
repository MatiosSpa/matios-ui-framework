    (function(){
      const sp=location.search||location.hash||'';
      const mm=sp.match(/mts-mode=([a-z-]+)/);
      const ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        const p=window.parent;
        if(p&&p!==window){
          const pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          const pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

function esc(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  let indent      = 0;
  const step      = 2;
  const voids     = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  let result      = '';
  const tokens    = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    const t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      const tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      const text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

/*
 * makeSection — creates the 3 tabs: Preview, HTML and JavaScript.
 * With lazy:false all panels are in the DOM when this function returns,
 * so MTS.CodeBlock can be initialized directly without setTimeout.
 *
 * @param {string} id          — id of the tabs container
 * @param {string} previewHtml — preview HTML (string for the tabs system)
 * @param {string} jsCode      — sample JS code
 * @param {string} [htmlCode]  — alternative HTML for the HTML tab (optional)
 */
function makeSection(id, previewHtml, jsCode, htmlCode) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height:  '350px',
    lazy:    false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',        content: '<div id="cb-html-' + id + '" style="height:100%"></div>' },
      { id: id + '-js',      label: 'JavaScript',  content: '<div id="cb-js-' + id + '" style="height:100%"></div>' },
    ],
  });

  new MTS.CodeBlock(document.getElementById('cb-html-' + id), {
    language: 'html',
    code:     htmlCode || indentHtml(previewHtml),
    copyable: true,
  });

  new MTS.CodeBlock(document.getElementById('cb-js-' + id), {
    language: 'javascript',
    code:     jsCode,
    copyable: true,
  });
}

  const span = document.createElement('span');
  span.className = 'mts-badge' + (BADGE_VARIANTS[status] ? ' ' + BADGE_VARIANTS[status] : '');
  span.textContent = BADGES[status] || status;
  return span;

function makeIconBtn(icon) {
  const btn = document.createElement('button');

  i.className = 'mts-icon mts-icon-' + icon + ' mts-icon--sm';

/* ============================================================
   S5 — Sortable headers
   ============================================================ */
const sortData = PRODUCTS.slice();
let sortCol    = 'name';
let sortDir    = 'asc';

function makeSortIcon() {
  const wrap = document.createElement('span');
  wrap.className = 'mts-table__sort';
  const up = document.createElement('span');
  up.className = 'mts-table__sort-up';
  const down = document.createElement('span');
  down.className = 'mts-table__sort-down';
  wrap.appendChild(up);
  wrap.appendChild(down);
  return wrap;
}

function makeSortTh(col, label, extraClass) {
  const th = document.createElement('th');
  th.className = 'mts-table__th mts-table__th--sortable' +
    (extraClass ? ' ' + extraClass : '') +
    (col === sortCol ? ' mts-table__th--' + sortDir : '');
  th.onclick = () => doSort(col);
  th.appendChild(document.createTextNode(label));
  th.appendChild(makeSortIcon());
  return th;
}

function buildSortTable() {
  const sorted = sortData.slice().sort(function(a, b) {
    const av = a[sortCol], bv = b[sortCol];
    if (typeof av === 'number') return sortDir === 'asc' ? av - bv : bv - av;
    return sortDir === 'asc'
      ? String(av).localeCompare(String(bv))
      : String(bv).localeCompare(String(av));
  });

  const wrap  = document.createElement('div');
  wrap.className = 'mts-table-wrap';
  const table = document.createElement('table');
  table.className = 'mts-table mts-table--hover';
  table.id = 'sort-table';

  const thead = document.createElement('thead');
  const tr    = document.createElement('tr');
  tr.appendChild(makeSortTh('name',     D.colProduct  || 'Product',  ''));
  tr.appendChild(makeSortTh('category', D.colCategory || 'Category', ''));
  tr.appendChild(makeSortTh('stock',    D.colStock    || 'Stock',    'mts-table__th--end'));
  tr.appendChild(makeSortTh('price',    D.colPrice    || 'Price',    'mts-table__th--end'));
  thead.appendChild(tr);

  const tbody = document.createElement('tbody');
  sorted.forEach(function(p) {
    const row = document.createElement('tr');
    row.className = 'mts-table__row';

    const tdName = document.createElement('td');
    tdName.className = 'mts-table__td';
    tdName.textContent = p.name;

    const tdCat = document.createElement('td');
    tdCat.className = 'mts-table__td';
    tdCat.textContent = p.category;

    const tdStock = document.createElement('td');
    tdStock.className = 'mts-table__td mts-table__td--end';
    tdStock.textContent = p.stock;

    const tdPrice = document.createElement('td');
    tdPrice.className = 'mts-table__td mts-table__td--end';
    tdPrice.textContent = fmtPrice(p.price);

    row.appendChild(tdName);
    row.appendChild(tdCat);
    row.appendChild(tdStock);
    row.appendChild(tdPrice);
    tbody.appendChild(row);
  });

  table.appendChild(thead);
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function doSort(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = 'asc';
  }
  const panel = document.getElementById('mts-panel-tabs-s5-preview');
  if (!panel) return;
  panel.replaceChildren();
  panel.appendChild(buildSortTable());
}

/* ============================================================

   ============================================================ */
function toggleAll(master) {
  document.querySelectorAll('.row-chk').forEach(function(chk) {
    chk.checked = master.checked;
    chk.closest('tr').classList.toggle('mts-table__row--selected', master.checked);
  });
  updateChkResult();
}

function toggleRow(chk, idx) {
  document.getElementById('chk-row-' + idx).classList.toggle('mts-table__row--selected', chk.checked);
  const total   = document.querySelectorAll('.row-chk').length;
  const checked = document.querySelectorAll('.row-chk:checked').length;
  const master  = document.getElementById('chk-all');
  if (master) {
    master.indeterminate = checked > 0 && checked < total;
    master.checked = checked === total;
  }
  updateChkResult();
}

function updateChkResult() {
  const n  = document.querySelectorAll('.row-chk:checked').length;
  const el = document.getElementById('chk-result');
  if (el) el.textContent = n === 0
    ? (D.chkPlaceholder || '— select rows —')
    : n + ' ' + (n > 1 ? (D.chkRowPlural || 'rows selected') : (D.chkRowSingular || 'row selected'));
}

function toggleVariant(cls) {
  const t = document.getElementById('demo-toggle-table');
  if (t) t.classList.toggle(cls);
}

MTS.Icon.initAll();

/* ============================================================
   S13 — Loading skeleton
   ============================================================ */
function buildTable() {
  const wrap  = document.createElement('div');
  wrap.className = 'mts-table-wrap';

  const table = document.createElement('table');
  table.className = 'mts-table mts-table--hover';

  const thead = document.createElement('thead');
  const hRow  = document.createElement('tr');
  [
    { label: D.colName   || 'Name',   cls: '' },
    { label: D.colEmail  || 'Email',  cls: '' },
    { label: D.colRole   || 'Role',   cls: '' },
    { label: D.colStatus || 'Status', cls: 'mts-table__th--center' },
    { label: D.colDate   || 'Date',   cls: 'mts-table__th--end' },
  ].forEach(function(col) {
    const th = document.createElement('th');
    th.className = 'mts-table__th' + (col.cls ? ' ' + col.cls : '');
    th.textContent = col.label;
    hRow.appendChild(th);
  });
  thead.appendChild(hRow);

  const tbody = document.createElement('tbody');
  USERS.forEach(function(u) {
    const row = document.createElement('tr');
    row.className = 'mts-table__row';

    const tdName = document.createElement('td');
    tdName.className = 'mts-table__td';
    tdName.textContent = u.name;

    const tdEmail = document.createElement('td');
    tdEmail.className = 'mts-table__td';
    tdEmail.textContent = u.email;

    const tdRole = document.createElement('td');
    tdRole.className = 'mts-table__td';
    tdRole.textContent = u.role;

    const tdStatus = document.createElement('td');
    tdStatus.className = 'mts-table__td mts-table__td--center';
    tdStatus.appendChild(makeBadge(u.status));

    const tdDate = document.createElement('td');
    tdDate.className = 'mts-table__td mts-table__td--end';
    tdDate.textContent = u.date;

    row.appendChild(tdName);
    row.appendChild(tdEmail);
    row.appendChild(tdRole);
    row.appendChild(tdStatus);
    row.appendChild(tdDate);
    tbody.appendChild(row);
  });

  table.appendChild(thead);
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function reloadSkeleton() {
  const host = document.getElementById('skeleton-host');
  if (!host) return;
  host.replaceChildren();
  const sk = new MTS.Skeleton(host, {
    variant:   'table',
    rows:      5,
    cols:      5,
    animation: 'wave',
  });
  setTimeout(function() {
    sk.destroy();
    host.appendChild(buildTable());
  }, 2000);
}

/* Start with the skeleton on load */
setTimeout(function() {
  reloadSkeleton();
}, 100);
