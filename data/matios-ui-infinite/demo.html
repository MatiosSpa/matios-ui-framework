  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<body>
<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Infinite</h1>
    <p id="demo-subtitle"></p>
    <div class="demo-header-actions">
    </div>
    <div class="demo-docs-panel" id="docs-panel"></div>
  </div>

  <div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s3-title"></div><div id="tabs-s3"></div></div>
</div>

<script>
// — Locale: shows English by default (public-facing); ?lang=es|en|pt to switch —
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var L = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Infinite']) || {};
var D = L.demo || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Infinite scroll with incremental loading controlled by the developer in vertical and grid layouts.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Vertical layout';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Grid layout';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — reset() and events';

function infEchoLoad(e) {
  return (D.echoLoadPagePrefix || 'onLoad → page:') + e.detail.page + (D.echoLoadItems || ' items:') + e.detail.items.length;
}
function infEchoEnd(e) {
  return (D.echoEndTotalPrefix || 'onEnd → total:') + e.detail.total + ' ✓';
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function makeSection(id, previewHtml, jsCode) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: '350px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview',    content: previewHtml },
      { id: id + '-html',    label: 'HTML',       content: '<div id="' + id + '-cb-html"></div>' },
      { id: id + '-js',      label: 'JavaScript', content: '<div id="' + id + '-cb-js"></div>' }
    ]
  });
  new MTS.CodeBlock('#' + id + '-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#' + id + '-cb-js',   { code: jsCode || '',            language: 'javascript', copyable: true });
}

var previewS1 = '<div id="inf-vertical-demo" style="max-height:300px;overflow:auto;border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg)"></div>' +
  '<div class="result-box" id="inf-result-vertical" style="margin-top:12px">' + (D.resultVerticalHint || '— scroll to the bottom to load more —') + '</div>';

var jsS1 = [
  "const infinite = new MTS.Infinite('#inf-vertical-demo', {",
  "  pageSize: 12,",
  "  layout: 'vertical',",
  "  onLoadMore: async ({ page, pageSize }) => {",
  "    await new Promise(r => setTimeout(r, 300));",
  "    const items = Array.from({ length: pageSize }, (_, i) => ({",
  "      id: (page - 1) * pageSize + i,",
  "      name: 'User ' + ((page - 1) * pageSize + i + 1),",
  "      email: 'user' + ((page - 1) * pageSize + i) + '@company.com'",
  "    }));",
  "    return { items, hasMore: page < 4 };",
  "  },",
  "  renderItem: (user, index) => {",
  "    const row = document.createElement('div');",
  "    row.style.cssText = 'display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--mts-border-color)';",
  "    row.innerHTML = '<span style=\'width:36px;font-size:11px;color:var(--mts-text-muted)\'>#' + (index + 1) + '</span>' +",
  "      '<span style=\'flex:1;font-weight:500\'>' + user.name + '</span>' +",
  "      '<span style=\'font-size:11px;color:var(--mts-text-muted)\'>' + user.email + '</span>';",
  "    return row;",
  "  },",
  "  onLoad: (e) => console.log('page', e.detail.page),",
  "  onEnd: (e) => console.log('total', e.detail.total)",
  "});"
].join('\n');

var previewS2 = '<div id="inf-grid-demo" style="max-height:320px;overflow:auto;border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg)"></div>' +
  '<div class="result-box" id="inf-result-grid" style="margin-top:12px">' + (D.resultGridHint || '— grid layout with simple cards —') + '</div>';

var jsS2 = [
  "const infiniteGrid = new MTS.Infinite('#inf-grid-demo', {",
  "  pageSize: 8,",
  "  layout: 'grid',",
  "  animate: true,",
  "  onLoadMore: async ({ page, pageSize }) => {",
  "    await new Promise(r => setTimeout(r, 250));",
  "    const items = Array.from({ length: pageSize }, (_, i) => ({",
  "      id: (page - 1) * pageSize + i,",
  "      title: 'Product ' + ((page - 1) * pageSize + i + 1),",
  "      price: (Math.random() * 300 + 20).toFixed(2)",
  "    }));",
  "    return { items, hasMore: page < 3 };",
  "  },",
  "  renderItem: (item) => {",
  "    const card = document.createElement('div');",
  "    card.style.cssText = 'border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:14px;background:var(--mts-surface)';",
  "    card.innerHTML = '<strong style=\'display:block;margin-bottom:4px\'>' + item.title + '</strong>$' + item.price;",
  "    return card;",
  "  },",
  "  onEnd: (e) => console.log('grid total', e.detail.total)",
  "});"
].join('\n');

var previewS3 = '<div class="demo-row" style="margin-bottom:12px"><button id="btn-reset-inf"></button></div>' +
  '<div id="inf-events-demo" style="max-height:260px;overflow:auto;border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg)"></div>' +
  '<div class="result-box" id="inf-result-events" style="margin-top:12px">' + (D.resultEventsHint || '— watch onLoad and onEnd —') + '</div>';

var jsS3 = [
  "const eventsInfinite = new MTS.Infinite('#inf-events-demo', {",
  "  pageSize: 10,",
  "  layout: 'vertical',",
  "  onLoadMore: async ({ page, pageSize }) => {",
  "    await new Promise(r => setTimeout(r, 200));",
  "    const items = Array.from({ length: pageSize }, (_, i) => ({",
  "      id: (page - 1) * pageSize + i,",
  "      label: 'Record ' + ((page - 1) * pageSize + i + 1)",
  "    }));",
  "    return { items, hasMore: page < 2 };",
  "  },",
  "  renderItem: (item) => '<div style=\'padding:10px 14px;border-bottom:1px solid var(--mts-border-color)\'>' + item.label + '</div>',",
  "  onLoad: (e) => console.log('loaded', e.detail.page),",
  "  onEnd: (e) => console.log('finished', e.detail.total)",
  "});",
  "",
  "new MTS.Button('#btn-reset-inf', {",
  "  label: 'reset()',",
  "  variant: 'secondary',",
  "  onClick: () => eventsInfinite.reset()",
  "});"
].join('\n');

makeSection('tabs-s1', previewS1, jsS1);
makeSection('tabs-s2', previewS2, jsS2);
makeSection('tabs-s3', previewS3, jsS3);

new MTS.Infinite('#inf-vertical-demo', {
  pageSize: 12,
  layout: 'vertical',
  onLoadMore: function(opts) {
    return new Promise(function(resolve) {
      setTimeout(function() {
        var items = Array.from({ length: opts.pageSize }, function(_, i) {
          var n = (opts.page - 1) * opts.pageSize + i;
          return { id: n, name: (D.itemUserPrefix || 'User ') + (n + 1), email: 'user' + n + '@company.com' };
        });
        resolve({ items: items, hasMore: opts.page < 4 });
      }, 300);
    });
  },
  renderItem: function(user, index) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--mts-border-color)';
    row.innerHTML = '<span style="width:36px;font-size:11px;color:var(--mts-text-muted)">#' + (index + 1) + '</span>' + '<span style="flex:1;font-weight:500">' + user.name + '</span>' + '<span style="font-size:11px;color:var(--mts-text-muted)">' + user.email + '</span>';
    return row;
  },
  onLoad: function(e) { document.getElementById('inf-result-vertical').textContent = infEchoLoad(e); },
  onEnd: function(e) { document.getElementById('inf-result-vertical').textContent = infEchoEnd(e); }
});

new MTS.Infinite('#inf-grid-demo', {
  pageSize: 8,
  layout: 'grid',
  animate: true,
  onLoadMore: function(opts) {
    return new Promise(function(resolve) {
      setTimeout(function() {
        var items = Array.from({ length: opts.pageSize }, function(_, i) {
          var n = (opts.page - 1) * opts.pageSize + i;
          return { id: n, title: (D.itemProductPrefix || 'Product ') + (n + 1), price: (Math.random() * 300 + 20).toFixed(2) };
        });
        resolve({ items: items, hasMore: opts.page < 3 });
      }, 250);
    });
  },
  renderItem: function(item) {
    var card = document.createElement('div');
    card.style.cssText = 'border:1px solid var(--mts-border-color);border-radius:var(--mts-radius-lg);padding:14px;background:var(--mts-surface)';
    card.innerHTML = '<strong style="display:block;margin-bottom:4px">' + item.title + '</strong>$' + item.price;
    return card;
  },
  onLoad: function(e) { document.getElementById('inf-result-grid').textContent = infEchoLoad(e); },
  onEnd: function(e) { document.getElementById('inf-result-grid').textContent = infEchoEnd(e); }
});

var eventsInfinite = new MTS.Infinite('#inf-events-demo', {
  pageSize: 10,
  layout: 'vertical',
  onLoadMore: function(opts) {
    return new Promise(function(resolve) {
      setTimeout(function() {
        var items = Array.from({ length: opts.pageSize }, function(_, i) {
          var n = (opts.page - 1) * opts.pageSize + i;
          return { id: n, label: (D.itemRecordPrefix || 'Record ') + (n + 1) };
        });
        resolve({ items: items, hasMore: opts.page < 2 });
      }, 200);
    });
  },
  renderItem: function(item) {
    return '<div style="padding:10px 14px;border-bottom:1px solid var(--mts-border-color)">' + item.label + '</div>';
  },
  onLoad: function(e) { document.getElementById('inf-result-events').textContent = infEchoLoad(e); },
  onEnd: function(e) { document.getElementById('inf-result-events').textContent = infEchoEnd(e); }
});

new MTS.Button('#btn-reset-inf', {
  label: D.resetLabel || 'reset()',
  variant: 'secondary',
  onClick: function() { eventsInfinite.reset(); }
});
</script>
