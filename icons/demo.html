<!DOCTYPE html>

  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

var preview_s1 =
  '<div class="icon-sizes-row">' +
    '<div class="icon-demo-group"><i class="mts-icon mts-icon-star mts-icon--xs"></i><span class="icon-demo-label">xs 12px</span></div>' +
    '<div class="icon-demo-group"><i class="mts-icon mts-icon-star mts-icon--sm"></i><span class="icon-demo-label">sm 14px</span></div>' +
    '<div class="icon-demo-group"><i class="mts-icon mts-icon-star mts-icon--md"></i><span class="icon-demo-label">md 18px</span></div>' +
    '<div class="icon-demo-group"><i class="mts-icon mts-icon-star mts-icon--lg"></i><span class="icon-demo-label">lg 22px</span></div>' +
    '<div class="icon-demo-group"><i class="mts-icon mts-icon-star mts-icon--xl"></i><span class="icon-demo-label">xl 28px</span></div>' +
    '<div class="icon-demo-group"><i class="mts-icon mts-icon-star mts-icon--2xl"></i><span class="icon-demo-label">2xl 36px</span></div>' +
    '<div class="icon-demo-group"><i class="mts-icon mts-icon-star mts-icon--3xl"></i><span class="icon-demo-label">3xl 48px</span></div>' +
  '</div>';

  "MTS.Icon.render('star', el, true);  // filled variant";

var preview_s2 =

    '<div class="icon-demo-group"><div class="icon-demo-pair"><i class="mts-icon mts-icon-bookmark mts-icon--xl"></i><i class="mts-icon mts-icon-bookmark mts-icon--xl mts-icon--filled" style="color:var(--mts-color-primary)"></i></div><span class="icon-demo-label">bookmark</span></div>' +
    '<div class="icon-demo-group"><div class="icon-demo-pair"><i class="mts-icon mts-icon-bell mts-icon--xl"></i><i class="mts-icon mts-icon-bell mts-icon--xl mts-icon--filled"></i></div><span class="icon-demo-label">bell</span></div>' +

  '</div>';

var js_s2 =

var js_s4 =

  "new MTS.Button('#btn-use-edit', { label: 'Edit', variant: 'secondary', iconLeft: MTS.Icon.get('edit') });\n" +
  "new MTS.Button('#btn-use-delete', { label: 'Delete', variant: 'danger', iconLeft: MTS.Icon.get('trash') });\n\n" +

makeSection('tabs-s3', preview_s3, js_s3);
makeSection('tabs-s4', preview_s4, js_s4, function() {
  new MTS.Button('#btn-use-download', { label: 'Download', variant: 'primary', iconLeft: MTS.Icon.get('download') });
  new MTS.Button('#btn-use-edit', { label: 'Edit', variant: 'secondary', iconLeft: MTS.Icon.get('edit') });
  new MTS.Button('#btn-use-delete', { label: 'Delete', variant: 'danger', iconLeft: MTS.Icon.get('trash') });
});

function buildGallery(filter) {
  var names = MTS.Icon.list();
  if (filter) {
    var f = filter.toLowerCase();
    names = names.filter(function(n){ return n.indexOf(f) !== -1; });
  }
  var gallery = document.getElementById('iconGallery');
  var counter  = document.getElementById('iconCounter');
  counter.textContent = names.length + ' icons';

  gallery.innerHTML = names.map(function(name) {
    return '<div class="icon-card" onclick="copyIcon(\'' + name + '\')" id="card-' + name + '">' +
      '<div style="font-size:22px;color:var(--mts-text-primary)">' + MTS.Icon.get(name, 22) + '</div>' +
      '<span class="icon-name">' + name + '</span>' +
    '</div>';
  }).join('');
}

function filterIcons(v) { buildGallery(v); }

function copyIcon(name) {
  var text = 'mts-icon-' + name;
  navigator.clipboard && navigator.clipboard.writeText(text);
  document.getElementById('icon-result').textContent = 'Copied: ' + text;
  var card = document.getElementById('card-' + name);
  if (card) {
    card.classList.add('copied');
    setTimeout(function(){ card.classList.remove('copied'); }, 1200);
  }
}

buildGallery();
</script>
