<!DOCTYPE html>

<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

  <script>
    // — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
    (function () {
      var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
      var lang = m ? m[1] : 'en';
      if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
    })();
    var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.CodeBlock'].demo) || {};

    document.getElementById('demo-subtitle').textContent = D.subtitle || 'Matios syntax highlighting for shared snippets, code preview in demos and source views inside the showcase.';
    document.getElementById('s1-title').textContent = D.s1Title || '1 — HTML / CSS / JavaScript';
    document.getElementById('s2-title').textContent = D.s2Title || '2 — CSharp / Java / SQL';
    document.getElementById('s3-title').textContent = D.s3Title || '3 — Bash / JSON / YAML';
    document.getElementById('s4-title').textContent = D.s4Title || '4 — Optional wrap';

    function createPreviewPanel(id) {
      var panel = document.createElement('div');
      panel.className = 'mts-p-2';

      var host = document.createElement('div');
      host.id = 'preview-' + id;
      panel.appendChild(host);

      return { panel: panel, hostId: '#' + host.id };
    }

    function createCodePanel(title, language, code) {
      var panel = document.createElement('div');
      panel.className = 'mts-p-2 mts-h-full';

      var host = document.createElement('div');
      host.className = 'mts-h-full';
      panel.appendChild(host);

      new MTS.CodeBlock(host, {
        title: title,
        language: language,
        code: code,
        copyable: true,
        height: '100%'
      });

      return panel;
    }

    function buildExample(example) {
      var preview = createPreviewPanel(example.id);
      var htmlCode = '<div id="preview-' + example.id + '"></div>';

      var tabs = [
        {
          id: example.id + '-preview',
          label: 'Preview',
          content: preview.panel
        },
        {
          id: example.id + '-html',
          label: 'HTML',
          content: createCodePanel('HTML', 'html', htmlCode)
        }
      ];

      if (example.jsCode) {
        tabs.push({
          id: example.id + '-js',
          label: 'JavaScript',
          content: createCodePanel('JavaScript', 'javascript', example.jsCode)
        });
      }

      new MTS.Tabs('#tabs-' + example.id, {
        variant: 'card',
        height: example.height || '360px',
        lazy: false,
        tabs: tabs
      });

      new MTS.CodeBlock(preview.hostId, Object.assign({
        height: example.previewHeight || '400px',
        copyable: true
      }, example.previewOptions));
    }

    var examples = [
      {
        id: 'html',
        height: '390px',
        previewOptions: {
          title: 'role-create/index.html',
          subtitle: 'apps-showcase/roles/role-create/index.html',
          language: 'html',
          code:
`<section class="mts-surface mts-p-4">

  <p class="mts-text--sm mts-text-color--muted mts-m-0">
    Cada modulo admite un unico perfil dentro del rol.
  </p>
</section>`
        },
        jsCode:
`new MTS.CodeBlock('#preview-html', {
  title: 'role-create/index.html',
  subtitle: 'apps-showcase/roles/role-create/index.html',
  language: 'html',
  code: \`<section class="mts-surface mts-p-4">
  <h2 class="mts-h4 mts-mb-1">Roles</h2>
  <p class="mts-text--sm mts-text-color--muted mts-m-0">
    Cada modulo admite un unico perfil dentro del rol.
  </p>
</section>\`
});`
      },

        height: '360px',

          subtitle: 'utilities/matios-ui-codeblock/',
          language: 'css',

`.mts-codeblock__lang {

}`

`new MTS.CodeBlock('#preview-css', {

  subtitle: 'utilities/matios-ui-codeblock/',
  language: 'css',
  code: \`.mts-codeblock__lang {

`const block = new MTS.CodeBlock('#snippet', {
  title: 'main.js',
  subtitle: 'src/main.js',
  language: 'javascript',
  code: 'const users = await api.getUsers();'
});

block.setLanguage('typescript');`
        },

`new MTS.CodeBlock('#preview-js', {

  }

      },
      {

`name: showcase-check

`new MTS.CodeBlock('#preview-yaml', {

  code: \`const response = await api.get('/workflows/inbox?include=requester,approvers,history,metadata&sort=-createdAt&pageSize=100&workspaceId=current');\`

    ];

    examples.forEach(buildExample);
  </script>
</body>
