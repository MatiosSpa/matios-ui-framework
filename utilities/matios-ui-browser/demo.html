<!DOCTYPE html>
<html lang="en" data-mts-mode="light">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTS.Browser — Demo</title>

  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../forms/matios-ui-checkbox/matios-ui-checkbox.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">

  <script src="../../support/demo-shared.js"></script>
  <script src="../../forms/matios-ui-checkbox/matios-ui-checkbox.js"></script>
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../base/matios-ui-i18n.js"></script>
  <script src="./matios-ui-browser-i18n.js"></script>
  <script src="./matios-ui-browser.js"></script>

  <style>
    .browser-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
      padding: 24px;
    }

    .browser-card {
      background:    var(--mts-surface);
      border:        1px solid var(--mts-border);
      border-radius: var(--mts-radius-lg);
      padding:       20px;
      display:       flex;
      flex-direction:column;
      gap:           14px;
    }

    .browser-card__title {
      font-size:   13px;
      font-weight: 600;
      color:       var(--mts-text-secondary);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .browser-card__checks {
      display:        flex;
      flex-direction: column;
      gap:            10px;
    }

    .browser-card__actions {
      display:   flex;
      flex-wrap: wrap;
      gap:       8px;
    }

    .browser-card__result {
      font-size:     12px;
      font-family:   var(--mts-font-mono, monospace);
      background:    var(--mts-surface-alt);
      border:        1px solid var(--mts-border);
      border-radius: var(--mts-radius);
      padding:       10px 12px;
      white-space:   pre-wrap;
      word-break:    break-all;
      color:         var(--mts-text-secondary);
      min-height:    40px;
      line-height:   1.6;
    }

    .browser-card__result.is-ok    { color: var(--mts-success); }
    .browser-card__result.is-error { color: var(--mts-danger);  }

    .browser-card__note {
      font-size:  11px;
      color:      var(--mts-text-muted);
      line-height:1.5;
    }
  </style>
</head>
<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.Browser</h1>
    <p id="demo-subtitle"></p>
  </div>

  <div class="browser-grid">

    <!-- ── 🛡️ Guard ──────────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="guard-title"></div>
      <div class="browser-card__checks" id="guard-checks"></div>
      <div class="browser-card__note" id="guard-note"></div>
    </div>

    <!-- ── 📍 Location ────────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="location-title"></div>
      <div class="browser-card__actions" id="location-actions"></div>
      <div class="browser-card__result" id="location-result">—</div>
    </div>

    <!-- ── 🔔 Notifications ───────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="notif-title"></div>
      <div class="browser-card__actions" id="notif-actions"></div>
      <div class="browser-card__result" id="notif-result">—</div>
    </div>

    <!-- ── 📋 Clipboard ───────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="clip-title"></div>
      <div class="browser-card__actions" id="clip-actions"></div>
      <div class="browser-card__result" id="clip-result">—</div>
    </div>

    <!-- ── 🖥️ Fullscreen ──────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="fs-title"></div>
      <div class="browser-card__actions" id="fs-actions"></div>
      <div class="browser-card__result" id="fs-result">—</div>
    </div>

    <!-- ── 💡 Wake Lock ───────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="wl-title"></div>
      <div class="browser-card__actions" id="wl-actions"></div>
      <div class="browser-card__result" id="wl-result">—</div>
      <div class="browser-card__note" id="wl-note"></div>
    </div>

    <!-- ── 🌐 Network ─────────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="net-title"></div>
      <div class="browser-card__actions" id="net-actions"></div>
      <div class="browser-card__result" id="net-result">—</div>
    </div>

    <!-- ── 🔋 Battery ─────────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="bat-title"></div>
      <div class="browser-card__actions" id="bat-actions"></div>
      <div class="browser-card__result" id="bat-result">—</div>
    </div>

    <!-- ── 📳 Vibration ───────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="vib-title"></div>
      <div class="browser-card__actions" id="vib-actions"></div>
      <div class="browser-card__result" id="vib-result">—</div>
      <div class="browser-card__note" id="vib-note"></div>
    </div>

    <!-- ── 📤 Share ───────────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="share-title"></div>
      <div class="browser-card__actions" id="share-actions"></div>
      <div class="browser-card__result" id="share-result">—</div>
    </div>

    <!-- ── 👁️ Visibility ──────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="vis-title"></div>
      <div class="browser-card__actions" id="vis-actions"></div>
      <div class="browser-card__result" id="vis-result">—</div>
      <div class="browser-card__note" id="vis-note"></div>
    </div>

    <!-- ── 📷 Media ───────────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="media-title"></div>
      <div class="browser-card__actions" id="media-actions"></div>
      <div class="browser-card__result" id="media-result">—</div>
    </div>

    <!-- ── 🧭 Orientation ─────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="orient-title"></div>
      <div class="browser-card__checks" id="orient-checks"></div>
      <div class="browser-card__result" id="orient-result">—</div>
      <div class="browser-card__note" id="orient-note"></div>
    </div>

    <!-- ── 💾 Storage ─────────────────────────────────────────── -->
    <div class="browser-card">
      <div class="browser-card__title" id="storage-title"></div>
      <div class="browser-card__actions" id="storage-actions"></div>
      <div class="browser-card__result" id="storage-result">—</div>
    </div>

  </div>
</div>

<script>

  /* ── Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar ── */
  (function () {
    var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
    var lang = m ? m[1] : 'en';
    if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
  })();
  var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.Browser'] && MTS.getLocale()['MTS.Browser'].demo) || {};

  /* ── Textos estáticos desde locale ─────────────────────────── */
  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  setText('demo-subtitle',  D.subtitle      || 'Universal browser API utility. Try each module right on this page.');
  setText('guard-title',    D.guardTitle    || '🛡️ Guard — Page protection');
  setText('guard-note',     D.guardNote     || 'Creates friction for the casual user. F12 and Ctrl+U cannot be blocked.');
  setText('location-title', D.locationTitle || '📍 Location — Geolocation');
  setText('notif-title',    D.notifTitle    || '🔔 Notifications');
  setText('clip-title',     D.clipTitle     || '📋 Clipboard');
  setText('fs-title',       D.fsTitle       || '🖥️ Fullscreen');
  setText('wl-title',       D.wlTitle       || '💡 Wake Lock — Keep screen awake');
  setText('wl-note',        D.wlNote        || 'Prevents the screen from turning off. Useful for long forms or monitoring dashboards.');
  setText('net-title',      D.netTitle      || '🌐 Network — Network status');
  setText('bat-title',      D.batTitle      || '🔋 Battery — Battery status');
  setText('vib-title',      D.vibTitle      || '📳 Vibration');
  setText('vib-note',       D.vibNote       || 'Only available on mobile devices.');
  setText('share-title',    D.shareTitle    || '📤 Share — Native share');
  setText('vis-title',      D.visTitle      || '👁️ Visibility — Tab visibility');
  setText('vis-note',       D.visNote       || 'Switch tabs and come back to see the event.');
  setText('media-title',    D.mediaTitle    || '📷 Media — Camera · Microphone · Screen');
  setText('orient-title',   D.orientTitle   || '🧭 Orientation — Device orientation');
  setText('orient-note',    D.orientNote    || 'Only available on mobile devices.');
  setText('storage-title',  D.storageTitle  || '💾 Storage — localStorage / sessionStorage');

  /* ── Helpers ───────────────────────────────────────────────── */
  function btn(container, label, variant, onClick) {
    var el = document.createElement('button');
    el.type = 'button';
    new MTS.Button(el, { label: label, variant: variant || 'secondary', size: 'sm' });
    el.addEventListener('click', onClick);
    document.getElementById(container).appendChild(el);
    return el;
  }

  function chk(container, label, checked, onChange) {
    var wrap = document.createElement('div');
    document.getElementById(container).appendChild(wrap);
    return new MTS.Checkbox(wrap, { label: label, checked: checked, onChange: onChange });
  }

  function result(id, text, state) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className   = 'browser-card__result' + (state ? ' is-' + state : '');
  }

  function fmt(obj) { return JSON.stringify(obj, null, 2); }

  /* ── 🛡️ Guard ──────────────────────────────────────────────── */
  chk('guard-checks', D.guardContextMenu || 'Block right-click (contextMenu)', false, function (e) { MTS.Browser.guard.contextMenu(e.detail.checked); });
  chk('guard-checks', D.guardTextSelect  || 'Block text selection (textSelect)', false, function (e) { MTS.Browser.guard.textSelect(e.detail.checked); });
  chk('guard-checks', D.guardDragImages  || 'Block image dragging (dragImages)', false, function (e) { MTS.Browser.guard.dragImages(e.detail.checked); });
  chk('guard-checks', D.guardCopy        || 'Block Ctrl+C (copy)',  false, function (e) { MTS.Browser.guard.copy(e.detail.checked); });
  chk('guard-checks', D.guardPrint       || 'Block Ctrl+P (print)', false, function (e) { MTS.Browser.guard.print(e.detail.checked); });
  chk('guard-checks', D.guardSave        || 'Block Ctrl+S (save)',  false, function (e) { MTS.Browser.guard.save(e.detail.checked); });

  /* ── 📍 Location ────────────────────────────────────────────── */
  btn('location-actions', D.locationGet || 'Get position', 'secondary', async function () {
    result('location-result', D.locationRequesting || 'Requesting...', null);
    try {
      var pos = await MTS.Browser.location.get({ highAccuracy: true });
      result('location-result', fmt(pos), 'ok');
    } catch (err) {
      result('location-result', err.message, 'error');
    }
  });

  /* ── 🔔 Notifications ───────────────────────────────────────── */
  (function () {
    function update() { result('notif-result', (D.notifCurrentPermission || 'Current permission: ') + MTS.Browser.notifications.getPermission()); }
    update();

    btn('notif-actions', D.notifRequest || 'Request permission', 'secondary', async function () {
      try {
        var p = await MTS.Browser.notifications.requestPermission();
        result('notif-result', (D.notifPermission || 'Permission: ') + p, p === 'granted' ? 'ok' : 'error');
      } catch (err) {
        result('notif-result', err.message, 'error');
      }
    });

    btn('notif-actions', D.notifSend || 'Send notification', 'secondary', async function () {
      try {
        await MTS.Browser.notifications.send('MTS.Browser', {
          body: D.notifBody || 'Test notification from the demo!',
          icon: '../../icons/favicon.ico'
        });
        result('notif-result', D.notifSent || 'Notification sent', 'ok');
      } catch (err) {
        result('notif-result', err.message, 'error');
      }
    });
  })();

  /* ── 📋 Clipboard ───────────────────────────────────────────── */
  btn('clip-actions', D.clipCopy || 'Copy text', 'secondary', async function () {
    try {
      await MTS.Browser.clipboard.write(D.clipText || 'Text copied from the MTS.Browser demo 📋');
      result('clip-result', D.clipCopied || '✓ Text copied to clipboard', 'ok');
    } catch (err) {
      result('clip-result', err.message, 'error');
    }
  });

  btn('clip-actions', D.clipRead || 'Read clipboard', 'secondary', async function () {
    try {
      var text = await MTS.Browser.clipboard.read();
      result('clip-result', text, 'ok');
    } catch (err) {
      result('clip-result', err.message, 'error');
    }
  });

  /* ── 🖥️ Fullscreen ──────────────────────────────────────────── */
  (function () {
    function update() { result('fs-result', (D.fsActive || 'Active: ') + MTS.Browser.fullscreen.isActive()); }
    update();
    MTS.Browser.fullscreen.onChange(function (active) { result('fs-result', (D.fsActive || 'Active: ') + active, active ? 'ok' : null); });

    btn('fs-actions', D.fsToggle || 'Toggle fullscreen', 'secondary', async function () {
      try { await MTS.Browser.fullscreen.toggle(); }
      catch (err) { result('fs-result', err.message, 'error'); }
    });
  })();

  /* ── 💡 Wake Lock ───────────────────────────────────────────── */
  (function () {
    function update() { result('wl-result', (D.wlActive || 'Active: ') + MTS.Browser.wakeLock.isActive()); }
    update();

    btn('wl-actions', D.wlEnable || 'Enable', 'secondary', async function () {
      try {
        await MTS.Browser.wakeLock.enable();
        result('wl-result', D.wlEnabled || 'Wake Lock active — the screen will not turn off', 'ok');
      } catch (err) { result('wl-result', err.message, 'error'); }
    });

    btn('wl-actions', D.wlDisable || 'Disable', 'secondary', async function () {
      try {
        await MTS.Browser.wakeLock.disable();
        result('wl-result', D.wlReleased || 'Wake Lock released', null);
      } catch (err) { result('wl-result', err.message, 'error'); }
    });
  })();

  /* ── 🌐 Network ─────────────────────────────────────────────── */
  (function () {
    function update() {
      var conn = MTS.Browser.network.getConnection();
      result('net-result', fmt({ online: MTS.Browser.network.isOnline(), connection: conn }));
    }
    update();

    MTS.Browser.network.onChange(function (online) {
      result('net-result', (D.netOnline || 'Online: ') + online, online ? 'ok' : 'error');
    });

    btn('net-actions', D.netRefresh || 'Refresh', 'secondary', update);
  })();

  /* ── 🔋 Battery ─────────────────────────────────────────────── */
  btn('bat-actions', D.batRead || 'Read battery', 'secondary', async function () {
    try {
      var info = await MTS.Browser.battery.get();
      result('bat-result', fmt(info), 'ok');
    } catch (err) { result('bat-result', err.message, 'error'); }
  });

  /* ── 📳 Vibration ───────────────────────────────────────────── */
  btn('vib-actions', D.vibVibrate || 'Vibrate 200ms', 'secondary', function () {
    try {
      MTS.Browser.vibration.vibrate(200);
      result('vib-result', D.vibSent || 'Vibration sent', 'ok');
    } catch (err) { result('vib-result', err.message, 'error'); }
  });

  btn('vib-actions', D.vibPattern || 'Pattern', 'secondary', function () {
    try {
      MTS.Browser.vibration.vibrate([200, 100, 200, 100, 400]);
      result('vib-result', D.vibPatternSent || 'Pattern [200, 100, 200, 100, 400] sent', 'ok');
    } catch (err) { result('vib-result', err.message, 'error'); }
  });

  btn('vib-actions', D.vibStop || 'Stop', 'secondary', function () {
    MTS.Browser.vibration.stop();
    result('vib-result', D.vibStopped || 'Vibration stopped');
  });

  /* ── 📤 Share ───────────────────────────────────────────────── */
  (function () {
    var supported = MTS.Browser.share.isSupported();
    result('share-result', supported ? (D.shareSupported || 'Web Share API available') : (D.shareUnsupported || 'Not available on this browser/device'), supported ? 'ok' : 'error');

    btn('share-actions', D.shareButton || 'Share this page', 'secondary', async function () {
      try {
        await MTS.Browser.share.share({
          title: 'MTS.Browser Demo',
          text:  D.shareText || 'Universal browser API utility',
          url:   window.location.href
        });
        result('share-result', D.shareShared || 'Shared', 'ok');
      } catch (err) {
        result('share-result', err.name === 'AbortError' ? (D.shareCanceled || 'Canceled by the user') : err.message, 'error');
      }
    });
  })();

  /* ── 👁️ Visibility ──────────────────────────────────────────── */
  (function () {
    var changes = 0;
    function update() { result('vis-result', (D.visVisiblePrefix || 'visible: ') + MTS.Browser.visibility.isVisible() + (D.visChangesPrefix || ' | changes: ') + changes); }
    update();

    MTS.Browser.visibility.onChange(function (visible) {
      changes++;
      result('vis-result', (D.visVisiblePrefix || 'visible: ') + visible + (D.visChangesPrefix || ' | changes: ') + changes, visible ? 'ok' : null);
    });

    btn('vis-actions', D.visCurrent || 'Current state', 'secondary', update);
  })();

  /* ── 📷 Media ───────────────────────────────────────────────── */
  (function () {
    var stream = null;

    btn('media-actions', D.mediaCamera || 'Camera', 'secondary', async function () {
      try {
        MTS.Browser.media.stop(stream);
        stream = await MTS.Browser.media.requestCamera();
        result('media-result', (D.mediaCameraActive || 'Camera active — tracks: ') + stream.getTracks().length, 'ok');
      } catch (err) { result('media-result', err.message, 'error'); }
    });

    btn('media-actions', D.mediaMicrophone || 'Microphone', 'secondary', async function () {
      try {
        MTS.Browser.media.stop(stream);
        stream = await MTS.Browser.media.requestMicrophone();
        result('media-result', (D.mediaMicrophoneActive || 'Microphone active — tracks: ') + stream.getTracks().length, 'ok');
      } catch (err) { result('media-result', err.message, 'error'); }
    });

    btn('media-actions', D.mediaScreen || 'Screen', 'secondary', async function () {
      try {
        MTS.Browser.media.stop(stream);
        stream = await MTS.Browser.media.requestScreen();
        result('media-result', (D.mediaScreenActive || 'Screen capture active — tracks: ') + stream.getTracks().length, 'ok');
      } catch (err) { result('media-result', err.message, 'error'); }
    });

    btn('media-actions', D.mediaStop || 'Stop', 'secondary', function () {
      MTS.Browser.media.stop(stream);
      stream = null;
      result('media-result', D.mediaStopped || 'Stream stopped');
    });

    btn('media-actions', D.mediaListDevices || 'List devices', 'secondary', async function () {
      try {
        var devices = await MTS.Browser.media.getDevices();
        result('media-result', fmt({
          cameras:     devices.cameras.map(function (d) { return d.label || d.deviceId; }),
          microphones: devices.microphones.map(function (d) { return d.label || d.deviceId; }),
          speakers:    devices.speakers.map(function (d) { return d.label || d.deviceId; })
        }), 'ok');
      } catch (err) { result('media-result', err.message, 'error'); }
    });
  })();

  /* ── 🧭 Orientation ─────────────────────────────────────────── */
  (function () {
    var stopWatch = null;

    chk('orient-checks', D.orientWatch || 'Watch orientation', false, function (e) {
      if (e.detail.checked) {
        try {
          stopWatch = MTS.Browser.orientation.watch(function (data) {
            result('orient-result', fmt(data));
          });
        } catch (err) { result('orient-result', err.message, 'error'); }
      } else {
        if (stopWatch) { stopWatch(); }
        stopWatch = null;
        result('orient-result', '—');
      }
    });
  })();

  /* ── 💾 Storage ─────────────────────────────────────────────── */
  (function () {
    async function update() {
      var quota = await MTS.Browser.storage.quota();
      result('storage-result', fmt({
        localKeys:   MTS.Browser.storage.local.keys(),
        sessionKeys: MTS.Browser.storage.session.keys(),
        quota: quota
      }));
    }
    update();

    btn('storage-actions', D.storageWriteLocal || 'Write local', 'secondary', function () {
      MTS.Browser.storage.local.set('mts-browser-demo', { ts: Date.now(), value: 'hola' });
      update();
    });

    btn('storage-actions', D.storageReadLocal || 'Read local', 'secondary', function () {
      var val = MTS.Browser.storage.local.get('mts-browser-demo');
      result('storage-result', fmt(val), 'ok');
    });

    btn('storage-actions', D.storageClearLocal || 'Clear local', 'secondary', function () {
      MTS.Browser.storage.local.remove('mts-browser-demo');
      update();
    });

    btn('storage-actions', D.storageQuota || 'View quota', 'secondary', async function () {
      var q = await MTS.Browser.storage.quota();
      result('storage-result', q ? fmt(q) : (D.storageQuotaUnavailable || 'Storage Estimate API not available'), q ? 'ok' : 'error');
    });
  })();

</script>
</body>
</html>
