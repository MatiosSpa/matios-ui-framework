<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.SessionTimeout — Demo</title>

<body>

<div class="demo-page">
  <div class="demo-header">
    <h1><span>MTS</span>.SessionTimeout</h1>
    <p id="demo-subtitle"></p>
  </div>

  <div class="demo-section"><div class="demo-section-title" id="s1-title"></div><div id="tabs-s1"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s2-title"></div><div id="tabs-s2"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s3-title"></div><div id="tabs-s3"></div></div>
  <div class="demo-section"><div class="demo-section-title" id="s4-title"></div><div id="tabs-s4"></div></div>
</div>

<script>
/* ── Standard demo helpers ── */
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0,indent-step); result+=' '.repeat(indent)+t+'\n'; }
    else if(/^<[^!]/.test(t)){
      result+=' '.repeat(indent)+t+'\n';
      var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||'';
      if(!voids.test(tag) && !/\/>$/.test(t)) indent+=step;
    } else { var text=t.replace(/\s+/g,' '); if(text) result+=' '.repeat(indent)+text+'\n'; }
  });
  return result.trimEnd();
}
function makeSection(id, previewHtml, jsCode, initFn, height){
  new MTS.Tabs('#'+id, { variant:'card', height:height||'420px', lazy:false, tabs:[
    { id:id+'-preview', label:'Preview',    content: previewHtml },
    { id:id+'-html',    label:'HTML',       content: '<div id="'+id+'-cb-html"></div>' },
    { id:id+'-js',      label:'JavaScript', content: '<div id="'+id+'-cb-js"></div>'   },
  ]});
  new MTS.CodeBlock('#'+id+'-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#'+id+'-cb-js',   { code: jsCode,                  language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

/* ── Active demo instance (only one bar at a time) ── */
var _demoInstance = null;
function createDemo(options) {
  if (_demoInstance) { _demoInstance.destroy(); }
  _demoInstance = new MTS.SessionTimeout(options);
  return _demoInstance;
}

/* ── Locale: shows English by default (public-facing); ?lang=es|en|pt to switch ── */
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.SessionTimeout'] && MTS.getLocale()['MTS.SessionTimeout'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'Inactivity-based session timeout management. Fixed progress bar pinned to the bottom edge + warning modal with a configurable countdown. Works with any token-renewal strategy.';
document.getElementById('s1-title').textContent = D.s1Title || '1 — Basic';
document.getElementById('s2-title').textContent = D.s2Title || '2 — Custom messages';
document.getElementById('s3-title').textContent = D.s3Title || '3 — Bar only (no warning modal)';
document.getElementById('s4-title').textContent = D.s4Title || '4 — Real usage with onRefresh / onExpire';

/* ══════════════════════════════════════════════════════════════
   1 — Basic
══════════════════════════════════════════════════════════════ */
var preview1 =
  '<div class="demo-stack" style="max-width:340px;">' +
    '<div id="s1-btn"></div>' +
    '<p style="margin:8px 0 0;font-size:13px;color:var(--mts-text-muted);">' + (D.p1Hint || 'The session bar appears at the bottom edge of the page.') + '</p>' +
  '</div>';

var js1 =
  "const session = new MTS.SessionTimeout({\n" +
  "  timeoutMinutes: 30,\n" +
  "  warningMinutes: 5,\n" +
  "  onRefresh: function(done) {\n" +
  "    done();\n" +
  "  },\n" +
  "  onExpire: function() {\n" +
  "    logout();\n" +
  "  },\n" +
  "});\n\n" +
  "session.showWarning();";

makeSection('tabs-s1', preview1, js1, function() {
  var session = createDemo({
    timeoutMinutes: 30,
    warningMinutes: 5,
    onRefresh: function(done) { done(); },
    onExpire:  function() { MTS.Toast.show({ message: D.toastExpired || 'Session expired.', variant: 'warning', duration: 4000 }); },
  });
  new MTS.Button('#s1-btn', {
    label: D.p1BtnLabel || 'Simulate session warning',
    variant: 'primary',
    onClick: function() { session.showWarning(); },
  });
}, '220px');

/* ══════════════════════════════════════════════════════════════
   2 — Custom messages
══════════════════════════════════════════════════════════════ */
var preview2 =
  '<div class="demo-stack" style="max-width:340px;">' +
    '<div id="s2-btn"></div>' +
  '</div>';

var js2 =
  "new MTS.SessionTimeout({\n" +
  "  timeoutMinutes: 30,\n" +
  "  warningMinutes: 5,\n" +
  "  messages: {\n" +
  "    title:      'Attention',\n" +
  "    body:       'Your session will expire in {time}. Are you still here?',\n" +
  "    warning:    'Save your work before the session closes.',\n" +
  "    btnRefresh: 'I\\'m still working',\n" +
  "    btnExpire:  'Leave now',\n" +
  "  },\n" +
  "  onRefresh: function(done) { done(); },\n" +
  "  onExpire:  function()     { logout(); },\n" +
  "});";

makeSection('tabs-s2', preview2, js2, function() {
  new MTS.Button('#s2-btn', {
    label: D.p2BtnLabel || 'Simulate custom warning',
    variant: 'primary',
    onClick: function() {
      if (_demoInstance) { _demoInstance.destroy(); }
      _demoInstance = new MTS.SessionTimeout({
        timeoutMinutes: 30,
        warningMinutes: 5,
        titleIcon: 'alert-triangle',
        titleText: D.p2Title || 'Attention',
        messages: {
          body:       D.p2Body       || 'Your session will expire in {time}. Are you still here?',
          warning:    D.p2Warning    || 'Save your work before the session closes.',
          btnRefresh: D.p2BtnRefresh || 'I\'m still working',
          btnExpire:  D.p2BtnExpire  || 'Leave now',
        },
        onRefresh: function(done) { done(); },
        onExpire:  function()     { MTS.Toast.show({ message: D.toastExpired || 'Session expired.', variant: 'warning', duration: 4000 }); },
      });
      _demoInstance.showWarning();
    },
  });
}, '200px');

/* ══════════════════════════════════════════════════════════════
   3 — Bar only (no warning modal)
══════════════════════════════════════════════════════════════ */
var preview3 =
  '<div class="demo-stack" style="max-width:340px;">' +
    '<div id="s3-btn"></div>' +
    '<p style="margin:8px 0 0;font-size:13px;color:var(--mts-text-muted);">' + (D.p3HintPrefix || 'With ') + '<code>warningMinutes: 0</code>' + (D.p3HintSuffix || ' the bar runs out silently without opening the modal.') + '</p>' +
  '</div>';

var js3 =
  "new MTS.SessionTimeout({\n" +
  "  timeoutMinutes: 30,\n" +
  "  warningMinutes: 0,\n" +
  "  onExpire: function() { logout(); },\n" +
  "});";

makeSection('tabs-s3', preview3, js3, function() {
  new MTS.Button('#s3-btn', {
    label: D.p3BtnLabel || 'Activate (bar only)',
    variant: 'secondary',
    onClick: function() {
      createDemo({
        timeoutMinutes: 30,
        warningMinutes: 0,
        onExpire: function() { MTS.Toast.show({ message: D.toastExpired || 'Session expired.', variant: 'warning', duration: 4000 }); },
      });
    },
  });
}, '200px');

/* ══════════════════════════════════════════════════════════════
   4 — Real usage with onRefresh / onExpire
══════════════════════════════════════════════════════════════ */
var preview4 =
  '<div class="demo-stack" style="max-width:340px;">' +
    '<p style="margin:0;font-size:13px;color:var(--mts-text-muted);">' +
      (D.p4Hint1 || 'Full pattern for production. ') + '<code>onRefresh</code>' +
      (D.p4Hint2 || ' performs the fetch to the API and calls ') + '<code>done()</code>' +
      (D.p4Hint3 || ' when done. If it fails, it does not call ') + '<code>done()</code>' +
      (D.p4Hint4 || ' — the timer keeps running.') +
    '</p>' +
  '</div>';

var js4 =
  "const session = new MTS.SessionTimeout({\n" +
  "  timeoutMinutes: 30,\n" +
  "  warningMinutes: 5,\n" +
  "  messages: {\n" +
  "    title:      'Your session is about to expire',\n" +
  "    body:       'Due to inactivity, your session will close in {time}.',\n" +
  "    warning:    'If you have unsaved work, you could lose it.',\n" +
  "    btnRefresh: 'Renew session',\n" +
  "    btnExpire:  'Sign out',\n" +
  "  },\n" +
  "  onRefresh: function(done) {\n" +
  "    fetch('/api/auth/refresh', { method: 'POST' })\n" +
  "      .then(function(res) {\n" +
  "        if (res.ok) {\n" +
  "          done();\n" +
  "        } else {\n" +
  "          logout();\n" +
  "        }\n" +
  "      })\n" +
  "      .catch(function() { logout(); });\n" +
  "  },\n" +
  "  onExpire: function() {\n" +
  "    logout();\n" +
  "  },\n" +
  "});\n\n" +
  "document.addEventListener('click', function() { session.reset(); });";

makeSection('tabs-s4', preview4, js4, null, '380px');
</script>

</body>
