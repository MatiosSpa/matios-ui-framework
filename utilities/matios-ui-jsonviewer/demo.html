  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

<body>
  
  <div class="demo-page">
    <div class="demo-header">
      <h1><span>MTS</span>.JsonViewer</h1>
      <p id="demo-subtitle"></p>
      <div class="demo-header-actions">
      </div>
      <div class="demo-docs-panel" id="docs-panel"></div>
    </div>

    <section class="demo-section">
      <div class="demo-section-title" id="s1-title"></div>
      <div class="mts-grid mts-grid--gap-md">
        <div class="mts-g-col-12 mts-g-col-lg-4"><div id="tabs-inline"></div></div>
        <div class="mts-g-col-12 mts-g-col-lg-4"><div id="tabs-payload"></div></div>
        <div class="mts-g-col-12 mts-g-col-lg-4"><div id="tabs-invalid"></div></div>
      </div>
    </section>
  </div>

  <script>
    // — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
    (function () {
      var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
      var lang = m ? m[1] : 'en';
      if (window.MTS) { if (typeof MTS.setLanguage === 'function') MTS.setLanguage(lang); else MTS._locale = lang; }
    })();
    var D = (window.MTS && MTS.getString && MTS.getString()['MTS.JsonViewer'].demo) || {};

    document.getElementById('demo-subtitle').textContent = D.subtitle || 'Utility to view JSON payloads, responses and configurations with formatting, folding and copy inside demos, support and tooling.';
    document.getElementById('s1-title').textContent      = D.s1Title || '1 - Paste / payload / invalid raw';

    var inlineTitle       = D.inlineTitle       || 'Paste and format';
    var inlineSubtitle    = D.inlineSubtitle    || 'Paste single-line JSON and format it inside the component';
    var inlinePlaceholder = D.inlinePlaceholder || 'Paste your JSON here and press Format';
    var payloadTitle      = D.payloadTitle      || 'Request payload';
    var payloadSubtitle   = D.payloadSubtitle   || 'POST /api/workflows';
    var invalidTitle      = D.invalidTitle      || 'Fallback raw';
    var invalidSubtitle   = D.invalidSubtitle   || 'Invalid JSON with parse message';

    function createPreviewPanel(id) {
      var panel = document.createElement('div');
      panel.className = 'mts-p-2';

      var host = document.createElement('div');
      host.id = 'preview-' + id;
      panel.appendChild(host);

      return { panel: panel, hostId: '#' + host.id };
    }

    function createCodePanel(title, language, code) {
      var panel = document.createElement('div');
      panel.className = 'mts-p-2 mts-h-full';

      var host = document.createElement('div');
      host.className = 'mts-h-full';
      panel.appendChild(host);

      new MTS.CodeBlock(host, {
        title: title,
        language: language,
        code: code,
        copyable: true,
        height: '100%'
      });

      return panel;
    }

    function buildExample(example) {
      var preview = createPreviewPanel(example.id);
      var htmlCode = '<div id="preview-' + example.id + '"></div>';

      var tabs = [
        { id: example.id + '-preview', label: 'Preview', content: preview.panel },
        { id: example.id + '-html', label: 'HTML', content: createCodePanel('HTML', 'html', htmlCode) },
        { id: example.id + '-js', label: 'JavaScript', content: createCodePanel('JavaScript', 'javascript', example.jsCode) }
      ];

      new MTS.Tabs('#tabs-' + example.id, {
        variant: 'card',
        height: example.height || '420px',
        lazy: false,
        tabs: tabs
      });

      new MTS.JsonViewer(preview.hostId, example.previewOptions);
    }

    var examples = [
      {
        id: 'inline',
        previewOptions: {
          title: inlineTitle,
          subtitle: inlineSubtitle,
          data: '{"user":{"id":14,"name":"Matias"},"active":true,"roles":["admin","billing"]}',
          editable: true,
          placeholder: inlinePlaceholder,
          copyable: true,
          height: '400px'
        },
        jsCode:
`new MTS.JsonViewer('#preview-inline', {
  title: '` + inlineTitle + `',
  subtitle: '` + inlineSubtitle + `',
  data: '{"user":{"id":14,"name":"Matias"},"active":true,"roles":["admin","billing"]}',
  editable: true,
  placeholder: '` + inlinePlaceholder + `',
  copyable: true,
  height: '400px'
});`
      },
      {
        id: 'payload',
        previewOptions: {
          title: payloadTitle,
          subtitle: payloadSubtitle,
          data: {
            workflowId: 'WF-104',
            owner: {
              id: 'usr_92',
              name: 'Matias Gutierrez',
              groups: ['security', 'owners']
            },
            stages: [
              { name: 'Requester review', approvers: ['usr_11'], required: 'all' },
              { name: 'Security review', approvers: ['grp_security'], required: 'any' },
              { name: 'Billing validation', approvers: ['usr_41', 'usr_52'], required: 'majority' }
            ],
            flags: {
              temporaryAccess: true,
              expiresAt: '2026-04-30T20:00:00Z'
            }
          },
          collapsedDepth: 1,
          copyable: true,
          height: '400px'
        },
        jsCode:
`new MTS.JsonViewer('#preview-payload', {
  title: '` + payloadTitle + `',
  subtitle: '` + payloadSubtitle + `',
  data: {
    workflowId: 'WF-104',
    owner: {
      id: 'usr_92',
      name: 'Matias Gutierrez',
      groups: ['security', 'owners']
    },
    stages: [
      { name: 'Requester review', approvers: ['usr_11'], required: 'all' },
      { name: 'Security review', approvers: ['grp_security'], required: 'any' },
      { name: 'Billing validation', approvers: ['usr_41', 'usr_52'], required: 'majority' }
    ],
    flags: {
      temporaryAccess: true,
      expiresAt: '2026-04-30T20:00:00Z'
    }
  },
  collapsedDepth: 1,
  copyable: true
});`
      },
      {
        id: 'invalid',
        previewOptions: {
          title: invalidTitle,
          subtitle: invalidSubtitle,
          data: '{"name":"Role builder","active":true,"stages":[{"id":1},{"id":2},]}',
          copyable: true,
          height: '400px'
        },
        jsCode:
`new MTS.JsonViewer('#preview-invalid', {
  title: '` + invalidTitle + `',
  subtitle: '` + invalidSubtitle + `',
  data: '{"name":"Role builder","active":true,"stages":[{"id":1},{"id":2},]}',
  copyable: true
});`
      }
    ];

    examples.forEach(buildExample);
  </script>
</body>
