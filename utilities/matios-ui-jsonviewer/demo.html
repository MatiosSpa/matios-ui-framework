<!DOCTYPE html>
<html lang="es" data-mts-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.JsonViewer - Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../base/matios-ui-base.css">
  <link rel="stylesheet" href="../../base/matios-ui-grid.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-dark.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-light.css">
  <link rel="stylesheet" href="../../themes/matios-ui-mode-high-contrast.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-violet.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-olive.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-blue.css">
  <link rel="stylesheet" href="../../themes/matios-ui-accent-high-contrast.css">
  <link rel="stylesheet" href="../../icons/matios-ui-icons.css">
  <link rel="stylesheet" href="../../support/demo-shared.css">
  <link rel="stylesheet" href="../../forms/matios-ui-button/matios-ui-button.css">
  <link rel="stylesheet" href="../../forms/matios-ui-copybutton/matios-ui-copybutton.css">
  <link rel="stylesheet" href="../../navigation/matios-ui-tabs/matios-ui-tabs.css">
  <link rel="stylesheet" href="../matios-ui-codeblock/matios-ui-codeblock.css">
  <link rel="stylesheet" href="./matios-ui-jsonviewer.css">
  <script src="../../icons/matios-ui-icons.js"></script>
  <script src="../../support/demo-shared.js"></script>
  <script src="../../forms/matios-ui-button/matios-ui-button.js"></script>
  <script src="../../forms/matios-ui-copybutton/matios-ui-copybutton.js"></script>
  <script src="../../navigation/matios-ui-tabs/matios-ui-tabs.js"></script>
  <script src="../matios-ui-codeblock/matios-ui-codeblock.js"></script>
  <script src="./matios-ui-jsonviewer.js"></script>
</head>
<body>
  <div class="demo-theme">
    <button class="demo-btn-sm" onclick="setMode('dark')">Dark</button>
    <button class="demo-btn-sm" onclick="setMode('light')">Light</button>
    <button class="demo-btn-sm" onclick="setMode('high-contrast')">HC</button>
    <button class="demo-btn-sm demo-btn-sep">-</button>
    <button class="demo-btn-sm" onclick="setAccent('violet')">Violet</button>
    <button class="demo-btn-sm" onclick="setAccent('olive')">Olive</button>
    <button class="demo-btn-sm" onclick="setAccent('blue')">Blue</button>
    <button class="demo-btn-sm" onclick="setAccent(null)">Default</button>
  </div>

  <div class="demo-page">
    <div class="demo-header">
      <h1><span>MTS</span>.JsonViewer</h1>
      <p>Utility para ver payloads JSON, responses y configuraciones con formato, plegado y copia dentro de demos, soporte y tooling.</p>
      <div class="demo-header-actions">
        <button class="demo-docs-btn" onclick="toggleDocs('docs-panel','./matios-ui-jsonviewer.md')">Docs</button>
      </div>
      <div class="demo-docs-panel" id="docs-panel"></div>
    </div>

    <section class="demo-section">
      <div class="demo-section-title">1 - Paste / payload / raw invalido</div>
      <div class="mts-grid mts-grid--gap-md">
        <div class="mts-g-col-12 mts-g-col-lg-4"><div id="tabs-inline"></div></div>
        <div class="mts-g-col-12 mts-g-col-lg-4"><div id="tabs-payload"></div></div>
        <div class="mts-g-col-12 mts-g-col-lg-4"><div id="tabs-invalid"></div></div>
      </div>
    </section>
  </div>

  <script>
    function createPreviewPanel(id) {
      var panel = document.createElement('div');
      panel.className = 'mts-p-2';

      var host = document.createElement('div');
      host.id = 'preview-' + id;
      panel.appendChild(host);

      return { panel: panel, hostId: '#' + host.id };
    }

    function createCodePanel(title, language, code) {
      var panel = document.createElement('div');
      panel.className = 'mts-p-2 mts-h-full';

      var host = document.createElement('div');
      host.className = 'mts-h-full';
      panel.appendChild(host);

      new MTS.CodeBlock(host, {
        title: title,
        language: language,
        code: code,
        copyable: true,
        height: '100%'
      });

      return panel;
    }

    function buildExample(example) {
      var preview = createPreviewPanel(example.id);
      var htmlCode = '<div id="preview-' + example.id + '"></div>';

      var tabs = [
        { id: example.id + '-preview', label: 'Preview', content: preview.panel },
        { id: example.id + '-html', label: 'HTML', content: createCodePanel('HTML', 'html', htmlCode) },
        { id: example.id + '-js', label: 'JavaScript', content: createCodePanel('JavaScript', 'javascript', example.jsCode) }
      ];

      new MTS.Tabs('#tabs-' + example.id, {
        variant: 'card',
        height: example.height || '420px',
        lazy: false,
        tabs: tabs
      });

      new MTS.JsonViewer(preview.hostId, example.previewOptions);
    }

    var examples = [
      {
        id: 'inline',
        previewOptions: {
          title: 'Paste and format',
          subtitle: 'Pega JSON en una linea y formatealo dentro del componente',
          data: '{"user":{"id":14,"name":"Matias"},"active":true,"roles":["admin","billing"]}',
          editable: true,
          placeholder: 'Pega aqui tu JSON y presiona Format',
          copyable: true,
          height: '400px'
        },
        jsCode:
`new MTS.JsonViewer('#preview-inline', {
  title: 'Paste and format',
  subtitle: 'Pega JSON en una linea y formatealo dentro del componente',
  data: '{"user":{"id":14,"name":"Matias"},"active":true,"roles":["admin","billing"]}',
  editable: true,
  placeholder: 'Pega aqui tu JSON y presiona Format',
  copyable: true,
  height: '400px'
});`
      },
      {
        id: 'payload',
        previewOptions: {
          title: 'Request payload',
          subtitle: 'POST /api/workflows',
          data: {
            workflowId: 'WF-104',
            owner: {
              id: 'usr_92',
              name: 'Matias Gutierrez',
              groups: ['security', 'owners']
            },
            stages: [
              { name: 'Requester review', approvers: ['usr_11'], required: 'all' },
              { name: 'Security review', approvers: ['grp_security'], required: 'any' },
              { name: 'Billing validation', approvers: ['usr_41', 'usr_52'], required: 'majority' }
            ],
            flags: {
              temporaryAccess: true,
              expiresAt: '2026-04-30T20:00:00Z'
            }
          },
          collapsedDepth: 1,
          copyable: true,
          height: '400px'
        },
        jsCode:
`new MTS.JsonViewer('#preview-payload', {
  title: 'Request payload',
  subtitle: 'POST /api/workflows',
  data: {
    workflowId: 'WF-104',
    owner: {
      id: 'usr_92',
      name: 'Matias Gutierrez',
      groups: ['security', 'owners']
    },
    stages: [
      { name: 'Requester review', approvers: ['usr_11'], required: 'all' },
      { name: 'Security review', approvers: ['grp_security'], required: 'any' },
      { name: 'Billing validation', approvers: ['usr_41', 'usr_52'], required: 'majority' }
    ],
    flags: {
      temporaryAccess: true,
      expiresAt: '2026-04-30T20:00:00Z'
    }
  },
  collapsedDepth: 1,
  copyable: true
});`
      },
      {
        id: 'invalid',
        previewOptions: {
          title: 'Fallback raw',
          subtitle: 'JSON invalido con mensaje de parseo',
          data: '{"name":"Role builder","active":true,"stages":[{"id":1},{"id":2},]}',
          copyable: true,
          height: '400px'
        },
        jsCode:
`new MTS.JsonViewer('#preview-invalid', {
  title: 'Fallback raw',
  subtitle: 'JSON invalido con mensaje de parseo',
  data: '{"name":"Role builder","active":true,"stages":[{"id":1},{"id":2},]}',
  copyable: true
});`
      }
    ];

    examples.forEach(buildExample);
  </script>
</body>
</html>
