          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);

    })();

<script>
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function indentHtml(html) {
  var indent = 0;
  var step = 2;
  var voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result = '';
  var tokens = html.match(/<[^>]+>|[^<]+/g) || [];
  tokens.forEach(function(tok) {
    var t = tok.trim();
    if (!t) return;
    if (/^<\//.test(t)) {
      indent = Math.max(0, indent - step);
      result += ' '.repeat(indent) + t + '\n';
    } else if (/^<[^!]/.test(t)) {
      result += ' '.repeat(indent) + t + '\n';
      var tag = (t.match(/^<([a-z][a-z0-9-]*)/i) || [])[1] || '';
      if (!voids.test(tag) && !/\/>$/.test(t)) indent += step;
    } else {
      var text = t.replace(/\s+/g, ' ');
      if (text) result += ' '.repeat(indent) + text + '\n';
    }
  });
  return result.trimEnd();
}

function htmlTab(previewHtml) {
  return '<pre class="demo-code" style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(indentHtml(previewHtml)) +
  '</pre>';
}

function jsTab(code) {
  return '<pre class="demo-code" style="display:block;height:100%;box-sizing:border-box;white-space:pre;overflow:auto;margin:0">' +
    esc(code) +
  '</pre>';
}

function makeSection(id, previewHtml, jsCode, initFn, height) {
  new MTS.Tabs('#' + id, {
    variant: 'card',
    height: height || '320px',
    lazy: false,
    tabs: [
      { id: id + '-preview', label: 'Preview', content: previewHtml },
      { id: id + '-html', label: 'HTML', content: htmlTab(previewHtml) },
      { id: id + '-js', label: 'JavaScript', content: jsTab(jsCode) }
    ]
  });

  if (typeof initFn === 'function') initFn();
}

function setResult(id, payload, ok) {
  var el = document.getElementById(id);
  if (!el) return;
  if (typeof payload === 'string') {
    el.textContent = payload;
  } else {
    el.textContent = JSON.stringify(payload, null, 2);
  }
  el.style.color = ok === true ? 'var(--mts-color-success)' : (ok === false ? 'var(--mts-color-danger)' : '');
}

    preview: true,
  });
  document.getElementById('btn-upload').addEventListener('click', async function(){
    const files = fuUpload.instance.getFiles();
    if (!files.length) {
      setResult('res-upload', D.selectFileFirst || 'Select a file first', false);
      return;
    }
    setResult('res-upload', D.uploadProgress || 'Uploading... 0%');
    const res = await http.upload('/upload', files[0], {
      fieldName: 'archivo',
      onProgress: function(pct){ setResult('res-upload', (D.uploading || 'Uploading... ') + pct + '%'); }
    });
    setResult('res-upload', res, res.success);
    if (res.success) MTS.Toast?.show({ message: D.uploadSuccess || 'File uploaded successfully', variant: 'success', duration: 3000 });
  });
}, '420px');

makeSection('tabs-s8', preview_s8, js_s8, function(){

    iconLeft: MTS.Icon.get('download')
  });

    setResult('res-download', D.downloading || 'Downloading...');
    const res = await http.download('/download', 'export.json');
    if (res.success) {
      const a = document.createElement('a');
      a.href = res.data.url;
      a.download = res.data.filename;
      a.click();
      URL.revokeObjectURL(res.data.url);
      setResult('res-download', (D.downloadStarted || '✓ Download started — ') + res.data.filename, true);
    } else {
      setResult('res-download', res, false);
    }
  });
});
