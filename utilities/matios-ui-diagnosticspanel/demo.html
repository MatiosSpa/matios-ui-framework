<!DOCTYPE html>
<html lang="en" data-mts-mode="dark">
<head>
  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTS.DiagnosticsPanel - Demo</title>

<body>
  
  <div class="demo-page">
    <div class="demo-header">
      <h1><span>MTS</span>.DiagnosticsPanel</h1>
      <p id="demo-subtitle"></p>
      <div class="demo-header-actions">
      </div>
      <div class="demo-docs-panel" id="docs-panel"></div>
    </div>

    <div id="diagnostics-tabs"></div>
  </div>

  <script>
    // — Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar —
    (function () {
      var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
      var lang = m ? m[1] : 'en';
      if (window.MTS) { if (typeof MTS.setLocale === 'function') MTS.setLocale(lang); else MTS._locale = lang; }
    })();
    var D = (window.MTS && MTS.getLocale && MTS.getLocale()['MTS.DiagnosticsPanel'].demo) || {};

    document.getElementById('demo-subtitle').textContent = D.subtitle || 'Bottom docked console for logs, requests, errors, session and diagnostics export inside a real app.';

    var htmlUsageSnippet =
      "<!-- Host real del ejemplo -->\n" +
      "<div id=\"calendario\"></div>\n\n" +
      "<!-- Styles que usa el ejemplo integrado -->\n" +
      "<link rel=\"stylesheet\" href=\"../../../../base/matios-ui-base.css\">\n" +
      "<link rel=\"stylesheet\" href=\"../../../../navigation/matios-ui-drawer/matios-ui-drawer.css\">\n" +
      "<link rel=\"stylesheet\" href=\"../../../../widgets/calendar/matios-ui-calendar.css\">\n" +
      "<link rel=\"stylesheet\" href=\"../../../../widgets/calendar/matios-ui-calendar-colors.css\">\n" +
      "<link rel=\"stylesheet\" href=\"../../matios-ui-jsonviewer.css\">\n" +
      "<link rel=\"stylesheet\" href=\"../../matios-ui-diagnosticspanel.css\">\n\n" +
      "<!-- Scripts reales del ejemplo -->\n" +
      "<script src=\"../../../../navigation/matios-ui-drawer/matios-ui-drawer.js\"><\\/script>\n" +
      "<script src=\"../../../../widgets/calendar/matios-ui-calendar.js\"><\\/script>\n" +
      "<script src=\"../../matios-ui-jsonviewer.js\"><\\/script>\n" +
      "<script src=\"../../matios-ui-diagnosticspanel.js\"><\\/script>\n" +
      "<script src=\"./diagnostics-bootstrap.js\"><\\/script>\n" +
      "<script src=\"./app.js\"><\\/script>";

    var jsUsageSnippet =
      "// diagnostics-bootstrap.js\n" +
      "// Reescribe requests al mock local e instala la consola integrada.\n" +
      "var apiPrefix = new URL('./mock-api/', window.location.href);\n" +
      "var localApiPath = apiPrefix.pathname.replace(/\\/$/, '');\n\n" +
      "if ('serviceWorker' in navigator) {\n" +
      "  navigator.serviceWorker.register('./sw-calendar.js', { scope: './' });\n" +
      "}\n\n" +
      "// Intercepta fetch para redirigir el calendario al mock del ejemplo.\n" +
      "var originalFetch = window.fetch.bind(window);\n" +
      "window.fetch = function (input, init) {\n" +
      "  // ...rewriteUrl(...)\n" +
      "  return originalFetch(input, init);\n" +
      "};\n\n" +
      "// Monta MTS.DiagnosticsPanel como lo usa realmente el ejemplo.\n" +
      "var diagnostics = new MTS.DiagnosticsPanel(document.body, {\n" +
      "  title: 'DiagnosticsPanel',\n" +
      "  appName: 'Calendar V2 preview',\n" +
      "  collapsed: true,\n" +
      "  height: '360px',\n" +
      "  showLogViewer: true,\n" +
      "  showRequestInspector: true,\n" +
      "  showErrorViewer: true,\n" +
      "  showSessionInfo: true,\n" +
      "  showExport: true,\n" +
      "  showJsonViewer: true,\n" +
      "  captureConsole: true,\n" +
      "  captureWindowErrors: true,\n" +
      "  captureFetch: true,\n" +
      "  maxEntries: 160\n" +
      "});\n\n" +
      "diagnostics.setSessionInfo({\n" +
      "  user: 'demo@matios.dev',\n" +
      "  screen: 'calendar-app',\n" +
      "  mockApi: localApiPath,\n" +
      "  lang: document.documentElement.lang || 'es'\n" +
      "});\n\n" +
      "// Expone un bridge compatible con el demo del calendario.\n" +
      "window.devPanel = {\n" +
      "  log: function (type, msg, detail) {\n" +
      "    diagnostics.log(type, msg, detail);\n" +
      "  },\n" +
      "  clearLog: function () {\n" +
      "    diagnostics.clear('logs');\n" +
      "  }\n" +
      "};\n\n" +
      "window.addEventListener('load', function () {\n" +
      "  diagnostics.log('info', 'Calendar V2 diagnostics ready', localApiPath);\n" +
      "});\n\n" +
      "// app.js\n" +
      "// Despues de eso, el ejemplo monta el calendario en #calendario\n" +
      "// y toda su actividad empieza a alimentar el DiagnosticsPanel.";

    function createPreviewPanel() {
      var panel = document.createElement('div');
      panel.className = 'mts-h-full';
      panel.style.height = '100%';
      panel.style.minHeight = '0';
      panel.style.display = 'flex';
      panel.style.flexDirection = 'column';

      var host = document.createElement('div');
      host.className = 'mts-surface mts-h-full';
      host.style.display = 'flex';
      host.style.height = '100%';
      host.style.overflow = 'hidden';
      host.style.minHeight = '0';
      panel.appendChild(host);

      var iframe = document.createElement('iframe');
      iframe.className = 'demo-launcher__iframe';
      iframe.src = './examples/calendar-app/index.html';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.display = 'block';
      iframe.style.border = '0';
      iframe.style.borderRadius = '12px';
      host.appendChild(iframe);

      iframe.addEventListener('load', function () {
        if (typeof mtsApplyThemeToFrame === 'function') {
          mtsApplyThemeToFrame(
            iframe,
            document.documentElement.getAttribute('data-mts-mode') || 'dark',
            document.documentElement.getAttribute('data-mts-accent') || ''
          );
        }
      });

      return panel;
    }

    function createCodePanel(language, title) {
      var panel = document.createElement('div');
      panel.className = 'mts-h-full';
      panel.style.display = 'flex';
      panel.style.flexDirection = 'column';
      panel.style.minHeight = '0';

      var host = document.createElement('div');
      host.className = 'mts-h-full';
      host.style.minHeight = '0';
      panel.appendChild(host);

      var block = new MTS.CodeBlock(host, {
        title: title,
        subtitle: D.loading || 'Loading...',
        language: language,
        code: '',
        copyable: true,
        height: '100%'
      });

      return { panel: panel, block: block };
    }

    var previewPanel = createPreviewPanel();
    var htmlPanel = createCodePanel('html', 'calendar-app/index.html');
    var jsPanel = createCodePanel('javascript', 'calendar-app/diagnostics-bootstrap.js');
    var tabsHost = document.getElementById('diagnostics-tabs');
    tabsHost.style.display = 'flex';
    tabsHost.style.flexDirection = 'column';
    tabsHost.style.minHeight = '0';

    new MTS.Tabs('#diagnostics-tabs', {
      variant: 'card',
      height: 'auto',
      lazy: false,
      tabs: [
        { id: 'preview', label: 'Preview', content: previewPanel },
        { id: 'html', label: 'HTML', content: htmlPanel.panel },
        { id: 'javascript', label: 'JavaScript', content: jsPanel.panel }
      ]
    });

    function syncPreviewHeight() {
      var bodyStyles = window.getComputedStyle(document.body);
      var bodyPaddingBottom = parseFloat(bodyStyles.paddingBottom) || 0;
      var top = tabsHost.getBoundingClientRect().top;
      var availableHeight = Math.max(520, Math.floor(window.innerHeight - top - bodyPaddingBottom));
      var nav = tabsHost.querySelector('.mts-tabs__nav');
      var panels = tabsHost.querySelector('.mts-tabs__panels');
      var navHeight = nav ? nav.offsetHeight : 0;
      var panelsHeight = Math.max(420, availableHeight - navHeight);
      var previewPanelEl = tabsHost.querySelector('#mts-panel-preview');
      var previewHost = previewPanel.querySelector('.mts-surface');
      var iframe = previewPanel.querySelector('iframe');

      tabsHost.style.height = availableHeight + 'px';

      if (panels) {
        panels.style.height = panelsHeight + 'px';
        panels.style.minHeight = '0';
      }

      if (previewPanelEl) {
        previewPanelEl.style.height = panelsHeight + 'px';
        previewPanelEl.style.minHeight = '0';
      }

      if (previewHost) {
        previewHost.style.height = panelsHeight + 'px';
        previewHost.style.minHeight = panelsHeight + 'px';
        previewHost.style.maxHeight = panelsHeight + 'px';
      }

      if (iframe) {
        iframe.style.height = panelsHeight + 'px';
        iframe.style.minHeight = panelsHeight + 'px';
        iframe.style.maxHeight = panelsHeight + 'px';
      }
    }

    syncPreviewHeight();
    window.addEventListener('resize', syncPreviewHeight);
    tabsHost.addEventListener('mts:tabs:change', function () {
      window.requestAnimationFrame(syncPreviewHeight);
    });

    htmlPanel.block.setTitle(D.htmlTitle || 'Real usage in calendar-app', D.htmlSubtitle || 'Condensed real HTML');
    htmlPanel.block.setCode(htmlUsageSnippet);

    jsPanel.block.setTitle(D.jsTitle || 'Real integration of diagnostics-bootstrap.js + app.js', D.jsSubtitle || 'Commented JavaScript');
    jsPanel.block.setCode(jsUsageSnippet);
  </script>
</body>
</html>
