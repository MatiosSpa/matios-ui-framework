  <script>
    (function(){
      var sp=location.search||location.hash||'';
      var mm=sp.match(/mts-mode=([a-z-]+)/);
      var ma=sp.match(/mts-accent=([a-z-]+)/);
      if(mm) document.documentElement.setAttribute('data-mts-mode',mm[1]);
      if(ma) document.documentElement.setAttribute('data-mts-accent',ma[1]);
      try{
        var p=window.parent;
        if(p&&p!==window){
          var pm=p.currentModeVal||p.document.documentElement.getAttribute('data-mts-mode');
          var pa=p.currentAccentVal||p.document.documentElement.getAttribute('data-mts-accent');
          if(pm) document.documentElement.setAttribute('data-mts-mode',pm);
          if(pa) document.documentElement.setAttribute('data-mts-accent',pa);
          else   document.documentElement.removeAttribute('data-mts-accent');
        }
      }catch(e){}
    })();
  </script>

<script>
/* ── Helpers estándar de demo ── */
function indentHtml(html){
  var indent=0, step=2;
  var voids=/^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
  var result='';
  (html.match(/<[^>]+>|[^<]+/g)||[]).forEach(function(tok){
    var t=tok.trim(); if(!t) return;
    if(/^<\//.test(t)){ indent=Math.max(0,indent-step); result+=' '.repeat(indent)+t+'\n'; }
    else if(/^<[^!]/.test(t)){
      result+=' '.repeat(indent)+t+'\n';
      var tag=(t.match(/^<([a-z][a-z0-9-]*)/i)||[])[1]||'';
      if(!voids.test(tag) && !/\/>$/.test(t)) indent+=step;
    } else { var text=t.replace(/\s+/g,' '); if(text) result+=' '.repeat(indent)+text+'\n'; }
  });
  return result.trimEnd();
}
function makeSection(id, previewHtml, jsCode, initFn, height){
  new MTS.Tabs('#'+id, { variant:'card', height:height||'420px', lazy:false, tabs:[
    { id:id+'-preview', label:'Preview',    content: previewHtml },
    { id:id+'-html',    label:'HTML',       content: '<div id="'+id+'-cb-html"></div>' },
    { id:id+'-js',      label:'JavaScript', content: '<div id="'+id+'-cb-js"></div>'   },
  ]});
  new MTS.CodeBlock('#'+id+'-cb-html', { code: indentHtml(previewHtml), language: 'html',       copyable: true });
  new MTS.CodeBlock('#'+id+'-cb-js',   { code: jsCode,                  language: 'javascript', copyable: true });
  if (typeof initFn === 'function') initFn();
}

/* ── Helper para simular carga async ── */
function simulateLoad(loader, durationMs) {
  loader.start();
  setTimeout(function() { loader.done(); }, durationMs || 2000);
}

/* ── Locale: muestra inglés por defecto (cara pública); ?lang=es|en|pt para cambiar ── */
(function () {
  var m = (location.search || '').match(/[?&]lang=(es|en|pt)/);
  var lang = m ? m[1] : 'en';
  if (window.MTS) { if (typeof MTS.setLanguage === 'function') MTS.setLanguage(lang); else MTS._locale = lang; }
})();
var D = (window.MTS && MTS.getString && MTS.getString()['MTS.PageLoader'].demo) || {};

document.getElementById('demo-subtitle').textContent = D.subtitle || 'NProgress-style page loading indicator. Fixed bar with automatic trickle, blocker overlay with spinner or progress circle, or both at once.';
document.getElementById('s1-title').textContent      = D.s1Title || '1 — Bar (top)';
document.getElementById('s2-title').textContent      = D.s2Title || '2 — Bar (bottom) and variants';
document.getElementById('s3-title').textContent      = D.s3Title || '3 — Blocker with spinner';
document.getElementById('s4-title').textContent      = D.s4Title || '4 — Blocker with progress circle';
document.getElementById('s5-title').textContent      = D.s5Title || '5 — Both mode (bar + blocker)';
document.getElementById('s6-title').textContent      = D.s6Title || '6 — Error';

/* ══════════════════════════════════════════════════════════════
   1 — Barra (top)
══════════════════════════════════════════════════════════════ */
var preview1 =
  '<div class="demo-stack" style="max-width:340px;">' +
    '<div id="s1-btn"></div>' +
  '</div>';

var js1 =
  "const loader = new MTS.PageLoader({\n" +
  "  mode:     'bar',\n" +
  "  position: 'top',\n" +
  "  variant:  'primary',\n" +
  "});\n\n" +
  "loader.start();\n\n" +
  "fetch('/api/data')\n" +
  "  .then(function() { loader.done(); })\n" +
  "  .catch(function() { loader.error(); });";

makeSection('tabs-s1', preview1, js1, function() {
  var loader = new MTS.PageLoader({ mode: 'bar', position: 'top', variant: 'primary' });
  new MTS.Button('#s1-btn', {
    label: D.btnTop || 'Simulate load (top)',
    variant: 'primary',
    onClick: function() { simulateLoad(loader, 2500); },
  });
}, '200px');

/* ══════════════════════════════════════════════════════════════
   2 — Barra (bottom) y variantes
══════════════════════════════════════════════════════════════ */
var preview2 =
  '<div class="demo-stack" style="max-width:460px;">' +
    '<div id="s2-row"></div>' +
  '</div>';

var js2 =
  "const loaderBottom = new MTS.PageLoader({\n" +
  "  mode:     'bar',\n" +
  "  position: 'bottom',\n" +
  "  variant:  'success',\n" +
  "  trickleSpeed: 600,\n" +
  "});\n\n" +
  "loaderBottom.start();\n" +
  "setTimeout(function() { loaderBottom.done(); }, 2000);";

makeSection('tabs-s2', preview2, js2, function() {
  var variants = ['primary', 'success', 'warning', 'danger'];
  var row = document.querySelector('#s2-row');
  row.style.display = 'flex';
  row.style.gap = '8px';
  row.style.flexWrap = 'wrap';
  variants.forEach(function(v) {
    var wrap = document.createElement('div');
    row.appendChild(wrap);
    var loader = new MTS.PageLoader({ mode: 'bar', position: 'bottom', variant: v, trickleSpeed: 600 });
    new MTS.Button(wrap, {
      label: v,
      variant: v,
      size: 'sm',
      onClick: function() { simulateLoad(loader, 2000); },
    });
  });
}, '200px');

/* ══════════════════════════════════════════════════════════════
   3 — Blocker con spinner
══════════════════════════════════════════════════════════════ */
var preview3 =
  '<div class="demo-stack" style="max-width:340px;">' +
    '<div id="s3-btn"></div>' +
  '</div>';

var js3 =
  "const loader = new MTS.PageLoader({\n" +
  "  mode:            'blocker',\n" +
  "  backdropOpacity: 0.85,\n" +
  "  loader: {\n" +
  "    variant: 'ring',\n" +
  "    size:    'lg',\n" +
  "  },\n" +
  "});\n\n" +
  "loader.start();\n" +
  "setTimeout(function() { loader.done(); }, 2000);";

makeSection('tabs-s3', preview3, js3, function() {
  var loader = new MTS.PageLoader({
    mode: 'blocker',
    backdropOpacity: 0.85,
    loader: { variant: 'ring', size: 'lg' },
  });
  new MTS.Button('#s3-btn', {
    label: D.btnSpinner || 'Simulate blocker (spinner)',
    variant: 'primary',
    onClick: function() { simulateLoad(loader, 2000); },
  });
}, '200px');

/* ══════════════════════════════════════════════════════════════
   4 — Blocker con progress circle
══════════════════════════════════════════════════════════════ */
var preview4 =
  '<div class="demo-stack" style="max-width:340px;">' +
    '<div id="s4-btn"></div>' +
  '</div>';

var js4 =
  "const loader = new MTS.PageLoader({\n" +
  "  mode:            'blocker',\n" +
  "  backdropOpacity: 0.9,\n" +
  "  blur:            true,\n" +
  "  loader: {\n" +
  "    type:    'circle',\n" +
  "    size:    'lg',\n" +
  "    variant: 'primary',\n" +
  "  },\n" +
  "});\n\n" +
  "loader.start();\n" +
  "setTimeout(function() { loader.done(); }, 2500);";

makeSection('tabs-s4', preview4, js4, function() {
  var loader = new MTS.PageLoader({
    mode: 'blocker',
    backdropOpacity: 0.9,
    blur: true,
    loader: { type: 'circle', size: 'lg', variant: 'primary' },
  });
  new MTS.Button('#s4-btn', {
    label: D.btnCircle || 'Simulate blocker (progress circle)',
    variant: 'primary',
    onClick: function() { simulateLoad(loader, 2500); },
  });
}, '200px');

/* ══════════════════════════════════════════════════════════════
   5 — Modo both (barra + blocker)
══════════════════════════════════════════════════════════════ */
var preview5 =
  '<div class="demo-stack" style="max-width:340px;">' +
    '<div id="s5-btn"></div>' +
  '</div>';

var js5 =
  "const loader = new MTS.PageLoader({\n" +
  "  mode:            'both',\n" +
  "  position:        'top',\n" +
  "  variant:         'primary',\n" +
  "  backdropOpacity: 0.7,\n" +
  "});\n\n" +
  "loader.start();\n" +
  "setTimeout(function() { loader.done(); }, 2000);";

makeSection('tabs-s5', preview5, js5, function() {
  var loader = new MTS.PageLoader({
    mode: 'both',
    position: 'top',
    variant: 'primary',
    backdropOpacity: 0.7,
  });
  new MTS.Button('#s5-btn', {
    label: D.btnBoth || 'Simulate bar + blocker',
    variant: 'primary',
    onClick: function() { simulateLoad(loader, 2000); },
  });
}, '200px');

/* ══════════════════════════════════════════════════════════════
   6 — Error
══════════════════════════════════════════════════════════════ */
var preview6 =
  '<div class="demo-stack" style="max-width:460px;">' +
    '<div id="s6-row"></div>' +
  '</div>';

var js6 =
  "const loader = new MTS.PageLoader({ mode: 'bar', variant: 'primary' });\n\n" +
  "loader.start();\n\n" +
  "fetch('/api/data')\n" +
  "  .then(function(res) {\n" +
  "    if (!res.ok) throw new Error('Error del servidor');\n" +
  "    loader.done();\n" +
  "  })\n" +
  "  .catch(function() {\n" +
  "    loader.error();\n" +
  "  });";

makeSection('tabs-s6', preview6, js6, function() {
  var loader = new MTS.PageLoader({ mode: 'bar', variant: 'primary' });
  var row = document.querySelector('#s6-row');
  row.style.display = 'flex';
  row.style.gap = '8px';

  var wrapDone = document.createElement('div');
  var wrapErr  = document.createElement('div');
  row.appendChild(wrapDone);
  row.appendChild(wrapErr);

  new MTS.Button(wrapDone, {
    label: D.btnDone || 'Simulate done()',
    variant: 'primary',
    onClick: function() {
      loader.start();
      setTimeout(function() { loader.done(); }, 1800);
    },
  });
  new MTS.Button(wrapErr, {
    label: D.btnError || 'Simulate error()',
    variant: 'danger',
    onClick: function() {
      loader.start();
      setTimeout(function() { loader.error(); }, 1800);
    },
  });
}, '200px');
</script>
