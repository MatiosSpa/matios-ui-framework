  <script>
    (function(){
      var sp = location.search || location.hash || '';
      var mm = sp.match(/mts-mode=([a-z-]+)/);
      var ma = sp.match(/mts-accent=([a-z-]+)/);
      if (mm) document.documentElement.setAttribute('data-mts-mode', mm[1]);
      if (ma) document.documentElement.setAttribute('data-mts-accent', ma[1]);
      try {
        var p = window.parent;
        if (p && p !== window) {
          var pm = p.currentModeVal || p.document.documentElement.getAttribute('data-mts-mode');
          var pa = p.currentAccentVal || p.document.documentElement.getAttribute('data-mts-accent');
          if (pm) document.documentElement.setAttribute('data-mts-mode', pm);
          if (pa) document.documentElement.setAttribute('data-mts-accent', pa);
          else    document.documentElement.removeAttribute('data-mts-accent');
        }
      } catch (e) {}
    })();
  </script>

<body>
  <div class="demo-page demo-page--launcher">
    <div class="demo-header">
      <h1>MTS <span>Utilities</span></h1>
      <p>Cross-cutting utilities — browser · codeblock · devpanel · diagnosticspanel · httpclient · jsonviewer · pageloader · sessiontimeout</p>
    </div>

    <div id="utilities-launcher" class="demo-launcher"></div>
  </div>

  <script>
    initGroupLauncher('#utilities-launcher', [
      { id: 'browser',           component: 'browser',           title: 'MTS.Browser',           subtitle: 'Embedded web browser with history and controls',                            src: 'matios-ui-browser/demo.html'           },
      { id: 'codeblock',         component: 'codeblock',         title: 'MTS.CodeBlock',         subtitle: 'Code block with highlighting, line numbers and copy',                       src: 'matios-ui-codeblock/demo.html'         },
      { id: 'devpanel',          component: 'devpanel',          title: 'MTS.DevPanel',          subtitle: 'Floating development panel for runtime debugging',                          src: 'matios-ui-devpanel/demo.html'          },
      { id: 'diagnosticspanel',  component: 'diagnosticspanel',  title: 'MTS.DiagnosticsPanel',  subtitle: 'System and environment diagnostics panel',                                  src: 'matios-ui-diagnosticspanel/demo.html'  },
      { id: 'httpclient',        component: 'httpclient',        title: 'MTS.HttpClient',        subtitle: 'Visual HTTP client — request builder, headers and response',                src: 'matios-ui-httpclient/demo.html'        },
      { id: 'jsonviewer',        component: 'jsonviewer',        title: 'MTS.JsonViewer',        subtitle: 'JSON viewer with collapsible nodes and search',                             src: 'matios-ui-jsonviewer/demo.html'        },
      { id: 'pageloader',        component: 'pageloader',        title: 'MTS.PageLoader',        subtitle: 'Page loading bar with trickle, blocker and spinner',                        src: 'matios-ui-pageloader/demo.html'        },
      { id: 'sessiontimeout',    component: 'sessiontimeout',    title: 'MTS.SessionTimeout',    subtitle: 'Session timeout — fixed bar + warning modal with countdown',                src: 'matios-ui-sessiontimeout/demo.html'    },
    ]);
